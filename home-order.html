<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>老爹．涼糕｜送到府訂購</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff4f8;color:#33251d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 48px}.top,.card{background:#fff;border:1px solid #ead8df;border-radius:22px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #5b3d2510}.brand{font-size:25px;font-weight:900}.muted{color:#786d65;font-size:15px;line-height:1.6}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #d9cec6;border-radius:13px;background:#fff;font:inherit}.flavor{display:grid;grid-template-columns:92px 1fr auto;gap:13px;align-items:center;border:1px solid #e8ded6;border-radius:15px;padding:10px;margin:9px 0;background:#fff}.flavor-img{width:92px;height:92px;border-radius:12px;object-fit:cover;background:#f3ece6;border:1px solid #eadfd7}.flavor b{display:block;font-size:17px}.price{display:block;font-size:14px;color:#9b3262;font-weight:800;margin-top:4px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:36px;height:36px;border:0;border-radius:10px;background:#f4dce8;color:#4a392f;font-size:21px;font-weight:900}.qty span{min-width:28px;text-align:center;font-weight:900}.summary{background:#fffaf4;border:1px solid #eadbcd;border-radius:15px;padding:14px}.sumrow{display:flex;justify-content:space-between;padding:5px 0}.total{font-size:24px;font-weight:900;color:#9b3262;border-top:1px solid #e6d7c9;margin-top:8px;padding-top:10px}.btn{width:100%;border:0;border-radius:14px;padding:14px;background:#c85b88;color:#fff;font-size:17px;font-weight:900;cursor:pointer}.linebtn{display:block;text-align:center;text-decoration:none;background:#06c755;color:#fff;border-radius:14px;padding:15px;font-size:17px;font-weight:900;margin-top:14px}.notice{margin-top:10px;padding:12px;border-radius:12px}.err{background:#fff0ef;color:#a43b35}.result{display:none}.result.show{display:block}.order-number{font-size:28px;font-weight:900;color:#9b3262}.req{color:#a33c35}.back{display:block;text-decoration:none;color:#9b3262;font-weight:900;margin-bottom:12px}.linebox{background:#f1fff5;border:1px solid #bce9ca;border-radius:15px;padding:14px;margin-top:14px}.linebox b{display:block;margin-bottom:6px}@media(max-width:560px){.flavor{grid-template-columns:78px 1fr}.flavor-img{width:78px;height:78px}.flavor .qty{grid-column:2;justify-content:flex-end}}
</style>
</head>
<body><div class="wrap">
<a class="back" href="online-order.html">← 返回訂購方式</a>
<div class="top"><div class="brand">🏠 老爹．涼糕｜送到府訂購</div><div class="muted">完成網站下單後會產生訂單編號，再點「前往官方 LINE」，訂單內容會自動帶入 LINE，最後由客人自己按「送出」。</div><div class="muted" style="margin-top:8px;font-weight:800">🏠 送到府｜貨到付款</div></div>
<div id="closed" class="card" style="display:none"></div>
<form id="orderForm">
<div class="card"><h2>① 選擇配送日期</h2><div class="field"><label>日期 <span class="req">*</span></label><select id="orderDate" required><option value="">請選擇開放日期</option></select></div></div>
<div class="card"><h2>② 選擇送到府地區</h2><div class="field"><label>地區 <span class="req">*</span></label><select id="region" required><option value="">請先選擇日期</option></select></div></div>
<div class="card"><h2>③ 點選口味與數量</h2><div id="flavors"></div><div id="flavorEmpty" class="muted" style="display:none">此日期尚未開放口味。</div></div>
<div class="card"><h2>④ 填寫送到府資料</h2><div class="field"><label>收件人姓名 <span class="req">*</span></label><input id="customerName" required maxlength="80"></div><div class="field"><label>手機 <span class="req">*</span></label><input id="customerPhone" required maxlength="30" inputmode="tel"></div><div class="field"><label>完整收件地址 <span class="req">*</span></label><textarea id="address" rows="3" required placeholder="請填寫完整收件地址"></textarea></div><div class="field"><label>備註</label><textarea id="notes" rows="3" maxlength="500" placeholder="其他需要告知我們的事項"></textarea></div></div>
<div class="card"><h2>⑤ 訂單金額</h2><div class="summary"><div class="sumrow"><span>涼糕總數</span><b id="totalQty">0 盒</b></div><div class="sumrow"><span>涼糕小計</span><b>NT$ <span id="productTotal">0</span></b></div><div class="sumrow total"><span>應付總額</span><span>NT$ <span id="grandTotal">0</span></span></div></div><button class="btn" id="submitBtn" type="submit" style="margin-top:14px">送出送到府訂單</button><div id="msg"></div></div>
</form>
<div id="result" class="card result"><h2>✅ 訂單已建立</h2><p>請記下以下訂單編號，再點擊官方 LINE。LINE 會自動帶入本筆訂單內容，請你最後自己按「送出」。</p><div id="resultOrder" class="order-number"></div><div id="resultDetail" class="muted" style="margin-top:10px"></div><div class="linebox"><b>📱 下一步</b><span>點擊下方按鈕開啟官方 LINE，確認訊息後由你自己按「送出」。</span><a id="lineBtn" class="linebtn" href="#">前往官方 LINE</a></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');
const $=id=>document.getElementById(id);let flavors=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});
function closed(t){$('closed').style.display='block';$('closed').textContent=t;$('orderForm').style.display='none'}
function items(){return flavors.map((f,i)=>({flavor_id:Number(f.flavor_id),flavor_name:f.flavor_name,product_name:f.product_name||'涼糕',unit_price:Number(f.price||0),quantity:Number($('q'+i)?.textContent||0)})).filter(x=>x.quantity>0)}
function totals(){const a=items(),q=a.reduce((s,x)=>s+x.quantity,0),p=a.reduce((s,x)=>s+x.unit_price*x.quantity,0);$('totalQty').textContent=q+' 盒';$('productTotal').textContent=p.toLocaleString();$('grandTotal').textContent=p.toLocaleString()}
function render(){$('flavors').innerHTML=flavors.map((f,i)=>'<div class="flavor">'+(f.image_url?'<img class="flavor-img" src="'+esc(f.image_url)+'" alt="'+esc(f.flavor_name)+'">':'<div class="flavor-img"></div>')+'<div><b>'+esc(f.product_name||'涼糕')+'／'+esc(f.flavor_name)+'</b><span class="price">NT$ '+Number(f.price||0).toLocaleString()+'</span></div><div class="qty"><button type="button" onclick="chg('+i+',-1)">−</button><span id="q'+i+'">0</span><button type="button" onclick="chg('+i+',1)">＋</button></div></div>').join('');$('flavorEmpty').style.display=flavors.length?'none':'block'}
function chg(i,n){$('q'+i).textContent=Math.max(0,Math.min(99,Number($('q'+i).textContent||0)+n));totals()}
async function loadDate(){const d=$('orderDate').value;if(!d)return;const [rs,fs,m]=await Promise.all([sb.from('daily_order_regions').select('region_name').eq('order_date',d).eq('enabled',true).order('id'),sb.from('daily_order_flavors').select('id,flavor_id,product_name,flavor_name,price').eq('order_date',d).eq('enabled',true).order('id'),sb.from('flavors').select('id,image_url').eq('enabled',true)]);if(rs.error||fs.error)return closed('日期資料讀取失敗，請重新整理。');$('region').innerHTML='<option value="">請選擇送到府地區</option>'+(rs.data||[]).map(r=>'<option>'+esc(r.region_name)+'</option>').join('');const im=Object.fromEntries((m.data||[]).map(x=>[Number(x.id),x.image_url]));flavors=(fs.data||[]).map(f=>({...f,image_url:im[Number(f.flavor_id)]||''}));render();totals()}
async function init(){const {data,error}=await sb.from('daily_order_settings').select('order_date,ordering_enabled').eq('ordering_enabled',true).gte('order_date',today()).order('order_date').limit(60);if(error)return closed('開放日期讀取失敗，請稍後再試。');if(!data?.length)return closed('目前沒有開放的送到府訂購日期。');$('orderDate').innerHTML='<option value="">請選擇開放日期</option>'+data.map(x=>'<option value="'+x.order_date+'">'+x.order_date+'</option>').join('');$('orderDate').value=data[0].order_date;loadDate()}
$('orderDate').addEventListener('change',loadDate);
$('orderForm').addEventListener('submit',async e=>{e.preventDefault();$('submitBtn').disabled=true;$('msg').innerHTML='';try{const date=$('orderDate').value,region=$('region').value,a=items();if(!date)throw new Error('請選擇配送日期。');if(!region)throw new Error('請選擇送到府地區。');if(!a.length)throw new Error('請至少選擇 1 盒涼糕。');const name=$('customerName').value.trim(),phone=$('customerPhone').value.trim(),address=$('address').value.trim(),notes=$('notes').value.trim();const r=await sb.rpc('create_customer_order',{p_delivery_date:date,p_delivery_region:region,p_pickup_type:'home_delivery',p_pickup_store:address,p_customer_name:name,p_customer_phone:phone,p_customer_note:notes||null,p_items:a.map(x=>({flavor_id:x.flavor_id,quantity:x.quantity}))});if(r.error)throw r.error;const result=Array.isArray(r.data)?r.data[0]:r.data;const orderNo=result?.order_number||'';const total=Number(result?.total_amount||a.reduce((s,x)=>s+x.unit_price*x.quantity,0));$('resultOrder').textContent='訂單編號：'+orderNo;$('resultDetail').innerHTML='應付總額：<b>NT$ '+total.toLocaleString()+'</b><br>配送日期：'+esc(date)+'<br>送到府地區：'+esc(region)+'<br>收件人：'+esc(name)+'<br>電話：'+esc(phone)+'<br>地址：'+esc(address);const lines=['老爹．涼糕','送到府訂單','訂單編號：'+orderNo,'配送日期：'+date,'送到府地區：'+region,'','訂購口味：',...a.map(x=>x.flavor_name+' × '+x.quantity+' 盒'),'','應付總額：NT$ '+total.toLocaleString(),'','收件人：'+name,'電話：'+phone,'地址：'+address];if(notes)lines.push('備註：'+notes);const text=lines.join('\n');$('lineBtn').href='line://msg/text/'+encodeURIComponent(text);$('orderForm').style.display='none';$('result').classList.add('show');window.scrollTo({top:0,behavior:'smooth'})}catch(err){$('msg').innerHTML='<div class="notice err">'+esc(err?.message||'訂單送出失敗，請稍後再試。')+'</div>';$('submitBtn').disabled=false}});
init();
</script></body></html>
