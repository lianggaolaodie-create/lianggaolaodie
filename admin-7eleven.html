<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜7-ELEVEN 冷藏寄放</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px 14px 60px}.card,.slip{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0000000a}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 14px;background:#9b5c38;color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#eee;color:#333}.hidden{display:none}.small{font-size:13px;color:#75685f}.msg{padding:12px;border-radius:10px;background:#f6eee7;margin-top:10px}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}.order{border:1px solid #eadfd4;border-radius:13px;padding:12px;margin:9px 0}.order-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.slip{max-width:520px;margin:24px auto;border:2px solid #222;border-radius:4px;box-shadow:none}.slip h2{text-align:center;margin:0 0 8px}.line{display:flex;justify-content:space-between;border-bottom:1px dashed #aaa;padding:7px 0;gap:12px}.items{border-top:1px solid #222;border-bottom:1px solid #222;margin:10px 0}.total{font-size:20px;font-weight:900;text-align:right;padding-top:10px}.barcode{text-align:center;margin:14px 0}.barcode svg{max-width:100%;height:70px}.notice{background:#fff7df;padding:10px;border-radius:10px;font-size:13px}.cold{display:inline-block;background:#eaf5ff;border:1px solid #cfe7fb;border-radius:999px;padding:5px 10px;font-weight:800;color:#245b82}.official{border:1px solid #d9c4ad;border-radius:12px;padding:12px;margin:12px 0;background:#fffaf4}.official input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d9cdc1;border-radius:10px;margin-top:7px}.official-code{font-weight:900;font-size:18px;letter-spacing:1px}@media print{body{background:#fff}.no-print{display:none!important}.wrap{padding:0}.slip{margin:0 auto;border:2px solid #000;box-shadow:none;page-break-inside:avoid}}</style></head><body><div class="wrap"><div class="card no-print"><h1>🧊 7-ELEVEN 冷藏寄放</h1><div class="cold">原店取件・冷藏專用後台</div><div id="who" class="small" style="margin-top:8px">尚未登入</div><div class="actions" style="margin-top:12px"><button class="btn" id="loginBtn">登入</button><button class="btn secondary" id="refreshBtn">重新整理</button><button class="btn secondary" id="logoutBtn">登出</button></div><div id="msg"></div></div><div id="login" class="card no-print"><div class="notice">請使用既有老爹涼糕後台管理員帳號登入。此頁只處理 7-ELEVEN 冷藏寄放訂單。</div><p><input id="email" type="email" placeholder="Email" style="width:100%;padding:11px;box-sizing:border-box;margin:8px 0;border:1px solid #d9cdc1;border-radius:10px"><input id="password" type="password" placeholder="密碼" style="width:100%;padding:11px;box-sizing:border-box;margin:8px 0;border:1px solid #d9cdc1;border-radius:10px"></p><button class="btn" onclick="doLogin()">登入後台</button></div><div id="orders" class="card no-print hidden"><h2>📋 7-ELEVEN 冷藏寄放訂單</h2><div class="small">只列出取貨方式為 7-ELEVEN 的訂單。</div><div id="ordersBox">讀取中…</div></div><div id="slipArea"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script>(function(){const sb=window.supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>'$'+Number(n||0).toLocaleString('zh-TW');let role='';let privateRows=[];function setMsg(t,c='msg'){const e=$('msg');e.innerHTML='<div class="'+c+'">'+esc(t)+'</div>'}async function current(){const{data}=await sb.auth.getUser();if(!data.user){$('login').classList.remove('hidden');$('orders').classList.add('hidden');return}$('login').classList.add('hidden');$('who').textContent=data.user.email||'';const{data:p}=await sb.from('admin_profiles').select('role,enabled').eq('user_id',data.user.id).maybeSingle();if(!p||!p.enabled){setMsg('此帳號不是啟用中的管理員。','msg error');return}role=p.role;$('orders').classList.remove('hidden');await load()}window.doLogin=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return setMsg('請輸入 Email 與密碼','msg error');const{error}=await sb.auth.signInWithPassword({email,password});if(error)return setMsg('登入失敗：'+error.message,'msg error');setMsg('登入成功','msg ok');await current()};$('loginBtn').onclick=doLogin;$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refreshBtn').onclick=load;async function load(){const{data,error}=await sb.from('orders').select('id,order_number,delivery_date,delivery_region,pickup_type,product_total,pickup_fee,total_amount,status,payment_status,transfer_last5,created_at').eq('pickup_type','seven_eleven').order('created_at',{ascending:false}).limit(100);if(error)return setMsg(error.message,'msg error');privateRows=[];if(role==='personal_data_admin'||role==='super_admin'){const r=await sb.rpc('personal_data_admin_orders');if(!r.error)privateRows=r.data||[]}if(!data?.length){$('ordersBox').innerHTML='<div class="small">目前沒有 7-ELEVEN 冷藏寄放訂單。</div>';return}const rows=await Promise.all(data.map(async o=>{const{data:items}=await sb.from('order_items').select('flavor_name,unit_price,quantity,subtotal').eq('order_id',o.id).order('id');const p=privateRows.find(x=>x.order_id===o.id);return{o,items:items||[],p}}));$('ordersBox').innerHTML=rows.map(({o,items,p})=>'<div class="order"><div class="order-head"><div><strong>'+esc(o.order_number)+'</strong><div class="small">'+esc(o.delivery_date)+' · '+esc(o.status)+'</div></div><button class="btn" onclick="showSlip(\''+o.id+'\')">產生冷藏小白單</button></div><div style="margin-top:8px"><strong>商品：</strong>'+esc(items.map(i=>(i.flavor_name||'商品')+' × '+i.quantity).join('、')||'—')+'</div><div><strong>總額：</strong>'+money(o.total_amount)+'</div>'+(p?'<div><strong>門市：</strong>'+esc(p.pickup_store||'')+'　<strong>姓名：</strong>'+esc(p.customer_name||'')+'</div>':'<div class="small">完整姓名／電話／門市需個資管理權限</div>')+'</div>').join('');window._rows=rows}function codeKey(id){return 'sevenElevenOfficialCode_'+id}function savedCode(id){return localStorage.getItem(codeKey(id))||''}function renderCode(code){if(!code){$('officialBarcode').innerHTML='';return}try{JsBarcode('#officialBarcode',code,{format:'CODE128',displayValue:true,fontSize:14,height:55,margin:0});}catch(e){setMsg('官方條碼無法顯示，請確認官方服務碼是否完整。','msg error')}}window.saveOfficialCode=()=>{const id=$('officialOrderId').value,code=$('officialCode').value.trim();if(!code)return setMsg('請輸入 7-ELEVEN 官方寄件／服務代碼。','msg error');localStorage.setItem(codeKey(id),code);$('officialCodeText').textContent=code;renderCode(code);setMsg('官方服務碼已儲存於此裝置。','msg ok')};window.showSlip=async id=>{const r=(window._rows||[]).find(x=>x.o.id===id);if(!r)return;const{o,items,p}=r,customer=p||{},code=savedCode(id);$('slipArea').innerHTML='<div class="slip"><h2>老爹・涼糕</h2><div style="text-align:center;font-weight:800">7-ELEVEN 原店取件－冷藏</div><div style="text-align:center;margin-top:6px"><span class="cold">🧊 冷藏寄放</span></div><div class="official no-print"><strong>7-ELEVEN 官方寄件／服務代碼</strong><input id="officialOrderId" type="hidden" value="'+esc(o.id)+'"><input id="officialCode" value="'+esc(code)+'" placeholder="請貼上7-ELEVEN官方系統取得的服務碼"><div class="actions" style="margin-top:8px"><button class="btn" onclick="saveOfficialCode()">儲存官方代碼</button><a class="btn secondary" href="https://myship2.7-11.com.tw/ATA/Page01Frozen" target="_blank" rel="noopener">開啟7-ELEVEN官方頁面</a></div><div class="small" style="margin-top:8px">官方服務碼須由7-ELEVEN正式系統取得，本頁只負責帶入、顯示及列印，不自行產生官方服務碼。</div></div><div class="barcode"><svg id="officialBarcode"></svg></div><div class="line"><strong>官方服務碼</strong><span id="officialCodeText" class="official-code">'+esc(code||'尚未輸入')+'</span></div><div class="line"><strong>訂單編號</strong><span>'+esc(o.order_number)+'</span></div><div class="line"><strong>姓名</strong><span>'+esc(customer.customer_name||'—')+'</span></div><div class="line"><strong>電話</strong><span>'+esc(customer.customer_phone||'—')+'</span></div><div class="line"><strong>7-ELEVEN 門市</strong><span>'+esc(customer.pickup_store||'—')+'</span></div><div class="line"><strong>配送日期</strong><span>'+esc(o.delivery_date)+'</span></div><div class="items">'+items.map(i=>'<div class="line"><span>'+esc(i.flavor_name)+' × '+i.quantity+'</span><span>'+money(i.subtotal)+'</span></div>').join('')+'</div><div class="line"><span>商品金額</span><span>'+money(o.product_total)+'</span></div><div class="line"><span>冷藏寄放費</span><span>'+money(o.pickup_fee)+'</span></div><div class="total">合計 '+money(o.total_amount)+'</div><div class="notice" style="margin-top:12px;text-align:center">7-ELEVEN 官方原店取件冷藏服務目前規範冷藏／冷凍每筆45元；實際服務規則與費用以7-ELEVEN官方公告為準。</div><div class="actions no-print" style="margin-top:14px;justify-content:center"><button class="btn" onclick="window.print()">🖨️ 列印冷藏小白單</button></div></div>';if(code)renderCode(code);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};current()})();</script></body></html>
