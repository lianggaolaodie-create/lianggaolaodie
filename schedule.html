<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){
'use strict';
const SUPABASE_URL='https://yemzdwxtyosuaczsqwea.supabase.co';
const SUPABASE_KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});
function maps(region){return region?'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(region):''}
function mapEmbed(region){return region?'https://maps.google.com/maps?q='+encodeURIComponent(region)+'&output=embed':''}
function cityOf(region){const m=String(region||'').match(/(臺北市|台北市|新北市|桃園市|臺中市|台中市|臺南市|台南市|高雄市|基隆市|新竹市|嘉義市|新竹縣|苗栗縣|彰化縣|南投縣|雲林縣|嘉義縣|屏東縣|宜蘭縣|花蓮縣|臺東縣|台東縣|澎湖縣|金門縣|連江縣)/);return m?m[0].replace(/臺/g,'台'):'其他地區'}
function formatTime(v){return v?String(v).slice(0,5):''}
let allRows=[],allLinks=[],allFlavors=[],activeCity='all';
function renderFilters(rows){
 const cities=[...new Set(rows.map(s=>cityOf(s.region)))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
 $('cityFilters').innerHTML='<button type="button" class="city-filter '+(activeCity==='all'?'active':'')+'" data-city="all">全部地區</button>'+cities.map(c=>'<button type="button" class="city-filter '+(activeCity===c?'active':'')+'" data-city="'+esc(c)+'">'+esc(c)+'</button>').join('');
 $('cityFilters').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{activeCity=b.dataset.city;renderFilters(allRows);renderCards()}));
}
function renderCards(){
 const bySchedule={};allLinks.forEach(x=>{(bySchedule[x.schedule_id]||(bySchedule[x.schedule_id]=[])).push(x)});
 const rows=activeCity==='all'?allRows:allRows.filter(s=>cityOf(s.region)===activeCity);
 const html=rows.map(s=>{
  const links=bySchedule[s.id]||[],title=s.title||(s.schedule_type==='food_truck'?'涼糕餐車':'擺攤'),isTruck=s.schedule_type==='food_truck';
  const time=[formatTime(s.start_time),formatTime(s.end_time)].filter(Boolean).join(' - ');
  const items=links.map(x=>{const f=allFlavors.find(z=>z.id===x.flavor_id);return f?{name:f.name,price:x.price_per_box??x.price??x.unit_price??f.price}:null}).filter(Boolean);
  const flavorBlock=(isTruck?'<div class="flavor-title">🍡 當日販售口味與價格</div>':'<div class="flavor-title">🍡 當日販售口味</div>')+(items.length?(isTruck?'<div class="flavor-list">':'<div class="stall-flavors">')+items.map(x=>isTruck?'<div class="flavor-item"><span class="flavor-name">'+esc(x.name)+'</span><span class="price">'+(x.price!==null&&x.price!==undefined?'$'+esc(x.price):'價格待公布')+'</span></div>':'<div class="stall-flavor">'+esc(x.name)+'</div>').join('')+'</div>':'<div class="empty-flavor">'+(isTruck?'當日口味與價格將依後台設定更新。':'當日口味將依後台設定更新。')+'</div>');
  const mapUrl=!isTruck?maps(s.region):'',embed=!isTruck?mapEmbed(s.region):'';
  return '<article class="card"><div class="topline"><h2>🚚 '+esc(title)+'</h2><span class="tag">'+(isTruck?'餐車':'擺攤')+'</span></div><div class="date">📅 '+esc(s.schedule_date||'日期待公布')+'</div><div class="basic">'+(s.region?'<div class="basic-row"><span class="icon">📍</span><span>'+esc(s.region)+'</span></div>':'<div class="basic-row"><span class="icon">📍</span><span>尚未設定地點</span></div>')+(time?'<div class="basic-row"><span class="icon">🕐</span><span>'+esc(time)+'</span></div>':'<div class="basic-row"><span class="icon">🕐</span><span>時間待公布</span></div>')+'</div>'+flavorBlock+(embed?'<iframe class="map-frame" title="'+esc(title)+'地圖" src="'+embed+'" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>':'')+'<div class="card-actions">'+(mapUrl?'<a class="action-link action-map" href="'+mapUrl+'" target="_blank" rel="noopener">🧭 Google 地圖導航</a>':'')+(isTruck?'<a class="action-link action-order" href="online-order.html">🛒 前往線上預訂</a>':'')+'</div><span class="status">'+(isTruck?'開放查看與預訂':'已公布出攤行程')+'</span></article>';
 }).join('');
 $('scheduleList').innerHTML=html||(activeCity==='all'?'<div class="notice">目前沒有已公布的出攤行程。</div>':'<div class="notice">這個縣市目前沒有已公布的行程。</div>');
}
try{
 if(!window.supabase)throw new Error('網站資料元件載入失敗');
 const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const result=await sb.from('food_truck_schedules').select('id,schedule_date,schedule_type,title,region,start_time,end_time,enabled').eq('enabled',true).gte('schedule_date',today).order('schedule_date',{ascending:true});
 if(result.error)throw result.error;
 allRows=result.data||[];
 if(allRows.length){
  const ids=allRows.map(x=>x.id);
  const lr=await sb.from('food_truck_schedule_flavors').select('schedule_id,flavor_id,price_per_box,price,unit_price').in('schedule_id',ids);
  if(lr.error)throw lr.error;allLinks=lr.data||[];
  const fr=await sb.from('flavors').select('id,name,price,enabled').order('id');
  if(fr.error)throw fr.error;allFlavors=(fr.data||[]).filter(f=>f.enabled!==false);
 }
 renderFilters(allRows);renderCards();
}catch(error){console.error('餐車行程載入失敗：',error);$('scheduleList').innerHTML='<div class="notice">目前無法連線到最新出攤資料，請稍後重新整理。</div>'}
})();
</script>
