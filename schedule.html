<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async function(){'use strict';
const SUPABASE_URL='https://yemzdwxtyosuaczsqwea.supabase.co',SUPABASE_KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});
function setStatus(t,ok){$('status').innerHTML=esc(t);if(ok){$('status').style.background='#edf8f1';$('status').style.borderColor='#cde8d7';$('status').style.color='#286d46'}}
function maps(region){return region?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(region):''}
function formatTime(s){return s?s.slice(0,5):''}
function render(rows,links,flavors){
 const by={};links.forEach(x=>(by[x.schedule_id]??=[]).push(x));
 const html=rows.map(s=>{
  const arr=by[s.id]||[];
  const title=s.title||(s.schedule_type==='food_truck'?'涼糕餐車':'擺攤');
  const tag=s.schedule_type==='food_truck'?'餐車':'擺攤';
  const time=[formatTime(s.start_time),formatTime(s.end_time)].filter(Boolean).join(' - ');
  const items=arr.map(x=>{const f=flavors.find(z=>z.id===x.flavor_id);if(!f)return null;return {name:f.name,price:s.schedule_type==='food_truck'?(x.price_per_box??f.price):null}}).filter(Boolean);
  const flavorBlock=s.schedule_type==='food_truck'
   ? '<div class="flavor-title">🍡 當日販售口味</div><div class="flavor-list">'+(items.length?items.map(x=>'<div class="flavor-item"><span class="flavor-name">'+esc(x.name)+'</span><span class="price">$'+esc(x.price??0)+'</span></div>').join(''):'<div class="empty-flavor">依後台設定</div>')+'</div>'
   : '<div class="flavor-title">🍡 當日販售口味</div><div class="stall-flavors">'+(items.length?items.map(x=>'<span class="stall-flavor">'+esc(x.name)+'</span>').join(''):'<span class="empty-flavor">依後台設定</span>')+'</div>';
  return '<article class="card"><div class="topline"><h2>🚚 '+esc(title)+'</h2><span class="tag">'+tag+'</span></div><div class="date">📅 '+esc(s.schedule_date)+'</div><div class="basic">'+(s.region?'<div class="basic-row"><span class="icon">📍</span><a href="'+maps(s.region)+'" target="_blank" rel="noopener">'+esc(s.region)+'</a></div>':'<div class="basic-row"><span class="icon">📍</span><span>未設定地區</span></div>')+(time?'<div class="basic-row"><span class="icon">🕐</span><span>'+esc(time)+'</span></div>':'')+'</div>'+flavorBlock+'<span class="status">正常出攤</span></article>';
 }).join('');
 $('scheduleList').innerHTML=html||'<div class="notice">目前沒有已公布的出攤行程。</div>';
}
try{
 if(!window.supabase)throw new Error('網站資料元件載入失敗');
 const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const r=await sb.from('food_truck_schedules').select('id,schedule_date,schedule_type,title,region,start_time,end_time,enabled').eq('enabled',true).gte('schedule_date',today).order('schedule_date',{ascending:true});
 if(r.error)throw r.error;
 const rows=r.data||[];let links=[],flavors=[];
 if(rows.length){const ids=rows.map(x=>x.id);const q=await sb.from('food_truck_schedule_flavors').select('schedule_id,flavor_id,price_per_box').in('schedule_id',ids);if(q.error)throw q.error;links=q.data||[];const f=await sb.from('flavors').select('id,name,price').eq('enabled',true).order('id');if(f.error)throw f.error;flavors=f.data||[]}
 render(rows,links,flavors);setStatus('✅ 官網已連接餐車／擺攤後台，資料會依後台設定顯示。',true)
}catch(e){setStatus('⚠️ 暫時無法讀取最新行程，請稍後再試。');$('scheduleList').innerHTML='<div class="notice">目前無法連線到最新出攤資料，請稍後重新整理。</div>'}
})();
</script>
