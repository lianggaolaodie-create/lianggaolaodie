e',{ascending:true}).order('id',{ascending:true});if(error){box.innerHTML='<div class="error">目前無法載入餐車行程，請稍後再試。</div>';return}if(!data?.length){box.innerHTML='<div class="card empty">目前尚未公布新的餐車行程，請稍後再回來查看。</div>';return}const ids=data.map(x=>x.id);const{data:links}=await sb.from('food_truck_schedule_flavors').select('schedule_id,flavor_id').in('schedule_id',ids);const fids=[...new Set((links||[]).map(x=>x.flavor_id))];let fl=[];if(fids.length){const r=await sb.from('flavors').select('id,name').in('id',fids);fl=r.data||[]}const names={};fl.forEach(x=>names[x.id]=x.name);const by={};(links||[]).forEach(x=>(by[x.schedule_id]??=[]).push(names[x.flavor_id]||''));box.innerHTML=data.map(s=>{const times=s.start_time?(s.start_time+(s.end_time?'～'+s.end_time:'')):'時間依後台設定';const flavors=(by[s.id]||[]).filter(Boolean);return `<article class="card"><div class="info">📅 出攤日期：<strong>${fmtDate(s.schedule_date)}</strong><br>📍 服務地區：<strong>${esc(s.region)}</strong><br>🕐 出攤時間：<strong>${esc(times)}</strong><br>🍡 當日販售口味：<strong>${flavors.length?flavors.map(esc).join('、'):'依後台設定'}</strong></div></article>`}).join('')}load();</script></body></html>
