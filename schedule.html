<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=window.supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');
const box=document.getElementById('scheduleList');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const day=['日','一','二','三','四','五','六'];
function fmtDate(v){const d=new Date(v+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}（${day[d.getDay()]}）`}
async function load(){
 const {data,error}=await sb.from('food_truck_schedules').select('id,schedule_date,title,region,start_time,end_time,note,enabled').eq('enabled',true).order('schedule_date',{ascending:true}).order('id',{ascending:true});
 if(error){box.innerHTML='<div class="error">目前無法載入餐車行程，請稍後再試。</div>';return}
 if(!data?.length){box.innerHTML='<div class="card empty">目前尚未公布新的餐車行程，請稍後再回來查看。</div>';return}
 const ids=data.map(x=>x.id);
 const {data:links}=await sb.from('food_truck_schedule_flavors').select('schedule_id,flavor_id').in('schedule_id',ids);
 const fids=[...new Set((links||[]).map(x=>x.flavor_id))];
 let fl=[];if(fids.length){const r=await sb.from('flavors').select('id,name,price,enabled').in('id',fids);fl=(r.data||[])}
 const by={};(links||[]).forEach(x=>{const f=fl.find(y=>y.id===x.flavor_id);if(f) (by[x.schedule_id]??=[]).push(f)});
 box.innerHTML=data.map(s=>{const times=s.start_time?(s.start_time+(s.end_time?'～'+s.end_time:'')):'時間依當日公告';const flavors=(by[s.id]||[]);return `<article class="card"><div class="topline"><h2>🚚 ${esc(s.title||'涼糕餐車')}</h2><span class="tag">正常出車</span></div><div class="date">📅 ${fmtDate(s.schedule_date)}</div><div class="info">📍 服務地區：<strong>${esc(s.region)}</strong><br>🕐 ${esc(times)}<br>${s.note?'<br>📢 '+esc(s.note):''}${flavors.length?`<br><br><strong>🍡 當日販售口味</strong><div class="price-list">${flavors.map(f=>`<div class="price-row"><span>${esc(f.name)}</span><strong>${Number(f.price||0)>0?'$'+Number(f.price).toLocaleString('zh-TW')+'/盒':'價格依公告'}</strong></div>`).join('')}</div>`:''}</div><span class="status">行程已開放</span></article>`}).join('');
}
load();
</script>
