<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出攤時間｜老爹・涼糕</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f1e8;
      color: #3b281c;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
    }

    .schedule {
      padding: 60px 20px 80px;
    }

    .schedule-inner {
      max-width: 850px;
      margin: 0 auto;
    }

    .kicker {
      text-align: center;
      color: #a8784f;
      letter-spacing: 5px;
      font-size: 14px;
      margin-bottom: 10px;
    }

    h1 {
      text-align: center;
      font-size: 38px;
      margin: 0 0 12px;
    }

    .subtitle {
      text-align: center;
      color: #806c5e;
      margin-bottom: 45px;
    }

    .schedule-card {
      background: #fffaf3;
      border-radius: 24px;
      padding: 28px 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(80,55,35,.08);
    }

    .schedule-card h2 {
      margin: 0 0 20px;
      font-size: 26px;
    }

    .date {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .info {
      line-height: 2;
      font-size: 17px;
    }

    .status {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 16px;
      border-radius: 30px;
      background: #eee1cf;
      font-weight: 700;
    }

    .waiting {
      text-align: center;
      padding: 25px 10px;
      color: #806c5e;
      line-height: 1.9;
    }

    .back {
      text-align: center;
      margin-top: 35px;
    }

    .back a {
      color: #6b4528;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>

<body>

<section class="schedule">
  <div class="schedule-inner">

    <div class="kicker">SCHEDULE</div>
    <h1>出攤時間</h1>
    <div class="subtitle">老爹・涼糕最新出攤行程</div>

    <div class="schedule-card">
      <h2>🏮 擺攤行程</h2>

      <div class="date">8/29（六）｜萬華雙和市場</div>

      <div class="info">
        📍 台北市萬華區<br>
        🕐 08:00－售完為止
      </div>

      <div class="status">正常出攤</div>
    </div>

    <div class="schedule-card">
  <h2>🚚 涼糕餐車行程</h2>

  <div class="date">8/26（三）｜雙北</div>

  <div class="info">
    📍 雙北<br>
    🕐 預計中午出車－售完為止<br>
    🍰 夾心系列：鹹蛋芋頭、黑糖地瓜<br>
🍰 一般口味：泰式奶茶、純杏仁（少量）<br>
🍉 水果涼糕：綜合四種口味（西瓜、鳳梨、藍莓、哈密瓜）
  </div>

  <div class="status">正常出車</div>
</div>

    <div class="back">
      <a href="./">← 返回官網首頁</a>
    </div>

  </div>
</section>

</body>
</html>
