<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>出攤資訊｜老爹・涼糕</title><style>body{margin:0;background:#f8f3eb;color:#3d2a20;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.8;padding-bottom:78px}.top{position:sticky;top:0;z-index:20;max-width:1180px;margin:12px auto 0;background:rgba(255,255,255,.97);border:1px solid #eadfd3;border-radius:22px;padding:10px 18px;display:flex;align-items:center;gap:18px}.logo{width:72px;height:72px;object-fit:contain}.nav{display:flex;gap:17px;flex-wrap:wrap}.nav a{color:#4a3428;text-decoration:none;font-size:14px;font-weight:700}.hero{text-align:center;padding:50px 20px 30px}.eyebrow{font-size:12px;letter-spacing:5px;color:#a66f4d;font-weight:800}.hero h1{font-size:clamp(35px,7vw,58px);margin:12px 0}.hero p{color:#765f51}.line{width:60px;height:3px;background:#b98a68;margin:22px auto}.wrap{max-width:900px;margin:auto;padding:0 20px 45px}.section{margin-bottom:42px}.section h2{font-size:27px;margin:0 0 18px;padding:14px 18px;background:#fff;border-radius:18px;border-left:5px solid #c79b70}.card{background:#fff;border-radius:25px;padding:25px 26px;margin-bottom:18px;box-shadow:0 8px 28px rgba(61,42,32,.07)}.info{font-size:17px;line-height:2.2}.price-title{margin-top:17px;font-weight:900;font-size:16px}.price-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}.price-item{background:#fbf5ee;border:1px solid #eadfd3;border-radius:14px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:800}.price-item .money{white-space:nowrap;font-weight:900}.empty{text-align:center;padding:28px 12px;color:#765f51}.error{background:#fff0ef;color:#a32e29;border-radius:14px;padding:16px}.back{text-align:center;padding:5px 20px 45px}.back a{display:inline-block;background:#fff;border:1px solid #e3d5c8;color:#3d2a20;text-decoration:none;border-radius:99px;padding:12px 23px;font-weight:800}footer{text-align:center;background:#33241c;color:#fff;padding:28px 20px;font-size:13px}.bottom{position:fixed;left:10px;right:10px;bottom:10px;z-index:30;max-width:600px;margin:auto;background:#fff;border:1px solid #e8ddd2;border-radius:20px;display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px}.bottom a{text-decoration:none;color:#60483a;text-align:center;font-size:11px;font-weight:800}.bottom span{display:block;font-size:20px}@media(max-width:600px){.nav a:nth-child(n+4){display:none}.hero{padding:40px 18px 28px}.wrap{padding:0 14px 35px}.card{padding:22px 19px}.section h2{font-size:23px}.price-grid{grid-template-columns:1fr}}</style><script src="maintenance-gate.js"></script></head><body><header class="top"><img class="logo" src="IMG_3238.png" alt="老爹涼糕 Logo"><nav class="nav"><a href="index.html">首頁</a><a href="rules.html">購買涼糕規則</a><a href="products.html">涼糕專區</a><a href="radish-cake.html">純米蘿蔔糕專區</a><a href="merch.html">周邊商品</a><a href="convenience.html">超商寄放取件方式</a><a href="about.html">關於老爹</a><a href="schedule.html">出攤時間</a><a href="contact.html">聯絡我們</a></nav></header><section class="hero"><div class="eyebrow">SCHEDULE</div><h1>出攤資訊</h1><p>老爹・涼糕最新出攤行程</p><div class="line"></div></section><main class="wrap"><section class="section"><h2>🚚 涼糕餐車</h2><div id="truckList"><div class="empty">正在載入…</div></div></section><section class="section"><h2>🏪 擺攤</h2><div id="stallList"><div class="empty">正在載入…</div></div></section></main><div class="back"><a href="index.html">← 返回老爹・涼糕首頁</a></div><footer>老爹・涼糕｜手工製作・新鮮現做</footer><nav class="bottom"><a href="index.html"><span>⌂</span>首頁</a><a href="products.html"><span>🍡</span>產品介紹</a><a href="schedule.html"><span>📍</span>出攤資訊</a><a href="order.html"><span>🛒</span>訂購方式</a><a href="contact.html"><span>💬</span>聯絡我們</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const truckBox=document.getElementById('truckList'),stallBox=document.getElementById('stallList');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const day=['日','一','二','三','四','五','六'];function fmtDate(v){const d=new Date(v+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}（${day[d.getDay()]}）`}async function load(){const{data,error}=await sb.from('food_truck_schedules').select('id,schedule_date,schedule_type,region,start_time,end_time,enabled').eq('enabled',true).order('schedule_date',{ascending:true}).order('id',{ascending:true});if(error){truckBox.innerHTML='<div class="error">目前無法載入涼糕餐車行程，請稍後再試。</div>';stallBox.innerHTML='<div class="error">目前無法載入擺攤行程，請稍後再試。</div>';return}const rows=data||[],ids=rows.map(x=>x.id);let links=[],fl=[];if(ids.length){const r=await sb.from('food_truck_schedule_flavors').select('schedule_id,flavor_id,price_per_box,price,unit_price').in('schedule_id',ids);links=r.data||[];const fids=[...new Set(links.map(x=>x.flavor_id))];if(fids.length){const q=await sb.from('flavors').select('id,name,price').in('id',fids);fl=q.data||[]}}const names={};fl.forEach(x=>names[x.id]=x);const by={};links.forEach(x=>(by[x.schedule_id]??=[]).push(x));function render(list,isTruck){if(!list.length)return '<div class="card empty">目前尚未公布新的行程。</div>';return list.map(s=>{const times=s.start_time?(s.start_time+(s.end_time?'～'+s.end_time:'')):'時間依後台設定',items=(by[s.id]||[]).filter(x=>names[x.flavor_id]);const flavorText=items.length?items.map(x=>names[x.flavor_id].name).join('、'):'依後台設定';const priceHtml=isTruck?`<div class="price-title">💰 每個口味的價格／盒</div><div class="price-grid">${items.length?items.map(x=>{const p=x.price_per_box??x.price??x.unit_price??names[x.flavor_id].price??0;return `<div class="price-item"><span>${esc(names[x.flavor_id].name)}</span><span class="money">$${Number(p||0).toLocaleString('zh-TW')}／盒</span></div>`}).join(''):'<div class="empty">依後台設定</div>'}</div>`:'';return `<article class="card"><div class="info">📅 出攤日期：<strong>${fmtDate(s.schedule_date)}</strong><br>📍 服務地區：<strong>${esc(s.region)}</strong><br>🕐 出攤時間：<strong>${esc(times)}</strong><br>🍡 當日販售口味：<strong>${esc(flavorText)}</strong></div>${priceHtml}</article>`}).join('')}const trucks=rows.filter(x=>(x.schedule_type||'food_truck')==='food_truck'),stalls=rows.filter(x=>x.schedule_type==='stall');truckBox.innerHTML=render(trucks,true);stallBox.innerHTML=render(stalls,false)}load();</script></body></html>
