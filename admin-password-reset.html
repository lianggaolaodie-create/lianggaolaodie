<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>老爹．涼糕｜重設後台密碼</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.shell{max-width:520px;margin:55px auto;padding:12px}.card{background:#fff;border:1px solid #e4dad3;border-radius:18px;padding:22px}.brand{font-size:23px;font-weight:900}.muted{color:#786e68;line-height:1.6}.field{margin:16px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;border:1px solid #ddd2ca;border-radius:10px;padding:13px 12px;font:inherit}.btn{width:100%;border:0;border-radius:11px;padding:13px 14px;background:#2f78c9;color:#fff;font-weight:900;font-size:16px}.back{display:block;text-align:center;margin-top:14px;color:#2f78c9;text-decoration:none;font-weight:800}.notice{padding:11px;border-radius:10px;margin-top:12px;background:#edf8f1;color:#286c47;font-weight:700}.err{background:#fff0ef;color:#a43b35}@media(max-width:700px){.shell{margin:30px auto;padding:10px}.brand{font-size:21px}}
</style>
</head>
<body>
<div class="shell"><div class="card">
<div class="brand">🍡 老爹．涼糕｜重設後台密碼</div>
<p class="muted">輸入管理員 Email，我們會寄出密碼重設信。這不會修改其他網站資料。</p>
<form id="requestForm">
<div class="field"><label for="email">管理員 Email</label><input id="email" type="email" autocomplete="username" required></div>
<button id="send" class="btn" type="submit">寄送重設信</button>
</form>
<div id="msg" aria-live="polite"></div>
<a class="back" href="admin-login-fixed.html">← 回到後台登入</a>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(() => {
'use strict';
const db=window.supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const form=document.getElementById('requestForm'), email=document.getElementById('email'), send=document.getElementById('send'), msg=document.getElementById('msg');
function show(text,error=false){msg.className=text?'notice'+(error?' err':''):'';msg.textContent=text||''}
form.addEventListener('submit',async e=>{e.preventDefault();const value=email.value.trim();if(!value){show('請輸入管理員 Email。',true);return}send.disabled=true;send.textContent='寄送中…';show('正在寄送重設信…');try{const {error}=await db.auth.resetPasswordForEmail(value,{redirectTo:new URL('admin-password-update.html',location.href).href});if(error)throw error;show('重設信已送出，請到 Email 點擊連結後設定新密碼。')}catch(err){show('寄送失敗：'+(err.message||err),true)}finally{send.disabled=false;send.textContent='寄送重設信'}});
})();
</script>
</body>
</html>
