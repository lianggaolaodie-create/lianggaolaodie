<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>老爹．涼糕｜蘿蔔糕商品管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f0e7;color:#3b2921;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:960px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #eadfd4;border-radius:18px;padding:18px;margin-bottom:14px}.brand{font-size:23px;font-weight:950}.muted{color:#83756c;font-size:13px;line-height:1.6}.field{margin:12px 0}.field label{display:block;font-weight:900;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #ddd1c7;border-radius:11px;font:inherit}.field textarea{min-height:90px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{border:0;border-radius:11px;padding:11px 15px;background:#6b3c21;color:white;font-weight:900;cursor:pointer}.btn.gray{background:#81746b}.btn.red{background:#ad3933}.row{border:1px solid #eadfd4;border-radius:14px;padding:12px;display:flex;align-items:center;gap:12px;margin:10px 0;flex-wrap:wrap}.thumb{width:76px;height:76px;object-fit:cover;border-radius:10px;background:#f1e7dd}.grow{flex:1;min-width:140px}.notice{padding:10px;border-radius:10px;background:#edf7ef;color:#286c47;margin-top:10px}.err{background:#fff0ef;color:#a43d36}.hidden{display:none!important}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:10px}.card{padding:14px}}
</style></head><body>
<div id="login" class="wrap"><div class="card"><div class="brand">🥕 老爹．涼糕｜蘿蔔糕商品管理</div><p class="muted">請使用現有官網管理員帳號登入。</p><form id="loginForm"><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn">登入後台</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="wrap hidden"><div class="card"><div class="top"><div><div class="brand">🥕 蘿蔔糕獨立商品管理</div><div id="who" class="muted"></div></div><div><a class="btn gray" href="radish-cake.html" target="_blank">查看官網專區</a> <button id="logout" class="btn gray" type="button">登出</button></div></div><p class="muted">商品資料使用獨立的 radish_products 區段，不修改原本涼糕商品清單。</p></div>
<div class="card"><div class="top"><h2 id="formTitle">新增蘿蔔糕商品</h2><button id="reset" class="btn gray" type="button">清空表單</button></div><form id="productForm"><input id="pid" type="hidden"><div class="grid"><div class="field"><label>商品名稱 *</label><input id="name" required placeholder="例如：純米原味蘿蔔糕"></div><div class="field"><label>售價（新台幣）</label><input id="price" type="number" min="0" step="1" placeholder="尚未定價可留空"></div></div><div class="grid"><div class="field"><label>規格／重量</label><input id="spec" placeholder="例如：每條 600g"></div><div class="field"><label>官網專區狀態</label><select id="enabled"><option value="true">上架顯示</option><option value="false">下架隱藏</option></select></div></div><div class="field"><label>是否開放線上訂購 *</label><select id="onlineEnabled"><option value="false">不開放線上訂購</option><option value="true">開放線上訂購</option></select><div class="muted">這個設定只決定是否出現在蘿蔔糕線上訂購頁，不影響官網純米蘿蔔糕專區的商品展示。</div></div><div class="field"><label>商品介紹</label><textarea id="description" placeholder="口味特色、食材、保存方式等"></textarea></div><div class="field"><label>商品照片</label><input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><input id="imageUrl" type="hidden"><div class="muted">手機相簿可上傳，單張上限 10MB。</div><img id="preview" class="thumb hidden" alt="商品照片預覽"></div><button class="btn" type="submit">儲存商品</button><div id="formMsg"></div></form></div>
<div class="card"><div class="top"><h2>商品清單</h2><button id="reload" class="btn gray" type="button">重新整理</button></div><div id="list" class="muted">載入中…</div><div id="listMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
'use strict';
const db=window.supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);let items=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function msg(id,text,error=false){$(id).innerHTML=text?'<div class="notice '+(error?'err':'')+'">'+esc(text)+'</div>':''}
async function access(user){const r=await db.from('admin_profiles').select('role,enabled').eq('user_id',user.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'此帳號已停用';if(r.data.role!=='super_admin')return'沒有後台管理權限';return null}
async function load(){ $('list').textContent='載入中…';const r=await db.from('site_admin_content').select('data').eq('section_id','radish_products').maybeSingle();if(r.error){$('list').textContent='讀取失敗：'+r.error.message;return}items=Array.isArray(r.data?.data?.products)?r.data.data.products:[];renderList()}
function renderList(){if(!items.length){$('list').textContent='目前尚未建立蘿蔔糕商品。請使用上方表單新增。';return}$('list').innerHTML=items.map((p,i)=>'<div class="row">'+(p.image_url?'<img class="thumb" src="'+esc(p.image_url)+'" alt="">':'<div class="thumb">🥕</div>')+'<div class="grow"><b>'+esc(p.name)+'</b><div class="muted">'+(p.price!==''&&p.price!=null?'NT$ '+Number(p.price).toLocaleString():'未定價')+' · '+esc(p.spec||'未設定規格')+' · '+(p.enabled?'官網上架':'官網下架')+' · '+(p.online_enabled===true?'線上可訂購':'線上未開放')+'</div><div class="muted">'+esc(p.description||'')+'</div></div><button class="btn gray" type="button" onclick="editItem('+i+')">編輯</button><button class="btn red" type="button" onclick="deleteItem('+i+')">刪除</button></div>').join('')}
async function saveItems(){const r=await db.from('site_admin_content').upsert({section_id:'radish_products',data:{products:items,updated_at:new Date().toISOString()},updated_at:new Date().toISOString()},{onConflict:'section_id'});if(r.error)throw r.error}
function resetForm(){$('productForm').reset();$('pid').value='';$('imageUrl').value='';$('preview').src='';$('preview').classList.add('hidden');$('formTitle').textContent='新增蘿蔔糕商品';msg('formMsg','')}
window.editItem=i=>{const p=items[i];if(!p)return;$('pid').value=p.id;$('name').value=p.name||'';$('price').value=p.price??'';$('spec').value=p.spec||'';$('description').value=p.description||'';$('enabled').value=String(p.enabled!==false);$('onlineEnabled').value=String(p.online_enabled===true);$('imageUrl').value=p.image_url||'';$('preview').src=p.image_url||'';$('preview').classList.toggle('hidden',!p.image_url);$('formTitle').textContent='編輯蘿蔔糕商品';window.scrollTo({top:0,behavior:'smooth'})};
window.deleteItem=async i=>{if(!confirm('確定刪除「'+items[i].name+'」？'))return;const old=items;items=items.filter((_,n)=>n!==i);try{await saveItems();renderList();msg('listMsg','商品已刪除')}catch(e){items=old;renderList();msg('listMsg','刪除失敗：'+e.message,true)}};
$('imageFile').addEventListener('change',async()=>{const f=$('imageFile').files?.[0];if(!f)return;if(!f.type.startsWith('image/')){msg('formMsg','請選擇圖片檔',true);return}if(f.size>10*1024*1024){msg('formMsg','圖片請小於 10MB',true);return}msg('formMsg','正在上傳圖片…');try{const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path='radish-products/'+Date.now()+'.'+ext;const u=await db.storage.from('site-images').upload(path,f,{upsert:true,contentType:f.type});if(u.error)throw u.error;const url=db.storage.from('site-images').getPublicUrl(path).data.publicUrl;$('imageUrl').value=url;$('preview').src=url;$('preview').classList.remove('hidden');msg('formMsg','照片上傳完成，請再按「儲存商品」。')}catch(e){msg('formMsg','圖片上傳失敗：'+e.message,true)}});
$('productForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const id=$('pid').value||('radish-'+Date.now());const p={id,name:$('name').value.trim(),price:$('price').value===''?'':Number($('price').value),spec:$('spec').value.trim(),description:$('description').value.trim(),enabled:$('enabled').value==='true',online_enabled:$('onlineEnabled').value==='true',image_url:$('imageUrl').value.trim(),sort:items.find(x=>x.id===id)?.sort??items.length};const i=items.findIndex(x=>x.id===id);if(i>=0)items[i]=p;else items.push(p);await saveItems();renderList();resetForm();msg('formMsg','商品已儲存')}catch(err){msg('formMsg','儲存失敗：'+err.message,true)}finally{b.disabled=false}});
$('reset').onclick=resetForm;$('reload').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const er=await access(r.data.user);if(er){await db.auth.signOut();throw new Error(er)}enter(r.data.user)}catch(err){msg('loginMsg','登入失敗：'+err.message,true)}});
function enter(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=user.email||'';load()}
db.auth.getSession().then(async r=>{if(r.data.session){const er=await access(r.data.session.user);if(!er)enter(r.data.session.user)}})
</script></body></html>
