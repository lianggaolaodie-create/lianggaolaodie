<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>老爹・涼糕｜7-ELEVEN 出貨工作台</title>
<style>
body{margin:0;background:#f7f3ee;color:#2b241f;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #e4d9ce;border-radius:18px;padding:18px;margin:14px 0}.btn{border:0;border-radius:10px;padding:11px 15px;background:#8f5738;color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#eee;color:#333}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:13px;color:#756a62}.notice{background:#fff7df;padding:12px;border-radius:10px}.error{background:#fff0ef;color:#9d302b;padding:12px;border-radius:10px}.ok{background:#edf8f1;padding:12px;border-radius:10px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}.stat{padding:14px;border:1px solid #e7ddd5;border-radius:12px}.num{font-size:25px;font-weight:900}.order{border:1px solid #e5dcd4;border-radius:14px;padding:14px;margin:10px 0}.codebox{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.codebox input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d8cec5;border-radius:10px;font:inherit}.barcode{margin-top:12px;text-align:center;padding:12px;background:#fff;border:1px dashed #d8cec5;border-radius:10px}.barcode svg{max-width:100%;height:75px}.label{font-weight:900;margin-bottom:5px}.tag{display:inline-block;padding:4px 9px;border-radius:999px;background:#eee;font-size:12px;font-weight:800}@media(max-width:600px){.codebox{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="card">
<h1>🧊 7-ELEVEN 出貨工作台</h1>
<div class="small">老爹・涼糕｜獨立後台，不修改其他後台</div>
<div class="actions" style="margin-top:12px">
<button class="btn" id="loginBtn">登入</button><button class="btn secondary" id="refreshBtn">重新整理</button><button class="btn secondary" id="logoutBtn">登出</button>
<a class="btn secondary" href="admin-7eleven.html">冷藏小白單後台</a>
<a class="btn secondary" href="https://myship2.7-11.com.tw/C2C/Import" target="_blank" rel="noopener">7-ELEVEN 官方訂單匯入</a>
</div><div id="msg"></div>
</div>
<div id="login" class="card"><div class="notice">請使用既有老爹涼糕管理員帳號登入。</div><input id="email" type="email" placeholder="Email" autocomplete="username" style="width:100%;box-sizing:border-box;padding:11px;margin:8px 0;border:1px solid #d8cec5;border-radius:10px"><input id="password" type="password" placeholder="密碼" autocomplete="current-password" style="width:100%;box-sizing:border-box;padding:11px;margin:8px 0;border:1px solid #d8cec5;border-radius:10px"><button class="btn" onclick="doLogin()">登入</button></div>
<div id="app" class="hidden">
<div class="card"><div class="grid"><div class="stat"><div class="small">7-ELEVEN 訂單</div><div id="count" class="num">0</div></div><div class="stat"><div class="small">已填官方服務碼</div><div id="coded" class="num">0</div></div><div class="stat"><div class="small">已標記交寄</div><div id="sent" class="num">0</div></div></div></div>
<div class="card"><h2>📦 出貨訂單</h2><div class="actions"><button class="btn" onclick="selectAll(true)">全選</button><button class="btn secondary" onclick="selectAll(false)">取消全選</button><button class="btn" onclick="exportSelected()">匯出出貨資料</button><button class="btn secondary" onclick="markSelected('sent')">標記已交寄</button></div><div class="small" style="margin-top:10px">每筆訂單會自動顯示「內部訂單條碼」，方便測試掃描。這個條碼不是 7-ELEVEN 官方服務單條碼。官方服務碼仍必須由 7-ELEVEN 官方系統取得。</div><div id="ordersBox" style="margin-top:12px">讀取中…</div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script>
(function(){
const sb=window.supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let rows=[];
function msg(t,c='ok'){$('msg').innerHTML='<div class="'+c+'">'+esc(t)+'</div>'}
function status(id){return localStorage.getItem('sevenElevenShipStatus_'+id)||'ready'}
function code(id){return localStorage.getItem('sevenElevenOfficialCode_'+id)||''}
async function auth(){const{data}=await sb.auth.getUser();if(!data.user){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}const{data:p,error}=await sb.from('admin_profiles').select('role,enabled').eq('user_id',data.user.id).maybeSingle();if(error||!p||!p.enabled){msg('此帳號不是啟用中的管理員。','error');return}$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}
window.doLogin=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('請輸入 Email 與密碼','error');const{error}=await sb.auth.signInWithPassword({email,password});if(error)return msg('登入失敗：'+error.message,'error');await auth()};
$('loginBtn').onclick=doLogin;$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refreshBtn').onclick=load;
function drawBarcode(boxId,value){const box=$(boxId);if(!box||!value)return;box.innerHTML='<div class="label">▥ 內部訂單條碼</div><svg></svg><div class="small">'+esc(value)+'</div>';try{JsBarcode(box.querySelector('svg'),value,{format:'CODE128',displayValue:false,height:65,margin:5});}catch(e){box.innerHTML='<div class="error">條碼產生失敗</div>'}}
function drawOfficial(boxId,value){const box=$(boxId);if(!box||!value)return;box.innerHTML='<div class="label">7-ELEVEN 官方服務碼條碼（僅顯示已取得的服務碼）</div><svg></svg><div class="small">'+esc(value)+'</div>';try{JsBarcode(box.querySelector('svg'),value,{format:'CODE128',displayValue:false,height:65,margin:5});}catch(e){box.innerHTML='<div class="error">服務碼格式無法以 CODE128 顯示，請以 7-ELEVEN 官方單據為準。</div>'}}
window.saveCode=(id)=>{const v=$('code_'+id).value.trim();if(!v)return msg('請先輸入 7-ELEVEN 官方系統取得的服務碼。','error');localStorage.setItem('sevenElevenOfficialCode_'+id,v);load();msg('官方服務碼已保存。','ok')};
async function load(){const{data,error}=await sb.from('orders').select('id,order_number,delivery_date,delivery_region,pickup_type,product_total,pickup_fee,total_amount,status,payment_status,created_at').eq('pickup_type','seven_eleven').order('created_at',{ascending:false}).limit(100);if(error)return msg('讀取訂單失敗：'+error.message,'error');let priv=[];const u=await sb.auth.getUser();const{data:p}=await sb.from('admin_profiles').select('role').eq('user_id',u.data.user.id).maybeSingle();if(p&&(p.role==='personal_data_admin'||p.role==='super_admin')){const r=await sb.rpc('personal_data_admin_orders');if(!r.error)priv=r.data||[]}
rows=await Promise.all((data||[]).map(async o=>{const{data:items}=await sb.from('order_items').select('flavor_name,quantity,subtotal').eq('order_id',o.id).order('id');const x=priv.find(v=>v.order_id===o.id)||{};return{o,items:items||[],p:x}}));
$('count').textContent=rows.length;$('coded').textContent=rows.filter(r=>code(r.o.id)).length;$('sent').textContent=rows.filter(r=>status(r.o.id)==='sent').length;
$('ordersBox').innerHTML=rows.length?rows.map(r=>{const id=esc(r.o.id),s=status(r.o.id),c=code(r.o.id),order=esc(r.o.order_number);return '<div class="order"><div><input class="pick" type="checkbox" value="'+id+'"> <strong>'+order+'</strong> <span class="tag">'+(s==='sent'?'已交寄':'待出貨')+'</span></div><div class="small" style="margin-top:6px">'+esc(r.o.delivery_date)+' · '+esc(r.p.pickup_store||'未取得門市')+' · '+esc(r.p.customer_name||'未取得姓名')+'</div><div style="margin-top:8px">'+esc(r.items.map(i=>(i.flavor_name||'商品')+' × '+i.quantity).join('、'))+'</div><div id="internal_'+id+'" class="barcode"></div><div class="small" style="margin-top:10px">官方服務碼：<strong>'+esc(c||'尚未填入')+'</strong></div><div class="codebox"><input id="code_'+id+'" value="'+esc(c)+'" placeholder="貼上 7-ELEVEN 官方系統取得的服務碼"><button class="btn" onclick="saveCode(\''+id+'\')">儲存服務碼</button></div><div id="official_'+id+'" class="barcode"></div></div>'}).join(''):'<div class="small">目前沒有 7-ELEVEN 訂單。</div>';
rows.forEach(r=>{const id=esc(r.o.id);drawBarcode('internal_'+id,r.o.order_number||r.o.id);if(code(r.o.id))drawOfficial('official_'+id,code(r.o.id))})}
window.selectAll=v=>document.querySelectorAll('.pick').forEach(x=>x.checked=v);function selected(){return [...document.querySelectorAll('.pick:checked')].map(x=>x.value)}window.markSelected=s=>{const ids=selected();if(!ids.length)return msg('請先選擇訂單。','error');ids.forEach(id=>localStorage.setItem('sevenElevenShipStatus_'+id,s));load();msg('已標記 '+ids.length+' 筆訂單。','ok')};window.exportSelected=()=>{const ids=selected();if(!ids.length)return msg('請先選擇訂單。','error');const chosen=rows.filter(r=>ids.includes(r.o.id));const head=['訂單編號','配送日期','取件人姓名','電話','7-ELEVEN門市','商品','商品金額','寄放費','合計','官方服務碼','交寄狀態'];const lines=[head,...chosen.map(r=>[r.o.order_number,r.o.delivery_date,r.p.customer_name||'',r.p.customer_phone||'',r.p.pickup_store||'',r.items.map(i=>(i.flavor_name||'商品')+' x '+i.quantity).join(' / '),r.o.product_total,r.o.pickup_fee,r.o.total_amount,code(r.o.id),status(r.o.id)==='sent'?'已交寄':'待出貨'])];const csv='\ufeff'+lines.map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='7-ELEVEN_出貨資料_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(url);msg('已匯出 '+chosen.length+' 筆整理資料。','ok')};
auth();
})();
</script>
</body>
</html>
