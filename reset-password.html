<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜重設密碼</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:520px;margin:auto;padding:30px 18px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:22px;margin:16px 0}.field{margin:14px 0}.field label{display:block;font-weight:700;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #d9cdc1;border-radius:10px;box-sizing:border-box;font:inherit}button{border:0;border-radius:11px;padding:12px 18px;background:#9b5c38;color:#fff;font-weight:800}.msg{padding:12px;border-radius:10px;background:#f6eee7;margin-top:12px}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}a{color:#9b5c38;font-weight:700;text-decoration:none}</style></head><body><div class="wrap"><div class="card"><h1>老爹・涼糕</h1><h2>忘記密碼／重設密碼</h2><div id="request"><p>輸入管理員 Email，我們會寄出重設密碼連結。</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="管理員 Email"></div><button id="send">寄出重設連結</button><div id="msg"></div></div><div id="change" style="display:none"><p>請設定新的後台密碼。</p><div class="field"><label>新密碼</label><input id="pw" type="password" autocomplete="new-password" minlength="8"></div><div class="field"><label>再次輸入新密碼</label><input id="pw2" type="password" autocomplete="new-password" minlength="8"></div><button id="save">更新密碼</button><div id="changeMsg"></div></div><p><a href="admin.html">← 回到後台登入</a></p></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));$('send').onclick=async()=>{const email=$('email').value.trim();if(!email)return $('msg').innerHTML='<div class="msg error">請輸入 Email。</div>';const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/reset-password.html'});$('msg').innerHTML=error?'<div class="msg error">寄送失敗：'+esc(error.message)+'</div>':'<div class="msg ok">重設密碼連結已寄出，請查看 Email。</div>'};sb.auth.onAuthStateChange(async(event)=>{if(event==='PASSWORD_RECOVERY'){$('request').style.display='none';$('change').style.display='block'}});$('save').onclick=async()=>{const a=$('pw').value,b=$('pw2').value;if(a.length<8)return $('changeMsg').innerHTML='<div class="msg error">新密碼至少需要 8 個字元。</div>';if(a!==b)return $('changeMsg').innerHTML='<div class="msg error">兩次密碼不一致。</div>';const {error}=await sb.auth.updateUser({password:a});$('changeMsg').innerHTML=error?'<div class="msg error">更新失敗：'+esc(error.message)+'</div>':'<div class="msg ok">密碼已更新，請回後台登入。</div>'};</script></body></html>
