<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜周邊商品管理後台</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:920px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d9cdc1;border-radius:10px;font:inherit}.field textarea{min-height:90px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:10px 14px;background:#9b5c38;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#eee;color:#333}.danger{background:#a32e29}.item{border:1px solid #eadfd4;border-radius:13px;padding:14px;margin:10px 0}.item img{width:140px;height:140px;object-fit:cover;border-radius:12px;margin:9px 0;display:block;background:#f3ebe3}.msg{padding:11px;border-radius:10px;background:#f6eee7;margin-top:10px}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}.small{font-size:13px;color:#75685f}.switch{display:flex;align-items:center;gap:8px}.preview{max-width:240px;max-height:240px;border-radius:12px;margin-top:10px;display:none;object-fit:cover}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>🛍️ 周邊商品管理後台</h1><div id="who" class="small">尚未登入</div></div><div id="login" class="card"><h2>管理員登入</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button onclick="login()">登入</button><div id="loginMsg"></div></div><main id="app" style="display:none"><div class="card"><h2 id="formTitle">➕ 新增商品</h2><div class="grid"><div class="field"><label>📝 商品名稱</label><input id="name" placeholder="例如：老爹涼糕品牌短T"></div><div class="field"><label>💰 商品價格</label><input id="price" type="number" min="0" step="1" placeholder="590"></div></div><div class="field"><label>📄 商品介紹</label><textarea id="description" placeholder="商品介紹、尺寸、材質等"></textarea></div><div class="field"><label>📦 庫存數量</label><input id="stock" type="number" min="0" step="1" placeholder="100"></div><div class="field"><label>🖼️ 上傳商品照片</label><input id="imageFile" type="file" accept="image/*" onchange="previewImage()"><div class="small">可直接從手機相簿選照片或拍照，不需要輸入網址。</div><img id="preview" class="preview" alt="商品照片預覽"></div><label class="switch"><input id="enabled" type="checkbox" checked> 🔘 上架商品</label><div class="actions" style="margin-top:12px"><button onclick="save()" id="saveBtn">➕ 新增商品</button><button class="secondary" onclick="resetForm()">清除／新增下一個</button><button class="secondary" onclick="load()">重新整理</button><button class="secondary" onclick="logout()">登出</button></div><div id="formMsg"></div></div><div class="card"><h2>📋 商品清單</h2><div id="list">讀取中…</div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let editId=null,currentUser=null;function show(id,text,cls='msg'){$(id).innerHTML='<div class="'+cls+'">'+esc(text)+'</div>'}function previewImage(){const f=$('imageFile').files?.[0],img=$('preview');if(!f){img.style.display='none';img.removeAttribute('src');return}if(!f.type.startsWith('image/'))return show('formMsg','請選擇圖片檔案','msg error');img.src=URL.createObjectURL(f);img.style.display='block'}async function login(){const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return show('loginMsg','登入失敗：'+error.message,'msg error');await open(data.user)}async function open(user){currentUser=user;const{data:p,error}=await sb.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',user.id).maybeSingle();if(error||!p||!p.enabled||!(p.role==='super_admin'||p.can_manage_products===true))return show('loginMsg','此帳號沒有周邊商品管理權限。','msg error');$('login').style.display='none';$('app').style.display='block';$('who').textContent=(user.email||'')+' · 周邊商品管理';await load()}async function load(){const{data,error}=await sb.from('merchandise_products').select('id,name,description,price,stock_quantity,image_url,enabled').order('id',{ascending:false});if(error)return show('list','讀取失敗：'+error.message,'msg error');if(!data?.length)return $('list').textContent='目前沒有周邊商品。';$('list').innerHTML=data.map(x=>`<div class="item"><strong>${esc(x.name)}</strong><div>價格：$${Number(x.price||0).toLocaleString('zh-TW')}　庫存：${Number(x.stock_quantity||0).toLocaleString('zh-TW')}　狀態：${x.enabled?'上架':'下架'}</div>${x.image_url?`<img src="${esc(x.image_url)}" alt="${esc(x.name)}">`:''}<div class="small">${esc(x.description||'')}</div><div class="actions" style="margin-top:9px"><button onclick="edit(${x.id})">✏️ 修改商品</button><button class="secondary" onclick="toggle(${x.id},${!x.enabled})">${x.enabled?'🔘 下架':'🔘 上架'}</button><button class="danger" onclick="removeItem(${x.id})">🗑️ 刪除</button></div></div>`).join('')}async function uploadImage(file){if(!file)return null;if(!file.type.startsWith('image/'))throw new Error('請選擇圖片檔案');if(file.size>10*1024*1024)throw new Error('圖片請小於 10MB');const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path=(currentUser?.id||'admin')+'/'+crypto.randomUUID()+'.'+ext;const{error}=await sb.storage.from('merchandise-images').upload(path,file,{contentType:file.type,upsert:false,cacheControl:'31536000'});if(error)throw error;return sb.storage.from('merchandise-images').getPublicUrl(path).data.publicUrl}async function save(){const name=$('name').value.trim(),price=Number($('price').value),stock=Number($('stock').value),file=$('imageFile').files?.[0];if(!name)return show('formMsg','請輸入商品名稱','msg error');if(!Number.isFinite(price)||price<0)return show('formMsg','請輸入正確商品價格','msg error');if(!Number.isInteger(stock)||stock<0)return show('formMsg','請輸入正確庫存數量','msg error');try{$('saveBtn').disabled=true;$('saveBtn').textContent='儲存中…';const imageUrl=await uploadImage(file);const payload={name,description:$('description').value.trim()||null,price,stock_quantity:stock,enabled:$('enabled').checked,updated_at:new Date().toISOString()};if(imageUrl)payload.image_url=imageUrl;const q=editId===null?await sb.from('merchandise_products').insert(payload):await sb.from('merchandise_products').update(payload).eq('id',editId);if(q.error)throw q.error;show('formMsg',editId===null?'周邊商品新增成功！':'周邊商品修改成功！','msg ok');resetForm();await load()}catch(e){show('formMsg','儲存失敗：'+(e.message||e),'msg error')}finally{$('saveBtn').disabled=false;$('saveBtn').textContent='新增商品'}}async function edit(id){const{data,error}=await sb.from('merchandise_products').select('*').eq('id',id).single();if(error)return show('formMsg','讀取商品失敗：'+error.message,'msg error');editId=id;$('formTitle').textContent='✏️ 修改商品';$('saveBtn').textContent='儲存修改';$('name').value=data.name||'';$('price').value=data.price??'';$('stock').value=data.stock_quantity??0;$('description').value=data.description||'';$('enabled').checked=!!data.enabled;$('imageFile').value='';const img=$('preview');if(data.image_url){img.src=data.image_url;img.style.display='block'}else{img.style.display='none';img.removeAttribute('src')}window.scrollTo({top:0,behavior:'smooth'})}async function toggle(id,on){const{error}=await sb.from('merchandise_products').update({enabled:on,updated_at:new Date().toISOString()}).eq('id',id);if(error)return show('formMsg','狀態更新失敗：'+error.message,'msg error');await load()}async function removeItem(id){if(!confirm('確定要刪除這個周邊商品？'))return;const{error}=await sb.from('merchandise_products').delete().eq('id',id);if(error)return show('formMsg','刪除失敗：'+error.message,'msg error');if(editId===id)resetForm();await load()}function resetForm(){editId=null;$('formTitle').textContent='➕ 新增商品';$('saveBtn').textContent='新增商品';$('name').value='';$('price').value='';$('stock').value='0';$('description').value='';$('imageFile').value='';$('enabled').checked=true;$('preview').style.display='none';$('preview').removeAttribute('src');$('formMsg').innerHTML=''}async function logout(){await sb.auth.signOut();location.reload()}(async()=>{const{data}=await sb.auth.getUser();if(data.user)open(data.user)})();</script></body></html>
