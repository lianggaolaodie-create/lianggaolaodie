<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🛍️ 周邊商品管理後台｜老爹・涼糕</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f7f2eb;color:#3d2a20;margin:0}.wrap{max-width:1100px;margin:auto;padding:18px 14px 60px}.box{background:#fff;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #00000010}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{margin:7px 0}.field label{display:block;font-weight:800;margin-bottom:5px}input,textarea,select,button{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;font:inherit}textarea{min-height:90px}button{background:#3d2a20;color:#fff;cursor:pointer;font-weight:800}.secondary{background:#75685f}.danger{background:#a32e29}.edit{background:#b57a45}.row{display:flex;gap:8px}.row>*{flex:1}.item{border:1px solid #eee;border-radius:14px;padding:14px;margin:10px 0}.item img{width:110px;height:110px;object-fit:cover;border-radius:12px}.muted{color:#765f51}.pill{display:inline-block;background:#f1e7de;border-radius:99px;padding:4px 9px;font-size:13px}.status{margin-top:8px}.category-list{display:flex;gap:8px;flex-wrap:wrap}.category{background:#f6eee7;border-radius:12px;padding:10px 14px;font-weight:800}.order{border:1px solid #eadfd4;border-radius:14px;padding:14px;margin:10px 0}.order select{margin-top:6px}.msg{padding:10px;border-radius:10px;margin-top:8px;background:#f6eee7}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{flex-direction:column}}</style></head><body><div class="wrap"><div class="box"><h1>🛍️ 周邊商品管理後台</h1><div id="who" class="muted">尚未登入</div><div id="login"><input id="email" type="email" placeholder="管理員 Email"><input id="password" type="password" placeholder="密碼"><button onclick="login()">登入</button></div><div id="app" style="display:none"><button class="secondary" onclick="logout()">登出</button></div><div id="msg"></div></div><main id="main" style="display:none"><section class="box"><h2>商品管理</h2><div class="grid"><div class="field"><label>📝 商品名稱</label><input id="name" placeholder="例如：老爹涼糕短T"></div><div class="field"><label>商品分類</label><select id="category"></select></div><div class="field"><label>📄 商品介紹</label><textarea id="desc" placeholder="商品介紹"></textarea></div><div class="field"><label>💰 商品價格</label><input id="price" type="number" min="0" step="1"></div><div class="field"><label>📦 庫存數量</label><input id="stock" type="number" min="0" step="1"></div><div class="field"><label>🖼️ 上傳商品照片</label><input id="photo" type="file" accept="image/*"></div></div><label><input id="enabled" type="checkbox" style="width:auto"> 🔘 上架／下架</label><div class="row"><button id="saveBtn" onclick="saveProduct()">➕ 新增商品</button><button class="secondary" onclick="clearForm()">清除／取消編輯</button></div><div id="formMsg"></div></section><section class="box"><h2>商品分類</h2><div class="category-list"><span class="category">👕 衣服</span><span class="category">🧢 帽子</span><span class="category">🧥 外套</span><span class="category">🧺 毛巾</span><span class="category">🎁 其他周邊</span></div></section><section class="box"><h2>商品清單</h2><div id="products">載入中…</div></section><section class="box"><h2>📋 周邊商品訂單</h2><div class="muted">可直接更新訂單狀態、付款狀態與出貨狀態。</div><div id="orders">載入中…</div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let editId=null;async function login(){const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return $('msg').innerHTML='<div class="msg error">登入失敗：'+esc(error.message)+'</div>';const{data:p,error:pe}=await sb.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',data.user.id).maybeSingle();if(pe||!p?.enabled||!(p.role==='super_admin'||p.can_manage_products===true)){$('msg').innerHTML='<div class="msg error">此帳號沒有周邊商品管理權限。</div>';await sb.auth.signOut();return}$('login').style.display='none';$('app').style.display='block';$('main').style.display='block';$('who').textContent='目前權限：'+p.role;await loadAll()}async function logout(){await sb.auth.signOut();location.reload()}async function loadCats(){const{data,error}=await sb.from('merch_categories').select('id,name').eq('enabled',true).order('id');if(error)return $('category').innerHTML='<option>分類載入失敗</option>'; $('category').innerHTML=(data||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}async function loadProducts(){const{data,error}=await sb.from('merch_products').select('id,name,description,price,stock_quantity,image_url,enabled,category_id,merch_categories(name)').order('id',{ascending:false});if(error)return $('products').innerHTML='<div class="msg error">'+esc(error.message)+'</div>';if(!data?.length)return $('products').innerHTML='<p class="muted">尚無商品。</p>';$('products').innerHTML=data.map(p=>`<div class="item">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:''}<h3>${esc(p.name)}</h3><div>分類：${esc(p.merch_categories?.name||'未分類')}</div><p>${esc(p.description||'')}</p><div>💰 $${Number(p.price||0).toLocaleString()}　📦 庫存：${p.stock_quantity}</div><div class="status">${p.enabled?'🟢 上架':'⚪ 下架'}</div><div class="row" style="margin-top:9px"><button class="edit" onclick="editProduct(${p.id})">✏️ 編輯</button><button onclick="toggleProduct(${p.id},${!p.enabled})">${p.enabled?'下架':'上架'}</button><button class="danger" onclick="deleteProduct(${p.id})">🗑️ 刪除</button></div></div>`).join('')}async function saveProduct(){const name=$('name').value.trim();if(!name)return alert('請輸入商品名稱');const f=$('photo').files[0];let imageUrl=null;if(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase();const path=Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const up=await sb.storage.from('merch-images').upload(path,f,{upsert:false});if(up.error)return alert('照片上傳失敗：'+up.error.message);imageUrl=sb.storage.from('merch-images').getPublicUrl(path).data.publicUrl}const payload={name,category_id:$('category').value?Number($('category').value):null,description:$('desc').value.trim(),price:Number($('price').value||0),stock_quantity:Number($('stock').value||0),enabled:$('enabled').checked,updated_at:new Date().toISOString()};if(imageUrl)payload.image_url=imageUrl;const r=editId?await sb.from('merch_products').update(payload).eq('id',editId):await sb.from('merch_products').insert(payload);if(r.error)return alert('儲存失敗：'+r.error.message);$('formMsg').innerHTML='<div class="msg ok">商品已儲存。</div>';clearForm();await loadProducts()}async function editProduct(id){const{data,error}=await sb.from('merch_products').select('*').eq('id',id).single();if(error||!data)return;editId=id;$('name').value=data.name||'';$('category').value=data.category_id||'';$('desc').value=data.description||'';$('price').value=data.price||0;$('stock').value=data.stock_quantity||0;$('enabled').checked=!!data.enabled;$('saveBtn').textContent='📝 儲存編輯';$('formMsg').innerHTML='<div class="msg">✏️ 正在編輯「'+esc(data.name)+'」</div>';window.scrollTo({top:0,behavior:'smooth'})}async function toggleProduct(id,on){const r=await sb.from('merch_products').update({enabled:on,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert(r.error.message);await loadProducts()}async function deleteProduct(id){if(!confirm('確定刪除商品？'))return;const r=await sb.from('merch_products').delete().eq('id',id);if(r.error)return alert('刪除失敗：'+r.error.message);await loadProducts()}function clearForm(){$('name').value='';$('desc').value='';$('price').value='';$('stock').value='';$('enabled').checked=false;$('photo').value='';editId=null;$('saveBtn').textContent='➕ 新增商品'}const statusText={pending:'待處理',confirmed:'已確認',preparing:'製作中',shipped:'已出貨',completed:'已完成',cancelled:'已取消'},payText={unpaid:'未付款',proof_submitted:'已提交付款證明',confirmed:'已付款確認',rejected:'付款遭拒'},shipText={unprepared:'未備貨',preparing:'備貨中',shipped:'已出貨',delivered:'已送達'};async function updateOrder(id,field,value){const r=await sb.from('merch_orders').update({[field]:value,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return alert('更新失敗：'+r.error.message);await loadOrders()}async function loadOrders(){const{data,error}=await sb.from('merch_orders').select('id,order_number,product_total,total_amount,status,payment_status,shipment_status,created_at,merch_order_items(product_name,quantity,subtotal)').order('created_at',{ascending:false});if(error)return $('orders').innerHTML='<div class="msg error">'+esc(error.message)+'</div>';if(!data?.length)return $('orders').innerHTML='<p class="muted">尚無周邊商品訂單。</p>';$('orders').innerHTML=data.map(o=>`<div class="order"><h3>📋 ${esc(o.order_number)}</h3><div>商品／數量：${(o.merch_order_items||[]).map(i=>esc(i.product_name)+' × '+i.quantity).join('、')||'—'}</div><div>訂單金額：$${Number(o.total_amount||0).toLocaleString()}</div><label>訂單狀態<select onchange="updateOrder(${o.id},'status',this.value)">${Object.entries(statusText).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}</select></label><label>付款狀態<select onchange="updateOrder(${o.id},'payment_status',this.value)">${Object.entries(payText).map(([k,v])=>`<option value="${k}" ${o.payment_status===k?'selected':''}>${v}</option>`).join('')}</select></label><label>出貨狀態<select onchange="updateOrder(${o.id},'shipment_status',this.value)">${Object.entries(shipText).map(([k,v])=>`<option value="${k}" ${o.shipment_status===k?'selected':''}>${v}</option>`).join('')}</select></label></div>`).join('')}async function loadAll(){await loadCats();await loadProducts();await loadOrders()}(async()=>{const r=await sb.auth.getUser();if(r.data.user)login()})()</script></body></html>
