<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>🛍️ 周邊商品管理後台｜老爹・涼糕</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;background:#f7f2eb;color:#3d2a20;margin:0;padding:20px}.wrap{max-width:1100px;margin:auto}.box{background:#fff;border-radius:20px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #00000010}h1,h2{margin-top:0}input,textarea,select,button{width:100%;padding:11px;border:1px solid #ddd;border-radius:10px;margin:6px 0;box-sizing:border-box;font:inherit}button{background:#3d2a20;color:#fff;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{border:1px solid #eee;border-radius:14px;padding:14px;margin:10px 0}.muted{color:#765f51}.row{display:flex;gap:8px}.row button{flex:1}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{flex-direction:column}}</style></head><body><div class="wrap"><div class="box"><h1>🛍️ 周邊商品管理後台</h1><div id="login"><input id="email" type="email" placeholder="管理員 Email"><input id="password" type="password" placeholder="密碼"><button onclick="login()">登入</button></div><div id="app" style="display:none"><p id="who"></p><button onclick="logout()">登出</button></div><div id="msg" class="muted"></div></div><div id="main" style="display:none"><section class="box"><h2>商品管理</h2><div class="grid"><input id="name" placeholder="📝 商品名稱"><select id="category"></select><textarea id="desc" placeholder="📄 商品介紹"></textarea><input id="price" type="number" min="0" step="1" placeholder="💰 商品價格"><input id="stock" type="number" min="0" step="1" placeholder="📦 庫存數量"><input id="photo" type="file" accept="image/*"></div><label><input id="enabled" type="checkbox" style="width:auto"> 🔘 上架</label><div class="row"><button onclick="saveProduct()">➕ 新增商品</button><button onclick="clearForm()">清除</button></div></section><section class="box"><h2>商品分類</h2><p>👕 衣服　🧢 帽子　🧥 外套　🧺 毛巾　🎁 其他周邊</p></section><section class="box"><h2>商品清單</h2><div id="products">載入中…</div></section><section class="box"><h2>📋 周邊商品訂單</h2><div id="orders">載入中…</div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');let editId=null;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function login(){const{data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)return $('msg').textContent=error.message;const{data:p}=await sb.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',data.user.id).maybeSingle();if(!p?.enabled||!(p.role==='super_admin'||p.can_manage_products)){$('msg').textContent='此帳號沒有周邊商品管理權限。';await sb.auth.signOut();return} $('login').style.display='none';$('app').style.display='block';$('main').style.display='block';$('who').textContent='目前權限：'+p.role;await loadAll()}async function logout(){await sb.auth.signOut();location.reload()}async function loadCats(){const{data}=await sb.from('merch_categories').select('id,name').eq('enabled',true).order('id');$('category').innerHTML=(data||[]).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}async function loadProducts(){const{data,error}=await sb.from('merch_products').select('id,name,description,price,stock_quantity,image_url,enabled,category_id,merch_categories(name)').order('id',{ascending:false});if(error)return $('products').textContent=error.message;$('products').innerHTML=(data||[]).map(p=>`<div class="item">${p.image_url?`<img src="${esc(p.image_url)}" style="width:110px;height:110px;object-fit:cover;border-radius:12px">`:''}<h3>${esc(p.name)}</h3><div>分類：${esc(p.merch_categories?.name||'未分類')}</div><div>${esc(p.description||'')}</div><div>💰 $${p.price}　📦 庫存：${p.stock_quantity}　${p.enabled?'🟢 上架':'⚪ 下架'}</div><div class="row"><button onclick="editProduct(${p.id})">✏️ 修改</button><button onclick="toggleProduct(${p.id},${!p.enabled})">${p.enabled?'下架':'上架'}</button><button onclick="deleteProduct(${p.id})">🗑️ 刪除</button></div></div>`).join('')||'<p>尚無商品。</p>'}async function saveProduct(){const name=$('name').value.trim();if(!name)return alert('請輸入商品名稱');let imageUrl=null;const f=$('photo').files[0];if(f){const path=Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+(f.name.split('.').pop()||'jpg');const up=await sb.storage.from('merch-images').upload(path,f,{upsert:false});if(up.error)return alert('照片上傳失敗：'+up.error.message);imageUrl=sb.storage.from('merch-images').getPublicUrl(path).data.publicUrl}const payload={name,category_id:$('category').value||null,description:$('desc').value.trim(),price:Number($('price').value||0),stock_quantity:Number($('stock').value||0),enabled:$('enabled').checked,updated_at:new Date().toISOString()};if(imageUrl)payload.image_url=imageUrl;let r=editId?await sb.from('merch_products').update(payload).eq('id',editId):await sb.from('merch_products').insert(payload);if(r.error)return alert(r.error.message);clearForm();await loadProducts()}async function editProduct(id){const{data}=await sb.from('merch_products').select('*').eq('id',id).single();if(!data)return;editId=id;$('name').value=data.name;$('category').value=data.category_id||'';$('desc').value=data.description||'';$('price').value=data.price;$('stock').value=data.stock_quantity;$('enabled').checked=data.enabled;window.scrollTo({top:0,behavior:'smooth'})}async function toggleProduct(id,on){const r=await sb.from('merch_products').update({enabled:on,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);await loadProducts()}async function deleteProduct(id){if(!confirm('確定刪除商品？'))return;const r=await sb.from('merch_products').delete().eq('id',id);if(r.error)alert(r.error.message);await loadProducts()}function clearForm(){editId=null;$('name').value='';$('desc').value='';$('price').value='';$('stock').value='';$('enabled').checked=false;$('photo').value=''}async function loadOrders(){const{data,error}=await sb.from('merch_orders').select('id,order_number,product_total,total_amount,status,payment_status,shipment_status,created_at,merch_order_items(product_name,quantity,subtotal)').order('created_at',{ascending:false});if(error)return $('orders').textContent=error.message;$('orders').innerHTML=(data||[]).map(o=>`<div class="item"><h3>訂單 ${esc(o.order_number)}</h3><div>商品／數量：${(o.merch_order_items||[]).map(i=>esc(i.product_name)+' × '+i.quantity).join('、')||'—'}</div><div>訂單金額：$${o.total_amount}</div><div>訂單狀態：${esc(o.status)}</div><div>付款狀態：${esc(o.payment_status)}</div><div>出貨狀態：${esc(o.shipment_status)}</div></div>`).join('')||'<p>尚無周邊商品訂單。</p>'}async function loadAll(){await loadCats();await loadProducts();await loadOrders()} </script></body></html>
