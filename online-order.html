<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>老爹・涼糕｜線上訂購</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf7f2;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;padding-bottom:40px}.wrap{max-width:760px;margin:auto;padding:14px}.top{background:#fff;border:1px solid #e7ddd5;border-radius:20px;padding:18px;margin-bottom:14px}.brand{font-size:24px;font-weight:900}.steps{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.step{background:#f1e8df;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:800}.card{background:#fff;border:1px solid #e7ddd5;border-radius:20px;padding:18px;margin:14px 0}.card h2{margin:0 0 14px;font-size:25px}.field{margin:12px 0}.field label{display:block;font-weight:900;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #d8ccc1;border-radius:12px;background:#fff;font:inherit}.field textarea{min-height:90px;resize:vertical}.hint{background:#f7eee6;border-radius:14px;padding:13px;color:#6e5b4f;font-size:14px}.flavors{display:grid;grid-template-columns:1fr 1fr;gap:9px}.flavor{border:1px solid #e5dbd2;border-radius:14px;padding:12px;display:grid;grid-template-columns:28px 1fr auto;gap:7px;align-items:center}.flavor input{width:21px;height:21px}.flavor b{font-size:16px}.price{color:#75675f;font-weight:800}.qty{width:70px!important;padding:8px!important;text-align:center}.pickup{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pickup label{border:1px solid #e5dbd2;border-radius:14px;padding:14px;display:block}.pickup input{margin-right:7px}.btn{width:100%;border:0;border-radius:14px;padding:15px;background:#9b5c38;color:#fff;font-size:18px;font-weight:900}.btn:disabled{opacity:.55}.total{display:flex;justify-content:space-between;align-items:center;font-size:19px;font-weight:900;margin-top:14px}.total strong{font-size:28px}.msg{margin-top:12px;padding:13px;border-radius:12px;background:#fff0ef;color:#a33b32}.ok{background:#edf8f1;color:#286d47}.hidden{display:none!important}.back{display:inline-block;margin-bottom:8px;color:#6c4a36;text-decoration:none;font-weight:800}@media(max-width:600px){.flavors,.pickup{grid-template-columns:1fr}.flavor{grid-template-columns:28px 1fr 68px}.wrap{padding:10px}.card{padding:15px}}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><a class="back" href="index.html">← 回到官網</a><div class="brand">🛒 線上訂購</div><div style="margin-top:6px;color:#766b64">新鮮製作的涼糕，請依當日開放地區與口味下單。</div><div class="steps"><span class="step">① 選日期</span><span class="step">② 選涼糕</span><span class="step">③ 填資料</span><span class="step">④ 匯款付款</span><span class="step">⑤ 管理員確認後成立</span></div></div>
<section class="card"><h2>📅 配送日期</h2><div class="field"><label>選擇日期</label><input id="date" type="date"></div><div id="dateHint" class="hint">請選擇配送日期。</div><div class="field"><label>配送地區</label><select id="region"><option value="">請先選擇日期</option></select></div></section>
<section class="card"><h2>🍡 選擇涼糕口味</h2><div id="flavors" class="flavors"><div class="hint">請先選擇日期與配送地區。</div></div></section>
<section class="card"><h2>🏪 冷藏寄放方式</h2><div class="pickup"><label><input type="radio" name="pickup" value="familymart" checked> <b>全家冷藏寄放</b><br><small>寄放費 NT$30</small></label><label><input type="radio" name="pickup" value="seven_eleven"> <b>7-ELEVEN 冷藏寄放</b><br><small>寄放費 NT$45</small></label></div><div class="field"><label>取貨門市</label><input id="store" placeholder="例如：復興鄉請洽官方 LINE 確認門市"></div></section>
<section class="card"><h2>👤 訂購資料</h2><div class="field"><label>姓名</label><input id="name" autocomplete="name" placeholder="請輸入姓名"></div><div class="field"><label>電話</label><input id="phone" type="tel" autocomplete="tel" placeholder="請輸入手機號碼"></div><div class="field"><label>備註</label><textarea id="note" placeholder="例如：特殊需求、聯絡方式等"></textarea></div></section>
<section class="card"><div class="total"><span>商品小計＋寄放費</span><strong id="total">NT$ 0</strong></div><button id="submit" class="btn" style="margin-top:14px">送出訂單</button><div id="msg"></div></section>
<section id="result" class="card hidden"><h2>✅ 訂單已建立</h2><div id="resultText"></div><div class="hint" style="margin-top:12px">請依頁面指示完成匯款，並保留匯款末五碼。訂單需經管理員確認後成立。</div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);let regions=[],flavors=[],selectedDate='';
function msg(t,ok=false){$('msg').className=ok?'msg ok':'msg';$('msg').textContent=t}
function fee(){return document.querySelector('input[name=pickup]:checked')?.value==='familymart'?30:45}
function renderTotal(){let sum=fee();document.querySelectorAll('.qty').forEach(q=>sum+=Number(q.dataset.price||0)*Number(q.value||0));$('total').textContent='NT$ '+sum.toLocaleString()}
async function loadDates(){const r=await sb.from('daily_delivery_regions').select('delivery_date,region_name').eq('enabled',true).order('delivery_date',{ascending:true});if(r.error){msg('日期讀取失敗：'+r.error.message);return}regions=r.data||[];const dates=[...new Set(regions.map(x=>x.delivery_date))];if(dates.length){$('date').min=dates[0];$('date').value=dates[0];await loadRegions()}else{$('dateHint').textContent='目前沒有已開放的配送日期，請稍後再查看。';$('region').innerHTML='<option value="">目前沒有開放地區</option>'}}
async function loadRegions(){selectedDate=$('date').value;const list=regions.filter(x=>x.delivery_date===selectedDate);$('dateHint').textContent=list.length?'當日配送地區：'+list.map(x=>x.region_name).join('、'):'此日期目前沒有開放配送地區。';$('region').innerHTML='<option value="">請選擇配送地區</option>'+list.map(x=>'<option value="'+esc(x.region_name)+'">'+esc(x.region_name)+'</option>').join('');$('flavors').innerHTML='<div class="hint">請先選擇配送地區。</div>';if(list.length){$('region').value=list[0].region_name;await loadFlavors()}}
async function loadFlavors(){const d=$('date').value,reg=$('region').value;if(!d||!reg){$('flavors').innerHTML='<div class="hint">請先選擇日期與配送地區。</div>';return}const r=await sb.from('daily_flavors').select('flavor_id').eq('delivery_date',d).eq('enabled',true);if(r.error){msg('口味讀取失敗：'+r.error.message);return}const ids=(r.data||[]).map(x=>x.flavor_id);if(!ids.length){$('flavors').innerHTML='<div class="hint">此日期目前沒有開放口味。</div>';return}const q=await sb.from('flavors').select('id,name,price').eq('enabled',true).in('id',ids).order('id');if(q.error){msg('口味讀取失敗：'+q.error.message);return}flavors=q.data||[];$('flavors').innerHTML=flavors.map(f=>'<label class="flavor"><input type="checkbox" data-id="'+f.id+'"><span><b>'+esc(f.name)+'</b><br><span class="price">NT$ '+Number(f.price).toLocaleString()+'</span></span><input class="qty" data-id="'+f.id+'" data-price="'+Number(f.price)+'" type="number" min="0" max="99" value="0"></label>').join('');document.querySelectorAll('.flavor input[type=checkbox]').forEach(c=>c.onchange=()=>{const q=document.querySelector('.qty[data-id="'+c.dataset.id+'"]');if(c.checked&&Number(q.value)===0)q.value=1;if(!c.checked)q.value=0;renderTotal()});document.querySelectorAll('.qty').forEach(q=>q.oninput=()=>{const c=document.querySelector('.flavor input[type=checkbox][data-id="'+q.dataset.id+'"]');c.checked=Number(q.value)>0;renderTotal()});renderTotal()}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function submitOrder(){msg('');const date=$('date').value,region=$('region').value,store=$('store').value.trim(),name=$('name').value.trim(),phone=$('phone').value.trim(),note=$('note').value.trim(),pickup=document.querySelector('input[name=pickup]:checked')?.value;if(!date||!region)return msg('請選擇配送日期與地區。');if(!store)return msg('請填寫取貨門市。');if(!name||!phone)return msg('請填寫姓名與電話。');const items=[...document.querySelectorAll('.qty')].map(q=>({flavor_id:Number(q.dataset.id),quantity:Number(q.value)})).filter(x=>x.quantity>0);if(!items.length)return msg('請至少選擇一項涼糕。');$('submit').disabled=true;$('submit').textContent='訂單建立中…';try{const r=await sb.rpc('create_customer_order',{p_delivery_date:date,p_delivery_region:region,p_pickup_type:pickup,p_pickup_store:store,p_customer_name:name,p_customer_phone:phone,p_customer_note:note||null,p_items:items});if(r.error)throw r.error;const x=r.data;$('result').classList.remove('hidden');$('resultText').innerHTML='<b>訂單編號：</b>'+esc(x.order_number)+'<br><b>訂單金額：</b>NT$ '+Number(x.total_amount).toLocaleString()+'<br><b>付款狀態：</b>尚未付款';$('result').scrollIntoView({behavior:'smooth'});msg('訂單已建立，請依後續付款方式完成匯款。',true)}catch(e){msg('訂單送出失敗：'+(e.message||e))}finally{$('submit').disabled=false;$('submit').textContent='送出訂單'}}
$('date').onchange=loadRegions;$('region').onchange=loadFlavors;document.querySelectorAll('input[name=pickup]').forEach(x=>x.onchange=renderTotal);$('submit').onclick=submitOrder;loadDates();renderTotal();
</script>
</body>
</html>
