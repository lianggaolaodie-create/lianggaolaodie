<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>老爹．涼糕｜線上訂購</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f7f1ea;color:#33251d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
.wrap{max-width:760px;margin:auto;padding:18px 14px 48px}
.top,.card{background:#fff;border:1px solid #e6dbd1;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #5b3d2510}
.brand{font-size:25px;font-weight:900}.muted{color:#786d65;font-size:13px;line-height:1.6}
h1,h2{margin:0 0 10px}h2{font-size:20px}
.closed{padding:14px;border-radius:14px;background:#fff0ef;color:#a33c35;font-weight:800}
.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #d9cec6;border-radius:12px;background:#fff;font:inherit}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice label{border:1px solid #ded2c8;border-radius:14px;padding:14px;cursor:pointer;background:#fff}
.choice label:has(input:checked){border-color:#8d5939;background:#fff7f0;box-shadow:0 0 0 2px #8d593922}.choice input{margin-right:7px}
.method{display:grid;grid-template-columns:1fr 1fr;gap:12px}.method label{border:1px solid #ded2c8;border-radius:16px;padding:18px;cursor:pointer;background:#fff;display:block;text-align:center;font-weight:900}
.method label:has(input:checked){border-color:#c25a86;background:#fff0f6;box-shadow:0 0 0 2px #c25a8622}.method input{position:absolute;opacity:0}.method .icon{font-size:32px;display:block;margin-bottom:7px}.method .sub{display:block;font-size:13px;color:#786d65;font-weight:700;margin-top:4px}
.flavor{display:grid;grid-template-columns:92px 1fr auto;gap:13px;align-items:center;border:1px solid #e8ded6;border-radius:15px;padding:10px;margin:9px 0;background:#fff}
.flavor-img{width:92px;height:92px;border-radius:12px;object-fit:cover;background:#f3ece6;border:1px solid #eadfd7}.flavor-img.empty{display:flex;align-items:center;justify-content:center;color:#9a8d83;font-size:12px}
.flavor b{display:block;font-size:17px}.price{display:block;font-size:14px;color:#8d5939;font-weight:800;margin-top:4px}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:36px;height:36px;border:0;border-radius:10px;background:#eee5de;color:#4a392f;font-size:21px;font-weight:900}.qty span{min-width:28px;text-align:center;font-weight:900}
.summary{background:#fffaf4;border:1px solid #eadbcd;border-radius:15px;padding:14px}.sumrow{display:flex;justify-content:space-between;padding:5px 0}.total{font-size:24px;font-weight:900;color:#8d5939;border-top:1px solid #e6d7c9;margin-top:8px;padding-top:10px}
.btn{width:100%;border:0;border-radius:14px;padding:14px;background:#8d5939;color:#fff;font-size:17px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.5}
.notice{margin-top:10px;padding:12px;border-radius:12px}.ok{background:#edf8f1;color:#286c47}.err{background:#fff0ef;color:#a43b35}
.result{display:none}.result.show{display:block}.order-number{font-size:28px;font-weight:900;color:#8d5939;letter-spacing:1px}.req{color:#a33c35}.bank{background:#f5eee8;border-radius:14px;padding:13px;line-height:1.8}.line-link{font-weight:900;color:#8d5939;text-decoration:none}
.mode-note{padding:12px 14px;border-radius:13px;background:#fff7f0;margin-top:10px;font-weight:800;color:#6e4c38}.hidden{display:none!important}
@media(max-width:560px){.flavor{grid-template-columns:78px 1fr}.flavor-img{width:78px;height:78px}.flavor .qty{grid-column:2;justify-content:flex-end}.choice,.method{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand" id="pageTitle">🍡 老爹．涼糕｜線上訂購</div>
    <div class="muted">請先選擇配送方式，再選日期、地區、口味與數量。</div>
  </div>
  <div id="closed" class="card closed hidden"></div>
  <form id="orderForm">
    <div class="card">
      <h2>① 選擇配送方式</h2>
      <div class="method">
        <label><input type="radio" name="mode" value="home_delivery"><span class="icon">🏠</span>送到府<span class="sub">貨到付款</span></label>
        <label><input type="radio" name="mode" value="convenience"><span class="icon">🏪</span>超商冷藏寄放<span class="sub">需先匯款</span></label>
      </div>
      <div id="modeNote" class="mode-note">請先選擇「送到府」或「超商冷藏寄放」。</div>
    </div>
    <div class="card"><h2>② 選擇配送日期</h2><div class="field"><label>日期 <span class="req">*</span></label><select id="orderDate" required><option value="">請選擇開放日期</option></select></div></div>
    <div class="card"><h2>③ 選擇配送地區</h2><div class="field"><label>地區 <span class="req">*</span></label><select id="region" required><option value="">請先選擇日期</option></select></div></div>
    <div class="card"><h2>④ 選擇口味與數量</h2><div id="flavors"></div><div id="flavorEmpty" class="muted hidden">此日期尚未開放口味。</div></div>
    <div id="homeFields" class="card hidden"><h2>⑤ 送到府資料</h2><div class="field"><label>收件地址 <span class="req">*</span></label><input id="homeAddress" placeholder="請填寫完整收件地址"></div><div class="mode-note">🏠 付款方式：貨到付款</div></div>
    <div id="storeFields" class="card hidden">
      <h2>⑤ 超商冷藏寄放</h2><div id="pickupChoices" class="choice"></div>
      <div class="field"><label>門市名稱 <span class="req">*</span></label><input id="storeName" placeholder="例如：台北○○店"></div>
      <div class="field"><label>門市地址（可填）</label><input id="storeAddress" placeholder="方便核對門市"></div>
      <div class="bank">🏪 超商寄放需先匯款。<br>全家寄放費 NT$ <span id="familyFee">30</span>；7-ELEVEN 寄放費 NT$ <span id="sevenFee">45</span>。<br>官方 LINE：<a class="line-link" href="https://line.me/R/ti/p/@502iugah" target="_blank" rel="noopener">@502iugah｜點此聯絡</a></div>
      <div class="field"><label>匯款後五碼 <span class="req">*</span></label><input id="last5" maxlength="5" minlength="5" pattern="[0-9]{5}" inputmode="numeric" placeholder="請填 5 位數字"></div>
    </div>
    <div class="card"><h2>⑥ 收件人資料</h2><div class="field"><label>姓名 <span class="req">*</span></label><input id="customerName" required maxlength="80"></div><div class="field"><label>手機 <span class="req">*</span></label><input id="customerPhone" required maxlength="30" inputmode="tel"></div><div class="field"><label>備註</label><textarea id="notes" rows="3" maxlength="500" placeholder="其他需要告知我們的事項"></textarea></div></div>
    <div class="card"><h2>⑦ 訂單金額</h2><div class="summary"><div class="sumrow"><span>涼糕總數</span><b id="totalQty">0 盒</b></div><div class="sumrow"><span>涼糕小計</span><b>NT$ <span id="productTotal">0</span></b></div><div class="sumrow"><span id="feeLabel">配送／寄放費</span><b>NT$ <span id="storageFee">0</span></b></div><div class="sumrow total"><span>應付總額</span><span>NT$ <span id="grandTotal">0</span></span></div></div><button class="btn" id="submitBtn" type="submit" style="margin-top:14px">送出訂單</button><div id="msg"></div></div>
  </form>
  <div id="result" class="card result"><h2>訂單已建立</h2><p id="resultIntro"></p><div id="resultOrder" class="order-number"></div><div id="resultDetail" class="muted" style="margin-top:10px"></div><button class="btn" type="button" onclick="location.reload()" style="margin-top:14px">重新訂購</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://yemzdwxtyosuaczsqwea.supabase.co';
const SUPABASE_KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);let flavors=[],fees={familymart:30,seven:45};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});function mode(){return document.querySelector('input[name=mode]:checked')?.value||''}
function setMsg(text,error=false){$('msg').innerHTML='<div class="notice '+(error?'err':'ok')+'">'+esc(text)+'</div>'}function setClosed(text){$('closed').textContent=text;$('closed').classList.remove('hidden');$('orderForm').classList.add('hidden')}
function selectedItems(){return flavors.map((f,i)=>({flavor_id:Number(f.flavor_id),flavor_name:f.flavor_name,product_name:f.product_name||'涼糕',unit_price:Number(f.price||0),quantity:Number($('q'+i)?.textContent||0)})).filter(x=>x.quantity>0)}
function updateTotals(){const items=selectedItems(),qty=items.reduce((s,x)=>s+x.quantity,0),product=items.reduce((s,x)=>s+x.unit_price*x.quantity,0),m=mode(),radio=document.querySelector('input[name=pickup]:checked'),fee=m==='convenience'&&radio?Number(radio.dataset.fee||0):0;$('totalQty').textContent=qty+' 盒';$('productTotal').textContent=product.toLocaleString();$('storageFee').textContent=fee.toLocaleString();$('grandTotal').textContent=(product+fee).toLocaleString();$('feeLabel').textContent=m==='convenience'?'超商寄放費':'配送費'}
function renderFlavors(){$('flavors').innerHTML=flavors.map((f,i)=>'<div class="flavor">'+(f.image_url?'<img class="flavor-img" src="'+esc(f.image_url)+'" alt="'+esc(f.flavor_name)+'" loading="lazy">':'<div class="flavor-img empty">暫無圖片</div>')+'<div><b>'+esc(f.product_name||'涼糕')+'／'+esc(f.flavor_name)+'</b><span class="price">NT$ '+Number(f.price||0).toLocaleString()+'</span></div><div class="qty"><button type="button" onclick="changeQty('+i+',-1)">−</button><span id="q'+i+'">0</span><button type="button" onclick="changeQty('+i+',1)">＋</button></div></div>').join('');$('flavorEmpty').classList.toggle('hidden',flavors.length>0)}
function changeQty(i,n){const e=$('q'+i);e.textContent=Math.max(0,Math.min(99,Number(e.textContent||0)+n));updateTotals()}
async function loadDates(){const {data,error}=await sb.from('daily_order_settings').select('order_date,ordering_enabled').eq('ordering_enabled',true).gte('order_date',today()).order('order_date').limit(60);if(error)return setClosed('開放日期讀取失敗，請稍後再試。');$('orderDate').innerHTML='<option value="">請選擇開放日期</option>'+(data||[]).map(x=>'<option value="'+esc(x.order_date)+'">'+esc(x.order_date)+'</option>').join('');if(data?.length){$('orderDate').value=data[0].order_date;await loadDateData()}else setClosed('目前沒有開放的線上訂購日期。')}
async function loadDateData(){const d=$('orderDate').value;if(!d)return;const [rs,fs,master]=await Promise.all([sb.from('daily_order_regions').select('region_name').eq('order_date',d).eq('enabled',true).order('id'),sb.from('daily_order_flavors').select('id,flavor_id,product_name,flavor_name,price').eq('order_date',d).eq('enabled',true).order('id'),sb.from('flavors').select('id,image_url').eq('enabled',true)]);if(rs.error||fs.error)return setMsg('日期資料讀取失敗，請重新整理。',true);$('region').innerHTML='<option value="">請選擇開放地區</option>'+(rs.data||[]).map(r=>'<option>'+esc(r.region_name)+'</option>').join('');const imageMap=Object.fromEntries((master.data||[]).map(x=>[Number(x.id),x.image_url]));flavors=(fs.data||[]).map(f=>({...f,image_url:imageMap[Number(f.flavor_id)]||''}));renderFlavors();updateTotals()}
async function loadPickupSettings(){const {data,error}=await sb.from('pickup_settings').select('familymart_enabled,familymart_fee,seven_eleven_enabled,seven_eleven_fee').limit(1).maybeSingle();if(error||!data)return;fees={familymart:Number(data.familymart_fee||30),seven:Number(data.seven_eleven_fee||45)};$('familyFee').textContent=fees.familymart;$('sevenFee').textContent=fees.seven;const choices=[];if(data.familymart_enabled)choices.push('<label><input type="radio" name="pickup" value="familymart" data-fee="'+fees.familymart+'" required> 全家冷藏寄放<br><b>NT$ '+fees.familymart+'</b></label>');if(data.seven_eleven_enabled)choices.push('<label><input type="radio" name="pickup" value="seven_eleven" data-fee="'+fees.seven+'" required> 7-ELEVEN 冷藏寄放<br><b>NT$ '+fees.seven+'</b></label>');$('pickupChoices').innerHTML=choices.join('')||'<div class="muted">目前沒有開放的超商寄放方式。</div>';document.querySelectorAll('input[name=pickup]').forEach(x=>x.addEventListener('change',updateTotals))}
function applyMode(){const m=mode();$('homeFields').classList.toggle('hidden',m!=='home_delivery');$('storeFields').classList.toggle('hidden',m!=='convenience');$('homeAddress').required=m==='home_delivery';$('storeName').required=m==='convenience';$('last5').required=m==='convenience';$('pageTitle').textContent=m==='home_delivery'?'🏠 老爹．涼糕｜送到府訂購':m==='convenience'?'🏪 老爹．涼糕｜超商寄放訂購':'🍡 老爹．涼糕｜線上訂購';$('modeNote').textContent=m==='home_delivery'?'🏠 送到府｜貨到付款':m==='convenience'?'🏪 超商冷藏寄放｜先匯款，再填寫匯款後五碼':'請先選擇「送到府」或「超商冷藏寄放」。';updateTotals()}
$('orderDate').addEventListener('change',loadDateData);document.querySelectorAll('input[name=mode]').forEach(x=>x.addEventListener('change',applyMode));
$('orderForm').addEventListener('submit',async e=>{e.preventDefault();$('submitBtn').disabled=true;$('msg').innerHTML='';try{const m=mode();if(!m)throw new Error('請選擇配送方式。');const date=$('orderDate').value;if(!date)throw new Error('請選擇配送日期。');const region=$('region').value;if(!region)throw new Error('請選擇配送地區。');const items=selectedItems();if(!items.length)throw new Error('請至少選擇 1 盒涼糕。');const itemPayload=items.map(x=>({flavor_id:x.flavor_id,quantity:x.quantity}));let result;if(m==='home_delivery'){const r=await sb.rpc('create_customer_order',{p_delivery_date:date,p_delivery_region:region,p_pickup_type:'home_delivery',p_pickup_store:$('homeAddress').value.trim(),p_customer_name:$('customerName').value.trim(),p_customer_phone:$('customerPhone').value.trim(),p_customer_note:$('notes').value.trim()||null,p_items:itemPayload});if(r.error)throw r.error;result=r.data;$('resultIntro').textContent='送到府訂單已建立，付款方式為貨到付款。'}else{const radio=document.querySelector('input[name=pickup]:checked');if(!radio)throw new Error('請選擇全家或 7-ELEVEN。');const last5=$('last5').value.trim();if(!/^\d{5}$/.test(last5))throw new Error('匯款後五碼必須是 5 位數字。');const productTotal=items.reduce((s,x)=>s+x.unit_price*x.quantity,0),fee=Number(radio.dataset.fee||0);const r=await sb.rpc('create_cooling_pickup_order',{p_name:$('customerName').value.trim(),p_phone:$('customerPhone').value.trim(),p_order_date:date,p_region_name:region,p_convenience_store:radio.value,p_store_name:$('storeName').value.trim(),p_store_address:$('storeAddress').value.trim()||null,p_merchandise_total:productTotal,p_storage_fee:fee,p_total_amount:productTotal+fee,p_payment_last5:last5,p_notes:$('notes').value.trim()||null,p_items:itemPayload});if(r.error)throw r.error;result=Array.isArray(r.data)?r.data[0]:r.data;$('resultIntro').textContent='超商冷藏寄放訂單已建立，請確認匯款後五碼已填寫正確。'}$('resultOrder').textContent=result?.order_number||'';$('resultDetail').innerHTML='應付總額：<b>NT$ '+Number(result?.total_amount||0).toLocaleString()+'</b><br>配送日期：'+esc(date)+'<br>配送地區：'+esc(region);$('orderForm').classList.add('hidden');$('result').classList.add('show');window.scrollTo({top:0,behavior:'smooth'})}catch(err){setMsg(err?.message||'訂單送出失敗，請稍後再試。',true);$('submitBtn').disabled=false}});
(async()=>{await loadPickupSettings();await loadDates()})();
</script>
</body>
</html>
