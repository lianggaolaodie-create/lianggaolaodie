<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(async()=>{
 const grid=document.getElementById('productGrid');
 const fallback={

 const desc={
  '抹茶巧克力':'上層抹茶皮搭配下層巧克力皮，抹茶清香與巧克力濃郁風味交織。','布丁芋頭':'上下布丁皮包住香濃芋頭餡，滑順奶香與芋頭香氣一次享受。','抹茶芋頭':'上下抹茶皮搭配細緻芋頭餡，茶香清爽、芋頭香甜。','仙草芋頭':'上下仙草皮搭配香濃芋頭餡，仙草清香與芋頭甘甜自然融合。','伯爵芋頭':'香濃芋頭搭配伯爵茶香，Q彈滑嫩、香甜順口。','鹹蛋芋頭':'芋頭甘甜與鹹蛋黃濃郁鹹香交織，鹹甜有層次。','雞蛋布丁':'蛋香與奶香融入Q彈涼糕，柔嫩香甜。','黑糖芋頭':'黑糖焦香搭配芋頭甘甜，香氣濃郁又不膩。','水果綜合':'多種水果風味交織，清爽酸甜、Q彈開胃。','仙草':'仙草清香、滑嫩Q彈，冰冰涼涼最清爽。','杏仁芋頭':'杏仁濃香與芋頭甘甜融合，雙重香氣更有層次。','純杏仁':'自然杏仁香氣搭配細緻Q彈口感，清爽順口。','泰式奶茶':'濃郁茶香與奶香交織，冰涼Q彈、香甜不膩。'};
