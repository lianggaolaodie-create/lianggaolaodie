<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜管理後台</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f1ed;color:#2c2520;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.shell{min-height:100vh;display:flex}.side{width:240px;background:#211b17;color:#fff;padding:24px 16px;position:fixed;inset:0 auto 0 0}.brand{font-size:21px;font-weight:900;padding:10px 12px 25px}.nav button{width:100%;border:0;background:transparent;color:#d9d0c9;text-align:left;padding:13px 14px;border-radius:12px;font-size:15px;margin:3px 0}.nav button.active,.nav button:hover{background:#8e5738;color:#fff}.main{margin-left:240px;width:calc(100% - 240px);padding:28px;max-width:1400px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:28px}.muted{color:#7d736c;font-size:13px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e6ddd5;border-radius:18px;padding:20px;box-shadow:0 3px 14px #00000008}.kpi .label{color:#776d65;font-size:13px}.kpi .num{font-size:30px;font-weight:900;margin-top:7px}.section{margin-top:18px}.section h2{font-size:18px;margin:0 0 14px}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-top:1px solid #eee7e1}.btn{border:0;border-radius:10px;background:#8e5738;color:#fff;padding:10px 14px;font-weight:800}.btn.gray{background:#eee8e2;color:#3b342f}.btn.red{background:#b33a32}.login{position:fixed;inset:0;background:#f5f1ed;display:grid;place-items:center}.login .box{width:min(420px,calc(100% - 30px));background:#fff;border-radius:22px;padding:28px;box-shadow:0 10px 40px #0001}.field{margin:13px 0}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #d9cec5;border-radius:11px;font-size:16px}.login .btn{width:100%;padding:14px;margin-top:6px}.page{display:none}.page.show{display:block}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid #eee7e1;font-size:14px}.low{font-weight:900}.err{color:#b4312d;margin-top:10px}.ok{color:#28734b;margin-top:10px}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:18px;z-index:10}.modal.show{display:grid}.modalbox{width:min(520px,100%);background:#fff;border-radius:20px;padding:24px;max-height:90vh;overflow:auto}.modalbox h2{margin-top:0}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1}@media(max-width:800px){.side{width:72px;padding:18px 8px}.brand{font-size:0;text-align:center}.brand:after{content:'🍡';font-size:24px}.nav button{font-size:0;text-align:center}.nav button:before{content:'•';font-size:22px}.main{margin-left:72px;width:calc(100% - 72px);padding:18px}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.cards{grid-template-columns:1fr 1fr}.top h1{font-size:22px}.card{padding:15px}}</style></head><body><div id="login" class="login"><div class="box"><div style="font-size:30px">🍡</div><h1>老爹・涼糕</h1><p class="muted">獨立管理後台</p><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" onclick="signIn()">登入後台</button><div id="loginMsg"></div></div></div><div id="app" class="shell" style="display:none"><aside class="side"><div class="brand">🍡 老爹・涼糕<br><span style="font-size:12px;color:#aaa;font-weight:500">管理後台</span></div><nav class="nav"><button class="active" onclick="show('home',this)">總覽</button><button onclick="show('products',this)">商品管理</button><button onclick="show('stock',this)">庫存管理</button><button onclick="show('sales',this)">銷售紀錄</button><button onclick="show('barcode',this)">條碼管理</button><button onclick="signOut()">登出</button></nav></aside><main class="main"><div class="top"><div><h1 id="title">後台總覽</h1><span class="muted" id="who"></span></div><span class="muted">老爹・涼糕 Admin</span></div><section id="home" class="page show"><div class="cards"><div class="card kpi"><div class="label">今日營業額</div><div class="num" id="revenue">$0</div></div><div class="card kpi"><div class="label">今日售出</div><div class="num" id="sold">0</div></div><div class="card kpi"><div class="label">商品數</div><div class="num" id="count">0</div></div><div class="card kpi"><div class="label">低庫存</div><div class="num" id="low">0</div></div></div><div class="section card"><h2>目前庫存</h2><div id="homeStock"></div></div></section><section id="products" class="page"><div class="card"><h2>商品管理</h2><button class="btn" onclick="openProduct()">＋ 新增商品</button><div id="productList" style="margin-top:12px"></div></div></section><section id="stock" class="page"><div class="card"><h2>庫存管理</h2><div id="stockList"></div></div></section><section id="sales" class="page"><div class="card"><h2>銷售紀錄</h2><div id="salesList"></div></div></section><section id="barcode" class="page"><div class="card"><h2>條碼管理</h2><p class="muted">每個商品的口味與 CODE 128 條碼會與商品資料綁定。</p><div id="barcodeList"></div></div></section></main></div><div id="productModal" class="modal"><div class="modalbox"><h2 id="modalTitle">新增商品</h2><input id="editId" type="hidden"><div class="field"><label>商品名稱</label><input id="pname" placeholder="例如：水果綜合涼糕"></div><div class="field"><label>🍡 口味</label><input id="pflavor" placeholder="例如：百香果、抹茶、西瓜"></div><div class="field"><label>價格</label><input id="pprice" type="number" min="0" value="100"></div><div class="field"><label>庫存</label><input id="pstock" type="number" min="0" step="1" value="0"></div><div class="field"><label>🔢 條碼</label><input id="pbarcode" placeholder="例如：LAO10006"><div class="muted">新增時留白會自動產生 LAO 條碼；編輯時可直接修改。</div></div><div id="modalMsg"></div><div class="actions"><button class="btn gray" onclick="closeProduct()">取消</button><button class="btn" onclick="saveProduct()">儲存商品</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);let products=[],sales=[];function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}async function signIn(){const{data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return $('loginMsg').innerHTML='<div class="err">登入失敗</div>';const{data:p}=await db.from('admin_profiles').select('role,enabled,can_manage_food_truck').eq('user_id',data.user.id).maybeSingle();if(!p||!p.enabled||!(p.role==='super_admin'||p.can_manage_food_truck)){await db.auth.signOut();return $('loginMsg').innerHTML='<div class="err">此帳號沒有管理後台權限</div>'}$('login').style.display='none';$('app').style.display='flex';$('who').textContent=data.user.email||'';load()}async function signOut(){await db.auth.signOut();location.reload()}function show(id,btn){document.querySelectorAll('.page').forEach(x=>x.classList.remove('show'));$(id).classList.add('show');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));btn?.classList.add('active');$('title').textContent={home:'後台總覽',products:'商品管理',stock:'庫存管理',sales:'銷售紀錄',barcode:'條碼管理'}[id]}async function load(){let r=await db.from('food_truck_products').select('*').eq('active',true).order('product_name');products=r.data||[];const d=new Date();d.setHours(0,0,0,0);r=await db.from('food_truck_sales').select('*').gte('sold_at',d.toISOString()).order('sold_at',{ascending:false});sales=r.data||[];const revenue=sales.reduce((a,x)=>a+x.total_amount,0),sold=sales.reduce((a,x)=>a+x.quantity,0);$('revenue').textContent='$'+revenue.toLocaleString();$('sold').textContent=sold;$('count').textContent=products.length;$('low').textContent=products.filter(x=>x.stock<=5).length;$('homeStock').innerHTML=products.map(x=>'<div class="row"><span>'+esc(x.product_name)+(x.flavor?'　<span class="muted">'+esc(x.flavor)+'</span>':'')+'</span><b class="'+(x.stock<=5?'low':'')+'">'+x.stock+' 盒</b></div>').join('')||'<span class="muted">尚無商品</span>';$('productList').innerHTML=products.map(x=>'<div class="row"><div><b>'+esc(x.product_name)+'</b><div class="muted">🍡 '+esc(x.flavor||'未設定口味')+'　$'+x.price+'　🔢 '+esc(x.barcode)+'</div></div><span><button class="btn gray" onclick="openProduct('+x.id+')">編輯</button></span></div>').join('');$('stockList').innerHTML=products.map(x=>'<div class="row"><span>'+esc(x.product_name)+'<div class="muted">'+esc(x.flavor||'未設定口味')+'</div></span><span><b class="'+(x.stock<=5?'low':'')+'">'+x.stock+' 盒</b> <button class="btn gray" onclick="restock('+x.id+','+x.stock+')">修改</button></span></div>').join('');$('salesList').innerHTML=sales.map(x=>'<div class="row"><div><b>'+esc(x.product_name)+'</b><div class="muted">'+new Date(x.sold_at).toLocaleString('zh-TW')+'</div></div><span>×'+x.quantity+'　$'+x.total_amount+'</span></div>').join('')||'<span class="muted">今天尚無銷售</span>';$('barcodeList').innerHTML=products.map(x=>'<div class="row"><div><b>'+esc(x.product_name)+'</b><div class="muted">🍡 '+esc(x.flavor||'未設定口味')+'</div></div><b>'+esc(x.barcode)+'</b></div>').join('')}async function restock(id,current){const v=prompt('請輸入最新庫存數量',current);if(v===null)return;const n=Number(v);if(!Number.isInteger(n)||n<0)return alert('請輸入正確數字');const{error}=await db.from('food_truck_products').update({stock:n,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else load()}async function openProduct(id){$('modalMsg').innerHTML='';$('editId').value=id||'';$('modalTitle').textContent=id?'編輯商品':'新增商品';if(!id){$('pname').value='';$('pflavor').value='';$('pprice').value=100;$('pstock').value=0;$('pbarcode').value='';$('productModal').classList.add('show');return}const x=products.find(p=>p.id===id);if(!x)return;$('pname').value=x.product_name||'';$('pflavor').value=x.flavor||'';$('pprice').value=x.price??100;$('pstock').value=x.stock??0;$('pbarcode').value=x.barcode||'';$('productModal').classList.add('show')}function closeProduct(){$('productModal').classList.remove('show')}async function saveProduct(){const id=$('editId').value;const name=$('pname').value.trim();const flavor=$('pflavor').value.trim();const price=Number($('pprice').value);const stock=Number($('pstock').value);let barcode=$('pbarcode').value.trim();if(!name)return $('modalMsg').innerHTML='<div class="err">請輸入商品名稱</div>';if(!flavor)return $('modalMsg').innerHTML='<div class="err">請輸入口味</div>';if(!Number.isFinite(price)||price<0)return $('modalMsg').innerHTML='<div class="err">價格不正確</div>';if(!Number.isInteger(stock)||stock<0)return $('modalMsg').innerHTML='<div class="err">庫存必須是 0 以上整數</div>';if(!barcode){const{data}=await db.from('food_truck_products').select('barcode');const nums=(data||[]).map(x=>Number(String(x.barcode||'').replace('LAO',''))).filter(Number.isFinite);barcode='LAO'+(Math.max(10000,...nums)+1)}let error;if(id){({error}=await db.from('food_truck_products').update({product_name:name,flavor,price,stock,barcode,updated_at:new Date().toISOString()}).eq('id',Number(id)))}else{({error}=await db.from('food_truck_products').insert({product_name:name,flavor,price,stock,barcode,active:true}))}if(error)return $('modalMsg').innerHTML='<div class="err">儲存失敗：'+esc(error.message)+'</div>';$('modalMsg').innerHTML='<div class="ok">商品已儲存</div>';setTimeout(()=>{closeProduct();load()},300)}(async()=>{const{data}=await db.auth.getUser();if(data.user){const{data:p}=await db.from('admin_profiles').select('role,enabled,can_manage_food_truck').eq('user_id',data.user.id).maybeSingle();if(p?.enabled&&(p.role==='super_admin'||p.can_manage_food_truck)){$('login').style.display='none';$('app').style.display='flex';$('who').textContent=data.user.email||'';load()}}})();</script></body></html>
