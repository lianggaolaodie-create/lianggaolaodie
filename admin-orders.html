<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹．涼糕｜線上下單管理後台</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.shell{max-width:1200px;margin:auto;padding:16px}.top,.card{background:#fff;border:1px solid #e7ddd5;border-radius:18px;padding:18px;margin-bottom:14px}.brand{font-size:22px;font-weight:900}.muted{color:#766b64;font-size:13px;line-height:1.6}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.nav button{white-space:nowrap;border:0;border-radius:11px;padding:11px 15px;background:#ebe4de;color:#5a4940;font-weight:800}.nav button.active{background:#8d5939;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d9cec6;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:10px 14px;background:#8d5939;color:#fff;font-weight:800;cursor:pointer}.btn.gray{background:#6d625b}.btn.red{background:#a63d36}.btn.green{background:#357653}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.toolbar h2{margin:0}.notice{padding:10px;border-radius:10px;margin-top:10px}.ok{background:#edf8f1;color:#286c47}.err{background:#fff0ef;color:#a43b35}.hidden{display:none!important}.list{display:grid;gap:8px;margin-top:10px}.row{border:1px solid #e8ded7;border-radius:13px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-size:12px;background:#eee7e1;margin-right:5px}.on{background:#e7f5ec;color:#2d714c}.off{background:#f6e9e7;color:#a13c35}.order{border:1px solid #e8ded7;border-radius:14px;padding:14px;margin-top:10px}.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid #e7ddd5;border-radius:13px;padding:13px}.stat b{display:block;font-size:24px;margin-top:4px}.items{margin-top:10px;border-top:1px solid #eee4dc}.item{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #e3d8cf}.tablewrap{overflow-x:auto;margin-top:12px}.ctable{width:100%;border-collapse:collapse;min-width:760px}.ctable th{background:#8d5939;color:#fff;padding:11px;text-align:left;white-space:nowrap}.ctable td{padding:11px;border-bottom:1px solid #eee4dc;vertical-align:middle}.ctable tr:hover td{background:#fbf8f5}.empty{text-align:center;padding:42px 16px;color:#766b64}.login{max-width:520px;margin:60px auto}@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.ctable{min-width:720px}}</style></head><body><div id="loginView" class="shell login"><div class="card"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><p class="muted">商品／口味、每日開放、訂單與個資管理。</p><form id="loginForm"><div class="field"><label>管理員 Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" id="loginBtn">登入</button></form><div id="loginMsg"></div></div></div><div id="app" class="shell hidden"><div class="top"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><div id="userText" class="muted"></div></div><div class="nav"><button class="active" data-page="daily">📅 每日開放設定</button><button data-page="orders">🧾 訂單管理</button><button data-page="customers">👤 個資管理</button></div><section id="daily" class="page"><div class="card"><div class="toolbar"><h2>每日開放設定</h2><button class="btn" id="saveDaily">儲存今日設定</button></div><div class="grid"><div class="field"><label>日期</label><input id="orderDate" type="date"></div><div class="field"><label>今日線上訂購</label><select id="orderingEnabled"><option value="true">開放</option><option value="false">關閉</option></select></div></div><div id="dailyMsg"></div></div><div class="card"><div class="toolbar"><h2>當日開放地區</h2><button class="btn gray" id="addRegion">＋新增地區</button></div><div id="regionList" class="list"></div></div><div class="card"><h2>當日開放口味</h2><p class="muted">口味全部從「商品／口味管理」主資料帶入；商品名稱、口味名稱、基本價格、口味 ID 都會串接。</p><div id="flavorList" class="list"></div></div></section><section id="orders" class="page hidden"><div class="card"><div class="toolbar"><h2>訂單管理</h2><button class="btn gray" id="reloadOrders">重新整理</button></div><div class="stats" style="margin-top:12px"><div class="stat">今日訂單<b id="statToday">0</b></div><div class="stat">待確認匯款<b id="statPending">0</b></div><div class="stat">已付款<b id="statPaid">0</b></div><div class="stat">已寄放<b id="statStored">0</b></div></div><div id="orderList"></div></div></section><section id="customers" class="page hidden"><div class="card"><div class="toolbar"><h2>個資管理</h2><button class="btn gray" id="reloadCustomers">重新整理</button></div><p class="muted">顯示客人填寫的姓名、電話、門市與匯款後五碼，並可刪除個資資料。</p><div id="customerList"></div></div></section><div class="card"><button class="btn gray" id="logout">登出</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});let master=[],daily=[],regions=[];function note(id,t,e=false){$(id).innerHTML=t?'<div class="notice '+(e?'err':'ok')+'">'+esc(t)+'</div>':''}async function access(u){const r=await db.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',u.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'管理員帳號目前已停用';if(r.data.role!=='super_admin'&&!r.data.can_manage_products&&r.data.role!=='order_admin'&&r.data.role!=='personal_data_admin')return'此帳號沒有管理權限';return null}$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const er=await access(r.data.user);if(er){await db.auth.signOut();throw Error(er)}openApp(r.data.user)}catch(x){note('loginMsg','登入失敗：'+x.message,true)}finally{$('loginBtn').disabled=false}};function openApp(u){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('userText').textContent='已登入 · '+u.email;$('orderDate').value=today();loadMaster();loadDaily()}async function loadMaster(){const r=await db.from('flavors').select('id,product_name,name,price,image_url,enabled').order('id');if(r.error)return note('dailyMsg','讀取商品／口味主資料失敗：'+r.error.message,true);master=r.data||[];renderFlavors()}async function loadDaily(){const d=$('orderDate').value||today();const [s,r,f]=await Promise.all([db.from('daily_order_settings').select('*').eq('order_date',d).maybeSingle(),db.from('daily_order_regions').select('*').eq('order_date',d).order('id'),db.from('daily_order_flavors').select('*').eq('order_date',d).order('id')]);if(s.error||r.error||f.error)return note('dailyMsg','讀取每日設定失敗。',true);$('orderingEnabled').value=s.data?.ordering_enabled===false?'false':'true';regions=r.data||[];daily=f.data||[];renderRegions();renderFlavors()}$('orderDate').onchange=loadDaily;$('addRegion').onclick=()=>{const n=prompt('輸入地區名稱');if(n?.trim()){regions.push({region_name:n.trim(),enabled:true});renderRegions()}};function renderRegions(){$('regionList').innerHTML=regions.map((r,i)=>'<div class="row"><div class="grow"><b>'+esc(r.region_name)+'</b> <span class="badge '+(r.enabled?'on':'off')+'">'+(r.enabled?'今日開放':'未開放')+'</span></div><button class="btn '+(r.enabled?'red':'green')+'" onclick="regions['+i+'].enabled=!regions['+i+'].enabled;renderRegions()">'+(r.enabled?'關閉':'開放')+'</button></div>').join('')||'<div class="muted">尚未設定地區。</div>'}function renderFlavors(){const map=new Map(daily.map(x=>[String(x.flavor_id),x]));const active=master.filter(p=>p.enabled);$('flavorList').innerHTML=active.map(p=>{const d=map.get(String(p.id));const on=!!d?.enabled;const price=d?Number(d.price):Number(p.price||0);return '<div class="row"><div class="grow"><b>'+esc(p.product_name||'涼糕')+'</b>／'+esc(p.name)+'</div><div>口味ID：<b>'+p.id+'</b></div><div><label>今日價格 <input style="width:105px" type="number" min="0" value="'+price+'" onchange="setPrice('+p.id+',this.value)"></label></div><span class="badge '+(on?'on':'off')+'">'+(on?'今日開放':'今日未開放')+'</span><button class="btn '+(on?'red':'green')+'" onclick="toggleFlavor('+p.id+')">'+(on?'關閉':'開放')+'</button></div>'}).join('')||'<div class="muted">沒有啟用中的主資料口味。</div>'}window.setPrice=(id,v)=>{const p=master.find(x=>Number(x.id)===Number(id));let d=daily.find(x=>Number(x.flavor_id)===Number(id));if(!d){d={flavor_id:id,product_name:p.product_name||'涼糕',flavor_name:p.name,price:Number(v||0),enabled:true};daily.push(d)}else d.price=Number(v||0);renderFlavors()};window.toggleFlavor=id=>{const p=master.find(x=>Number(x.id)===Number(id));let d=daily.find(x=>Number(x.flavor_id)===Number(id));if(!d){d={flavor_id:id,product_name:p.product_name||'涼糕',flavor_name:p.name,price:Number(p.price||0),enabled:true};daily.push(d)}else d.enabled=!d.enabled;renderFlavors()};$('saveDaily').onclick=async()=>{const d=$('orderDate').value||today();let r=await db.from('daily_order_settings').upsert({order_date:d,ordering_enabled:$('orderingEnabled').value==='true',updated_at:new Date().toISOString()},{onConflict:'order_date'});if(r.error)return note('dailyMsg','儲存失敗：'+r.error.message,true);await db.from('daily_order_regions').delete().eq('order_date',d);await db.from('daily_order_flavors').delete().eq('order_date',d);const rr=regions.map(x=>({order_date:d,region_name:x.region_name,enabled:x.enabled}));const ff=daily.filter(x=>x.enabled).map(x=>({order_date:d,flavor_id:x.flavor_id,product_name:x.product_name||'涼糕',flavor_name:x.flavor_name,price:Number(x.price||0),enabled:true,quantity:0}));if(rr.length){r=await db.from('daily_order_regions').insert(rr);if(r.error)return note('dailyMsg','地區儲存失敗：'+r.error.message,true)}if(ff.length){r=await db.from('daily_order_flavors').insert(ff);if(r.error)return note('dailyMsg','口味儲存失敗：'+r.error.message,true)}note('dailyMsg','已儲存；每日開放已與商品／口味主資料串接。');await loadDaily()};function statusClass(s){return ['已付款','已寄放','已完成'].includes(s)?'on':s==='已取消'?'off':''}async function loadOrders(){const r=await db.from('cooling_pickup_orders').select('id,order_number,order_date,region_name,convenience_store,store_name,store_address,merchandise_total,storage_fee,total_amount,payment_last5,status,notes,created_at,customer_id').order('created_at',{ascending:false}).limit(200);if(r.error)return $('orderList').innerHTML='<div class="notice err">讀取訂單失敗：'+esc(r.error.message)+'</div>';const os=r.data||[];$('statToday').textContent=os.filter(o=>o.order_date===today()).length;$('statPending').textContent=os.filter(o=>o.status==='待確認匯款').length;$('statPaid').textContent=os.filter(o=>o.status==='已付款').length;$('statStored').textContent=os.filter(o=>o.status==='已寄放').length;const ids=os.map(o=>o.id);let items=[];if(ids.length){const ir=await db.from('cooling_pickup_order_items').select('order_id,product_name,flavor_id,flavor_name,unit_price,quantity,line_total').in('order_id',ids);if(!ir.error)items=ir.data||[]}const byOrder=new Map();items.forEach(x=>{if(!byOrder.has(x.order_id))byOrder.set(x.order_id,[]);byOrder.get(x.order_id).push(x)});$('orderList').innerHTML=os.map(o=>{const its=byOrder.get(o.id)||[];return '<div class="order"><div class="orderhead"><span>訂單 '+esc(o.order_number)+'</span><select onchange="changeStatus('+o.id+',this.value)"><option '+(o.status==='待確認匯款'?'selected':'')+'>待確認匯款</option><option '+(o.status==='已付款'?'selected':'')+'>已付款</option><option '+(o.status==='製作中'?'selected':'')+'>製作中</option><option '+(o.status==='已出貨'?'selected':'')+'>已出貨</option><option '+(o.status==='已寄放'?'selected':'')+'>已寄放</option><option '+(o.status==='已取貨'?'selected':'')+'>已取貨</option><option '+(o.status==='已完成'?'selected':'')+'>已完成</option><option '+(o.status==='已取消'?'selected':'')+'>已取消</option></select></div><div style="margin-top:8px">'+esc(o.order_date)+' · '+esc(o.region_name)+' · '+esc(o.convenience_store)+' · '+esc(o.store_name)+'</div><div class="items">'+(its.length?its.map(x=>'<div class="item"><span>'+esc(x.product_name||'涼糕')+'／'+esc(x.flavor_name)+'（ID '+esc(x.flavor_id)+'）</span><span>$'+Number(x.unit_price||0)+' × '+Number(x.quantity||0)+' = $'+Number(x.line_total||0)+'</span></div>').join(''):'<div class="muted">無明細</div>')+'</div><div style="margin-top:10px">涼糕數量：<b>'+its.reduce((a,x)=>a+Number(x.quantity||0),0)+'</b>盒　商品小計：<b>$'+Number(o.merchandise_total||0)+'</b>　寄放費：<b>$'+Number(o.storage_fee||0)+'</b>　應付總額：<b>$'+Number(o.total_amount||0)+'</b>　後五碼：<b>'+esc(o.payment_last5)+'</b></div></div>'}).join('')||'<div class="empty">目前沒有訂單</div>'}window.changeStatus=async(id,s)=>{const r=await db.from('cooling_pickup_orders').update({status:s,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert('更新失敗：'+r.error.message);else loadOrders()};async function loadCustomers(){const box=$('customerList');box.innerHTML='<div class="muted">讀取中…</div>';const cr=await db.from('order_customers').select('id,name,phone,created_at').order('created_at',{ascending:false});if(cr.error)return box.innerHTML='<div class="notice err">讀取個資失敗：'+esc(cr.error.message)+'</div>';const customers=cr.data||[];if(!customers.length){box.innerHTML='<div class="tablewrap"><table class="ctable"><thead><tr><th>#</th><th>訂單編號</th><th>姓名</th><th>電話</th><th>門市</th><th>匯款後五碼</th><th>操作</th></tr></thead><tbody><tr><td colspan="7" class="empty">目前沒有任何個資資料</td></tr></tbody></table></div>';return}const ids=customers.map(c=>c.id);const or=await db.from('cooling_pickup_orders').select('id,order_number,customer_id,store_name,payment_last5,created_at').in('customer_id',ids).order('created_at',{ascending:false});if(or.error)return box.innerHTML='<div class="notice err">讀取訂單關聯失敗：'+esc(or.error.message)+'</div>';const orders=or.data||[];const byCustomer=new Map();orders.forEach(o=>{if(!byCustomer.has(o.customer_id))byCustomer.set(o.customer_id,[]);byCustomer.get(o.customer_id).push(o)});let rows=[];customers.forEach(c=>{const os=byCustomer.get(c.id)||[null];os.forEach(o=>rows.push({c,o}))});box.innerHTML='<div class="tablewrap"><table class="ctable"><thead><tr><th>#</th><th>訂單編號</th><th>姓名</th><th>電話</th><th>門市</th><th>匯款後五碼</th><th>操作</th></tr></thead><tbody>'+rows.map((x,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(x.o?.order_number||'—')+'</td><td>'+esc(x.c.name||'—')+'</td><td>'+esc(x.c.phone||'—')+'</td><td>'+esc(x.o?.store_name||'—')+'</td><td>'+esc(x.o?.payment_last5||'—')+'</td><td><button class="btn red" onclick="deleteCustomer('+x.c.id+')">🗑 刪除</button></td></tr>').join('')+'</tbody></table></div>'}window.deleteCustomer=async id=>{if(!confirm('確定要刪除此筆個資嗎？訂單資料會保留，但會解除客戶關聯。'))return;const u=await db.from('cooling_pickup_orders').update({customer_id:null,updated_at:new Date().toISOString()}).eq('customer_id',id);if(u.error)return alert('解除訂單關聯失敗：'+u.error.message);const d=await db.from('order_customers').delete().eq('id',id);if(d.error)return alert('刪除個資失敗：'+d.error.message);loadCustomers()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(b.dataset.page).classList.remove('hidden');if(b.dataset.page==='orders')loadOrders();if(b.dataset.page==='customers')loadCustomers()});$('reloadOrders').onclick=loadOrders;$('reloadCustomers').onclick=loadCustomers;$('logout').onclick=()=>db.auth.signOut().then(()=>location.reload());db.auth.getSession().then(r=>{if(r.data.session)access(r.data.session.user).then(er=>{if(!er)openApp(r.data.session.user)})});</script></body></html>
