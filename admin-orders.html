<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>老爹．涼糕｜線上下單管理後台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.shell{max-width:1200px;margin:auto;padding:16px}.top,.card{background:#fff;border:1px solid #e7ddd5;border-radius:18px;padding:18px;margin-bottom:14px}.brand{font-size:22px;font-weight:900}.muted{color:#766b64;font-size:13px}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.nav button{white-space:nowrap;border:0;border-radius:11px;padding:11px 15px;background:#ebe4de;color:#5a4940;font-weight:800}.nav button.active{background:#8d5939;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d9cec6;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:10px 14px;background:#8d5939;color:#fff;font-weight:800;cursor:pointer}.btn.gray{background:#6d625b}.btn.red{background:#a63d36}.btn.green{background:#357653}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.toolbar h2{margin:0}.notice{padding:10px;border-radius:10px;margin-top:10px}.ok{background:#edf8f1;color:#286c47}.err{background:#fff0ef;color:#a43b35}.hidden{display:none!important}.list{display:grid;gap:8px;margin-top:10px}.row{border:1px solid #e8ded7;border-radius:13px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-size:12px;background:#eee7e1;margin-right:5px}.on{background:#e7f5ec;color:#2d714c}.off{background:#f6e9e7;color:#a13c35}.order{border:1px solid #e8ded7;border-radius:14px;padding:14px;margin-top:10px}.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:900}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid #e7ddd5;border-radius:13px;padding:13px}.stat b{display:block;font-size:24px;margin-top:4px}.login{max-width:520px;margin:60px auto}@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="loginView" class="shell login"><div class="card"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><p class="muted">管理每日開放地區、口味、匯款訂單與客戶個資。</p><form id="loginForm"><div class="field"><label>管理員 Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" id="loginBtn">登入</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="shell hidden">
<div class="top"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><div id="userText" class="muted"></div></div>
<div class="nav"><button class="active" data-page="daily">📅 每日開放設定</button><button data-page="orders">🧾 訂單管理</button><button data-page="customers">👤 個資管理</button></div>
<section id="daily" class="page"><div class="card"><div class="toolbar"><h2>每日開放設定</h2><button class="btn" onclick="saveDaily()">儲存今日設定</button></div><div class="grid"><div class="field"><label>日期</label><input id="orderDate" type="date"></div><div class="field"><label>今日線上訂購</label><select id="orderingEnabled"><option value="true">開放</option><option value="false">關閉</option></select></div></div><div id="dailyMsg"></div></div>
<div class="card"><div class="toolbar"><h2>當日開放地區</h2><button class="btn gray" onclick="addRegion()">＋新增地區</button></div><div id="regionList" class="list"></div></div>
<div class="card"><div class="toolbar"><h2>當日開放口味</h2><button class="btn gray" onclick="addFlavor()">＋新增口味</button></div><div id="flavorList" class="list"></div></div>
<div class="card"><h2>匯款資訊</h2><p>付款方式：<b>僅接受匯款</b></p><p>訂單送出前必須填寫 <b>匯款後五碼</b>。</p><p>匯款資料提供官方 LINE：<b>@502iugah</b></p></div></section>
<section id="orders" class="page hidden"><div class="card"><div class="toolbar"><h2>訂單管理</h2><button class="btn gray" onclick="loadOrders()">重新整理</button></div><div class="stats" style="margin-top:12px"><div class="stat">今日訂單<b id="statToday">0</b></div><div class="stat">待確認匯款<b id="statPending">0</b></div><div class="stat">已付款<b id="statPaid">0</b></div><div class="stat">已寄放<b id="statStored">0</b></div></div><div id="orderList"></div></div></section>
<section id="customers" class="page hidden"><div class="card"><div class="toolbar"><h2>個資管理</h2><button class="btn gray" onclick="loadCustomers()">重新整理</button></div><p class="muted">姓名與手機僅供訂單管理使用；一般列表採遮罩顯示。</p><div id="customerList"></div></div></section>
<div class="card"><button class="btn gray" onclick="logout()">登出</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://yemzdwxtyosuaczsqwea.supabase.co';
const SUPABASE_KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});
let regions=[],flavors=[];
function notice(id,text,error=false){$(id).innerHTML='<div class="notice '+(error?'err':'ok')+'">'+esc(text)+'</div>'}
async function access(user){const r=await sb.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',user.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'管理員帳號目前已停用';if(r.data.role!=='super_admin'&&!r.data.can_manage_products)return'此帳號沒有管理權限';return null}
async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const e=await access(r.data.user);if(e){await sb.auth.signOut();throw new Error(e)}openApp(r.data.user)}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;try{await login()}catch(x){notice('loginMsg','登入失敗：'+x.message,true)}finally{$('loginBtn').disabled=false}};
function openApp(user){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('userText').textContent='已登入 · '+user.email;$('orderDate').value=today();loadDaily()}
function showPage(p){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(p).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===p));if(p==='orders')loadOrders();if(p==='customers')loadCustomers();if(p==='daily')loadDaily()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
async function loadDaily(){const d=$('orderDate').value||today();const s=await sb.from('daily_order_settings').select('*').eq('order_date',d).maybeSingle();if(s.error)return notice('dailyMsg','讀取設定失敗：'+s.error.message,true);$('orderingEnabled').value=s.data?.ordering_enabled===false?'false':'true';const r=await sb.from('daily_order_regions').select('*').eq('order_date',d).order('id');const f=await sb.from('daily_order_flavors').select('*').eq('order_date',d).order('id');if(r.error||f.error)return notice('dailyMsg','讀取地區／口味失敗。',true);regions=r.data||[];flavors=f.data||[];renderRegions();renderFlavors();}
$('orderDate').onchange=loadDaily;
function renderRegions(){$('regionList').innerHTML=regions.map((r,i)=>'<div class="row"><div><b>'+esc(r.region_name)+'</b> <span class="badge '+(r.enabled?'on':'off')+'">'+(r.enabled?'今日開放':'未開放')+'</span></div><div><button class="btn '+(r.enabled?'red':'green')+'" onclick="regions['+i+'].enabled=!regions['+i+'].enabled;renderRegions()">'+(r.enabled?'關閉':'開放')+'</button></div></div>').join('')||'<div class="muted">尚未設定地區，請新增。</div>'}
function renderFlavors(){$('flavorList').innerHTML=flavors.map((f,i)=>'<div class="row"><div style="flex:1"><b>'+esc(f.flavor_name)+'</b> <span class="badge '+(f.enabled?'on':'off')+'">'+(f.enabled?'今日開放':'未開放')+'</span></div><div style="min-width:110px"><input type="number" min="0" value="'+Number(f.price||0)+'" onchange="flavors['+i+'].price=Number(this.value||0)"></div><button class="btn '+(f.enabled?'red':'green')+'" onclick="flavors['+i+'].enabled=!flavors['+i+'].enabled;renderFlavors()">'+(f.enabled?'關閉':'開放')+'</button></div>').join('')||'<div class="muted">尚未設定口味，請新增。</div>'}
function addRegion(){const n=prompt('輸入地區名稱');if(!n?.trim())return;regions.push({order_date:$('orderDate').value,region_name:n.trim(),enabled:true});renderRegions()}
function addFlavor(){const n=prompt('輸入口味名稱');if(!n?.trim())return;const p=Number(prompt('輸入價格，例如 100 或 150')||0);flavors.push({order_date:$('orderDate').value,flavor_name:n.trim(),price:p,enabled:true});renderFlavors()}
async function saveDaily(){const d=$('orderDate').value||today();const s=await sb.from('daily_order_settings').upsert({order_date:d,ordering_enabled:$('orderingEnabled').value==='true',updated_at:new Date().toISOString()},{onConflict:'order_date'}).select().single();if(s.error)return notice('dailyMsg','儲存失敗：'+s.error.message,true);await sb.from('daily_order_regions').delete().eq('order_date',d);await sb.from('daily_order_flavors').delete().eq('order_date',d);const r=regions.map(x=>({order_date:d,region_name:x.region_name,enabled:x.enabled}));const f=flavors.map(x=>({order_date:d,flavor_name:x.flavor_name,price:Number(x.price||0),enabled:x.enabled}));if(r.length){const q=await sb.from('daily_order_regions').insert(r);if(q.error)return notice('dailyMsg','地區儲存失敗：'+q.error.message,true)}if(f.length){const q=await sb.from('daily_order_flavors').insert(f);if(q.error)return notice('dailyMsg','口味儲存失敗：'+q.error.message,true)}notice('dailyMsg','已儲存 '+d+' 的開放地區與口味。')}
function statusClass(s){return s==='已完成'||s==='已付款'||s==='已寄放'?'on':s==='已取消'?'off':''}
async function loadOrders(){const r=await sb.from('cooling_pickup_orders').select('id,order_number,order_date,region_name,convenience_store,store_name,merchandise_total,storage_fee,total_amount,payment_last5,status,notes,created_at,customer_id').order('created_at',{ascending:false}).limit(200);if(r.error)return $('orderList').innerHTML='<div class="notice err">讀取訂單失敗：'+esc(r.error.message)+'</div>';const os=r.data||[];$('statToday').textContent=os.filter(o=>o.order_date===today()).length;$('statPending').textContent=os.filter(o=>o.status==='待確認匯款').length;$('statPaid').textContent=os.filter(o=>o.status==='已付款').length;$('statStored').textContent=os.filter(o=>o.status==='已寄放').length;$('orderList').innerHTML=os.map(o=>'<div class="order"><div class="orderhead"><span>'+esc(o.order_number)+'</span><span class="badge '+statusClass(o.status)+'">'+esc(o.status)+'</span></div><div style="margin-top:8px">'+esc(o.order_date)+' · '+esc(o.region_name)+' · '+esc(o.convenience_store)+' · '+esc(o.store_name)+'</div><div style="margin-top:6px">總額 <b>NT$ '+Number(o.total_amount||0).toLocaleString()+'</b>　匯款後五碼 <b>'+esc(o.payment_last5)+'</b></div><div class="muted" style="margin-top:6px">建立：'+new Date(o.created_at).toLocaleString('zh-TW')+'</div><div style="margin-top:9px"><select onchange="updateOrderStatus('+o.id+',this.value)"><option '+(o.status==='待確認匯款'?'selected':'')+'>待確認匯款</option><option '+(o.status==='已付款'?'selected':'')+'>已付款</option><option '+(o.status==='製作中'?'selected':'')+'>製作中</option><option '+(o.status==='已出貨'?'selected':'')+'>已出貨</option><option '+(o.status==='已寄放'?'selected':'')+'>已寄放</option><option '+(o.status==='已取貨'?'selected':'')+'>已取貨</option><option '+(o.status==='已完成'?'selected':'')+'>已完成</option><option '+(o.status==='已取消'?'selected':'')+'>已取消</option></select></div></div>').join('')||'<div class="muted">目前沒有訂單。</div>'}
async function updateOrderStatus(id,status){const r=await sb.from('cooling_pickup_orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert('狀態更新失敗：'+r.error.message);else loadOrders()}
function maskPhone(p){p=String(p||'');return p.length>4?p.slice(0,3)+'****'+p.slice(-2):'****'}
async function loadCustomers(){const r=await sb.from('order_customers').select('id,name,phone,created_at,updated_at').order('created_at',{ascending:false}).limit(300);if(r.error)return $('customerList').innerHTML='<div class="notice err">讀取個資失敗：'+esc(r.error.message)+'</div>';$('customerList').innerHTML=(r.data||[]).map(c=>'<div class="row"><div><b>'+esc(c.name)+'</b><div class="muted">手機：'+esc(maskPhone(c.phone))+'</div></div><div class="muted">建立：'+new Date(c.created_at).toLocaleDateString('zh-TW')+'</div></div>').join('')||'<div class="muted">目前沒有客戶資料。</div>'}
async function logout(){await sb.auth.signOut();location.reload()}
sb.auth.getSession().then(({data})=>{if(data.session)openApp(data.session.user)})
</script>
</body></html>
