<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>老爹．涼糕｜線上下單管理後台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.shell{max-width:1200px;margin:auto;padding:16px}.top,.card{background:#fff;border:1px solid #e7ddd5;border-radius:18px;padding:18px;margin-bottom:14px}.brand{font-size:22px;font-weight:900}.muted{color:#766b64;font-size:13px}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.nav button{white-space:nowrap;border:0;border-radius:11px;padding:11px 15px;background:#ebe4de;color:#5a4940;font-weight:800}.nav button.active{background:#8d5939;color:#fff}.btn{border:0;border-radius:10px;padding:10px 14px;background:#8d5939;color:#fff;font-weight:800;cursor:pointer}.btn.gray{background:#6d625b}.notice{padding:10px;border-radius:10px;margin-top:10px}.ok{background:#edf8f1;color:#286c47}.err{background:#fff0ef;color:#a43b35}.hidden{display:none!important}.order{border:1px solid #e8ded7;border-radius:14px;padding:15px;margin-top:10px}.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:900}.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-size:12px;background:#eee7e1}.on{background:#e7f5ec;color:#2d714c}.off{background:#f6e9e7;color:#a13c35}.items{margin-top:12px;border-top:1px solid #eee3dc;padding-top:10px}.item{display:grid;grid-template-columns:1.5fr .8fr .5fr .8fr;gap:8px;padding:7px 0;border-bottom:1px dashed #e7ddd5}.item b{font-weight:800}.money{text-align:right}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid #e7ddd5;border-radius:13px;padding:13px}.stat b{display:block;font-size:24px;margin-top:4px}.customer{border:1px solid #e8ded7;border-radius:13px;padding:13px;margin-top:10px}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.item{grid-template-columns:1fr 1fr}.money{text-align:left}}
</style>
</head>
<body>
<div id="loginView" class="shell"><div class="card" style="max-width:520px;margin:60px auto"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><p class="muted">管理線上訂單、口味訂購數量、付款與寄放狀態。</p><form id="loginForm"><p><input id="email" type="email" required placeholder="管理員 Email" style="width:100%;padding:12px;border:1px solid #d9cec6;border-radius:10px"></p><p><input id="password" type="password" required placeholder="密碼" style="width:100%;padding:12px;border:1px solid #d9cec6;border-radius:10px"></p><button class="btn" id="loginBtn">登入</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="shell hidden">
<div class="top"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><div id="userText" class="muted"></div></div>
<div class="nav"><button class="active" data-page="orders">🧾 訂單管理</button><button data-page="customers">👤 個資管理</button></div>
<section id="orders" class="page"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2 style="margin:0">訂單管理</h2><button class="btn gray" onclick="loadOrders()">重新整理</button></div><div class="stats" style="margin-top:12px"><div class="stat">今日訂單<b id="statToday">0</b></div><div class="stat">待確認匯款<b id="statPending">0</b></div><div class="stat">已付款<b id="statPaid">0</b></div><div class="stat">已寄放<b id="statStored">0</b></div></div><div id="orderList"></div></div></section>
<section id="customers" class="page hidden"><div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><h2 style="margin:0">個資管理</h2><button class="btn gray" onclick="loadCustomers()">重新整理</button></div><p class="muted">姓名與手機僅供訂單管理使用。</p><div id="customerList"></div></div></section>
<div class="card"><button class="btn gray" onclick="logout()">登出</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://yemzdwxtyosuaczsqwea.supabase.co';
const SUPABASE_KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});
function notice(id,text,error=false){$(id).innerHTML='<div class="notice '+(error?'err':'ok')+'">'+esc(text)+'</div>'}
async function access(user){const r=await sb.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',user.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'管理員帳號目前已停用';if(r.data.role!=='super_admin'&&!r.data.can_manage_products)return'此帳號沒有管理權限';return null}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;try{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const a=await access(r.data.user);if(a){await sb.auth.signOut();throw new Error(a)};$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('userText').textContent='已登入 · '+r.data.user.email;loadOrders()}catch(x){notice('loginMsg','登入失敗：'+x.message,true)}finally{$('loginBtn').disabled=false}};
async function loadOrders(){const r=await sb.from('cooling_pickup_orders').select('id,order_number,order_date,region_name,convenience_store,store_name,store_address,merchandise_total,storage_fee,total_amount,payment_last5,status,notes,created_at,customer_id').order('created_at',{ascending:false}).limit(200);if(r.error)return $('orderList').innerHTML='<div class="notice err">讀取訂單失敗：'+esc(r.error.message)+'</div>';const os=r.data||[];const ids=os.map(o=>o.id);let items=[];if(ids.length){const ir=await sb.from('cooling_pickup_order_items').select('id,order_id,product_name,flavor_id,flavor_name,unit_price,quantity,line_total').in('order_id',ids).order('id');if(ir.error)return $('orderList').innerHTML='<div class="notice err">讀取訂單口味明細失敗：'+esc(ir.error.message)+'</div>';items=ir.data||[]}const grouped={};items.forEach(x=>(grouped[x.order_id]??=[]).push(x));$('statToday').textContent=os.filter(o=>o.order_date===today()).length;$('statPending').textContent=os.filter(o=>o.status==='待確認匯款').length;$('statPaid').textContent=os.filter(o=>o.status==='已付款').length;$('statStored').textContent=os.filter(o=>o.status==='已寄放').length;$('orderList').innerHTML=os.map(o=>{const its=grouped[o.id]||[];const itemHtml=its.length?'<div class="items"><div class="item"><b>商品／口味</b><b>單價</b><b>數量</b><b class="money">小計</b></div>'+its.map(x=>'<div class="item"><div><b>'+esc(x.product_name||'涼糕')+'</b><br><span class="muted">'+esc(x.flavor_name)+(x.flavor_id?' · ID '+esc(x.flavor_id):'')+'</span></div><div>NT$ '+Number(x.unit_price||0).toLocaleString()+'</div><div><b>'+Number(x.quantity||0)+'</b> 盒</div><div class="money">NT$ '+Number(x.line_total||0).toLocaleString()+'</div></div>').join('')+'</div>':'<div class="items muted">此訂單尚無口味明細。</div>';return '<div class="order"><div class="orderhead"><span>訂單編號：'+esc(o.order_number)+'</span><span class="badge '+((o.status==='已付款'||o.status==='已寄放'||o.status==='已完成')?'on':o.status==='已取消'?'off':'')+'">'+esc(o.status)+'</span></div><div style="margin-top:9px">'+esc(o.order_date)+' · '+esc(o.region_name)+' · '+esc(o.convenience_store)+' · '+esc(o.store_name)+'</div>'+itemHtml+'<div style="margin-top:12px"><b>涼糕小計 NT$ '+Number(o.merchandise_total||0).toLocaleString()+'</b>　寄放費 NT$ '+Number(o.storage_fee||0).toLocaleString()+'　<span style="font-size:18px"><b>應付 NT$ '+Number(o.total_amount||0).toLocaleString()+'</b></span></div><div style="margin-top:7px">匯款後五碼：<b>'+esc(o.payment_last5)+'</b></div><div class="muted" style="margin-top:6px">建立：'+new Date(o.created_at).toLocaleString('zh-TW')+'</div><div style="margin-top:10px"><select onchange="updateOrderStatus('+o.id+',this.value)" style="padding:9px;border:1px solid #d9cec6;border-radius:9px">'+['待確認匯款','已付款','製作中','已出貨','已寄放','已取貨','已完成','已取消'].map(s=>'<option '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></div>'+(o.notes?'<div class="muted" style="margin-top:7px">備註：'+esc(o.notes)+'</div>':'')+'</div>'}).join('')||'<div class="muted" style="margin-top:12px">目前沒有訂單。</div>'}
async function updateOrderStatus(id,status){const r=await sb.from('cooling_pickup_orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert('更新失敗：'+r.error.message);else loadOrders()}
async function loadCustomers(){const r=await sb.from('order_customers').select('id,name,phone,created_at,updated_at').order('created_at',{ascending:false}).limit(300);if(r.error)return $('customerList').innerHTML='<div class="notice err">讀取個資失敗：'+esc(r.error.message)+'</div>';$('customerList').innerHTML=(r.data||[]).map(c=>'<div class="customer"><b>'+esc(c.name)+'</b><br>手機：'+esc(c.phone)+'<div class="muted">建立：'+new Date(c.created_at).toLocaleString('zh-TW')+'</div></div>').join('')||'<div class="muted">目前沒有客戶資料。</div>'}
function logout(){sb.auth.signOut().then(()=>location.reload())}document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(b.dataset.page).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x===b));if(b.dataset.page==='orders')loadOrders();if(b.dataset.page==='customers')loadCustomers()});
sb.auth.getSession().then(async x=>{if(x.data.session){const a=await access(x.data.session.user);if(!a){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('userText').textContent='已登入 · '+x.data.session.user.email;loadOrders()}}});
</script></body></html>
