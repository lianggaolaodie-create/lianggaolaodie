<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹．涼糕｜訂單管理</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;margin:0;padding:20px;background:#fafafa;color:#2b211b}h1{font-size:24px;margin:0 0 8px}.sub{color:#666;margin-bottom:20px}.card{border:1px solid #ddd;border-radius:14px;padding:14px;margin:10px 0;background:#fff}.title{font-weight:700;font-size:17px}.muted{color:#666}.total{font-weight:700}.items{margin-top:8px;padding-top:8px;border-top:1px solid #eee}</style></head><body><h1>老爹．涼糕｜訂單管理</h1><p class="sub">冷藏寄放與送到府訂單</p><div id="app">讀取中…</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const money=v=>'$'+Number(v||0).toLocaleString('zh-TW');async function load(){app.innerHTML='讀取中…';const a=await db.from('cooling_pickup_orders').select('*').order('created_at',{ascending:false}).limit(200);const b=await db.from('orders').select('*').eq('pickup_type','home_delivery').order('created_at',{ascending:false}).limit(200);if(a.error||b.error){app.innerHTML='<p>讀取訂單失敗：'+esc(a.error?.message||b.error?.message)+'</p>';return}const pickup=a.data||[],delivery=b.data||[];const ids=delivery.map(o=>o.id);let priv=[],items=[];if(ids.length){const p=await db.from('order_private').select('order_id,customer_name,customer_phone,customer_note,delivery_address').in('order_id',ids);const i=await db.from('order_items').select('order_id,flavor_name,unit_price,quantity,subtotal').in('order_id',ids).order('id',{ascending:true});if(p.error||i.error){app.innerHTML='<p>讀取送到府詳細資料失敗：'+esc(p.error?.message||i.error?.message)+'</p>';return}priv=p.data||[];items=i.data||[]}const pm=new Map(priv.map(x=>[x.order_id,x]));const im=new Map();items.forEach(x=>{if(!im.has(x.order_id))im.set(x.order_id,[]);im.get(x.order_id).push(x)});const deliveryHtml=delivery.length?delivery.map(o=>{const p=pm.get(o.id)||{},its=im.get(o.id)||[];return '<div class="card"><div class="title">'+esc(o.order_number||'')+'</div><div>姓名：'+esc(p.customer_name)+'</div><div>電話：'+esc(p.customer_phone)+'</div><div>送達地址：'+esc(p.delivery_address)+'</div><div>地區：'+esc(o.delivery_region)+'</div><div>送達日期：'+esc(o.delivery_date)+'</div><div class="items">口味與數量：'+(its.length?its.map(x=>esc(x.flavor_name)+' × '+esc(x.quantity)+'（'+money(x.unit_price)+'）').join('<br>'):'—')+'</div><div>商品金額：'+money(o.product_total)+'</div><div>運費：'+money(o.pickup_fee)+'</div><div class="total">總金額：'+money(o.total_amount)+'</div><div>付款方式：貨到付款</div><div>付款狀態：'+esc(o.payment_status)+'</div><div>訂單狀態：'+esc(o.status)+'</div><div>備註：'+esc(p.customer_note)+'</div></div>'}).join(''):'<p>目前沒有送到府訂單。</p>';const pickupHtml=pickup.length?pickup.map(o=>'<div class="card"><div class="title">'+esc(o.order_number||'')+'</div><div>客戶：'+esc(o.customer_id||'')+'</div><div>地區：'+esc(o.region_name)+'</div><div>門市：'+esc(o.convenience_store)+' '+esc(o.store_name)+'</div><div>門市地址：'+esc(o.store_address)+'</div><div>商品金額：'+money(o.merchandise_total)+'</div><div>寄放費：'+money(o.storage_fee)+'</div><div class="total">總金額：'+money(o.total_amount)+'</div><div>狀態：'+esc(o.status)+'</div><div>備註：'+esc(o.notes)+'</div></div>').join(''):'<p>目前沒有冷藏寄放訂單。</p>';app.innerHTML='<h2>🚚 送到府訂單</h2>'+deliveryHtml+'<h2>🏪 冷藏寄放訂單</h2>'+pickupHtml}load();</script></body></html>
