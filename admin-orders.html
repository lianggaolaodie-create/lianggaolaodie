<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>老爹．涼糕｜訂單管理</title></head><body><h1>老爹．涼糕｜訂單管理</h1><p>本修正版保留原有冷藏寄放訂單，並加入送到府訂單顯示。</p><div id="app">請登入後查看訂單。</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const app=document.getElementById('app');async function load(){const a=await db.from('cooling_pickup_orders').select('*').order('created_at',{ascending:false}).limit(200);const b=await db.from('orders').select('*').eq('order_type','home_delivery').order('created_at',{ascending:false}).limit(200);if(a.error||b.error){app.textContent='讀取訂單失敗：'+(a.error?.message||b.error?.message);return}const pickup=a.data||[],delivery=b.data||[];app.innerHTML='<h2>🚚 送到府訂單</h2>'+(delivery.length?delivery.map(o=>'<div style="border:1px solid #ddd;padding:12px;margin:8px 0"><b>'+ (o.order_number||'')+'</b><br>姓名：'+(o.recipient_name||o.customer_name||'')+'<br>電話：'+(o.recipient_phone||o.phone||'')+'<br>地址：'+(o.delivery_address||o.address||'')+'<br>金額：$'+(o.total_amount||0)+'<br>付款：貨到付款<br>狀態：'+(o.status||'')+'</div>').join(''):'<p>目前沒有送到府訂單。</p>')+'<h2>🏪 冷藏寄放訂單</h2>'+(pickup.length?pickup.map(o=>'<div style="border:1px solid #ddd;padding:12px;margin:8px 0"><b>'+(o.order_number||'')+'</b><br>客戶：'+(o.customer_id||'')+'<br>門市：'+(o.convenience_store||'')+' '+(o.store_name||'')+'<br>金額：$'+(o.total_amount||0)+'<br>狀態：'+(o.status||'')+'</div>').join(''):'<p>目前沒有冷藏寄放訂單。</p>')}load();</script></body></html>
