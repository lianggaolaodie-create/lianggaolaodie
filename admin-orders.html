<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹．涼糕｜線上下單管理後台</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.shell{max-width:1200px;margin:auto;padding:16px}.top,.card{background:#fff;border:1px solid #e7ddd5;border-radius:18px;padding:18px;margin-bottom:14px}.brand{font-size:22px;font-weight:900}.muted{color:#766b64;font-size:13px;line-height:1.6}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.nav button{white-space:nowrap;border:0;border-radius:11px;padding:11px 15px;background:#ebe4de;color:#5a4940;font-weight:800}.nav button.active{background:#8d5939;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d9cec6;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:10px 14px;background:#8d5939;color:#fff;font-weight:800;cursor:pointer}.btn.gray{background:#6d625b}.btn.red{background:#a63d36}.btn.green{background:#357653}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.toolbar h2{margin:0}.notice{padding:10px;border-radius:10px;margin-top:10px}.ok{background:#edf8f1;color:#286c47}.err{background:#fff0ef;color:#a43b35}.hidden{display:none!important}.list{display:grid;gap:8px;margin-top:10px}.row{border:1px solid #e8ded7;border-radius:13px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-size:12px;background:#eee7e1;margin-right:5px}.on{background:#e7f5ec;color:#2d714c}.off{background:#f6e9e7;color:#a13c35}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid #e7ddd5;border-radius:13px;padding:13px}.stat b{display:block;font-size:24px;margin-top:4px}.login{max-width:520px;margin:60px auto}.data-table{width:100%;overflow-x:auto;overflow-y:hidden;margin-top:12px;border-radius:12px;-webkit-overflow-scrolling:touch;border:1px solid #e8ded7}.data-head,.data-row{display:grid;gap:0;align-items:center}.order-head,.order-row{grid-template-columns:220px 90px 110px 100px 145px 260px 85px 110px 90px 110px 120px 90px;width:1530px;min-width:1530px}.customer-head,.customer-row{grid-template-columns:210px 100px 125px 170px 110px 155px 100px;width:970px;min-width:970px}.data-head{font-weight:900;color:#fff;background:#8d5939;padding:12px 8px}.data-row{padding:12px 8px;border-top:1px solid #e8ded7;background:#fff}.data-row>div,.data-head>div{padding:0 6px;min-width:0;overflow-wrap:anywhere}.data-head>div{text-align:center}.order-row .order-no{font-weight:900}.order-row .delete,.customer-row .delete{justify-self:center;text-align:center}.order-row .delete .btn,.customer-row .delete .btn{white-space:nowrap;padding:8px 10px}.order-items{display:flex;flex-direction:column;gap:4px}.order-item{font-size:13px;line-height:1.45}.order-status{width:110px;padding:7px 6px;border:1px solid #d9cec6;border-radius:8px;font:inherit}.order-detail{margin-top:12px;border-top:1px solid #eee4dc;padding-top:10px}.order-detail-box{border:1px solid #e8ded7;border-radius:12px;padding:12px;background:#fff;margin-top:8px}.delete{background:#a63d36!important}@media(max-width:760px){.shell{padding:12px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.data-table{overflow-x:auto;width:100%}.order-head,.order-row{font-size:13px}.customer-head,.customer-row{font-size:13px}.data-head{padding:11px 8px}.data-row{padding:12px 8px}.data-row>div,.data-head>div{padding:0 6px}.order-row .delete .btn,.customer-row .delete .btn{font-size:12px;padding:8px 10px;border-radius:8px}.order-status{font-size:12px;width:105px}.customer-head>div:nth-child(5){white-space:normal;text-align:center}}</style></head><body><div id="loginView" class="shell login"><div class="card"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><p class="muted">商品／口味、每日開放、訂單與個資管理。</p><form id="loginForm"><div class="field"><label>管理員 Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn" id="loginBtn">登入</button></form><div id="loginMsg"></div></div></div><div id="app" class="shell hidden"><div class="top"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><div id="userText" class="muted"></div></div><div class="nav"><button class="active" data-page="daily">📅 每日開放設定</button><button data-page="orders">🧾 訂單管理</button><button data-page="customers">👤 個資管理</button></div><section id="daily" class="page"><div class="card"><div class="toolbar"><h2>每日開放設定</h2><button class="btn" id="saveDaily">儲存今日設定</button></div><div class="grid"><div class="field"><label>日期</label><input id="orderDate" type="date"></div><div class="field"><label>今日線上訂購</label><select id="orderingEnabled"><option value="true">開放</option><option value="false">關閉</option></select></div></div><div id="dailyMsg"></div></div><div class="card"><div class="toolbar"><h2>當日開放地區</h2><button class="btn gray" id="addRegion">＋新增地區</button></div><div id="regionList" class="list"></div></div><div class="card"><h2>當日開放口味</h2><p class="muted">口味全部從「商品／口味管理」主資料帶入。</p><div id="flavorList" class="list"></div></div></section><section id="orders" class="page hidden"><div class="card"><div class="toolbar"><h2>訂單管理</h2><button class="btn gray" id="reloadOrders">重新整理</button></div><div class="stats" style="margin-top:12px"><div class="stat">今日訂單<b id="statToday">0</b></div><div class="stat">待確認匯款<b id="statPending">0</b></div><div class="stat">已付款<b id="statPaid">0</b></div><div class="stat">已寄放<b id="statStored">0</b></div></div><div class="data-table"><div class="data-head order-head"><div>訂單編號</div><div>日期</div><div>客戶</div><div>地區</div><div>超商／門市</div><div>口味明細</div><div>涼糕數量</div><div>商品小計</div><div>寄放費</div><div>應付總額</div><div>狀態</div><div>操作</div></div><div id="orderList"></div></div><div id="orderDetail"></div></div></section><section id="customers" class="page hidden"><div class="card"><div class="toolbar"><h2>個資管理</h2><button class="btn gray" id="reloadCustomers">重新整理</button></div><p class="muted">顯示客人填寫的訂單號碼、姓名、完整電話、門市與匯款後五碼。</p><div class="data-table"><div class="data-head customer-head"><div>訂單號碼</div><div>姓名</div><div>電話</div><div>門市</div><div>匯款後五碼</div><div>建立時間</div><div>操作</div></div><div id="customerList"></div></div><div id="customerMsg"></div></div></section><div class="card"><button class="btn gray" id="logout">登出</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});let master=[],daily=[],regions=[];function note(id,t,e=false){$(id).innerHTML=t?'<div class="notice '+(e?'err':'ok')+'">'+esc(t)+'</div>':''}async function access(u){const r=await db.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',u.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'管理員帳號目前已停用';if(r.data.role!=='super_admin'&&!r.data.can_manage_products&&r.data.role!=='order_admin'&&r.data.role!=='personal_data_admin')return'此帳號沒有管理權限';return null}$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const er=await access(r.data.user);if(er){await db.auth.signOut();throw Error(er)}openApp(r.data.user)}catch(x){note('loginMsg','登入失敗：'+x.message,true)}finally{$('loginBtn').disabled=false}};function openApp(u){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('userText').textContent='已登入 · '+u.email;$('orderDate').value=today();loadMaster();loadDaily()}async function loadMaster(){const r=await db.from('flavors').select('id,product_name,name,price,image_url,enabled').order('id');if(r.error)return note('dailyMsg','讀取商品／口味主資料失敗：'+r.error.message,true);master=r.data||[];renderFlavors()}async function loadDaily(){const d=$('orderDate').value||today();const [s,r,f]=await Promise.all([db.from('daily_order_settings').select('*').eq('order_date',d).maybeSingle(),db.from('daily_order_regions').select('*').eq('order_date',d).order('id'),db.from('daily_order_flavors').select('*').eq('order_date',d).order('id')]);if(s.error||r.error||f.error)return note('dailyMsg','讀取每日設定失敗。',true);$('orderingEnabled').value=s.data?.ordering_enabled===false?'false':'true';regions=r.data||[];daily=f.data||[];renderRegions();renderFlavors()}$('orderDate').onchange=loadDaily;$('addRegion').onclick=()=>{const n=prompt('輸入地區名稱');if(n?.trim()){regions.push({region_name:n.trim(),enabled:true});renderRegions()}};function renderRegions(){$('regionList').innerHTML=regions.map((r,i)=>'<div class="row"><div class="grow"><b>'+esc(r.region_name)+'</b> <span class="badge '+(r.enabled?'on':'off')+'">'+(r.enabled?'今日開放':'未開放')+'</span></div><button class="btn '+(r.enabled?'red':'green')+'" onclick="regions['+i+'].enabled=!regions['+i+'].enabled;renderRegions()">'+(r.enabled?'關閉':'開放')+'</button></div>').join('')||'<div class="muted">尚未設定地區。</div>'}function renderFlavors(){const map=new Map(daily.map(x=>[String(x.flavor_id),x]));const active=master.filter(p=>p.enabled);$('flavorList').innerHTML=active.map(p=>{const d=map.get(String(p.id)),on=!!d?.enabled,price=d?Number(d.price):Number(p.price||0);return '<div class="row"><div class="grow"><b>'+esc(p.product_name||'涼糕')+'</b>／'+esc(p.name)+'</div><div>口味ID：<b>'+p.id+'</b></div><div><label>今日價格 <input style="width:105px" type="number" min="0" value="'+price+'" onchange="setPrice('+p.id+',this.value)"></label></div><span class="badge '+(on?'on':'off')+'">'+(on?'今日開放':'今日未開放')+'</span><button class="btn '+(on?'red':'green')+'" onclick="toggleFlavor('+p.id+')">'+(on?'關閉':'開放')+'</button></div>'}).join('')||'<div class="muted">沒有啟用中的主資料口味。</div>'}window.setPrice=(id,v)=>{const p=master.find(x=>Number(x.id)===Number(id));let d=daily.find(x=>Number(x.flavor_id)===Number(id));if(!d){d={flavor_id:id,product_name:p.product_name||'涼糕',flavor_name:p.name,price:Number(v||0),enabled:true};daily.push(d)}else d.price=Number(v||0);renderFlavors()};window.toggleFlavor=id=>{const p=master.find(x=>Number(x.id)===Number(id));let d=daily.find(x=>Number(x.flavor_id)===Number(id));if(!d){d={flavor_id:id,product_name:p.product_name||'涼糕',flavor_name:p.name,price:Number(p.price||0),enabled:true};daily.push(d)}else d.enabled=!d.enabled;renderFlavors()};$('saveDaily').onclick=async()=>{const d=$('orderDate').value||today();let r=await db.from('daily_order_settings').upsert({order_date:d,ordering_enabled:$('orderingEnabled').value==='true',updated_at:new Date().toISOString()},{onConflict:'order_date'});if(r.error)return note('dailyMsg','儲存失敗：'+r.error.message,true);await db.from('daily_order_regions').delete().eq('order_date',d);await db.from('daily_order_flavors').delete().eq('order_date',d);const rr=regions.map(x=>({order_date:d,region_name:x.region_name,enabled:x.enabled})),ff=daily.filter(x=>x.enabled).map(x=>({order_date:d,flavor_id:x.flavor_id,product_name:x.product_name||'涼糕',flavor_name:x.flavor_name,price:Number(x.price||0),enabled:true,quantity:0}));if(rr.length){r=await db.from('daily_order_regions').insert(rr);if(r.error)return note('dailyMsg','地區儲存失敗：'+r.error.message,true)}if(ff.length){r=await db.from('daily_order_flavors').insert(ff);if(r.error)return note('dailyMsg','口味儲存失敗：'+r.error.message,true)}note('dailyMsg','已儲存。');await loadDaily()};async function loadOrders(){const r=await db.from('cooling_pickup_orders').select('id,order_number,order_date,region_name,convenience_store,store_name,store_address,merchandise_total,storage_fee,total_amount,payment_last5,status,notes,created_at,customer_id').order('created_at',{ascending:false}).limit(200);if(r.error)return $('orderList').innerHTML='<div class="notice err">讀取訂單失敗：'+esc(r.error.message)+'</div>';const os=r.data||[];$('statToday').textContent=os.filter(o=>o.order_date===today()).length;$('statPending').textContent=os.filter(o=>o.status==='待確認匯款').length;$('statPaid').textContent=os.filter(o=>o.status==='已付款').length;$('statStored').textContent=os.filter(o=>o.status==='已寄放').length;const ids=os.map(o=>o.id);let items=[],customers=[];if(ids.length){const ir=await db.from('cooling_pickup_order_items').select('order_id,product_name,flavor_id,flavor_name,unit_price,quantity,line_total').in('order_id',ids);if(!ir.error)items=ir.data||[]}const cids=[...new Set(os.map(o=>o.customer_id).filter(Boolean))];if(cids.length){const cr=await db.from('order_customers').select('id,name,phone').in('id',cids);if(!cr.error)customers=cr.data||[]}const cm=new Map(customers.map(c=>[c.id,c]));const byOrder=new Map();items.forEach(x=>{if(!byOrder.has(x.order_id))byOrder.set(x.order_id,[]);byOrder.get(x.order_id).push(x)});$('orderList').innerHTML=os.map(o=>{const its=byOrder.get(o.id)||[],c=cm.get(o.customer_id),qty=its.reduce((a,x)=>a+Number(x.quantity||0),0),fl=its.map(x=>esc(x.flavor_name||'')+' × '+Number(x.quantity||0)).join(' / ')||'—',store=[o.convenience_store,o.store_name].filter(Boolean).join(' / ')||'—';return '<div class="data-row order-row"><div class="order-no">'+esc(o.order_number||'')+'</div><div>'+esc(o.order_date||'')+'</div><div>'+esc(c?.name||'—')+'</div><div>'+esc(o.region_name||'—')+'</div><div>'+esc(store)+'</div><div class="order-items">'+fl+'</div><div>'+qty+' 盒</div><div>$'+Number(o.merchandise_total||0)+'</div><div>$'+Number(o.storage_fee||0)+'</div><div><b>$'+Number(o.total_amount||0)+'</b></div><div><select class="order-status" onchange="changeStatus('+o.id+',this.value)">'+['待確認匯款','已付款','製作中','已出貨','已寄放','已取貨','已完成','已取消'].map(s=>'<option '+(s===o.status?'selected':'')+'>'+s+'</option>').join('')+'</select></div><div class="delete"><button class="btn red" onclick="deleteOrder('+o.id+')">🗑 刪除</button></div></div>'}).join('')||'<div class="muted" style="padding:12px">目前沒有訂單。</div>';window._orderData={os,byOrder,cm}}window.changeStatus=async(id,status)=>{const r=await db.from('cooling_pickup_orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert('狀態更新失敗：'+r.error.message);else loadOrders()};window.deleteOrder=async id=>{if(!confirm('確定要刪除這筆訂單嗎？訂單明細也會一併刪除。'))return;let r=await db.from('cooling_pickup_order_items').delete().eq('order_id',id);if(r.error){alert('刪除訂單明細失敗：'+r.error.message);return}r=await db.from('cooling_pickup_orders').delete().eq('id',id);if(r.error){alert('刪除訂單失敗：'+r.error.message);return}loadOrders()};async function loadCustomers(){const r=await db.from('order_customers').select('id,name,phone,created_at').order('created_at',{ascending:false}).limit(200);if(r.error)return note('customerMsg','讀取個資失敗：'+r.error.message,true);const cs=r.data||[];let os=[];if(cs.length){const ir=await db.from('cooling_pickup_orders').select('id,order_number,customer_id,store_name,convenience_store,payment_last5,created_at').in('customer_id',cs.map(x=>x.id)).order('created_at',{ascending:false});if(!ir.error)os=ir.data||[]}const byCustomer=new Map();os.forEach(o=>{if(!byCustomer.has(o.customer_id))byCustomer.set(o.customer_id,o)});$('customerList').innerHTML=cs.map(c=>{const o=byCustomer.get(c.id),phone=c.phone||'',store=[o?.convenience_store,o?.store_name].filter(Boolean).join(' ')||'—';return '<div class="data-row customer-row"><div><b>'+esc(o?.order_number||'—')+'</b></div><div>'+esc(c.name||'')+'</div><div>'+esc(phone)+'</div><div>'+esc(store)+'</div><div>'+esc(o?.payment_last5||'—')+'</div><div>'+esc(o?.created_at?new Date(o.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):c.created_at?new Date(c.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'')+'</div><div class="delete"><button class="btn red" onclick="deleteCustomer('+c.id+')">🗑 刪除</button></div></div>'}).join('')||'<div class="muted" style="padding:12px">目前沒有個資。</div>'}window.deleteCustomer=async id=>{if(!confirm('確定要刪除這筆個資嗎？'))return;const r=await db.from('order_customers').delete().eq('id',id);if(r.error){note('customerMsg','刪除失敗：'+r.error.message,true);return}note('customerMsg','已刪除。');loadCustomers()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(b.dataset.page).classList.remove('hidden');if(b.dataset.page==='orders')loadOrders();if(b.dataset.page==='customers')loadCustomers()});$('reloadOrders').onclick=loadOrders;$('reloadCustomers').onclick=loadCustomers;$('logout').onclick=()=>db.auth.signOut().then(()=>location.reload());db.auth.getSession().then(r=>{if(r.data.session){access(r.data.session.user).then(er=>{if(!er)openApp(r.data.session.user)})}});</script></body></html>
