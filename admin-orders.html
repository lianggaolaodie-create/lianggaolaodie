<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.shell{max-width:1100px;margin:auto;padding:14px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 4px 12px}.brand{font-size:21px;font-weight:900}.muted{color:#786e68;font-size:13px;line-height:1.6}.btn{border:0;border-radius:10px;padding:10px 14px;background:#8d5939;color:#fff;font-weight:900;cursor:pointer}.btn.gray{background:#6d625b}.btn.red{background:#f33b3b}.btn.blue{background:#198fe3}.btn.green{background:#13ad67}.btn.orange{background:#ff8a20}.btn.small{padding:8px 11px;font-size:12px}.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.nav button{border:0;border-radius:12px;padding:11px 8px;background:#ebe4de;color:#5a4940;font-weight:900;font-size:14px}.nav button.active{background:#8d5939;color:#fff}.page{display:block}.hidden{display:none!important}.headrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.headrow h2{margin:0;font-size:24px}.date{border:1px solid #d9cec6;border-radius:9px;padding:10px;background:#fff;font:inherit}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.stat{background:#fff;border:1px solid #e4dad3;border-radius:13px;padding:10px;text-align:center}.stat .ico{font-size:22px}.stat .label{font-size:12px;font-weight:800}.stat b{display:block;font-size:24px;margin-top:2px}.section{border-radius:15px;padding:10px;margin:10px 0;border:1px solid #e5dcd5}.section.pickup{background:#fff2f3}.section.home{background:#eef8ff}.sectiontitle{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:18px;font-weight:900;margin-bottom:8px}.sectiontitle .count{font-size:13px;font-weight:700}.searchrow{display:flex;gap:7px;margin-bottom:8px}.search{flex:1;min-width:0;border:1px solid #ddd2ca;border-radius:10px;padding:10px 12px;font:inherit;background:#fff}.order-card{background:#fff;border:1px solid #e8ddd6;border-radius:13px;padding:10px;margin:8px 0;box-shadow:0 2px 8px #5b3d2509}.order-top{display:flex;justify-content:space-between;gap:6px;align-items:center}.order-no{font-weight:900;font-size:15px}.time{font-size:12px;color:#786e68}.status{border-radius:8px;padding:5px 8px;color:#fff;font-size:12px;font-weight:900;white-space:nowrap}.status.paid{background:#12b86a}.status.pending{background:#f23a43}.status.stored{background:#168fe4}.status.delivering{background:#16a86a}.status.done{background:#168fe4}.person{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:7px;margin:8px 0;font-size:13px}.person div{min-width:0}.person b{font-size:14px}.store{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.flavors{display:flex;flex-wrap:wrap;gap:6px;background:#fff4f4;border-radius:9px;padding:7px;margin:6px 0}.chip{display:inline-block;border-radius:7px;padding:5px 8px;font-size:12px;font-weight:800}.chip.yellow{background:#fff0c8}.chip.pink{background:#ffdfe5}.chip.green{background:#dff4df}.chip.orange{background:#ffe1c5}.summary{font-size:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}.pay5{color:#1474bd;background:#eaf4ff;border-radius:7px;padding:6px 8px;font-weight:900}.actions{display:flex;justify-content:flex-end;gap:6px;margin-top:7px}.customer-section{border-radius:15px;padding:10px;margin:10px 0;border:1px solid #e5dcd5}.customer-section.pickup{background:#fff2f3}.customer-section.home{background:#eef8ff}.customer-card{background:#fff;border:1px solid #e8ddd6;border-radius:12px;padding:10px;margin:7px 0}.customer-grid{display:grid;grid-template-columns:1.2fr 1fr 1.1fr 1.3fr;gap:6px;font-size:12px}.customer-grid b{display:block;font-size:14px}.customer-meta{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:7px;margin-top:7px;font-size:12px}.customer-actions{display:flex;justify-content:flex-end;gap:6px;margin-top:7px}.notice{padding:10px;border-radius:10px;margin:8px 0}.ok{background:#edf8f1;color:#286c47}.err{background:#fff0ef;color:#a43b35}.login{max-width:520px;margin:60px auto}.card{background:#fff;border:1px solid #e7ddd5;border-radius:18px;padding:16px;margin-bottom:12px}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d9cec6;border-radius:10px;font:inherit}.dailybox{background:#fff;border:1px solid #e7ddd5;border-radius:15px;padding:14px;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center;border:1px solid #e8ded7;border-radius:12px;padding:10px;margin:7px 0;background:#fff}.grow{flex:1}.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-size:12px;background:#eee7e1}.on{background:#e7f5ec;color:#2d714c}.off{background:#f6e9e7;color:#a13c35}@media(max-width:700px){.shell{padding:10px}.brand{font-size:19px}.stats{grid-template-columns:repeat(2,1fr)}.stat b{font-size:22px}.person{grid-template-columns:1fr 1fr}.person .store{grid-column:1/-1}.customer-grid{grid-template-columns:1fr 1fr}.customer-meta{grid-template-columns:1fr 1fr}.headrow h2{font-size:23px}.nav button{font-size:13px}.sectiontitle{font-size:17px}}
</style>

<body>
<div id="loginView" class="shell login"><div class="card"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><p class="muted">商品／口味、每日開放、訂單與個資管理。</p><form id="loginForm"><div class="field"><label>管理員 Email</label><input id="email" type="email" required></div><div class="field"><label>密碼</label><input id="password" type="password" required></div><button class="btn">登入</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="shell hidden">
<div class="top"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><button class="btn gray small" id="logout">登出</button></div>
<div class="nav"><button class="active" data-page="daily">📅 每日開放設定</button><button data-page="orders">🧾 訂單管理</button><button data-page="customers">👤 個資管理</button></div>
<section id="daily" class="page hidden"><div class="dailybox"><div class="headrow"><h2>每日開放設定</h2><button class="btn" id="saveDaily">儲存今日設定</button></div><div class="field"><label>日期</label><input id="orderDate" type="date"></div><div class="field"><label>今日線上訂購</label><select id="orderingEnabled"><option value="true">開放</option><option value="false">關閉</option></select></div><div id="dailyMsg"></div></div><div class="dailybox"><div class="headrow"><h3 style="margin:0">當日開放地區</h3><button class="btn gray" id="addRegion">＋新增地區</button></div><div id="regionList"></div></div><div class="dailybox"><h3 style="margin-top:0">當日開放口味</h3><div class="muted">口味從商品／口味主資料帶入。</div><div id="flavorList"></div></div></section>
<section id="orders" class="page"><div class="headrow"><h2>訂單管理</h2><div style="display:flex;gap:6px"><input id="orderDateFilter" class="date" type="date"><button class="btn gray" id="reloadOrders">重新整理</button></div></div><div class="stats"><div class="stat"><div class="ico">🧾</div><div class="label">今日訂單</div><b id="statToday">0</b></div><div class="stat"><div class="ico">💰</div><div class="label">待確認匯款</div><b id="statPending">0</b></div><div class="stat"><div class="ico">✅</div><div class="label">已付款</div><b id="statPaid">0</b></div><div class="stat"><div class="ico">🚚</div><div class="label">已寄放</div><b id="statStored">0</b></div></div><div class="section pickup"><div class="sectiontitle"><span>🏪 超商寄放客戶資料 <span style="color:#e33">(需先付款)</span></span><span class="count">共 <b id="pickupCount">0</b> 筆⌃</span></div><div class="searchrow"><input id="pickupSearch" class="search" placeholder="搜尋訂單編號／姓名／電話／門市"><button class="btn" onclick="filterOrders()">搜尋</button></div><div id="pickupList"></div></div><div class="section home"><div class="sectiontitle"><span>🏠 送到府訂單 <span style="color:#1674c5">(貨到付款)</span></span><span class="count">共 <b id="homeCount">0</b> 筆⌃</span></div><div class="searchrow"><input id="homeSearch" class="search" placeholder="搜尋訂單編號／姓名／電話／地址"><button class="btn" onclick="filterOrders()">搜尋</button></div><div id="homeList"></div></div><div id="orderMsg"></div></section>
<section id="customers" class="page hidden"><div class="headrow"><div><h2 style="margin:0">個資管理</h2><div class="muted">顯示客人填寫的訂單號碼、姓名、完整電話、門市與匯款後五碼。</div></div></div><div class="customer-section pickup"><div class="sectiontitle"><span>🏪 超商寄放客戶資料</span><span class="count">共 <b id="customerPickupCount">0</b> 筆⌃</span></div><div class="searchrow"><input id="customerPickupSearch" class="search" placeholder="搜尋訂單編號／姓名／電話／門市"><button class="btn" onclick="filterCustomers()">搜尋</button></div><div id="customerPickupList"></div></div><div class="customer-section home"><div class="sectiontitle"><span>🏠 送到府客戶資料</span><span class="count">共 <b id="customerHomeCount">0</b> 筆⌃</span></div><div class="searchrow"><input id="customerHomeSearch" class="search" placeholder="搜尋訂單編號／姓名／電話／地址"><button class="btn" onclick="filterCustomers()">搜尋</button></div><div id="customerHomeList"></div></div><div id="customerMsg"></div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});let allOrders=[],allCustomers=[],master=[],daily=[],regions=[];
function note(id,t,e=false){$(id).innerHTML=t?'<div class="notice '+(e?'err':'ok')+'">'+esc(t)+'</div>':''}
async function access(u){const r=await db.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',u.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'管理員帳號目前已停用';if(r.data.role!=='super_admin'&&!r.data.can_manage_products&&r.data.role!=='order_admin'&&r.data.role!=='personal_data_admin')return'此帳號沒有管理權限';return null}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const er=await access(r.data.user);if(er){await db.auth.signOut();throw Error(er)}openApp(r.data.user)}catch(x){note('loginMsg','登入失敗：'+x.message,true)}};
function openApp(u){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('orderDateFilter').value=today();$('orderDate').value=today();loadOrders();loadCustomers();loadDaily()}
function classify(o){return o.convenience_store||o.store_name?'pickup':'home'}
function statusClass(s){if(s==='已付款')return'paid';if(s==='待確認匯款')return'pending';if(s==='已寄放')return'stored';if(s==='配送中'||s==='製作中')return'delivering';return'done'}
function orderCard(o,items,cm){const c=cm.get(o.customer_id)||{};const qty=items.reduce((a,x)=>a+Number(x.quantity||0),0);const chips=items.map((x,i)=>'<span class="chip '+(['yellow','pink','green','orange'][i%4])+'">'+esc(x.flavor_name||'')+' ('+Number(x.quantity||0)+'盒)</span>').join('');const place=classify(o)==='pickup'?[o.convenience_store,o.store_name].filter(Boolean).join(' ')||'—':o.store_address||'—';const paid=o.payment_last5?'<span class="pay5">匯款後五碼　'+esc(o.payment_last5)+'</span>':'';return '<div class="order-card"><div class="order-top"><div><div class="order-no">訂單編號　'+esc(o.order_number||'')+' 📋</div><div class="time">訂購時間　'+new Date(o.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+'</div></div><span class="status '+statusClass(o.status)+'">'+esc(o.status||'待確認')+'</span></div><div class="person"><div>👤 <b>'+esc(c.name||'')+'</b><br>'+esc(c.phone||'')+'</div><div class="store">📍 '+esc(place)+'</div><div>'+paid+'</div></div><div class="flavors"><b>口味 (數量)</b> '+chips+'</div><div class="summary">涼糕數量　<b>'+qty+' 盒</b>　|　商品小計　<b>$'+Number(o.merchandise_total||0)+'</b>　|　'+(classify(o)==='pickup'?'寄放費　<b>$'+Number(o.storage_fee||0)+'</b>　|　':'')+'應付總額　<b>$'+Number(o.total_amount||0)+'</b>'+(classify(o)==='home'?'<span class="chip yellow">貨到付款</span>':'')+'</div><div class="actions"><button class="btn small" onclick="viewOrder('+o.id+')">查看</button><button class="btn small" onclick="editOrder('+o.id+')">編輯</button><button class="btn red small" onclick="deleteOrder('+o.id+')">🗑 刪除</button></div></div>'}
async function loadOrders(){const r=await db.from('cooling_pickup_orders').select('id,order_number,order_date,region_name,convenience_store,store_name,store_address,merchandise_total,storage_fee,total_amount,payment_last5,status,notes,created_at,customer_id').order('created_at',{ascending:false}).limit(300);if(r.error){note('orderMsg','讀取訂單失敗：'+r.error.message,true);return}allOrders=r.data||[];const ids=allOrders.map(o=>o.id);let items=[];if(ids.length){const ir=await db.from('cooling_pickup_order_items').select('order_id,product_name,flavor_id,flavor_name,unit_price,quantity,line_total').in('order_id',ids);if(!ir.error)items=ir.data||[]}const cids=[...new Set(allOrders.map(o=>o.customer_id).filter(Boolean))];let cs=[];if(cids.length){const cr=await db.from('order_customers').select('id,name,phone').in('id',cids);if(!cr.error)cs=cr.data||[]}const cm=new Map(cs.map(c=>[c.id,c]));const by=new Map();items.forEach(x=>{if(!by.has(x.order_id))by.set(x.order_id,[]);by.get(x.order_id).push(x)});window._byOrder=by;window._customerMap=cm;const d=$('orderDateFilter').value||today();const day=allOrders.filter(o=>o.order_date===d);$('statToday').textContent=day.length;$('statPending').textContent=allOrders.filter(o=>o.status==='待確認匯款').length;$('statPaid').textContent=allOrders.filter(o=>o.status==='已付款').length;$('statStored').textContent=allOrders.filter(o=>o.status==='已寄放').length;filterOrders()}
function filterOrders(){const ps=($('pickupSearch').value||'').trim().toLowerCase(),hs=($('homeSearch').value||'').trim().toLowerCase(),d=$('orderDateFilter').value||today();const base=allOrders.filter(o=>o.order_date===d);const match=(o,q)=>{const c=window._customerMap?.get(o.customer_id)||{};const t=[o.order_number,c.name,c.phone,o.convenience_store,o.store_name,o.store_address,o.payment_last5].join(' ').toLowerCase();return !q||t.includes(q)};const p=base.filter(o=>classify(o)==='pickup'&&match(o,ps));const h=base.filter(o=>classify(o)==='home'&&match(o,hs));$('pickupCount').textContent=p.length;$('homeCount').textContent=h.length;$('pickupList').innerHTML=p.map(o=>orderCard(o,window._byOrder.get(o.id)||[],window._customerMap)).join('')||'<div class="muted">目前沒有超商寄放訂單。</div>';$('homeList').innerHTML=h.map(o=>orderCard(o,window._byOrder.get(o.id)||[],window._customerMap)).join('')||'<div class="muted">目前沒有送到府訂單。</div>'}
$('orderDateFilter').onchange=loadOrders;$('reloadOrders').onclick=loadOrders;
window.viewOrder=id=>{const o=allOrders.find(x=>x.id===id);if(o)alert('訂單 '+o.order_number+'\n狀態：'+(o.status||'')+'\n備註：'+(o.notes||'無'))};window.editOrder=id=>{const o=allOrders.find(x=>x.id===id);if(!o)return;const s=prompt('修改訂單狀態',o.status||'待確認匯款');if(s&&s!==o.status)changeStatus(id,s)};window.changeStatus=async(id,status)=>{const r=await db.from('cooling_pickup_orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert('狀態更新失敗：'+r.error.message);else loadOrders()};window.deleteOrder=async id=>{if(!confirm('確定要刪除這筆訂單嗎？訂單明細也會一併刪除。'))return;let r=await db.from('cooling_pickup_order_items').delete().eq('order_id',id);if(r.error){alert('刪除訂單明細失敗：'+r.error.message);return}r=await db.from('cooling_pickup_orders').delete().eq('id',id);if(r.error){alert('刪除訂單失敗：'+r.error.message);return}loadOrders()};
async function loadCustomers(){const r=await db.from('order_customers').select('id,name,phone,created_at').order('created_at',{ascending:false}).limit(300);if(r.error){note('customerMsg','讀取個資失敗：'+r.error.message,true);return}allCustomers=r.data||[];const cids=allCustomers.map(c=>c.id);let os=[];if(cids.length){const ir=await db.from('cooling_pickup_orders').select('id,order_number,customer_id,convenience_store,store_name,store_address,payment_last5,created_at').in('customer_id',cids).order('created_at',{ascending:false});if(!ir.error)os=ir.data||[]}const latest=new Map();os.forEach(o=>{if(!latest.has(o.customer_id))latest.set(o.customer_id,o)});window._latestCustomerOrder=latest;filterCustomers()}
function customerCard(c){const o=window._latestCustomerOrder?.get(c.id)||{};const pickup=!!(o.convenience_store||o.store_name);const place=pickup?[o.convenience_store,o.store_name].filter(Boolean).join(' ')||'—':o.store_address||'—';return '<div class="customer-card"><div class="customer-grid"><div>訂單編號<b>'+esc(o.order_number||'—')+'</b></div><div>姓名<b>'+esc(c.name||'')+'</b></div><div>電話<b>'+esc(c.phone||'')+'</b></div><div style="display:flex;justify-content:flex-end;gap:5px"><button class="btn small" onclick="viewCustomer('+c.id+')">查看</button><button class="btn small" onclick="editCustomer('+c.id+')">編輯</button><button class="btn red small" onclick="deleteCustomer('+c.id+')">🗑 刪除</button></div></div><div class="customer-meta"><div>📍 '+(pickup?'超商／門市':'完整地址')+'<br><b>'+esc(place)+'</b></div><div>'+(pickup?'💳 匯款後五碼':'🏠 配送資料')+'<br><b>'+esc(o.payment_last5||'—')+'</b></div><div>◷ 建立時間<br><b>'+esc(o.created_at?new Date(o.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):new Date(c.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}))+'</b></div></div></div>'}
function filterCustomers(){const ps=($('customerPickupSearch').value||'').trim().toLowerCase(),hs=($('customerHomeSearch').value||'').trim().toLowerCase();const match=(c,q)=>{const o=window._latestCustomerOrder?.get(c.id)||{};return !q||[o.order_number,c.name,c.phone,o.convenience_store,o.store_name,o.store_address].join(' ').toLowerCase().includes(q)};const p=allCustomers.filter(c=>{const o=window._latestCustomerOrder?.get(c.id)||{};return (o.convenience_store||o.store_name)&&match(c,ps)}),h=allCustomers.filter(c=>{const o=window._latestCustomerOrder?.get(c.id)||{};return !(o.convenience_store||o.store_name)&&match(c,hs)});$('customerPickupCount').textContent=p.length;$('customerHomeCount').textContent=h.length;$('customerPickupList').innerHTML=p.map(customerCard).join('')||'<div class="muted">目前沒有超商寄放個資。</div>';$('customerHomeList').innerHTML=h.map(customerCard).join('')||'<div class="muted">目前沒有送到府個資。</div>'}
window.viewCustomer=id=>{const c=allCustomers.find(x=>x.id===id);if(c)alert('姓名：'+(c.name||'')+'\n電話：'+(c.phone||''))};window.editCustomer=id=>{const c=allCustomers.find(x=>x.id===id);if(!c)return;const name=prompt('修改姓名',c.name||'');if(name===null)return;const phone=prompt('修改電話',c.phone||'');if(phone===null)return;db.from('order_customers').update({name:name.trim(),phone:phone.trim()}).eq('id',id).then(r=>{if(r.error)alert('更新失敗：'+r.error.message);else loadCustomers()})};window.deleteCustomer=async id=>{if(!confirm('確定要刪除這筆個資嗎？訂單資料會保留，但會解除客戶資料。'))return;const r1=await db.from('cooling_pickup_orders').update({customer_id:null}).eq('customer_id',id);if(r1.error){note('customerMsg','解除個資關聯失敗：'+r1.error.message,true);return}const r=await db.from('order_customers').delete().eq('id',id);if(r.error){note('customerMsg','刪除個資失敗：'+r.error.message,true);return}note('customerMsg','個資已刪除，訂單保留。');loadCustomers();loadOrders()};
async function loadDaily(){const d=$('orderDate').value||today();const [s,r,f]=await Promise.all([db.from('daily_order_settings').select('*').eq('order_date',d).maybeSingle(),db.from('daily_order_regions').select('*').eq('order_date',d).order('id'),db.from('daily_order_flavors').select('*').eq('order_date',d).order('id')]);if(s.error||r.error||f.error)return note('dailyMsg','讀取每日設定失敗。',true);$('orderingEnabled').value=s.data?.ordering_enabled===false?'false':'true';regions=r.data||[];daily=f.data||[];renderRegions();renderFlavors()};async function loadMaster(){const r=await db.from('flavors').select('id,product_name,name,price,enabled').order('id');if(!r.error)master=r.data||[];renderFlavors()};function renderRegions(){$('regionList').innerHTML=regions.map((r,i)=>'<div class="row"><div class="grow"><b>'+esc(r.region_name)+'</b> <span class="badge '+(r.enabled?'on':'off')+'">'+(r.enabled?'今日開放':'未開放')+'</span></div><button class="btn '+(r.enabled?'red':'green')+' small" onclick="regions['+i+'].enabled=!regions['+i+'].enabled;renderRegions()">'+(r.enabled?'關閉':'開放')+'</button></div>').join('')||'<div class="muted">尚未設定地區。</div>'};function renderFlavors(){if(!master.length){$('flavorList').innerHTML='<div class="muted">沒有口味主資料。</div>';return}const map=new Map(daily.map(x=>[String(x.flavor_id),x]));$('flavorList').innerHTML=master.filter(p=>p.enabled).map(p=>{const d=map.get(String(p.id)),on=!!d?.enabled,price=d?Number(d.price):Number(p.price||0);return '<div class="row"><div class="grow"><b>'+esc(p.product_name||'涼糕')+'</b>／'+esc(p.name)+'</div><div>今日價格 <input style="width:80px;padding:7px" type="number" value="'+price+'" onchange="setPrice('+p.id+',this.value)"></div><button class="btn '+(on?'red':'green')+' small" onclick="toggleFlavor('+p.id+')">'+(on?'關閉':'開放')+'</button></div>'}).join('')};window.setPrice=(id,v)=>{const p=master.find(x=>Number(x.id)===Number(id));let d=daily.find(x=>Number(x.flavor_id)===Number(id));if(!d){d={flavor_id:id,product_name:p.product_name||'涼糕',flavor_name:p.name,price:Number(v||0),enabled:true};daily.push(d)}else d.price=Number(v||0);renderFlavors()};window.toggleFlavor=id=>{const p=master.find(x=>Number(x.id)===Number(id));let d=daily.find(x=>Number(x.flavor_id)===Number(id));if(!d){d={flavor_id:id,product_name:p.product_name||'涼糕',flavor_name:p.name,price:Number(p.price||0),enabled:true};daily.push(d)}else d.enabled=!d.enabled;renderFlavors()};$('addRegion').onclick=()=>{const n=prompt('輸入地區名稱');if(n?.trim()){regions.push({region_name:n.trim(),enabled:true});renderRegions()}};$('saveDaily').onclick=async()=>{const d=$('orderDate').value||today();let r=await db.from('daily_order_settings').upsert({order_date:d,ordering_enabled:$('orderingEnabled').value==='true',updated_at:new Date().toISOString()},{onConflict:'order_date'});if(r.error)return note('dailyMsg','儲存失敗：'+r.error.message,true);await db.from('daily_order_regions').delete().eq('order_date',d);await db.from('daily_order_flavors').delete().eq('order_date',d);const rr=regions.map(x=>({order_date:d,region_name:x.region_name,enabled:x.enabled})),ff=daily.filter(x=>x.enabled).map(x=>({order_date:d,flavor_id:x.flavor_id,product_name:x.product_name||'涼糕',flavor_name:x.flavor_name,price:Number(x.price||0),enabled:true,quantity:0}));if(rr.length){r=await db.from('daily_order_regions').insert(rr);if(r.error)return note('dailyMsg','地區儲存失敗：'+r.error.message,true)}if(ff.length){r=await db.from('daily_order_flavors').insert(ff);if(r.error)return note('dailyMsg','口味儲存失敗：'+r.error.message,true)}note('dailyMsg','已儲存。');loadDaily()};

document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(b.dataset.page).classList.remove('hidden');if(b.dataset.page==='orders')loadOrders();if(b.dataset.page==='customers')loadCustomers();if(b.dataset.page==='daily'){loadMaster();loadDaily()}});$('logout').onclick=()=>db.auth.signOut().then(()=>location.reload());db.auth.getSession().then(r=>{if(r.data.session)access(r.data.session.user).then(er=>{if(!er)openApp(r.data.session.user)})});
</script></body></html>
