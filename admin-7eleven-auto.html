<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="cache-control" content="no-cache"><title>老爹・涼糕｜7-ELEVEN 後台登入</title><style>body{margin:0;background:#f7f4ef;color:#2b241f;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:720px;margin:auto;padding:22px 16px 60px}.card{background:#fff;border:1px solid #e5dbd0;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 5px 20px #0000000a}h1{font-size:28px;margin:0 0 8px}.small{font-size:13px;color:#756b63}.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d8cec5;border-radius:11px;font-size:16px;background:#fff}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:12px 16px;background:#8f5738;color:#fff;font-weight:800;cursor:pointer;font-size:15px}.btn:disabled{opacity:.6}.secondary{background:#eee;color:#333}.notice{background:#fff7df;padding:13px;border-radius:11px}.error{background:#fff0ef;color:#9d302b;padding:13px;border-radius:11px;margin-top:12px}.ok{background:#edf8f1;color:#286d46;padding:13px;border-radius:11px;margin-top:12px}.hidden{display:none}.link{display:inline-block;margin-top:12px;color:#8f5738;font-weight:800;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{border:1px solid #e5dbd0;border-radius:12px;padding:14px}.num{font-size:24px;font-weight:900}.order{border:1px solid #e5dbd0;border-radius:12px;padding:13px;margin:9px 0}.code{font-weight:900;font-size:18px;letter-spacing:1px}.codebox{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.codebox input{padding:11px;border:1px solid #d8cec5;border-radius:10px;box-sizing:border-box}@media(max-width:600px){.grid{grid-template-columns:1fr}.codebox{grid-template-columns:1fr}h1{font-size:25px}}</style></head><body><div class="wrap"><div class="card"><h1>⚙️ 7-ELEVEN 自動出貨中心</h1><div class="small">老爹・涼糕｜獨立後台，不修改其他後台</div></div><div id="login" class="card"><h2>🔐 管理員登入</h2><div class="notice">使用原本老爹涼糕後台的管理員帳號登入。這個後台不會建立另一套帳號。</div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" inputmode="email" placeholder="請輸入管理員 Email"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" placeholder="請輸入管理員密碼"></div><div class="actions"><button class="btn" id="loginBtn" type="button">登入後台</button><button class="btn secondary" id="resetBtn" type="button">寄送重設密碼信</button></div><div id="loginMsg"></div></div><div id="app" class="hidden"><div class="card"><div class="actions"><button class="btn secondary" id="refreshBtn">重新整理</button><button class="btn secondary" id="logoutBtn">登出</button><a class="btn secondary" href="admin-7eleven-shipping.html">出貨工作台</a><a class="btn secondary" href="https://myship2.7-11.com.tw/C2C/Import" target="_blank" rel="noopener">7-ELEVEN 官方匯入</a></div><div id="msg"></div></div><div class="card"><div class="grid"><div class="stat"><div class="small">待處理</div><div id="pending" class="num">0</div></div><div class="stat"><div class="small">已取得官方碼</div><div id="coded" class="num">0</div></div><div class="stat"><div class="small">已交寄</div><div id="sent" class="num">0</div></div></div></div><div class="card"><h2>📦 7-ELEVEN 訂單</h2><div class="notice">官網訂單 → 出貨資料 → 7-ELEVEN 官方系統 → 官方服務碼 → 回填 → 條碼／列印。</div><div id="ordersBox" style="margin-top:12px">讀取中…</div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const sb=window.supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let rows=[];function show(id,text,cls='ok'){const e=$(id);if(e)e.innerHTML='<div class="'+cls+'">'+esc(text)+'</div>'}function explain(e){const m=e&&e.message?e.message:String(e||'未知錯誤');if(/invalid login credentials/i.test(m))return 'Email 或密碼不正確，請確認後再試；若忘記密碼可按「寄送重設密碼信」。';if(/email not confirmed/i.test(m))return '此管理員 Email 尚未完成驗證，請先完成 Email 驗證。';if(/rate limit/i.test(m))return '登入嘗試過於頻繁，請稍後再試。';return m}async function showPanel(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');const{data:p,error}=await sb.from('admin_profiles').select('role,enabled').eq('user_id',user.id).maybeSingle();if(error){show('msg','登入成功，但讀取管理員權限失敗：'+explain(error),'error');return}if(!p||!p.enabled){show('msg','登入成功，但這個帳號尚未被啟用為管理員。','error');return}await load()}async function checkSession(){try{const{data,error}=await sb.auth.getUser();if(error)return;if(data.user)await showPanel(data.user)}catch(e){show('loginMsg','初始化失敗：'+explain(e),'error')}}async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){show('loginMsg','請輸入 Email 和密碼。','error');return}const b=$('loginBtn');b.disabled=true;b.textContent='登入中…';$('loginMsg').innerHTML='';try{const{data,error}=await sb.auth.signInWithPassword({email,password});if(error){show('loginMsg','登入失敗：'+explain(error),'error');return}if(!data||!data.user){show('loginMsg','登入沒有取得使用者工作階段，請重新整理後再試。','error');return}await showPanel(data.user)}catch(e){show('loginMsg','登入失敗：'+explain(e),'error')}finally{b.disabled=false;b.textContent='登入後台'}}async function resetPassword(){const email=$('email').value.trim();if(!email){show('loginMsg','請先輸入 Email，再按「寄送重設密碼信」。','error');return}const b=$('resetBtn');b.disabled=true;b.textContent='寄送中…';try{const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)show('loginMsg','重設密碼信寄送失敗：'+explain(error),'error');else show('loginMsg','如果這個 Email 有建立 Supabase 帳號，系統會寄出重設密碼信。請查看信箱。','ok')}catch(e){show('loginMsg','重設密碼失敗：'+explain(e),'error')}finally{b.disabled=false;b.textContent='寄送重設密碼信'}}$('loginBtn').addEventListener('click',login);$('resetBtn').addEventListener('click',resetPassword);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('email').addEventListener('keydown',e=>{if(e.key==='Enter')$('password').focus()});$('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});$('refreshBtn').addEventListener('click',load);function status(id){return localStorage.getItem('sevenElevenShipStatus_'+id)||'ready'}function code(id){return localStorage.getItem('sevenElevenOfficialCode_'+id)||''}async function load(){const{data,error}=await sb.from('orders').select('id,order_number,delivery_date,product_total,pickup_fee,total_amount,status,seven_eleven_service_code,seven_eleven_service_status,seven_eleven_service_code_at,created_at').eq('pickup_type','seven_eleven').order('created_at',{ascending:false}).limit(100);if(error){show('msg','訂單讀取失敗：'+explain(error),'error');return}let priv=[];const u=await sb.auth.getUser();const{data:p}=await sb.from('admin_profiles').select('role').eq('user_id',u.data.user.id).maybeSingle();if(p&&(p.role==='personal_data_admin'||p.role==='super_admin')){const r=await sb.rpc('personal_data_admin_orders');if(!r.error)priv=r.data||[]}rows=await Promise.all((data||[]).map(async o=>{const{data:items}=await sb.from('order_items').select('flavor_name,quantity,subtotal').eq('order_id',o.id).order('id');const x=priv.find(v=>v.order_id===o.id)||{};return{o,items:items||[],p:x}}));$('pending').textContent=rows.filter(r=>status(r.o.id)!=='sent').length;$('coded').textContent=rows.filter(r=>r.o.seven_eleven_service_code||code(r.o.id)).length;$('sent').textContent=rows.filter(r=>status(r.o.id)==='sent').length;$('ordersBox').innerHTML=rows.length?rows.map(r=>{const c=r.o.seven_eleven_service_code||code(r.o.id),id=esc(r.o.id);return '<div class="order"><strong>'+esc(r.o.order_number)+'</strong><div class="small">配送 '+esc(r.o.delivery_date)+' · '+esc(r.p.pickup_store||'未取得門市')+' · '+esc(r.p.customer_name||'未取得姓名')+'</div><div style="margin-top:8px">'+esc(r.items.map(i=>(i.flavor_name||'商品')+' × '+i.quantity).join('、'))+'</div><div class="small" style="margin-top:7px">官方服務碼：<span class="code">'+esc(c||'尚未取得')+'</span></div><div class="codebox"><input id="code_'+id+'" value="'+esc(c)+'" placeholder="從7-ELEVEN官方系統取得後貼上"><button class="btn" onclick="saveCode(\''+id+'\')">回填官方碼</button></div></div>'}).join(''):'<div class="small">目前沒有 7-ELEVEN 訂單。</div>'}window.saveCode=async id=>{const v=$(('code_'+id)).value.trim();if(!v)return show('msg','請貼上官方系統產生的服務碼。','error');const{error}=await sb.from('orders').update({seven_eleven_service_code:v,seven_eleven_service_status:'generated',seven_eleven_service_code_at:new Date().toISOString()}).eq('id',id);if(error)return show('msg','官方服務碼回填失敗：'+explain(error),'error');localStorage.setItem('sevenElevenOfficialCode_'+id,v);show('msg','官方服務碼已回填資料庫。','ok');load()};checkSession()})();</script></body></html>
