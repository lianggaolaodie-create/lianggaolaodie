<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜7-ELEVEN 自動出貨中心</title><style>body{margin:0;background:#f7f4ef;color:#2b241f;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e5dbd0;border-radius:16px;padding:18px;margin:14px 0}.btn{border:0;border-radius:10px;padding:10px 14px;background:#8f5738;color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:#eee;color:#333}.actions{display:flex;gap:8px;flex-wrap:wrap}.small{font-size:13px;color:#756b63}.notice{background:#fff7df;padding:12px;border-radius:10px}.ok{background:#edf8f1;padding:12px;border-radius:10px}.error{background:#fff0ef;color:#9d302b;padding:12px;border-radius:10px}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.stat{border:1px solid #e5dbd0;border-radius:12px;padding:14px}.num{font-size:25px;font-weight:900}.order{border:1px solid #e5dbd0;border-radius:12px;padding:12px;margin:9px 0}.head{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{display:inline-block;padding:4px 9px;border-radius:999px;background:#fff0c9;font-size:12px;font-weight:800}.done{background:#e5f5ea}.code{font-size:18px;font-weight:900;letter-spacing:1px}.codebox{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:9px}.codebox input{padding:10px;border:1px solid #d8cec5;border-radius:10px;box-sizing:border-box}@media(max-width:600px){.head{display:block}.codebox{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>⚙️ 7-ELEVEN 自動出貨中心</h1><div class="small">老爹・涼糕｜獨立後台，不修改其他後台</div><div class="actions" style="margin-top:12px"><button class="btn" id="loginBtn">登入</button><button class="btn secondary" id="refreshBtn">重新整理</button><button class="btn secondary" id="logoutBtn">登出</button><a class="btn secondary" href="admin-7eleven-shipping.html">出貨工作台</a><a class="btn secondary" href="https://myship2.7-11.com.tw/C2C/Import" target="_blank" rel="noopener">官方訂單匯入</a></div><div id="msg"></div></div><div id="login" class="card"><div class="notice">請使用既有老爹涼糕管理員帳號登入。</div><input id="email" type="email" placeholder="Email" style="width:100%;box-sizing:border-box;padding:11px;margin:8px 0;border:1px solid #d8cec5;border-radius:10px"><input id="password" type="password" placeholder="密碼" style="width:100%;box-sizing:border-box;padding:11px;margin:8px 0;border:1px solid #d8cec5;border-radius:10px"><button class="btn" onclick="doLogin()">登入</button></div><div id="app" class="hidden"><div class="card"><div class="grid"><div class="stat"><div class="small">待處理</div><div id="pending" class="num">0</div></div><div class="stat"><div class="small">已取得官方碼</div><div id="coded" class="num">0</div></div><div class="stat"><div class="small">已交寄</div><div id="sent" class="num">0</div></div></div></div><div class="card"><h2>自動化流程</h2><div class="notice">① 抓取官網 7-ELEVEN 訂單　→　② 整理官方匯入資料　→　③ 開啟官方匯入頁　→　④ 官方系統產生服務碼　→　⑤ 回填服務碼　→　⑥ 顯示條碼／列印</div><div class="small" style="margin-top:10px">為避免冒充官方服務碼，本頁不自行產生 7-ELEVEN 官方服務碼。官方網站目前支援批次匯入，單次最多100筆；服務碼與正式服務單仍以7-ELEVEN官方系統為準。</div></div><div class="card"><h2>📦 訂單</h2><div class="actions"><button class="btn" onclick="selectAll(true)">全選</button><button class="btn secondary" onclick="selectAll(false)">取消全選</button><button class="btn" onclick="exportSelected()">建立匯入資料</button><button class="btn secondary" onclick="markSelected('sent')">標記已交寄</button></div><div id="ordersBox" style="margin-top:10px">讀取中…</div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const sb=window.supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let rows=[];function msg(t,c='ok'){$('msg').innerHTML='<div class="'+c+'">'+esc(t)+'</div>'}function code(id){return localStorage.getItem('sevenElevenOfficialCode_'+id)||''}function status(id){return localStorage.getItem('sevenElevenShipStatus_'+id)||'ready'}async function auth(){const{data}=await sb.auth.getUser();if(!data.user){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}const{data:p}=await sb.from('admin_profiles').select('role,enabled').eq('user_id',data.user.id).maybeSingle();if(!p||!p.enabled)return msg('此帳號不是啟用中的管理員。','error');$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}window.doLogin=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('請輸入 Email 與密碼','error');const{error}=await sb.auth.signInWithPassword({email,password});if(error)return msg(error.message,'error');auth()};$('loginBtn').onclick=doLogin;$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refreshBtn').onclick=load;async function load(){const{data,error}=await sb.from('orders').select('id,order_number,delivery_date,product_total,pickup_fee,total_amount,status,seven_eleven_service_code,seven_eleven_service_status,seven_eleven_service_code_at,created_at').eq('pickup_type','seven_eleven').order('created_at',{ascending:false}).limit(100);if(error)return msg(error.message,'error');let priv=[];const u=await sb.auth.getUser();const{data:p}=await sb.from('admin_profiles').select('role').eq('user_id',u.data.user.id).maybeSingle();if(p&&(p.role==='personal_data_admin'||p.role==='super_admin')){const r=await sb.rpc('personal_data_admin_orders');if(!r.error)priv=r.data||[]}rows=await Promise.all((data||[]).map(async o=>{const{data:items}=await sb.from('order_items').select('flavor_name,quantity,subtotal').eq('order_id',o.id).order('id');const x=priv.find(v=>v.order_id===o.id)||{};return{o,items:items||[],p:x}}));$('pending').textContent=rows.filter(r=>status(r.o.id)!=='sent').length;$('coded').textContent=rows.filter(r=>r.o.seven_eleven_service_code||code(r.o.id)).length;$('sent').textContent=rows.filter(r=>status(r.o.id)==='sent').length;$('ordersBox').innerHTML=rows.length?rows.map(r=>{const c=r.o.seven_eleven_service_code||code(r.o.id),s=status(r.o.id),id=esc(r.o.id);return '<div class="order"><div class="head"><div><input class="pick" type="checkbox" value="'+id+'"> <strong>'+esc(r.o.order_number)+'</strong> <span class="badge '+(s==='sent'?'done':'')+'">'+(s==='sent'?'已交寄':'待出貨')+'</span><div class="small">配送 '+esc(r.o.delivery_date)+' · '+esc(r.p.pickup_store||'未取得門市')+' · '+esc(r.p.customer_name||'未取得姓名')+'</div></div></div><div style="margin-top:8px">'+esc(r.items.map(i=>(i.flavor_name||'商品')+' × '+i.quantity).join('、'))+'</div><div class="small" style="margin-top:7px">官方服務碼：<span class="code">'+esc(c||'尚未取得')+'</span></div><div class="codebox"><input id="code_'+id+'" value="'+esc(c)+'" placeholder="從7-ELEVEN官方系統取得後貼上"><button class="btn" onclick="saveCode(\''+id+'\')">回填官方碼</button></div></div>'}).join(''):'<div class="small">目前沒有 7-ELEVEN 訂單。</div>'}window.saveCode=async id=>{const v=$(('code_'+id)).value.trim();if(!v)return msg('請貼上官方系統產生的服務碼。','error');const{error}=await sb.from('orders').update({seven_eleven_service_code:v,seven_eleven_service_status:'generated',seven_eleven_service_code_at:new Date().toISOString()}).eq('id',id);if(error)return msg(error.message,'error');localStorage.setItem('sevenElevenOfficialCode_'+id,v);msg('官方服務碼已回填資料庫。');load()};window.selectAll=v=>document.querySelectorAll('.pick').forEach(x=>x.checked=v);function selected(){return [...document.querySelectorAll('.pick:checked')].map(x=>x.value)}window.markSelected=async s=>{const ids=selected();if(!ids.length)return msg('請先選擇訂單。','error');ids.forEach(id=>localStorage.setItem('sevenElevenShipStatus_'+id,s));msg('已標記 '+ids.length+' 筆訂單。');load()};window.exportSelected=()=>{const ids=selected();if(!ids.length)return msg('請先選擇訂單。','error');const chosen=rows.filter(r=>ids.includes(r.o.id));const head=['訂單編號','配送日期','取件人姓名','電話','7-ELEVEN門市','商品','商品金額','寄放費','合計','官方服務碼'];const lines=[head,...chosen.map(r=>[r.o.order_number,r.o.delivery_date,r.p.customer_name||'',r.p.customer_phone||'',r.p.pickup_store||'',r.items.map(i=>(i.flavor_name||'商品')+' x '+i.quantity).join(' / '),r.o.product_total,r.o.pickup_fee,r.o.total_amount,r.o.seven_eleven_service_code||code(r.o.id)])];const csv='\ufeff'+lines.map(a=>a.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='7-ELEVEN_官方匯入整理_'+new Date().toISOString().slice(0,10)+'.csv';a.click();URL.revokeObjectURL(u);msg('已建立 '+chosen.length+' 筆出貨整理檔。請用7-ELEVEN官方提供的範例檔格式確認後匯入；本頁不冒充官方檔案格式。')}auth()})();</script></body></html>
