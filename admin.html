<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜後台</title><style>html,body{margin:0;width:100%;height:100%;background:#faf7f2}#frame{display:block;width:100%;height:100%;border:0}</style></head>
<body><div id="loading" style="max-width:700px;margin:80px auto;padding:30px;text-align:center;background:#fff;border-radius:18px;border:1px solid #e7ddd2;font-family:-apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif">老爹・涼糕後台載入中…</div><script>
(async()=>{try{
const r=await fetch('https://raw.githubusercontent.com/lianggaolaodie-create/lianggaolaodie/476e15b906a1b640ce5daa43d36547a84ec3579a/admin.html',{cache:'no-store'});if(!r.ok)throw new Error('後台程式載入失敗（HTTP '+r.status+'）');let h=await r.text();
const injected=`<script>(function(){
function ready(){const panel=document.getElementById('panel');if(!panel)return setTimeout(ready,50);const old=document.getElementById('scheduleCard');if(old)old.remove();
const card=document.createElement('div');card.id='scheduleCardNew';card.className='card';card.innerHTML='<h2>🚚 涼糕餐車</h2><div class="section-note">管理餐車出攤行程。官網餐車區會顯示每個口味的價格／盒。</div><div class="field"><label>行程類型</label><select id="stType"><option value="food_truck">🚚 涼糕餐車</option><option value="stall">🏪 擺攤</option></select></div><div class="grid two"><div class="field"><label>📅 出攤日期</label><input id="stDate" type="date"></div><div class="field"><label>📍 服務地區</label><input id="stRegion" placeholder="例如：桃園全區（不包含復興鄉）"></div><div class="field"><label>🕐 出攤時間</label><div class="actions"><input id="stStart" type="time"><span>～</span><input id="stEnd" type="time"></div></div></div><div class="field"><label>🍡 當日販售口味</label><div id="stFlavors" class="checkgrid">讀取中…</div></div><div class="actions"><label class="switch"><input id="stEnabled" type="checkbox" checked> 開放此行程</label><button id="stAdd">新增行程</button><button class="secondary" id="stRefresh">重新整理</button></div><div id="stList">讀取中…</div>';
const region=document.getElementById('regionCard');region?region.after(card):panel.prepend(card);const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});document.getElementById('stDate').value=today();
async function flavors(){const r=await sb.from('flavors').select('id,name,price,enabled').eq('enabled',true).order('id');const el=document.getElementById('stFlavors');if(r.error){el.textContent=r.error.message;return}el.innerHTML=(r.data||[]).map(f=>'<label class="check"><input class="st-check" type="checkbox" value="'+f.id+'"> '+esc(f.name)+' <span class="small">$'+Number(f.price||0).toLocaleString('zh-TW')+'／盒</span></label>').join('')||'<div class="small">目前沒有啟用中的口味。</div>'}
async function list(){const el=document.getElementById('stList');const r=await sb.from('food_truck_schedules').select('id,schedule_date,schedule_type,region,start_time,end_time,enabled').order('schedule_date',{ascending:false}).order('id',{ascending:false}).limit(100);if(r.error){el.innerHTML='<div class="msg error">'+esc(r.error.message)+'</div>';return}if(!r.data?.length){el.innerHTML='<div class="small">目前尚未建立行程。</div>';return}const ids=r.data.map(x=>x.id);const lr=await sb.from('food_truck_schedule_flavors').select('schedule_id,flavor_id').in('schedule_id',ids);const fs=[...new Set((lr.data||[]).map(x=>x.flavor_id))];const fr=fs.length?await sb.from('flavors').select('id,name,price').in('id',fs):{data:[]};const fm={};(fr.data||[]).forEach(x=>fm[x.id]=x);const by={};(lr.data||[]).forEach(x=>(by[x.schedule_id]??=[]).push(fm[x.flavor_id]));el.innerHTML=r.data.map(s=>{const truck=s.schedule_type!=='stall', arr=(by[s.id]||[]).filter(Boolean), names=arr.map(f=>esc(f.name)).join('、')||'尚未設定';const prices=truck&&arr.length?'<div class="small">💰 '+arr.map(f=>esc(f.name)+' $'+Number(f.price||0).toLocaleString('zh-TW')+'／盒').join('、')+'</div>':'';return '<div class="item"><div class="row"><strong>'+(truck?'🚚 涼糕餐車':'🏪 擺攤')+'</strong><span class="pill">'+(s.enabled?'開放':'關閉')+'</span></div><div>📅 出攤日期：'+esc(s.schedule_date)+'</div><div>📍 服務地區：'+esc(s.region)+'</div><div>🕐 出攤時間：'+esc(s.start_time||'')+(s.end_time?'～'+esc(s.end_time):'')+'</div><div>🍡 當日販售口味：'+names+'</div>'+prices+'<div class="actions" style="margin-top:8px"><button class="danger" onclick="window.delSt('+s.id+')">刪除</button></div></div>'}).join('')}
window.delSt=async id=>{if(!confirm('確定刪除此行程？'))return;const r=await sb.from('food_truck_schedules').delete().eq('id',id);if(r.error)return alert('刪除失敗：'+r.error.message);list()};document.getElementById('stAdd').onclick=async()=>{const type=document.getElementById('stType').value,p={schedule_type:type,schedule_date:document.getElementById('stDate').value, title:type==='stall'?'擺攤':'涼糕餐車',region:document.getElementById('stRegion').value.trim(),start_time:document.getElementById('stStart').value||null,end_time:document.getElementById('stEnd').value||null,note:null,enabled:document.getElementById('stEnabled').checked};if(!p.region)return alert('請輸入服務地區');const r=await sb.from('food_truck_schedules').insert(p).select('id').single();if(r.error)return alert('新增失敗：'+r.error.message);const ids=[...document.querySelectorAll('.st-check:checked')].map(x=>Number(x.value));if(ids.length){const q=await sb.from('food_truck_schedule_flavors').insert(ids.map(flavor_id=>({schedule_id:r.data.id,flavor_id})));if(q.error)return alert('口味儲存失敗：'+q.error.message)}document.getElementById('stRegion').value='';document.querySelectorAll('.st-check').forEach(x=>x.checked=false);await list()};document.getElementById('stRefresh').onclick=()=>{flavors();list()};document.getElementById('stType').onchange=e=>{card.querySelector('h2').textContent=e.target.value==='stall'?'🏪 擺攤':'🚚 涼糕餐車'};flavors();list();}
ready();})();<\/script>`;
h=h.replace('</body>',injected+'</body>');const f=document.createElement('iframe');f.id='frame';f.title='老爹・涼糕後台';f.srcdoc=h;document.body.innerHTML='';document.body.appendChild(f);
}catch(e){document.body.innerHTML='<div style="max-width:700px;margin:80px auto;padding:30px;text-align:center;background:#fff;border-radius:18px;font-family:sans-serif"><strong>後台載入失敗</strong><br><br>'+String(e.message||e)+'</div>'}})();</script></body></html>
