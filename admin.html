<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜後台</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.loading{max-width:700px;margin:80px auto;padding:30px;text-align:center;background:#fff;border-radius:18px;border:1px solid #e7ddd2}</style></head><body><div id="loading" class="loading">老爹・涼糕後台載入中…</div><script>(async()=>{try{const u='https://raw.githubusercontent.com/lianggaolaodie-create/lianggaolaodie/476e15b906a1b640ce5daa43d36547a84ec3579a/admin.html';let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error('後台程式載入失敗（HTTP '+r.status+'）');let h=await r.text();h=h.replace("select('role,enabled')","select('role,enabled,food_truck_schedule_enabled,can_manage_food_truck_schedule')");h=h.replace("window.role=p.role;","window.role=p.role;window.scheduleAllowed=(p.role==='super_admin'||p.food_truck_schedule_enabled===true||p.can_manage_food_truck_schedule===true);");h=h.replace("!['super_admin','order_admin'].includes(p.role)","!window.scheduleAllowed");h=h.replace("if(!['super_admin','order_admin'].includes(window.role))return alert('沒有餐車行程管理權限');","if(!window.scheduleAllowed)return alert('沒有出攤行程管理權限');");h=h.replace('<h2>🚚 涼糕餐車行程</h2>','<h2>🚚 出攤行程管理</h2>');h=h.replace('<div class="section-note">每一趟餐車行程可獨立設定日期、地區、時間與當天販售口味。只有具備餐車行程管理權限的管理員可以修改。</div>','<div class="section-note">分開建立「涼糕餐車」或「擺攤」行程。涼糕餐車官網顯示各口味價格／盒；擺攤官網不顯示價格。</div><div class="field"><label>行程類型</label><select id="scheduleType"><option value="food_truck">🚚 涼糕餐車</option><option value="stall">🏪 擺攤</option></select></div>');h=h.replace("const payload={schedule_date:$('scheduleDate').value||today(),title:$('scheduleTitle').value.trim()||'涼糕餐車',region:","const payload={schedule_type:$('scheduleType').value||'food_truck',schedule_date:$('scheduleDate').value||today(),title:$('scheduleType').value==='stall'?'擺攤':'涼糕餐車',region:");h=h.replace("select('id,schedule_date,region,start_time,end_time,note,enabled')","select('id,schedule_date,schedule_type,region,start_time,end_time,note,enabled')");h=h.replace("'<div class=\"item\"><div class=\"row\"><div><strong>'+esc(s.title||'涼糕餐車')+'</strong>","'<div class=\"item\"><div class=\"row\"><div><strong>'+(s.schedule_type==='stall'?'🏪 擺攤':'🚚 涼糕餐車')+'</strong>");h=h.replace('<button onclick="addSchedule()">新增餐車行程</button>','<button onclick="addSchedule()">新增出攤行程</button>');const extra=`<style>#flavorEditModal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:99999;display:none;align-items:flex-end;justify-content:center;padding:18px;box-sizing:border-box}#flavorEditModal .box{width:min(620px,100%);max-height:82vh;overflow:auto;background:#fff;border-radius:22px;padding:22px;box-sizing:border-box;box-shadow:0 12px 40px rgba(0,0,0,.25)}#flavorEditModal h3{margin:0 0 8px;font-size:22px}#flavorEditModal .hint{color:#75685f;font-size:14px;margin-bottom:14px}.flavor-check{display:flex;align-items:center;gap:12px;padding:13px 10px;border:1px solid #e5ddd5;border-radius:12px;margin:8px 0;font-size:17px}.flavor-check input{width:22px;height:22px}.flavor-actions{display:flex;gap:10px;margin-top:18px}.flavor-actions button{flex:1;border:0;border-radius:12px;padding:13px;font-size:17px}.flavor-cancel{background:#eee}.flavor-save{background:#744528;color:#fff}</style><div id="flavorEditModal"><div class="box"><h3>🍡 當日販售口味</h3><div class="hint">直接勾選／取消勾選，儲存後會立即更新這趟行程的口味。</div><div id="flavorEditList">載入口味中…</div><div class="flavor-actions"><button class="flavor-cancel" onclick="closeFlavorEdit()">取消</button><button class="flavor-save" onclick="saveFlavorEdit()">儲存口味</button></div></div></div><script>window.closeFlavorEdit=()=>{const m=document.getElementById('flavorEditModal');if(m)m.style.display='none';window.__editingScheduleId=null};window.editSchedule=async id=>{if(!window.scheduleAllowed)return alert('沒有出攤行程管理權限');window.__editingScheduleId=id;const{data:s,error}=await sb.from('food_truck_schedules').select('*').eq('id',id).single();if(error)return alert('讀取行程失敗：'+error.message);const{data:allFlavors,error:fe}=await sb.from('flavors').select('id,name,price').eq('enabled',true).order('id');if(fe)return alert('讀取口味失敗：'+fe.message);const{data:links,error:le}=await sb.from('food_truck_schedule_flavors').select('flavor_id').eq('schedule_id',id);if(le)return alert('讀取當日口味失敗：'+le.message);const selected=new Set((links||[]).map(x=>String(x.flavor_id)));document.getElementById('flavorEditList').innerHTML=(allFlavors||[]).map(f=>'<label class="flavor-check"><input type="checkbox" value="'+f.id+'" '+(selected.has(String(f.id))?'checked':'')+'><span>'+esc(f.name)+'</span></label>').join('')||'<div>目前沒有啟用中的口味。</div>';document.getElementById('flavorEditModal').style.display='flex'};window.saveFlavorEdit=async()=>{const id=window.__editingScheduleId;if(!id)return;const ids=[...document.querySelectorAll('#flavorEditList input[type=checkbox]:checked')].map(x=>Number(x.value));const{error:de}=await sb.from('food_truck_schedule_flavors').delete().eq('schedule_id',id);if(de)return alert('清除原口味失敗：'+de.message);if(ids.length){const{error:ie}=await sb.from('food_truck_schedule_flavors').insert(ids.map(flavor_id=>({schedule_id:id,flavor_id})));if(ie)return alert('儲存新口味失敗：'+ie.message)}closeFlavorEdit();alert('當日口味已更新');if(typeof loadSchedules==='function')loadSchedules()};</script>`;h=h.replace('</body>',extra+'</body>');document.open();document.write(h);document.close()}catch(e){document.getElementById('loading').innerHTML='<strong>後台載入失敗</strong><br><br>'+String(e.message||e)}})()</script></body></html>
