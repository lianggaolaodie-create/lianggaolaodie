<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>老爹．涼糕｜線上訂購管理後台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.shell{max-width:1200px;margin:auto;padding:16px}.top,.card{background:#fff;border:1px solid #e7ddd5;border-radius:18px;padding:18px;margin-bottom:14px}.brand{font-size:22px;font-weight:900}.muted{color:#766b64;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid #e7ddd5;border-radius:14px;padding:14px}.stat b{display:block;font-size:25px;margin-top:4px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.toolbar h2{margin:0}.filters{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr auto;gap:9px;margin-top:14px}.field input,.field select{width:100%;padding:11px;border:1px solid #d9cec6;border-radius:10px;background:#fff;font:inherit}.btn{border:0;border-radius:10px;padding:10px 14px;background:#8d5939;color:#fff;font-weight:800;cursor:pointer}.btn.gray{background:#6d625b}.btn.green{background:#357653}.btn.red{background:#a63d36}.order{border:1px solid #e6dbd3;border-radius:14px;padding:14px;margin-top:10px}.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:900}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-size:12px;background:#eee7e1;margin:2px 4px 2px 0}.ok{background:#e7f5ec;color:#2d714c}.wait{background:#fff4df;color:#8a5a18}.danger{background:#f6e9e7;color:#a13c35}.notice{padding:10px;border-radius:10px;margin-top:10px}.notice.ok{background:#edf8f1;color:#286c47}.notice.err{background:#fff0ef;color:#a43b35}.login{max-width:520px;margin:60px auto}.modal{position:fixed;inset:0;background:rgba(30,22,18,.5);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}.modalbox{background:#fff;width:min(760px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:18px}.hidden{display:none!important}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.item{padding:8px 0;border-bottom:1px solid #eee6df}.item:last-child{border-bottom:0}.empty{text-align:center;padding:30px;color:#766b64}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}.filters,.grid{grid-template-columns:1fr}.orderhead{display:block}}
</style>
</head>
<body>
<div id="loginView" class="shell login"><div class="card"><div class="brand">📋 老爹．涼糕｜線上訂購管理後台</div><p class="muted">獨立訂單管理，不與商品管理、餐車行程後台混合。</p><form id="loginForm"><div style="margin:10px 0"><label>管理員 Email</label><input id="email" type="email" autocomplete="username" required></div><div style="margin:10px 0"><label>密碼</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="loginBtn">登入</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="shell hidden">
<div class="top"><div class="brand">📋 老爹．涼糕｜線上訂購管理後台</div><div id="userText" class="muted"></div></div>
<div class="card"><div class="stats"><div class="stat">全部訂單<b id="sAll">0</b></div><div class="stat">待處理<b id="sPending">0</b></div><div class="stat">待付款<b id="sPay">0</b></div><div class="stat">已完成<b id="sDone">0</b></div></div></div>
<div class="card"><div class="toolbar"><h2>線上訂單</h2><div><button class="btn gray" onclick="loadOrders()">重新整理</button> <button class="btn gray" onclick="logout()">登出</button></div></div>
<div class="filters"><input id="q" placeholder="搜尋訂單編號／姓名／電話"><select id="status"><option value="">全部訂單狀態</option><option value="pending">待處理</option><option value="confirmed">已確認</option><option value="preparing">製作中</option><option value="ready">待取貨</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select><select id="payment"><option value="">全部付款狀態</option><option value="pending">待付款</option><option value="submitted">已提供後五碼</option><option value="paid">已付款</option><option value="failed">付款失敗</option></select><select id="pickup"><option value="">全部取貨方式</option><option value="delivery">配送</option><option value="familymart">全家冷藏寄放</option><option value="seven_eleven">7-ELEVEN冷藏寄放</option><option value="food_truck">餐車取貨</option></select><button class="btn" onclick="render()">篩選</button></div>
<div id="msg"></div><div id="list"></div></div>
<div class="card"><button class="btn gray" onclick="logout()">登出</button></div>
</div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="toolbar"><h2>訂單詳細資料</h2><button class="btn gray" onclick="closeModal()">關閉</button></div><div id="detail"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let orders=[],items={},privateData={};
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function notice(text,error=false){$('msg').innerHTML='<div class="notice '+(error?'err':'ok')+'">'+esc(text)+'</div>'}
async function access(user){const r=await sb.from('admin_profiles').select('role,enabled').eq('user_id',user.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'管理員帳號目前已停用';if(r.data.role!=='super_admin'&&r.data.role!=='order_admin'&&r.data.role!=='personal_data_admin')return'此帳號沒有訂單管理權限';return null}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;try{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const er=await access(r.data.user);if(er){await sb.auth.signOut();throw new Error(er)}openApp(r.data.user)}catch(x){$('loginMsg').innerHTML='<div class="notice err">登入失敗：'+esc(x.message)+'</div>'}finally{$('loginBtn').disabled=false}};
function openApp(u){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('userText').textContent='已登入 · '+u.email;loadOrders()}
async function loadOrders(){notice('讀取訂單中…');const r=await sb.from('orders').select('id,order_number,delivery_date,delivery_region,pickup_type,product_total,pickup_fee,total_amount,status,payment_status,transfer_last5,transfer_proof_path,created_at,updated_at,internal_barcode,seven_eleven_tracking_code,label_generated_at,seven_eleven_service_code,seven_eleven_service_status,seven_eleven_service_code_at').order('created_at',{ascending:false});if(r.error){notice('訂單讀取失敗：'+r.error.message,true);return}orders=r.data||[];items={};privateData={};const ids=orders.map(o=>o.id);if(ids.length){const [ir,pr]=await Promise.all([sb.from('order_items').select('order_id,flavor_name,unit_price,quantity,subtotal').in('order_id',ids),sb.from('order_private').select('order_id,customer_name,customer_phone,customer_note,pickup_store').in('order_id',ids)]);if(!ir.error)(ir.data||[]).forEach(x=>(items[x.order_id]??=[]).push(x));if(!pr.error)(pr.data||[]).forEach(x=>privateData[x.order_id]=x)}render();$('msg').innerHTML=''}
function match(o){const q=$('q').value.trim().toLowerCase(),st=$('status').value,pa=$('payment').value,pu=$('pickup').value,p=privateData[o.id]||{};if(st&&o.status!==st)return false;if(pa&&o.payment_status!==pa)return false;if(pu&&o.pickup_type!==pu)return false;if(!q)return true;return [o.order_number,p.customer_name,p.customer_phone].some(x=>String(x||'').toLowerCase().includes(q))}
function labelStatus(v){return {pending:'待處理',confirmed:'已確認',preparing:'製作中',ready:'待取貨',completed:'已完成',cancelled:'已取消'}[v]||v||'未設定'}
function labelPayment(v){return {pending:'待付款',submitted:'已提供後五碼',paid:'已付款',failed:'付款失敗'}[v]||v||'未設定'}
function labelPickup(v){return {delivery:'配送',familymart:'全家冷藏寄放',seven_eleven:'7-ELEVEN冷藏寄放',food_truck:'餐車取貨'}[v]||v||'未設定'}
function badge(text,kind=''){return '<span class="badge '+kind+'">'+esc(text)+'</span>'}
function render(){const view=orders.filter(match);$('sAll').textContent=orders.length;$('sPending').textContent=orders.filter(x=>['pending','confirmed','preparing','ready'].includes(x.status)).length;$('sPay').textContent=orders.filter(x=>!['paid'].includes(x.payment_status)).length;$('sDone').textContent=orders.filter(x=>x.status==='completed').length;if(!view.length){$('list').innerHTML='<div class="empty">目前沒有符合條件的訂單。</div>';return}$('list').innerHTML=view.map(o=>{const p=privateData[o.id]||{},its=items[o.id]||[];return '<div class="order"><div class="orderhead"><span>訂單 '+esc(o.order_number)+'</span><span>'+badge(labelStatus(o.status),o.status==='completed'?'ok':o.status==='cancelled'?'danger':'wait')+' '+badge(labelPayment(o.payment_status),o.payment_status==='paid'?'ok':'wait')+'</span></div><div class="grid"><div><b>客戶</b><br>'+esc(p.customer_name||'—')+'　'+esc(p.customer_phone||'—')+'</div><div><b>取貨方式</b><br>'+esc(labelPickup(o.pickup_type))+(p.pickup_store?'　'+esc(p.pickup_store):'')+'</div><div><b>配送日期／地區</b><br>'+esc(o.delivery_date||'—')+'　'+esc(o.delivery_region||'—')+'</div><div><b>金額</b><br>商品 NT$ '+Number(o.product_total||0).toLocaleString()+' ＋寄放 NT$ '+Number(o.pickup_fee||0).toLocaleString()+' ＝ <b>NT$ '+Number(o.total_amount||0).toLocaleString()+'</b></div></div><div style="margin-top:8px">'+its.map(i=>esc(i.flavor_name)+' × '+Number(i.quantity||0)+'（NT$ '+Number(i.subtotal||0).toLocaleString()+'）').join('、')+'</div><div class="actions"><button class="btn" onclick="openDetail(\''+o.id+'\')">查看／處理訂單</button></div></div>'}).join('')}
function openDetail(id){const o=orders.find(x=>x.id===id),p=privateData[id]||{},its=items[id]||[];if(!o)return;$('detail').innerHTML='<div class="grid"><div><b>訂單編號</b><br>'+esc(o.order_number)+'</div><div><b>建立時間</b><br>'+esc(new Date(o.created_at).toLocaleString('zh-TW'))+'</div><div><b>客戶姓名</b><br>'+esc(p.customer_name||'—')+'</div><div><b>電話</b><br>'+esc(p.customer_phone||'—')+'</div><div><b>取貨方式</b><br>'+esc(labelPickup(o.pickup_type))+'</div><div><b>取貨門市</b><br>'+esc(p.pickup_store||'—')+'</div><div><b>配送日期</b><br>'+esc(o.delivery_date||'—')+'</div><div><b>服務地區</b><br>'+esc(o.delivery_region||'—')+'</div></div><div class="item"><b>商品</b><br>'+its.map(i=>esc(i.flavor_name)+' × '+Number(i.quantity||0)+'　單價 NT$ '+Number(i.unit_price||0).toLocaleString()+'　小計 NT$ '+Number(i.subtotal||0).toLocaleString()).join('<br>')+'</div><div class="item"><b>金額</b><br>商品 NT$ '+Number(o.product_total||0).toLocaleString()+'<br>寄放費 NT$ '+Number(o.pickup_fee||0).toLocaleString()+'<br><b>合計 NT$ '+Number(o.total_amount||0).toLocaleString()+'</b></div><div class="item"><b>付款</b><br>狀態：'+badge(labelPayment(o.payment_status),o.payment_status==='paid'?'ok':'wait')+'<br>匯款後五碼：'+esc(o.transfer_last5||'—')+'</div><div class="item"><b>7-ELEVEN</b><br>服務碼：'+esc(o.seven_eleven_service_code||'—')+'<br>物流追蹤碼：'+esc(o.seven_eleven_tracking_code||'—')+'<br>服務狀態：'+esc(o.seven_eleven_service_status||'—')+'</div><div class="item"><b>客戶備註</b><br>'+esc(p.customer_note||'—')+'</div><div class="actions"><select id="editStatus"><option value="pending">待處理</option><option value="confirmed">已確認</option><option value="preparing">製作中</option><option value="ready">待取貨</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select><select id="editPayment"><option value="pending">待付款</option><option value="submitted">已提供後五碼</option><option value="paid">已付款</option><option value="failed">付款失敗</option></select><button class="btn green" onclick="saveOrder(\''+id+'\')">儲存訂單狀態</button></div>';setTimeout(()=>{$('editStatus').value=o.status||'pending';$('editPayment').value=o.payment_status||'pending'},0);$('modal').classList.remove('hidden')}
async function saveOrder(id){const r=await sb.from('orders').update({status:$('editStatus').value,payment_status:$('editPayment').value,updated_at:new Date().toISOString()}).eq('id',id);if(r.error){alert('儲存失敗：'+r.error.message);return}closeModal();await loadOrders()}
function closeModal(){$('modal').classList.add('hidden')}
async function logout(){await sb.auth.signOut();location.reload()}
(async()=>{const s=await sb.auth.getSession();if(s.data.session){const e=await access(s.data.session.user);if(!e)openApp(s.data.session.user)}})();
</script>
</body>
</html>
