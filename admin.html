=h.replace("'<div class=\"item\"><div class=\"row\"><div><strong>'+esc(s.title||'涼糕餐車')+'</strong>","'<div class=\"item\"><div class=\"row\"><div><strong>'+(s.schedule_type==='stall'?'🏪 擺攤':'🚚 涼糕餐車')+'</strong>");h=h.replace('<button onclick="addSchedule()">新增餐車行程</button>','<button onclick="addSchedule()">新增出攤行程</button>');h=h.replace("window.editSchedule=async id=>{alert('目前先支援新增與刪除；編輯功能下一版接著補上。餐車行程與口味資料已建立。')};","window.editSchedule=async id=>{if(!window.scheduleAllowed)return alert('沒有出攤行程管理權限');const{data:s,error}=await sb.from('food_truck_schedules').select('*').eq('id',id).single();if(error)return alert('讀取行程失敗：'+error.message);const type=prompt('行程類型：輸入 food_truck=涼糕餐車、stall=擺攤',s.schedule_type||'food_truck');if(type!==null&&type!=='food_truck'&&type!=='stall')return alert('行程類型只能是 food_truck 或 stall');const date=prompt('出攤日期 YYYY-MM-DD',s.schedule_date||'');if(date===null)return;const region=prompt('服務地區',s.region||'');if(region===null)return;const start=prompt('開始時間 HH:MM',s.start_time||'');if(start===null)return;const end=prompt('結束時間 HH:MM（可留空）',s.end_time||'');if(end===null)return;const note=prompt('備註（可留空）',s.note||'');if(note===null)return;const{error:ue}=await sb.from('food_truck_schedules').update({schedule_type:type||s.schedule_type||'food_truck',title:type==='stall'?'擺攤':'涼糕餐車',schedule_date:date,region,start_time:start||null,end_time:end||null,note:note||null}).eq('id',id);if(ue)return alert('行程儲存失敗：'+ue.message);alert('行程已更新');loadSchedules()};");document.open();document.write(h);document.close()}catch(e){document.getElementById('loading').innerHTML='<strong>後台載入失敗</strong><br><br>'+String(e.message||e)}})()</script></body></html>
