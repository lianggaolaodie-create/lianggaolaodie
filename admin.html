<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜後台</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0000000a}h1{margin:0 0 8px}h2{font-size:19px}.grid{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.row:last-child{border:0}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d9cdc1;border-radius:10px;box-sizing:border-box;font:inherit}button{border:0;border-radius:11px;padding:11px 15px;background:#9b5c38;color:#fff;font-weight:800}button.secondary{background:#eee;color:#333}button:disabled{opacity:.5}.msg{padding:12px;border-radius:10px;background:#f6eee7;margin-top:10px}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}.hidden{display:none}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#f4ebe3;font-size:13px}.order{border:1px solid #eadfd4;border-radius:13px;padding:12px;margin:9px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:13px;color:#75685f}.switch{display:flex;align-items:center;gap:8px}.switch input{width:auto}.save{margin-top:10px}.adminline{display:grid;grid-template-columns:1fr 150px 90px auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.adminline select,.adminline input{padding:9px;border:1px solid #d9cdc1;border-radius:9px}@media(max-width:650px){.adminline{grid-template-columns:1fr 1fr}.adminline button{grid-column:2}.adminline .small{grid-column:1/3}}</style></head><body><div class="wrap"><div class="card"><h1>老爹・涼糕 後台</h1><div id="who" class="small">尚未登入</div></div><div id="login" class="card"><h2>管理員登入</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" type="button">登入後台</button><a href="reset-password.html" style="display:block;margin-top:12px;color:#9b5c38;font-weight:700;text-decoration:none">忘記密碼／重設密碼</a><div id="loginMsg"></div></div><div id="panel" class="hidden"><div class="card"><div class="actions"><button class="secondary" id="refreshBtn">重新整理</button><button class="secondary" id="logoutBtn">登出</button></div><div id="roleMsg" class="msg"></div></div><div id="adminCard" class="card hidden"><h2>👤 管理員權限</h2><div class="small">只有 Super Admin 可以修改其他管理員的角色與啟用狀態。</div><div id="adminBox">讀取中…</div></div><div class="card"><h2>🏪 冷藏寄放設定</h2><div id="pickupBox">讀取中…</div></div><div class="card"><h2>💳 匯款設定</h2><div id="paymentBox">讀取中…</div></div><div class="card"><h2>📦 最新訂單</h2><div id="ordersBox">讀取中…</div></div><div id="privateCard" class="card hidden"><h2>🔒 個資管理</h2><div class="small">只有個資管理員可讀取完整姓名、電話與取貨門市。</div><div id="privateBox">讀取中…</div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){const $=x=>document.getElementById(x),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function showError(m){$('loginMsg').innerHTML='<div class="msg error">'+esc(m)+'</div>'}window.addEventListener('error',e=>{if($('loginMsg'))showError('頁面載入錯誤：'+(e.message||'請重新整理頁面'))});window.addEventListener('unhandledrejection',e=>{if($('loginMsg'))showError('系統錯誤：'+(e.reason?.message||e.reason||'請重新整理頁面'))});if(!window.supabase){showError('登入元件載入失敗，請重新整理頁面');return}const URL='https://yemzdwxtyosuaczsqwea.supabase.co',KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',sb=window.supabase.createClient(URL,KEY),money=n=>'$'+Number(n||0).toLocaleString('zh-TW'),status={pending:'待處理',confirmed:'已確認',preparing:'製作中',shipped:'已出貨',completed:'已完成',cancelled:'已取消'};async function init(){try{const{data:{session}}=await sb.auth.getSession();if(session)await showPanel(session.user)}catch(e){showError('初始化失敗：'+(e.message||e))}}$('loginBtn').addEventListener('click',async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return showError('請輸入 Email 和密碼');const b=$('loginBtn');b.disabled=true;b.textContent='登入中…';$('loginMsg').innerHTML='';try{const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)return showError('登入失敗：'+error.message);await showPanel(data.user)}catch(e){showError('登入失敗：'+(e.message||e))}finally{b.disabled=false;b.textContent='登入後台'}});$('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});$('refreshBtn').addEventListener('click',loadAll);async function showPanel(user){$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('who').textContent=user.email||'';const{data:p,error}=await sb.from('admin_profiles').select('role,enabled').eq('user_id',user.id).maybeSingle();if(error||!p||!p.enabled){$('roleMsg').className='msg error';$('roleMsg').textContent='此帳號不是啟用中的管理員。';return}window.role=p.role;$('roleMsg').innerHTML='目前權限：<span class="pill">'+esc(p.role)+'</span>';if(p.role==='personal_data_admin')$('privateCard').classList.remove('hidden');if(p.role==='super_admin')$('adminCard').classList.remove('hidden');await loadAll()}async function loadAll(){await Promise.all([loadAdmins(),loadPickup(),loadPayment(),loadOrders(),window.role==='personal_data_admin'?loadPrivate():Promise.resolve()])}async function loadAdmins(){if(window.role!=='super_admin')return;const{data,error}=await sb.from('admin_profiles').select('user_id,email,role,enabled').order('email');if(error)return $('adminBox').innerHTML='<div class="msg error">'+esc(error.message)+'</div>';if(!data?.length)return $('adminBox').textContent='目前沒有管理員資料。';$('adminBox').innerHTML=data.map(a=>'<div class="adminline"><div><strong>'+esc(a.email||a.user_id)+'</strong><div class="small">'+esc(a.user_id)+'</div></div><select id="role_'+a.user_id+'"><option value="super_admin" '+(a.role==='super_admin'?'selected':'')+'>Super Admin</option><option value="order_admin" '+(a.role==='order_admin'?'selected':'')+'>訂單管理員</option><option value="personal_data_admin" '+(a.role==='personal_data_admin'?'selected':'')+'>個資管理員</option></select><label class="switch"><input id="en_'+a.user_id+'" type="checkbox" '+(a.enabled?'checked':'')+'>啟用</label><button onclick="saveAdmin(\''+a.user_id+'\')">儲存</button></div>').join('')}window.saveAdmin=async id=>{const role=$('role_'+id).value,enabled=$('en_'+id).checked;const{error}=await sb.from('admin_profiles').update({role,enabled}).eq('user_id',id);if(error)return alert('權限儲存失敗：'+error.message);alert('權限已儲存');loadAdmins()};async function loadPickup(){const{data,error}=await sb.from('pickup_settings').select('*').eq('id',1).maybeSingle();if(error)return $('pickupBox').innerHTML='<div class="msg error">'+esc(error.message)+'</div>';if(!data)return $('pickupBox').textContent='尚無設定';$('pickupBox').innerHTML='<div class="field"><label>全家</label><div class="actions"><label class="switch"><input id="fm_on" type="checkbox" '+(data.familymart_enabled?'checked':'')+'> 開放</label><input id="fm_fee" type="number" min="0" value="'+Number(data.familymart_fee||0)+'" placeholder="寄放費用"></div></div><div class="field"><label>7-ELEVEN</label><div class="actions"><label class="switch"><input id="se_on" type="checkbox" '+(data.seven_eleven_enabled?'checked':'')+'> 開放</label><input id="se_fee" type="number" min="0" value="'+Number(data.seven_eleven_fee||0)+'" placeholder="寄放費用"></div></div><button class="save" onclick="savePickup()">儲存冷藏寄放設定</button>'}window.savePickup=async()=>{const{error}=await sb.from('pickup_settings').update({familymart_enabled:$('fm_on').checked,familymart_fee:Number($('fm_fee').value||0),seven_eleven_enabled:$('se_on').checked,seven_eleven_fee:Number($('se_fee').value||0)}).eq('id',1);if(error)return alert('冷藏寄放設定儲存失敗：'+error.message);alert('冷藏寄放設定已儲存');loadPickup()};async function loadPayment(){const{data,error}=await sb.from('payment_settings').select('*').eq('id',1).maybeSingle();if(error)return $('paymentBox').innerHTML='<div class="msg error">'+esc(error.message)+'</div>';if(!data)return $('paymentBox').textContent='尚無設定';$('paymentBox').innerHTML='<div class="field"><label>匯款功能</label><label class="switch"><input id="pay_on" type="checkbox" '+(data.enabled?'checked':'')+'> 開啟匯款功能</label></div><div class="field"><label>銀行</label><input id="bank" value="'+esc(data.bank_name||'')+'" placeholder="銀行名稱"></div><div class="field"><label>分行</label><input id="branch" value="'+esc(data.branch_name||'')+'" placeholder="分行名稱"></div><div class="field"><label>帳號</label><input id="acct" inputmode="numeric" value="'+esc(data.account_number||'')+'" placeholder="銀行帳號"></div><div class="field"><label>戶名</label><input id="acctname" value="'+esc(data.account_name||'')+'" placeholder="收款戶名"></div><button class="save" onclick="savePayment()">儲存匯款設定</button><div class="small" style="margin-top:8px">匯款功能關閉時，客戶端不會啟用匯款付款流程。</div>'}window.savePayment=async()=>{const{error}=await sb.from('payment_settings').update({enabled:$('pay_on').checked,bank_name:$('bank').value.trim(),branch_name:$('branch').value.trim(),account_number:$('acct').value.trim(),account_name:$('acctname').value.trim()}).eq('id',1);if(error)return alert('匯款設定儲存失敗：'+error.message);alert('匯款設定已儲存');loadPayment()};async function loadOrders(){const{data,error}=await sb.from('orders').select('id,order_number,delivery_date,delivery_region,pickup_type,total_amount,status,payment_status,transfer_last5,created_at').order('created_at',{ascending:false}).limit(30);if(error)return $('ordersBox').innerHTML='<div class="msg error">'+esc(error.message)+'</div>';if(!data?.length)return $('ordersBox').textContent='目前沒有訂單。';$('ordersBox').innerHTML=data.map(o=>'<div class="order"><strong>'+esc(o.order_number)+'</strong><div class="small">'+esc(o.delivery_date)+' · '+esc(o.delivery_region)+' · '+(o.pickup_type==='familymart'?'全家':'7-ELEVEN')+'</div><div>總額 '+money(o.total_amount)+'　付款：'+esc(o.payment_status||'')+'　進度：'+esc(status[o.status]||o.status)+'</div><div class="small">匯款末五碼：'+esc(o.transfer_last5||'未提供')+'</div><div class="actions" style="margin-top:8px">'+(o.payment_status==='proof_submitted'?'<button onclick="confirmPay(\''+o.id+'\')">確認付款</button>':'')+'<select onchange="changeStatus(\''+o.id+'\',this.value)"><option value="">修改訂單進度</option>'+Object.entries(status).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select></div></div>').join('')}window.confirmPay=async id=>{const{error}=await sb.rpc('admin_confirm_payment',{p_order_id:id});if(error)alert('確認付款失敗：'+error.message);else{alert('付款已確認');loadOrders()}};window.changeStatus=async(id,s)=>{if(!s)return;const{error}=await sb.rpc('admin_update_order_status',{p_order_id:id,p_status:s});if(error)alert('更新失敗：'+error.message);else loadOrders()};async function loadPrivate(){const{data,error}=await sb.rpc('personal_data_admin_orders');if(error)return $('privateBox').innerHTML='<div class="msg error">'+esc(error.message)+'</div>';if(!data?.length)return $('privateBox').textContent='目前沒有訂單個資。';$('privateBox').innerHTML=data.map(o=>'<div class="order"><strong>'+esc(o.order_number)+'</strong><div>'+esc(o.customer_name||'')+' · '+esc(o.customer_phone||'')+'</div><div>取貨：'+esc(o.pickup_store||'')+'</div><div class="small">備註：'+esc(o.customer_note||'')+'</div></div>').join('')}init();})();
</script></body></html>
