<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜後台</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:980px;margin:auto;padding:24px 16px 70px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0000000a}h1{margin:0 0 8px}h2{font-size:19px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d9cdc1;border-radius:10px;box-sizing:border-box;font:inherit}.field textarea{min-height:70px}button{border:0;border-radius:11px;padding:11px 15px;background:#9b5c38;color:#fff;font-weight:800}button.secondary{background:#eee;color:#333}.msg{padding:12px;border-radius:10px;background:#f6eee7;margin-top:10px}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}.hidden{display:none}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#f4ebe3;font-size:13px}.item{border:1px solid #eadfd4;border-radius:13px;padding:13px;margin:9px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:13px;color:#75685f}.flavors{line-height:1.9}.section-title{display:flex;justify-content:space-between;align-items:center;gap:8px}.section-title h2{margin:0}.hint{background:#fff8ed;border:1px solid #f0ddc4;padding:12px;border-radius:12px;margin:10px 0}@media(max-width:650px){.grid{grid-template-columns:1fr}.wrap{padding:16px 12px 60px}.card{padding:16px}}
</style></head><body><div class="wrap"><div class="card"><h1>老爹・涼糕 後台</h1><div id="who" class="small">尚未登入</div></div><div id="initMsg" class="msg hidden"></div><div id="login" class="card"><h2>管理員登入</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" type="button">登入後台</button><div id="loginMsg"></div></div><div id="panel" class="hidden"><div class="card"><div class="actions"><button class="secondary" id="refreshBtn">重新整理</button><button class="secondary" id="logoutBtn">登出</button></div><div id="roleMsg" class="msg"></div></div><div id="scheduleCard" class="card hidden"><div class="section-title"><h2>🚚 涼糕餐車區塊</h2></div><div class="hint">餐車行程會顯示：📅 出攤日期　📍 服務地區　🕐 出攤時間　🍡 當日販售口味　💰 每個口味的價格／盒</div><div class="grid"><div class="field"><label>出攤日期</label><input id="ftDate" type="date"></div><div class="field"><label>服務地區</label><input id="ftRegion" placeholder="例如：桃園全區（不包含復興鄉）"></div><div class="field"><label>出攤開始時間</label><input id="ftStart" type="time"></div><div class="field"><label>出攤結束時間</label><input id="ftEnd" type="time"></div></div><div class="field"><label>當日販售口味</label><div id="ftFlavors">讀取中…</div></div><button id="addFoodTruck" type="button">新增涼糕餐車行程</button><div id="ftMsg"></div><div id="ftList" style="margin-top:14px">讀取中…</div></div><div id="boothCard" class="card hidden"><div class="section-title"><h2>🏪 擺攤區塊</h2></div><div class="hint">擺攤行程只顯示：📅 出攤日期　📍 服務地區　🕐 出攤時間　🍡 當日販售口味，不顯示價格。</div><div class="grid"><div class="field"><label>出攤日期</label><input id="boothDate" type="date"></div><div class="field"><label>服務地區</label><input id="boothRegion" placeholder="例如：萬華雙和市場"></div><div class="field"><label>出攤開始時間</label><input id="boothStart" type="time"></div><div class="field"><label>出攤結束時間</label><input id="boothEnd" type="time"></div></div><div class="field"><label>當日販售口味</label><div id="boothFlavors">讀取中…</div></div><button id="addBooth" type="button">新增擺攤行程</button><div id="boothMsg"></div><div id="boothList" style="margin-top:14px">讀取中…</div></div><div class="card"><h2>🏪 冷藏寄放設定</h2><div id="pickupBox">讀取中…</div></div><div class="card"><h2>💳 匯款設定</h2><div id="paymentBox">讀取中…</div></div><div class="card"><h2>📦 最新訂單</h2><div id="ordersBox">讀取中…</div></div><div id="privateCard" class="card hidden"><h2>🔒 個資管理</h2><div class="small">只有個資管理員可讀取完整姓名、電話與取貨門市。</div><div id="privateBox">讀取中…</div></div></div></div>
<script>window.addEventListener('error',e=>{const b=document.getElementById('initMsg');if(b){b.className='msg error';b.classList.remove('hidden');b.textContent='後台初始化失敗：'+(e.message||'請重新整理頁面。')}});</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>if(!window.supabase){const s=document.createElement('script');s.src='https://unpkg.com/@supabase/supabase-js@2';s.onload=start;s.onerror=()=>{const b=document.getElementById('initMsg');b.className='msg error';b.classList.remove('hidden');b.textContent='後台初始化失敗：Supabase 程式載入失敗，請重新整理。'};document.head.appendChild(s)}else start();function start(){try{window.sb=window.supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');bind()}catch(e){const b=document.getElementById('initMsg');b.className='msg error';b.classList.remove('hidden');b.textContent='後台初始化失敗：'+e.message}}const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>'$'+Number(n||0).toLocaleString('zh-TW');const status={pending:'待處理',confirmed:'已確認',preparing:'製作中',shipped:'已出貨',completed:'已完成',cancelled:'已取消'};let role='',flavors=[];function bind(){$('loginBtn').onclick=login;$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refreshBtn').onclick=loadAll;$('addFoodTruck').onclick=()=>addSchedule('food_truck');$('addBooth').onclick=()=>addSchedule('booth');init()}async function init(){const{data:{session}}=await sb.auth.getSession();if(session)await showPanel(session.user)}async function login(){const btn=$('loginBtn');btn.disabled=true;btn.textContent='登入中…';$('loginMsg').innerHTML='';try{const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){$('loginMsg').innerHTML='<div class="msg error">登入失敗：'+esc(error.message)+'</div>';return}await showPanel(data.user)}catch(e){$('loginMsg').innerHTML='<div class="msg error">登入失敗：'+esc(e.message||e)+'</div>'}finally{btn.disabled=false;btn.textContent='登入後台'}}async function showPanel(user){$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('who').textContent=user.email||'';const{data:p,error}=await sb.from('admin_profiles').select('role,enabled,food_truck_schedule_enabled,can_manage_food_truck_schedule').eq('user_id',user.id).maybeSingle();if(error){$('roleMsg').className='msg error';$('roleMsg').textContent='讀取管理員權限失敗：'+error.message;return}if(!p||!p.enabled){$('roleMsg').className='msg error';$('roleMsg').textContent='此帳號不是啟用中的管理員。';return}role=p.role;$('roleMsg').innerHTML='目前權限：<span class="pill">'+esc(p.role)+'</span>';const allowed=role==='super_admin'||p.food_truck_schedule_enabled===true||p.can_manage_food_truck_schedule===true;if(allowed){$('scheduleCard').classList.remove('hidden');$('boothCard').classList.remove('hidden')}if(role==='personal_data_admin')$('privateCard').classList.remove('hidden');await loadAll()}async function loadAll(){await Promise.all([loadPickup(),loadPayment(),loadOrders(),loadFlavors(),loadSchedules(),role==='personal_data_admin'?loadPrivate():Promise.resolve()])}async function loadFlavors(){const{data,error}=await sb.from('flavors').select('id,name,price,enabled').eq('enabled',true).order('created_at',{ascending:true});if(error){flavors=[];return}flavors=data||[];['ftFlavors','boothFlavors'].forEach(id=>$(id).innerHTML=flavors.length?flavors.map(f=>'<label style="display:block;margin:5px 0"><input type="checkbox" value="'+f.id+'"> '+esc(f.name)+(id==='ftFlavors'?' · '+money(f.price)+'/盒':'')+'</label>').join(''):'目前沒有啟用中的口味。')}async function addSchedule(type){const prefix=type==='food_truck'?'ft':'booth',date=$(prefix+'Date').value,region=$(prefix+'Region').value.trim(),start=$(prefix+'Start').value,end=$(prefix+'End').value,ids=[...$(prefix+'Flavors').querySelectorAll('input:checked')].map(x=>Number(x.value)),msg=$(prefix+'Msg');if(!date||!region){msg.innerHTML='<div class="msg error">請填寫出攤日期與服務地區。</div>';return}const{data,error}=await sb.from('food_truck_schedules').insert({schedule_date:date,title:type==='food_truck'?'涼糕餐車':'擺攤',region,start_time:start||null,end_time:end||null,schedule_type:type,enabled:true}).select('id').single();if(error){msg.innerHTML='<div class="msg error">新增失敗：'+esc(error.message)+'</div>';return}if(ids.length){const{error:e}=await sb.from('food_truck_schedule_flavors').insert(ids.map(flavor_id=>({schedule_id:data.id,flavor_id})));if(e){msg.innerHTML='<div class="msg error">行程已建立，但口味儲存失敗：'+esc(e.message)+'</div>';await loadSchedules();return}}msg.innerHTML='<div class="msg ok">行程已新增。</div>';$(prefix+'Date').value='';$(prefix+'Region').value='';$(prefix+'Start').value='';$(prefix+'End').value='';await loadSchedules()}async function loadSchedules(){const{data,error}=await sb.from('food_truck_schedules').select('id,schedule_date,region,start_time,end_time,schedule_type,enabled').eq('enabled',true).order('schedule_date',{ascending:true}).order('id',{ascending:true});if(error){$('ftList').innerHTML=$('boothList').innerHTML='<div class="msg error">'+esc(error.message)+'</div>';return}const ids=(data||[]).map(x=>x.id);let links=[],names={};if(ids.length){const r=await sb.from('food_truck_schedule_flavors').select('schedule_id,flavor_id').in('schedule_id',ids);links=r.data||[];const fids=[...new Set(links.map(x=>x.flavor_id))];if(fids.length){const f=await sb.from('flavors').select('id,name,price').in('id',fids);(f.data||[]).forEach(x=>names[x.id]=x)}}const by={};links.forEach(x=>(by[x.schedule_id]??=[]).push(names[x.flavor_id]));const render=(type,showPrice)=>{const rows=(data||[]).filter(x=>x.schedule_type===type);if(!rows.length)return '<div class="small">目前沒有行程。</div>';return rows.map(s=>{const fs=(by[s.id]||[]).filter(Boolean);const time=s.start_time?(s.start_time+(s.end_time?'～'+s.end_time:'')):'未設定';return '<div class="item"><strong>📅 '+esc(s.schedule_date)+'</strong><br>📍 '+esc(s.region)+'<br>🕐 '+esc(time)+'<br>🍡 '+(fs.length?fs.map(f=>esc(f.name)+(showPrice?' · '+money(f.price)+'/盒':'')).join('、'):'依後台設定')+'<div class="actions" style="margin-top:9px"><button class="secondary" onclick="removeSchedule('+s.id+')">刪除</button></div></div>'}).join('')};$('ftList').innerHTML=render('food_truck',true);$('boothList').innerHTML=render('booth',false)}async function removeSchedule(id){if(!confirm('確定刪除此行程？'))return;const{error}=await sb.from('food_truck_schedules').update({enabled:false}).eq('id',id);if(error)alert('刪除失敗：'+error.message);else loadSchedules()}async function loadPickup(){const{data,error}=await sb.from('pickup_settings').select('*').eq('id',1).maybeSingle();if(error)return $('pickupBox').innerHTML='<div class="msg error">'+esc(error.message)+'</div>';$('pickupBox').innerHTML='<div class="item">全家：'+(data.familymart_enabled?'開放':'關閉')+' · '+money(data.familymart_fee)+'</div><div class="item">7-ELEVEN：'+(data.seven_eleven_enabled?'開放':'關閉')+' · '+money(data.seven_eleven_fee)+'</div>'}async function loadPayment(){const{data,error}=await sb.from('payment_settings').select('*').eq('id',1).maybeSingle();if(error)return $('paymentBox').innerHTML='<div class="msg error">'+esc(error.message)+'</div>';if(!data)return $('paymentBox').textContent='尚無設定';$('paymentBox').innerHTML='<div class="item">匯款功能：'+(data.enabled?'已開啟':'目前關閉')+'<br>銀行：'+esc(data.bank_name||'尚未設定')+'<br>分行：'+esc(data.branch_name||'尚未設定')+'<br>帳號：'+esc(data.account_number||'尚未設定')+'<br>戶名：'+esc(data.account_name||'尚未設定')+'</div>'}async function loadOrders(){const{data,error}=await sb.from('orders').select('id,order_number,delivery_date,delivery_region,pickup_type,total_amount,status,payment_status,transfer_last5,created_at').order('created_at',{ascending:false}).limit(30);if(error)return $('ordersBox').innerHTML='<div class="msg error">'+esc(error.message)+'</div>';if(!data?.length)return $('ordersBox').textContent='目前沒有訂單。';$('ordersBox').innerHTML=data.map(o=>'<div class="item"><strong>'+esc(o.order_number)+'</strong><div class="small">'+esc(o.delivery_date)+' · '+esc(o.delivery_region)+' · '+(o.pickup_type==='familymart'?'全家':'7-ELEVEN')+'</div><div>總額 '+money(o.total_amount)+'　付款：'+esc(o.payment_status||'')+'　進度：'+esc(status[o.status]||o.status)+'</div><div class="small">匯款末五碼：'+esc(o.transfer_last5||'未提供')+'</div><div class="actions" style="margin-top:8px">'+(o.payment_status==='proof_submitted'?'<button onclick="confirmPay(\''+o.id+'\')">確認付款</button>':'')+'<select onchange="changeStatus(\''+o.id+'\',this.value)"><option value="">修改訂單進度</option>'+Object.entries(status).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select></div></div>').join('')}async function confirmPay(id){const{error}=await sb.rpc('admin_confirm_payment',{p_order_id:id});if(error)alert('確認付款失敗：'+error.message);else{alert('付款已確認');loadOrders()}}async function changeStatus(id,s){if(!s)return;const{error}=await sb.rpc('admin_update_order_status',{p_order_id:id,p_status:s});if(error)alert('更新失敗：'+error.message);else loadOrders()}async function loadPrivate(){const{data,error}=await sb.rpc('personal_data_admin_orders');if(error)return $('privateBox').innerHTML='<div class="msg error">'+esc(error.message)+'</div>';if(!data?.length)return $('privateBox').textContent='目前沒有訂單個資。';$('privateBox').innerHTML=data.map(o=>'<div class="item"><strong>'+esc(o.order_number)+'</strong><div>'+esc(o.customer_name||'')+' · '+esc(o.customer_phone||'')+'</div><div>取貨：'+esc(o.pickup_store||'')+'</div><div class="small">備註：'+esc(o.customer_note||'')+'</div></div>').join('')}</script></body></html>
