<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜後台</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0000000a}h1{margin:0 0 8px}h2{font-size:19px}.grid{display:grid;gap:10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.row:last-child{border:0}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d9cdc1;border-radius:10px;box-sizing:border-box;font:inherit}button{border:0;border-radius:11px;padding:11px 15px;background:#9b5c38;color:#fff;font-weight:800}button.secondary{background:#eee;color:#333}.msg{padding:12px;border-radius:10px;background:#f6eee7;margin-top:10px}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}.hidden{display:none}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#f4ebe3;font-size:13px}.order{border:1px solid #eadfd4;border-radius:13px;padding:12px;margin:9px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.small{font-size:13px;color:#75685f}</style></head><body><div class="wrap"><div class="card"><h1>老爹・涼糕 後台</h1><div id="who" class="small">尚未登入</div></div><div id="login" class="card"><h2>管理員登入</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" type="button">登入後台</button><div id="loginMsg"></div></div><div id="panel" class="hidden"><div class="card"><div class="actions"><button class="secondary" id="refreshBtn">重新整理</button><button class="secondary" id="logoutBtn">登出</button></div><div id="roleMsg" class="msg"></div></div><div class="card"><h2>🏪 冷藏寄放設定</h2><div id="pickupBox">讀取中…</div></div><div class="card"><h2>💳 匯款設定</h2><div id="paymentBox">讀取中…</div></div><div class="card"><h2>📦 最新訂單</h2><div id="ordersBox">讀取中…</div></div><div id="privateCard" class="card hidden"><h2>🔒 個資管理</h2><div class="small">只有個資管理員可讀取完整姓名、電話與取貨門市。</div><div id="privateBox">讀取中…</div></div></div></div><script>const URL='https://yemzdwxtyosuaczsqwea.supabase.co',KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';const $=x=>document.getElementById(x);function showErr(msg){$('loginMsg').innerHTML='<div class="msg error">'+String(msg||'未知錯誤')+'</div>'}function loadScript(src){return new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)})}async function boot(){try{await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2')}catch(e){try{await loadScript('https://unpkg.com/@supabase/supabase-js@2')}catch(e2){showErr('無法載入登入服務，請重新整理頁面。');return}}try{window.sb=supabase.createClient(URL,KEY);bind();await init()}catch(e){showErr('後台初始化失敗：'+(e.message||e))}}function bind(){$('loginBtn').onclick=login;$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refreshBtn').onclick=()=>loadAll()}async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){showErr('請輸入 Email 與密碼');return}$('loginMsg').innerHTML='<div class="msg">登入中…</div>';try{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error){showErr('登入失敗：'+error.message);return}await showPanel(data.user)}catch(e){showErr('登入失敗：'+(e.message||e))}}async function init(){const {data,error}=await sb.auth.getSession();if(error){showErr('讀取登入狀態失敗：'+error.message);return}if(data.session)await showPanel(data.session.user)}async function showPanel(user){$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('who').textContent=user.email||'';const {data:p,error}=await sb.from('admin_profiles').select('role,enabled').eq('user_id',user.id).maybeSingle();if(error||!p||!p.enabled){$('roleMsg').className='msg error';$('roleMsg').textContent='此帳號不是啟用中的管理員。'+(error?' '+error.message:'');return}window.role=p.role;$('roleMsg').innerHTML='目前權限：<span class="pill">'+esc(p.role)+'</span>';if(p.role==='personal_data_admin')$('privateCard').classList.remove('hidden');await loadAll()}async function loadAll(){await Promise.all([loadPickup(),loadPayment(),loadOrders(),window.role==='personal_data_admin'?loadPrivate():Promise.resolve()])}const money=n=>'$'+Number(n||0).toLocaleString('zh-TW');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const status={pending:'待處理',confirmed:'已確認',preparing:'製作中',shipped:'已出貨',completed:'已完成',cancelled:'已取消'};async function loadPickup(){const {data,error}=await sb.from('pickup_settings').select('*').eq('id',1).maybeSingle();if(error)return $('pickupBox').innerHTML='<div class="msg error">'+esc(error.message)+'</div>';$('pickupBox').innerHTML='<div class="row"><span>全家</span><strong>'+(data.familymart_enabled?'開放':'關閉')+' · '+money(data.familymart_fee)+'</strong></div><div class="row"><span>7-ELEVEN</span><strong>'+(data.seven_eleven_enabled?'開放':'關閉')+' · '+money(data.seven_eleven_fee)+'</strong></div>'}async function loadPayment(){const {data,error}=await sb.from('payment_settings').select('*').eq('id',1).maybeSingle();if(error)return $('paymentBox').innerHTML='<div class="msg error">'+esc(error.message)+'</div>';if(!data)return $('paymentBox').textContent='尚無設定';$('paymentBox').innerHTML='<div class="row"><span>匯款功能</span><strong>'+(data.enabled?'已開啟':'目前關閉')+'</strong></div><div class="row"><span>銀行</span><span>'+esc(data.bank_name||'尚未設定')+'</span></div><div class="row"><span>分行</span><span>'+esc(data.branch_name||'尚未設定')+'</span></div><div class="row"><span>帳號</span><span>'+esc(data.account_number||'尚未設定')+'</span></div><div class="row"><span>戶名</span><span>'+esc(data.account_name||'尚未設定')+'</span></div>'}async function loadOrders(){const {data,error}=await sb.from('orders').select('id,order_number,delivery_date,delivery_region,pickup_type,total_amount,status,payment_status,transfer_last5,created_at').order('created_at',{ascending:false}).limit(30);if(error)return $('ordersBox').innerHTML='<div class="msg error">'+esc(error.message)+'</div>';if(!data?.length)return $('ordersBox').textContent='目前沒有訂單。';$('ordersBox').innerHTML=data.map(o=>'<div class="order"><strong>'+esc(o.order_number)+'</strong><div class="small">'+esc(o.delivery_date)+' · '+esc(o.delivery_region)+' · '+(o.pickup_type==='familymart'?'全家':'7-ELEVEN')+'</div><div>總額 '+money(o.total_amount)+'　付款：'+esc(o.payment_status||'')+'　進度：'+esc(status[o.status]||o.status)+'</div><div class="small">匯款末五碼：'+esc(o.transfer_last5||'未提供')+'</div><div class="actions" style="margin-top:8px">'+(o.payment_status==='proof_submitted'?'<button onclick="confirmPay(\''+o.id+'\')">確認付款</button>':'')+'<select onchange="changeStatus(\''+o.id+'\',this.value)"><option value="">修改訂單進度</option>'+Object.entries(status).map(([k,v])=>'<option value="'+k+'">'+v+'</option>').join('')+'</select></div></div>').join('')}async function confirmPay(id){const {error}=await sb.rpc('admin_confirm_payment',{p_order_id:id});if(error)alert('確認付款失敗：'+error.message);else{alert('付款已確認');loadOrders()}}async function changeStatus(id,s){if(!s)return;const {error}=await sb.rpc('admin_update_order_status',{p_order_id:id,p_status:s});if(error)alert('更新失敗：'+error.message);else loadOrders()}async function loadPrivate(){const {data,error}=await sb.rpc('personal_data_admin_orders');if(error)return $('privateBox').innerHTML='<div class="msg error">'+esc(error.message)+'</div>';if(!data?.length)return $('privateBox').textContent='目前沒有訂單個資。';$('privateBox').innerHTML=data.map(o=>'<div class="order"><strong>'+esc(o.order_number)+'</strong><div>'+esc(o.customer_name||'')+' · '+esc(o.customer_phone||'')+'</div><div>取貨：'+esc(o.pickup_store||'')+'</div><div class="small">備註：'+esc(o.customer_note||'')+'</div></div>').join('')}boot();</script></body></html>
