<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜後台</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:980px;margin:auto;padding:20px 14px 60px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0000000a}h1{margin:0 0 8px}h2{font-size:19px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d9cdc1;border-radius:10px;box-sizing:border-box;font:inherit}.field textarea{min-height:70px}button{border:0;border-radius:11px;padding:11px 15px;background:#9b5c38;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.55}.secondary{background:#eee;color:#333}.msg{padding:12px;border-radius:10px;background:#f6eee7;margin-top:10px}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}.hidden{display:none}.item{border:1px solid #eadfd4;border-radius:13px;padding:13px;margin:9px 0}.small{font-size:13px;color:#75685f}.hint{background:#fff8ed;border:1px solid #f0ddc4;padding:12px;border-radius:12px;margin:10px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:650px){.grid{grid-template-columns:1fr}.card{padding:16px}}</style></head><body><div class="wrap"><div class="card"><h1>老爹・涼糕 後台</h1><div id="who" class="small">尚未登入</div></div><div id="initMsg" class="msg hidden"></div><div id="login" class="card"><h2>管理員登入</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" type="button">登入後台</button><div id="loginMsg"></div></div><div id="panel" class="hidden"><div class="card"><div class="actions"><button class="secondary" id="refreshBtn">重新整理</button><button class="secondary" id="logoutBtn">登出</button></div><div id="roleMsg" class="msg"></div></div><div id="scheduleCard" class="card hidden"><h2>🚚 涼糕餐車區塊</h2><div class="hint">📅 出攤日期　📍 服務地區　🕐 出攤時間　🍡 當日販售口味　💰 每個口味的價格／盒</div><div class="grid"><div class="field"><label>出攤日期</label><input id="ftDate" type="date"></div><div class="field"><label>服務地區</label><input id="ftRegion" placeholder="例如：桃園全區（不包含復興鄉）"></div><div class="field"><label>出攤開始時間</label><input id="ftStart" type="time"></div><div class="field"><label>出攤結束時間</label><input id="ftEnd" type="time"></div></div><div class="field"><label>當日販售口味</label><div id="ftFlavors">讀取中…</div></div><button id="addFoodTruck" type="button">新增涼糕餐車行程</button><div id="ftMsg"></div><div id="ftList"></div></div><div id="boothCard" class="card hidden"><h2>🏪 擺攤區塊</h2><div class="hint">📅 出攤日期　📍 服務地區　🕐 出攤時間　🍡 當日販售口味</div><div class="grid"><div class="field"><label>出攤日期</label><input id="boothDate" type="date"></div><div class="field"><label>服務地區</label><input id="boothRegion" placeholder="例如：萬華雙和市場"></div><div class="field"><label>出攤開始時間</label><input id="boothStart" type="time"></div><div class="field"><label>出攤結束時間</label><input id="boothEnd" type="time"></div></div><div class="field"><label>當日販售口味</label><div id="boothFlavors">讀取中…</div></div><button id="addBooth" type="button">新增擺攤行程</button><div id="boothMsg"></div><div id="boothList"></div></div><div class="card"><h2>🏪 冷藏寄放設定</h2><div id="pickupBox">讀取中…</div></div><div class="card"><h2>💳 匯款設定</h2><div id="paymentBox">讀取中…</div></div><div class="card"><h2>📦 最新訂單</h2><div id="ordersBox">讀取中…</div></div><div id="privateCard" class="card hidden"><h2>🔒 個資管理</h2><div class="small">只有個資管理員可讀取完整姓名、電話與取貨門市。</div><div id="privateBox">讀取中…</div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){'use strict';function $(id){return document.getElementById(id)}function showError(text){var b=$("initMsg");if(b){b.className='msg error';b.classList.remove('hidden');b.textContent=text}}if(!window.supabase){showError('後台初始化失敗：Supabase 程式載入失敗，請重新整理頁面。');return}var sb;var role='';var flavors=[];var status={pending:'待處理',confirmed:'已確認',preparing:'製作中',shipped:'已出貨',completed:'已完成',cancelled:'已取消'};var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})};var money=function(n){return '$'+Number(n||0).toLocaleString('zh-TW')};function bind(){$("loginBtn").onclick=login;$('logoutBtn').onclick=async function(){await sb.auth.signOut();location.reload()};$('refreshBtn').onclick=loadAll;$('addFoodTruck').onclick=function(){addSchedule('food_truck')};$('addBooth').onclick=function(){addSchedule('booth')}}async function start(){try{sb=window.supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');bind();var r=await sb.auth.getSession();if(r.data&&r.data.session)await showPanel(r.data.session.user)}catch(e){showError('後台初始化失敗：'+(e&&e.message?e.message:String(e)))}}async function login(){var btn=$("loginBtn");btn.disabled=true;btn.textContent='登入中…';$("loginMsg").innerHTML='';try{var r=await sb.auth.signInWithPassword({email:$("email").value.trim(),password:$("password").value});if(r.error){$("loginMsg").innerHTML='<div class="msg error">登入失敗：'+esc(r.error.message)+'</div>';return}await showPanel(r.data.user)}catch(e){$("loginMsg").innerHTML='<div class="msg error">登入失敗：'+esc(e.message||e)+'</div>'}finally{btn.disabled=false;btn.textContent='登入後台'}}async function showPanel(user){$("login").classList.add('hidden');$("panel").classList.remove('hidden');$("who").textContent=user.email||'';var r=await sb.from('admin_profiles').select('role,enabled,food_truck_schedule_enabled,can_manage_food_truck_schedule').eq('user_id',user.id).maybeSingle();if(r.error){$("roleMsg").className='msg error';$("roleMsg").textContent='讀取管理員權限失敗：'+r.error.message;return}if(!r.data||!r.data.enabled){$("roleMsg").className='msg error';$("roleMsg").textContent='此帳號不是啟用中的管理員。';return}role=r.data.role;$("roleMsg").textContent='目前權限：'+role;var allowed=role==='super_admin'||r.data.food_truck_schedule_enabled===true||r.data.can_manage_food_truck_schedule===true;if(allowed){$("scheduleCard").classList.remove('hidden');$("boothCard").classList.remove('hidden')}if(role==='personal_data_admin')$("privateCard").classList.remove('hidden');await loadAll()}async function loadAll(){await Promise.all([loadPickup(),loadPayment(),loadOrders(),loadFlavors(),loadSchedules(),role==='personal_data_admin'?loadPrivate():Promise.resolve()])}async function loadFlavors(){var r=await sb.from('flavors').select('id,name,price,enabled').eq('enabled',true).order('created_at',{ascending:true});if(r.error){flavors=[];return}flavors=r.data||[];["ftFlavors","boothFlavors"].forEach(function(id){$(id).innerHTML=flavors.length?flavors.map(function(f){return '<label style="display:block;margin:5px 0"><input type="checkbox" value="'+f.id+'"> '+esc(f.name)+(id==='ftFlavors'?' · '+money(f.price)+'/盒':'')+'</label>'}).join(''):'目前沒有啟用中的口味。'})}async function addSchedule(type){var p=type==='food_truck'?'ft':'booth',date=$(p+'Date').value,region=$(p+'Region').value.trim(),startTime=$(p+'Start').value,endTime=$(p+'End').value,ids=[].slice.call($(p+'Flavors').querySelectorAll('input:checked')).map(function(x){return Number(x.value)});var msg=$(p+'Msg');if(!date||!region){msg.innerHTML='<div class="msg error">請填寫出攤日期與服務地區。</div>';return}var r=await sb.from('food_truck_schedules').insert({schedule_date:date,title:type==='food_truck'?'涼糕餐車':'擺攤',region:region,start_time:startTime||null,end_time:endTime||null,schedule_type:type,enabled:true}).select('id').single();if(r.error){msg.innerHTML='<div class="msg error">新增失敗：'+esc(r.error.message)+'</div>';return}if(ids.length){var q=await sb.from('food_truck_schedule_flavors').insert(ids.map(function(id){return {schedule_id:r.data.id,flavor_id:id}}));if(q.error){msg.innerHTML='<div class="msg error">行程已建立，但口味儲存失敗：'+esc(q.error.message)+'</div>';await loadSchedules();return}}msg.innerHTML='<div class="msg ok">行程已新增。</div>';$(p+'Date').value='';$(p+'Region').value='';$(p+'Start').value='';$(p+'End').value='';await loadSchedules()}async function loadSchedules(){var r=await sb.from('food_truck_schedules').select('id,schedule_date,region,start_time,end_time,schedule_type').eq('enabled',true).order('schedule_date',{ascending:true}).order('id',{ascending:true});if(r.error){$("ftList").innerHTML=$("boothList").innerHTML='<div class="msg error">'+esc(r.error.message)+'</div>';return}var data=r.data||[],ids=data.map(function(x){return x.id}),links=[],names={};if(ids.length){var a=await sb.from('food_truck_schedule_flavors').select('schedule_id,flavor_id').in('schedule_id',ids);links=a.data||[];var fids=[].concat.apply([],links.map(function(x){return x.flavor_id})).filter(function(v,i,self){return self.indexOf(v)===i});if(fids.length){var f=await sb.from('flavors').select('id,name,price').in('id',fids);(f.data||[]).forEach(function(x){names[x.id]=x})}}var by={};links.forEach(function(x){(by[x.schedule_id]||(by[x.schedule_id]=[])).push(names[x.flavor_id])});function render(type,price){var rows=data.filter(function(x){return x.schedule_type===type});if(!rows.length)return '<div class="small">目前沒有行程。</div>';return rows.map(function(s){var fs=(by[s.id]||[]).filter(Boolean),time=s.start_time?(s.start_time+(s.end_time?'～'+s.end_time:'')):'未設定';return '<div class="item"><strong>📅 '+esc(s.schedule_date)+'</strong><br>📍 '+esc(s.region)+'<br>🕐 '+esc(time)+'<br>🍡 '+(fs.length?fs.map(function(f){return esc(f.name)+(price?' · '+money(f.price)+'/盒':'')}).join('、'):'依後台設定')+'<div class="actions" style="margin-top:9px"><button class="secondary" onclick="window.removeSchedule('+s.id+')">刪除</button></div></div>'}).join('')}$("ftList").innerHTML=render('food_truck',true);$("boothList").innerHTML=render('booth',false)}window.removeSchedule=async function(id){if(!confirm('確定刪除此行程？'))return;var r=await sb.from('food_truck_schedules').update({enabled:false}).eq('id',id);if(r.error)alert('刪除失敗：'+r.error.message);else loadSchedules()};async function loadPickup(){var r=await sb.from('pickup_settings').select('*').eq('id',1).maybeSingle();if(r.error)return $("pickupBox").innerHTML='<div class="msg error">'+esc(r.error.message)+'</div>';if(!r.data)return $("pickupBox").textContent='尚無設定';$("pickupBox").innerHTML='<div class="item">全家：'+(r.data.familymart_enabled?'開放':'關閉')+' · '+money(r.data.familymart_fee)+'</div><div class="item">7-ELEVEN：'+(r.data.seven_eleven_enabled?'開放':'關閉')+' · '+money(r.data.seven_eleven_fee)+'</div>'}async function loadPayment(){var r=await sb.from('payment_settings').select('*').eq('id',1).maybeSingle();if(r.error)return $("paymentBox").innerHTML='<div class="msg error">'+esc(r.error.message)+'</div>';if(!r.data)return $("paymentBox").textContent='尚無設定';$("paymentBox").innerHTML='<div class="item">匯款功能：'+(r.data.enabled?'已開啟':'目前關閉')+'<br>銀行：'+esc(r.data.bank_name||'尚未設定')+'<br>分行：'+esc(r.data.branch_name||'尚未設定')+'<br>帳號：'+esc(r.data.account_number||'尚未設定')+'<br>戶名：'+esc(r.data.account_name||'尚未設定')+'</div>'}async function loadOrders(){var r=await sb.from('orders').select('id,order_number,delivery_date,delivery_region,pickup_type,total_amount,status,payment_status,transfer_last5,created_at').order('created_at',{ascending:false}).limit(30);if(r.error)return $("ordersBox").innerHTML='<div class="msg error">'+esc(r.error.message)+'</div>';if(!r.data||!r.data.length)return $("ordersBox").textContent='目前沒有訂單。';$("ordersBox").innerHTML=r.data.map(function(o){return '<div class="item"><strong>'+esc(o.order_number)+'</strong><div class="small">'+esc(o.delivery_date)+' · '+esc(o.delivery_region)+' · '+(o.pickup_type==='familymart'?'全家':'7-ELEVEN')+'</div><div>總額 '+money(o.total_amount)+'　付款：'+esc(o.payment_status||'')+'　進度：'+esc(status[o.status]||o.status)+'</div><div class="small">匯款末五碼：'+esc(o.transfer_last5||'未提供')+'</div><div class="actions" style="margin-top:8px">'+(o.payment_status==='proof_submitted'?'<button onclick="window.confirmPay(\''+o.id+'\')">確認付款</button>':'')+'<select onchange="window.changeStatus(\''+o.id+'\',this.value)"><option value="">修改訂單進度</option>'+Object.keys(status).map(function(k){return '<option value="'+k+'">'+status[k]+'</option>'}).join('')+'</select></div></div>'}).join('')}window.confirmPay=async function(id){var r=await sb.rpc('admin_confirm_payment',{p_order_id:id});if(r.error)alert('確認付款失敗：'+r.error.message);else loadOrders()};window.changeStatus=async function(id,s){if(!s)return;var r=await sb.rpc('admin_update_order_status',{p_order_id:id,p_status:s});if(r.error)alert('更新失敗：'+r.error.message);else loadOrders()};async function loadPrivate(){var r=await sb.rpc('personal_data_admin_orders');if(r.error)return $("privateBox").innerHTML='<div class="msg error">'+esc(r.error.message)+'</div>';if(!r.data||!r.data.length)return $("privateBox").textContent='目前沒有訂單個資。';$("privateBox").innerHTML=r.data.map(function(o){return '<div class="item"><strong>'+esc(o.order_number)+'</strong><div>'+esc(o.customer_name||'')+' · '+esc(o.customer_phone||'')+'</div><div>取貨：'+esc(o.pickup_store||'')+'</div><div class="small">備註：'+esc(o.customer_note||'')+'</div></div>'}).join('')}document.addEventListener('DOMContentLoaded',start)})();</script></body></html>
