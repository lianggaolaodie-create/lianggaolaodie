<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>老爹．涼糕｜管理後台</title><style>*{box-sizing:border-box}body{margin:0;background:#faf7f3;color:#2b211c;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:820px;margin:auto;padding:18px 14px 70px}.card{background:#fff;border:1px solid #e7ddd5;border-radius:24px;padding:28px 26px;margin:18px 0;box-shadow:0 2px 8px #5b3d2510}.brand{font-size:30px;font-weight:900}.muted{color:#756a63}.field{margin:14px 0}.field label{display:block;font-size:20px;font-weight:900;margin-bottom:9px}.field input,.field select{width:100%;padding:15px 16px;border:1px solid #d9cec5;border-radius:16px;background:#fff;font:inherit;font-size:18px}.btn{border:0;border-radius:18px;padding:15px 22px;background:#9a5c39;color:#fff;font-size:19px;font-weight:900;cursor:pointer}.btn.gray{background:#eee;color:#302720}.btn.red{background:#b52f2b}.btn:disabled{opacity:.55}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px}.sectionTitle{font-size:30px;font-weight:900;margin:0 0 18px}.sectionTitle .emoji{margin-right:8px}.flavorList{display:grid;gap:10px}.flavor{display:flex;align-items:center;gap:13px;border:1px solid #eadfd7;border-radius:18px;padding:15px 17px;min-height:72px;font-size:21px;font-weight:800}.flavor input{width:26px;height:26px;accent-color:#1687df}.flavor .price{margin-left:auto;color:#6e645e;font-weight:700}.dateBox{padding:18px;border:1px solid #d9cec5;border-radius:18px;text-align:center;font-size:25px;font-weight:900;margin-bottom:14px}.notice{background:#fbf4ed;border-radius:18px;padding:18px;font-size:19px;line-height:1.5;margin-bottom:18px}.item{border:1px solid #e7ddd5;border-radius:22px;padding:22px;margin-top:14px}.itemTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.itemTitle{font-size:26px;font-weight:900}.pill{background:#f3ebe3;border-radius:999px;padding:9px 14px;font-weight:900;white-space:nowrap}.meta{font-size:19px;color:#756a63;margin-top:5px}.flavorsText{font-size:20px;line-height:1.5;margin-top:14px;border-top:1px solid #eee6df;padding-top:13px}.login{max-width:520px;margin:60px auto}.hidden{display:none!important}.msg{margin-top:12px;padding:12px;border-radius:13px}.err{background:#fff0ef;color:#a32f29}.ok{background:#edf8f1;color:#286d46}.scheduleForm{display:none}.scheduleForm.show{display:block}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.card{padding:22px 16px}.two{grid-template-columns:1fr}.sectionTitle{font-size:27px}.flavor{font-size:19px}.itemTitle{font-size:23px}}</style></head><body><div id="login" class="wrap login"><div class="card"><div class="brand">🍡 老爹．涼糕</div><p class="muted">餐車／每日口味管理後台</p><form id="loginForm"><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn" class="btn" style="width:100%">登入</button></form><div id="loginMsg"></div></div></div><div id="app" class="wrap hidden"><div class="card"><div class="brand">🍡 老爹．涼糕</div><div id="who" class="muted" style="margin-top:6px">已登入</div></div><section class="card"><h2 class="sectionTitle"><span class="emoji">🍡</span>每日口味</h2><div class="notice">先選日期，再勾選當天要開放的口味。客戶端只會顯示當天開放的口味。</div><div class="field"><label>日期</label><input id="dailyDate" type="date"></div><div id="dailyFlavors" class="flavorList">讀取中…</div><div class="actions"><button id="saveDaily" class="btn">儲存當日口味</button><button id="dailyReload" class="btn gray">重新整理</button></div><div id="dailyMsg"></div></section><section class="card"><div style="display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap"><h2 class="sectionTitle" style="margin:0"><span class="emoji">🚚</span>涼糕餐車</h2><button id="newSchedule" class="btn">新增餐車行程</button></div><div id="scheduleForm" class="scheduleForm"><div class="field"><label>📅 出攤日期</label><input id="sDate" type="date"></div><div class="field"><label>📍 服務地區</label><input id="sRegion" placeholder="例如：雙北、桃園全區（復興鄉以外）"></div><div class="two"><div class="field"><label>🕐 開始時間</label><input id="sStart" type="time"></div><div class="field"><label>🕐 結束時間</label><input id="sEnd" type="time"></div></div><div class="field"><label>🍡 當日販售口味</label><div id="sFlavors" class="flavorList">讀取中…</div></div><div class="actions"><button id="saveSchedule" class="btn">儲存行程</button><button id="cancelSchedule" class="btn gray">取消</button></div><div id="scheduleMsg"></div></div><div id="scheduleList">讀取中…</div></section><div class="card"><button id="logout" class="btn gray">登出</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){'use strict';const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});let flavors=[],schedules=[],editingId=null;function msg(id,t,error=false){$(id).innerHTML=t?'<div class="msg '+(error?'err':'ok')+'">'+esc(t)+'</div>':''}async function access(u){const r=await db.from('admin_profiles').select('role,enabled,can_manage_food_truck_schedule,can_manage_food_truck').eq('user_id',u.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'此帳號目前已停用';if(!(r.data.role==='super_admin'||r.data.role==='order_admin'||r.data.role==='personal_data_admin'||r.data.can_manage_food_truck_schedule||r.data.can_manage_food_truck))return'此帳號沒有管理權限';return null}async function init(){const s=await db.auth.getSession();if(s.data.session){const e=await access(s.data.session.user);if(!e){openApp(s.data.session.user);return}}}function openApp(u){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='已登入 · '+(u.email||'管理員');$('dailyDate').value=today();$('sDate').value=today();loadAll()}$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;msg('loginMsg','登入中…');try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const er=await access(r.data.user);if(er){await db.auth.signOut();throw new Error(er)}openApp(r.data.user)}catch(x){msg('loginMsg','登入失敗：'+(x.message||x),true)}finally{$('loginBtn').disabled=false}};async function loadFlavors(){const r=await db.from('flavors').select('id,name,price,enabled').eq('enabled',true).order('id');if(r.error)throw r.error;flavors=r.data||[]}async function loadDaily(){const d=$('dailyDate').value||today();$('dailyFlavors').innerHTML=flavors.map(f=>'<label class="flavor"><input type="checkbox" data-daily="'+f.id+'"><span>'+esc(f.name)+'</span><span class="price">$'+Number(f.price||0)+'</span></label>').join('')||'目前沒有啟用中的口味。';const r=await db.from('daily_flavors').select('flavor_id').eq('delivery_date',d).eq('enabled',true);if(r.error){msg('dailyMsg','讀取當日口味失敗：'+r.error.message,true);return}const ids=new Set((r.data||[]).map(x=>x.flavor_id));$('dailyFlavors').querySelectorAll('[data-daily]').forEach(c=>c.checked=ids.has(Number(c.dataset.daily)))}$('saveDaily').onclick=async()=>{const d=$('dailyDate').value;if(!d)return msg('dailyMsg','請先選日期。',true);$('saveDaily').disabled=true;try{let r=await db.from('daily_flavors').delete().eq('delivery_date',d);if(r.error)throw r.error;const rows=[...$('dailyFlavors').querySelectorAll('[data-daily]:checked')].map(c=>({delivery_date:d,flavor_id:Number(c.dataset.daily),enabled:true}));if(rows.length){r=await db.from('daily_flavors').insert(rows);if(r.error)throw r.error}msg('dailyMsg','已儲存 '+d+' 的開放口味。')}catch(e){msg('dailyMsg','儲存失敗：'+e.message,true)}finally{$('saveDaily').disabled=false}};$('dailyDate').onchange=loadDaily;$('dailyReload').onclick=loadDaily;function selectedScheduleFlavors(){return[...$('sFlavors').querySelectorAll('[data-sf]:checked')].map(c=>Number(c.dataset.sf))}function renderScheduleFlavors(selected=[]){const set=new Set(selected);$('sFlavors').innerHTML=flavors.map(f=>'<label class="flavor"><input type="checkbox" data-sf="'+f.id+'" '+(set.has(f.id)?'checked':'')+'><span>'+esc(f.name)+'</span><span class="price">$'+Number(f.price||0)+'</span></label>').join('')||'目前沒有啟用中的口味。'}async function loadSchedules(){const r=await db.from('food_truck_schedules').select('id,schedule_date,title,region,start_time,end_time,enabled,schedule_type').eq('enabled',true).order('schedule_date',{ascending:false});if(r.error)throw r.error;schedules=r.data||[];const ids=schedules.map(x=>x.id);let links=[];if(ids.length){const q=await db.from('food_truck_schedule_flavors').select('schedule_id,flavor_id,price_per_box').in('schedule_id',ids);if(q.error)throw q.error;links=q.data||[]}const by={};links.forEach(x=>(by[x.schedule_id]??=[]).push(x));$('scheduleList').innerHTML=schedules.length?schedules.map(s=>{const names=(by[s.id]||[]).map(x=>{const f=flavors.find(z=>z.id===x.flavor_id);return f?f.name+' $'+Number(x.price_per_box??f.price??0):null}).filter(Boolean);return '<div class="item"><div class="itemTop"><div><div class="itemTitle">涼糕餐車</div><div class="meta">'+esc(s.schedule_date)+' · '+esc(s.region||'')+' · '+esc(s.start_time||'')+(s.end_time?' - '+esc(s.end_time):'')+'</div></div><span class="pill">開放</span></div><div class="flavorsText"><b>口味：</b>'+esc(names.join('、')||'尚未設定')+'</div><div class="actions"><button class="btn" onclick="editSchedule('+s.id+')">編輯</button><button class="btn red" onclick="deleteSchedule('+s.id+')">刪除</button></div></div>'}).join(''):'<div class="notice">目前沒有啟用中的餐車行程。</div>'}function resetForm(){$('scheduleForm').classList.remove('show');editingId=null;$('sDate').value=today();$('sRegion').value='';$('sStart').value='';$('sEnd').value='';$('saveSchedule').textContent='儲存行程';msg('scheduleMsg','');renderScheduleFlavors([])}$('newSchedule').onclick=()=>{$('scheduleForm').classList.add('show');editingId=null;$('sDate').value=today();$('sRegion').value='';$('sStart').value='';$('sEnd').value='';$('saveSchedule').textContent='新增餐車行程';msg('scheduleMsg','');renderScheduleFlavors([]);$('scheduleForm').scrollIntoView({behavior:'smooth',block:'start'})};$('cancelSchedule').onclick=resetForm;$('saveSchedule').onclick=async()=>{const date=$('sDate').value,region=$('sRegion').value.trim(),start=$('sStart').value||null,end=$('sEnd').value||null;if(!date||!region)return msg('scheduleMsg','請填寫日期與服務地區。',true);$('saveSchedule').disabled=true;try{let sid=editingId;if(sid){let r=await db.from('food_truck_schedules').update({schedule_date:date,region,start_time:start,end_time:end,title:'涼糕餐車'}).eq('id',sid);if(r.error)throw r.error;let q=await db.from('food_truck_schedule_flavors').delete().eq('schedule_id',sid);if(q.error)throw q.error}else{let r=await db.from('food_truck_schedules').insert({schedule_date:date,schedule_type:'food_truck',title:'涼糕餐車',region,start_time:start,end_time:end,note:null,enabled:true}).select('id').single();if(r.error)throw r.error;sid=r.data.id}const rows=selectedScheduleFlavors().map(fid=>({schedule_id:sid,flavor_id:fid,price_per_box:Number(flavors.find(f=>f.id===fid)?.price||0)}));if(rows.length){const q=await db.from('food_truck_schedule_flavors').insert(rows);if(q.error)throw q.error}msg('scheduleMsg',editingId?'已更新餐車行程。':'已新增餐車行程。');await loadSchedules();setTimeout(resetForm,300)}catch(e){msg('scheduleMsg','儲存失敗：'+e.message,true)}finally{$('saveSchedule').disabled=false}};window.editSchedule=async id=>{const s=schedules.find(x=>x.id===id);if(!s)return;editingId=id;$('scheduleForm').classList.add('show');$('sDate').value=s.schedule_date;$('sRegion').value=s.region||'';$('sStart').value=s.start_time||'';$('sEnd').value=s.end_time||'';$('saveSchedule').textContent='儲存編輯';const q=await db.from('food_truck_schedule_flavors').select('flavor_id').eq('schedule_id',id);renderScheduleFlavors((q.data||[]).map(x=>x.flavor_id));$('scheduleForm').scrollIntoView({behavior:'smooth',block:'start'})};window.deleteSchedule=async id=>{if(!confirm('確定刪除此餐車行程？'))return;const r=await db.from('food_truck_schedules').update({enabled:false}).eq('id',id);if(r.error){msg('scheduleMsg','刪除失敗：'+r.error.message,true);return}await loadSchedules()};async function loadAll(){try{await loadFlavors();await Promise.all([loadDaily(),loadSchedules()]);renderScheduleFlavors([])}catch(e){msg('dailyMsg','讀取資料失敗：'+e.message,true);msg('scheduleMsg','讀取資料失敗：'+e.message,true)}}$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};init()})();</script></body></html>
