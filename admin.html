<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<title>老爹・涼糕｜後台</title>
<style>
body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 16px 60px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0000000a}h1{margin:0 0 8px}h2{font-size:19px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #d9cdc1;border-radius:10px;box-sizing:border-box;font:inherit}button{border:0;border-radius:11px;padding:11px 15px;background:#9b5c38;color:#fff;font-weight:800}.msg{padding:12px;border-radius:10px;background:#f6eee7;margin-top:10px}.error{background:#fff0ef;color:#a32e29}.hidden{display:none}.small{font-size:13px;color:#75685f}
</style>
</head>
<body>
<div class="wrap">
<div class="card"><h1>老爹・涼糕 後台</h1><div id="who" class="small">尚未登入</div></div>
<div id="login" class="card"><h2>管理員登入</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" type="button">登入後台</button><div id="loginMsg"></div></div>
<div id="panel" class="hidden"><div class="card"><button id="logoutBtn">登出</button><div id="roleMsg" class="msg"></div></div><div class="card"><h2>🏪 冷藏寄放設定</h2><div id="pickupBox">讀取中…</div></div><div class="card"><h2>💳 匯款設定</h2><div id="paymentBox">讀取中…</div></div><div class="card"><h2>📦 最新訂單</h2><div id="ordersBox">讀取中…</div></div><div id="privateCard" class="card hidden"><h2>🔒 個資管理</h2><div class="small">只有個資管理員可讀取完整姓名、電話與取貨門市。</div><div id="privateBox">讀取中…</div></div></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://yemzdwxtyosuaczsqwea.supabase.co';
const SUPABASE_KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const money=n=>'$'+Number(n||0).toLocaleString('zh-TW');
const status={pending:'待處理',confirmed:'已確認',preparing:'製作中',shipped:'已出貨',completed:'已完成',cancelled:'已取消'};
function err(msg){$('loginMsg').innerHTML='<div class="msg error">'+esc(msg)+'</div>'}
$('loginBtn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return err('請輸入 Email 與密碼');$('loginMsg').innerHTML='<div class="msg">登入中…</div>';try{const r=await sb.auth.signInWithPassword({email,password});if(r.error)return err('登入失敗：'+r.error.message);await showPanel(r.data.user)}catch(e){err('登入失敗：'+(e.message||e))}};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};
async function showPanel(user){$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('who').textContent=user.email||'';const r=await sb.from('admin_profiles').select('role,enabled').eq('user_id',user.id).maybeSingle();if(r.error||!r.data||!r.data.enabled){$('roleMsg').className='msg error';$('roleMsg').textContent='此帳號不是啟用中的管理員。'+(r.error?' '+r.error.message:'');return}window.role=r.data.role;$('roleMsg').textContent='目前權限：'+r.data.role;await loadAll()}
async function loadAll(){await Promise.all([loadPickup(),loadPayment(),loadOrders(),window.role==='personal_data_admin'?loadPrivate():Promise.resolve()])}
async function loadPickup(){const r=await sb.from('pickup_settings').select('*').eq('id',1).maybeSingle();if(r.error)return $('pickupBox').innerHTML='<div class="msg error">'+esc(r.error.message)+'</div>';if(!r.data)return $('pickupBox').textContent='尚無設定';$('pickupBox').innerHTML='全家：'+(r.data.familymart_enabled?'開放':'關閉')+' · '+money(r.data.familymart_fee)+'<br>7-ELEVEN：'+(r.data.seven_eleven_enabled?'開放':'關閉')+' · '+money(r.data.seven_eleven_fee)}
async function loadPayment(){const r=await sb.from('payment_settings').select('*').eq('id',1).maybeSingle();if(r.error)return $('paymentBox').innerHTML='<div class="msg error">'+esc(r.error.message)+'</div>';if(!r.data)return $('paymentBox').textContent='尚無設定';$('paymentBox').innerHTML='匯款功能：'+(r.data.enabled?'已開啟':'目前關閉')+'<br>銀行：'+esc(r.data.bank_name||'尚未設定')+'<br>分行：'+esc(r.data.branch_name||'尚未設定')+'<br>帳號：'+esc(r.data.account_number||'尚未設定')+'<br>戶名：'+esc(r.data.account_name||'尚未設定')}
async function loadOrders(){const r=await sb.from('orders').select('id,order_number,delivery_date,delivery_region,pickup_type,total_amount,status,payment_status,transfer_last5,created_at').order('created_at',{ascending:false}).limit(30);if(r.error)return $('ordersBox').innerHTML='<div class="msg error">'+esc(r.error.message)+'</div>';if(!r.data?.length)return $('ordersBox').textContent='目前沒有訂單。';$('ordersBox').innerHTML=r.data.map(o=>'<div class="card"><strong>'+esc(o.order_number)+'</strong><br>'+esc(o.delivery_date)+' · '+esc(o.delivery_region)+' · '+(o.pickup_type==='familymart'?'全家':'7-ELEVEN')+'<br>總額 '+money(o.total_amount)+'　付款：'+esc(o.payment_status||'')+'　進度：'+esc(status[o.status]||o.status)+'<br>匯款末五碼：'+esc(o.transfer_last5||'未提供')+(o.payment_status==='proof_submitted'?'<br><button onclick="confirmPay(\''+o.id+'\')">確認付款</button>':'')+'</div>').join('')}
async function confirmPay(id){const r=await sb.rpc('admin_confirm_payment',{p_order_id:id});if(r.error)alert('確認付款失敗：'+r.error.message);else{alert('付款已確認');loadOrders()}}
async function loadPrivate(){const r=await sb.rpc('personal_data_admin_orders');if(r.error)return $('privateBox').innerHTML='<div class="msg error">'+esc(r.error.message)+'</div>';if(!r.data?.length)return $('privateBox').textContent='目前沒有訂單個資。';$('privateBox').innerHTML=r.data.map(o=>'<div class="card"><strong>'+esc(o.order_number)+'</strong><br>'+esc(o.customer_name||'')+' · '+esc(o.customer_phone||'')+'<br>取貨：'+esc(o.pickup_store||'')+'<br>備註：'+esc(o.customer_note||'')+'</div>').join('')}
(async()=>{try{const r=await sb.auth.getSession();if(r.error)return err('讀取登入狀態失敗：'+r.error.message);if(r.data.session)await showPanel(r.data.session.user)}catch(e){err('後台初始化失敗：'+(e.message||e))}})();
</script>
</body></html>
