<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>老爹・涼糕｜管理後台</title><style>
*{box-sizing:border-box}body{margin:0;background:#faf7f3;color:#2b211c;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:820px;margin:auto;padding:18px 14px 70px}.card{background:#fff;border:1px solid #e7ddd5;border-radius:24px;padding:24px 22px;margin:18px 0;box-shadow:0 2px 8px #5b3d2510}.brand{font-size:30px;font-weight:900}.muted{color:#756a63}.sectionTitle{font-size:29px;font-weight:900;margin:0 0 16px}.notice{background:#fbf4ed;border-radius:18px;padding:17px;font-size:18px;line-height:1.5;margin-bottom:16px}.field{margin:13px 0}.field label{display:block;font-size:18px;font-weight:900;margin-bottom:8px}.field input,.field select,.field textarea{width:100%;padding:14px;border:1px solid #d9cec5;border-radius:15px;background:#fff;font:inherit;font-size:17px}.btn{border:0;border-radius:17px;padding:13px 19px;background:#9a5c39;color:#fff;font-size:17px;font-weight:900;cursor:pointer}.btn.gray{background:#eee9e5;color:#302720}.btn.red{background:#b52f2b}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.login{max-width:520px;margin:60px auto}.hidden{display:none!important}.msg{margin-top:12px;padding:12px;border-radius:13px}.err{background:#fff0ef;color:#a32f29}.ok{background:#edf8f1;color:#286d46}.dateBox{padding:18px;border:1px solid #d9cec5;border-radius:18px;text-align:center;font-size:24px;font-weight:900;margin-bottom:12px}.flavorList{display:grid;gap:9px}.flavor{display:flex;align-items:center;gap:12px;border:1px solid #eadfd7;border-radius:18px;padding:14px 16px;min-height:68px;font-size:20px;font-weight:800}.flavor input{width:25px;height:25px;accent-color:#1687df}.flavor .price{margin-left:auto;color:#6e645e;font-weight:700}.item{border:1px solid #e7ddd5;border-radius:21px;padding:19px;margin-top:13px}.itemTop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.itemTitle{font-size:24px;font-weight:900}.meta{font-size:18px;color:#756a63;margin-top:4px;line-height:1.45}.pill{background:#f3ebe3;border-radius:999px;padding:8px 12px;font-weight:900;white-space:nowrap}.flavorsText{font-size:18px;line-height:1.5;margin-top:12px;border-top:1px solid #eee6df;padding-top:12px}.order{border:1px solid #e7ddd5;border-radius:20px;padding:17px;margin-top:12px}.orderLine{font-size:17px;line-height:1.55}.orderLine b{display:inline-block;min-width:78px}.privacy{background:#fbf4ed;border-radius:15px;padding:12px;font-size:15px;color:#756a63}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.scheduleLink{display:block;text-decoration:none;background:#fbf0e7;color:#70462f;border-radius:15px;padding:14px;font-weight:900;font-size:17px}.smallBtn{padding:9px 12px;font-size:14px;border-radius:12px}@media(max-width:600px){.card{padding:21px 15px}.two{grid-template-columns:1fr}.sectionTitle{font-size:27px}.itemTitle{font-size:22px}}
</style></head><body>
<div id="login" class="wrap login"><div class="card"><div class="brand">🍡 老爹・涼糕</div><p class="muted">線上訂購管理後台</p><form id="loginForm"><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn" class="btn" style="width:100%">登入</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="wrap hidden">
<div class="card"><div class="brand">🍡 老爹・涼糕</div><div id="who" class="muted" style="margin-top:6px">已登入</div></div>
<section class="card"><h2 class="sectionTitle">📋 訂單</h2><div class="notice">訂單區只顯示營運需要的資料；完整姓名、電話、取貨門市由個資管理另外管理。</div><div class="actions"><button class="btn gray" id="orderReload">重新整理</button></div><div id="orderList">讀取中…</div><div id="orderMsg"></div></section>
<section class="card"><h2 class="sectionTitle">🔒 個資管理</h2><div class="privacy">只有個資管理員可讀取完整姓名、電話與取貨門市。</div><div id="privateList">讀取中…</div><div id="privateMsg"></div></section>
<section class="card"><h2 class="sectionTitle">🚚 餐車行程</h2><p class="muted">餐車／擺攤行程已獨立到另一個後台管理。</p><a class="scheduleLink" href="/admin-schedule.html">進入獨立「餐車／擺攤行程管理」 →</a></section>
<section class="card"><h2 class="sectionTitle">🍡 每日口味</h2><div class="notice">先選日期，再勾選當天要開放的口味。客戶端只會顯示當天開放的口味。</div><div class="field"><label>日期</label><input id="dailyDate" type="date"></div><div id="dailyFlavors" class="flavorList">讀取中…</div><div class="actions"><button id="saveDaily" class="btn">儲存當日口味</button><button id="dailyReload" class="btn gray">重新整理</button></div><div id="dailyMsg"></div></section>
<div class="card"><button id="logout" class="btn gray">登出</button></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(function(){'use strict';const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});let flavors=[];function msg(id,t,error=false){$(id).innerHTML=t?'<div class="msg '+(error?'err':'ok')+'">'+esc(t)+'</div>':''}
async function access(u){const r=await db.from('admin_profiles').select('role,enabled,can_manage_food_truck_schedule,can_manage_food_truck').eq('user_id',u.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'此帳號目前已停用';if(!['super_admin','order_admin','personal_data_admin'].includes(r.data.role)&&!r.data.can_manage_food_truck_schedule&&!r.data.can_manage_food_truck)return'此帳號沒有管理權限';return null}
function openApp(u){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='已登入 · '+(u.email||'管理員');$('dailyDate').value=today();loadAll()}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;msg('loginMsg','登入中…');try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const er=await access(r.data.user);if(er){await db.auth.signOut();throw new Error(er)}openApp(r.data.user)}catch(x){msg('loginMsg','登入失敗：'+(x.message||x),true)}finally{$('loginBtn').disabled=false}};
async function loadFlavors(){const r=await db.from('flavors').select('id,name,price,enabled').eq('enabled',true).order('id');if(r.error)throw r.error;flavors=r.data||[]}
async function loadDaily(){const d=$('dailyDate').value||today();$('dailyFlavors').innerHTML=flavors.map(f=>'<label class="flavor"><input type="checkbox" data-daily="'+f.id+'"><span>'+esc(f.name)+'</span><span class="price">$'+Number(f.price||0)+'</span></label>').join('')||'目前沒有啟用中的口味。';const r=await db.from('daily_flavors').select('flavor_id').eq('delivery_date',d).eq('enabled',true);if(r.error){msg('dailyMsg','讀取當日口味失敗：'+r.error.message,true);return}const ids=new Set((r.data||[]).map(x=>x.flavor_id));$('dailyFlavors').querySelectorAll('[data-daily]').forEach(c=>c.checked=ids.has(Number(c.dataset.daily)))}
$('saveDaily').onclick=async()=>{const d=$('dailyDate').value;if(!d)return msg('dailyMsg','請先選日期。',true);$('saveDaily').disabled=true;try{let r=await db.from('daily_flavors').delete().eq('delivery_date',d);if(r.error)throw r.error;const rows=[...$('dailyFlavors').querySelectorAll('[data-daily]:checked')].map(c=>({delivery_date:d,flavor_id:Number(c.dataset.daily),enabled:true}));if(rows.length){r=await db.from('daily_flavors').insert(rows);if(r.error)throw r.error}msg('dailyMsg','已儲存 '+d+' 的開放口味。')}catch(e){msg('dailyMsg','儲存失敗：'+e.message,true)}finally{$('saveDaily').disabled=false}};$('dailyDate').onchange=loadDaily;$('dailyReload').onclick=loadDaily;
async function loadOrders(){const r=await db.from('admin_order_summary').select('id,order_number,delivery_date,delivery_region,pickup_type,product_total,pickup_fee,total_amount,status,payment_status,transfer_last5,created_at,updated_at').order('created_at',{ascending:false});if(r.error){msg('orderMsg','讀取訂單失敗：'+r.error.message,true);return}const orders=r.data||[];if(!orders.length){$('orderList').innerHTML='<div class="notice">目前沒有訂單。</div>';return}const ids=orders.map(o=>o.id);let items=[];if(ids.length){const q=await db.from('order_items').select('order_id,flavor_name,unit_price,quantity,subtotal').in('order_id',ids);if(q.error){msg('orderMsg','讀取訂購商品失敗：'+q.error.message,true);return}items=q.data||[]}const by={};items.forEach(x=>(by[x.order_id]??=[]).push(x));$('orderList').innerHTML=orders.map(o=>'<div class="order"><div class="orderLine"><b>訂單編號</b>'+esc(o.order_number||o.id)+'</div><div class="orderLine"><b>配送日期</b>'+esc(o.delivery_date)+'</div><div class="orderLine"><b>配送區域</b>'+esc(o.delivery_region)+'</div><div class="orderLine"><b>取貨方式</b>'+esc(o.pickup_type)+'</div><div class="orderLine"><b>總額</b>$'+Number(o.total_amount||0)+'</div><div class="orderLine"><b>付款狀態</b>'+esc(o.payment_status||'')+'</div><div class="orderLine"><b>匯款後五碼</b>'+esc(o.transfer_last5||'')+'</div><div class="field"><label>訂單進度</label><select data-status="'+esc(o.id)+'"><option value="pending" '+(o.status==='pending'?'selected':'')+'>待處理</option><option value="confirmed" '+(o.status==='confirmed'?'selected':'')+'>已確認</option><option value="completed" '+(o.status==='completed'?'selected':'')+'>已完成</option><option value="cancelled" '+(o.status==='cancelled'?'selected':'')+'>已取消</option></select></div><div class="orderLine"><b>訂購商品</b>'+(by[o.id]||[]).map(x=>esc(x.flavor_name)+' × '+Number(x.quantity||0)+' $'+Number(x.subtotal||0)).join('<br>')+'</div><div class="actions"><button class="btn red smallBtn" onclick="deleteOrder(\''+o.id+'\')">刪除訂單</button></div></div>').join('');$('orderList').querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{const r=await db.from('orders').update({status:s.value}).eq('id',s.dataset.status);if(r.error)msg('orderMsg','更新訂單失敗：'+r.error.message,true);else msg('orderMsg','訂單進度已更新。')})}
window.deleteOrder=async id=>{if(!confirm('確定刪除此訂單？'))return;const r=await db.from('orders').delete().eq('id',id);if(r.error){msg('orderMsg','刪除失敗：'+r.error.message,true);return}loadOrders();loadPrivate()};
async function loadPrivate(){const r=await db.from('order_private').select('order_id,customer_name,customer_phone,pickup_store,customer_note,created_at').order('created_at',{ascending:false});if(r.error){msg('privateMsg','讀取個資失敗：'+r.error.message,true);return}const rows=r.data||[];$('privateList').innerHTML=rows.length?rows.map(x=>'<div class="order"><div class="orderLine"><b>訂單編號</b>'+esc(x.order_id)+'</div><div class="orderLine"><b>姓名</b>'+esc(x.customer_name)+'</div><div class="orderLine"><b>電話</b>'+esc(x.customer_phone)+'</div><div class="orderLine"><b>取貨門市</b>'+esc(x.pickup_store)+'</div><div class="orderLine"><b>備註</b>'+esc(x.customer_note||'')+'</div><div class="actions"><button class="btn red smallBtn" onclick="deletePrivate(\''+x.order_id+'\')">刪除個資</button></div></div>').join(''):'<div class="notice">目前沒有個資資料。</div>'}
window.deletePrivate=async id=>{if(!confirm('確定刪除此筆個資？'))return;const r=await db.from('order_private').delete().eq('order_id',id);if(r.error){msg('privateMsg','刪除失敗：'+r.error.message,true);return}loadPrivate()};
async function loadAll(){try{await loadFlavors();await Promise.all([loadDaily(),loadOrders(),loadPrivate()])}catch(e){msg('orderMsg','載入失敗：'+e.message,true)}}$('orderReload').onclick=loadOrders;$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};init=async()=>{const s=await db.auth.getSession();if(s.data.session){const er=await access(s.data.session.user);if(!er)openApp(s.data.session.user)}};init();})();
</script></body></html>
