<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>老爹．涼糕｜會員管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f0e7;color:#3b2921;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:1100px;margin:auto;padding:14px}.head,.panel,.stat{background:#fff;border:1px solid #eadfd4;border-radius:19px;padding:17px;margin-bottom:13px}.brand{font-size:23px;font-weight:950}.muted{color:#83756c;line-height:1.6}.btn{border:0;border-radius:12px;padding:11px 14px;background:#4b2d20;color:#fff;font-weight:900;text-decoration:none;display:inline-block}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tools input{flex:1;min-width:190px;padding:12px;border:1px solid #ddd1c7;border-radius:12px;font:inherit}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat small{color:#89796e}.stat b{display:block;font-size:24px;margin-top:6px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #eee5dd;font-size:14px}th{color:#79695e;background:#fbf8f4}.tier{display:inline-block;padding:5px 9px;border-radius:99px;background:#f5ead3;color:#78531d;font-weight:900;font-size:12px}.empty{padding:20px;text-align:center;color:#83756c}.foot{font-size:12px;color:#89796e;line-height:1.7}@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.brand{font-size:20px}.wrap{padding:10px}}
</style></head><body><main class="wrap">
<header class="head"><div class="brand">👑 老爹．涼糕｜會員管理</div><p class="muted">管理會員資料、會員卡編號、累積消費與等級。此頁目前提供查詢，不會任意修改會員資料。</p><a class="btn" href="admin-dashboard.html">返回正式後台</a></header>
<section class="stats"><div class="stat"><small>會員總數</small><b id="count">—</b></div><div class="stat"><small>普通卡</small><b id="normal">—</b></div><div class="stat"><small>銀卡</small><b id="silver">—</b></div><div class="stat"><small>金卡／VIP</small><b id="goldvip">—</b></div></section>
<section class="panel"><h2>會員資料</h2><div class="tools"><input id="search" placeholder="搜尋姓名、Email、電話或會員卡編號"><button class="btn" id="refresh">重新載入</button></div><div id="message" class="muted">正在載入會員資料…</div><div class="tablewrap"><table><thead><tr><th>會員卡編號</th><th>會員姓名</th><th>Email</th><th>電話</th><th>累積完成消費</th><th>會員等級</th><th>註冊日期</th></tr></thead><tbody id="rows"></tbody></table></div></section>
<p class="foot">等級門檻：普通卡 NT$2,000｜銀卡 NT$5,000｜金卡 NT$15,000｜VIP 卡 NT$20,000。累積金額依已完成且綁定會員的訂單商品金額計算，不含運費及寄放費。會員卡號以資料庫現有編號為準。</p>
</main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=window.supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let members=[];
const money=n=>'NT$ '+Number(n||0).toLocaleString('zh-TW');
function tier(n){if(n>=20000)return'VIP 卡';if(n>=15000)return'金卡';if(n>=5000)return'銀卡';if(n>=2000)return'普通卡';return'未達門檻'}
function render(){const q=document.getElementById('search').value.trim().toLowerCase();const list=members.filter(m=>[m.member_card_number,m.full_name,m.email,m.phone].some(v=>String(v||'').toLowerCase().includes(q)));document.getElementById('rows').innerHTML=list.map(m=>'<tr><td><b>'+ (m.member_card_number||'尚未編號')+'</b></td><td>'+ (m.full_name||'—')+'</td><td>'+ (m.email||'—')+'</td><td>'+ (m.phone||'—')+'</td><td>'+money(m.spent)+'</td><td><span class="tier">'+tier(m.spent)+'</span></td><td>'+ (m.created_at?new Date(m.created_at).toLocaleDateString('zh-TW'):'—')+'</td></tr>').join('')||'<tr><td colspan="7" class="empty">沒有符合的會員資料</td></tr>'; }
async function load(){const msg=document.getElementById('message');msg.textContent='正在載入…';try{const p=await db.from('member_profiles').select('user_id,full_name,email,phone,member_card_number,created_at').order('created_at',{ascending:false});if(p.error)throw p.error;const o=await db.from('orders').select('customer_user_id,product_total').eq('status','completed').not('customer_user_id','is',null);if(o.error)throw o.error;const totals={};(o.data||[]).forEach(x=>{totals[x.customer_user_id]=(totals[x.customer_user_id]||0)+Number(x.product_total||0)});members=(p.data||[]).map(m=>({...m,spent:totals[m.user_id]||0}));const count=members.length;document.getElementById('count').textContent=count;document.getElementById('normal').textContent=members.filter(m=>m.spent>=2000&&m.spent<5000).length;document.getElementById('silver').textContent=members.filter(m=>m.spent>=5000&&m.spent<15000).length;document.getElementById('goldvip').textContent=members.filter(m=>m.spent>=15000).length;msg.textContent='已載入 '+count+' 位會員；消費統計僅計算已完成且綁定會員的訂單。';render()}catch(e){msg.textContent='載入失敗：'+(e.message||e)+'。請確認管理員帳號具備超級管理員權限。'}}
(async()=>{const s=await db.auth.getSession();if(!s.data.session){location.replace('admin-dashboard.html');return;}const a=await db.from('admin_profiles').select('role,enabled').eq('user_id',s.data.session.user.id).maybeSingle();if(a.error||!a.data||!a.data.enabled||a.data.role!=='super_admin'){await db.auth.signOut();location.replace('admin-dashboard.html');return;}load()})();
document.getElementById('refresh').onclick=load;document.getElementById('search').oninput=render;
</script></body></html>
