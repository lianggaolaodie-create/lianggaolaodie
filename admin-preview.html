<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹．涼糕｜後台測試</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.shell{max-width:1200px;margin:auto;padding:14px}.top,.card{background:#fff;border:1px solid #e7ddd5;border-radius:18px;padding:16px;margin-bottom:12px}.brand{font-size:21px;font-weight:900}.muted{color:#766b64;font-size:13px;line-height:1.6}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.nav button,.subnav button{white-space:nowrap;border:0;border-radius:11px;padding:11px 15px;background:#ebe4de;color:#5a4940;font-weight:800}.nav button.active,.subnav button.active{background:#8d5939;color:#fff}.subnav{display:flex;gap:8px;overflow:auto;margin:0 0 12px}.page{display:none}.page.active{display:block}.table{overflow:auto;border:1px solid #e8ded7;border-radius:12px}.head,.row{display:grid;align-items:center;min-width:1100px}.head{background:#8d5939;color:#fff;font-weight:900;padding:11px 8px}.row{padding:12px 8px;border-top:1px solid #e8ded7;background:#fff}.head>div,.row>div{padding:0 6px;overflow-wrap:anywhere}.order{grid-template-columns:210px 100px 110px 100px 150px 250px 90px 100px 100px 100px 110px}.home{grid-template-columns:210px 100px 110px 100px 220px 240px 100px 100px 110px 110px}.person{grid-template-columns:210px 110px 130px 220px 110px 150px 100px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eee7e1;font-size:12px}.login{max-width:520px;margin:60px auto}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #d9cec6;border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:10px 14px;background:#8d5939;color:#fff;font-weight:800}.notice{padding:10px;border-radius:10px;margin-top:10px}.err{background:#fff0ef;color:#a43b35}.ok{background:#edf8f1;color:#286c47}.hidden{display:none!important}.empty{padding:16px;color:#766b64}@media(max-width:760px){.shell{padding:10px}.top,.card{padding:13px}.brand{font-size:19px}.head,.row{font-size:13px}}</style></head><body><div id="login" class="shell login"><div class="card"><div class="brand">🍡 老爹．涼糕｜後台測試</div><p class="muted">這一頁使用實際後台資料，只測「分頁」介面；不使用假訂單。</p><form id="form"><div class="field"><label>管理員 Email</label><input id="email" type="email" required></div><div class="field"><label>密碼</label><input id="password" type="password" required></div><button class="btn">登入測試頁</button></form><div id="msg"></div></div></div><main id="app" class="shell hidden"><div class="top"><div class="brand">🍡 老爹．涼糕｜後台測試</div><div id="user" class="muted"></div></div><div class="nav"><button class="active" onclick="tab('pickup',this)">🏪 冷藏寄放訂單</button><button onclick="tab('home',this)">🚚 送到府訂單</button><button onclick="tab('person',this)">👤 個資管理</button></div><section id="pickup" class="page active"><div class="card"><h2>🏪 冷藏寄放訂單</h2><p class="muted">保留原本寄放訂單格式；不混入送到府。</p><div class="table"><div class="head order"><div>訂單編號</div><div>日期</div><div>客戶</div><div>地區</div><div>超商／門市</div><div>口味明細</div><div>數量</div><div>商品小計</div><div>寄放費</div><div>總金額</div><div>狀態</div></div><div id="pickupList"></div></div></div></section><section id="home" class="page"><div class="card"><h2>🚚 送到府訂單</h2><p class="muted">獨立顯示到府訂單；保留貨到付款資料。</p><div class="table"><div class="head home"><div>訂單編號</div><div>送達日期</div><div>客戶</div><div>地區</div><div>送達地址</div><div>口味明細</div><div>數量</div><div>商品小計</div><div>運費</div><div>總金額</div></div><div id="homeList"></div></div></div></section><section id="person" class="page"><div class="card"><h2>👤 個資管理</h2><p class="muted">獨立頁面，不跟訂單列表混在一起。</p><div class="table"><div class="head person"><div>訂單編號</div><div>類型</div><div>姓名</div><div>電話／地址</div><div>門市</div><div>匯款後五碼</div><div>建立時間</div></div><div id="personList"></div></div></div></section><div class="card"><button class="btn" onclick="location.reload()">重新整理</button></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function msg(t,e=false){$('msg').innerHTML=t?'<div class="notice '+(e?'err':'ok')+'">'+esc(t)+'</div>':''}async function allowed(u){const r=await db.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',u.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'管理員帳號已停用';if(!['super_admin','order_admin','personal_data_admin'].includes(r.data.role)&&!r.data.can_manage_products)return'沒有後台權限';return null}async function start(u){const e=await allowed(u);if(e){msg(e,true);await db.auth.signOut();return}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('user').textContent='已登入 · '+u.email;await loadAll()}$('form').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return msg('登入失敗：'+r.error.message,true);start(r.data.user)};function tab(id,b){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active')}async function loadAll(){const [pr,pi,ho,hi,cu]=await Promise.all([db.from('cooling_pickup_orders').select('id,order_number,order_date,region_name,convenience_store,store_name,merchandise_total,storage_fee,total_amount,status,customer_id,created_at').order('created_at',{ascending:false}),db.from('cooling_pickup_order_items').select('order_id,flavor_name,quantity,line_total').order('id'),db.from('orders').select('id,order_number,delivery_date,delivery_region,product_total,pickup_fee,total_amount,status,payment_status,transfer_last5,created_at').eq('pickup_type','home_delivery').order('created_at',{ascending:false}),db.from('order_items').select('order_id,flavor_name,quantity,subtotal').order('id'),db.from('order_private').select('order_id,customer_name,customer_phone,pickup_store,delivery_address,created_at')]);if(pr.error)return msg('冷藏寄放讀取失敗：'+pr.error.message,true);if(ho.error)return msg('送到府讀取失敗：'+ho.error.message,true);const custIds=[...(pr.data||[]).map(x=>x.customer_id).filter(Boolean)];let customers=[];if(custIds.length){const cr=await db.from('order_customers').select('id,name,phone').in('id',custIds);if(!cr.error)customers=cr.data||[]}const cm=new Map(customers.map(x=>[x.id,x]));const pitems=new Map();(pi.data||[]).forEach(x=>{if(!pitems.has(x.order_id))pitems.set(x.order_id,[]);pitems.get(x.order_id).push(x)});$('pickupList').innerHTML=(pr.data||[]).map(o=>{const c=cm.get(o.customer_id),it=pitems.get(o.id)||[],qty=it.reduce((a,x)=>a+Number(x.quantity||0),0),fl=it.map(x=>esc(x.flavor_name)+' × '+x.quantity).join('／')||'—';return '<div class="row order"><div><b>'+esc(o.order_number)+'</b></div><div>'+esc(o.order_date)+'</div><div>'+esc(c?.name||'—')+'</div><div>'+esc(o.region_name||'—')+'</div><div>'+esc([o.convenience_store,o.store_name].filter(Boolean).join('／')||'—')+'</div><div>'+fl+'</div><div>'+qty+' 盒</div><div>$'+Number(o.merchandise_total||0)+'</div><div>$'+Number(o.storage_fee||0)+'</div><div><b>$'+Number(o.total_amount||0)+'</b></div><div><span class="badge">'+esc(o.status||'')+'</span></div></div>'}).join('')||'<div class="empty">目前沒有冷藏寄放訂單。</div>';const hpriv=new Map((cu.data||[]).map(x=>[x.order_id,x]));const hitems=new Map();(hi.data||[]).forEach(x=>{if(!hitems.has(x.order_id))hitems.set(x.order_id,[]);hitems.get(x.order_id).push(x)});$('homeList').innerHTML=(ho.data||[]).map(o=>{const p=hpriv.get(o.id),it=hitems.get(o.id)||[],qty=it.reduce((a,x)=>a+Number(x.quantity||0),0),fl=it.map(x=>esc(x.flavor_name)+' × '+x.quantity).join('／')||'—';return '<div class="row home"><div><b>'+esc(o.order_number)+'</b></div><div>'+esc(o.delivery_date)+'</div><div>'+esc(p?.customer_name||'—')+'</div><div>'+esc(o.delivery_region||'—')+'</div><div>'+esc(p?.delivery_address||'—')+'</div><div>'+fl+'</div><div>'+qty+' 盒</div><div>$'+Number(o.product_total||0)+'</div><div>$'+Number(o.pickup_fee||0)+'</div><div><b>$'+Number(o.total_amount||0)+'</b></div></div>'}).join('')||'<div class="empty">目前沒有送到府訂單。</div>';const person=[];(pr.data||[]).forEach(o=>{const c=cm.get(o.customer_id);person.push({no:o.order_number,type:'冷藏寄放',name:c?.name||'—',contact:c?.phone||'—',store:[o.convenience_store,o.store_name].filter(Boolean).join('／')||'—',last5:'—',created:o.created_at})});(ho.data||[]).forEach(o=>{const p=hpriv.get(o.id);person.push({no:o.order_number,type:'送到府',name:p?.customer_name||'—',contact:[p?.customer_phone,p?.delivery_address].filter(Boolean).join('／')||'—',store:'—',last5:o.transfer_last5||'—',created:o.created_at})});$('personList').innerHTML=person.map(x=>'<div class="row person"><div><b>'+esc(x.no)+'</b></div><div>'+esc(x.type)+'</div><div>'+esc(x.name)+'</div><div>'+esc(x.contact)+'</div><div>'+esc(x.store)+'</div><div>'+esc(x.last5)+'</div><div>'+esc(x.created?new Date(x.created).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}):'')+'</div></div>').join('')||'<div class="empty">目前沒有個資。</div>'}db.auth.getSession().then(r=>{if(r.data.session)start(r.data.session.user)})</script></body></html>
