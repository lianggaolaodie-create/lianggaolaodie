<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹．涼糕｜後台分頁測試</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#f7f3ef;color:#30241d;margin:0;padding:16px}.card{background:#fff;border:1px solid #e7ddd5;border-radius:16px;padding:16px;margin:auto;max-width:900px}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.nav button,.pager button{border:0;border-radius:10px;padding:10px 14px;font-weight:800;background:#ebe4de}.nav button.active{background:#8d5939;color:#fff}.page{display:none}.page.active{display:block}.row{padding:14px;border:1px solid #e8ded7;border-radius:12px;margin:8px 0}.pager{display:flex;justify-content:center;gap:8px;margin-top:14px}.pager button:disabled{opacity:.4}.info{text-align:center;color:#766b64;margin-top:8px}</style></head><body><div class="card"><h2>🍡 老爹．涼糕｜後台測試頁</h2><p>這是獨立測試頁，只測分頁功能，不影響正式後台。</p><div class="nav"><button class="active" onclick="show('orders',this)">🧾 訂單管理</button><button onclick="show('customers',this)">👤 個資管理</button></div><section id="orders" class="page active"><h3>訂單管理｜10 筆一頁</h3><div id="ordersList"></div><div class="pager"><button id="op" onclick="page('orders',-1)">上一頁</button><span id="oi" class="info"></span><button id="on" onclick="page('orders',1)">下一頁</button></div></section><section id="customers" class="page"><h3>個資管理｜10 筆一頁</h3><div id="customersList"></div><div class="pager"><button id="cp" onclick="page('customers',-1)">上一頁</button><span id="ci" class="info"></span><button id="cn" onclick="page('customers',1)">下一頁</button></div></section></div><script>const data={orders:Array.from({length:25},(_,i)=>'訂單 '+String(i+1).padStart(4,'0')+'｜'+(i%2?'送到府':'冷藏寄放')),customers:Array.from({length:23},(_,i)=>'個資 '+String(i+1).padStart(4,'0')+'｜王小明｜09xx-xxx-'+String(i).padStart(2,'0'))};const p={orders:1,customers:1};function show(id,b){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(id)}function page(id,d){p[id]=Math.max(1,Math.min(Math.ceil(data[id].length/10),p[id]+d));render(id)}function render(id){let a=data[id],start=(p[id]-1)*10;document.getElementById(id+'List').innerHTML=a.slice(start,start+10).map(x=>'<div class="row">'+x+'</div>').join('');let total=Math.ceil(a.length/10),info=document.getElementById(id==='orders'?'oi':'ci');info.textContent='第 '+p[id]+' / '+total+' 頁，共 '+a.length+' 筆';document.getElementById(id==='orders'?'op':'cp').disabled=p[id]===1;document.getElementById(id==='orders'?'on':'cn').disabled=p[id]===total}render('orders');</script></body></html>
