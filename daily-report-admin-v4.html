<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><title>老爹・涼糕｜日報表</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#faf7f2}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="report" src="./daily-report-admin-v3.html?nocache=" title="老爹・涼糕｜日報表"></iframe><script>(function(){const f=document.getElementById('report');const LOCK_IDS=['deliveryCount','deliveryCompleted','deliveryPending','familyMartCount','sevenElevenCount'];const BASE='https://yemzdwxtyosuaczsqwea.supabase.co',KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';let syncing=false,lastDate='',lastValues='';f.src='./daily-report-admin-v3.html?nocache='+Date.now();function lock(){try{const d=f.contentDocument;if(!d)return;LOCK_IDS.forEach(id=>{const e=d.getElementById(id);if(!e)return;e.readOnly=true;e.disabled=true;e.setAttribute('readonly','readonly');e.setAttribute('disabled','disabled');e.setAttribute('aria-readonly','true');e.tabIndex=-1;e.inputMode='none';e.style.pointerEvents='none';e.style.userSelect='none';e.onkeydown=e.onkeypress=e.onkeyup=e.onbeforeinput=e.oninput=e.onchange=e.onpaste=e.oncut=e.ondrop=e.onwheel=function(ev){ev.preventDefault();return false}})}catch(e){}}function revenueUI(){try{const d=f.contentDocument;if(!d)return;const grid=d.querySelector('.statgrid');if(!grid)return;const cards=grid.querySelectorAll('.stat');if(cards.length<4)return;const revenue=cards[2],delivery=cards[3];if(!d.getElementById('statCakeFee')){revenue.innerHTML='<span>涼糕費用</span><b id="statCakeFee">$0</b>';const hold=document.createElement('div');hold.className='stat';hold.innerHTML='<span>寄放費用</span><b id="statHoldingFee">$0</b>';grid.insertBefore(hold,delivery);const net=document.createElement('div');net.className='stat';net.innerHTML='<span>營業額（扣除寄放費）</span><b id="statNetRevenue">$0</b>';grid.insertBefore(net,delivery)}delivery.innerHTML='<span>線上寄放服務</span><b id="statDelivery">0</b>'}catch(e){}}async function sync(force){if(syncing)return;try{const d=f.contentDocument;if(!d)return;const date=d.getElementById('reportDate')?.value;if(!date)return;if(!force&&date===lastDate&&Date.now()-Number(f.dataset.lastSync||0)<10000)return;syncing=true;const token=sessionStorage.getItem('daily_report_access_token')||'';const h={'apikey':KEY};if(token)h.Authorization='Bearer '+token;const r=await fetch(BASE+'/rest/v1/orders?select=status,pickup_type,total_amount,pickup_fee&delivery_date=eq.'+encodeURIComponent(date),{headers:h});if(!r.ok)return;const rows=await r.json();const active=(rows||[]).filter(o=>{const s=String(o.status||'').toLowerCase();return s!=='cancelled'&&s!=='已取消'});const pickupType=o=>String(o.pickup_type||'').toLowerCase().replace(/\s/g,'');const isFamily=o=>{const p=pickupType(o);return p==='familymart'||p.includes('全家')};const isSeven=o=>{const p=pickupType(o);return p==='seven_eleven'||p.includes('7-11')||p.includes('7–11')||p.includes('7－11')||p.includes('711')||p.includes('7eleven')};const holding=active.filter(o=>isFamily(o)||isSeven(o));const family=active.filter(isFamily).length;const seven=active.filter(isSeven).length;const doneStatus=['completed','complete','delivered','done','finished','已完成','已送達','已配送','完成'];const completed=holding.filter(o=>doneStatus.includes(String(o.status||'').toLowerCase())).length;const pending=Math.max(0,holding.length-completed);const holdingFee=active.reduce((s,o)=>s+Number(o.pickup_fee||0),0);const cakeFee=active.reduce((s,o)=>s+Number(o.total_amount||0)-Number(o.pickup_fee||0),0);const money=n=>'$'+Number(n||0).toLocaleString('zh-TW');revenueUI();const values=[active.length,holding.length,completed,pending,family,seven,holdingFee,cakeFee].join('|');if(force||values!==lastValues||date!==lastDate){const setText=(id,v)=>{const e=d.getElementById(id);if(e&&e.textContent!==String(v))e.textContent=v};const setValue=(id,v)=>{const e=d.getElementById(id);if(e&&e.value!==String(v))e.value=v};setText('statOrders',active.length);const ids=active.map(o=>o.id);if(ids.length){const ir=await fetch(BASE+'/rest/v1/order_items?select=order_id,quantity&order_id=in.('+ids.map(encodeURIComponent).join(',')+')',{headers:h});if(ir.ok){const items=await ir.json();const boxes=(items||[]).reduce((s,x)=>s+Number(x.quantity||0),0);setText('statBoxes',boxes)}}else setText('statBoxes',0);const cake=d.getElementById('statCakeFee'),hf=d.getElementById('statHoldingFee'),net=d.getElementById('statNetRevenue');if(cake&&cake.textContent!==money(cakeFee))cake.textContent=money(cakeFee);if(hf&&hf.textContent!==money(holdingFee))hf.textContent=money(holdingFee);if(net&&net.textContent!==money(cakeFee))net.textContent=money(cakeFee);setText('statDelivery',holding.length);setValue('deliveryCount',holding.length);setValue('deliveryCompleted',completed);setValue('deliveryPending',pending);setValue('familyMartCount',family);setValue('sevenElevenCount',seven);const msg=d.getElementById('statsMsg');if(msg)msg.textContent=date+' 已完成系統自動統計。營業額已扣除寄放費用。';lastValues=values;lastDate=date}f.dataset.lastSync=String(Date.now());lock()}catch(e){ }finally{syncing=false}}f.addEventListener('load',function(){revenueUI();lock();sync(true);setTimeout(function(){const d=f.contentDocument;if(!d)return;const date=d.getElementById('reportDate');if(date)date.addEventListener('change',function(){lastDate='';sync(true)});const refresh=d.getElementById('refreshBtn');if(refresh)refresh.addEventListener('click',function(){lastDate='';sync(true)})},300)});window.addEventListener('pageshow',function(){lastDate='';sync(true)});setInterval(function(){sync(false)},10000)})();</script></body></html>
