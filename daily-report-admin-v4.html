<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>老爹・涼糕｜日報表</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#faf7f2}iframe{width:100%;height:100%;border:0;display:block}</style></head><body><iframe id="report" src="./daily-report-admin-v3.html?nocache=" title="老爹・涼糕｜日報表"></iframe><script>(function(){const f=document.getElementById('report');const LOCK_IDS=['deliveryCount','deliveryCompleted','deliveryPending','familyMartCount','sevenElevenCount'];const BASE='https://yemzdwxtyosuaczsqwea.supabase.co',KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';f.src='./daily-report-admin-v3.html?nocache='+Date.now();function lock(){try{const d=f.contentDocument;if(!d)return;LOCK_IDS.forEach(id=>{const e=d.getElementById(id);if(!e)return;e.readOnly=true;e.disabled=true;e.setAttribute('readonly','readonly');e.setAttribute('disabled','disabled');e.setAttribute('aria-readonly','true');e.tabIndex=-1;e.inputMode='none';e.style.pointerEvents='none';e.style.userSelect='none';e.onkeydown=e.onkeypress=e.onkeyup=e.onbeforeinput=e.oninput=e.onchange=e.onpaste=e.oncut=e.ondrop=e.onwheel=function(ev){ev.preventDefault();return false};});}catch(e){}}async function sync(){try{const d=f.contentDocument;if(!d)return;const date=d.getElementById('reportDate')?.value;if(!date)return;const token=sessionStorage.getItem('daily_report_access_token')||'';const h={'apikey':KEY};if(token)h.Authorization='Bearer '+token;const r=await fetch(BASE+'/rest/v1/orders?select=status,pickup_type&delivery_date=eq.'+encodeURIComponent(date),{headers:h});if(!r.ok)return;const rows=await r.json();const active=(rows||[]).filter(o=>String(o.status||'').toLowerCase()!=='cancelled'&&String(o.status||'')!=='已取消');const isHolding=o=>{const p=String(o.pickup_type||'').toLowerCase().replace(/\s/g,'');return p.includes('全家')||p.includes('7-11')||p.includes('7–11')||p.includes('7－11')||p.includes('711')||p.includes('7eleven')};const holding=active.filter(isHolding);const family=holding.filter(o=>String(o.pickup_type||'').includes('全家')).length;const seven=holding.length-family;const doneStatus=['completed','complete','delivered','done','finished','已完成','已送達','已配送','完成'];const completed=holding.filter(o=>doneStatus.includes(String(o.status||'').toLowerCase())).length;const pending=Math.max(0,holding.length-completed);[['deliveryCount',holding.length],['deliveryCompleted',completed],['deliveryPending',pending],['familyMartCount',family],['sevenElevenCount',seven]].forEach(([id,v])=>{const e=d.getElementById(id);if(e)e.value=v});lock();}catch(e){}}f.addEventListener('load',function(){lock();sync();setInterval(lock,300);setInterval(sync,1500)});setInterval(lock,300);setInterval(sync,1500);})();</script></body></html>
