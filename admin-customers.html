<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹．涼糕｜個資管理</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.shell{max-width:1100px;margin:auto;padding:16px}.top,.card{background:#fff;border:1px solid #e7ddd5;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #5b3d2510}.brand{font-size:22px;font-weight:900}.muted{color:#766b64;font-size:14px;line-height:1.6}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:11px 16px;background:#8d5939;color:#fff;font-weight:900;cursor:pointer}.btn.gray{background:#6d625b}.btn.red{background:#d9342b}.tablewrap{overflow:auto;margin-top:14px;border:1px solid #e6ddd6;border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:860px}.table th{background:#8d5939;color:#fff;padding:13px 10px;text-align:left;white-space:nowrap}.table td{padding:12px 10px;border-bottom:1px solid #eee5de;background:#fff;white-space:nowrap}.table tr:last-child td{border-bottom:0}.empty{text-align:center;padding:30px;color:#766b64}.notice{padding:12px;border-radius:12px;margin-top:12px}.err{background:#fff0ef;color:#a43b35}.privacy{background:#f6eee7;border-radius:14px;padding:14px;margin-top:14px}.login{max-width:520px;margin:60px auto}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d9cec6;border-radius:11px;font:inherit}@media(max-width:600px){.shell{padding:10px}.top,.card{padding:14px}.brand{font-size:20px}}</style></head>
<body><div id="login" class="shell login"><div class="card"><div class="brand">🍡 老爹．涼糕｜個資管理</div><p class="muted">姓名、電話、門市與匯款後五碼管理。</p><form id="loginForm"><div class="field"><label>管理員 Email</label><input id="email" type="email" required></div><div class="field"><label>密碼</label><input id="password" type="password" required></div><button class="btn">登入</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="shell" style="display:none"><div class="top"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><div id="user" class="muted"></div></div><div class="card"><div class="toolbar"><div><h2 style="margin:0">個資管理</h2><div class="muted">顯示客人填寫的姓名、電話、門市與匯款後五碼。</div></div><button class="btn gray" id="reload">重新整理</button></div><div id="msg"></div><div class="tablewrap"><table class="table"><thead><tr><th>訂單編號</th><th>姓名</th><th>電話</th><th>門市</th><th>匯款後五碼</th><th>建立時間</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><div class="privacy"><b>注意事項：</b><br>此頁僅供內部管理使用。請妥善保管客人個資，勿外流。</div></div><div class="card"><button class="btn gray" id="logout">登出</button></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function access(u){const r=await db.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',u.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'管理員帳號目前已停用';if(r.data.role!=='super_admin'&&!r.data.can_manage_products&&r.data.role!=='order_admin'&&r.data.role!=='personal_data_admin')return'此帳號沒有管理權限';return null}async function load(){const o=await db.from('cooling_pickup_orders').select('id,order_number,customer_id,store_name,convenience_store,payment_last5,created_at').order('created_at',{ascending:false}).limit(200);if(o.error){$('msg').innerHTML='<div class="notice err">讀取個資失敗：'+esc(o.error.message)+'</div>';return}const orders=o.data||[];const ids=[...new Set(orders.map(x=>x.customer_id).filter(Boolean))];let cs=[];if(ids.length){const c=await db.from('order_customers').select('id,name,phone').in('id',ids);if(c.error){$('msg').innerHTML='<div class="notice err">讀取客戶資料失敗：'+esc(c.error.message)+'</div>';return}cs=c.data||[]}const cm=new Map(cs.map(x=>[x.id,x]));$('rows').innerHTML=orders.length?orders.map(x=>{const c=cm.get(x.customer_id)||{};return '<tr><td><b>'+esc(x.order_number)+'</b></td><td>'+esc(c.name||'')+'</td><td>'+esc(c.phone||'')+'</td><td>'+esc(x.convenience_store||'')+' '+esc(x.store_name||'')+'</td><td><b>'+esc(x.payment_last5||'')+'</b></td><td>'+new Date(x.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+'</td><td><button class="btn red" onclick="deleteCustomerData('+x.id+','+(x.customer_id||'null')+')">🗑 刪除</button></td></tr>'}).join(''):'<tr><td colspan="7" class="empty">目前沒有訂單資料</td></tr>'}$('msg').innerHTML=''}window.deleteCustomerData=async(orderId,customerId)=>{if(!confirm('確定要刪除這筆客人個資嗎？訂單會保留，但會解除客戶資料關聯。'))return;if(!customerId)return $('msg').innerHTML='<div class="notice err">此訂單沒有可刪除的客戶資料。</div>';let r=await db.from('cooling_pickup_orders').update({customer_id:null}).eq('id',orderId);if(r.error)return $('msg').innerHTML='<div class="notice err">解除個資關聯失敗：'+esc(r.error.message)+'</div>';r=await db.from('order_customers').delete().eq('id',customerId);if(r.error)return $('msg').innerHTML='<div class="notice err">刪除個資失敗：'+esc(r.error.message)+'</div>';$('msg').innerHTML='<div class="notice">個資已刪除，訂單保留。</div>';await load()};$('loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const er=await access(r.data.user);if(er){await db.auth.signOut();throw Error(er)}$('login').style.display='none';$('app').style.display='block';$('user').textContent='已登入 · '+r.data.user.email;load()}catch(x){$('loginMsg').innerHTML='<div class="notice err">登入失敗：'+esc(x.message)+'</div>'}};$('reload').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.getSession().then(async s=>{if(s.data.session){const u=s.data.session.user;const er=await access(u);if(!er){$('login').style.display='none';$('app').style.display='block';$('user').textContent='已登入 · '+u.email;load()}}});</script></body></html>
