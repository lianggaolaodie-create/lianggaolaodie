<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>老爹．涼糕｜個資管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f1e8;color:#3b281f;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.shell{max-width:1180px;margin:auto;padding:18px}.top,.panel{background:#fff;border:1px solid #eaded2;border-radius:24px;box-shadow:0 8px 28px rgba(72,45,29,.07)}.top{padding:20px 22px;margin-bottom:16px}.brand{font-size:24px;font-weight:950;color:#4b2d20}.sub{margin-top:5px;color:#8a776b;font-size:14px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.title{font-size:28px;font-weight:950;margin:0}.muted{color:#7b6d63;font-size:14px;line-height:1.6}.btn{border:0;border-radius:14px;padding:12px 18px;background:#4b2d20;color:#fff;font:inherit;font-weight:900;cursor:pointer}.btn.gray{background:#8b7b70}.btn.red{background:#d9473f}.login{max-width:520px;margin:70px auto}.field{margin:14px 0}.field label{display:block;font-weight:900;margin-bottom:7px}.field input{width:100%;padding:14px 16px;border:2px solid #e3d7cd;border-radius:14px;font:inherit;background:#fff}.notice{padding:13px 15px;border-radius:14px;margin:14px 0;background:#f1f8f2;color:#356947;font-weight:700}.err{background:#fff0ef;color:#a43b35}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}.stat{padding:16px;border-radius:18px;background:#fbf6ef;border:1px solid #eaded2}.stat b{display:block;font-size:24px;color:#4b2d20}.stat span{font-size:13px;color:#8a776b}.list{display:grid;gap:12px}.item{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center;padding:18px;border:1px solid #eaded2;border-radius:18px;background:#fff}.item-main{min-width:0}.order{font-size:17px;font-weight:950;color:#4b2d20}.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}.tag{display:inline-flex;padding:6px 9px;border-radius:999px;background:#f5eee7;color:#65554a;font-size:13px;font-weight:800}.tag.pay{background:#edf7ef;color:#356947}.actions{display:flex;gap:8px}.privacy{margin-top:16px;padding:15px;border-radius:16px;background:#f6eee7;color:#69584d;font-size:13px;line-height:1.7}.empty{text-align:center;padding:42px 20px;color:#8a776b;border:2px dashed #dfd0c4;border-radius:18px;background:#fffaf5}
@media(max-width:700px){.shell{padding:10px}.top,.panel{border-radius:20px}.top{padding:16px}.brand{font-size:21px}.title{font-size:24px}.summary{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.panel{padding:16px}.item{grid-template-columns:1fr}.actions{width:100%}.actions .btn{flex:1}.meta{gap:6px}}
</style>
</head>
<body>
<div id="login" class="shell login"><div class="panel" style="padding:24px"><div class="brand">🍡 老爹．涼糕｜個資管理</div><div class="sub">超商寄放訂單的客人資料管理</div><form id="loginForm"><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" style="width:100%;margin-top:8px">登入管理</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="shell" style="display:none"><header class="top"><div class="toolbar"><div><div class="brand">🍡 老爹．涼糕｜超商寄放個資</div><div class="sub">只保留必要資料，訂單本身不會因刪除個資而刪除。</div></div><div id="user" class="muted"></div></div></header>
<section class="panel" style="padding:22px"><div class="toolbar"><div><h1 class="title">個資管理</h1><div class="muted">姓名、電話、門市與匯款後五碼</div></div><button class="btn gray" id="reload">↻ 重新整理</button></div><div id="msg"></div><div class="summary"><div class="stat"><b id="count">0</b><span>目前訂單</span></div><div class="stat"><b id="withCustomer">0</b><span>有個資</span></div><div class="stat"><b id="stores">0</b><span>不同門市</span></div></div><div id="list" class="list"></div><div class="privacy"><b>個資提醒</b><br>此頁僅供內部管理。刪除個資只會解除訂單與客戶資料的關聯並刪除客戶資料，訂單紀錄會保留。</div></section>
<section class="panel" style="padding:16px;margin-top:14px"><button class="btn gray" id="logout">登出</button></section></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function access(u){const r=await db.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',u.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'管理員帳號目前已停用';if(r.data.role!=='super_admin'&&!r.data.can_manage_products&&r.data.role!=='order_admin'&&r.data.role!=='personal_data_admin')return'此帳號沒有管理權限';return null}
async function load(){const o=await db.from('cooling_pickup_orders').select('id,order_number,customer_id,store_name,convenience_store,payment_last5,created_at').order('created_at',{ascending:false}).limit(200);if(o.error){$('msg').innerHTML='<div class="notice err">讀取個資失敗：'+esc(o.error.message)+'</div>';return}const orders=o.data||[];const ids=[...new Set(orders.map(x=>x.customer_id).filter(Boolean))];let cs=[];if(ids.length){const c=await db.from('order_customers').select('id,name,phone').in('id',ids);if(c.error){$('msg').innerHTML='<div class="notice err">讀取客戶資料失敗：'+esc(c.error.message)+'</div>';return}cs=c.data||[]}const cm=new Map(cs.map(x=>[x.id,x]));$('count').textContent=orders.length;$('withCustomer').textContent=orders.filter(x=>x.customer_id&&cm.has(x.customer_id)).length;$('stores').textContent=new Set(orders.map(x=>(x.convenience_store||'')+' '+(x.store_name||'')).filter(Boolean)).size;if(!orders.length){$('list').innerHTML='<div class="empty">目前沒有超商寄放訂單資料</div>';$('msg').innerHTML='';return}$('list').innerHTML=orders.map(x=>{const c=cm.get(x.customer_id)||{};const time=new Date(x.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'});return '<article class="item"><div class="item-main"><div class="order">'+esc(x.order_number||'未提供訂單編號')+'</div><div class="meta"><span class="tag">👤 '+esc(c.name||'未填姓名')+'</span><span class="tag">📞 '+esc(c.phone||'未填電話')+'</span><span class="tag">🏪 '+esc((x.convenience_store||'')+' '+(x.store_name||'未填門市'))+'</span><span class="tag pay">💳 後五碼 '+esc(x.payment_last5||'未提供')+'</span><span class="tag">🕒 '+esc(time)+'</span></div></div><div class="actions"><button class="btn red" onclick="deleteCustomerData('+x.id+','+(x.customer_id||'null')+')">🗑 刪除個資</button></div></article>'}).join('');$('msg').innerHTML=''}
window.deleteCustomerData=async(orderId,customerId)=>{if(!confirm('確定要刪除這筆客人個資嗎？訂單會保留，但會解除客戶資料關聯。'))return;if(!customerId)return $('msg').innerHTML='<div class="notice err">此訂單沒有可刪除的客戶資料。</div>';let r=await db.from('cooling_pickup_orders').update({customer_id:null}).eq('id',orderId);if(r.error)return $('msg').innerHTML='<div class="notice err">解除個資關聯失敗：'+esc(r.error.message)+'</div>';r=await db.from('order_customers').delete().eq('id',customerId);if(r.error)return $('msg').innerHTML='<div class="notice err">刪除個資失敗：'+esc(r.error.message)+'</div>';$('msg').innerHTML='<div class="notice">個資已刪除，訂單保留。</div>';await load()};
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const er=await access(r.data.user);if(er){await db.auth.signOut();throw Error(er)}$('login').style.display='none';$('app').style.display='block';$('user').textContent='已登入 · '+r.data.user.email;load()}catch(x){$('loginMsg').innerHTML='<div class="notice err">登入失敗：'+esc(x.message)+'</div>'}};$('reload').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.getSession().then(async s=>{if(s.data.session){const u=s.data.session.user;const er=await access(u);if(!er){$('login').style.display='none';$('app').style.display='block';$('user').textContent='已登入 · '+u.email;load()}}});
</script>
</body></html>
