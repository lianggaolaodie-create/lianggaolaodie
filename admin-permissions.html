<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜管理員權限</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0000000a}h1{margin:0 0 8px}h2{font-size:21px;margin:0 0 12px}.small{font-size:13px;color:#75685f}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #d9cdc1;border-radius:10px;box-sizing:border-box;font:inherit;background:#fff}button{border:0;border-radius:11px;padding:11px 15px;background:#9b5c38;color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#eee;color:#333}button.danger{background:#a32e29}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.msg{padding:12px;border-radius:10px;background:#f6eee7;margin-top:10px}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}.item{border:1px solid #eadfd4;border-radius:14px;padding:14px;margin:10px 0}.line{display:grid;grid-template-columns:1fr 180px 90px auto;gap:8px;align-items:center}.line select{padding:9px;border:1px solid #d9cdc1;border-radius:9px}.switch{display:flex;align-items:center;gap:7px}.switch input{width:auto}@media(max-width:650px){.line{grid-template-columns:1fr 1fr}.line button{grid-column:2}.line .small{grid-column:1/3}}</style></head><body><main class="wrap"><div class="card"><h1>👤 管理員權限</h1><div id="who" class="small">登入後管理管理員帳號</div></div><div id="login" class="card"><h2>管理員登入</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn">登入</button><div id="loginMsg"></div></div><div id="panel" style="display:none"><div class="card"><div class="actions"><button class="secondary" id="refresh">重新整理</button><button class="secondary" id="logout">登出</button><a href="admin.html" style="display:inline-block;padding:11px 15px;color:#6b4631;font-weight:800;text-decoration:none">← 返回後台</a></div><div id="msg" class="msg"></div></div><div class="card"><h2>➕ 新增管理員</h2><div class="small">輸入已經存在於 Supabase 登入系統的 Email。這裡不會建立或修改登入密碼。</div><div class="field"><label>管理員 Email</label><input id="newEmail" type="email" placeholder="例如：example@gmail.com"></div><div class="field"><label>管理員角色</label><select id="newRole"><option value="order_admin">訂單管理員</option><option value="personal_data_admin">個資管理員</option><option value="super_admin">Super Admin</option></select></div><button id="addBtn">新增管理員</button><div id="addMsg"></div></div><div class="card"><h2>📋 現有管理員</h2><div class="small">只有 Super Admin 可以新增、修改、停用或刪除管理員。</div><div id="list">讀取中…</div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fn='https://yemzdwxtyosuaczsqwea.supabase.co/functions/v1/admin-manage';let me=null;async function call(action,extra={}){const{data}=await sb.auth.getSession();const token=data?.session?.access_token;if(!token)throw new Error('尚未登入');const r=await fetch(fn,{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});const j=await r.json();if(!r.ok)throw new Error(j.error||'操作失敗');return j}async function start(){const{data}=await sb.auth.getUser();if(!data.user)return;me=data.user;$('who').textContent=data.user.email||'';try{const j=await call('list');$('login').style.display='none';$('panel').style.display='block';$('msg').textContent='目前登入：'+(data.user.email||'')+'｜Super Admin 管理模式';render(j.data||[])}catch(e){$('loginMsg').innerHTML='<div class="msg error">'+esc(e.message)+'</div>'}}function render(rows){if(!rows.length){$('list').textContent='目前沒有管理員。';return}$('list').innerHTML=rows.map(a=>'<div class="item"><div class="line"><div><strong>'+esc(a.email||a.user_id)+'</strong><div class="small">UID：'+esc(a.user_id)+'</div></div><select id="r_'+a.user_id+'"><option value="super_admin" '+(a.role==='super_admin'?'selected':'')+'>Super Admin</option><option value="order_admin" '+(a.role==='order_admin'?'selected':'')+'>訂單管理員</option><option value="personal_data_admin" '+(a.role==='personal_data_admin'?'selected':'')+'>個資管理員</option></select><label class="switch"><input id="e_'+a.user_id+'" type="checkbox" '+(a.enabled?'checked':'')+'>啟用</label><div class="actions"><button onclick="save(\''+a.user_id+'\')">儲存</button><button class="danger" onclick="del(\''+a.user_id+'\')">刪除</button></div></div></div>').join('')}window.save=async id=>{try{await call('update',{user_id:id,role:$('r_'+id).value,enabled:$('e_'+id).checked});alert('權限已儲存');load()}catch(e){alert(e.message)}};window.del=async id=>{if(!confirm('確定要刪除這個管理員權限？\n只會移除管理員權限，不會刪除登入帳號。'))return;try{await call('delete',{user_id:id});alert('管理員權限已刪除');load()}catch(e){alert(e.message)}};async function load(){try{const j=await call('list');render(j.data||[])}catch(e){alert(e.message)}}$('loginBtn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return $('loginMsg').innerHTML='<div class="msg error">請輸入 Email 和密碼</div>';$('loginBtn').disabled=true;try{const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;await start()}catch(e){$('loginMsg').innerHTML='<div class="msg error">登入失敗：'+esc(e.message||e)+'</div>'}finally{$('loginBtn').disabled=false}};$('addBtn').onclick=async()=>{const email=$('newEmail').value.trim(),role=$('newRole').value;if(!email)return $('addMsg').innerHTML='<div class="msg error">請輸入 Email</div>';$('addBtn').disabled=true;try{await call('add',{email,role});$('newEmail').value='';$('addMsg').innerHTML='<div class="msg ok">管理員已新增／恢復啟用。</div>';load()}catch(e){$('addMsg').innerHTML='<div class="msg error">'+esc(e.message)+'</div>'}finally{$('addBtn').disabled=false}};$('refresh').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};start();</script></body></html>
