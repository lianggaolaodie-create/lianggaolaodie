<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>老爹．涼糕｜送到府訂購</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff3f7;color:#33251d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 50px}.card{background:#fff;border:1px solid #ead7df;border-radius:20px;padding:18px;margin-bottom:14px}.brand{font-size:25px;font-weight:900}.muted{color:#786d65;font-size:13px;line-height:1.6}.tag{display:inline-block;margin-top:8px;padding:7px 11px;border-radius:999px;background:#ffe0eb;color:#a62d5c;font-weight:900}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dccbd2;border-radius:12px;background:#fff;font:inherit}.flavor{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;border:1px solid #eadde3;border-radius:15px;padding:10px;margin:9px 0}.flavor-img,.flavor-placeholder{width:80px;height:80px;border-radius:12px;object-fit:cover;background:#f6edf1}.flavor-placeholder{display:flex;align-items:center;justify-content:center;color:#a88d98;font-size:12px;text-align:center}.price{color:#a62d5c;font-weight:800}.qty{display:flex;align-items:center;gap:8px}.qty button{width:38px;height:38px;border:0;border-radius:10px;background:#f2e3e9;font-size:21px;font-weight:900}.qty span{min-width:25px;text-align:center;font-weight:900}.cut-box{margin-top:14px;padding:14px 16px;border-radius:14px;background:#fff7fa;border:1px solid #f0d6e1}.cut-title{font-size:16px;font-weight:900;color:#7a304d;margin-bottom:10px}.cut-box label{display:inline-flex;align-items:center;margin-right:24px;font-size:16px;cursor:pointer}.cut-box input{accent-color:#c52f68;margin-right:7px;width:18px;height:18px}.summary{background:#fff8fb;border:1px solid #ead6df;border-radius:15px;padding:14px}.row{display:flex;justify-content:space-between;padding:6px 0}.total{font-size:23px;font-weight:900;color:#a62d5c;border-top:1px solid #ead6df;margin-top:8px;padding-top:10px}.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;background:#c52f68;color:#fff;font-size:17px;font-weight:900;text-align:center;text-decoration:none;cursor:pointer}.btn:disabled{opacity:.55}.notice{margin-top:10px;padding:12px;border-radius:12px;line-height:1.6}.err{background:#fff0ef;color:#a43b35}.ok{background:#edf8f1;color:#286c47}.result{display:none}.result.show{display:block}.order-number{font-size:28px;font-weight:900;color:#a62d5c}.line-btn{background:#06c755;margin-top:14px}.item{display:flex;justify-content:space-between;border-bottom:1px dashed #ead6df;padding:8px 0}@media(max-width:560px){.flavor{grid-template-columns:72px 1fr}.flavor-img,.flavor-placeholder{width:72px;height:72px}.qty{grid-column:2;justify-content:flex-end}}
.global-cut-choice{margin-top:14px;padding:14px 16px;border-radius:14px;background:#fff7fa;border:1px solid #f0d6e1}.global-cut-title{font-size:16px;font-weight:900;color:#7a304d;margin-bottom:10px}.global-cut-choice label{display:inline-flex;align-items:center;margin-right:24px;font-size:16px;cursor:pointer}.global-cut-choice input{accent-color:#c52f68;margin-right:7px;width:18px;height:18px}.global-cut-choice{margin-top:14px;padding:14px 16px;border-radius:14px;background:#fff7fa;border:1px solid #f0d6e1}.global-cut-title{font-size:16px;font-weight:900;color:#7a304d;margin-bottom:10px}.global-cut-choice label{display:inline-flex;align-items:center;margin-right:24px;font-size:16px;cursor:pointer}.global-cut-choice input{accent-color:#c52f68;margin-right:7px;width:18px;height:18px}.global-cut-choice{margin-top:14px;padding:14px 16px;border-radius:14px;background:#fff7fa;border:1px solid #f0d6e1}.global-cut-title{font-size:16px;font-weight:900;color:#7a304d;margin-bottom:10px}.global-cut-choice label{display:inline-flex;align-items:center;margin-right:24px;font-size:16px;cursor:pointer}.global-cut-choice input{accent-color:#c52f68;margin-right:7px;width:18px;height:18px}.global-cut-choice{margin-top:14px;padding:14px 16px;border-radius:14px;background:#fff7fa;border:1px solid #f0d6e1}.global-cut-title{font-size:16px;font-weight:900;color:#7a304d;margin-bottom:10px}.global-cut-choice label{display:inline-flex;align-items:center;margin-right:24px;font-size:16px;cursor:pointer}.global-cut-choice input{accent-color:#c52f68;margin-right:7px;width:18px;height:18px}.global-cut-choice{margin-top:14px;padding:14px 16px;border-radius:14px;background:#fff7fa;border:1px solid #f0d6e1}.global-cut-title{font-size:16px;font-weight:900;color:#7a304d;margin-bottom:10px}.global-cut-choice label{display:inline-flex;align-items:center;margin-right:24px;font-size:16px;cursor:pointer}.global-cut-choice input{accent-color:#c52f68;margin-right:7px;width:18px;height:18px}</style>
</head>
<body>
<main class="wrap">
<div class="card"><div class="brand">🏠 老爹．涼糕｜送到府訂購</div><div class="muted">選口味、數量，填寫基本資料即可下單。付款方式：貨到付款。最低訂購 2 盒，可混搭不同口味。</div><span class="tag">🏠 送到府｜貨到付款</span></div>
<div id="closed" class="card" style="display:none"></div>
<form id="orderForm">
<div class="card"><h2>① 選擇配送日期</h2><div class="field"><label>日期 *</label><select id="deliveryDate" required><option value="">讀取中…</option></select></div></div>
<div class="card"><h2>② 選擇送到府地區</h2><div class="field"><label>地區 *</label><select id="region" required><option value="">請先選擇日期</option></select></div></div>
<div class="card"><h2>③ 點選口味與數量</h2><div id="flavors"></div><div id="globalCutChoice" class="global-cut-choice">
  <div class="global-cut-title">包餡切法</div>
  <label><input type="radio" name="global-cut-option" value="不切" checked>不切</label>
  <label><input type="radio" name="global-cut-option" value="切">切</label>
</div><div class="cut-box"><div class="cut-title">包餡切法</div><label><input type="radio" name="globalCut" value="不切" checked>不切</label><label><input type="radio" name="globalCut" value="切">切</label></div><div id="flavorEmpty" class="muted" style="display:none">這一天尚未開放口味。</div></div>
<div class="card"><h2>④ 填寫送達資料</h2><div class="field"><label>收件人姓名 *</label><input id="customerName" required maxlength="80"></div><div class="field"><label>手機 *</label><input id="customerPhone" required maxlength="30" inputmode="tel"></div><div class="field"><label>送達地址 *</label><textarea id="address" required rows="3" maxlength="300"></textarea></div><div class="field"><label>備註</label><textarea id="notes" rows="3" maxlength="500"></textarea></div></div>
<div class="card"><h2>⑤ 確認訂單</h2><div class="summary"><div class="row"><span>涼糕總數</span><b id="totalQty">0 盒</b></div><div class="row"><span>涼糕小計</span><b>NT$ <span id="grandTotal">0</span></b></div><div class="row"><span>付款方式</span><b>貨到付款</b></div></div><div id="minimumNotice" class="notice err">最低訂購 2 盒，目前 0 盒。</div><button id="submitBtn" class="btn" type="submit" style="margin-top:14px" disabled>確認送到府訂單</button><div id="msg"></div></div>
</form>
<section id="result" class="card result"><h2>✅ 訂單已送出</h2><p>線上訂單編號：</p><div id="resultOrder" class="order-number"></div><div id="resultItems"></div><div class="summary" style="margin-top:14px"><div class="row"><span>配送日期</span><b id="resultDate"></b></div><div class="row"><span>配送地區</span><b id="resultRegion"></b></div><div class="row"><span>收件人</span><b id="resultName"></b></div><div class="row"><span>電話</span><b id="resultPhone"></b></div><div class="row"><span>地址</span><b id="resultAddress"></b></div><div class="row"><span>付款方式</span><b>貨到付款</b></div><div class="row total"><span>貨到付款金額</span><span>NT$ <span id="resultTotal"></span></span></div></div><a id="lineSend" class="btn line-btn" href="#">📲 傳送訂單至官方 LINE</a></section>
</main>
<script>
const API='https://yemzdwxtyosuaczsqwea.supabase.co';
const KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';
const $=id=>document.getElementById(id);let flavors=[];
const headers={apikey:KEY,Authorization:'Bearer '+KEY,'Content-Type':'application/json'};
function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'})}
function showMsg(t){$('msg').innerHTML='<div class="notice err">'+String(t||'讀取失敗，請稍後再試。')+'</div>'}
async function rest(path,options={}){const r=await fetch(API+'/rest/v1/'+path,{...options,headers:{...headers,...(options.headers||{})},cache:'no-store'});const text=await r.text();let data;try{data=JSON.parse(text)}catch{data=text}if(!r.ok)throw new Error(data?.message||data?.hint||data?.details||text||('HTTP '+r.status));return data}
async function init(){try{const dates=await rest('daily_order_settings?select=order_date&ordering_enabled=eq.true&order_date=gte.'+encodeURIComponent(today())+'&order=order_date.asc&limit=31');if(!Array.isArray(dates)||!dates.length){$('closed').style.display='block';$('closed').textContent='目前尚未開放送到府訂購。';$('orderForm').style.display='none';return}$('deliveryDate').innerHTML='<option value="">請選擇開放日期</option>'+dates.map(x=>'<option value="'+x.order_date+'">'+x.order_date+'</option>').join('');$('deliveryDate').value=dates[0].order_date;await loadDate()}catch(e){$('deliveryDate').innerHTML='<option value="">日期讀取失敗</option>';showMsg('開放日期讀取失敗：'+(e.message||e))}}
async function loadDate(){const d=$('deliveryDate').value;if(!d){$('region').innerHTML='<option value="">請先選擇日期</option>';return}$('region').innerHTML='<option value="">讀取中…</option>';try{const [rs,fs]=await Promise.all([rest('daily_order_regions?select=region_name&order_date=eq.'+encodeURIComponent(d)+'&enabled=eq.true&order=id.asc'),rest('daily_order_flavors?select=flavor_id,product_name,flavor_name,price&order_date=eq.'+encodeURIComponent(d)+'&enabled=eq.true&order=id.asc')]);$('region').innerHTML='<option value="">請選擇當日開放地區</option>'+(rs||[]).map(x=>'<option value="'+x.region_name+'">'+x.region_name+'</option>').join('');if(!rs.length)$('region').innerHTML='<option value="">當日尚未開放送到府地區</option>';const ids=(fs||[]).map(x=>x.flavor_id).filter(Boolean);let info={};if(ids.length){const pr=await rest('flavors?select=id,image_url,flavor_type&id=in.('+ids.join(',')+')');(pr||[]).forEach(x=>info[x.id]=x)}flavors=(fs||[]).map(f=>({...f,image_url:info[f.flavor_id]?.image_url||'',flavor_type:info[f.flavor_id]?.flavor_type||''}));$('flavors').innerHTML=flavors.map((f,i)=>'<div class="flavor">'+(f.image_url?'<img class="flavor-img" src="'+f.image_url+'" alt="'+f.flavor_name+'" loading="lazy">':'<div class="flavor-placeholder">尚未設定照片</div>')+'<div><b>'+f.product_name+'／'+f.flavor_name+'</b><div class="price">NT$ '+Number(f.price||0).toLocaleString()+'</div></div><div class="qty"><button type="button" onclick="changeQty('+i+',-1)">−</button><span id="q'+i+'">0</span><button type="button" onclick="changeQty('+i+',1)">＋</button></div></div>').join('');$('flavorEmpty').style.display=flavors.length?'none':'block';updateTotals()}catch(e){$('region').innerHTML='<option value="">讀取失敗，請稍後再試</option>';showMsg('當日資料讀取失敗：'+(e.message||e))}}
function changeQty(i,n){const e=$('q'+i);e.textContent=Math.max(0,Math.min(99,Number(e.textContent||0)+n));updateTotals()}
function selectedItems(){return flavors.map((f,i)=>({flavor_id:Number(f.flavor_id),quantity:Number($('q'+i)?.textContent||0),name:f.flavor_name,price:Number(f.price||0),flavor_type:f.flavor_type})).filter(x=>x.quantity>0)}
function updateTotals(){const a=selectedItems(),qty=a.reduce((s,x)=>s+x.quantity,0);$('totalQty').textContent=qty+' 盒';$('grandTotal').textContent=a.reduce((s,x)=>s+x.price*x.quantity,0).toLocaleString();$('submitBtn').disabled=qty<2;$('minimumNotice').textContent=qty<2?'最低訂購 2 盒，目前 '+qty+' 盒。':'已達最低訂購數量：'+qty+' 盒。';$('minimumNotice').className='notice '+(qty<2?'err':'ok')}
$('deliveryDate').addEventListener('change',loadDate);
$('orderForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('submitBtn');btn.disabled=true;btn.textContent='送出中…';$('msg').innerHTML='';try{const d=$('deliveryDate').value,region=$('region').value,a=selectedItems(),qty=a.reduce((s,x)=>s+x.quantity,0);if(!d)throw new Error('請選擇配送日期');if(!region||region==='當日尚未開放送到府地區')throw new Error('請選擇送到府地區');if(qty<2)throw new Error('最低訂購 2 盒，請再選購 1 盒後送出訂單。');const hasFilled=a.some(x=>String(x.flavor_type||'').toLowerCase()==='filled';const cut=hasFilled?($('orderForm').querySelector('input[name="globalCut"]:checked')?.value||'不切'):'';const noteBase=$('notes').value.trim();const note=cut?'[包餡切法] '+cut+(noteBase?'\n'+noteBase:''):noteBase;const payload={p_delivery_date:d,p_delivery_region:region,p_pickup_type:'home_delivery',p_pickup_store:$('address').value.trim(),p_customer_name:$('customerName').value.trim(),p_customer_phone:$('customerPhone').value.trim(),p_customer_note:note||null,p_items:a.map(x=>({flavor_id:x.flavor_id,quantity:x.quantity}))};const odata=await rest('rpc/create_customer_order',{method:'POST',body:JSON.stringify(payload)});const o=Array.isArray(odata)?odata[0]:odata;if(!o||!o.order_number)throw new Error('訂單已建立但沒有取得線上訂單編號');$('resultOrder').textContent=o.order_number;$('resultDate').textContent=d;$('resultRegion').textContent=region;$('resultName').textContent=$('customerName').value.trim();$('resultPhone').textContent=$('customerPhone').value.trim();$('resultAddress').textContent=$('address').value.trim();$('resultTotal').textContent=Number(o.total_amount||0).toLocaleString();$('resultItems').innerHTML=a.map(x=>'<div class="item"><span>'+x.name+' × '+x.quantity+'</span><b>NT$ '+(x.price*x.quantity).toLocaleString()+'</b></div>').join('');const msg=['🍡 老爹．涼糕｜送到府訂單','線上訂單編號：'+o.order_number,'配送日期：'+d,'地區：'+region,'收件人：'+$('customerName').value.trim(),'電話：'+$('customerPhone').value.trim(),'地址：'+$('address').value.trim(),'付款方式：貨到付款',cut?'包餡切法：'+cut:'','訂購內容：'].concat(a.map(x=>'・'+x.name+' × '+x.quantity),'貨到付款金額：NT$ '+Number(o.total_amount||0).toLocaleString()).filter(Boolean).join('\n');$('lineSend').href='https://line.me/R/oaMessage/%40502iugah/?'+encodeURIComponent(msg);$('orderForm').style.display='none';$('result').classList.add('show');window.scrollTo({top:0,behavior:'smooth'})}catch(err){showMsg(err.message);btn.disabled=selectedItems().reduce((s,x)=>s+x.quantity,0)<2;btn.textContent='確認送到府訂單'}});
init();
</script>
<script id="global-cut-submit-fix">
(()=>{
  const form=document.getElementById('orderForm');
  if(!form||form.dataset.globalCutBound) return;
  form.dataset.globalCutBound='1';
  form.addEventListener('submit',()=>{
    const notes=document.getElementById('notes');
    const selected=document.querySelector('input[name="global-cut-option"]:checked')?.value||'不切';
    if(notes){
      const base=notes.value.replace(/\n?\[包餡切法\][\s\S]*$/,'').trim();
      notes.value=[base,'[包餡切法] '+selected].filter(Boolean).join('\n');
    }
  },{capture:true});
})();
</script>
</body>
</html>
