<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>老爹．涼糕｜送到府訂購</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff3f7;color:#33251d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 50px}.card{background:#fff;border:1px solid #ead7df;border-radius:20px;padding:18px;margin-bottom:14px}.brand{font-size:25px;font-weight:900}.muted{color:#786d65;font-size:13px;line-height:1.6}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dccbd2;border-radius:12px;background:#fff;font:inherit}.flavor{display:grid;grid-template-columns:80px 1fr auto;gap:12px;align-items:center;border:1px solid #eadde3;border-radius:15px;padding:10px;margin:9px 0}.flavor-img,.flavor-placeholder{width:80px;height:80px;border-radius:12px;object-fit:cover;background:#f6edf1}.flavor-placeholder{display:flex;align-items:center;justify-content:center;color:#a88d98;font-size:12px;text-align:center}.price{color:#a62d5c;font-weight:800}.qty{display:flex;align-items:center;gap:8px}.qty button{width:38px;height:38px;border:0;border-radius:10px;background:#f2e3e9;font-size:21px;font-weight:900}.qty span{min-width:25px;text-align:center;font-weight:900}.summary{background:#fff8fb;border:1px solid #ead6df;border-radius:15px;padding:14px}.row{display:flex;justify-content:space-between;padding:6px 0}.total{font-size:23px;font-weight:900;color:#a62d5c;border-top:1px solid #ead6df;margin-top:8px;padding-top:10px}.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;background:#c52f68;color:#fff;font-size:17px;font-weight:900;text-align:center;text-decoration:none;cursor:pointer}.btn:disabled{opacity:.55}.notice{margin-top:10px;padding:12px;border-radius:12px;line-height:1.6}.err{background:#fff0ef;color:#a43b35}.ok{background:#edf8f1;color:#286c47}.cut{display:none;margin-top:14px;padding:14px 16px;border-radius:14px;background:#fff7fa;border:1px solid #f0d6e1}.cut-title{font-size:16px;font-weight:900;color:#7a304d;margin-bottom:10px}.cut label{display:inline-flex;align-items:center;margin-right:24px;font-size:16px;cursor:pointer}.cut input{accent-color:#c52f68;margin-right:7px;width:18px;height:18px}.result{display:none}.result.show{display:block}.order-number{font-size:28px;font-weight:900;color:#a62d5c}.line-btn{background:#06c755;margin-top:14px}.item{display:flex;justify-content:space-between;border-bottom:1px dashed #ead6df;padding:8px 0}@media(max-width:560px){.flavor{grid-template-columns:72px 1fr}.flavor-img,.flavor-placeholder{width:72px;height:72px}.qty{grid-column:2;justify-content:flex-end}}
</style>
</head>
<body>
<main class="wrap">
<div class="card"><div class="brand">🏠 老爹．涼糕｜送到府訂購</div><div class="muted">選口味、數量，填寫基本資料即可下單。付款方式：貨到付款。最低訂購 2 盒，可混搭不同口味。</div><div class="muted" style="margin-top:8px">配送日期與開放地區會依後台設定顯示。</div></div>
<div id="closed" class="card" style="display:none"></div>
<form id="orderForm">
<div class="card"><h2>① 選擇配送日期</h2><div class="field"><label>日期 *</label><select id="deliveryDate" required><option value="">讀取中…</option></select></div></div>
<div class="card"><h2>② 選擇送到府地區</h2><div class="field"><label>地區 *</label><select id="region" required><option value="">請先選擇日期</option></select></div></div>
<div class="card"><h2>③ 點選口味與數量</h2><div id="flavors"></div><div id="flavorEmpty" class="muted" style="display:none">這一天尚未開放口味。</div><div id="cut" class="cut"><div class="cut-title">包餡切法</div><label><input type="radio" name="cut" value="不切" checked>不切</label><label><input type="radio" name="cut" value="切">切</label></div></div>
<div class="card"><h2>④ 填寫送達資料</h2><div class="field"><label>收件人姓名 *</label><input id="customerName" required maxlength="80"></div><div class="field"><label>手機 *</label><input id="customerPhone" required maxlength="30" inputmode="tel"></div><div class="field"><label>送達地址 *（請填完整縣市）</label><textarea id="address" required rows="3" maxlength="300" placeholder="例如：新北市板橋區○○路○號"></textarea><div class="muted" style="font-size:12px;margin-top:5px">請務必填寫完整地址，包含「縣市」及後續區／鄉鎮市、路街、門牌。</div></div><div class="field"><label>備註</label><textarea id="notes" rows="3" maxlength="500"></textarea></div></div>
<div class="card"><h2>⑤ 確認訂單</h2><div class="summary"><div class="row"><span>涼糕總數</span><b id="totalQty">0 盒</b></div><div class="row"><span>涼糕小計</span><b>NT$ <span id="grandTotal">0</span></b></div><div class="row"><span>付款方式</span><b>貨到付款</b></div></div><div id="minimumNotice" class="notice err">最低訂購 2 盒，目前 0 盒。</div><button id="submitBtn" class="btn" type="submit" style="margin-top:14px" disabled>確認送到府訂單</button><div id="msg"></div></div>
</form>
<section id="result" class="card result"><h2>✅ 訂單已送出</h2><p>線上訂單編號：</p><div id="resultOrder" class="order-number"></div><div id="resultItems"></div><div class="summary" style="margin-top:14px"><div class="row"><span>配送日期</span><b id="resultDate"></b></div><div class="row"><span>配送地區</span><b id="resultRegion"></b></div><div class="row"><span>收件人</span><b id="resultName"></b></div><div class="row"><span>電話</span><b id="resultPhone"></b></div><div class="row"><span>地址</span><b id="resultAddress"></b></div><div class="row"><span>付款方式</span><b>貨到付款</b></div><div class="row total"><span>貨到付款金額</span><span>NT$ <span id="resultTotal"></span></span></div></div><a id="lineSend" class="btn line-btn" href="#">📲 傳送訂單至官方 LINE</a></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);let flavors=[];const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function msg(t){$('msg').innerHTML='<div class="notice err">'+esc(t)+'</div>'}function setClosed(t){$('closed').style.display='block';$('closed').textContent=t;$('orderForm').style.display='none'}
async function init(){try{const {data,error}=await sb.from('daily_order_settings').select('order_date').gte('order_date',today()).eq('ordering_enabled',true).order('order_date',{ascending:true}).limit(31);if(error)throw error;if(!data?.length){setClosed('目前尚未開放送到府訂購。');return}$('deliveryDate').innerHTML='<option value="">請選擇開放日期</option>'+data.map(x=>'<option value="'+esc(x.order_date)+'">'+esc(x.order_date)+'</option>').join('');$('deliveryDate').value=data[0].order_date;await loadDate()}catch(e){$('deliveryDate').innerHTML='<option value="">日期讀取失敗</option>';msg('開放日期讀取失敗：'+(e.message||e))}}
async function loadDate(){const d=$('deliveryDate').value;if(!d)return;$('region').innerHTML='<option value="">讀取中…</option>';$('flavors').innerHTML='<div class="muted">正在讀取當日口味…</div>';$('cut').style.display='none';try{const rr=await sb.from('daily_order_regions').select('region_name').eq('order_date',d).eq('enabled',true).order('id');if(rr.error)throw rr.error;const regions=rr.data||[];$('region').innerHTML='<option value="">請選擇當日開放地區</option>'+regions.map(x=>'<option value="'+esc(x.region_name)+'">'+esc(x.region_name)+'</option>').join('');if(!regions.length)$('region').innerHTML='<option value="">當日尚未開放送到府地區</option>';const ff=await sb.from('daily_order_flavors').select('flavor_id,product_name,flavor_name,price,quantity').eq('order_date',d).eq('enabled',true).order('id');if(ff.error)throw ff.error;const base=ff.data||[];let imageMap={},typeMap={};const mm=await sb.from('flavors').select('id,image_url,flavor_type').eq('enabled',true);if(!mm.error){imageMap=Object.fromEntries((mm.data||[]).map(x=>[Number(x.id),x.image_url||'']));typeMap=Object.fromEntries((mm.data||[]).map(x=>[Number(x.id),String(x.flavor_type||'')]));}flavors=base.map(x=>({...x,image_url:imageMap[Number(x.flavor_id)]||'',flavor_type:typeMap[Number(x.flavor_id)]||''}));$('flavors').innerHTML=flavors.map((x,i)=>'<div class="flavor">'+(x.image_url?'<img class="flavor-img" src="'+esc(x.image_url)+'" alt="'+esc(x.flavor_name)+'">':'<div class="flavor-placeholder">尚未設定照片</div>')+'<div><b>'+esc(x.product_name||'涼糕')+'／'+esc(x.flavor_name)+'</b><div class="price">NT$ '+Number(x.price||0).toLocaleString()+'</div></div><div class="qty"><button type="button" onclick="changeQty('+i+',-1)">−</button><span id="q'+i+'">0</span><button type="button" onclick="changeQty('+i+',1)" '+(Number(x.quantity||0)>1?'':'disabled')+'>＋</button></div><div class="small" style="grid-column:2;color:'+(Number(x.quantity||0)>0?'#286c47':'#a43b35')+'">'+(Number(x.quantity||0)>1?'剩餘 '+Number(x.quantity||0)+' 盒':(Number(x.quantity||0)===1?'僅剩 1 盒，不開放此口味':'已售完'))+'</div></div>').join('');$('flavorEmpty').style.display=flavors.length?'none':'block';const hasFilled=flavors.some(x=>{const t=String(x.flavor_type||'').toLowerCase();return t==='filled'||t.includes('包餡')||t.includes('夾心')});$('cut').style.display=hasFilled?'block':'none';updateTotals()}catch(e){$('region').innerHTML='<option value="">讀取失敗，請稍後再試</option>';$('flavors').innerHTML='';msg('當日資料讀取失敗：'+(e.message||e))}}
function changeQty(i,n){const e=$('q'+i),stock=Number(flavors[i]?.quantity||0),next=Math.max(0,Math.min(stock,Number(e.textContent||0)+n));e.textContent=next;updateTotals()}function selectedItems(){return flavors.map((f,i)=>({flavor_id:Number(f.flavor_id),quantity:Number($('q'+i)?.textContent||0),name:f.flavor_name,price:Number(f.price||0),flavor_type:f.flavor_type})).filter(x=>x.quantity>0)}function updateTotals(){const a=selectedItems(),q=a.reduce((s,x)=>s+x.quantity,0);$('totalQty').textContent=q+' 盒';$('grandTotal').textContent=a.reduce((s,x)=>s+x.price*x.quantity,0).toLocaleString();$('submitBtn').disabled=q<2;$('minimumNotice').textContent=q<2?'最低訂購 2 盒，目前 '+q+' 盒。':'已達最低訂購數量：'+q+' 盒。';$('minimumNotice').className='notice '+(q<2?'err':'ok')}
$('deliveryDate').addEventListener('change',loadDate);$('orderForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('submitBtn');btn.disabled=true;btn.textContent='送出中…';$('msg').innerHTML='';try{const d=$('deliveryDate').value,r=$('region').value,a=selectedItems(),q=a.reduce((s,x)=>s+x.quantity,0);const address=$('address').value.trim();const hasCity=/臺北市|台北市|新北市|桃園市|臺中市|台中市|臺南市|高雄市|基隆市|新竹市|嘉義市|新竹縣|苗栗縣|彰化縣|南投縣|雲林縣|嘉義縣|屏東縣|宜蘭縣|花蓮縣|臺東縣|台東縣|澎湖縣|金門縣|連江縣/.test(address);if(!hasCity)throw new Error('送到府地址請填寫完整縣市，例如：新北市板橋區○○路○號');if(!d)throw new Error('請選擇配送日期');if(!r)throw new Error('請選擇送到府地區');if(q<2)throw new Error('最低訂購 2 盒，請再選購後送出訂單。');const hasFilled=a.some(x=>{const t=String(x.flavor_type||'').toLowerCase();return t==='filled'||t.includes('包餡')||t.includes('夾心')});const cut=hasFilled?($('orderForm').querySelector('input[name="cut"]:checked')?.value||'不切'):'';const base=$('notes').value.trim();const note=[cut?'[包餡切法] '+cut:'',base].filter(Boolean).join('\n');const {data,error}=await sb.rpc('create_customer_order',{p_delivery_date:d,p_delivery_region:r,p_pickup_type:'home_delivery',p_pickup_store:$('address').value.trim(),p_customer_name:$('customerName').value.trim(),p_customer_phone:$('customerPhone').value.trim(),p_customer_note:note||null,p_items:a.map(x=>({flavor_id:x.flavor_id,quantity:x.quantity}))});if(error)throw error;const o=Array.isArray(data)?data[0]:data;if(!o?.order_number)throw new Error('訂單已建立但沒有取得訂單編號');$('resultOrder').textContent=o.order_number;$('resultDate').textContent=d;$('resultRegion').textContent=r;$('resultName').textContent=$('customerName').value.trim();$('resultPhone').textContent=$('customerPhone').value.trim();$('resultAddress').textContent=$('address').value.trim();$('resultTotal').textContent=Number(o.total_amount||0).toLocaleString();$('resultItems').innerHTML=a.map(x=>'<div class="item"><span>'+esc(x.name)+' × '+x.quantity+'</span><b>NT$ '+(x.price*x.quantity).toLocaleString()+'</b></div>').join('');const line=['🍡 老爹．涼糕｜送到府訂單','線上訂單編號：'+o.order_number,'配送日期：'+d,'地區：'+r,'收件人：'+$('customerName').value.trim(),'電話：'+$('customerPhone').value.trim(),'地址：'+$('address').value.trim(),'付款方式：貨到付款',cut?'包餡切法：'+cut:'','訂購內容：',...a.map(x=>'・'+x.name+' × '+x.quantity),'貨到付款金額：NT$ '+Number(o.total_amount||0).toLocaleString()].filter(Boolean).join('\n');$('lineSend').href='https://line.me/R/oaMessage/%40502iugah/?'+encodeURIComponent(line);$('orderForm').style.display='none';$('result').classList.add('show');window.scrollTo({top:0,behavior:'smooth'})}catch(e){msg(e.message||'訂單送出失敗');btn.disabled=selectedItems().reduce((s,x)=>s+x.quantity,0)<2;btn.textContent='確認送到府訂單'}});init();
</script>
</body>
</html>
