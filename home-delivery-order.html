<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹．涼糕｜送到府訂購</title><style>*{box-sizing:border-box}body{margin:0;background:#fff3f7;color:#33251d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 50px}.card{background:#fff;border:1px solid #ead7df;border-radius:20px;padding:18px;margin-bottom:14px}.brand{font-size:25px;font-weight:900}.muted{color:#786d65;font-size:13px;line-height:1.6}.tag{display:inline-block;margin-top:8px;padding:7px 11px;border-radius:999px;background:#ffe0eb;color:#a62d5c;font-weight:900}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid #dccbd2;border-radius:12px;background:#fff;font:inherit}.flavor{display:grid;grid-template-columns:96px 1fr auto;gap:12px;align-items:center;border:1px solid #eadde3;border-radius:15px;padding:10px;margin:9px 0}.flavor-img{width:96px;height:96px;border-radius:12px;object-fit:cover;background:#f6edf1}.flavor-placeholder{width:96px;height:96px;border-radius:12px;background:#f6edf1;display:flex;align-items:center;justify-content:center;color:#a88d98;font-size:12px;text-align:center}.price{color:#a62d5c;font-weight:800}.qty{display:flex;align-items:center;gap:8px}.qty button{width:38px;height:38px;border:0;border-radius:10px;background:#f2e3e9;font-size:21px;font-weight:900}.qty span{min-width:25px;text-align:center;font-weight:900}.summary{background:#fff8fb;border:1px solid #ead6df;border-radius:15px;padding:14px}.row{display:flex;justify-content:space-between;padding:6px 0}.total{font-size:23px;font-weight:900;color:#a62d5c;border-top:1px solid #ead6df;margin-top:8px;padding-top:10px}.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;background:#c52f68;color:#fff;font-size:17px;font-weight:900;text-align:center;text-decoration:none;cursor:pointer}.btn:disabled{opacity:.55}.notice{margin-top:10px;padding:12px;border-radius:12px;line-height:1.6}.err{background:#fff0ef;color:#a43b35}.ok{background:#edf8f1;color:#286c47}.result{display:none}.result.show{display:block}.order-number{font-size:28px;font-weight:900;color:#a62d5c}.line-btn{background:#06c755;margin-top:14px}.item{display:flex;justify-content:space-between;border-bottom:1px dashed #ead6df;padding:8px 0}@media(max-width:560px){.flavor{grid-template-columns:80px 1fr}.flavor-img,.flavor-placeholder{width:80px;height:80px}.qty{grid-column:2;justify-content:flex-end}}.cut-choice{margin-top:8px;padding:8px 10px;border-radius:12px;background:#fff7fa;border:1px solid #f0d6e1}.cut-title{font-size:13px;font-weight:900;color:#7a304d;margin-bottom:5px}.cut-choice label{font-size:13px;margin-right:12px;cursor:pointer}.cut-choice input{accent-color:#c52f68;margin-right:4px}.cut-choice{margin-top:8px;padding:8px 10px;border-radius:12px;background:#fff7fa;border:1px solid #f0d6e1}.cut-title{font-size:13px;font-weight:900;color:#7a304d;margin-bottom:5px}.cut-choice label{font-size:13px;margin-right:12px;cursor:pointer}.cut-choice input{accent-color:#c52f68;margin-right:4px}.cut-choice{margin-top:8px;padding:8px 10px;border-radius:12px;background:#fff7fa;border:1px solid #f0d6e1}.cut-title{font-size:13px;font-weight:900;color:#7a304d;margin-bottom:5px}.cut-choice label{font-size:13px;margin-right:12px;cursor:pointer}.cut-choice input{accent-color:#c52f68;margin-right:4px}.cut-choice{margin-top:8px;padding:8px 10px;border-radius:12px;background:#fff7fa;border:1px solid #f0d6e1}.cut-title{font-size:13px;font-weight:900;color:#7a304d;margin-bottom:5px}.cut-choice label{font-size:13px;margin-right:12px;cursor:pointer}.cut-choice input{accent-color:#c52f68;margin-right:4px}.cut-choice{margin-top:8px;padding:8px 10px;border-radius:12px;background:#fff7fa;border:1px solid #f0d6e1}.cut-title{font-size:13px;font-weight:900;color:#7a304d;margin-bottom:5px}.cut-choice label{font-size:13px;margin-right:12px;cursor:pointer}.cut-choice input{accent-color:#c52f68;margin-right:4px}</style></head><body><main class="wrap"><div class="card"><div class="brand">🏠 老爹．涼糕｜送到府訂購</div><div class="muted">選口味、數量，填寫基本資料即可下單。付款方式：貨到付款。最低訂購 2 盒，可混搭不同口味。</div><span class="tag">🏠 送到府｜貨到付款</span></div><div id="closed" class="card" style="display:none"></div><form id="orderForm"><div class="card"><h2>① 選擇配送日期</h2><div class="field"><label>日期 *</label><select id="deliveryDate" required><option value="">請選擇開放日期</option></select></div></div><div class="card"><h2>② 選擇送到府地區</h2><div class="field"><label>地區 *</label><select id="region" required><option value="">請先選擇日期</option></select></div></div><div class="card"><h2>③ 點選口味與數量</h2><div id="flavors"></div><div id="flavorEmpty" class="muted" style="display:none">這一天尚未開放口味。</div></div><div class="card"><h2>④ 填寫送達資料</h2><div class="field"><label>收件人姓名 *</label><input id="customerName" required maxlength="80"></div><div class="field"><label>手機 *</label><input id="customerPhone" required maxlength="30" inputmode="tel"></div><div class="field"><label>送達地址 *</label><textarea id="address" required rows="3" maxlength="300"></textarea></div><div class="field"><label>備註</label><textarea id="notes" rows="3" maxlength="500"></textarea></div></div><div class="card"><h2>⑤ 確認訂單</h2><div class="summary"><div class="row"><span>涼糕總數</span><b id="totalQty">0 盒</b></div><div class="row"><span>涼糕小計</span><b>NT$ <span id="grandTotal">0</span></b></div><div class="row"><span>付款方式</span><b>貨到付款</b></div></div><div id="minimumNotice" class="notice err">最低訂購 2 盒，目前 0 盒。</div><button id="submitBtn" class="btn" type="submit" style="margin-top:14px" disabled>確認送到府訂單</button><div id="msg"></div></div></form><section id="result" class="card result"><h2>✅ 訂單已送出</h2><p>線上訂單編號：</p><div id="resultOrder" class="order-number"></div><div id="resultItems"></div><div class="summary" style="margin-top:14px"><div class="row"><span>配送日期</span><b id="resultDate"></b></div><div class="row"><span>配送地區</span><b id="resultRegion"></b></div><div class="row"><span>收件人</span><b id="resultName"></b></div><div class="row"><span>電話</span><b id="resultPhone"></b></div><div class="row"><span>地址</span><b id="resultAddress"></b></div><div class="row"><span>付款方式</span><b>貨到付款</b></div><div class="row total"><span>貨到付款金額</span><span>NT$ <span id="resultTotal"></span></span></div></div><a id="lineSend" class="btn line-btn" href="#">📲 傳送訂單至官方 LINE</a><div class="notice ok">按下後會直接開啟老爹．涼糕官方 LINE，訂單內容會先放入輸入框，客人確認後自己按「發送」。</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);let flavors=[];const PHOTO_FALLBACK={1:'https://yemzdwxtyosuaczsqwea.supabase.co/storage/v1/object/public/product-images/a2d35d0b-19ea-4939-8c4d-d972e81451e0/b2de551e-b006-4390-8980-4be3cf140a46.jpeg',2:'https://yemzdwxtyosuaczsqwea.supabase.co/storage/v1/object/public/product-images/a2d35d0b-19ea-4939-8c4d-d972e81451e0/33a99043-ddb9-4497-b4ab-15aaf7494086.png',3:'https://laodielianggao.tw/product-pudding.jpg',4:'https://laodielianggao.tw/product-brown-sugar-taro.jpg',5:'https://laodielianggao.tw/product-fruit.jpg',6:'https://laodielianggao.tw/product-grass-jelly.jpg',7:'https://laodielianggao.tw/product-almond-taro.jpg',8:'https://laodielianggao.tw/product-almond.jpg',9:'https://yemzdwxtyosuaczsqwea.supabase.co/storage/v1/object/public/product-images/a2d35d0b-19ea-4939-8c4d-d972e81451e0/ce844c36-d0eb-4d5c-9311-0ce379d4443c.jpeg',10:'https://yemzdwxtyosuaczsqwea.supabase.co/storage/v1/object/public/product-images/a2d35d0b-19ea-4939-8c4d-d972e81451e0/5ba9b324-31f5-47f8-9a4e-c191067b1b57.jpeg',11:'https://yemzdwxtyosuaczsqwea.supabase.co/storage/v1/object/public/product-images/a2d35d0b-19ea-4939-8c4d-d972e81451e0/18565bd1-b age/v1/object/public/product-images/flavors/1790615856089-xpfwloq0.png'};function showMsg(t){$('msg').innerHTML='<div class="notice err">'+String(t||'訂單送出失敗，請稍後再試。')+'</div>'}function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'})}async function init(){const r=await sb.from('daily_order_settings').select('order_date').eq('ordering_enabled',true).gte('order_date',today()).order('order_date').limit(31);if(r.error){showMsg('開放日期讀取失敗：'+r.error.message);return}$('deliveryDate').innerHTML='<option value="">請選擇開放日期</option>'+(r.data||[]).map(x=>'<option value="'+x.order_date+'">'+x.order_date+'</option>').join('');if(!r.data?.length){$('closed').style.display='block';$('closed').textContent='目前尚未開放送到府訂購。';$('orderForm').style.display='none'}}async function loadDate(){const d=$('deliveryDate').value;if(!d)return;$('region').innerHTML='<option value="">讀取中…</option>';const [rs,fs]=await Promise.all([sb.from('daily_order_regions').select('region_name').eq('order_date',d).eq('enabled',true).order('id'),sb.from('daily_order_flavors').select('flavor_id,product_name,flavor_name,price').eq('order_date',d).eq('enabled',true).order('id')]);if(rs.error||fs.error){showMsg('當日資料讀取失敗。');return}$('region').innerHTML='<option value="">請選擇送到府地區</option>'+(rs.data||[]).map(x=>'<option>'+x.region_name+'</option>').join('');const ids=(fs.data||[]).map(x=>x.flavor_id).filter(Boolean);let photos={};if(ids.length){const pr=await sb.from('flavors').select('id,image_url').in('id',ids);if(!pr.error)(pr.data||[]).forEach(x=>{photos[x.id]=x.image_url||''})}flavors=(fs.data||[]).map(f=>({...f,image_url:photos[f.flavor_id]||PHOTO_FALLBACK[Number(f.flavor_id)]||''}));$('flavors').innerHTML=flavors.map((f,i)=>'<div class="flavor">'+(f.image_url?'<img class="flavor-img" src="'+f.image_url+'" alt="'+f.flavor_name+'" loading="eager" onerror="this.onerror=null;this.src=PHOTO_FALLBACK['+Number(f.flavor_id)+']||\'\';if(!this.src){this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'}">':'<div class="flavor-placeholder">尚未設定照片</div>')+(f.image_url?'<div class="flavor-placeholder" style="display:none">照片載入失敗</div>':'')+'<div><b>'+f.product_name+'／'+f.flavor_name+'</b><div class="price">NT$ '+Number(f.price).toLocaleString()+'</div></div><div class="qty"><button type="button" onclick="changeQty('+i+',-1)">−</button><span id="q'+i+'">0</span><button type="button" onclick="changeQty('+i+',1)">＋</button></div></div>').join('');$('flavorEmpty').style.display=flavors.length?'none':'block';updateTotals()}function changeQty(i,n){const e=$('q'+i);e.textContent=Math.max(0,Math.min(99,Number(e.textContent)+n));updateTotals()}function selectedItems(){return flavors.map((f,i)=>({flavor_id:Number(f.flavor_id),quantity:Number($('q'+i).textContent),name:f.flavor_name,price:Number(f.price)})).filter(x=>x.quantity>0)}function updateTotals(){const a=selectedItems(),qty=a.reduce((s,x)=>s+x.quantity,0);$('totalQty').textContent=qty+' 盒';$('grandTotal').textContent=a.reduce((s,x)=>s+x.price*x.quantity,0).toLocaleString();$('submitBtn').disabled=qty<2;$('minimumNotice').textContent=qty<2?'最低訂購 2 盒，目前 '+qty+' 盒。':'已達最低訂購數量：'+qty+' 盒。';$('minimumNotice').className='notice '+(qty<2?'err':'ok')}$('deliveryDate').addEventListener('change',loadDate);$('orderForm').addEventListener('submit',async function(e){e.preventDefault();const btn=$('submitBtn');btn.disabled=true;btn.textContent='送出中…';$('msg').innerHTML='';try{const d=$('deliveryDate').value,region=$('region').value,a=selectedItems(),qty=a.reduce((s,x)=>s+x.quantity,0);if(!d)throw new Error('請選擇配送日期');if(!region)throw new Error('請選擇送到府地區');if(qty<2)throw new Error('最低訂購 2 盒，請再選購 1 盒後送出訂單。');const payload={p_delivery_date:d,p_delivery_region:region,p_pickup_type:'home_delivery',p_pickup_store:$('address').value.trim(),p_customer_name:$('customerName').value.trim(),p_customer_phone:$('customerPhone').value.trim(),p_customer_note:$('notes').value.trim()||null,p_items:a.map(x=>({flavor_id:x.flavor_id,quantity:x.quantity}))};const r=await sb.rpc('create_customer_order',payload);if(r.error)throw new Error(r.error.message||r.error.details||'訂單建立失敗');const o=Array.isArray(r.data)?r.data[0]:r.data;if(!o||!o.order_number)throw new Error('訂單已建立但沒有取得線上訂單編號');$('resultOrder').textContent=o.order_number;$('resultDate').textContent=d;$('resultRegion').textContent=region;$('resultName').textContent=$('customerName').value.trim();$('resultPhone').textContent=$('customerPhone').value.trim();$('resultAddress').textContent=$('address').value.trim();$('resultTotal').textContent=Number(o.total_amount||0).toLocaleString();$('resultItems').innerHTML=a.map(x=>'<div class="item"><span>'+x.name+' × '+x.quantity+'</span><b>NT$ '+(x.price*x.quantity).toLocaleString()+'</b></div>').join('');const msg=['🍡 老爹．涼糕｜送到府訂單','線上訂單編號：'+o.order_number,'配送日期：'+d,'地區：'+region,'收件人：'+$('customerName').value.trim(),'電話：'+$('customerPhone').value.trim(),'地址：'+$('address').value.trim(),'付款方式：貨到付款','訂購內容：'].concat(a.map(x=>'・'+x.name+' × '+x.quantity),'貨到付款金額：NT$ '+Number(o.total_amount||0).toLocaleString()).join('\n');$('lineSend').href='https://line.me/R/oaMessage/%40502iugah/?'+encodeURIComponent(msg);$('orderForm').style.display='none';$('result').classList.add('show');window.scrollTo({top:0,behavior:'smooth'})}catch(err){showMsg(err.message);btn.disabled=selectedItems().reduce((s,x)=>s+x.quantity,0)<2;btn.textContent='確認送到府訂單'}});init();</script><script id="filled-cut-option-fix">
(()=>{
  function addCutChoices(){
    const root=document.getElementById('flavors');
    if(!root) return;
    [...root.querySelectorAll('.flavor')].forEach((card,i)=>{
      if(card.querySelector('.cut-choice')) return;
      const priceEl=card.querySelector('.price');
      if(!priceEl) return;
      const price=Number((priceEl.textContent||'').replace(/[^0-9.]/g,''));
      if(price<150) return;
      const info=[...card.children].find(x=>x.querySelector&&x.querySelector('.price'));
      if(!info) return;
      const box=document.createElement('div');
      box.className='cut-choice';
      box.innerHTML='<div class="cut-title">包餡切法</div><label><input type="radio" name="cut-option-'+i+'" value="不切" checked>不切</label><label><input type="radio" name="cut-option-'+i+'" value="切">切</label>';
      info.appendChild(box);
    });
  }
  const root=document.getElementById('flavors');
  if(root) new MutationObserver(addCutChoices).observe(root,{childList:true,subtree:true});
  addCutChoices();
  const form=document.getElementById('orderForm');
  if(form && !form.dataset.cutBound){
    form.dataset.cutBound='1';
    form.addEventListener('submit',()=>{
      const notes=document.getElementById('notes');
      if(!notes) return;
      const choices=[...document.querySelectorAll('#flavors .flavor')].map((card,i)=>{
        const q=card.querySelector('.qty span');
        const qty=Number(q?.textContent||0);
        if(qty<=0 || !card.querySelector('.cut-choice')) return null;
        const name=card.querySelector('b')?.textContent?.trim()||'包餡口味';
        const cut=card.querySelector('input[type="radio"]:checked')?.value||'不切';
        return name+' × '+qty+'：'+cut;
      }).filter(Boolean);
      const base=notes.value.replace(/\n?\[包餡切法\][\s\S]*$/,'').trim();
      notes.value=[base,choices.length?'[包餡切法] '+choices.join('；'):''].filter(Boolean).join('\n');
    },{capture:true});
  }
})();
</script></body></html>
