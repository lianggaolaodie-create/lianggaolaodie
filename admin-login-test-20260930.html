<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>老爹．涼糕｜後台登入測試</title><style>body{margin:0;background:#f7f3ef;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:#30241d}.box{max-width:520px;margin:60px auto;padding:24px;background:#fff;border:1px solid #e4dad3;border-radius:16px}.brand{font-size:24px;font-weight:900;margin-bottom:24px}.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;border:1px solid #ddd2ca;border-radius:10px;padding:13px;font-size:17px}.btn{border:0;border-radius:10px;padding:12px 18px;background:#8d5939;color:#fff;font-weight:900;font-size:16px}.msg{margin-top:14px;padding:12px;border-radius:10px;background:#fff0ef;color:#a43b35;white-space:pre-wrap}.ok{background:#edf8f1;color:#286c47}</style></head><body><div class="box"><div class="brand">🍡 老爹．涼糕｜後台登入測試</div><form id="f"><div class="field"><label>Email</label><input id="e" type="email" autocomplete="username" required></div><div class="field"><label>密碼</label><input id="p" type="password" autocomplete="current-password" required></div><button id="b" class="btn" type="submit">登入</button></form><div id="m"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const f=document.getElementById('f'),e=document.getElementById('e'),p=document.getElementById('p'),b=document.getElementById('b'),m=document.getElementById('m');function msg(t,ok=false){m.className='msg '+(ok?'ok':'');m.textContent=t}f.addEventListener('submit',async x=>{x.preventDefault();b.disabled=true;b.textContent='登入中…';m.textContent='';try{const r=await db.auth.signInWithPassword({email:e.value.trim(),password:p.value});if(r.error){msg('Supabase 登入失敗：'+r.error.message);return}const u=r.data.user;const q=await db.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',u.id).maybeSingle();if(q.error){msg('登入成功，但管理員權限查詢失敗：'+q.error.message);return}if(!q.data){msg('登入成功，但找不到 admin_profiles。user_id：'+u.id);return}if(!q.data.enabled){msg('登入成功，但管理員帳號目前未啟用。');return}msg('登入成功！管理員：'+u.email+'\n角色：'+q.data.role+'\n即將進入原後台…',true);setTimeout(()=>location.href='/admin-orders-fixed.html?v=20260930-TEST',700)}catch(err){msg('程式錯誤：'+(err&&err.message?err.message:String(err)))}finally{b.disabled=false;b.textContent='登入'}})</script></body></html>
