<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>老爹．涼糕｜社群管理</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f4f0;color:#30251f;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e5ddd5;border-radius:18px;padding:18px;margin-bottom:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-size:22px;font-weight:950}.muted{color:#81766e;font-size:13px;line-height:1.6}.field{margin:12px 0}.field label{display:block;font-weight:900;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #d8cec5;border-radius:10px;font:inherit}.field textarea{min-height:120px}.btn{border:0;border-radius:10px;padding:10px 14px;background:#2f78c9;color:#fff;font-weight:900;text-decoration:none;cursor:pointer}.gray{background:#756b65}.msg{padding:11px;border-radius:10px;background:#edf8f1;color:#286c47;margin-top:10px}.err{background:#fff0ef;color:#a43b35}.hide{display:none!important}.login{max-width:520px;padding-top:60px}.login .btn{margin-top:8px}</style>
</head><body>
<div id="login" class="wrap login"><div class="card"><div class="brand">📣 老爹．涼糕｜社群管理</div><p class="muted">管理 IG、Facebook、TikTok 與 TikTok 直播連結。</p><form id="loginForm"><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn" class="btn" type="submit">登入社群管理</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="wrap hide"><div class="card top"><div><div class="brand">📣 社群連結管理</div><div id="who" class="muted"></div></div><div><a class="btn gray" href="admin-dashboard.html">返回後台</a> <button id="logout" class="btn gray">登出</button></div></div><div class="card"><div class="field"><label>Instagram 連結</label><input id="instagram_url" type="url"></div><div class="field"><label>Facebook 連結</label><input id="facebook_url" type="url"></div><div class="field"><label>TikTok 連結</label><input id="tiktok_url" type="url"></div><div class="field"><label>TikTok 直播連結</label><input id="tiktok_live_url" type="url"></div><div class="field"><label>其他社群說明</label><textarea id="content"></textarea></div><div class="field"><label><input id="enabled" type="checkbox"> 啟用社群連結</label></div><button id="save" class="btn">儲存並發布</button><div id="msg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(()=>{'use strict';const db=window.supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);
async function load(){const r=await db.from('site_admin_content').select('*').eq('section_id','social').maybeSingle();if(r.error){$('msg').className='msg err';$('msg').textContent='讀取失敗：'+r.error.message;return}const d=r.data?.data||{};['instagram_url','facebook_url','tiktok_url','tiktok_live_url','content'].forEach(k=>$(k).value=d[k]||'');$('enabled').checked=!!d.enabled}
async function access(user){const r=await db.from('admin_profiles').select('role,enabled').eq('user_id',user.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'此帳號已停用';if(r.data.role!=='super_admin')return'沒有後台管理權限';return null}
async function enter(user){if(!user)return;const er=await access(user);if(er){await db.auth.signOut();$('loginMsg').className='msg err';$('loginMsg').textContent='登入失敗：'+er;return}$('login').classList.add('hide');$('app').classList.remove('hide');$('who').textContent=user.email||'';await load()}
$('loginForm').onsubmit=async e=>{e.preventDefault();const b=$('loginBtn');b.disabled=true;b.textContent='登入中…';try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;await enter(r.data.user)}catch(e){$('loginMsg').className='msg err';$('loginMsg').textContent='登入失敗：'+(e.message||e)}finally{b.disabled=false;b.textContent='登入社群管理'}};
$('save').onclick=async()=>{const data={instagram_url:$('instagram_url').value.trim(),facebook_url:$('facebook_url').value.trim(),tiktok_url:$('tiktok_url').value.trim(),tiktok_live_url:$('tiktok_live_url').value.trim(),content:$('content').value,enabled:$('enabled').checked};const r=await db.from('site_admin_content').upsert({section_id:'social',data,updated_at:new Date().toISOString()},{onConflict:'section_id'});$('msg').className=r.error?'msg err':'msg';$('msg').textContent=r.error?'儲存失敗：'+r.error.message:'✅ 已儲存並發布'};
$('logout').onclick=async()=>{await db.auth.signOut();location.href='admin-dashboard.html'};db.auth.getSession().then(r=>{if(r.data.session)enter(r.data.session.user)});
})();</script></body></html>
