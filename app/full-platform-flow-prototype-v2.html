<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹．涼糕｜完整流程原型 V2</title><style>
:root{--bg:#f4f0e8;--ink:#211d17;--gold:#a98548;--line:#e5ddcf;--muted:#7d7569}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}header{background:#211d17;color:white;padding:20px max(16px,calc((100% - 1080px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{font-weight:900;letter-spacing:2px;font-size:21px}.tabs{display:flex;gap:7px;flex-wrap:wrap}button{cursor:pointer;border:1px solid var(--gold);background:white;color:var(--ink);border-radius:10px;padding:9px 12px;font-weight:700}.tabs button{border-radius:99px;background:transparent;color:white}.tabs button.on,.primary{background:var(--gold);color:white}.wrap{max-width:1080px;margin:22px auto;padding:0 14px}.warning{background:#fff8e9;border:1px solid #e4d2ae;border-radius:12px;padding:12px;font-size:13px;color:#68512c;margin-bottom:16px}.shell{display:grid;grid-template-columns:210px 1fr;gap:15px}.menu,.content,.box{background:white;border:1px solid var(--line);border-radius:15px}.menu{padding:12px;height:max-content}.menu button{display:block;width:100%;text-align:left;border:0;margin:3px 0;background:transparent}.menu button.on{background:#f3ecdf;color:#755526}.content{padding:21px;min-height:600px}.kicker{font-size:11px;color:var(--gold);font-weight:900;letter-spacing:2px}.h{font-size:25px;font-weight:900;margin:5px 0}.muted{font-size:13px;color:var(--muted)}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.box{padding:15px;margin:10px 0}.box h3{margin:0 0 8px}.field{margin:10px 0}label{display:block;font-size:12px;color:var(--muted);font-weight:700}input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;margin-top:5px;font:inherit}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.primary{border:1px solid var(--gold)}.tag{display:inline-block;background:#f2ecdf;border-radius:30px;padding:4px 9px;font-size:11px;margin:2px}.step{display:flex;gap:5px;flex-wrap:wrap;margin:14px 0}.step span{padding:7px 10px;border-radius:30px;background:#f2eee7;font-size:12px}.step .active{background:#332b20;color:#fff}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.table{width:100%;border-collapse:collapse;font-size:13px}.table td,.table th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-size:11px}.hidden{display:none}.notice{padding:10px;background:#f7f3ec;border-radius:9px;font-size:13px}.price{font-weight:900;color:#805e2c}.foot{font-size:11px;color:var(--muted);margin-top:18px}@media(max-width:700px){.shell{grid-template-columns:1fr}.menu{display:flex;overflow:auto;gap:4px}.menu button{white-space:nowrap;width:auto}.cols{grid-template-columns:1fr}.content{padding:15px}.h{font-size:21px}}
</style></head><body><header><div><div class="brand">老爹．涼糕</div><small>完整流程原型 V2｜結帳・訂單・商品・付款・物流</small></div><div class="tabs"><button id="cTab" class="on" onclick="mode('c')">顧客流程</button><button id="aTab" onclick="mode('a')">老闆操作</button></div></header><main class="wrap"><div class="warning">測試原型／模擬資料。沒有連接正式資料庫、不會建立真實訂單、不會上傳付款證明，也不會更改正式官網。正式運費、付款方式與銀行資料均留待確認。</div>
<section id="customer"><div class="shell"><aside class="menu" id="cmenu"><button class="on" onclick="cp('cart',this)">① 購物車</button><button onclick="cp('delivery',this)">② 配送方式</button><button onclick="cp('contact',this)">③ 收件資料</button><button onclick="cp('payment',this)">④ 付款方式</button><button onclick="cp('confirm',this)">⑤ 訂單確認</button><button onclick="cp('track',this)">⑥ 訂單追蹤</button></aside><article class="content" id="ccontent"></article></div></section>
<section id="admin" class="hidden"><div class="shell"><aside class="menu" id="amenu"><button class="on" onclick="ap('detail',this)">訂單詳情</button><button onclick="ap('verify',this)">付款核對</button><button onclick="ap('ship',this)">物流出貨</button><button onclick="ap('edit',this)">商品編輯</button><button onclick="ap('settings',this)">費率與開單設定</button></aside><article class="content" id="acontent"></article></div></section><div class="foot">本原型僅驗證操作順序與畫面欄位；實際資料驗證、權限、金額計算與狀態更新必須由安全後端執行。</div></main>
<script>
let delivery='涼糕送到府',pay='銀行轉帳',step=0;const $=x=>document.getElementById(x);
function mode(m){$('customer').classList.toggle('hidden',m!=='c');$('admin').classList.toggle('hidden',m!=='a');$('cTab').classList.toggle('on',m==='c');$('aTab').classList.toggle('on',m==='a');if(m==='c')cp('cart');else ap('detail')}
function cp(p,b){document.querySelectorAll('#cmenu button').forEach(x=>x.classList.remove('on'));if(b)b.classList.add('on');else [...$('cmenu').children].find(x=>x.getAttribute('onclick').includes("'"+p+"'"))?.classList.add('on');
const common='<div class="kicker">CUSTOMER CHECKOUT</div><div class="step"><span class="'+(p==='cart'?'active':'')+'">購物車</span><span class="'+(p==='delivery'?'active':'')+'">配送</span><span class="'+(p==='contact'?'active':'')+'">收件</span><span class="'+(p==='payment'?'active':'')+'">付款</span><span class="'+(p==='confirm'?'active':'')+'">確認</span></div>';
let v={
cart:common+'<div class="h">購物車</div><p class="muted">示意商品；正式商品、規格、售價及庫存以後端即時驗證為準。</p><div class="box"><div class="row"><b>水果綜合涼糕</b><b class="price">NT$ 100</b></div><p class="muted">示意數量：1 盒</p><label>數量</label><input type="number" min="1" value="1"></div><div class="row"><span>商品小計（示意）</span><b>NT$ 100</b></div><button class="primary" onclick="cp(\'delivery\')">下一步：選配送</button>',
delivery:common+'<div class="h">選擇配送方式</div><p class="muted">涼糕與蘿蔔糕配送路線分開；依商品類型顯示可用選項。</p><div class="box"><label><input type="radio" name="d" checked onchange="delivery=\'涼糕送到府\'"> 涼糕送到府</label><p class="muted">需符合開放配送地區與配送時段。</p><label><input type="radio" name="d" onchange="delivery=\'涼糕超商冷藏寄放\'"> 涼糕超商冷藏寄放</label><p class="muted">這是冷藏寄放，不是冷藏宅配。</p><label><input type="radio" name="d" onchange="delivery=\'蘿蔔糕冷凍店到店\'"> 蘿蔔糕冷凍店到店</label><label><input type="radio" name="d" onchange="delivery=\'蘿蔔糕冷凍宅配\'"> 蘿蔔糕冷凍宅配</label></div><div class="notice">運費及寄放費由正式後端設定計算，畫面不自行套用舊價格。</div><button class="primary" onclick="cp(\'contact\')">下一步：填寫資料</button>',
contact:common+'<div class="h">收件人資料</div><div class="field"><label>收件人姓名</label><input placeholder="請輸入真實收件人姓名"></div><div class="field"><label>聯絡電話</label><input placeholder="手機號碼"></div><div id="addr"><div class="field"><label>配送地址／門市資訊</label><textarea rows="3" placeholder="依配送方式填寫完整地址或縣市＋門市名稱"></textarea></div></div><div class="field"><label>訂單備註（選填）</label><textarea rows="2" placeholder="其他需求"></textarea></div><button class="primary" onclick="cp(\'payment\')">下一步：付款方式</button>',
payment:common+'<div class="h">付款方式</div><div class="box"><label><input type="radio" name="pay" checked onchange="pay=\'銀行轉帳\'"> 銀行轉帳（待正式帳戶設定）</label><label><input type="radio" name="pay" onchange="pay=\'貨到付款\'"> 貨到付款（僅適用已開放的物流）</label><label><input type="radio" name="pay" onchange="pay=\'其他付款\'"> 其他付款方式（依正式設定）</label></div><div class="notice">不會在此展示未核實銀行帳號。付款證明需綁定訂單並限制檔案格式、大小及存取權。</div><button class="primary" onclick="cp(\'confirm\')">下一步：確認訂單</button>',
confirm:common+'<div class="h">確認訂單</div><div class="box"><div class="row"><span>配送方式</span><b>'+delivery+'</b></div><div class="row"><span>付款方式</span><b>'+pay+'</b></div><div class="row"><span>商品小計（示意）</span><b>NT$ 100</b></div><div class="row"><span>運費</span><b>由後端計算</b></div><hr><div class="row"><b>總計</b><b>待後端核算</b></div></div><div class="notice">送出前正式系統會再次檢查開單狀態、價格、庫存、配送區域、運費及重複送單。</div><button class="primary" onclick="alert(\'原型測試：未建立真實訂單。正式版需由伺服器產生訂單編號。\')">送出訂單（模擬）</button>',
track:'<div class="kicker">ORDER TRACKING</div><div class="h">訂單追蹤</div><label>訂單編號</label><input placeholder="輸入訂單編號"><label>訪客驗證碼／本人驗證</label><input placeholder="正式版採短效驗證，不只憑訂單號查個資"><button class="primary" onclick="alert(\'示意查詢：正式版需驗證本人身份\')">查詢訂單</button><div class="box"><b>訂單狀態示意</b><div class="step"><span class="active">已成立</span><span>待付款</span><span>已核款</span><span>已出貨</span><span>已完成</span></div><p class="muted">付款、訂單處理、物流狀態分開追蹤，不以通知送出當作已付款。</p></div>'
};$('ccontent').innerHTML=v[p]||v.cart}
function ap(p,b){document.querySelectorAll('#amenu button').forEach(x=>x.classList.remove('on'));if(b)b.classList.add('on');else [...$('amenu').children].find(x=>x.getAttribute('onclick').includes("'"+p+"'"))?.classList.add('on');
let v={
detail:'<div class="kicker">ORDER MANAGEMENT</div><div class="h">訂單詳情</div><p class="muted">測試訂單：DEMO-20261108-001</p><div class="step"><span class="active">已成立</span><span>待付款</span><span>待處理</span><span>待出貨</span><span>完成</span></div><div class="cols"><div class="box"><h3>顧客與訂單</h3><p>訂單類型：涼糕超商冷藏寄放</p><p>商品：水果綜合涼糕 × 2</p><p>收件資料：測試資料，不含真實個資</p></div><div class="box"><h3>金額摘要</h3><p>商品小計：依訂單快照</p><p>寄放費：依當時設定快照</p><b>總額：由後端訂單金額提供</b></div></div><div class="notice">不得直接修改歷史商品價格或運費快照；狀態異動須記錄操作者、時間與原因。</div>',
verify:'<div class="kicker">PAYMENT REVIEW</div><div class="h">付款核對</div><div class="box"><p>訂單：DEMO-20261108-001</p><p>目前狀態：待核款</p><label>核對結果</label><select><option>請選擇</option><option>確認入帳</option><option>資料不符／退件</option><option>需補件</option></select><label>核對備註</label><textarea rows="3" placeholder="輸入核對原因，正式版必填異動理由"></textarea><div class="btns"><button class="primary" onclick="alert(\'模擬核款：正式版必須由具權限管理員執行並留存稽核紀錄\')">確認核款（示意）</button></div></div><p class="muted">只有可信金流回呼或授權管理員核實入帳後，才能標記已付款。</p>',
ship:'<div class="kicker">FULFILLMENT</div><div class="h">物流與出貨</div><label>物流類型</label><select><option>涼糕冷藏寄放</option><option>涼糕送到府</option><option>蘿蔔糕冷凍店到店</option><option>蘿蔔糕冷凍宅配</option></select><label>物流單號／門市資訊</label><input placeholder="輸入託運單號或門市資訊"><label>物流狀態</label><select><option>待出貨</option><option>已出貨</option><option>配送中</option><option>已送達</option><option>配送異常</option></select><label>異動原因</label><textarea rows="2" placeholder="物流狀態異動備註"></textarea><button class="primary" onclick="alert(\'示意：正式版寫入前會檢查管理權限並保留歷程\')">更新物流（示意）</button>',
edit:'<div class="kicker">PRODUCT CATALOG</div><div class="h">商品編輯</div><label>商品分類</label><select><option>涼糕</option><option>蘿蔔糕</option></select><label>商品名稱</label><input placeholder="商品名稱"><label>口味／規格</label><input placeholder="口味、夾心、雙層或重量規格"><div class="cols"><div><label>售價</label><input type="number" placeholder="價格"></div><div><label>庫存</label><input type="number" placeholder="庫存數量"></div></div><label>上架狀態</label><select><option>草稿</option><option>上架</option><option>停售</option><option>售完</option></select><button class="primary" onclick="alert(\'原型未儲存資料；正式版需同步官網與 App 並記錄異動\')">儲存商品（示意）</button>',
settings:'<div class="kicker">CONFIGURATION</div><div class="h">費率與開單設定</div><p class="muted">正式費率必須以已簽約物流價格及老闆確認為準，歷史訂單保留原費率快照。</p><label>配送方式</label><select><option>涼糕冷藏寄放</option><option>涼糕送到府</option><option>蘿蔔糕冷凍店到店</option><option>蘿蔔糕冷凍宅配</option></select><label>費率（由老闆確認後設定）</label><input type="number" placeholder="尚未確認，不預填"><label>開單狀態</label><select><option>關閉</option><option>開放</option></select><label>生效日期</label><input type="date"><button class="primary" onclick="alert(\'示意：正式版需二次確認並記錄操作者\')">儲存設定（示意）</button>'
};$('acontent').innerHTML=v[p]||v.detail}
cp('cart');
</script></body></html>
