<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹．涼糕｜訂單管理原型</title>
<style>
:root{--ink:#191919;--gold:#c6a15a;--bg:#f5f3ee;--line:#e8e3d9;--muted:#777;--green:#28734e;--red:#ad5148}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
header{background:#191919;color:white;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;position:sticky;top:0;z-index:4}.brand{font-weight:800;letter-spacing:2px}.brand b{color:var(--gold)}header small{color:#bbb}
main{max-width:1400px;margin:auto;padding:25px}.head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}h1{font-size:25px;margin:0}h2{font-size:18px;margin:0 0 12px}.muted{color:var(--muted);font-size:13px}
.notice{margin:14px 0;padding:12px 14px;border-radius:10px;background:#f7efdf;border:1px solid #eadcbf;font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:15px 0}.stat,.panel{background:white;border:1px solid var(--line);border-radius:12px;padding:16px}.num{font-size:25px;font-weight:800;margin-top:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}input,select{font:inherit;padding:10px;border:1px solid var(--line);border-radius:8px;background:white;max-width:100%}button{font:inherit;cursor:pointer}.primary{background:#191919;color:#f3d99e;border:0;border-radius:8px;padding:9px 13px}.secondary{background:white;border:1px solid var(--line);border-radius:8px;padding:8px 11px}.danger{color:var(--red)}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px;text-align:left;border-bottom:1px solid #eee;white-space:nowrap}th{background:#faf9f6;color:#777}.tag{display:inline-block;border-radius:20px;padding:3px 8px;background:#eee8dc;color:#70552a;font-size:12px}.tag.green{background:#e6f2ea;color:var(--green)}.tag.red{background:#fae9e7;color:var(--red)}.link{color:#86672e;text-decoration:underline;cursor:pointer;background:none;border:0;padding:0}
#detail{display:none;margin-top:16px}.detailgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #eee}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.small{font-size:12px;color:var(--muted)}
@media(max-width:800px){main{padding:15px}.stats{grid-template-columns:repeat(2,1fr)}.detailgrid{grid-template-columns:1fr}h1{font-size:22px}}
</style></head><body>
<header><div class="brand">老爹<b>．</b>涼糕 <small>ORDER CONSOLE</small></div><small>互動原型｜合成訂單｜未連接正式資料</small></header>
<main>
<div class="head"><div><h1>訂單管理</h1><div class="muted">線上訂購與現場訂單集中處理</div></div><button class="secondary" id="reset">重設示意資料</button></div>
<div class="notice">付款審核僅示範「已提交付款證明」的訂單；出貨前必須確認付款。已付款訂單須先完成退款，才可取消。所有操作僅在此頁暫存，重新整理會還原。</div>
<div class="stats">
<div class="stat"><div class="muted">全部訂單</div><div class="num" id="total">4</div></div>
<div class="stat"><div class="muted">待審核付款</div><div class="num" id="pending">2</div></div>
<div class="stat"><div class="muted">備貨處理中</div><div class="num" id="preparing">1</div></div>
<div class="stat"><div class="muted">待出貨</div><div class="num" id="ready">1</div></div>
</div>
<div class="filters">
<input id="search" placeholder="搜尋訂單編號／顧客">
<select id="source"><option value="">全部來源</option><option value="online">線上訂單</option><option value="walk_in">現場訂單</option></select>
<select id="product"><option value="">全部商品</option><option value="lianggao">涼糕</option><option value="radish_cake">蘿蔔糕</option></select>
<select id="payment"><option value="">全部付款狀態</option><option value="unpaid">待付款</option><option value="proof_submitted">待審核</option><option value="confirmed">已確認</option><option value="rejected">未通過</option><option value="refunded">已退款</option></select>
<select id="fulfillment"><option value="">全部備貨狀態</option><option value="unprepared">未備貨</option><option value="preparing">備貨中</option><option value="prepared">已備妥</option><option value="ready_to_ship">待出貨</option><option value="shipped">已出貨</option><option value="delivered">已送達</option><option value="cancelled">已取消</option></select>
</div>
<div class="tablewrap"><table><thead><tr><th>訂單編號</th><th>顧客</th><th>來源</th><th>商品</th><th>配送／取貨</th><th>金額</th><th>付款</th><th>備貨／出貨</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div>
<section id="detail" class="panel"><div class="head"><h2 id="detailTitle">訂單明細</h2><button class="secondary" id="close">關閉</button></div><div class="detailgrid"><div><div class="kv"><span>訂單編號</span><b id="dId"></b></div><div class="kv"><span>顧客</span><b id="dCustomer"></b></div><div class="kv"><span>訂單來源</span><b id="dSource"></b></div><div class="kv"><span>商品明細</span><b id="dItems"></b></div></div><div><div class="kv"><span>付款狀態</span><b id="dPayment"></b></div><div class="kv"><span>備貨／出貨</span><b id="dFulfillment"></b></div><div class="kv"><span>金額</span><b id="dTotal"></b></div><div class="kv"><span>版本</span><b id="dVersion"></b></div></div></div><div class="actions" id="actions"></div><p class="small" id="hint"></p></section>
<p class="small" style="margin-top:15px">Phase 63 介面原型。正式版仍需串接登入權限、訂單 API、付款查證、退款流程、庫存與物流資料。</p>
</main>
<script>
const seed=[
{id:'LD20261108021',customer:'陳小姐',source:'online',product:'lianggao',fulfillmentType:'cold_store_pickup',items:'水果綜合涼糕 × 2',total:200,payment:'proof_submitted',fulfillment:'unprepared',version:1},
{id:'LD20261108020',customer:'林先生',source:'online',product:'lianggao',fulfillmentType:'frozen_store_to_store',items:'布丁芋頭涼糕 × 3',total:450,payment:'proof_submitted',fulfillment:'preparing',version:1},
{id:'LD20261108019',customer:'王小姐',source:'walk_in',product:'radish_cake',fulfillmentType:'food_truck',items:'純米蘿蔔糕 × 1',total:180,payment:'confirmed',fulfillment:'ready_to_ship',version:1},
{id:'LD20261108018',customer:'張先生',source:'walk_in',product:'lianggao',fulfillmentType:'stall',items:'純杏仁涼糕 × 1',total:100,payment:'confirmed',fulfillment:'prepared',version:1}
];let orders=structuredClone(seed),selected=null;
const payName={unpaid:'待付款',proof_submitted:'待審核',confirmed:'已確認',rejected:'未通過',refunded:'已退款'};
const fullName={unprepared:'未備貨',preparing:'備貨中',prepared:'已備妥',ready_to_ship:'待出貨',shipped:'已出貨',delivered:'已送達',cancelled:'已取消'};
const sourceName={online:'線上訂單',walk_in:'現場訂單'};
const typeName={cold_store_pickup:'超商冷藏寄放',frozen_store_to_store:'冷凍店到店',food_truck:'餐車取貨',stall:'擺攤現場'};
function tag(v,red=false,green=false){return '<span class="tag '+(red?'red':green?'green':'')+'">'+v+'</span>'}
function updateStats(){document.querySelector('#total').textContent=orders.length;document.querySelector('#pending').textContent=orders.filter(o=>o.payment==='proof_submitted').length;document.querySelector('#preparing').textContent=orders.filter(o=>['preparing','prepared'].includes(o.fulfillment)).length;document.querySelector('#ready').textContent=orders.filter(o=>o.fulfillment==='ready_to_ship').length}
function render(){const q=document.querySelector('#search').value.trim(),src=document.querySelector('#source').value,prod=document.querySelector('#product').value,pay=document.querySelector('#payment').value,ful=document.querySelector('#fulfillment').value;
const rows=orders.filter(o=>(!q||(o.id+o.customer).includes(q))&&(!src||o.source===src)&&(!prod||o.product===prod)&&(!pay||o.payment===pay)&&(!ful||o.fulfillment===ful));
document.querySelector('#rows').innerHTML=rows.map(o=>'<tr><td><b>'+o.id+'</b></td><td>'+o.customer+'</td><td>'+sourceName[o.source]+'</td><td>'+(o.product==='lianggao'?'涼糕':'蘿蔔糕')+'</td><td>'+typeName[o.fulfillmentType]+'</td><td>$'+o.total+'</td><td>'+tag(payName[o.payment],o.payment==='proof_submitted'||o.payment==='rejected',o.payment==='confirmed')+'</td><td>'+tag(fullName[o.fulfillment],o.fulfillment==='cancelled',o.fulfillment==='delivered')+'</td><td><button class="link" data-open="'+o.id+'">查看／處理</button></td></tr>').join('')||'<tr><td colspan="9">沒有符合條件的訂單</td></tr>';
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openDetail(b.dataset.open));updateStats();}
function openDetail(id){selected=orders.find(o=>o.id===id);if(!selected)return;const o=selected;document.querySelector('#detail').style.display='block';document.querySelector('#detailTitle').textContent='訂單處理｜'+o.id;document.querySelector('#dId').textContent=o.id;document.querySelector('#dCustomer').textContent=o.customer;document.querySelector('#dSource').textContent=sourceName[o.source];document.querySelector('#dItems').textContent=o.items;document.querySelector('#dPayment').textContent=payName[o.payment];document.querySelector('#dFulfillment').textContent=fullName[o.fulfillment];document.querySelector('#dTotal').textContent='$'+o.total;document.querySelector('#dVersion').textContent=o.version;
const a=document.querySelector('#actions');a.innerHTML='';
if(o.payment==='proof_submitted'){addButton(a,'確認付款',()=>{o.payment='confirmed';if(o.fulfillment==='unprepared')o.fulfillment='preparing';o.version++;openDetail(o.id);render();});addButton(a,'退回付款證明',()=>{o.payment='rejected';o.version++;openDetail(o.id);render();});}
const next={unprepared:['preparing'],preparing:['prepared'],prepared:['ready_to_ship'],ready_to_ship:['shipped'],shipped:['delivered']};
(next[o.fulfillment]||[]).forEach(n=>addButton(a,'更新：'+fullName[n],()=>{if(n==='shipped'&&o.payment!=='confirmed'){alert('尚未確認付款，不能出貨');return;}o.fulfillment=n;o.version++;openDetail(o.id);render();}));
if(o.payment==='confirmed'&&o.fulfillment!=='cancelled')addButton(a,'標記已退款（示意）',()=>{if(!confirm('確認此訂單已在金流端完成退款？此按鈕僅作示意。'))return;o.payment='refunded';o.version++;openDetail(o.id);render();});
if(!['shipped','delivered','cancelled'].includes(o.fulfillment)&&o.payment!=='confirmed')addButton(a,'取消訂單',()=>{if(!confirm('確定取消此訂單？'))return;o.fulfillment='cancelled';o.version++;openDetail(o.id);render();},true);
document.querySelector('#hint').textContent='操作僅修改本頁合成資料。正式版：付款由金流查證，退款須確認實際退款結果；已付款訂單必須先退款才能取消。';document.querySelector('#detail').scrollIntoView({behavior:'smooth',block:'start'});}
function addButton(parent,label,fn,danger=false){const b=document.createElement('button');b.className=danger?'secondary danger':'primary';b.textContent=label;b.onclick=fn;parent.appendChild(b);}
document.querySelectorAll('.filters input,.filters select').forEach(x=>x.addEventListener('input',render));
document.querySelector('#close').onclick=()=>document.querySelector('#detail').style.display='none';
document.querySelector('#reset').onclick=()=>{orders=structuredClone(seed);document.querySelector('#detail').style.display='none';render();};
render();
</script></body></html>
