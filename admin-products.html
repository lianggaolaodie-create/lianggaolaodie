<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹．涼糕｜商品／口味管理</title><style>*{box-sizing:border-box}body{margin:0;background:#faf8f4;color:#30251f;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}.top,.card{background:#fff;border:1px solid #e5ddd5;border-radius:22px;padding:20px;margin-bottom:14px}.brand{font-size:25px;font-weight:900}.muted{color:#81766e;font-size:13px}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.nav button{white-space:nowrap;border:0;border-radius:12px;padding:12px 16px;background:#e9e2dc;font-weight:900}.nav button.active{background:#a9633d;color:#fff}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:11px 0}.field label{display:block;font-weight:900;margin-bottom:6px}.field input,.field select{width:100%;padding:11px;border:1px solid #d8cec5;border-radius:11px;font:inherit}.btn{border:0;border-radius:12px;padding:11px 15px;background:#a9633d;color:#fff;font-weight:900;cursor:pointer}.btn.gray{background:#756b65}.btn.red{background:#b42f2c}.btn.green{background:#357653}.row{border:1px solid #e5ddd5;border-radius:15px;padding:14px;margin:9px 0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.grow{flex:1}.badge{display:inline-block;border-radius:99px;padding:4px 9px;font-size:12px;font-weight:900;background:#edf7ef;color:#2e704b}.badge.off{background:#f7e8e6;color:#a43a35}.notice{padding:11px;border-radius:11px;margin-top:10px;background:#edf8f1;color:#286c47}.err{background:#fff0ef;color:#a43b35}.page.hidden{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><div id="login" class="wrap"><div class="card"><div class="brand">🍡 老爹．涼糕</div><p class="muted">商品、口味與每日線上訂購開放管理</p><form id="loginForm"><div class="field"><label>管理員 Email</label><input id="email" type="email" required></div><div class="field"><label>密碼</label><input id="password" type="password" required></div><button class="btn">登入</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="wrap" style="display:none"><div class="top"><div class="brand">🍡 老爹．涼糕｜商品／口味管理</div><div id="who" class="muted"></div></div><div class="nav"><button class="active" data-page="products">📦 商品／口味</button><button data-page="daily">📅 每日開放</button></div>
<section id="products" class="page"><div class="card"><div class="toolbar"><h2>商品／口味管理</h2><div><button class="btn" id="newBtn">＋新增口味</button><button class="btn gray" id="reloadBtn">重新整理</button></div></div><p class="muted">這裡的口味就是線上下單使用的商品資料；名稱、價格、啟用狀態會成為每日開放設定的基礎。</p><div id="msg"></div><div id="productList"></div></div></section>
<section id="daily" class="page hidden"><div class="card"><div class="toolbar"><h2>每日線上訂購開放</h2><button class="btn" id="saveDaily">儲存今日設定</button></div><div class="grid"><div class="field"><label>日期</label><input id="date" type="date"></div><div class="field"><label>今日線上訂購</label><select id="ordering"><option value="true">開放</option><option value="false">關閉</option></select></div></div><div id="dailyMsg"></div></div><div class="card"><h3>當日開放地區</h3><button class="btn gray" id="addRegion">＋新增地區</button><div id="regions"></div></div><div class="card"><h3>當日開放口味</h3><p class="muted">口味從「商品／口味」自動帶入。只需要在這裡決定今天是否開放及今日價格。</p><div id="dailyFlavors"></div></div></section>
<div class="card"><button class="btn gray" id="logout">登出</button></div></div>
<div id="modal" style="display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px"><div class="card" style="width:min(600px,100%);max-height:90vh;overflow:auto"><div class="toolbar"><h2 id="modalTitle">新增口味</h2><button class="btn gray" id="close">關閉</button></div><div class="field"><label>口味名稱</label><input id="name" required></div><div class="field"><label>價格</label><input id="price" type="number" min="0" required></div><div class="field"><label>口味介紹</label><input id="desc"></div><div class="field"><label>照片網址</label><input id="image" type="url"></div><div class="field"><label><input id="enabled" type="checkbox" checked> 商品啟用</label></div><button class="btn" id="save">儲存</button><div id="editMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=x=>document.getElementById(x);let products=[],daily=[],regions=[],editing=null;const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function note(id,t,e=false){$(id).innerHTML=t?'<div class="notice '+(e?'err':'')+'">'+esc(t)+'</div>':''}
async function access(u){const r=await db.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',u.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'此帳號已停用';if(!(r.data.role==='super_admin'||r.data.can_manage_products||r.data.role==='order_admin'||r.data.role==='personal_data_admin'))return'沒有管理權限';return null}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const er=await access(r.data.user);if(er){await db.auth.signOut();throw Error(er)}open(r.data.user)}catch(x){note('loginMsg','登入失敗：'+x.message,true)}};function open(u){$('login').style.display='none';$('app').style.display='block';$('who').textContent='已登入 · '+u.email;$('date').value=today();loadProducts();loadDaily()}
async function loadProducts(){const r=await db.from('flavors').select('*').order('id');if(r.error)return note('msg','讀取商品失敗：'+r.error.message,true);products=r.data||[];renderProducts();renderDailyFlavors()}
function renderProducts(){$('productList').innerHTML=products.length?products.map((p,i)=>'<div class="row"><div class="grow"><b>'+esc(p.name)+'</b><br>價格：NT$ '+Number(p.price||0).toLocaleString()+'　<span class="badge '+(p.enabled?'':'off')+'">'+(p.enabled?'啟用':'停用')+'</span></div><button class="btn" onclick="editProduct('+i+')">編輯</button><button class="btn red" onclick="deleteProduct('+i+')">刪除</button></div>').join(''):'<div class="muted">目前沒有口味。</div>'}
function editProduct(i){editing=i;const p=products[i]||{};$('modalTitle').textContent=i==null?'新增口味':'編輯口味';$('name').value=p.name||'';$('price').value=p.price||0;$('desc').value=p.description||'';$('image').value=p.image_url||'';$('enabled').checked=p.enabled!==false;$('modal').style.display='flex'}window.editProduct=editProduct;$('newBtn').onclick=()=>{editing=null;editProduct(null)};$('close').onclick=()=>{$('modal').style.display='none'};
$('save').onclick=async()=>{const name=$('name').value.trim();if(!name)return note('editMsg','請輸入口味名稱',true);const payload={name,price:Number($('price').value||0),description:$('desc').value.trim()||null,image_url:$('image').value.trim()||null,enabled:$('enabled').checked};let r=editing==null?await db.from('flavors').insert(payload):await db.from('flavors').update(payload).eq('id',products[editing].id);if(r.error)return note('editMsg','儲存失敗：'+r.error.message,true);$('modal').style.display='none';await loadProducts()};window.deleteProduct=async i=>{if(!confirm('確定刪除「'+products[i].name+'」？'))return;const r=await db.from('flavors').delete().eq('id',products[i].id);if(r.error)return note('msg','刪除失敗：'+r.error.message,true);loadProducts()};$('reloadBtn').onclick=loadProducts;
async function loadDaily(){const d=$('date').value||today();const [s,r,f]=await Promise.all([db.from('daily_order_settings').select('*').eq('order_date',d).maybeSingle(),db.from('daily_order_regions').select('*').eq('order_date',d).order('id'),db.from('daily_order_flavors').select('*').eq('order_date',d).order('id')]);if(s.error||r.error||f.error)return note('dailyMsg','讀取每日設定失敗',true);$('ordering').value=s.data?.ordering_enabled===false?'false':'true';regions=r.data||[];daily=f.data||[];renderRegions();renderDailyFlavors()}
$('date').onchange=loadDaily;function renderRegions(){$('regions').innerHTML=regions.map((r,i)=>'<div class="row"><div class="grow"><b>'+esc(r.region_name)+'</b> <span class="badge '+(r.enabled?'':'off')+'">'+(r.enabled?'開放':'關閉')+'</span></div><button class="btn '+(r.enabled?'red':'green')+'" onclick="regions['+i+'].enabled=!regions['+i+'].enabled;renderRegions()">'+(r.enabled?'關閉':'開放')+'</button></div>').join('')||'<div class="muted">尚未新增地區。</div>'}window.addRegion=()=>{};$('addRegion').onclick=()=>{const n=prompt('輸入地區名稱');if(n?.trim()){regions.push({region_name:n.trim(),enabled:true});renderRegions()}};
function renderDailyFlavors(){const byId=new Map(daily.map(x=>[String(x.flavor_id),x]));$('dailyFlavors').innerHTML=products.filter(p=>p.enabled).map(p=>{const d=byId.get(String(p.id));const on=d?d.enabled:false;const price=d?d.price:p.price;return '<div class="row"><div class="grow"><b>'+esc(p.name)+'</b><br>商品價格 NT$ '+Number(p.price||0).toLocaleString()+'　<span class="badge '+(on?'':'off')+'">'+(on?'今日開放':'今日未開放')+'</span></div><div style="width:110px"><input type="number" min="0" value="'+Number(price||0)+'" onchange="setDailyPrice('+p.id+',this.value)"></div><button class="btn '+(on?'red':'green')+'" onclick="toggleDaily('+p.id+')">'+(on?'關閉':'開放')+'</button></div>'}).join('')||'<div class="muted">沒有啟用中的商品口味。</div>'}
window.setDailyPrice=(id,v)=>{let d=daily.find(x=>Number(x.flavor_id)===Number(id));if(!d){d={flavor_id:id,order_date:$('date').value,enabled:true,price:Number(v||0),flavor_name:products.find(p=>p.id===id).name};daily.push(d)}else d.price=Number(v||0);renderDailyFlavors()};window.toggleDaily=id=>{let d=daily.find(x=>Number(x.flavor_id)===Number(id));const p=products.find(x=>x.id===id);if(!d){d={flavor_id:id,order_date:$('date').value,enabled:true,price:Number(p.price||0),flavor_name:p.name};daily.push(d)}else d.enabled=!d.enabled;renderDailyFlavors()};
$('saveDaily').onclick=async()=>{const d=$('date').value||today();let r=await db.from('daily_order_settings').upsert({order_date:d,ordering_enabled:$('ordering').value==='true',updated_at:new Date().toISOString()},{onConflict:'order_date'});if(r.error)return note('dailyMsg','儲存失敗：'+r.error.message,true);await db.from('daily_order_regions').delete().eq('order_date',d);await db.from('daily_order_flavors').delete().eq('order_date',d);const rr=regions.map(x=>({order_date:d,region_name:x.region_name,enabled:x.enabled}));const ff=daily.filter(x=>x.enabled).map(x=>({order_date:d,flavor_id:x.flavor_id,flavor_name:x.flavor_name,price:Number(x.price||0),enabled:true,quantity:0}));if(rr.length){r=await db.from('daily_order_regions').insert(rr);if(r.error)return note('dailyMsg','地區儲存失敗：'+r.error.message,true)}if(ff.length){r=await db.from('daily_order_flavors').insert(ff);if(r.error)return note('dailyMsg','口味儲存失敗：'+r.error.message,true)}note('dailyMsg','已儲存 '+d+'；線上下單會直接使用這裡開放的口味與今日價格。');await loadDaily()};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(b.dataset.page).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.page==='daily')loadDaily();if(b.dataset.page==='products')loadProducts()});(async()=>{const s=await db.auth.getSession();if(s.data.session){const er=await access(s.data.session.user);if(!er)open(s.data.session.user)}})();
</script></body></html>
