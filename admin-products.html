<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>老爹．涼糕｜商品管理後台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.shell{max-width:1180px;margin:auto;padding:16px}.top{background:#fff;border:1px solid #e7ddd5;border-radius:18px;padding:18px;margin-bottom:14px}.brand{font-size:22px;font-weight:900}.muted{color:#766b64;font-size:13px}.nav{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.nav button{white-space:nowrap;border:0;border-radius:11px;padding:11px 15px;background:#ebe4de;color:#5a4940;font-weight:800}.nav button.active{background:#8d5939;color:#fff}.card{background:#fff;border:1px solid #e7ddd5;border-radius:18px;padding:18px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid #e7ddd5;border-radius:14px;padding:15px}.stat b{display:block;font-size:26px;margin-top:5px}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.toolbar h2{margin:0}.btn{border:0;border-radius:10px;padding:10px 14px;background:#8d5939;color:#fff;font-weight:800;cursor:pointer}.btn.gray{background:#6d625b}.btn.red{background:#a63d36}.btn.green{background:#357653}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:11px;border:1px solid #d9cec6;border-radius:10px;background:#fff;font:inherit}.field textarea{min-height:95px;resize:vertical}.product{display:grid;grid-template-columns:86px 1fr auto;gap:13px;align-items:center;border:1px solid #e8ded7;border-radius:14px;padding:12px;margin-top:10px}.thumb{width:86px;height:86px;border-radius:11px;object-fit:cover;background:#eee6df}.noimg{display:flex;align-items:center;justify-content:center;color:#988b82;font-size:12px;text-align:center}.product h3{margin:0 0 5px}.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-size:12px;background:#eee7e1;margin:2px 4px 2px 0}.on{background:#e7f5ec;color:#2d714c}.off{background:#f6e9e7;color:#a13c35}.actions{display:flex;gap:7px;flex-wrap:wrap}.right{text-align:right}.notice{padding:10px;border-radius:10px;margin-top:10px}.ok{background:#edf8f1;color:#286c47}.err{background:#fff0ef;color:#a43b35}.modal{position:fixed;inset:0;background:rgba(30,22,18,.48);display:flex;align-items:center;justify-content:center;padding:14px;z-index:10}.modalbox{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:18px;padding:18px}.hidden{display:none!important}.order{border:1px solid #e8ded7;border-radius:14px;padding:13px;margin-top:10px}.orderhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800}.login{max-width:520px;margin:60px auto}.file{font-size:13px}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.product{grid-template-columns:68px 1fr}.thumb{width:68px;height:68px}.right{grid-column:2;text-align:left}}
</style>
</head>
<body>
<div id="loginView" class="shell login"><div class="card"><div class="brand">🛍️ 老爹．涼糕｜商品管理後台</div><p class="muted">請使用有「商品管理」權限的管理員帳號登入。</p><form id="loginForm"><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="loginBtn">登入</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="shell hidden">
<div class="top"><div class="brand">🛍️ 老爹．涼糕｜商品管理後台</div><div id="userText" class="muted"></div></div>
<div class="nav"><button class="active" data-page="overview">📊 總覽</button><button data-page="products">🛍️ 商品管理</button><button data-page="categories">🏷️ 商品分類</button><button data-page="orders">📋 訂單管理</button></div>
<section id="overview" class="page"><div class="card"><div class="toolbar"><h2>商品總覽</h2><button class="btn" onclick="showPage('products');openNew()">＋新增商品</button></div><div class="stats" style="margin-top:12px"><div class="stat">商品總數<b id="statProducts">0</b></div><div class="stat">上架商品<b id="statEnabled">0</b></div><div class="stat">庫存總數<b id="statStock">0</b></div><div class="stat">商品訂單<b id="statOrders">0</b></div></div></div></section>
<section id="products" class="page hidden"><div class="card"><div class="toolbar"><h2>商品管理</h2><button class="btn" onclick="openNew()">＋新增商品</button></div><div id="productMsg"></div><div id="productList"></div></div></section>
<section id="categories" class="page hidden"><div class="card"><div class="toolbar"><h2>商品分類</h2></div><div class="grid"><div class="field"><label>新增分類</label><input id="catName" placeholder="例如：衣服、帽子、外套、毛巾、其他"></div><div class="field" style="display:flex;align-items:end"><button class="btn" onclick="addCategory()">新增分類</button></div></div><div id="catMsg"></div><div id="catList"></div></div></section>
<section id="orders" class="page hidden"><div class="card"><div class="toolbar"><h2>周邊商品訂單</h2><button class="btn gray" onclick="loadOrders()">重新整理</button></div><div class="muted" style="margin-top:5px">此處只管理商品／周邊訂單，不與涼糕訂單混合。</div><div id="orderMsg"></div><div id="orderList"></div></div></section>
<div class="card"><button class="btn gray" onclick="loadAll()">重新整理</button> <button class="btn gray" onclick="logout()">登出</button></div>
</div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="toolbar"><h2 id="modalTitle">新增商品</h2><button class="btn gray" onclick="closeModal()">關閉</button></div><div class="grid"><div class="field"><label>商品名稱</label><input id="pName"></div><div class="field"><label>商品分類</label><select id="pCategory"><option value="">未分類</option></select></div><div class="field"><label>價格</label><input id="pPrice" type="number" min="0" step="1"></div><div class="field"><label>庫存數量</label><input id="pStock" type="number" min="0" step="1"></div></div><div class="field"><label>商品介紹</label><textarea id="pDescription"></textarea></div><div class="field"><label>商品圖片</label><input id="pImage" type="url" placeholder="圖片網址（可留空）"><input id="pFile" class="file" type="file" accept="image/*"><img id="preview" style="display:none;max-width:180px;max-height:180px;border-radius:12px;margin-top:8px"></div><div class="field"><label><input id="pEnabled" type="checkbox" checked> 商品上架</label></div><button class="btn" id="saveBtn" onclick="saveProduct()">儲存商品</button><div id="editMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://yemzdwxtyosuaczsqwea.supabase.co';
const SUPABASE_KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
let products=[],categories=[],editingId=null,uploadUrl=null;
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(id,text,error=false){$(id).innerHTML='<div class="notice '+(error?'err':'ok')+'">'+esc(text)+'</div>'}
function showPage(page){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));$(page).classList.remove('hidden');document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.page===page));if(page==='products')loadProducts();if(page==='categories')loadCategories();if(page==='orders')loadOrders()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>showPage(b.dataset.page));
async function access(user){const r=await sb.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',user.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'管理員帳號目前已停用';if(r.data.role!=='super_admin'&&!r.data.can_manage_products)return'此帳號沒有商品管理權限';return null}
async function login(){const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const e=await access(r.data.user);if(e){await sb.auth.signOut();throw new Error(e)}openApp(r.data.user)}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;try{await login()}catch(x){msg('loginMsg','登入失敗：'+x.message,true)}finally{$('loginBtn').disabled=false}};
function openApp(user){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('userText').textContent='已登入 · '+user.email;loadAll()}
async function loadCategories(){const r=await sb.from('merch_categories').select('id,name,enabled,created_at').order('id');if(r.error)return msg('catMsg','讀取分類失敗：'+r.error.message,true);categories=r.data||[];renderCategories();$('pCategory').innerHTML='<option value="">未分類</option>'+categories.filter(c=>c.enabled).map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')}
function renderCategories(){$('catList').innerHTML=categories.map(c=>'<div class="product"><div></div><div><h3>'+esc(c.name)+'</h3><span class="badge '+(c.enabled?'on':'off')+'">'+(c.enabled?'啟用':'停用')+'</span></div><div class="right"><button class="btn '+(c.enabled?'red':'green')+'" onclick="toggleCategory('+c.id+','+(!c.enabled)+')">'+(c.enabled?'停用':'啟用')+'</button></div></div>').join('')||'<div class="muted">目前沒有分類。</div>'}
async function addCategory(){const name=$('catName').value.trim();if(!name)return msg('catMsg','請輸入分類名稱。',true);const r=await sb.from('merch_categories').insert({name,enabled:true});if(r.error)return msg('catMsg','新增失敗：'+r.error.message,true);$('catName').value='';await loadCategories()}
async function toggleCategory(id,enabled){const r=await sb.from('merch_categories').update({enabled}).eq('id',id);if(r.error)return msg('catMsg','更新失敗：'+r.error.message,true);await loadCategories();await loadProducts()}
async function loadProducts(){const r=await sb.from('merch_products').select('id,category_id,name,description,price,stock_quantity,image_url,enabled,created_at,updated_at').order('id',{ascending:false});if(r.error)return msg('productMsg','商品讀取失敗：'+r.error.message,true);products=r.data||[];renderProducts();$('statProducts').textContent=products.length;$('statEnabled').textContent=products.filter(p=>p.enabled).length;$('statStock').textContent=products.reduce((a,p)=>a+Number(p.stock_quantity||0),0)}
function renderProducts(){$('productList').innerHTML=products.map(p=>{const c=categories.find(x=>x.id===p.category_id);const image=p.image_url?'<img class="thumb" src="'+esc(p.image_url)+'" alt="">':'<div class="thumb noimg">尚無圖片</div>';return '<div class="product">'+image+'<div><h3>'+esc(p.name)+'</h3><span class="badge">'+esc(c?.name||'未分類')+'</span><span class="badge '+(p.enabled?'on':'off')+'">'+(p.enabled?'上架中':'已下架')+'</span><div><b>NT$ '+Number(p.price||0).toLocaleString()+'</b>　庫存：<b>'+Number(p.stock_quantity||0)+'</b></div><div class="muted">'+esc(p.description||'')+'</div></div><div class="right"><div class="actions"><button class="btn" onclick="editProduct('+p.id+')">編輯</button><button class="btn '+(p.enabled?'red':'green')+'" onclick="toggleProduct('+p.id+','+(!p.enabled)+')">'+(p.enabled?'下架':'上架')+'</button><button class="btn red" onclick="deleteProduct('+p.id+')">刪除</button></div></div></div>'}).join('')||'<div class="muted">目前沒有商品。</div>'}
function openNew(){editingId=null;uploadUrl=null;$('modalTitle').textContent='新增商品';$('pName').value='';$('pCategory').value='';$('pPrice').value='0';$('pStock').value='0';$('pDescription').value='';$('pImage').value='';$('pFile').value='';$('pEnabled').checked=true;$('preview').style.display='none';$('editMsg').innerHTML='';$('modal').classList.remove('hidden')}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;editingId=id;uploadUrl=p.image_url||null;$('modalTitle').textContent='編輯商品';$('pName').value=p.name||'';$('pCategory').value=p.category_id||'';$('pPrice').value=p.price||0;$('pStock').value=p.stock_quantity||0;$('pDescription').value=p.description||'';$('pImage').value=p.image_url||'';$('pFile').value='';$('pEnabled').checked=!!p.enabled;if(p.image_url){$('preview').src=p.image_url;$('preview').style.display='block'}else $('preview').style.display='none';$('editMsg').innerHTML='';$('modal').classList.remove('hidden')}
function closeModal(){$('modal').classList.add('hidden')}
$('pFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);$('preview').src=u;$('preview').style.display='block'};
async function uploadImage(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path='products/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const r=await sb.storage.from('merch-images').upload(path,file,{upsert:false,contentType:file.type});if(r.error)throw r.error;return sb.storage.from('merch-images').getPublicUrl(path).data.publicUrl}
async function saveProduct(){const name=$('pName').value.trim();if(!name)return msg('editMsg','請輸入商品名稱。',true);$('saveBtn').disabled=true;try{let image=$('pImage').value.trim()||null;if($('pFile').files[0])image=await uploadImage($('pFile').files[0]);const payload={category_id:$('pCategory').value?Number($('pCategory').value):null,name,description:$('pDescription').value.trim()||null,price:Number($('pPrice').value||0),stock_quantity:Number($('pStock').value||0),image_url:image,enabled:$('pEnabled').checked,updated_at:new Date().toISOString()};const r=editingId?await sb.from('merch_products').update(payload).eq('id',editingId):await sb.from('merch_products').insert(payload);if(r.error)throw r.error;closeModal();await loadProducts();msg('productMsg',editingId?'商品已更新。':'商品已新增。')}catch(x){msg('editMsg','儲存失敗：'+x.message,true)}finally{$('saveBtn').disabled=false}}
async function toggleProduct(id,enabled){const r=await sb.from('merch_products').update({enabled,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return msg('productMsg','更新失敗：'+r.error.message,true);await loadProducts()}
async function deleteProduct(id){if(!confirm('確定要刪除此商品嗎？'))return;const r=await sb.from('merch_products').delete().eq('id',id);if(r.error)return msg('productMsg','刪除失敗：'+r.error.message,true);await loadProducts();msg('productMsg','商品已刪除。')}
async function loadOrders(){const r=await sb.from('merch_orders').select('id,order_number,customer_name,customer_phone,product_total,total_amount,status,payment_status,shipment_status,delivery_method,delivery_store,recipient_name,recipient_phone,remittance_last5,created_at').order('created_at',{ascending:false}).limit(100);if(r.error)return msg('orderMsg','訂單讀取失敗：'+r.error.message,true);const arr=r.data||[];$('statOrders').textContent=arr.length;$('orderList').innerHTML=arr.map(o=>'<div class="order"><div class="orderhead"><span>'+esc(o.order_number)+'</span><span>NT$ '+Number(o.total_amount||0).toLocaleString()+'</span></div><div style="margin-top:6px">客戶：'+esc(o.customer_name||'')+'　'+esc(o.customer_phone||'')+'</div><div class="muted">付款：'+esc(o.payment_status||'')+'　出貨：'+esc(o.shipment_status||'')+'　訂單：'+esc(o.status||'')+'</div><div class="muted">配送：'+esc(o.delivery_method||'')+' '+esc(o.delivery_store||o.delivery_address||'')+'</div><div class="muted">下單：'+new Date(o.created_at).toLocaleString('zh-TW')+'</div></div>').join('')||'<div class="muted">目前沒有商品訂單。</div>'}
async function loadAll(){await loadCategories();await loadProducts();await loadOrders()}
async function logout(){await sb.auth.signOut();location.reload()}
(async()=>{const s=await sb.auth.getSession();if(s.data.session){const e=await access(s.data.session.user);if(!e)openApp(s.data.session.user);else await sb.auth.signOut()}})();
</script>
</body></html>
