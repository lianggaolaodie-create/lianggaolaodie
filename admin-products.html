<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>老爹．涼糕｜商品管理後台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#faf8f4;color:#30251f;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 60px}.top{background:#fff;border:1px solid #e5ddd5;border-radius:26px;padding:24px 22px;margin-bottom:16px}.brand{font-size:28px;font-weight:900}.sub{margin-top:6px;color:#81766e;font-size:14px}.card{background:#fff;border:1px solid #e5ddd5;border-radius:26px;padding:24px 22px;margin:16px 0}.title{font-size:27px;font-weight:900;margin:0}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.product{border:1px solid #e4dbd3;border-radius:25px;padding:20px;margin-top:16px;background:#fff}.product h2{font-size:27px;margin:0 0 7px;font-weight:900}.meta{font-size:21px;font-weight:800;margin-bottom:13px}.status{display:inline-block;margin-left:12px}.photo{width:270px;max-width:100%;height:270px;object-fit:cover;border-radius:18px;display:block;margin:8px 0 16px}.desc{font-size:20px;line-height:1.6;color:#70665f;margin:6px 0 14px}.tags{font-size:18px;color:#746960;margin:6px 0 14px}.actions{display:flex;gap:14px;flex-wrap:wrap}.btn{border:0;border-radius:18px;padding:14px 24px;font-size:19px;font-weight:900;color:#fff;background:#a9633d;cursor:pointer}.btn.red{background:#b42f2c}.btn.gray{background:#756b65}.badge{font-size:16px;padding:5px 10px;border-radius:999px;background:#e8f5ed;color:#2f724d;font-weight:900}.badge.off{background:#f7e8e6;color:#a13a34}.login{max-width:520px;margin:60px auto}.field{margin:13px 0}.field label{display:block;font-weight:900;font-size:17px;margin-bottom:7px}.field input,.field textarea{width:100%;padding:13px;border:1px solid #d8cec5;border-radius:14px;font:inherit;font-size:17px}.field textarea{min-height:120px;resize:vertical}.notice{padding:12px 14px;border-radius:14px;margin-top:12px;background:#edf8f1;color:#2b6e48}.err{background:#fff0ef;color:#a63b35}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}.modalbox{width:min(650px,100%);max-height:92vh;overflow:auto;background:#fff;border-radius:24px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.small{font-size:13px;color:#81766e}@media(max-width:600px){.wrap{padding:10px 9px 50px}.top,.card{padding:21px 16px;border-radius:24px}.brand{font-size:24px}.product{padding:17px;border-radius:22px}.product h2{font-size:25px}.meta{font-size:20px}.desc{font-size:18px}.actions{gap:10px}.btn{font-size:17px;padding:13px 19px}.photo{width:100%;height:auto;max-height:340px}}
</style>
</head>
<body>
<div id="loginView" class="wrap login"><div class="card"><div class="brand">🍡 老爹．涼糕</div><div class="sub">商品管理後台</div><form id="loginForm"><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="loginBtn">登入</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="wrap hidden">
<div class="top"><div class="brand">🍡 老爹．涼糕</div><div class="sub">商品管理後台　<span id="who"></span></div></div>
<div class="card"><div class="toolbar"><h1 class="title">商品管理</h1><div class="actions"><button class="btn" id="newBtn">＋新增口味</button><button class="btn gray" id="reloadBtn">重新整理</button></div></div><div id="msg"></div><div id="list"></div></div>
<div class="card"><button class="btn gray" id="logout">登出</button></div>
</div>
<div id="modal" class="modal hidden"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle" class="title">編輯／更改口味</h2><button class="btn gray" id="closeBtn">關閉</button></div><div class="field"><label>口味名稱</label><input id="name" required></div><div class="field"><label>價格</label><input id="price" type="number" min="0" step="1" required></div><div class="field"><label>口味介紹</label><textarea id="description" placeholder="口味介紹（若資料表有此欄位才會儲存）"></textarea></div><div class="field"><label>照片網址</label><input id="image" type="url" placeholder="https://..."><div class="small">若原本商品已有照片，這裡會保留。</div></div><div class="field"><label><input id="enabled" type="checkbox" checked> 啟用</label></div><button class="btn" id="saveBtn">儲存</button><div id="editMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){'use strict';
const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);let rows=[],editing=null,busy=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function notice(t,error=false){$('msg').innerHTML=t?'<div class="notice '+(error?'err':'')+'">'+esc(t)+'</div>':''}
function editNotice(t,error=false){$('editMsg').innerHTML=t?'<div class="notice '+(error?'err':'')+'">'+esc(t)+'</div>':''}
async function access(u){const r=await db.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',u.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'此帳號目前已停用';if(r.data.role==='super_admin'||r.data.role==='order_admin'||r.data.role==='personal_data_admin'||r.data.can_manage_products)return null;return'此帳號沒有商品管理權限'}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const er=await access(r.data.user);if(er){await db.auth.signOut();throw new Error(er)}$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='· 已登入';await load()}catch(e){$('loginMsg').innerHTML='<div class="notice err">登入失敗：'+esc(e.message||e)+'</div>'}finally{$('loginBtn').disabled=false}};
async function load(){notice('讀取中…');const r=await db.from('flavors').select('*').order('id',{ascending:true});if(r.error){notice('口味讀取失敗：'+r.error.message,true);return}rows=r.data||[];render();notice('')}
function render(){if(!rows.length){$('list').innerHTML='<div class="notice">目前沒有口味資料。</div>';return}$('list').innerHTML=rows.map((p,i)=>{const image=p.image_url||p.photo_url||p.image||'';const desc=p.description||p.introduction||'';const tags=p.tags||p.category||'';return '<article class="product"><h2>'+esc(p.name||'未命名口味')+'</h2><div class="meta">價格：$'+Number(p.price||0).toLocaleString()+' <span class="status">狀態：<span class="badge '+(p.enabled?'':'off')+'">'+(p.enabled?'啟用':'停用')+'</span></span></div>'+(image?'<img class="photo" src="'+esc(image)+'" alt="'+esc(p.name||'')+'">':'')+(desc?'<div class="desc">'+esc(desc)+'</div>':'')+(tags?'<div class="tags">'+esc(tags)+' · '+(image?'已設定照片':'未設定照片')+'</div>':(image?'<div class="tags">已設定照片</div>':''))+'<div class="actions"><button class="btn" onclick="edit('+i+')">✏️ 編輯／更改口味</button><button class="btn red" onclick="removeRow('+i+')">🗑️ 刪除</button></div></article>'}).join('')}
function openModal(i){editing=i;const p=i===null?{}:rows[i];$('modalTitle').textContent=i===null?'新增口味':'編輯／更改口味';$('name').value=p.name||'';$('price').value=p.price||0;$('description').value=p.description||p.introduction||'';$('image').value=p.image_url||p.photo_url||p.image||'';$('enabled').checked=p.enabled!==false;editNotice('');$('modal').classList.remove('hidden')}
window.edit=i=>openModal(i);
$('newBtn').onclick=()=>openModal(null);$('closeBtn').onclick=()=>{$('modal').classList.add('hidden')};$('reloadBtn').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
$('saveBtn').onclick=async()=>{if(busy)return;const name=$('name').value.trim();if(!name)return editNotice('請輸入口味名稱。',true);busy=true;$('saveBtn').disabled=true;try{const payload={name,price:Number($('price').value||0),enabled:$('enabled').checked};const old=editing===null?null:rows[editing];const sample=old||rows[0]||{};if(Object.prototype.hasOwnProperty.call(sample,'description'))payload.description=$('description').value.trim()||null;if(Object.prototype.hasOwnProperty.call(sample,'introduction'))payload.introduction=$('description').value.trim()||null;if(Object.prototype.hasOwnProperty.call(sample,'image_url'))payload.image_url=$('image').value.trim()||null;if(Object.prototype.hasOwnProperty.call(sample,'photo_url'))payload.photo_url=$('image').value.trim()||null;if(Object.prototype.hasOwnProperty.call(sample,'image'))payload.image=$('image').value.trim()||null;let r;if(editing===null)r=await db.from('flavors').insert(payload);else r=await db.from('flavors').update(payload).eq('id',old.id);if(r.error)throw r.error;$('modal').classList.add('hidden');await load()}catch(e){editNotice('儲存失敗：'+(e.message||e),true)}finally{busy=false;$('saveBtn').disabled=false}};
window.removeRow=async i=>{const p=rows[i];if(!p)return;if(!confirm('確定刪除「'+(p.name||'這個口味')+'」？'))return;const r=await db.from('flavors').delete().eq('id',p.id);if(r.error){notice('刪除失敗：'+r.error.message,true);return}await load()};
(async()=>{const s=await db.auth.getSession();if(s.data.session){const er=await access(s.data.session.user);if(!er){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='· 已登入';await load()}}})();
})();
</script>
</body></html>
