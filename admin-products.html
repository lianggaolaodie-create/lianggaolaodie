<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜商品管理</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d9cdc1;border-radius:10px;font:inherit}.field textarea{min-height:80px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:10px 14px;background:#9b5c38;color:#fff;font-weight:800;cursor:pointer}.secondary{background:#eee;color:#333}.danger{background:#a32e29}.item{border:1px solid #eadfd4;border-radius:13px;padding:14px;margin:10px 0}.msg{padding:11px;border-radius:10px;background:#f6eee7;margin-top:10px}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}.small{font-size:13px;color:#75685f}.switch{display:flex;align-items:center;gap:8px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head>
<body><div class="wrap"><div class="card"><h1>📦 商品／口味管理</h1><div id="who" class="small">尚未登入</div></div><div id="login" class="card"><h2>管理員登入</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button onclick="login()">登入</button><div id="loginMsg"></div></div><main id="app" style="display:none"><div class="card"><h2 id="formTitle">➕ 新增商品</h2><div class="grid"><div class="field"><label>商品／口味名稱</label><input id="name" placeholder="例如：布丁芋頭"></div><div class="field"><label>價格</label><input id="price" type="number" min="0" step="1" placeholder="100"></div></div><div class="field"><label>商品介紹</label><textarea id="description" placeholder="商品介紹"></textarea></div><div class="field"><label>照片網址</label><input id="image" type="url" placeholder="https://..."></div><label class="switch"><input id="enabled" type="checkbox" checked> 啟用商品</label><div class="actions" style="margin-top:12px"><button onclick="save()" id="saveBtn">新增商品</button><button class="secondary" onclick="resetForm()">清除／新增下一個</button><button class="secondary" onclick="load()">重新整理</button><button class="secondary" onclick="logout()">登出</button></div><div id="formMsg"></div></div><div class="card"><h2>📋 現有商品</h2><div id="list">讀取中…</div></div></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let editId=null;function show(id,text,cls='msg'){ $(id).innerHTML='<div class="'+cls+'">'+esc(text)+'</div>'}async function login(){const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return show('loginMsg','登入失敗：'+error.message,'msg error');await open(data.user)}async function open(user){const{data:p,error}=await sb.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',user.id).maybeSingle();if(error||!p||!p.enabled||!(p.role==='super_admin'||p.can_manage_products===true)){return show('loginMsg','此帳號沒有商品管理權限。','msg error')} $('login').style.display='none';$('app').style.display='block';$('who').textContent=(user.email||'')+' · 商品管理';await load()}async function load(){const{data,error}=await sb.from('flavors').select('id,name,description,price,image_url,enabled').order('id');if(error)return show('list','讀取失敗：'+error.message,'msg error');if(!data?.length)return $('list').textContent='目前沒有商品／口味。';$('list').innerHTML=data.map(f=>`<div class="item"><strong>${esc(f.name)}</strong><div>價格：$${Number(f.price||0).toLocaleString('zh-TW')}　狀態：${f.enabled?'啟用':'關閉'}</div><div class="small">${esc(f.description||'')}${f.image_url?'　· 已設定照片':''}</div><div class="actions" style="margin-top:9px"><button onclick="edit(${f.id})">✏️ 修改</button><button class="danger" onclick="removeItem(${f.id})">🗑️ 刪除</button></div></div>`).join('')}async function save(){const name=$('name').value.trim(),price=Number($('price').value);if(!name)return show('formMsg','請輸入商品／口味名稱','msg error');if(!Number.isFinite(price)||price<0)return show('formMsg','請輸入正確價格','msg error');const payload={name,price,description:$('description').value.trim()||null,image_url:$('image').value.trim()||null,enabled:$('enabled').checked};let q;if(editId===null)q=await sb.from('flavors').insert(payload);else q=await sb.from('flavors').update(payload).eq('id',editId);if(q.error)return show('formMsg','儲存失敗：'+q.error.message,'msg error');show('formMsg',editId===null?'商品新增成功！':'商品修改成功！','msg ok');resetForm();await load()}function edit(id){sb.from('flavors').select('id,name,description,price,image_url,enabled').eq('id',id).single().then(({data,error})=>{if(error)return show('formMsg','讀取商品失敗：'+error.message,'msg error');editId=id;$('formTitle').textContent='✏️ 修改商品';$('saveBtn').textContent='儲存修改';$('name').value=data.name||'';$('price').value=data.price??'';$('description').value=data.description||'';$('image').value=data.image_url||'';$('enabled').checked=!!data.enabled;window.scrollTo({top:0,behavior:'smooth'})})}async function removeItem(id){if(!confirm('確定要刪除這個商品／口味？'))return;const{error}=await sb.from('flavors').delete().eq('id',id);if(error)return show('formMsg','刪除失敗：'+error.message,'msg error');if(editId===id)resetForm();await load()}function resetForm(){editId=null;$('formTitle').textContent='➕ 新增商品';$('saveBtn').textContent='新增商品';$('name').value='';$('price').value='';$('description').value='';$('image').value='';$('enabled').checked=true;$('formMsg').innerHTML=''}async function logout(){await sb.auth.signOut();location.reload()}(async()=>{const{data}=await sb.auth.getUser();if(data.user)open(data.user)})();</script></body></html>
