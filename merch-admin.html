<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜周邊商品管理後台</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f6eee3;color:#33251d;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}.top{height:72px;background:#432616;color:#fffaf3;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20}.brand{font-size:21px;font-weight:900}.brand small{display:block;font-size:11px;opacity:.72;font-weight:500}.logout{border:1px solid #ffffff55;background:transparent;color:#fff;padding:9px 14px;border-radius:10px}.layout{display:flex;min-height:calc(100vh - 72px)}aside{width:245px;background:#fffaf3;border-right:1px solid #e2d5c5;padding:18px 12px;flex:none}.nav{width:100%;border:0;background:transparent;text-align:left;padding:14px;border-radius:12px;font-size:16px;font-weight:800;color:#5a4638;cursor:pointer;margin-bottom:5px}.nav.active,.nav:hover{background:#ead7c0;color:#432616}.main{flex:1;padding:26px;max-width:1450px;margin:auto;width:100%}.page{display:none}.page.active{display:block}.title{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.title h1{margin:0;font-size:28px}.sub{color:#7c6a5d;font-size:13px;margin-top:5px}.btn{border:0;background:#432616;color:#fff;border-radius:11px;padding:11px 16px;font-weight:900;cursor:pointer}.btn.light{background:#fff;color:#432616;border:1px solid #d8c8b7}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.stat,.card{background:#fffaf3;border:1px solid #e4d7c8;border-radius:18px}.stat{padding:18px}.stat b{display:block;font-size:28px;margin-top:8px}.card{padding:18px;margin-bottom:18px;overflow:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.input,.select,.textarea{border:1px solid #d9c9b9;border-radius:10px;background:#fff;padding:11px 12px;font-size:15px;color:#33251d}.toolbar .input,.toolbar .select{width:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:11px 9px;border-bottom:1px solid #eadfd4;text-align:left;vertical-align:middle;font-size:14px}.table th{font-size:12px;color:#7b6858;background:#faf3eb}.thumb{width:60px;height:60px;border-radius:10px;object-fit:cover}.badge{display:inline-block;padding:5px 9px;border-radius:99px;background:#ead7c0;font-size:12px;font-weight:800}.badge.off{background:#eee;color:#777}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 9px;border-radius:8px;border:1px solid #d7c7b8;background:#fff;cursor:pointer;font-weight:700}.modal{position:fixed;inset:0;background:#33251d99;display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.modal.show{display:flex}.modalbox{background:#fffaf3;border-radius:20px;width:min(760px,100%);max-height:90vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.close{border:0;background:transparent;font-size:28px;cursor:pointer}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:13px;font-weight:900;margin-bottom:6px}.field.full{grid-column:1/-1}.preview{width:110px;height:110px;border-radius:14px;object-fit:cover;display:none;margin-top:10px}.detail{background:#f8f0e8;border-radius:13px;padding:15px;line-height:1.9}.detail hr{border:0;border-top:1px solid #dfd0c2;margin:12px 0}.empty{text-align:center;color:#887667;padding:35px}.login{position:fixed;inset:0;background:#f6eee3;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.loginbox{width:min(420px,100%);background:#fffaf3;border:1px solid #e4d7c8;border-radius:20px;padding:28px}.error{color:#a52e25;font-size:13px;margin-top:10px}.hidden{display:none!important}@media(max-width:800px){aside{width:235px}.main{padding:18px}.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{padding:0 15px}.brand{font-size:17px}.title h1{font-size:22px}}@media(max-width:560px){aside{width:220px}.nav{font-size:16px}.grid{grid-template-columns:1fr 1fr}.table{min-width:900px}}</style></head><body>
<div id="login" class="login"><div class="loginbox"><h1>🛍️ 周邊商品管理</h1><div class="sub">獨立後台｜其他後台不受影響</div><form id="loginForm"><div class="field" style="margin-top:18px"><label>Email</label><input id="loginEmail" class="input" type="email" required style="width:100%"></div><div class="field" style="margin-top:12px"><label>密碼</label><input id="loginPassword" class="input" type="password" required style="width:100%"></div><button class="btn" style="width:100%;margin-top:16px">登入後台</button><div id="loginError" class="error"></div></form></div></div>
<header class="top"><div class="brand">🛍️ 老爹・涼糕 <small>周邊商品獨立管理後台</small></div><button class="logout" onclick="signOut()">登出</button></header><div class="layout"><aside><button class="nav active" data-page="dashboard">📊　總覽</button><button class="nav" data-page="products">🛍️　商品管理</button><button class="nav" data-page="categories">🏷️　商品分類</button><button class="nav" data-page="orders">📋　訂單管理</button><button class="nav" data-page="customers">👤　客戶個資</button></aside><main class="main">
<section id="dashboard" class="page active"><div class="title"><div><h1>周邊商品總覽</h1><div class="sub">商品、訂單、客戶資料獨立管理</div></div><button class="btn" onclick="showPage('products');openProduct()">＋ 新增商品</button></div><div class="grid"><div class="stat">商品總數<b id="statProducts">0</b></div><div class="stat">目前上架<b id="statEnabled">0</b></div><div class="stat">庫存不足<b id="statLow">0</b></div><div class="stat">待處理訂單<b id="statOrders">0</b></div></div><div class="card"><h3>最近周邊訂單</h3><div id="dashOrders" class="empty">載入中…</div></div></section>
<section id="products" class="page"><div class="title"><div><h1>🛍️ 商品管理</h1><div class="sub">新增、修改、照片、價格、庫存、上架／下架、刪除</div></div><button class="btn" onclick="openProduct()">＋ 新增商品</button></div><div class="card"><div class="toolbar"><input id="productSearch" class="input" placeholder="搜尋商品名稱…" oninput="renderProducts()"><select id="productFilter" class="select" onchange="renderProducts"><option value="">全部分類</option></select><select id="productStatus" class="select" onchange="renderProducts()"><option value="">全部狀態</option><option value="on">已上架</option><option value="off">已下架</option></select></div><div id="productsTable"></div></div></section>
<section id="categories" class="page"><div class="title"><div><h1>🏷️ 商品分類</h1><div class="sub">衣服、帽子、外套、毛巾、其他周邊</div></div></div><div class="card"><div class="toolbar"><input id="categoryName" class="input" placeholder="新增分類名稱"><button class="btn" onclick="addCategory()">＋ 新增分類</button></div><div id="categoriesTable"></div></div></section>
<section id="orders" class="page"><div class="title"><div><h1>📋 訂單管理</h1><div class="sub">周邊商品訂單、客戶基本資料、配送方式、付款與出貨</div></div></div><div class="card"><div class="toolbar"><input id="orderSearch" class="input" placeholder="訂單編號／姓名／電話／Email…" oninput="renderOrders()"><select id="orderStatus" class="select" onchange="renderOrders()"><option value="">全部訂單狀態</option><option value="pending">待處理</option><option value="confirmed">已確認</option><option value="preparing">備貨中</option><option value="shipped">已出貨</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select></div><div id="ordersTable"></div></div></section>
<section id="customers" class="page"><div class="title"><div><h1>👤 客戶個資管理</h1><div class="sub">查看周邊商品訂單留下的姓名、電話、Email 與配送資料</div></div></div><div class="card"><div class="toolbar"><input id="customerSearch" class="input" placeholder="搜尋姓名／電話／Email…" oninput="renderCustomers()"></div><div id="customersTable"></div></div></section>
</main></div>
<div id="productModal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="productModalTitle">新增商品</h2><button class="close" onclick="closeProduct()">×</button></div><form id="productForm"><input type="hidden" id="productId"><div class="formgrid"><div class="field"><label>商品名稱 *</label><input id="pName" class="input" required style="width:100%"></div><div class="field"><label>商品分類</label><select id="pCategory" class="select" style="width:100%"></select></div><div class="field full"><label>商品介紹</label><textarea id="pDescription" class="textarea" style="width:100%"></textarea></div><div class="field"><label>商品價格 *</label><input id="pPrice" class="input" type="number" min="0" required style="width:100%"></div><div class="field"><label>庫存數量 *</label><input id="pStock" class="input" type="number" min="0" required style="width:100%"></div><div class="field full"><label>商品照片</label><input id="pImage" class="input" type="file" accept="image/*" style="width:100%"><img id="pPreview" class="preview"><input id="pImageUrl" type="hidden"></div><div class="field full"><label><input id="pEnabled" type="checkbox"> 立即上架</label></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button type="button" class="btn light" onclick="closeProduct()">取消</button><button class="btn">儲存商品</button></div><div id="productError" class="error"></div></form></div></div>
<div id="customerModal" class="modal"><div class="modalbox"><div class="modalhead"><h2>👤 客戶／配送完整資料</h2><button class="close" onclick="closeCustomer()">×</button></div><div id="customerDetail" class="detail"></div></div></div>
<script>
const SUPABASE_URL='https://yemzdwxtyosuaczsqwea.supabase.co',SUPABASE_KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let products=[],categories=[],orders=[],items=[];const $=id=>document.getElementById(id),statusText={pending:'待處理',confirmed:'已確認',preparing:'備貨中',shipped:'已出貨',completed:'已完成',cancelled:'已取消'},payText={unpaid:'未付款',proof_submitted:'已提交付款證明',confirmed:'已付款',rejected:'付款遭拒'},shipText={unprepared:'未備貨',preparing:'備貨中',shipped:'已出貨',delivered:'已送達'};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===id));if(id==='products')renderProducts();if(id==='categories')renderCategories();if(id==='orders')renderOrders();if(id==='customers')renderCustomers()}document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>showPage(x.dataset.page));async function init(){const {data:{session}}=await db.auth.getSession();if(session)guard();else $('login').classList.remove('hidden')}async function guard(){const {data:{user}}=await db.auth.getUser();const {data,error}=await db.from('admin_profiles').select('*').eq('user_id',user.id).eq('enabled',true).maybeSingle();if(error||!data||(data.role!=='super_admin'&&!data.can_manage_products)){ $('loginError').textContent='此帳號沒有周邊商品管理權限。';await db.auth.signOut();$('login').classList.remove('hidden');return}$('login').classList.add('hidden');await loadAll()}$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginError').textContent='';const r=await db.auth.signInWithPassword({email:$('loginEmail').value,password:$('loginPassword').value});if(r.error){$('loginError').textContent=r.error.message;return}await guard()};async function signOut(){await db.auth.signOut();location.reload()}async function loadAll(){const [c,p,o,i]=await Promise.all([db.from('merch_categories').select('*').order('id'),db.from('merch_products').select('*').order('id',{ascending:false}),db.from('merch_orders').select('*').order('created_at',{ascending:false}),db.from('merch_order_items').select('*').order('id')]);if(c.error||p.error||o.error||i.error){alert('資料載入失敗：'+(c.error||p.error||o.error||i.error).message);return}categories=c.data||[];products=p.data||[];orders=o.data||[];items=i.data||[];refreshCats();renderDashboard();renderProducts();renderCategories();renderOrders();renderCustomers()}function refreshCats(){$('pCategory').innerHTML='<option value="">未分類</option>'+categories.filter(c=>c.enabled).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');$('productFilter').innerHTML='<option value="">全部分類</option>'+categories.filter(c=>c.enabled).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}function renderDashboard(){$('statProducts').textContent=products.length;$('statEnabled').textContent=products.filter(p=>p.enabled).length;$('statLow').textContent=products.filter(p=>Number(p.stock_quantity)<=5).length;$('statOrders').textContent=orders.filter(o=>!['completed','cancelled'].includes(o.status)).length;$('dashOrders').innerHTML=orders.slice(0,6).map(o=>`<div class="detail" style="margin-bottom:8px"><b>${esc(o.order_number||'#'+o.id)}</b>　${esc(o.customer_name||'')}　$${Number(o.total_amount||0).toLocaleString()}　${statusText[o.status]||o.status}</div>`).join('')||'<div class="empty">尚無訂單</div>'}function categoryName(id){return categories.find(c=>c.id===id)?.name||'未分類'}function renderProducts(){const q=($('productSearch').value||'').toLowerCase(),cf=$('productFilter').value,sf=$('productStatus').value,arr=products.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!cf||String(p.category_id)===cf)&&(!sf||(sf==='on'?p.enabled:!p.enabled)));$('productsTable').innerHTML=arr.length?'<table class="table"><thead><tr><th>照片</th><th>商品</th><th>分類</th><th>價格</th><th>庫存</th><th>狀態</th><th>操作</th></tr></thead><tbody>'+arr.map(p=>`<tr><td>${p.image_url?`<img class="thumb" src="${esc(p.image_url)}">`:'—'}</td><td><b>${esc(p.name)}</b><div class="sub">${esc(p.description||'')}</div></td><td>${esc(categoryName(p.category_id))}</td><td>$${Number(p.price).toLocaleString()}</td><td>${p.stock_quantity}</td><td><span class="badge ${p.enabled?'':'off'}">${p.enabled?'已上架':'已下架'}</span></td><td><div class="actions"><button onclick="editProduct(${p.id})">編輯</button><button onclick="toggleProduct(${p.id},${!p.enabled})">${p.enabled?'下架':'上架'}</button><button onclick="deleteProduct(${p.id})">刪除</button></div></td></tr>`).join('')+'</tbody></table>':'<div class="empty">沒有符合條件的商品</div>'}function openProduct(){$('productModal').classList.add('show');$('productModalTitle').textContent='新增商品';$('productForm').reset();$('productId').value='';$('pImageUrl').value='';$('pPreview').style.display='none';$('productError').textContent=''}function closeProduct(){$('productModal').classList.remove('show')}function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;openProduct();$('productModalTitle').textContent='編輯商品';$('productId').value=p.id;$('pName').value=p.name;$('pCategory').value=p.category_id||'';$('pDescription').value=p.description||'';$('pPrice').value=p.price;$('pStock').value=p.stock_quantity;$('pEnabled').checked=p.enabled;$('pImageUrl').value=p.image_url||'';if(p.image_url){$('pPreview').src=p.image_url;$('pPreview').style.display='block'}}$('pImage').onchange=()=>{const f=$('pImage').files[0];if(f){$('pPreview').src=URL.createObjectURL(f);$('pPreview').style.display='block'}};$('productForm').onsubmit=async e=>{e.preventDefault();$('productError').textContent='';try{let image=$('pImageUrl').value||null;const f=$('pImage').files[0];if(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase(),path=`${Date.now()}-${crypto.randomUUID()}.${ext}`;const up=await db.storage.from('merch-images').upload(path,f,{upsert:false,contentType:f.type});if(up.error)throw up.error;image=db.storage.from('merch-images').getPublicUrl(path).data.publicUrl}const payload={category_id:$('pCategory').value?Number($('pCategory').value):null,name:$('pName').value.trim(),description:$('pDescription').value.trim()||null,price:Number($('pPrice').value),stock_quantity:Number($('pStock').value),image_url:image,enabled:$('pEnabled').checked,updated_at:new Date().toISOString()};const id=$('productId').value,r=id?await db.from('merch_products').update(payload).eq('id',id):await db.from('merch_products').insert(payload);if(r.error)throw r.error;closeProduct();loadAll()}catch(err){$('productError').textContent=err.message||'儲存失敗'}};async function toggleProduct(id,v){const r=await db.from('merch_products').update({enabled:v,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else loadAll()}async function deleteProduct(id){const p=products.find(x=>x.id===id);if(p&&confirm(`確定刪除「${p.name}」？`)){const r=await db.from('merch_products').delete().eq('id',id);if(r.error)alert(r.error.message);else loadAll()}}async function addCategory(){const n=$('categoryName').value.trim();if(!n)return;const r=await db.from('merch_categories').insert({name:n,enabled:true});if(r.error)alert(r.error.message);else{$('categoryName').value='';loadAll()}}function renderCategories(){$('categoriesTable').innerHTML=categories.length?'<table class="table" style="min-width:500px"><thead><tr><th>分類</th><th>狀態</th><th>操作</th></tr></thead><tbody>'+categories.map(c=>`<tr><td>${esc(c.name)}</td><td><span class="badge ${c.enabled?'':'off'}">${c.enabled?'啟用':'停用'}</span></td><td><div class="actions"><button onclick="renameCategory(${c.id})">編輯</button><button onclick="toggleCategory(${c.id},${!c.enabled})">${c.enabled?'停用':'啟用'}</button></div></td></tr>`).join('')+'</tbody></table>':'<div class="empty">尚無分類</div>'}async function renameCategory(id){const c=categories.find(x=>x.id===id),n=prompt('修改分類名稱',c?.name||'');if(!n?.trim())return;const r=await db.from('merch_categories').update({name:n.trim()}).eq('id',id);if(r.error)alert(r.error.message);else loadAll()}async function toggleCategory(id,v){const r=await db.from('merch_categories').update({enabled:v}).eq('id',id);if(r.error)alert(r.error.message);else loadAll()}function renderOrders(){const q=($('orderSearch').value||'').toLowerCase(),sf=$('orderStatus').value,arr=orders.filter(o=>(!sf||o.status===sf)&&(!q||`${o.order_number||''} ${o.customer_name||''} ${o.customer_phone||''} ${o.customer_email||''}`.toLowerCase().includes(q)));$('ordersTable').innerHTML=arr.length?'<table class="table"><thead><tr><th>訂單</th><th>商品／數量</th><th>客戶</th><th>配送方式</th><th>金額</th><th>訂單</th><th>付款</th><th>出貨</th><th>個資</th></tr></thead><tbody>'+arr.map(o=>{const its=items.filter(i=>i.order_id===o.id);return `<tr><td><b>${esc(o.order_number||'#'+o.id)}</b><div class="sub">${new Date(o.created_at).toLocaleString('zh-TW')}</div></td><td>${its.map(i=>`${esc(i.product_name)} × ${i.quantity}`).join('<br>')||'—'}</td><td>${esc(o.customer_name||'')}<br>${esc(o.customer_phone||'')}</td><td>${esc(o.delivery_method||'—')}<br><span class="sub">${esc(o.delivery_store||o.delivery_address||'')}</span></td><td>$${Number(o.total_amount||0).toLocaleString()}</td><td><select class="select" onchange="updateOrder(${o.id},'status',this.value)">${Object.entries(statusText).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}</select></td><td><select class="select" onchange="updateOrder(${o.id},'payment_status',this.value)">${Object.entries(payText).map(([k,v])=>`<option value="${k}" ${o.payment_status===k?'selected':''}>${v}</option>`).join('')}</select></td><td><select class="select" onchange="updateOrder(${o.id},'shipment_status',this.value)">${Object.entries(shipText).map(([k,v])=>`<option value="${k}" ${o.shipment_status===k?'selected':''}>${v}</option>`).join('')}</select></td><td><button class="btn light" onclick="showCustomer(${o.id})">👤 查看</button></td></tr>`}).join('')+'</tbody></table>':'<div class="empty">目前沒有周邊商品訂單</div>'}async function updateOrder(id,f,v){const r=await db.from('merch_orders').update({[f]:v,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)alert(r.error.message);else loadAll()}function showCustomer(id){const o=orders.find(x=>x.id===id),its=items.filter(x=>x.order_id===id);if(!o)return;$('customerDetail').innerHTML=`<b>訂單編號：</b>${esc(o.order_number||'#'+o.id)}<br><b>建立時間：</b>${new Date(o.created_at).toLocaleString('zh-TW')}<hr><b>姓名：</b>${esc(o.customer_name||'—')}<br><b>電話：</b>${esc(o.customer_phone||'—')}<br><b>Email：</b>${esc(o.customer_email||'—')}<hr><b>配送方式：</b>${esc(o.delivery_method||'—')}<br><b>配送地址：</b>${esc(o.delivery_address||'—')}<br><b>取貨門市：</b>${esc(o.delivery_store||'—')}<br><b>收件人：</b>${esc(o.recipient_name||o.customer_name||'—')}<br><b>收件電話：</b>${esc(o.recipient_phone||o.customer_phone||'—')}<hr><b>商品：</b><br>${its.map(i=>`${esc(i.product_name)} × ${i.quantity}　NT$ ${Number(i.subtotal||0).toLocaleString()}`).join('<br>')||'—'}<br><br><b>訂單金額：</b>NT$ ${Number(o.total_amount||0).toLocaleString()}<br><b>訂單狀態：</b>${statusText[o.status]||o.status}<br><b>付款狀態：</b>${payText[o.payment_status]||o.payment_status}<br><b>出貨狀態：</b>${shipText[o.shipment_status]||o.shipment_status}<br><b>備註：</b>${esc(o.customer_note||'—')}`;$('customerModal').classList.add('show')}function closeCustomer(){$('customerModal').classList.remove('show')}function renderCustomers(){const q=($('customerSearch').value||'').toLowerCase(),map=new Map();orders.forEach(o=>{const key=(o.customer_phone||o.customer_email||o.customer_name||o.id).toString();if(!map.has(key))map.set(key,{o,count:1,total:Number(o.total_amount||0)});else{const x=map.get(key);x.count++;x.total+=Number(o.total_amount||0)}});const arr=[...map.values()].filter(x=>{const o=x.o;return !q||`${o.customer_name||''} ${o.customer_phone||''} ${o.customer_email||''}`.toLowerCase().includes(q)});$('customersTab
