<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>老爹・涼糕｜商品管理後台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f1eb;color:#33251d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #e8ddd3;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 6px 24px rgba(51,37,29,.05)}h1,h2{margin:0 0 12px}.small{font-size:13px;color:#77685e}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #d9cdc3;border-radius:10px;font:inherit;background:#fff}.field textarea{min-height:100px;resize:vertical}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:10px;padding:11px 15px;background:#9a603d;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#6d625b}.danger{background:#a7352f}.ok{background:#edf8f0;color:#286d46;padding:11px;border-radius:10px;margin-top:10px}.error{background:#fff0ef;color:#a7352f;padding:11px;border-radius:10px;margin-top:10px}.hidden{display:none}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tab{background:#eee6df;color:#5c4a3d;white-space:nowrap}.tab.active{background:#9a603d;color:#fff}.list{display:grid;gap:10px}.product{border:1px solid #e6dbd1;border-radius:14px;padding:13px;display:grid;grid-template-columns:92px 1fr auto;gap:13px;align-items:center}.thumb{width:92px;height:92px;border-radius:12px;object-fit:cover;background:#eee5dc}.thumb.empty{display:flex;align-items:center;justify-content:center;color:#9a897c;font-size:12px;text-align:center}.product h3{margin:0 0 5px}.badge{display:inline-block;border-radius:99px;padding:4px 8px;font-size:12px;background:#eee6df;margin-right:5px}.on{background:#e7f6ed;color:#286d46}.off{background:#f4e8e7;color:#963b35}.stock{font-weight:800}.login-note{margin-top:8px}.right{text-align:right}.upload{font-size:13px}.preview{max-width:160px;max-height:160px;border-radius:12px;margin-top:8px;display:none}.size-box{border:1px solid #e3d7cd;border-radius:12px;padding:12px;background:#fcfaf8}.size-options{display:flex;flex-wrap:wrap;gap:8px}.size-option{display:flex;align-items:center;gap:5px;border:1px solid #d9cdc3;border-radius:9px;padding:8px 10px;background:#fff;font-weight:700}.size-option input{width:auto}.customer{border:1px solid #e6dbd1;border-radius:14px;padding:15px}.customer h3{margin:0 0 8px}.customer-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}.customer-line{font-size:14px}.customer-detail{margin-top:10px;padding-top:10px;border-top:1px solid #eadfd4}.customer-detail button{margin-top:8px}@media(max-width:700px){.grid{grid-template-columns:1fr}.product{grid-template-columns:72px 1fr}.thumb{width:72px;height:72px}.product .right{grid-column:2;text-align:left}.wrap{padding-top:10px}.customer-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header class="card"><h1>🛍️ 商品管理後台</h1><div id="who" class="small">尚未登入</div></header>
<section id="login" class="card">
<h2>管理員登入</h2>
<form id="loginForm" autocomplete="on"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn">登入</button></form>
<div class="small login-note">此頁只管理周邊商品，不會修改餐車／擺攤行程等其他後台。</div><div id="msg" aria-live="polite"></div>
</section>
<main id="app" class="hidden">
<div class="tabs"><button class="tab active" data-tab="products">商品管理</button><button class="tab" data-tab="categories">分類管理</button><button class="tab" data-tab="orders">商品訂單</button><button class="tab" data-tab="customers">客戶個資管理</button></div>
<section id="productsTab" class="card">
<div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><h2>商品列表</h2><button id="newBtn">＋新增商品</button></div>
<div id="productMsg"></div><div id="productList" class="list">讀取中…</div>
</section>
<section id="categoriesTab" class="card hidden"><h2>商品分類</h2><div class="grid"><div class="field"><label>分類名稱</label><input id="catName" placeholder="例如：衣服、帽子、外套、毛巾、其他周邊"></div><div class="actions" style="align-items:end"><button id="addCat">新增分類</button></div></div><div id="catMsg"></div><div id="catList" class="list"></div></section>
<section id="ordersTab" class="card hidden"><h2>商品訂單</h2><div id="orderMsg"></div><div id="orderList" class="list">讀取中…</div></section>
<section id="customersTab" class="card hidden"><h2>客戶個資管理</h2><div class="small" style="margin-bottom:12px">僅顯示周邊商品訂單留下的客戶資料；沒有訂單時不會顯示客戶資料。</div><div class="field"><label>搜尋客戶</label><input id="customerSearch" placeholder="姓名／電話／Email"></div><div id="customerList" class="list">讀取中…</div></section>
<section id="editCard" class="card hidden"><h2 id="editTitle">新增商品</h2><div class="grid">
<div class="field"><label>商品名稱</label><input id="pName" required></div>
<div class="field"><label>商品分類</label><select id="pCategory"><option value="">未分類</option></select></div>
<div class="field"><label>售價</label><input id="pPrice" type="number" min="0" step="1" required></div>
<div class="field"><label>庫存數量</label><input id="pStock" type="number" min="0" step="1" required></div>
</div>
<div id="sizeField" class="field hidden"><label>衣服／外套尺寸</label><div class="size-box"><div class="size-options"><label class="size-option"><input type="checkbox" value="XS">XS</label><label class="size-option"><input type="checkbox" value="S">S</label><label class="size-option"><input type="checkbox" value="M">M</label><label class="size-option"><input type="checkbox" value="L">L</label><label class="size-option"><input type="checkbox" value="XL">XL</label><label class="size-option"><input type="checkbox" value="2XL">2XL</label><label class="size-option"><input type="checkbox" value="3XL">3XL</label></div><div class="small" style="margin-top:8px">只有分類選擇「衣服／外套／服飾」時顯示。可複選商品提供的尺寸。</div></div></div>
<div class="field"><label>商品介紹</label><textarea id="pDescription" placeholder="商品說明"></textarea></div>
<div class="field"><label>商品圖片網址</label><input id="pImage" type="url" placeholder="https://..."><div class="small">也可以選擇圖片上傳到 merch-images。</div><input id="pFile" class="upload" type="file" accept="image/*"><img id="preview" class="preview" alt="預覽"></div>
<div class="field"><label><input id="pEnabled" type="checkbox" checked> 上架中</label></div>
<div class="actions"><button id="saveBtn">儲存商品</button><button id="cancelBtn" class="secondary" type="button">取消</button></div><div id="editMsg"></div>
</section>
<section class="card"><button id="refresh" class="secondary">重新整理</button> <button id="logout" class="secondary">登出</button></section>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){'use strict';
const SUPABASE_URL='https://yemzdwxtyosuaczsqwea.supabase.co';
const SUPABASE_KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';
let sb=null,products=[],categories=[],orders=[],editingId=null,busy=false;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function show(id,text,kind='ok'){const e=$(id);if(e)e.innerHTML='<div class="'+kind+'">'+esc(text)+'</div>'}
async function checkAccess(user){const r=await sb.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',user.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'此帳號目前已停用';if(!(r.data.role==='super_admin'||r.data.can_manage_products))return'此帳號沒有商品管理權限';return null}
function openApp(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='已登入 · 商品管理後台';loadAll()}
function isClothingCategory(){const c=categories.find(x=>x.id===Number($('pCategory').value));return !!c&&/(衣服|外套|服飾)/.test(c.name||'')}
function syncSizeVisibility(){const f=$('sizeField');if(isClothingCategory())f.classList.remove('hidden');else f.classList.add('hidden')}
function getSelectedSizes(){return [...document.querySelectorAll('#sizeField input[type=checkbox]:checked')].map(x=>x.value)}
function setSelectedSizes(arr){const set=new Set(Array.isArray(arr)?arr:[]);document.querySelectorAll('#sizeField input[type=checkbox]').forEach(x=>x.checked=set.has(x.value))}
async function loadCategories(){const r=await sb.from('merch_categories').select('id,name,enabled,created_at').order('id');if(r.error){show('catMsg','分類讀取失敗：'+r.error.message,'error');return}categories=r.data||[];renderCategories();const sel=$('pCategory');const old=sel.value;sel.innerHTML='<option value="">未分類</option>'+categories.filter(c=>c.enabled).map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('');if([...sel.options].some(o=>o.value===old))sel.value=old;syncSizeVisibility()}
function renderCategories(){$('catList').innerHTML=categories.map(c=>'<div class="product"><div></div><div><h3>'+esc(c.name)+'</h3><span class="badge '+(c.enabled?'on':'off')+'">'+(c.enabled?'啟用':'停用')+'</span></div><div class="right"><button class="secondary" onclick="window.toggleCat('+c.id+','+(!c.enabled)+')">'+(c.enabled?'停用':'啟用')+'</button></div></div>').join('')||'<div class="small">目前沒有分類。</div>'}
async function loadProducts(){const r=await sb.from('merch_products').select('id,category_id,name,description,price,stock_quantity,image_url,enabled,size_options,created_at,updated_at').order('id',{ascending:false});if(r.error){show('productMsg','商品讀取失敗：'+r.error.message,'error');return}products=r.data||[];renderProducts()}
function renderProducts(){$('productList').innerHTML=products.map(p=>{const c=categories.find(x=>x.id===p.category_id);const img=p.image_url?'<img class="thumb" src="'+esc(p.image_url)+'" alt="">':'<div class="thumb empty">尚無圖片</div>';const sizes=Array.isArray(p.size_options)&&p.size_options.length?'<div class="small">尺寸：'+esc(p.size_options.join('、'))+'</div>':'';return '<div class="product">'+img+'<div><h3>'+esc(p.name)+'</h3><div><span class="badge">'+esc(c?.name||'未分類')+'</span><span class="badge '+(p.enabled?'on':'off')+'">'+(p.enabled?'上架':'下架')+'</span></div><div class="stock">$'+Number(p.price||0).toLocaleString()+'　庫存 '+Number(p.stock_quantity||0)+'</div>'+sizes+'<div class="small">'+esc(p.description||'')+'</div></div><div class="right"><button onclick="window.editProduct('+p.id+')">編輯</button><button class="secondary" onclick="window.toggleProduct('+p.id+','+(!p.enabled)+')">'+(p.enabled?'下架':'上架')+'</button></div></div>'}).join('')||'<div class="small">目前沒有商品，按「新增商品」開始。</div>'}
async function loadOrders(){const r=await sb.from('merch_orders').select('id,order_number,customer_name,customer_phone,customer_email,delivery_method,delivery_store,delivery_address,recipient_name,recipient_phone,customer_note,product_total,total_amount,status,payment_status,shipment_status,created_at').order('created_at',{ascending:false}).limit(100);if(r.error){show('orderMsg','訂單讀取失敗：'+r.error.message,'error');return}orders=r.data||[];renderOrders();renderCustomers()}
function renderOrders(){$('orderList').innerHTML=orders.map(o=>'<div class="product"><div></div><div><h3>'+esc(o.order_number)+'</h3><div>'+esc(o.customer_name||'')+'　'+esc(o.customer_phone||'')+'</div><div class="small">商品 $'+Number(o.product_total||0).toLocaleString()+'　合計 $'+Number(o.total_amount||0).toLocaleString()+'</div><div><span class="badge">付款：'+esc(o.payment_status)+'</span><span class="badge">出貨：'+esc(o.shipment_status)+'</span></div></div><div class="right"><span class="badge">'+esc(o.status)+'</span></div></div>').join('')||'<div class="small">目前沒有商品訂單。</div>'}
function renderCustomers(){const q=($('customerSearch')?.value||'').trim().toLowerCase();const map=new Map();orders.forEach(o=>{const key=(o.customer_phone||o.customer_email||o.customer_name||String(o.id)).trim().toLowerCase();if(!map.has(key))map.set(key,{customer_name:o.customer_name,customer_phone:o.customer_phone,customer_email:o.customer_email,delivery_method:o.delivery_method,delivery_store:o.delivery_store,delivery_address:o.delivery_address,recipient_name:o.recipient_name,recipient_phone:o.recipient_phone,customer_note:o.customer_note,orders:1,total:Number(o.total_amount||0),last:o.created_at,orderIds:[o.order_number]});else{const x=map.get(key);x.orders++;x.total+=Number(o.total_amount||0);x.orderIds.push(o.order_number);if(new Date(o.created_at)>new Date(x.last))Object.assign(x,{customer_name:o.customer_name,customer_phone:o.customer_phone,customer_email:o.customer_email,delivery_method:o.delivery_method,delivery_store:o.delivery_store,delivery_address:o.delivery_address,recipient_name:o.recipient_name,recipient_phone:o.recipient_phone,customer_note:o.customer_note,last:o.created_at})}});const arr=[...map.values()].filter(c=>!q||`${c.customer_name||''} ${c.customer_phone||''} ${c.customer_email||''}`.toLowerCase().includes(q));$('customerList').innerHTML=arr.length?arr.map(c=>'<div class="customer"><h3>👤 '+esc(c.customer_name||'未提供姓名')+'</h3><div class="customer-grid"><div class="customer-line"><b>電話：</b>'+esc(c.customer_phone||'未提供')+'</div><div class="customer-line"><b>Email：</b>'+esc(c.customer_email||'未提供')+'</div><div class="customer-line"><b>配送方式：</b>'+esc(c.delivery_method||'未提供')+'</div><div class="customer-line"><b>門市／地址：</b>'+esc(c.delivery_store||c.delivery_address||'未提供')+'</div><div class="customer-line"><b>訂單數：</b>'+c.orders+' 筆</div><div class="customer-line"><b>累計金額：</b>$'+c.total.toLocaleString()+'</div></div><div class="customer-detail"><div class="small">最近訂單：'+esc(c.orderIds[c.orderIds.length-1]||'—')+'</div><div class="small">收件人：'+esc(c.recipient_name||c.customer_name||'未提供')+'　'+esc(c.recipient_phone||c.customer_phone||'未提供')+'</div><div class="small">備註：'+esc(c.customer_note||'無')+'</div></div></div>').join(''):'<div class="small">目前沒有客戶個資。</div>'}
async function loadAll(){await loadCategories();await loadProducts();await loadOrders()}
function resetForm(){$('editCard').classList.add('hidden');editingId=null;$('editTitle').textContent='新增商品';['pName','pPrice','pStock','pDescription','pImage'].forEach(id=>$(id).value='');$('pCategory').value='';$('pEnabled').checked=true;$('pFile').value='';$('preview').style.display='none';$('editMsg').innerHTML='';setSelectedSizes([]);syncSizeVisibility()}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;editingId=id;$('editTitle').textContent='編輯商品';$('pName').value=p.name||'';$('pCategory').value=p.category_id||'';$('pPrice').value=p.price||0;$('pStock').value=p.stock_quantity||0;$('pDescription').value=p.description||'';$('pImage').value=p.image_url||'';$('pEnabled').checked=!!p.enabled;setSelectedSizes(p.size_options);syncSizeVisibility();$('editCard').classList.remove('hidden');window.scrollTo({top:$('editCard').offsetTop-10,behavior:'smooth'})}
async function uploadImage(file){if(!file)return null;const ext=(file.name.split('.').pop()||'jpg').toLowerCase();const path='products/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext;const r=await sb.storage.from('merch-images').upload(path,file,{upsert:false,contentType:file.type});if(r.error)throw r.error;return sb.storage.from('merch-images').getPublicUrl(path).data.publicUrl}
async function saveProduct(){if(busy)return;const name=$('pName').value.trim();if(!name)return show('editMsg','請填寫商品名稱。','error');busy=true;$('saveBtn').disabled=true;try{let image=$('pImage').value.trim()||null;if($('pFile').files[0])image=await uploadImage($('pFile').files[0]);const payload={category_id:$('pCategory').value?Number($('pCategory').value):null,name,description:$('pDescription').value.trim()||null,price:Number($('pPrice').value||0),stock_quantity:Number($('pStock').value||0),image_url:image,enabled:$('pEnabled').checked,size_options:isClothingCategory()?getSelectedSizes():[],updated_at:new Date().toISOString()};let r;if(editingId)r=await sb.from('merch_products').update(payload).eq('id',editingId);else r=await sb.from('merch_products').insert(payload);if(r.error)throw r.error;show('productMsg',editingId?'商品已更新。':'商品已新增。','ok');resetForm();await loadProducts()}catch(e){show('editMsg','儲存失敗：'+(e.message||e),'error')}finally{busy=false;$('saveBtn').disabled=false}}
window.editProduct=editProduct;
window.toggleProduct=async(id,enabled)=>{const r=await sb.from('merch_products').update({enabled,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return show('productMsg','更新失敗：'+r.error.message,'error');await loadProducts()};
window.toggleCat=async(id,enabled)=>{const r=await sb.from('merch_categories').update({enabled}).eq('id',id);if(r.error)return show('catMsg','更新失敗：'+r.error.message,'error');await loadCategories();await loadProducts()};
$('loginForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('loginBtn').disabled=true;show('msg','正在驗證帳號…');try{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const er=await checkAccess(r.data.user);if(er)throw new Error(er);openApp(r.data.user)}catch(e){show('msg','登入失敗：'+(e.message||e),'error')}finally{busy=false;$('loginBtn').disabled=false}};
$('newBtn').onclick=()=>{$('editCard').classList.remove('hidden');editingId=null;$('editTitle').textContent='新增商品';setSelectedSizes([]);syncSizeVisibility();window.scrollTo({top:$('editCard').offsetTop-10,behavior:'smooth'})};
$('saveBtn').onclick=saveProduct;$('cancelBtn').onclick=resetForm;$('refresh').onclick=loadAll;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('customerSearch').oninput=renderCustomers;
$('pCategory').onchange=syncSizeVisibility;
$('addCat').onclick=async()=>{const name=$('catName').value.trim();if(!name)return show('catMsg','請填寫分類名稱。','error');const r=await sb.from('merch_categories').insert({name,enabled:true});if(r.error)return show('catMsg','新增分類失敗：'+r.error.message,'error');$('catName').value='';show('catMsg','分類已新增。');await loadCategories()};
$('pFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);$('preview').src=u;$('preview').style.display='block'};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['products','categories','orders','customers'].forEach(t=>$(t+'Tab').classList.add('hidden'));$(b.dataset.tab+'Tab').classList.remove('hidden');if(b.dataset.tab==='customers')renderCustomers()});
async function init(){sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const s=await sb.auth.getSession();if(s.data.session){const er=await checkAccess(s.data.session.user);if(!er)openApp(s.data.session.user);else show('msg',er,'error')}}
init();
})();
</script>
</body>
</html>
