<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>老爹・涼糕｜周邊商品管理後台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6eee3;color:#33251d;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif}.top{height:70px;background:#432616;color:#fffaf3;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:20}.brand{font-size:22px;font-weight:800}.brand small{display:block;font-size:11px;opacity:.7;font-weight:500;margin-top:3px}.logout{border:1px solid #ffffff55;background:transparent;color:#fff;padding:9px 14px;border-radius:10px;cursor:pointer}.layout{display:flex;min-height:calc(100vh - 70px)}aside{width:240px;background:#fffaf3;border-right:1px solid #e2d5c5;padding:22px 14px;flex:none}.nav{width:100%;text-align:left;border:0;background:transparent;padding:14px 16px;border-radius:12px;font-size:15px;font-weight:700;color:#5a4638;cursor:pointer;margin-bottom:6px}.nav.active,.nav:hover{background:#ead7c0;color:#432616}.main{flex:1;padding:28px;max-width:1400px;margin:auto;width:100%}.page{display:none}.page.active{display:block}.title{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.title h1{margin:0;font-size:28px}.sub{color:#7c6a5d;font-size:13px;margin-top:5px}.btn{border:0;background:#432616;color:#fff;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer}.btn.light{background:#fff;border:1px solid #d8c8b7;color:#432616}.btn.danger{background:#9d3025}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.stat{background:#fffaf3;border:1px solid #e4d7c8;border-radius:16px;padding:18px}.stat b{font-size:27px;display:block;margin-top:8px}.card{background:#fffaf3;border:1px solid #e4d7c8;border-radius:18px;padding:18px;margin-bottom:18px;overflow:auto}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.input,.select,.textarea{width:100%;border:1px solid #d9c9b9;border-radius:10px;background:#fff;padding:11px 12px;font-size:15px;color:#33251d}.textarea{min-height:110px;resize:vertical}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field.full{grid-column:1/-1}.check{display:flex;align-items:center;gap:8px;font-weight:700}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:12px 10px;border-bottom:1px solid #eadfd4;text-align:left;vertical-align:middle;font-size:14px}.table th{font-size:12px;color:#7b6858;background:#faf3eb}.thumb{width:58px;height:58px;border-radius:10px;object-fit:cover;background:#eadfd4}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#ead7c0;font-size:12px;font-weight:800}.badge.off{background:#eee;color:#777}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 9px;border-radius:8px;border:1px solid #d7c7b8;background:#fff;cursor:pointer}.modal{position:fixed;inset:0;background:#33251d99;display:none;align-items:center;justify-content:center;padding:20px;z-index:50}.modal.show{display:flex}.modalbox{background:#fffaf3;border-radius:20px;width:min(720px,100%);max-height:90vh;overflow:auto;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modalhead h2{margin:0}.close{border:0;background:transparent;font-size:28px;cursor:pointer}.preview{width:110px;height:110px;border-radius:14px;object-fit:cover;background:#eadfd4;display:none;margin-top:10px}.empty{text-align:center;color:#887667;padding:35px}.login{position:fixed;inset:0;background:#f6eee3;display:flex;align-items:center;justify-content:center;padding:20px;z-index:100}.loginbox{width:min(420px,100%);background:#fffaf3;border:1px solid #e4d7c8;border-radius:20px;padding:28px;box-shadow:0 15px 50px #43261620}.loginbox h1{margin:0 0 5px}.error{color:#a52e25;font-size:13px;margin-top:10px}.hidden{display:none!important}.order-detail{white-space:pre-wrap;background:#f8f0e8;border-radius:12px;padding:12px;margin-top:10px;font-size:13px}.mobile-menu{display:none}
@media(max-width:800px){aside{width:72px;padding:12px 8px}.nav{font-size:0;text-align:center;padding:13px 5px}.nav span{display:none}.main{padding:18px}.grid{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.top{padding:0 15px}.brand{font-size:17px}.title{align-items:flex-start;gap:10px}.title h1{font-size:22px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><h1>🛍️ 周邊商品管理</h1><div class="sub">獨立後台｜不修改其他管理後台</div><form id="loginForm" style="margin-top:20px"><div class="field"><label>管理員 Email</label><input class="input" id="email" type="email" required></div><div class="field" style="margin-top:12px"><label>密碼</label><input class="input" id="password" type="password" required></div><button class="btn" style="width:100%;margin-top:16px">登入後台</button><div id="loginError" class="error"></div></form></div></div>
<header class="top"><div class="brand">🛍️ 老爹・涼糕 <small>周邊商品獨立管理後台</small></div><button class="logout" onclick="signOut()">登出</button></header>
<div class="layout"><aside>
<button class="nav active" data-page="dashboard">📊 <span>總覽</span></button>
<button class="nav" data-page="products">🛍️ <span>商品管理</span></button>
<button class="nav" data-page="categories">🏷️ <span>商品分類</span></button>
<button class="nav" data-page="orders">📋 <span>訂單管理</span></button>
</aside><main class="main">
<section id="dashboard" class="page active"><div class="title"><div><h1>周邊商品總覽</h1><div class="sub">只管理 merch 商品與 merch 訂單</div></div><button class="btn" onclick="showPage('products');openProduct()">＋ 新增商品</button></div><div class="grid"><div class="stat">商品總數<b id="statProducts">0</b></div><div class="stat">目前上架<b id="statEnabled">0</b></div><div class="stat">庫存不足<b id="statLow">0</b></div><div class="stat">待處理訂單<b id="statOrders">0</b></div></div><div class="card"><h3>目前商品</h3><div id="dashProducts" class="empty">載入中…</div></div></section>
<section id="products" class="page"><div class="title"><div><h1>🛍️ 商品管理</h1><div class="sub">新增、修改、照片、價格、庫存、上架／下架、刪除、編輯</div></div><button class="btn" onclick="openProduct()">＋ 新增商品</button></div><div class="card"><div class="toolbar"><input id="productSearch" class="input" style="max-width:300px" placeholder="搜尋商品名稱…" oninput="renderProducts()"><select id="productFilter" class="select" style="max-width:180px" onchange="renderProducts()"><option value="">全部分類</option></select><select id="productStatus" class="select" style="max-width:150px" onchange="renderProducts()"><option value="">全部狀態</option><option value="on">已上架</option><option value="off">已下架</option></select></div><div id="productsTable"></div></div></section>
<section id="categories" class="page"><div class="title"><div><h1>🏷️ 商品分類</h1><div class="sub">衣服、帽子、外套、毛巾、其他周邊</div></div></div><div class="card"><div class="toolbar"><input id="categoryName" class="input" style="max-width:300px" placeholder="新增分類名稱"><button class="btn" onclick="addCategory()">＋ 新增分類</button></div><div id="categoriesTable"></div></div></section>
<section id="orders" class="page"><div class="title"><div><h1>📋 周邊商品訂單</h1><div class="sub">商品／數量、訂單金額、訂單狀態、付款狀態、出貨狀態</div></div></div><div class="card"><div class="toolbar"><input id="orderSearch" class="input" style="max-width:300px" placeholder="搜尋訂單編號／姓名／電話…" oninput="renderOrders()"><select id="orderStatus" class="select" style="max-width:170px" onchange="renderOrders()"><option value="">全部訂單狀態</option><option value="pending">待處理</option><option value="confirmed">已確認</option><option value="preparing">備貨中</option><option value="shipped">已出貨</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select></div><div id="ordersTable"></div></div></section>
</main></div>
<div id="productModal" class="modal"><div class="modalbox"><div class="modalhead"><h2 id="productModalTitle">新增商品</h2><button class="close" onclick="closeProduct()">×</button></div><form id="productForm"><input type="hidden" id="productId"><div class="formgrid"><div class="field"><label>商品名稱 *</label><input id="pName" class="input" required></div><div class="field"><label>商品分類</label><select id="pCategory" class="select"></select></div><div class="field full"><label>商品介紹</label><textarea id="pDescription" class="textarea"></textarea></div><div class="field"><label>商品價格 *</label><input id="pPrice" class="input" type="number" min="0" step="1" required></div><div class="field"><label>庫存數量 *</label><input id="pStock" class="input" type="number" min="0" step="1" required></div><div class="field full"><label>商品照片</label><input id="pImage" class="input" type="file" accept="image/*"><img id="pPreview" class="preview"><input id="pImageUrl" type="hidden"></div><div class="field full"><label class="check"><input id="pEnabled" type="checkbox"> 立即上架</label></div></div><div style="display:flex;justify-content:flex-end;gap:8px;margin-top:18px"><button type="button" class="btn light" onclick="closeProduct()">取消</button><button class="btn">儲存商品</button></div><div id="productError" class="error"></div></form></div></div>
<script>
const SUPABASE_URL='https://yemzdwxtyosuaczsqwea.supabase.co';
const SUPABASE_KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let products=[],categories=[],orders=[],orderItems=[],profile=null;
const statusText={pending:'待處理',confirmed:'已確認',preparing:'備貨中',shipped:'已出貨',completed:'已完成',cancelled:'已取消'};
const payText={unpaid:'未付款',proof_submitted:'已提交付款證明',confirmed:'已付款',rejected:'付款遭拒'};
const shipText={unprepared:'未備貨',preparing:'備貨中',shipped:'已出貨',delivered:'已送達'};
function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function showPage(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===id));if(id==='products')renderProducts();if(id==='categories')renderCategories();if(id==='orders')renderOrders()}
document.querySelectorAll('.nav').forEach(x=>x.onclick=()=>showPage(x.dataset.page));
async function init(){const {data:{session}}=await db.auth.getSession();if(!session){document.getElementById('login').classList.remove('hidden');return}await guard();}
async function guard(){const {data:{user}}=await db.auth.getUser();const {data,error}=await db.from('admin_profiles').select('*').eq('user_id',user.id).eq('enabled',true).maybeSingle();if(error||!data||(data.role!=='super_admin'&&!data.can_manage_products)){document.getElementById('loginError').textContent='此帳號沒有周邊商品管理權限。';await db.auth.signOut();document.getElementById('login').classList.remove('hidden');return}profile=data;document.getElementById('login').classList.add('hidden');await loadAll()}
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();document.getElementById('loginError').textContent='';const {error}=await db.auth.signInWithPassword({email:email.value,password:password.value});if(error){document.getElementById('loginError').textContent=error.message;return}await guard()};
async function signOut(){await db.auth.signOut();location.reload()}
async function loadAll(){const [c,p,o,i]=await Promise.all([db.from('merch_categories').select('*').order('id'),db.from('merch_products').select('*').order('id',{ascending:false}),db.from('merch_orders').select('*').order('created_at',{ascending:false}),db.from('merch_order_items').select('*').order('id')]);if(c.error||p.error||o.error||i.error){alert('資料載入失敗：'+(c.error||p.error||o.error||i.error).message);return}categories=c.data||[];products=p.data||[];orders=o.data||[];orderItems=i.data||[];refreshCategorySelects();renderProducts();renderCategories();renderOrders();renderDashboard()}
function refreshCategorySelects(){const opts='<option value="">未分類</option>'+categories.filter(c=>c.enabled).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');pCategory.innerHTML=opts;productFilter.innerHTML='<option value="">全部分類</option>'+categories.filter(c=>c.enabled).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}
function renderDashboard(){statProducts.textContent=products.length;statEnabled.textContent=products.filter(p=>p.enabled).length;statLow.textContent=products.filter(p=>Number(p.stock_quantity)<=5).length;statOrders.textContent=orders.filter(o=>!['completed','cancelled'].includes(o.status)).length;const arr=products.slice(0,8);dashProducts.innerHTML=arr.length?'<div class="toolbar">'+arr.map(p=>`<span class="badge ${p.enabled?'':'off'}">${esc(p.name)}｜庫存 ${p.stock_quantity}</span>`).join(' ')+'</div>':'<div class="empty">尚無商品</div>'}
function categoryName(id){return categories.find(c=>c.id===id)?.name||'未分類'}
function renderProducts(){const q=(productSearch.value||'').toLowerCase();const cf=productFilter.value;const sf=productStatus.value;let arr=products.filter(p=>(!q||p.name.toLowerCase().includes(q))&&(!cf||String(p.category_id)===cf)&&(!sf||(sf==='on'?p.enabled:!p.enabled)));if(!arr.length){productsTable.innerHTML='<div class="empty">沒有符合條件的商品</div>';return}productsTable.innerHTML='<table class="table"><thead><tr><th>照片</th><th>商品名稱</th><th>分類</th><th>價格</th><th>庫存</th><th>狀態</th><th>編輯</th></tr></thead><tbody>'+arr.map(p=>`<tr><td>${p.image_url?`<img class="thumb" src="${esc(p.image_url)}">`:'—'}</td><td><b>${esc(p.name)}</b><div class="sub">${esc(p.description||'')}</div></td><td>${esc(categoryName(p.category_id))}</td><td>$${Number(p.price).toLocaleString()}</td><td>${p.stock_quantity}</td><td><span class="badge ${p.enabled?'':'off'}">${p.enabled?'已上架':'已下架'}</span></td><td><div class="actions"><button onclick="editProduct(${p.id})">📝 編輯</button><button onclick="toggleProduct(${p.id},${!p.enabled})">${p.enabled?'下架':'上架'}</button><button onclick="deleteProduct(${p.id})">🗑️ 刪除</button></div></td></tr>`).join('')+'</tbody></table>'}
function openProduct(){productModal.classList.add('show');productModalTitle.textContent='新增商品';productForm.reset();productId.value='';pImageUrl.value='';pPreview.style.display='none';productError.textContent=''}
function closeProduct(){productModal.classList.remove('show')}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;openProduct();productModalTitle.textContent='編輯商品';productId.value=p.id;pName.value=p.name;pCategory.value=p.category_id||'';pDescription.value=p.description||'';pPrice.value=p.price;pStock.value=p.stock_quantity;pEnabled.checked=p.enabled;pImageUrl.value=p.image_url||'';if(p.image_url){pPreview.src=p.image_url;pPreview.style.display='block'}}
pImage.onchange=()=>{const f=pImage.files[0];if(f){pPreview.src=URL.createObjectURL(f);pPreview.style.display='block'}};
productForm.onsubmit=async e=>{e.preventDefault();productError.textContent='';try{let imageUrl=pImageUrl.value||null;const f=pImage.files[0];if(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase();const path=`${Date.now()}-${crypto.randomUUID()}.${ext}`;const up=await db.storage.from('merch-images').upload(path,f,{upsert:false,contentType:f.type});if(up.error)throw up.error;imageUrl=db.storage.from('merch-images').getPublicUrl(path).data.publicUrl}const payload={category_id:pCategory.value?Number(pCategory.value):null,name:pName.value.trim(),description:pDescription.value.trim()||null,price:Number(pPrice.value),stock_quantity:Number(pStock.value),image_url:imageUrl,enabled:pEnabled.checked,updated_at:new Date().toISOString()};const id=productId.value;const res=id?await db.from('merch_products').update(payload).eq('id',Number(id)):await db.from('merch_products').insert(payload);if(res.error)throw res.error;closeProduct();await loadAll()}catch(err){productError.textContent=err.message||'儲存失敗'}};
async function toggleProduct(id,val){const {error}=await db.from('merch_products').update({enabled:val,updated_at:new Date().toISOString()}).eq('id',id);if(error)alert(error.message);else await loadAll()}
async function deleteProduct(id){const p=products.find(x=>x.id===id);if(!p||!confirm(`確定刪除「${p.name}」？`))return;const {error}=await db.from('merch_products').delete().eq('id',id);if(error){alert('刪除失敗：'+error.message);return}await loadAll()}
async function addCategory(){const name=categoryName.value.trim();if(!name)return;const {error}=await db.from('merch_categories').insert({name,enabled:true});if(error){alert(error.message);return}categoryName.value='';await loadAll()}
function renderCategories(){if(!categories.length){categoriesTable.innerHTML='<div class="empty">尚無分類</div>';return}categoriesTable.innerHTML='<table class="table"><thead><tr><th>分類</th><th>狀態</th><th>操作</th></tr></thead><tbody>'+categories.map(c=>`<tr><td><b>${esc(c.name)}</b></td><td><span class="badge ${c.enabled?'':'off'}">${c.enabled?'啟用':'停用'}</span></td><td><div class="actions"><button onclick="renameCategory(${c.id})">📝 編輯</button><button onclick="toggleCategory(${c.id},${!c.enabled})">${c.enabled?'停用':'啟用'}</button></div></td></tr>`).join('')+'</tbody></table>'}
async function renameCategory(id){const c=categories.find(x=>x.id===id);const name=prompt('修改分類名稱',c?.name||'');if(!name||!name.trim())return;const {error}=await db.from('merch_categories').update({name:name.trim()}).eq('id',id);if(error)alert(error.message);else await loadAll()}
async function toggleCategory(id,val){const {error}=await db.from('merch_categories').update({enabled:val}).eq('id',id);if(error)alert(error.message);else await loadAll()}
function renderOrders(){const q=(orderSearch.value||'').toLowerCase();const sf=orderStatus.value;let arr=orders.filter(o=>(!sf||o.status===sf)&&(!q||`${o.order_number||''} ${o.customer_name||''} ${o.customer_phone||''}`.toLowerCase().includes(q)));if(!arr.length){ordersTable.innerHTML='<div class="empty">目前沒有符合條件的周邊商品訂單</div>';return}ordersTable.innerHTML='<table class="table"><thead><tr><th>訂單</th><th>商品／數量</th><th>金額</th><th>訂單狀態</th><th>付款狀態</th><th>出貨狀態</th><th>操作</th></tr></thead><tbody>'+arr.map(o=>{const items=orderItems.filter(i=>i.order_id===o.id);const txt=items.map(i=>`${esc(i.product_name)} × ${i.quantity}`).join('<br>');return `<tr><td><b>${esc(o.order_number||('#'+o.id))}</b><div class="sub">${esc(o.customer_name||'')} ${esc(o.customer_phone||'')}</div></td><td>${txt||'—'}</td><td>$${Number(o.total_amount||0).toLocaleString()}</td><td><select class="select" onchange="updateOrder(${o.id},'status',this.value)">${Object.entries(statusText).map(([k,v])=>`<option value="${k}" ${o.status===k?'selected':''}>${v}</option>`).join('')}</select></td><td><select class="select" onchange="updateOrder(${o.id},'payment_status',this.value)">${Object.entries(payText).map(([k,v])=>`<option value="${k}" ${o.payment_status===k?'selected':''}>${v}</option>`).join('')}</select></td><td><select class="select" onchange="updateOrder(${o.id},'shipment_status',this.value)">${Object.entries(shipText).map(([k,v])=>`<option value="${k}" ${o.shipment_status===k?'selected':''}>${v}</option>`).join('')}</select></td><td><button class="btn light" onclick="showOrder(${o.id})">查看</button></td></tr>`}).join('')+'</tbody></table>'}
async function updateOrder(id,field,value){const {error}=await db.from('merch_orders').update({[field]:value,updated_at:new Date().toISOString()}).eq('id',id);if(error){alert(error.message);await loadAll();return}await loadAll()}
function showOrder(id){const o=orders.find(x=>x.id===id);if(!o)return;const items=orderItems.filter(i=>i.order_id===id);alert(`訂單：${o.order_number||o.id}\n客戶：${o.customer_name||''}\n電話：${o.customer_phone||''}\n\n商品：\n${items.map(i=>`${i.product_name} × ${i.quantity}　$${i.subtotal}`).join('\n')||'—'}\n\n訂單金額：$${Number(o.total_amount||0).toLocaleString()}\n訂單狀態：${statusText[o.status]||o.status}\n付款狀態：${payText[o.payment_status]||o.payment_status}\n出貨狀態：${shipText[o.shipment_status]||o.shipment_status}\n備註：${o.customer_note||'—'}`)}
db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT')location.reload()});
init();
</script></body></html>
