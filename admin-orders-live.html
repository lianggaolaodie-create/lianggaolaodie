<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>老爹．涼糕｜線上下單管理後台</title>
<script>location.replace('admin-orders-fixed-v3.html?v=20260930-daily-restore-2'+location.search+location.hash)</script>
</head>
<body>正在開啟完整後台…
<script>
/* ADMIN_DAILY_SETTINGS_FIX_20260930 */
(function(){
  const escD=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const dEl=()=>document.getElementById('dailyDate');
  const msg=(t,err)=>{const e=document.getElementById('dailyMsg');if(e)e.innerHTML=t?'<div class="notice '+(err?'err':'')+'">'+escD(t)+'</div>':'';};
  async function loadDaily(){
    const date=(dEl()&&dEl().value)||new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});
    if(dEl())dEl().value=date;
    msg('');
    try{
      const [s,r,f,m]=await Promise.all([
        db.from('daily_order_settings').select('ordering_enabled').eq('order_date',date).order('id',{ascending:false}).limit(1).maybeSingle(),
        db.from('daily_order_regions').select('id,region_name,enabled').eq('order_date',date).order('id'),
        db.from('daily_order_flavors').select('id,flavor_id,flavor_name,price,quantity,enabled,product_name').eq('order_date',date).order('id'),
        db.from('flavors').select('id,name,price,product_name,enabled').eq('enabled',true).order('id')
      ]);
      if(s.error||r.error||f.error||m.error)throw new Error((s.error||r.error||f.error||m.error).message);
      const en=document.getElementById('dailyEnabled');if(en)en.value=s.data?String(s.data.ordering_enabled):'true';
      const rr=r.data||[];
      document.getElementById('dailyRegions').innerHTML=rr.length?rr.map(x=>'<div class="row"><span class="grow">'+escD(x.region_name)+'</span><label><input type="checkbox" data-region-id="'+x.id+'" '+(x.enabled?'checked':'')+'> 開放</label><button class="btn red small" data-region-del="'+x.id+'">刪除</button></div>').join(''):'<div class="muted">今天尚未設定開放地區。</div>';
      const df=f.data||[], byId=new Map(df.map(x=>[String(x.flavor_id),x]));
      document.getElementById('dailyFlavors').innerHTML=(m.data||[]).map(x=>{const v=byId.get(String(x.id));return '<div class="row"><label class="grow"><input type="checkbox" data-flavor-id="'+x.id+'" '+(v&&v.enabled?'checked':'')+'> '+escD(x.name)+'</label><label>價格 <input style="width:90px" type="number" min="0" data-flavor-price="'+x.id+'" value="'+Number(v?v.price:x.price||0)+'"></label><label>數量 <input style="width:75px" type="number" min="0" data-flavor-qty="'+x.id+'" value="'+Number(v?v.quantity:0)+'"></label></div>';}).join('')||'<div class="muted">目前沒有啟用中的口味。</div>';
      document.querySelectorAll('[data-region-del]').forEach(b=>b.onclick=async()=>{if(!confirm('確定刪除這個開放地區嗎？'))return;const z=await db.from('daily_order_regions').delete().eq('id',b.dataset.regionDel);if(z.error)msg('刪除地區失敗：'+z.error.message,true);else loadDaily();});
    }catch(e){msg('讀取每日開放設定失敗：'+(e.message||e),true);}
  }
  async function saveDaily(){
    const date=(dEl()&&dEl().value);if(!date)return;
    const btn=document.getElementById('dailySave');if(btn)btn.disabled=true;msg('儲存中…');
    try{
      const enabled=document.getElementById('dailyEnabled').value==='true';
      const old=await db.from('daily_order_settings').select('id').eq('order_date',date).order('id',{ascending:false}).limit(1).maybeSingle();
      if(old.error)throw old.error;
      const sr=old.data?await db.from('daily_order_settings').update({ordering_enabled:enabled,updated_at:new Date().toISOString()}).eq('id',old.data.id):await db.from('daily_order_settings').insert({order_date:date,ordering_enabled:enabled});
      if(sr.error)throw sr.error;
      const checks=[...document.querySelectorAll('[data-region-id]')];
      for(const c of checks){const z=await db.from('daily_order_regions').update({enabled:c.checked}).eq('id',c.dataset.regionId);if(z.error)throw z.error;}
      await db.from('daily_order_flavors').delete().eq('order_date',date);
      const fs=[...document.querySelectorAll('[data-flavor-id]:checked')];
      if(fs.length){
        const rows=fs.map(c=>{const id=c.dataset.flavorId;return {order_date:date,flavor_id:Number(id),flavor_name:c.parentElement.textContent.replace(/^\s*/,'').trim(),price:Number((document.querySelector('[data-flavor-price="'+id+'"]')||{}).value||0),quantity:Number((document.querySelector('[data-flavor-qty="'+id+'"]')||{}).value||0),enabled:true};});
        const mr=await db.from('daily_order_flavors').insert(rows);if(mr.error)throw mr.error;
      }
      msg('已儲存 '+date+' 的每日開放設定。');
      await loadDaily();
    }catch(e){msg('儲存失敗：'+(e.message||e),true);}finally{if(btn)btn.disabled=false;}
  }
  function addRegion(){
    const date=(dEl()&&dEl().value);const name=prompt('臨時加開地區：請輸入地區，例如：嘉義、雲林、彰化');if(!name||!name.trim())return;
    db.from('daily_order_regions').insert({order_date:date,region_name:name.trim(),enabled:true}).then(r=>{if(r.error)msg('臨時加開地區失敗：'+r.error.message,true);else loadDaily();});
  }
  document.addEventListener('DOMContentLoaded',function(){
    const d=dEl();if(d){d.value=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});d.addEventListener('change',loadDaily);}
    const s=document.getElementById('dailySave');if(s)s.addEventListener('click',saveDaily);
    const a=document.getElementById('addDailyRegion');if(a)a.addEventListener('click',addRegion);
    const nav=document.querySelectorAll('[data-page]');nav.forEach(b=>b.addEventListener('click',function(){if(this.dataset.page==='daily')setTimeout(loadDaily,0);}));
    setTimeout(loadDaily,300);
  });
})();
</script>
</body>
</html>
