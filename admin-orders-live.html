<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>老爹．涼糕｜訂單管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.shell{max-width:1100px;margin:auto;padding:12px}.hidden{display:none!important}.top,.head,.sectiontitle,.order-top,.actions{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:21px;font-weight:900}.btn{border:0;border-radius:10px;padding:10px 14px;background:#8d5939;color:#fff;font-weight:900;cursor:pointer;touch-action:manipulation}.btn.gray{background:#6d625b}.btn.red{background:#e94444}.btn.small{padding:8px 11px;font-size:13px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.nav button{border:0;border-radius:12px;padding:12px 8px;background:#ebe4de;color:#5a4940;font-weight:900;font-size:14px;cursor:pointer}.nav button.active{background:#8d5939;color:#fff}.head{margin:10px 0}.head h2{margin:0;font-size:24px}.date,.search,.field input,.field select{border:1px solid #d9cec6;border-radius:10px;padding:11px;background:#fff;font:inherit}.search{width:100%}.searchrow{display:flex;gap:8px;margin:8px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat,.card,.section{background:#fff;border:1px solid #e4dad3;border-radius:15px;padding:12px}.stat{text-align:center}.stat b{display:block;font-size:25px}.section{margin:10px 0}.pickup{background:#fff2f3}.home{background:#eef8ff}.muted{color:#786e68;font-size:13px}.order{background:#fff;border:1px solid #e8ddd6;border-radius:13px;padding:11px;margin:8px 0}.status{border-radius:8px;padding:5px 8px;color:#fff;font-size:12px;font-weight:900;white-space:nowrap}.paid{background:#12b86a}.pending{background:#f23a43}.stored{background:#168fe4}.done{background:#168fe4}.flavors{display:flex;flex-wrap:wrap;gap:6px;background:#fff4f4;border-radius:9px;padding:8px;margin:7px 0}.chip{border-radius:7px;padding:5px 8px;font-size:12px;font-weight:800;background:#ffe1c5}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:999}.modalbox{background:#fff;border-radius:16px;padding:18px;width:min(440px,100%)}.modalbox select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font:inherit}.modalactions{display:flex;gap:8px;margin-top:12px}.modalactions button{flex:1}.msg{padding:10px;border-radius:10px;background:#fff0ef;color:#a43b35;margin-top:8px}.login{max-width:520px;margin:60px auto}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.customer{background:#fff;border:1px solid #e8ddd6;border-radius:12px;padding:11px;margin:8px 0}@media(max-width:700px){.brand{font-size:18px}.stats{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start}.actions{flex-wrap:wrap}.nav button{font-size:13px}}
</style>
</head>
<body>
<div id="login" class="shell login"><div class="card"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><p class="muted">訂單、個資與狀態管理</p><form id="loginForm"><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" id="loginBtn" type="submit">登入</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="shell hidden"><div class="top"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><button class="btn gray small" id="logout">登出</button></div><div class="nav"><button class="active" data-page="orders">🧾 訂單管理</button><button data-page="customers">👤 個資管理</button><button data-page="daily">📅 每日開放設定</button></div>
<section id="orders"><div class="head"><h2>訂單管理</h2><div><input id="date" class="date" type="date"> <button class="btn gray" id="reload">重新整理</button></div></div><div class="stats"><div class="stat">🧾<div>今日訂單</div><b id="todayCount">0</b></div><div class="stat">💰<div>待確認匯款</div><b id="pendingCount">0</b></div><div class="stat">✅<div>已付款</div><b id="paidCount">0</b></div><div class="stat">🚚<div>已寄放</div><b id="storedCount">0</b></div></div><div class="section pickup"><div class="sectiontitle"><span>🏪 超商寄放客戶資料 <b style="color:#e33">(需先付款)</b></span><span>共 <b id="pc">0</b> 筆</span></div><div class="searchrow"><input id="ps" class="search" placeholder="搜尋訂單編號／姓名／電話／門市"><button class="btn" id="pSearch">搜尋</button></div><div id="pickupList"></div></div><div class="section home"><div class="sectiontitle"><span>🏠 送到府訂單 <b style="color:#1674c5">(貨到付款)</b></span><span>共 <b id="hc">0</b> 筆</span></div><div class="searchrow"><input id="hs" class="search" placeholder="搜尋訂單編號／姓名／電話／地址"><button class="btn" id="hSearch">搜尋</button></div><div id="homeList"></div></div><div id="orderMsg"></div></section>
<section id="customers" class="hidden"><div class="head"><h2>個資管理</h2></div><div class="muted">這裡可以查看、編輯、刪除客戶個資；刪除個資不刪除訂單。</div><div class="section pickup"><div class="sectiontitle"><span>🏪 超商寄放客戶資料</span><span>共 <b id="cpc">0</b> 筆</span></div><div class="searchrow"><input id="cps" class="search" placeholder="搜尋訂單編號／姓名／電話／門市"><button class="btn" id="cpSearch">搜尋</button></div><div id="cpList"></div></div><div class="section home"><div class="sectiontitle"><span>🏠 送到府客戶資料</span><span>共 <b id="chc">0</b> 筆</span></div><div class="searchrow"><input id="chs" class="search" placeholder="搜尋訂單編號／姓名／電話／地址"><button class="btn" id="chSearch">搜尋</button></div><div id="chList"></div></div></section>
<section id="daily" class="hidden"><div class="card"><h2>每日開放設定</h2><p class="muted">後台入口正常保留。此版先不修改既有每日開放資料。</p></div></section></div>
<div id="statusModal" class="modal hidden"><div class="modalbox"><h3>編輯訂單狀態</h3><select id="statusSelect"></select><div class="modalactions"><button class="btn gray" id="cancelStatus">取消</button><button class="btn" id="saveStatus">儲存狀態</button></div></div></div>
<div id="viewModal" class="modal hidden"><div class="modalbox"><h3>訂單詳細資料</h3><div id="viewBody"></div><div class="modalactions"><button class="btn gray" id="closeView">關閉</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){'use strict';
const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]});
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});
let pickup=[],home=[],pickupItems=new Map(),homeItems=new Map(),customerMap=new Map(),editing=null;
function msg(text){$('orderMsg').innerHTML=text?'<div class="msg">'+esc(text)+'</div>':''}function loginMsg(text){$('loginMsg').innerHTML=text?'<div class="msg">'+esc(text)+'</div>':''}
async function checkAccess(user){const r=await db.from('admin_profiles').select('enabled').eq('user_id',user.id).maybeSingle();if(r.error)return r.error.message;if(!r.data||!r.data.enabled)return '管理員帳號無管理權限';return ''}
function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('date').value=today();loadAll()}
async function doLogin(e){e.preventDefault();const b=$('loginBtn');b.disabled=true;b.textContent='登入中…';loginMsg('');try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){loginMsg('登入失敗：'+r.error.message);return}const er=await checkAccess(r.data.user);if(er){await db.auth.signOut();loginMsg(er);return}showApp()}catch(e){loginMsg('登入失敗：'+(e&&e.message?e.message:String(e)))}finally{b.disabled=false;b.textContent='登入'}}
function statusClass(s){if(s==='已付款')return 'paid';if(s==='待確認匯款'||s==='pending')return 'pending';if(s==='已寄放')return 'stored';return 'done'}
function normalizePickup(x){const c=customerMap.get(x.customer_id)||{};return Object.assign({},x,{type:'pickup',name:c.name||'',phone:c.phone||'',product:Number(x.merchandise_total||x.product_total||0),total:Number(x.total_amount||0)})}
function normalizeHome(x,priv){const c=priv||{};return Object.assign({},x,{type:'home',name:c.customer_name||'',phone:c.customer_phone||'',address:c.delivery_address||'',product:Number(x.product_total||0),total:Number(x.total_amount||0)})}
async function loadAll(){msg('');const p=await db.from('cooling_pickup_orders').select('*').order('created_at',{ascending:false}).limit(300);const h=await db.from('orders').select('id,order_number,delivery_date,product_total,total_amount,status,created_at,pickup_type').eq('pickup_type','home_delivery').order('created_at',{ascending:false}).limit(300);if(p.error||h.error){msg('讀取訂單失敗：'+(p.error?p.error.message:h.error.message));return}const pr=p.data||[],hr=h.data||[];customerMap=new Map();const ids=pr.map(x=>x.customer_id).filter(Boolean);if(ids.length){const c=await db.from('order_customers').select('id,name,phone').in('id',ids);if(c.error){msg('讀取客戶資料失敗：'+c.error.message);return}(c.data||[]).forEach(x=>customerMap.set(x.id,x))}pickup=pr.map(normalizePickup);const hids=hr.map(x=>x.id);const privMap=new Map();if(hids.length){const q=await db.from('order_private').select('order_id,customer_name,customer_phone,delivery_address').in('order_id',hids);if(!q.error)(q.data||[]).forEach(x=>privMap.set(x.order_id,x))}home=hr.map(x=>normalizeHome(x,privMap.get(x.id)));pickupItems=new Map();homeItems=new Map();if(pr.length){const q=await db.from('cooling_pickup_order_items').select('order_id,flavor_name,quantity').in('order_id',pr.map(x=>x.id));if(!q.error)(q.data||[]).forEach(x=>{if(!pickupItems.has(x.order_id))pickupItems.set(x.order_id,[]);pickupItems.get(x.order_id).push(x)})}if(hids.length){const q=await db.from('order_items').select('order_id,flavor_name,quantity').in('order_id',hids);if(!q.error)(q.data||[]).forEach(x=>{if(!homeItems.has(x.order_id))homeItems.set(x.order_id,[]);homeItems.get(x.order_id).push(x)})}renderOrders();renderCustomers()}
function itemHtml(list){if(!list.length)return '<span class="muted">未找到口味資料</span>';return list.map(x=>'<span class="chip">'+esc(x.flavor_name||'')+' ('+Number(x.quantity||0)+'盒)</span>').join('')}
function orderCard(o){const list=o.type==='pickup'?(pickupItems.get(o.id)||[]):(homeItems.get(o.id)||[]);const qty=list.reduce((n,x)=>n+Number(x.quantity||0),0);const place=o.type==='home'?o.address:[o.convenience_store,o.store_name].filter(Boolean).join(' ')||'—';const payment=o.type==='pickup'&&o.payment_last5?'<span class="chip">匯款後五碼 '+esc(o.payment_last5)+'</span>':'';return '<div class="order"><div class="order-top"><div><b>訂單編號　'+esc(o.order_number||'')+'</b><div class="muted">訂購時間　'+new Date(o.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+'</div></div><span class="status '+statusClass(o.status)+'">'+esc(o.status||'待確認')+'</span></div><div style="margin:8px 0;line-height:1.7">👤 <b>'+esc(o.name||'')+'</b>　'+esc(o.phone||'')+'<br>📍 '+esc(place)+' '+payment+'</div><div class="flavors"><b>口味 (數量)</b> '+itemHtml(list)+'</div><div class="muted">涼糕數量　<b>'+qty+' 盒</b>　｜　商品小計　<b>$'+o.product.toLocaleString()+'</b>　｜　應付總額　<b>$'+o.total.toLocaleString()+'</b>'+(o.type==='home'?'　<span class="chip">貨到付款</span>':'')+'</div><div class="actions"><button class="btn small" data-action="view" data-id="'+esc(o.id)+'">查看</button><button class="btn small" data-action="edit" data-id="'+esc(o.id)+'">編輯狀態</button><button class="btn red small" data-action="delete" data-id="'+esc(o.id)+'">🗑 刪除</button></div></div>'}
function renderOrders(){const d=$('date').value||today();const q1=$('ps').value.trim().toLowerCase(),q2=$('hs').value.trim().toLowerCase();const match=(o,q)=>!q||[o.order_number,o.name,o.phone,o.convenience_store,o.store_name,o.address,o.payment_last5].join(' ').toLowerCase().includes(q);const p=pickup.filter(o=>o.order_date===d&&match(o,q1)),h=home.filter(o=>o.delivery_date===d&&match(o,q2));$('pc').textContent=p.length;$('hc').textContent=h.length;$('pickupList').innerHTML=p.map(orderCard).join('')||'<div class="muted">目前沒有超商寄放訂單。</div>';$('homeList').innerHTML=h.map(orderCard).join('')||'<div class="muted">目前沒有送到府訂單。</div>';const all=pickup.concat(home);$('todayCount').textContent=all.filter(o=>(o.order_date||o.delivery_date)===d).length;$('pendingCount').textContent=all.filter(o=>o.status==='待確認匯款').length;$('paidCount').textContent=all.filter(o=>o.status==='已付款').length;$('storedCount').textContent=all.filter(o=>o.status==='已寄放').length}
function findOrder(id){return pickup.concat(home).find(o=>String(o.id)===String(id))}
function customerCard(o){const place=o.type==='home'?o.address:[o.convenience_store,o.store_name].filter(Boolean).join(' ')||'—';return '<div class="customer"><b>訂單編號　'+esc(o.order_number||'')+'</b><div style="margin-top:6px">👤 '+esc(o.name||'')+'　'+esc(o.phone||'')+'</div><div>📍 '+esc(place)+'</div>'+(o.payment_last5?'<div>💳 匯款後五碼 '+esc(o.payment_last5)+'</div>':'')+'<div class="actions"><button class="btn small" data-customer-action="edit" data-id="'+esc(o.id)+'">編輯</button><button class="btn red small" data-customer-action="delete" data-id="'+esc(o.id)+'">🗑 刪除</button></div></div>'}
function renderCustomers(){const q1=$('cps').value.trim().toLowerCase(),q2=$('chs').value.trim().toLowerCase();const p=pickup.filter(o=>!q1||[o.order_number,o.name,o.phone,o.convenience_store,o.store_name,o.payment_last5].join(' ').toLowerCase().includes(q1));const h=home.filter(o=>!q2||[o.order_number,o.name,o.phone,o.address].join(' ').toLowerCase().includes(q2));$('cpc').textContent=p.length;$('chc').textContent=h.length;$('cpList').innerHTML=p.map(customerCard).join('')||'<div class="muted">目前沒有超商寄放個資。</div>';$('chList').innerHTML=h.map(customerCard).join('')||'<div class="muted">目前沒有送到府個資。</div>'}
function openView(o){const list=o.type==='pickup'?(pickupItems.get(o.id)||[]):(homeItems.get(o.id)||[]);$('viewBody').innerHTML='<p><b>訂單編號：</b>'+esc(o.order_number||'')+'</p><p><b>姓名：</b>'+esc(o.name||'')+'</p><p><b>電話：</b>'+esc(o.phone||'')+'</p><p><b>地址／門市：</b>'+esc(o.type==='home'?o.address:[o.convenience_store,o.store_name].filter(Boolean).join(' ')||'—')+'</p><p><b>口味：</b>'+itemHtml(list)+'</p><p><b>應付總額：</b>$'+o.total.toLocaleString()+'</p>';$('viewModal').classList.remove('hidden')}
function openEdit(o){editing=o;const opts=o.type==='pickup'?['待確認匯款','已付款','已寄放']:['待配送','配送中','已送達'];$('statusSelect').innerHTML=opts.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');if(opts.includes(o.status))$('statusSelect').value=o.status;$('statusModal').classList.remove('hidden')}
async function saveEdit(){if(!editing)return;const table=editing.type==='pickup'?'cooling_pickup_orders':'orders';const r=await db.from(table).update({status:$('statusSelect').value}).eq('id',editing.id);if(r.error){alert('狀態更新失敗：'+r.error.message);return}$('statusModal').classList.add('hidden');editing=null;await loadAll()}
async function removeOrder(o){if(!confirm('確定要刪除訂單 '+(o.order_number||'')+' 嗎？'))return;if(o.type==='pickup'){const a=await db.from('cooling_pickup_order_items').delete().eq('order_id',o.id);if(a.error){alert('刪除訂單明細失敗：'+a.error.message);return}const r=await db.from('cooling_pickup_orders').delete().eq('id',o.id);if(r.error){alert('刪除訂單失敗：'+r.error.message);return}}else{const a=await db.from('order_items').delete().eq('order_id',o.id);if(a.error){alert('刪除訂單明細失敗：'+a.error.message);return}await db.from('order_private').delete().eq('order_id',o.id);const r=await db.from('orders').delete().eq('id',o.id);if(r.error){alert('刪除訂單失敗：'+r.error.message);return}}await loadAll()}
async function editCustomer(o){const name=prompt('修改姓名',o.name||'');if(name===null)return;const phone=prompt('修改電話',o.phone||'');if(phone===null)return;if(o.type==='pickup'){if(!o.customer_id){alert('找不到客戶資料');return}const r=await db.from('order_customers').update({name:name.trim(),phone:phone.trim()}).eq('id',o.customer_id);if(r.error){alert('更新個資失敗：'+r.error.message);return}}else{const r=await db.from('order_private').update({customer_name:name.trim(),customer_phone:phone.trim()}).eq('order_id',o.id);if(r.error){alert('更新個資失敗：'+r.error.message);return}}await loadAll()}
async function deleteCustomer(o){if(!confirm('確定刪除這筆客戶個資嗎？訂單本身會保留。'))return;if(o.type==='pickup'){if(!o.customer_id)return;const a=await db.from('cooling_pickup_orders').update({customer_id:null}).eq('customer_id',o.customer_id);if(a.error){alert('解除個資關聯失敗：'+a.error.message);return}const r=await db.from('order_customers').delete().eq('id',o.customer_id);if(r.error){alert('刪除個資失敗：'+r.error.message);return}}else{const r=await db.from('order_private').delete().eq('order_id',o.id);if(r.error){alert('刪除個資失敗：'+r.error.message);return}}await loadAll()}
$('loginForm').addEventListener('submit',doLogin);$('reload').addEventListener('click',loadAll);$('pSearch').addEventListener('click',renderOrders);$('hSearch').addEventListener('click',renderOrders);$('cpSearch').addEventListener('click',renderCustomers);$('chSearch').addEventListener('click',renderCustomers);$('ps').addEventListener('input',renderOrders);$('hs').addEventListener('input',renderOrders);$('cps').addEventListener('input',renderCustomers);$('chs').addEventListener('input',renderCustomers);$('date').addEventListener('change',renderOrders);$('logout').addEventListener('click',async()=>{await db.auth.signOut();location.reload()});document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',function(){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));this.classList.add('active');['orders','customers','daily'].forEach(id=>$(id).classList.add('hidden'));$(this.dataset.page).classList.remove('hidden')}));$('cancelStatus').addEventListener('click',()=>{$('statusModal').classList.add('hidden');editing=null});$('saveStatus').addEventListener('click',saveEdit);$('closeView').addEventListener('click',()=>$('viewModal').classList.add('hidden'));['pickupList','homeList'].forEach(id=>$(id).addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const o=findOrder(b.dataset.id);if(!o)return;if(b.dataset.action==='view')openView(o);else if(b.dataset.action==='edit')openEdit(o);else if(b.dataset.action==='delete')await removeOrder(o)}));['cpList','chList'].forEach(id=>$(id).addEventListener('click',async e=>{const b=e.target.closest('button[data-customer-action]');if(!b)return;const o=findOrder(b.dataset.id);if(!o)return;if(b.dataset.customerAction==='edit')await editCustomer(o);else await deleteCustomer(o)}));db.auth.getSession().then(async r=>{if(r.data.session){const err=await checkAccess(r.data.session.user);if(!err)showApp()}});
})();
</script>
</body>
</html>
