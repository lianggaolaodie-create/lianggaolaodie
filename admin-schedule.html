<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜餐車行程管理</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0000000a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d9cdc1;border-radius:10px;font:inherit}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{border:1px solid #eadfd4;border-radius:10px;padding:10px}.item{border:1px solid #eadfd4;border-radius:13px;padding:13px;margin:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:10px 14px;background:#9b5c38;color:#fff;font-weight:800;cursor:pointer}.danger{background:#a32e29}.secondary{background:#6b625c}.edit{background:#b57a45}.small{font-size:13px;color:#75685f}.price{font-size:13px;color:#75685f;margin-top:4px}.msg{padding:12px;border-radius:10px;background:#f6eee7;margin-top:10px}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}.hidden{display:none}@media(max-width:650px){.grid,.checks{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>📅 餐車／擺攤行程管理</h1><div id="who" class="small">尚未登入</div></div><div id="login" class="card"><h2>管理員登入</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn">登入</button><div id="msg"></div></div><main id="app" class="hidden"><div class="card"><h2>🚚 涼糕餐車</h2><div class="small">獨立管理餐車行程；每個口味的價格使用「商品」目前設定的價格。</div><div class="grid"><div class="field"><label>📅 出攤日期</label><input id="ftDate" type="date"></div><div class="field"><label>📍 服務地區</label><input id="ftRegion" placeholder="例如：桃園全區（不包含復興鄉）"></div><div class="field"><label>🕐 出攤時間</label><input id="ftStart" type="time"></div><div class="field"><label>🕐 結束時間</label><input id="ftEnd" type="time"></div></div><div class="field"><label>🍡 當日販售口味</label><div id="ftFlavors" class="checks">讀取中…</div></div><button id="addFt">新增涼糕餐車行程</button><div id="ftMsg"></div><div id="ftList"></div></div><div class="card"><h2>🏪 擺攤</h2><div class="small">擺攤獨立管理；不顯示價格。</div><div class="grid"><div class="field"><label>📅 出攤日期</label><input id="stDate" type="date"></div><div class="field"><label>📍 出攤地點／服務地區</label><input id="stRegion" placeholder="例如：萬華雙和市場"></div><div class="field"><label>🕐 出攤時間</label><input id="stStart" type="time"></div><div class="field"><label>🕐 結束時間</label><input id="stEnd" type="time"></div></div><div class="field"><label>🍡 當日販售口味</label><div id="stFlavors" class="checks">讀取中…</div></div><button id="addSt">新增擺攤行程</button><div id="stMsg"></div><div id="stList"></div></div><div class="card"><button class="secondary" id="refresh">重新整理</button> <button class="secondary" id="logout">登出</button></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});let flavors=[];function ids(box){return [...$(box).querySelectorAll('input:checked')].map(x=>Number(x.value))}function renderFlavors(){['ftFlavors','stFlavors'].forEach(id=>$(id).innerHTML=flavors.length?flavors.map(f=>`<label class="check"><input type="checkbox" value="${f.id}"> ${esc(f.name)}<span class="small">${id==='ftFlavors'?' · $'+Number(f.price||0)+'/盒':''}</span></label>`).join(''):'目前沒有啟用中的口味。')}async function loadFlavors(){const r=await sb.from('flavors').select('id,name,price').eq('enabled',true).order('id');if(r.error)return $('ftFlavors').textContent=$('stFlavors').textContent=r.error.message;flavors=r.data||[];renderFlavors()}async function open(user){const r=await sb.from('admin_profiles').select('role,enabled,food_truck_schedule_enabled,can_manage_food_truck_schedule').eq('user_id',user.id).maybeSingle();if(r.error||!r.data||!r.data.enabled||!(r.data.role==='super_admin'||r.data.food_truck_schedule_enabled===true||r.data.can_manage_food_truck_schedule===true)){return $('msg').innerHTML='<div class="msg error">此帳號目前沒有「餐車／擺攤行程」權限。</div>'}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='已登入 · 獨立餐車／擺攤行程管理';$('ftDate').value=today();$('stDate').value=today();await Promise.all([loadFlavors(),load()])}async function saveLinks(scheduleId,selected){const d=await sb.from('food_truck_schedule_flavors').delete().eq('schedule_id',scheduleId);if(d.error)throw d.error;if(selected.length){const q=await sb.from('food_truck_schedule_flavors').insert(selected.map(flavor_id=>({schedule_id:scheduleId,flavor_id})));if(q.error)throw q.error}}async function add(type){const p=type==='food_truck'?'ft':'st';const date=$(p+'Date').value||today(),region=$(p+'Region').value.trim(),start=$(p+'Start').value||null,end=$(p+'End').value||null;if(!region)return $(p+'Msg').innerHTML='<div class="msg error">請填寫服務地區。</div>';const r=await sb.from('food_truck_schedules').insert({schedule_date:date,schedule_type:type,title:type==='food_truck'?'涼糕餐車':'擺攤',region,start_time:start,end_time:end,note:null,enabled:true}).select('id').single();if(r.error)return $(p+'Msg').innerHTML='<div class="msg error">新增失敗：'+esc(r.error.message)+'</div>';try{await saveLinks(r.data.id,ids(p+'Flavors'))}catch(e){return $(p+'Msg').innerHTML='<div class="msg error">行程已建立，但口味儲存失敗：'+esc(e.message)+'</div>'}$(p+'Msg').innerHTML='<div class="msg ok">行程已新增。</div>';$(p+'Date').value=today();$(p+'Region').value='';$(p+'Start').value='';$(p+'End').value='';await load()}async function edit(id,type){const s=window.scheduleCache[id];if(!s)return;const p=type==='food_truck'?'ft':'st';$(p+'Date').value=s.schedule_date;$(p+'Region').value=s.region||'';$(p+'Start').value=s.start_time||'';$(p+'End').value=s.end_time||'';document.querySelectorAll('#'+p+'Flavors input').forEach(x=>x.checked=(window.flavorCache[id]||[]).includes(Number(x.value)));$(p+'Msg').innerHTML='<div class="msg">正在編輯這筆行程，修改上方內容後按「儲存編輯」。</div>';$(type==='food_truck'?'addFt':'addSt').textContent='儲存編輯';$(type==='food_truck'?'addFt':'addSt').onclick=()=>updateSchedule(id,type)}async function updateSchedule(id,type){const p=type==='food_truck'?'ft':'st',date=$(p+'Date').value||today(),region=$(p+'Region').value.trim(),start=$(p+'Start').value||null,end=$(p+'End').value||null;if(!region)return $(p+'Msg').innerHTML='<div class="msg error">請填寫服務地區。</div>';const r=await sb.from('food_truck_schedules').update({schedule_date:date,region,start_time:start,end_time:end,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return $(p+'Msg').innerHTML='<div class="msg error">儲存失敗：'+esc(r.error.message)+'</div>';try{await saveLinks(id,ids(p+'Flavors'))}catch(e){return $(p+'Msg').innerHTML='<div class="msg error">行程已更新，但口味儲存失敗：'+esc(e.message)+'</div>'}$(p+'Msg').innerHTML='<div class="msg ok">行程已更新。</div>';$(type==='food_truck'?'addFt':'addSt').textContent=type==='food_truck'?'新增涼糕餐車行程':'新增擺攤行程';$(type==='food_truck'?'addFt':'addSt').onclick=()=>add(type);await load()}window.scheduleCache={};window.flavorCache={};async function load(){const r=await sb.from('food_truck_schedules').select('id,schedule_date,schedule_type,region,start_time,end_time,enabled').order('schedule_date',{ascending:false}).order('id',{ascending:false});if(r.error){$('ftList').innerHTML=$('stList').innerHTML='<div class="msg error">'+esc(r.error.message)+'</div>';return}const data=r.data||[],allIds=data.map(x=>x.id);let links=[],fmap={};if(allIds.length){const a=await sb.from('food_truck_schedule_flavors').select('schedule_id,flavor_id').in('schedule_id',allIds);links=a.data||[];const fids=[...new Set(links.map(x=>x.flavor_id))];if(fids.length){const f=await sb.from('flavors').select('id,name,price').in('id',fids);(f.data||[]).forEach(x=>fmap[x.id]=x)}}window.scheduleCache={};window.flavorCache={};data.forEach(s=>{window.scheduleCache[s.id]=s;window.flavorCache[s.id]=links.filter(x=>x.schedule_id===s.id).map(x=>Number(x.flavor_id))});const by={};links.forEach(x=>(by[x.schedule_id]??=[]).push(fmap[x.flavor_id]));function render(rows,type){if(!rows.length)return '<div class="small">目前沒有行程。</div>';return rows.map(s=>{const fs=(by[s.id]||[]).filter(Boolean),time=s.start_time?(s.start_time+(s.end_time?'～'+s.end_time:'')):'未設定';return `<div class="item"><strong>📅 ${esc(s.schedule_date)}</strong><br>📍 ${esc(s.region)}<br>🕐 ${esc(time)}<br>🍡 ${esc(fs.map(f=>f.name).join('、')||'依後台設定')}${type==='food_truck'?`<div class="price">💰 ${esc(fs.map(f=>f.name+' $'+Number(f.price||0)+'/盒').join('、')||'尚未設定')}</div>`:''}<div class="actions" style="margin-top:9px"><button class="edit" onclick="edit(${s.id},'${type}')">✏️ 編輯</button><button class="danger" onclick="del(${s.id})">🗑️ 刪除</button></div></div>`}).join('')}$('ftList').innerHTML=render(data.filter(x=>(x.schedule_type||'food_truck')==='food_truck'),'food_truck');$('stList').innerHTML=render(data.filter(x=>x.schedule_type==='stall'),'stall')}window.del=async id=>{if(!confirm('確定永久刪除此行程？'))return;const d=await sb.from('food_truck_schedule_flavors').delete().eq('schedule_id',id);if(d.error)return alert('刪除口味關聯失敗：'+d.error.message);const r=await sb.from('food_truck_schedules').delete().eq('id',id);if(r.error)return alert('刪除失敗：'+r.error.message);await load()};$('loginBtn').onclick=async()=>{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return $('msg').innerHTML='<div class="msg error">登入失敗：'+esc(r.error.message)+'</div>';open(r.data.user)};$('addFt').onclick=()=>add('food_truck');$('addSt').onclick=()=>add('stall');$('refresh').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};(async()=>{const r=await sb.auth.getUser();if(r.data.user)open(r.data.user);else $('who').textContent='尚未登入'})()})();</script></body></html>
