<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜餐車行程管理</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d9cdc1;border-radius:10px;font:inherit}.field textarea{min-height:80px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{border:1px solid #eadfd4;border-radius:10px;padding:10px}.item{border:1px solid #eadfd4;border-radius:13px;padding:12px;margin:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:10px 14px;background:#9b5c38;color:#fff;font-weight:800}.danger{background:#a32e29}.small{font-size:13px;color:#75685f}@media(max-width:650px){.grid,.checks{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>🚚 涼糕餐車行程管理</h1><div id="who" class="small">登入中…</div></div><div id="login" class="card"><h2>管理員登入</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>密碼</label><input id="password" type="password"></div><button onclick="login()">登入</button><div id="msg"></div></div><main id="app" style="display:none"><div class="card"><h2>新增餐車行程</h2><div class="grid"><div class="field"><label>日期</label><input id="date" type="date"></div><div class="field"><label>地區</label><input id="region" placeholder="例如：桃園全區（不包含復興鄉）"></div><div class="field"><label>開始時間</label><input id="start" type="time"></div><div class="field"><label>結束時間</label><input id="end" type="time"></div></div><div class="field"><label>行程標題</label><input id="title" value="涼糕餐車"></div><div class="field"><label>🍡 當天販售口味</label><div id="flavors" class="checks">讀取中…</div></div><div class="field"><label>備註</label><textarea id="note"></textarea></div><label><input id="enabled" type="checkbox" checked> 開放此行程</label><div class="actions" style="margin-top:10px"><button onclick="add()">新增行程</button><button onclick="load()">重新整理</button><button onclick="logout()">登出</button></div></div><div class="card"><h2>已建立行程</h2><div id="list">讀取中…</div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'})}async function login(){const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return $('msg').textContent='登入失敗：'+error.message;open(data.user)}async function open(user){const{data:p,error}=await sb.from('admin_profiles').select('role,enabled,food_truck_schedule_enabled').eq('user_id',user.id).maybeSingle();if(error||!p||!p.enabled||!(p.role==='super_admin'||p.food_truck_schedule_enabled===true))return $('msg').textContent='此帳號目前沒有「涼糕餐車行程」權限。';$('login').style.display='none';$('app').style.display='block';$('who').textContent='已登入 · 涼糕餐車行程管理';$('date').value=today();await Promise.all([flavors(),load()])}async function flavors(){const{data,error}=await sb.from('flavors').select('id,name,price').eq('enabled',true).order('id');if(error)return $('flavors').textContent=error.message;$('flavors').innerHTML=(data||[]).map(f=>`<label class="check"><input class="fc" type="checkbox" value="${f.id}"> ${esc(f.name)} <span class="small">$${Number(f.price||0)}</span></label>`).join('')||'目前沒有啟用口味'}async function add(){const payload={schedule_date:$('date').value||today(),title:$('title').value.trim()||'涼糕餐車',region:$('region').value.trim(),start_time:$('start').value||null,end_time:$('end').value||null,note:$('note').value.trim()||null,enabled:$('enabled').checked};if(!payload.region)return alert('請輸入地區');const{data,error}=await sb.from('food_truck_schedules').insert(payload).select('id').single();if(error)return alert('新增失敗：'+error.message);const ids=[...document.querySelectorAll('.fc:checked')].map(x=>Number(x.value));if(ids.length){const{error:e}=await sb.from('food_truck_schedule_flavors').insert(ids.map(flavor_id=>({schedule_id:data.id,flavor_id})));if(e)return alert('口味儲存失敗：'+e.message)}alert('餐車行程已新增');load()}async function load(){const{data,error}=await sb.from('food_truck_schedules').select('*').order('schedule_date',{ascending:false}).order('id',{ascending:false});if(error)return $('list').textContent='讀取失敗：'+error.message;if(!data?.length)return $('list').textContent='目前沒有餐車行程';const ids=data.map(x=>x.id);const{data:links}=await sb.from('food_truck_schedule_flavors').select('schedule_id,flavor_id').in('schedule_id',ids);const fids=[...new Set((links||[]).map(x=>x.flavor_id))];const{data:fl}=fids.length?await sb.from('flavors').select('id,name').in('id',fids):{data:[]};const names={};(fl||[]).forEach(f=>names[f.id]=f.name);const by={};(links||[]).forEach(x=>(by[x.schedule_id]??=[]).push(names[x.flavor_id]||''));$('list').innerHTML=data.map(s=>`<div class="item"><strong>${esc(s.title||'涼糕餐車')}</strong><div>${esc(s.schedule_date)} · ${esc(s.region)} · ${esc(s.start_time||'')}${s.end_time?'～'+esc(s.end_time):''}</div><div>🍡 ${esc((by[s.id]||[]).filter(Boolean).join('、')||'尚未設定')}</div><div class="small">${esc(s.note||'')} · ${s.enabled?'開放':'關閉'}</div><div class="actions" style="margin-top:8px"><button class="danger" onclick="del(${s.id})">刪除</button></div></div>`).join('')}async function del(id){if(!confirm('確定要刪除這個餐車行程？'))return;const{error}=await sb.from('food_truck_schedules').delete().eq('id',id);if(error)return alert('刪除失敗：'+error.message);load()}async function logout(){await sb.auth.signOut();location.reload()}(async()=>{const{data}=await sb.auth.getUser();if(data.user)open(data.user);else $('who').textContent='尚未登入'})();</script></body></html>
