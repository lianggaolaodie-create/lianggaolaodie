<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>老爹・涼糕｜餐車／擺攤行程管理</title>
<style>
body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0000000a}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d9cdc1;border-radius:10px;font:inherit;background:#fff}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:block;border:1px solid #eadfd4;border-radius:13px;padding:12px;box-sizing:border-box}.check-top{display:flex;align-items:center;gap:9px;min-width:0}.check-top input[type=checkbox]{width:22px!important;height:22px!important;min-width:22px!important;margin:0;padding:0;flex:0 0 22px}.flavor-name{font-weight:700;line-height:1.45;word-break:break-word}.price-row{display:flex;align-items:center;gap:7px;margin-top:9px}.price-label{font-size:13px;color:#75685f}.price-input{width:120px!important;margin:0;padding:8px!important}.price-input:disabled{opacity:1;color:#2d241e;background:#faf7f2}.item{border:1px solid #eadfd4;border-radius:13px;padding:13px;margin:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;background:#9b5c38;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:not-allowed}.danger{background:#a32e29}.secondary{background:#6b625c}.edit{background:#b57a45}.small{font-size:13px;color:#75685f}.msg{padding:12px;border-radius:10px;background:#f6eee7;margin-top:10px}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}.hidden{display:none}.section-title{font-size:22px;margin:0 0 5px}.section-note{font-size:13px;color:#75685f;margin-bottom:12px}.login-note{margin-top:10px;font-size:13px;color:#75685f;line-height:1.6}.empty{padding:12px;border:1px dashed #d9cdc1;border-radius:12px;color:#75685f}@media(max-width:650px){.grid,.checks{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card"><h1>📅 餐車／擺攤行程管理</h1><div id="who" class="small">尚未登入</div></div>
  <div id="login" class="card">
    <h2>管理員登入</h2>
    <form id="loginForm" autocomplete="on">
      <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required></div>
      <div class="field"><label for="password">密碼</label><input id="password" name="password" type="password" autocomplete="current-password" required></div>
      <button id="loginBtn" type="submit">登入</button>
    </form>
    <div class="login-note">此頁面只管理「餐車／擺攤行程」，不會修改其他後台。</div><div id="msg" aria-live="polite"></div>
  </div>
  <main id="app" class="hidden">
    <div class="card">
      <h2 class="section-title">🚚 涼糕餐車</h2><div class="section-note">餐車只在建立／編輯行程時選擇當日口味；價格使用口味主檔的預設價格，可單獨調整。</div>
      <div class="grid"><div class="field"><label>📅 出攤日期</label><input id="ftDate" type="date"></div><div class="field"><label>📍 服務地區</label><input id="ftRegion" placeholder="例如：桃園全區（不包含復興鄉）"></div><div class="field"><label>🕐 出攤時間</label><input id="ftStart" type="time"></div><div class="field"><label>🕐 結束時間</label><input id="ftEnd" type="time"></div></div>
      <div class="field"><label>🍡 當日販售口味</label><div id="ftFlavors" class="checks">讀取中…</div></div>
      <button id="addFt" type="button">新增涼糕餐車行程</button><div id="ftMsg"></div><div id="ftList"></div>
    </div>
    <div class="card">
      <h2 class="section-title">🏪 擺攤</h2><div class="section-note">擺攤只管理當日口味，不設定也不顯示價格。</div>
      <div class="grid"><div class="field"><label>📅 出攤日期</label><input id="stDate" type="date"></div><div class="field"><label>📍 服務地區</label><input id="stRegion" placeholder="例如：萬華雙和市場"></div><div class="field"><label>🕐 出攤時間</label><input id="stStart" type="time"></div><div class="field"><label>🕐 結束時間</label><input id="stEnd" type="time"></div></div>
      <div class="field"><label>🍡 當日販售口味</label><div id="stFlavors" class="checks">讀取中…</div></div>
      <button id="addSt" type="button">新增擺攤行程</button><div id="stMsg"></div><div id="stList"></div>
    </div>
    <div class="card"><button class="secondary" id="refresh" type="button">重新整理</button> <button class="secondary" id="logout" type="button">登出</button></div>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])), today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});
let flavors=[];window.scheduleCache={};window.flavorCache={};window.priceCache={};
function msg(id,text,cls='msg'){const e=$(id);if(e)e.innerHTML='<div class="'+cls+'">'+esc(text)+'</div>'}
function selected(type){const p=type==='food_truck'?'ft':'st';return [...$(p+'Flavors').querySelectorAll('input[data-flavor]:checked')].map(x=>({flavor_id:Number(x.dataset.flavor),price:type==='food_truck'?Number($(p+'price_'+x.dataset.flavor)?.value||0):null}))}
function renderFlavors(){
$('ftFlavors').innerHTML=flavors.length?flavors.map(f=>'<label class="check"><span class="check-top"><input type="checkbox" data-flavor="'+f.id+'" onchange="togglePrice(\'ft\','+f.id+')"><span class="flavor-name">'+esc(f.name)+'</span></span><span class="price-row"><span class="price-label">每盒</span><input class="price-input" id="ftprice_'+f.id+'" type="number" min="0" step="1" value="'+Number(f.price||0)+'" disabled></span></label>').join(''):'<div class="empty">目前沒有啟用中的口味。</div>';
$('stFlavors').innerHTML=flavors.length?flavors.map(f=>'<label class="check"><span class="check-top"><input type="checkbox" data-flavor="'+f.id+'"><span class="flavor-name">'+esc(f.name)+'</span></span></label>').join(''):'<div class="empty">目前沒有啟用中的口味。</div>';
}
window.togglePrice=(type,id)=>{const e=$(type+'price_'+id),c=$(type+'Flavors').querySelector('input[data-flavor="'+id+'"]');if(e&&c)e.disabled=!c.checked};
async function loadFlavors(){const r=await sb.from('flavors').select('id,name,price').eq('enabled',true).order('id');if(r.error){msg('ftMsg','口味讀取失敗：'+r.error.message,'msg error');return false}flavors=r.data||[];renderFlavors();return true}
async function checkAccess(user){const r=await sb.from('admin_profiles').select('role,enabled,food_truck_schedule_enabled,can_manage_food_truck_schedule').eq('user_id',user.id).maybeSingle();if(r.error)return{ok:false,error:'權限檢查失敗：'+r.error.message};if(!r.data)return{ok:false,error:'找不到此帳號的管理員資料。'};if(!r.data.enabled)return{ok:false,error:'此帳號目前已停用。'};if(!(r.data.role==='super_admin'||r.data.food_truck_schedule_enabled===true||r.data.can_manage_food_truck_schedule===true))return{ok:false,error:'此帳號目前沒有「餐車／擺攤行程」權限。'};return{ok:true}}
async function open(user){const a=await checkAccess(user);if(!a.ok){$('login').classList.remove('hidden');$('app').classList.add('hidden');$('who').textContent='登入成功，但尚未取得餐車後台權限';msg('msg',a.error,'msg error');return false}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='已登入 · 獨立餐車／擺攤行程管理';$('ftDate').value=today();$('stDate').value=today();await Promise.all([loadFlavors(),load()]);return true}
async function saveLinks(scheduleId,type,items){const d=await sb.from('food_truck_schedule_flavors').delete().eq('schedule_id',scheduleId);if(d.error)throw d.error;if(items.length){const rows=items.map(x=>({schedule_id:scheduleId,flavor_id:x.flavor_id,price_per_box:type==='food_truck'?x.price:null}));const q=await sb.from('food_truck_schedule_flavors').insert(rows);if(q.error)throw q.error}}
async function add(type){const p=type==='food_truck'?'ft':'st',date=$(p+'Date').value||today(),region=$(p+'Region').value.trim(),start=$(p+'Start').value||null,end=$(p+'End').value||null,items=selected(type);if(!region)return msg(p+'Msg','請填寫服務地區。','msg error');if(type==='food_truck'&&items.some(x=>x.price<0))return msg(p+'Msg','價格不可小於 0。','msg error');const r=await sb.from('food_truck_schedules').insert({schedule_date:date,schedule_type:type,title:type==='food_truck'?'涼糕餐車':'擺攤',region,start_time:start,end_time:end,note:null,enabled:true}).select('id').single();if(r.error)return msg(p+'Msg','新增失敗：'+r.error.message,'msg error');try{await saveLinks(r.data.id,type,items)}catch(e){return msg(p+'Msg','行程已建立，但口味／價格儲存失敗：'+e.message,'msg error')}msg(p+'Msg','行程已新增。','msg ok');$(p+'Region').value='';$(p+'Start').value='';$(p+'End').value='';await load()}
window.edit=async id=>{const s=window.scheduleCache[id];if(!s)return;const type=s.schedule_type==='stall'?'stall':'food_truck',p=type==='food_truck'?'ft':'st';$(p+'Date').value=s.schedule_date;$(p+'Region').value=s.region||'';$(p+'Start').value=s.start_time||'';$(p+'End').value=s.end_time||'';$(p+'Flavors').querySelectorAll('input[data-flavor]').forEach(x=>{const fid=Number(x.dataset.flavor),checked=window.flavorCache[id]?.includes(fid);x.checked=!!checked;if(type==='food_truck'){const e=$(p+'price_'+fid),v=window.priceCache[id]?.[fid];if(e){e.disabled=!checked;e.value=checked&&v!=null?v:(flavors.find(f=>f.id===fid)?.price||0)}}});msg(p+'Msg','✏️ 已載入編輯內容，修改後按「儲存編輯」。');const b=$(type==='food_truck'?'addFt':'addSt');b.textContent='儲存編輯';b.onclick=()=>updateSchedule(id,type);window.scrollTo({top:0,behavior:'smooth'})};
async function updateSchedule(id,type){const p=type==='food_truck'?'ft':'st',date=$(p+'Date').value||today(),region=$(p+'Region').value.trim(),start=$(p+'Start').value||null,end=$(p+'End').value||null,items=selected(type);if(!region)return msg(p+'Msg','請填寫服務地區。','msg error');msg(p+'Msg','儲存中…');const r=await sb.from('food_truck_schedules').update({schedule_date:date,region,start_time:start,end_time:end,title:type==='food_truck'?'涼糕餐車':'擺攤'}).eq('id',id);if(r.error)return msg(p+'Msg','儲存失敗：'+r.error.message,'msg error');try{await saveLinks(id,type,items)}catch(e){return msg(p+'Msg','行程已更新，但口味／價格儲存失敗：'+e.message,'msg error')}msg(p+'Msg','✅ 行程已更新。','msg ok');const b=$(type==='food_truck'?'addFt':'addSt');b.textContent=type==='food_truck'?'新增涼糕餐車行程':'新增擺攤行程';b.onclick=()=>add(type);await load()}
async function load(){const r=await sb.from('food_truck_schedules').select('id,schedule_date,schedule_type,region,start_time,end_time,enabled').order('schedule_date',{ascending:false}).order('id',{ascending:false});if(r.error){msg('ftMsg',r.error.message,'msg error');msg('stMsg',r.error.message,'msg error');return}const data=r.data||[],ids=data.map(x=>x.id);let links=[];if(ids.length){const a=await sb.from('food_truck_schedule_flavors').select('schedule_id,flavor_id,price_per_box,price,unit_price').in('schedule_id',ids);if(a.error){msg('ftMsg',a.error.message,'msg error');msg('stMsg',a.error.message,'msg error');return}links=a.data||[]}window.scheduleCache={};window.flavorCache={};window.priceCache={};data.forEach(s=>{window.scheduleCache[s.id]=s;window.flavorCache[s.id]=links.filter(x=>x.schedule_id===s.id).map(x=>Number(x.flavor_id));window.priceCache[s.id]={};links.filter(x=>x.schedule_id===s.id).forEach(x=>window.priceCache[s.id][Number(x.flavor_id)]=x.price_per_box??x.price??x.unit_price)});const names={};flavors.forEach(x=>names[x.id]=x.name);const by={};links.forEach(x=>(by[x.schedule_id]??=[]).push(x));function render(list,type){if(!list.length)return '<div class="empty">目前沒有行程。</div>';return list.map(s=>{const fs=(by[s.id]||[]).filter(x=>names[x.flavor_id]),time=s.start_time?(s.start_time+(s.end_time?'～'+s.end_time:'')):'未設定',flavorsText=fs.map(x=>names[x.flavor_id]).join('、')||'尚未設定當日口味',price=type==='food_truck'&&fs.length?'<div class="small" style="margin-top:7px">💰 '+fs.map(x=>names[x.flavor_id]+' $'+Number(x.price_per_box??x.price??x.unit_price??0)+'/盒').join('、')+'</div>':'';return '<div class="item"><strong>📅 '+esc(s.schedule_date)+'</strong><br>📍 '+esc(s.region)+'<br>🕐 '+esc(time)+'<br>🍡 '+esc(flavorsText)+price+'<div class="actions" style="margin-top:9px"><button class="edit" type="button" onclick="edit('+s.id+')">✏️ 編輯</button><button class="danger" type="button" onclick="del('+s.id+')">🗑️ 刪除</button></div></div>'}).join('')}$('ftList').innerHTML=render(data.filter(x=>(x.schedule_type||'food_truck')==='food_truck'),'food_truck');$('stList').innerHTML=render(data.filter(x=>x.schedule_type==='stall'),'stall')}
window.del=async id=>{if(!confirm('確定永久刪除此行程？'))return;const r=await sb.from('food_truck_schedules').delete().eq('id',id);if(r.error)return alert('刪除失敗：'+r.error.message);await load()};
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=$('loginBtn'),email=$('email').value.trim(),password=$('password').value;if(!email||!password)return msg('msg','請輸入 Email 與密碼。','msg error');b.disabled=true;b.textContent='登入中…';msg('msg','正在驗證帳號…');try{const r=await sb.auth.signInWithPassword({email,password});if(r.error){msg('msg','登入失敗：'+r.error.message,'msg error');return}await open(r.data.user)}catch(e){msg('msg','登入發生錯誤：'+(e?.message||e),'msg error')}finally{b.disabled=false;b.textContent='登入'}});
$('addFt').onclick=()=>add('food_truck');$('addSt').onclick=()=>add('stall');$('refresh').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};sb.auth.onAuthStateChange((event)=>{if(event==='SIGNED_OUT')location.reload()});(async()=>{try{const r=await sb.auth.getSession();if(r.data.session)await open(r.data.session.user);else $('who').textContent='尚未登入'}catch(e){msg('msg','無法讀取登入狀態：'+e.message,'msg error')}})();
})();
</script>
</body>
</html>
