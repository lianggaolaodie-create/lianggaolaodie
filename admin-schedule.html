<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>老爹・涼糕｜餐車／擺攤行程管理</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d9cdc1;border-radius:10px;font:inherit}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{border:1px solid #eadfd4;border-radius:13px;padding:12px}.checktop{display:flex;align-items:center;gap:9px}.checktop input{width:22px!important;height:22px!important;min-width:22px!important}.price{width:120px!important;margin-top:8px;padding:8px!important}.item{border:1px solid #eadfd4;border-radius:13px;padding:13px;margin:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:11px 15px;background:#9b5c38;color:#fff;font-weight:800}button:disabled{opacity:.6}.secondary{background:#6b625c}.danger{background:#a32e29}.small{font-size:13px;color:#75685f}.msg{padding:12px;border-radius:10px;background:#f6eee7;margin-top:10px}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}.hidden{display:none}@media(max-width:650px){.grid,.checks{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>📅 餐車／擺攤行程管理</h1><div id="who" class="small">尚未登入</div></div><div id="login" class="card"><h2>管理員登入</h2><form id="loginForm" autocomplete="on" novalidate><div class="field"><label>Email</label><input id="email" name="email" type="email" autocomplete="username" required></div><div class="field"><label>密碼</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button id="loginBtn">登入</button></form><div class="small">此登入區只連接餐車／擺攤行程管理，不會修改其他後台。</div><div id="msg" aria-live="polite"></div></div><main id="app" class="hidden"><div class="card"><h2>🚚 涼糕餐車</h2><div class="grid"><div class="field"><label>📅 出攤日期</label><input id="ftDate" type="date"></div><div class="field"><label>📍 服務地區</label><input id="ftRegion"></div><div class="field"><label>🕐 出攤時間</label><input id="ftStart" type="time"></div><div class="field"><label>🕐 結束時間</label><input id="ftEnd" type="time"></div></div><div class="field"><label>🍡 當日販售口味</label><div id="ftFlavors" class="checks">讀取中…</div></div><button id="addFt" type="button">新增涼糕餐車行程</button><div id="ftMsg"></div><div id="ftList"></div></div><div class="card"><h2>🏪 擺攤</h2><div class="grid"><div class="field"><label>📅 出攤日期</label><input id="stDate" type="date"></div><div class="field"><label>📍 服務地區</label><input id="stRegion"></div><div class="field"><label>🕐 出攤時間</label><input id="stStart" type="time"></div><div class="field"><label>🕐 結束時間</label><input id="stEnd" type="time"></div></div><div class="field"><label>🍡 當日販售口味</label><div id="stFlavors" class="checks">讀取中…</div></div><button id="addSt" type="button">新增擺攤行程</button><div id="stMsg"></div><div id="stList"></div></div><div class="card"><button class="secondary" id="refresh" type="button">重新整理</button> <button class="secondary" id="logout" type="button">登出</button></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){'use strict';let sb,flavors=[],busy=false,editing=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});function show(id,t,c='msg'){const e=$(id);if(e)e.innerHTML='<div class="'+c+'">'+esc(t)+'</div>'}function setBusy(v){busy=v;$('loginBtn').disabled=v;$('loginBtn').textContent=v?'登入中…':'登入';$('email').disabled=v;$('password').disabled=v}function render(){const ft=flavors.map(f=>'<label class="check"><span class="checktop"><input type="checkbox" data-f="'+f.id+'" onchange="window.tp('+f.id+')"><b>'+esc(f.name)+'</b></span><input class="price" id="p_'+f.id+'" type="number" min="0" step="1" value="'+Number(f.price||0)+'" disabled></label>').join('');const st=flavors.map(f=>'<label class="check"><span class="checktop"><input type="checkbox" data-f="'+f.id+'"><b>'+esc(f.name)+'</b></span></label>').join('');$('ftFlavors').innerHTML=ft||'目前沒有啟用中的口味。';$('stFlavors').innerHTML=st||'目前沒有啟用中的口味。'}window.tp=id=>{const c=document.querySelector('#ftFlavors input[data-f="'+id+'"]'),p=$('p_'+id);if(c&&p)p.disabled=!c.checked};async function access(u){const r=await sb.from('admin_profiles').select('role,enabled,food_truck_schedule_enabled,can_manage_food_truck_schedule').eq('user_id',u.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'此帳號目前已停用';if(!(r.data.role==='super_admin'||r.data.food_truck_schedule_enabled||r.data.can_manage_food_truck_schedule))return'此帳號沒有餐車／擺攤行程權限';return null}async function loadFlavors(){const r=await sb.from('flavors').select('id,name,price').eq('enabled',true).order('id');if(r.error){show('ftMsg','口味讀取失敗：'+r.error.message,'msg error');return}flavors=r.data||[];render()}async function load(){const r=await sb.from('food_truck_schedules').select('id,schedule_date,schedule_type,title,region,start_time,end_time,enabled').eq('enabled',true).order('schedule_date',{ascending:false});if(r.error){show('ftMsg','行程讀取失敗：'+r.error.message,'msg error');return}const ids=(r.data||[]).map(x=>x.id);let links=[];if(ids.length){const q=await sb.from('food_truck_schedule_flavors').select('schedule_id,flavor_id,price_per_box').in('schedule_id',ids);if(q.error){show('ftMsg','口味讀取失敗：'+q.error.message,'msg error');return}links=q.data||[]}const by={};links.forEach(x=>(by[x.schedule_id]??=[]).push(x));$('ftList').innerHTML='';$('stList').innerHTML='';(r.data||[]).forEach(s=>{const arr=by[s.id]||[],names=arr.map(x=>{const f=flavors.find(z=>z.id===x.flavor_id);return f?(s.schedule_type==='food_truck'?f.name+' $'+(x.price_per_box??f.price??0):f.name):null}).filter(Boolean);const html='<div class="item"><b>'+esc(s.schedule_date)+'　'+esc(s.region||'')+'</b><div class="small">'+esc((s.start_time||'')+' - '+(s.end_time||''))+'</div><div>'+esc(names.join('、')||'未設定口味')+'</div><div class="actions"><button class="secondary" type="button" onclick="window.ed('+s.id+')">編輯</button><button class="danger" type="button" onclick="window.del('+s.id+')">刪除</button></div></div>';(s.schedule_type==='food_truck'?$('ftList'):$('stList')).insertAdjacentHTML('beforeend',html);window.cache=window.cache||{};window.cache[s.id]=s;window.links=window.links||{};window.links[s.id]=arr})}function picked(type){const p=type==='food_truck'?'ft':'st';return [...$(p+'Flavors').querySelectorAll('input[data-f]:checked')].map(c=>({flavor_id:Number(c.dataset.f),price:type==='food_truck'?Number($('p_'+c.dataset.f).value||0):null}))}async function save(type,id){const p=type==='food_truck'?'ft':'st',d=$(p+'Date').value||today(),region=$(p+'Region').value.trim(),st=$(p+'Start').value||null,en=$(p+'End').value||null;if(!region)return show(p+'Msg','請填寫服務地區。','msg error');const items=picked(type);let sid=id;if(sid){const r=await sb.from('food_truck_schedules').update({schedule_date:d,region,start_time:st,end_time:en,title:type==='food_truck'?'涼糕餐車':'擺攤'}).eq('id',sid);if(r.error)return show(p+'Msg','儲存失敗：'+r.error.message,'msg error');await sb.from('food_truck_schedule_flavors').delete().eq('schedule_id',sid)}else{const r=await sb.from('food_truck_schedules').insert({schedule_date:d,schedule_type:type,title:type==='food_truck'?'涼糕餐車':'擺攤',region,start_time:st,end_time:en,note:null,enabled:true}).select('id').single();if(r.error)return show(p+'Msg','新增失敗：'+r.error.message,'msg error');sid=r.data.id}if(items.length){const q=await sb.from('food_truck_schedule_flavors').insert(items.map(x=>({schedule_id:sid,flavor_id:x.flavor_id,price_per_box:type==='food_truck'?x.price:null})));if(q.error)return show(p+'Msg','口味／價格儲存失敗：'+q.error.message,'msg error')}show(p+'Msg',id?'已更新。':'已新增。','msg ok');editing=null;$(p+'Region').value='';$(p+'Start').value='';$(p+'End').value='';$(p==='ft'?'addFt':'addSt').textContent=p==='ft'?'新增涼糕餐車行程':'新增擺攤行程';$(p==='ft'?'addFt':'addSt').onclick=()=>save(type);await load()}window.ed=async id=>{const s=window.cache[id],a=window.links[id]||[],type=s.schedule_type,p=type==='food_truck'?'ft':'st';$(p+'Date').value=s.schedule_date;$(p+'Region').value=s.region||'';$(p+'Start').value=s.start_time||'';$(p+'End').value=s.end_time||'';$(p+'Flavors').querySelectorAll('input[data-f]').forEach(c=>{const x=a.find(z=>z.flavor_id===Number(c.dataset.f));c.checked=!!x;if(type==='food_truck'){$('p_'+c.dataset.f).disabled=!x;$('p_'+c.dataset.f).value=x?(x.price_per_box??flavors.find(f=>f.id===Number(c.dataset.f))?.price??0):flavors.find(f=>f.id===Number(c.dataset.f))?.price??0}});const b=$(p==='ft'?'addFt':'addSt');b.textContent='儲存編輯';b.onclick=()=>save(type,id);window.scrollTo({top:0,behavior:'smooth'})};window.del=async id=>{if(!confirm('確定刪除此餐車／擺攤行程？'))return;const r=await sb.from('food_truck_schedules').update({enabled:false}).eq('id',id);if(r.error){show('ftMsg','刪除失敗：'+r.error.message,'msg error');return}await load()};async function init(){if(!window.supabase){show('msg','登入元件載入失敗，請重新整理。','msg error');return}sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const s=await sb.auth.getSession();if(s.data.session){const e=await access(s.data.session.user);if(!e){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='已登入 · 獨立餐車／擺攤行程管理';$('ftDate').value=today();$('stDate').value=today();await loadFlavors();await load()}}}$('loginForm').onsubmit=async e=>{e.preventDefault();if(busy)return;setBusy(true);show('msg','正在驗證帳號…');try{const r=await Promise.race([sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value}),new Promise((_,rej)=>setTimeout(()=>rej(new Error('登入連線逾時，請再試一次。')),15000))]);if(r.error)throw r.error;const er=await access(r.data.user);if(er)throw new Error(er);$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='已登入 · 獨立餐車／擺攤行程管理';$('ftDate').value=today();$('stDate').value=today();await loadFlavors();await load()}catch(e){$('login').classList.remove('hidden');$('app').classList.add('hidden');show('msg','登入失敗：'+(e.message||e),'msg error')}finally{setBusy(false)}};$('addFt').onclick=()=>save('food_truck');$('addSt').onclick=()=>save('stall');$('refresh').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};init()})();</script></body></html>
