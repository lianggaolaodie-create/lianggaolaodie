<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜行程管理</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d9cdc1;border-radius:10px;font:inherit}.field textarea{min-height:80px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{border:1px solid #eadfd4;border-radius:10px;padding:10px}.item{border:1px solid #eadfd4;border-radius:13px;padding:12px;margin:9px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:10px 14px;background:#9b5c38;color:#fff;font-weight:800}.danger{background:#a32e29}.secondary{background:#6b625c}.small{font-size:13px;color:#75685f}.tag{display:inline-block;padding:4px 9px;border-radius:99px;background:#f4ebe3;margin-bottom:8px;font-weight:800}.editbox{background:#fcfaf7;border:1px solid #eadfd4;border-radius:14px;padding:14px;margin-top:10px}.price{font-size:13px;color:#75685f;margin-top:4px}@media(max-width:650px){.grid,.checks{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>📅 出攤行程管理</h1><div id="who" class="small">登入中…</div></div><div id="login" class="card"><h2>管理員登入</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>密碼</label><input id="password" type="password"></div><button onclick="login()">登入</button><div id="msg"></div></div><main id="app" style="display:none"><div class="card"><h2>新增行程</h2><div class="field"><label>行程類型</label><select id="type" onchange="typeChanged()"><option value="food_truck">🚚 涼糕餐車</option><option value="stall">🏪 擺攤</option></select></div><div class="grid"><div class="field"><label>📅 出攤日期</label><input id="date" type="date"></div><div class="field"><label>📍 服務地區</label><input id="region" placeholder="例如：桃園全區（不包含復興鄉）"></div><div class="field"><label>🕐 開始時間</label><input id="start" type="time"></div><div class="field"><label>🕐 結束時間</label><input id="end" type="time"></div></div><div class="field"><label>行程標題</label><input id="title" value="涼糕餐車"></div><div class="field"><label>🍡 當日販售口味</label><div id="flavors" class="checks">讀取中…</div></div><div class="field"><label>備註（後台使用）</label><textarea id="note"></textarea></div><label><input id="enabled" type="checkbox" checked> 開放此行程</label><div class="actions" style="margin-top:10px"><button onclick="add()">新增行程</button><button class="secondary" onclick="load()">重新整理</button><button class="secondary" onclick="logout()">登出</button></div></div><div class="card"><h2>🚚 涼糕餐車行程</h2><div id="truckList">讀取中…</div></div><div class="card"><h2>🏪 擺攤行程</h2><div id="stallList">讀取中…</div></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'})}async function login(){const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return $('msg').textContent='登入失敗：'+error.message;open(data.user)}async function open(user){const{data:p,error}=await sb.from('admin_profiles').select('role,enabled,food_truck_schedule_enabled,can_manage_food_truck_schedule').eq('user_id',user.id).maybeSingle();if(error||!p||!p.enabled||!(p.role==='super_admin'||p.food_truck_schedule_enabled===true||p.can_manage_food_truck_schedule===true))return $('msg').textContent='此帳號目前沒有「出攤行程」權限。';$('login').style.display='none';$('app').style.display='block';$('who').textContent='已登入 · 出攤行程管理';$('date').value=today();await Promise.all([flavors(),load()])}async function flavors(){const{data,error}=await sb.from('flavors').select('id,name,price').eq('enabled',true).order('id');if(error)return $('flavors').textContent=error.message;$('flavors').innerHTML=(data||[]).map(f=>`<label class="check"><input class="fc" type="checkbox" value="${f.id}"> ${esc(f.name)} <span class="small">$${Number(f.price||0)}/盒</span></label>`).join('')||'目前沒有啟用口味'}function typeChanged(){$('title').value=$('type').value==='stall'?'擺攤':'涼糕餐車'}function checkedFlavorIds(){return [...document.querySelectorAll('.fc:checked')].map(x=>Number(x.value))}async function saveFlavorLinks(id,ids){await sb.from('food_truck_schedule_flavors').delete().eq('schedule_id',id);if(ids.length){const{error}=await sb.from('food_truck_schedule_flavors').insert(ids.map(flavor_id=>({schedule_id:id,flavor_id})));if(error)throw error}}async function add(){const type=$('type').value;const payload={schedule_date:$('date').value||today(),schedule_type:type,title:$('title').value.trim()||(type==='stall'?'擺攤':'涼糕餐車'),region:$('region').value.trim(),start_time:$('start').value||null,end_time:$('end').value||null,note:$('note').value.trim()||null,enabled:$('enabled').checked};if(!payload.region)return alert('請輸入服務地區');const{data,error}=await sb.from('food_truck_schedules').insert(payload).select('id').single();if(error)return alert('新增失敗：'+error.message);try{await saveFlavorLinks(data.id,checkedFlavorIds())}catch(e){return alert('口味儲存失敗：'+e.message)}alert(type==='stall'?'擺攤行程已新增':'涼糕餐車行程已新增');load()}async function load(){const{data,error}=await sb.from('food_truck_schedules').select('id,schedule_date,schedule_type,title,region,start_time,end_time,note,enabled').order('schedule_date',{ascending:false}).order('id',{ascending:false});if(error){$('truckList').textContent='讀取失敗：'+error.message;$('stallList').textContent='';return}if(!data?.length){$('truckList').innerHTML='<div class="small">目前沒有涼糕餐車行程</div>';$('stallList').innerHTML='<div class="small">目前沒有擺攤行程</div>';return}const ids=data.map(x=>x.id);const{data:links}=await sb.from('food_truck_schedule_flavors').select('schedule_id,flavor_id').in('schedule_id',ids);const fids=[...new Set((links||[]).map(x=>x.flavor_id))];const{data:fl}=fids.length?await sb.from('flavors').select('id,name,price').in('id',fids):{data:[]};const names={};(fl||[]).forEach(f=>names[f.id]=f);const by={};(links||[]).forEach(x=>(by[x.schedule_id]??=[]).push(names[x.flavor_id]));function render(arr){return arr.length?arr.map(s=>{const fs=(by[s.id]||[]).filter(Boolean);return `<div class="item"><span class="tag">${s.schedule_type==='stall'?'🏪 擺攤':'🚚 涼糕餐車'}</span><div><strong>📅 ${esc(s.schedule_date)}</strong> · 📍 ${esc(s.region)}</div><div>🕐 ${esc(s.start_time||'')}${s.end_time?'～'+esc(s.end_time):''}</div><div>🍡 ${esc(fs.map(f=>f.name).join('、')||'尚未設定')}</div>${s.schedule_type!=='stall'?`<div class="price">💰 ${esc(fs.map(f=>`${f.name} $${Number(f.price||0)}/盒`).join('、')||'尚未設定')}</div>`:''}<div class="small">${s.enabled?'開放':'關閉'}</div><div class="actions" style="margin-top:8px"><button onclick="edit(${s.id})">✏️ 編輯</button><button class="danger" onclick="del(${s.id})">刪除</button></div><div id="edit-${s.id}"></div></div>`}).join(''):'<div class="small">目前沒有資料</div>'}const trucks=data.filter(x=>(x.schedule_type||'food_truck')==='food_truck');const stalls=data.filter(x=>x.schedule_type==='stall');$('truckList').innerHTML=render(trucks);$('stallList').innerHTML=render(stalls)}async function edit(id){const{data:s,error}=await sb.from('food_truck_schedules').select('id,schedule_date,schedule_type,title,region,start_time,end_time,note,enabled').eq('id',id).single();if(error)return alert('讀取失敗：'+error.message);const{data:links}=await sb.from('food_truck_schedule_flavors').select('flavor_id').eq('schedule_id',id);const selected=new Set((links||[]).map(x=>Number(x.flavor_id)));const{data:fl}=await sb.from('flavors').select('id,name,price').eq('enabled',true).order('id');const box=$('edit-'+id);box.innerHTML=`<div class="editbox"><h3>✏️ 編輯行程</h3><div class="grid"><div class="field"><label>📅 出攤日期</label><input id="ed-date-${id}" type="date" value="${esc(s.schedule_date)}"></div><div class="field"><label>📍 服務地區</label><input id="ed-region-${id}" value="${esc(s.region)}"></div><div class="field"><label>🕐 開始時間</label><input id="ed-start-${id}" type="time" value="${esc(s.start_time||'')}"></div><div class="field"><label>🕐 結束時間</label><input id="ed-end-${id}" type="time" value="${esc(s.end_time||'')}"></div></div><div class="field"><label>🍡 當日販售口味</label><div class="checks">${(fl||[]).map(f=>`<label class="check"><input class="ef-${id}" type="checkbox" value="${f.id}" ${selected.has(Number(f.id))?'checked':''}> ${esc(f.name)}${s.schedule_type!=='stall'?` <span class="small">$${Number(f.price||0)}/盒</span>`:''}</label>`).join('')||'目前沒有啟用口味'}</div></div><label><input id="ed-enabled-${id}" type="checkbox" ${s.enabled?'checked':''}> 開放此行程</label><div class="actions" style="margin-top:10px"><button onclick="saveEdit(${id})">💾 儲存修改</button><button class="secondary" onclick="$('edit-${id}').innerHTML=''">取消</button></div></div>`}async function saveEdit(id){const payload={schedule_date:$('ed-date-'+id).value,region:$('ed-region-'+id).value.trim(),start_time:$('ed-start-'+id).value||null,end_time:$('ed-end-'+id).value||null,enabled:$('ed-enabled-'+id).checked,updated_at:new Date().toISOString()};if(!payload.region)return alert('請輸入服務地區');const{error}=await sb.from('food_truck_schedules').update(payload).eq('id',id);if(error)return alert('行程儲存失敗：'+error.message);const ids=[...document.querySelectorAll('.ef-'+id+':checked')].map(x=>Number(x.value));try{await saveFlavorLinks(id,ids)}catch(e){return alert('口味儲存失敗：'+e.message)}alert('行程與當日口味已更新');load()}async function del(id){if(!confirm('確定要刪除這個行程？'))return;const{error}=await sb.from('food_truck_schedules').delete().eq('id',id);if(error)return alert('刪除失敗：'+error.message);load()}async function logout(){await sb.auth.signOut();location.reload()}(async()=>{const{data}=await sb.auth.getUser();if(data.user)open(data.user);else $('who').textContent='尚未登入'})();</script></body></html>
