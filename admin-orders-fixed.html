const loginFormEl=document.getElementById('loginForm'),emailEl=document.getElementById('email'),passwordEl=document.getElementById('password'),loginMsgEl=document.getElementById('loginMsg'),loginBtn=loginFormEl.querySelector('button[type=submit],button');loginFormEl.addEventListener('submit',async e=>{e.preventDefault();e.stopPropagation();loginBtn.disabled=true;loginBtn.textContent='登入中…';loginMsgEl.innerHTML='';try{const r=await db.auth.signInWithPassword({email:emailEl.value.trim(),password:passwordEl.value});if(r.error){note('loginMsg','登入失敗：'+r.error.message,true);return}const er=await access(r.data.user);if(er){await db.auth.signOut();note('loginMsg',er,true);return}open()}catch(err){note('loginMsg','登入失敗：'+(err?.message||err),true)}finally{loginBtn.disabled=false;loginBtn.textContent='登入'}});logout.onclick=()=>db.auth.signOut().then(()=>location.reload());

async function loadOrders(){const [p,h]=await Promise.all([db.from('cooling_pickup_orders').select('*').order('created_at',{ascending:false}).limit(300),db.from('orders').select('id,order_number,delivery_date,delivery_region,pickup_type,product_total,pickup_fee,total_amount,status,payment_status,created_at').eq('pickup_type','home_delivery').order('created_at',{ascending:false}).limit(300)]);if(p.error&&h.error)return note('orderMsg','讀取訂單失敗：'+(p.error?.message||h.error?.message),true);const po=p.data||[],ho=h.data||[];const hids=ho.map(x=>x.id);let priv=[],hi=[];if(hids.length){const [a,b]=await Promise.all([db.from('order_private').select('order_id,customer_name,customer_phone,customer_note,delivery_address').in('order_id',hids),db.from('order_items').select('order_id,flavor_id,flavor_name,unit_price,quantity,subtotal').in('order_id',hids)]);priv=a.data||[];hi=b.data||[]}const ppids=po.map(x=>x.id);let pi=[];if(ppids.length){const r=await db.from('cooling_pickup_order_items').select('order_id,flavor_name,unit_price,quantity,line_total').in('order_id',ppids);pi=r.data||[]}const pm=new Map(priv.map(x=>[x.order_id,x]));orders=[...po.map(o=>({...o,source:'pickup',key:'p:'+o.id,ckey:String(o.customer_id),display_status:o.status})),...ho.map(o=>{const x=pm.get(o.id)||{};return {...o,source:'home',key:'h:'+o.id,ckey:'h:'+o.id,order_date:o.delivery_date,address:x.delivery_address||x.pickup_store||'—',merchandise_total:o.product_total,storage_fee:o.pickup_fee||0,customer_name:x.customer_name||'',customer_phone:x.customer_phone||'',display_status:o.status==='pending'?'待配送':o.status}})].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));items=new Map();pi.forEach(x=>{const k='p:'+x.order_id;if(!items.has(k))items.set(k,[]);items.get(k).push(x)});hi.forEach(x=>{const k='h:'+x.order_id;if(!items.has(k))items.set(k,[]);items.get(k).push({flavor_name:x.flavor_name,quantity:x.quantity,unit_price:x.unit_price,line_total:x.subtotal})});const cids=po.map(x=>x.customer_id).filter(Boolean);customers=new Map();if(cids.length){const r=await db.from('order_customers').select('id,name,phone').in('id',cids);(r.data||[]).forEach(c=>customers.set(String(c.id),c))}const d=date.value||today(),day=orders.filter(o=>o.order_date===d);todayCount.textContent=day.length;pendingCount.textContent=orders.filter(o=>o.status==='待確認匯款'||o.status==='pending').length;paidCount.textContent=orders.filter(o=>o.status==='已付款').length;storedCount.textContent=orders.filter(o=>o.status==='已寄放').length;renderOrders()}
function renderOrders(){const d=date.value||today(),ps=(psv.value||'').toLowerCase(),hs=(hsv.value||'').toLowerCase();const p=orders.filter(o=>o.order_date===d&&o.source==='pickup'&&match(o,ps)),h=orders.filter(o=>o.order_date===d&&o.source==='home'&&match(o,hs));pc.textContent=p.length;hc.textContent=h.length;pickupList.innerHTML=p.map(card).join('')||'<div class="muted">目前沒有超商寄放訂單。</div>';homeList.innerHTML=h.map(card).join('')||'<div class="muted">目前沒有送到府訂單。</div>'}
function match(o,q){if(!q)return true;const c=customers.get(o.ckey)||{};return [o.order_number,c.name,c.phone,o.customer_name,o.customer_phone,o.convenience_store,o.store_name,o.address,o.region_name,o.payment_last5].join(' ').toLowerCase().includes(q)}
const psv=$('ps'),hsv=$('hs');psv.oninput=renderOrders;hsv.oninput=renderOrders;date.onchange=loadOrders;reload.onclick=loadOrders;
window.viewOrder=key=>{const o=orders.find(x=>x.key===key);if(o)alert('訂單 '+o.order_number+'\n狀態：'+(o.display_status||o.status)+'\n備註：'+(o.notes||'無'))};window.editOrder=key=>{const o=orders.find(x=>x.key===key);if(!o)return;const s=prompt('修改訂單狀態',o.display_status||o.status);if(s)changeStatus(o,s)};async function changeStatus(o,s){if(o.source==='pickup'){const r=await db.from('cooling_pickup_orders').update({status:s,updated_at:new Date().toISOString()}).eq('id',o.id);if(r.error)return alert(r.error.message)}else{const map={'待配送':'pending','配送中':'delivering','已送達':'delivered','已完成':'completed'};const r=await db.from('orders').update({status:map[s]||s,updated_at:new Date().toISOString()}).eq('id',o.id);if(r.error)return alert(r.error.message)}loadOrders()};window.delOrder=async key=>{const o=orders.find(x=>x.key===key);if(!o||!confirm('確定要刪除這筆訂單嗎？'))return;if(o.source==='pickup'){await db.from('cooling_pickup_order_items').delete().eq('order_id',o.id);const r=await db.from('cooling_pickup_orders').delete().eq('id',o.id);if(r.error)return alert(r.error.message)}else{await db.from('order_items').delete().eq('order_id',o.id);await db.from('order_private').delete().eq('order_id',o.id);const r=await db.from('orders').delete().eq('id',o.id);if(r.error)return alert(r.error.message)}loadOrders()};
async function loadCustomers(){const r=await db.from('order_customers').select('id,name,phone,created_at').order('created_at',{ascending:false}).limit(300);const cs=r.data||[];const ids=cs.map(x=>x.id);let po=[];if(ids.length){const q=await db.from('cooling_pickup_orders').select('id,order_number,customer_id,convenience_store,store_name,store_address,payment_last5,created_at').in('customer_id',ids).order('created_at',{ascending:false});po=q.data||[]}const ho=await db.from('orders').select('id,order_number,delivery_date,created_at').eq('pickup_type','home_delivery').order('created_at',{ascending:false}).limit(300);const hp=ho.data||[];let priv=[];if(hp.length){const q=await db.from('order_private').select('order_id,customer_name,customer_phone,delivery_address').in('order_id',hp.map(x=>x.id));priv=q.data||[]}const latest=new Map();po.forEach(o=>{if(!latest.has(String(o.customer_id)))latest.set(String(o.customer_id),{...o,source:'pickup'})});hp.forEach(o=>{const x=priv.find(v=>v.order_id===o.id);if(x)latest.set('h:'+o.id,{...o,...x,source:'home',store_address:x.delivery_address})});customerRows=cs.map(c=>({...c,order:latest.get(String(c.id))}));const homeRows=hp.map(o=>{const x=priv.find(v=>v.order_id===o.id)||{};return {id:'h:'+o.id,order_number:o.order_number,name:x.customer_name,phone:x.customer_phone,store_address:x.delivery_address,created_at:o.created_at,source:'home'}});customerRows=[...customerRows,...homeRows];renderCustomers()}
function renderCustomers(){const a=(cpsv.value||'').toLowerCase(),b=(chsv.value||'').toLowerCase();const p=customerRows.filter(x=>x.order?.source==='pickup'&&cmatch(x,a)),h=customerRows.filter(x=>(x.order?.source==='home'||x.source==='home')&&cmatch(x,b));cpc.textContent=p.length;chc.textContent=h.length;cpList.innerHTML=p.map(customerCard).join('')||'<div class="muted">目前沒有超商寄放個資。</div>';chList.innerHTML=h.map(customerCard).join('')||'<div class="muted">目前沒有送到府個資。</div>'}
function cmatch(x,q){return !q||[x.order?.order_number,x.name,x.phone,x.order?.store_name,x.order?.store_address,x.store_address].join(' ').toLowerCase().includes(q)}function customerCard(x){const o=x.order||x,home=x.source==='home'||o.source==='home';return '<div class="customer-card"><div class="customer-grid"><div>訂單編號<b>'+esc(o.order_number||'—')+'</b></div><div>姓名<b>'+esc(x.name||o.customer_name||'')+'</b></div><div>電話<b>'+esc(x.phone||o.customer_phone||'')+'</b></div><div style="text-align:right"><button class="btn small" onclick="alert(\'姓名：'+esc(x.name||o.customer_name||'')+'\\n電話：'+esc(x.phone||o.customer_phone||'')+'\')">查看</button></div></div><div class="customer-meta"><div>📍 '+(home?'完整地址':'超商／門市')+'<br><b>'+esc(home?(x.store_address||o.store_address||'—'):[o.convenience_store,o.store_name].filter(Boolean).join(' ')||'—')+'</b></div><div>'+(home?'🏠 配送資料':'💳 匯款後五碼')+'<br><b>'+esc(o.payment_last5||'—')+'</b></div><div>◷ 建立時間<br><b>'+esc(new Date(x.created_at||o.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'}))+'</b></div></div><div class="actions"><button class="btn small" onclick="editCustomer(' + JSON.stringify(x.id) + ')">編輯</button><button class="btn red small" onclick="deleteCustomer(' + JSON.stringify(x.id) + ')">🗑 刪除</button></div></div>'}
const cpsv=$('cps'),chsv=$('chs');cpsv.oninput=renderCustomers;chsv.oninput=renderCustomers;window.editCustomer=async id=>{const x=customerRows.find(v=>String(v.id)===String(id));if(!x)return;const n=prompt('修改姓名',x.name||'');if(n===null)return;const p=prompt('修改電話',x.phone||'');if(p===null)return;if(x.source==='home'){const r=await db.from('order_private').update({customer_name:n.trim(),customer_phone:p.trim()}).eq('order_id',String(id).slice(2));if(r.error)alert(r.error.message)}else{const r=await db.from('order_customers').update({name:n.trim(),phone:p.trim()}).eq('id',id);if(r.error)alert(r.error.message)}loadCustomers()};window.deleteCustomer=async id=>{if(!confirm('確定要刪除這筆個資嗎？訂單資料保留。'))return;const x=customerRows.find(v=>String(v.id)===String(id));if(!x)return;if(x.source==='home'){const r=await db.from('order_private').update({customer_name:'',customer_phone:''}).eq('order_id',String(id).slice(2));if(r.error)return alert(r.error.message)}else{await db.from('cooling_pickup_orders').update({customer_id:null}).eq('customer_id',id);const r=await db.from('order_customers').delete().eq('id',id);if(r.error)return alert(r.error.message)}loadCustomers();loadOrders()};
async function loadDaily(){const d=dailyDate.value||today();const [s,r,f]=await Promise.all([db.from('daily_order_settings').select('*').eq('order_date',d).maybeSingle(),db.from('daily_order_regions').select('*').eq('order_date',d).order('id'),db.from('daily_order_flavors').select('*').eq('order_date',d).order('id')]);enabled.value=s.data?.ordering_enabled===false?'false':'true';regions=r.data||[];daily=f.data||[];renderDaily()};async function loadMaster(){const r=await db.from('flavors').select('id,product_name,name,price,enabled').order('id');master=r.data||[]};function renderDaily(){regionsEl.innerHTML=regions.map((x,i)=>'<div class="row"><div class="grow"><b>'+esc(x.region_name)+'</b></div><button class="btn '+(x.enabled?'red':'green')+' small" onclick="regions['+i+'].enabled=!regions['+i+'].enabled;renderDaily()">'+(x.enabled?'關閉':'開放')+'</button></div>').join('');flavorsEl.innerHTML=master.filter(x=>x.enabled).map(p=>{const d=daily.find(x=>Number(x.flavor_id)===Number(p.id));return '<div class="row"><div class="grow"><b>'+esc(p.product_name||'涼糕')+'／'+esc(p.name)+'</b></div><span>價格 '+Number(d?.price??p.price??0)+'</span><button class="btn '+(d?.enabled?'red':'green')+' small" onclick="toggleFlavor('+p.id+')">'+(d?.enabled?'關閉':'開放')+'</button></div>'}).join('')};const regionsEl=$('regions'),flavorsEl=$('flavors');window.toggleFlavor=id=>{const p=master.find(x=>Number(x.id)===Number(id));let d=daily.find(x=>Number(x.flavor_id)===Number(id));if(!d){d={flavor_id:id,product_name:p.product_name||'涼糕',flavor_name:p.name,price:Number(p.price||0),enabled:true};daily.push(d)}else d.enabled=!d.enabled;renderDaily()};addRegion.onclick=()=>{const n=prompt('輸入地區名稱');if(n?.trim()){regions.push({region_name:n.trim(),enabled:true});renderDaily()}};save.onclick=async()=>{const d=dailyDate.value||today();let r=await db.from('daily_order_settings').upsert({order_date:d,ordering_enabled:enabled.value==='true',updated_at:new Date().toISOString()},{onConflict:'order_date'});if(r.error)return note('dailyMsg',r.error.message,true);await db.from('daily_order_regions').delete().eq('order_date',d);await db.from('daily_order_flavors').delete().eq('order_date',d);if(regions.length)await db.from('daily_order_regions').insert(regions.map(x=>({order_date:d,region_name:x.region_name,enabled:x.enabled})));if(daily.length)await db.from('daily_order_flavors').insert(daily.filter(x=>x.enabled).map(x=>({order_date:d,flavor_id:x.flavor_id,product_name:x.product_name||'涼糕',flavor_name:x.flavor_name,price:Number(x.price||0),enabled:true,quantity:0})));note('dailyMsg','已儲存。');loadDaily()};
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('#app>section').forEach(x=>x.classList.add('hidden'));$(b.dataset.page).classList.remove('hidden');if(b.dataset.page==='orders')loadOrders();if(b.dataset.page==='customers')loadCustomers();if(b.dataset.page==='daily'){loadMaster();loadDaily()}});db.auth.getSession().then(r=>{if(r.data.session)access(r.data.session.user).then(x=>{if(!x)open()})});

    db.auth.getSession().then(async r=>{
      if(r.data && r.data.session){

      }
    });
