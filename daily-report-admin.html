<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>老爹・涼糕｜日報表</title>
<style>
body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0000000a}h1{margin:0 0 8px}h2{font-size:20px;margin:0 0 12px}.grid{display:grid;gap:10px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #d9cdc1;border-radius:10px;box-sizing:border-box;font:inherit;background:#fff}.field textarea{min-height:80px;resize:vertical}button{border:0;border-radius:11px;padding:10px 14px;background:#9b5c38;color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#eee;color:#333}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.msg{padding:12px;border-radius:10px;background:#f6eee7;margin-top:10px}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}.hidden{display:none}.small{font-size:13px;color:#75685f}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid #eadfd4;border-radius:13px;padding:14px}.stat b{display:block;font-size:25px;margin-top:5px}.flavor-row{display:grid;grid-template-columns:1fr 120px 120px 120px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.section-note{background:#fbf5ee;padding:10px;border-radius:10px;margin-bottom:12px}@media(max-width:700px){.two,.three,.statgrid{grid-template-columns:1fr 1fr}.flavor-row{grid-template-columns:1fr 90px 90px 90px}}@media(max-width:480px){.two,.three,.statgrid{grid-template-columns:1fr}.flavor-row{grid-template-columns:1fr 80px 80px 80px;font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
<div class="card"><h1>📊 老爹・涼糕｜日報表</h1><div id="who" class="small">尚未登入</div></div>
<div id="login" class="card"><h2>管理員登入</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" type="button">登入日報表</button><div id="loginMsg"></div></div>
<div id="panel" class="hidden">
<div class="card"><div class="actions"><button class="secondary" id="refreshBtn">重新整理</button><button class="secondary" id="logoutBtn">登出</button></div><div id="msg"></div></div>
<div class="card"><h2>📅 日報日期</h2><div class="grid two"><div class="field"><label>日期</label><input id="reportDate" type="date"></div><div class="field"><label>填表人</label><input id="operatorName" placeholder="姓名"></div></div><div class="grid two"><div class="field"><label>工作區域／餐車</label><input id="workArea"></div><div class="field"><label>今日服務地區</label><input id="truckRegion"></div></div></div>
<div class="card"><h2>🤖 訂單自動統計</h2><div class="section-note">以下數字會依選定日期的訂單資料自動計算；取消訂單不計入售出盒數與營業額。</div><div class="statgrid"><div class="stat">訂單數<b id="statOrders">0</b></div><div class="stat">售出盒數<b id="statBoxes">0</b></div><div class="stat">營業額<b id="statRevenue">$0</b></div><div class="stat">配送單數<b id="statDelivery">0</b></div></div><div id="statsMsg" class="small" style="margin-top:10px"></div></div>
<div class="card"><h2>🍡 各口味明細</h2><div class="section-note">製作數／售出數／剩餘數可自行填寫，方便每日盤點。</div><div id="flavorBox"></div></div>
<div class="card"><h2>💰 收款</h2><div class="grid three"><div class="field"><label>現金</label><input id="cashAmount" type="number" min="0" value="0"></div><div class="field"><label>匯款</label><input id="transferAmount" type="number" min="0" value="0"></div><div class="field"><label>其他付款</label><input id="otherPaymentAmount" type="number" min="0" value="0"></div></div><div class="small">訂單營業額為系統統計值；收款方式金額由每日實際收款填寫。</div></div>
<div class="card"><h2>🚚 配送／寄放</h2><div class="grid three"><div class="field"><label>配送件數</label><input id="deliveryCount" type="number" min="0" value="0"></div><div class="field"><label>已完成</label><input id="deliveryCompleted" type="number" min="0" value="0"></div><div class="field"><label>未完成</label><input id="deliveryPending" type="number" min="0" value="0"></div></div><div class="field"><label>全家／7-11 冷藏寄放件數</label><input id="convenienceStoreCount" type="number" min="0" value="0"></div></div>
<div class="card"><h2>📝 工作紀錄</h2><div class="field"><label>今日工作內容</label><textarea id="workNotes"></textarea></div><div class="field"><label>異常狀況</label><textarea id="exceptionNotes"></textarea></div><div class="field"><label>客人反應</label><textarea id="customerFeedback"></textarea></div><div class="field"><label>備註</label><textarea id="notes"></textarea></div><div class="actions"><button id="saveBtn">💾 儲存日報</button><button class="secondary" id="loadBtn">載入此日期</button></div></div>
<div class="card"><h2>📚 歷史日報</h2><div id="historyBox">讀取中…</div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const sb=window.supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});$('reportDate').value=today();let currentUser=null;
function showMsg(text,cls='msg'){$('msg').innerHTML='<div class="'+cls+'">'+esc(text)+'</div>'}function loginMsg(text,cls='msg error'){$('loginMsg').innerHTML='<div class="'+cls+'">'+esc(text)+'</div>'}function money(n){return '$'+Number(n||0).toLocaleString('zh-TW')}
async function showPanel(user){const{data:p,error}=await sb.from('admin_profiles').select('role,enabled').eq('user_id',user.id).maybeSingle();if(error||!p||!p.enabled){loginMsg('此帳號不是啟用中的管理員。');return}currentUser=user;$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('who').textContent=user.email||'';await loadAll()}
$('loginBtn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return loginMsg('請輸入 Email 和密碼');const b=$('loginBtn');b.disabled=true;b.textContent='登入中…';try{const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)return loginMsg('登入失敗：'+error.message);await showPanel(data.user)}finally{b.disabled=false;b.textContent='登入日報表'}};
$('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.reload()};$('refreshBtn').onclick=loadAll;$('reportDate').onchange=loadAll;$('loadBtn').onclick=loadCurrent;$('saveBtn').onclick=saveReport;
async function loadAll(){await Promise.all([loadStats(),loadFlavors(),loadCurrent(),loadHistory()])}
async function loadStats(){const d=$('reportDate').value||today();const{data:orders,error}=await sb.from('orders').select('id,total_amount,status,pickup_type').eq('delivery_date',d);if(error){$('statsMsg').textContent='統計讀取失敗：'+error.message;return}const active=(orders||[]).filter(o=>o.status!=='cancelled');const ids=active.map(o=>o.id);let boxes=0;if(ids.length){const{data:items,error:ie}=await sb.from('order_items').select('order_id,quantity').in('order_id',ids);if(ie){$('statsMsg').textContent='盒數統計失敗：'+ie.message;return}boxes=(items||[]).reduce((s,x)=>s+Number(x.quantity||0),0)}$('statOrders').textContent=active.length;$('statBoxes').textContent=boxes;$('statRevenue').textContent=money(active.reduce((s,o)=>s+Number(o.total_amount||0),0));$('statDelivery').textContent=active.length;$('statsMsg').textContent=d+' 已完成系統自動統計。'}
async function getCurrentReport(){const d=$('reportDate').value||today();const{data,error}=await sb.from('daily_reports').select('*').eq('report_date',d).maybeSingle();if(error)return null;return data}
async function loadFlavors(){const{data,error}=await sb.from('flavors').select('id,name').eq('enabled',true).order('id');if(error){$('flavorBox').textContent=error.message;return}const existing=await getCurrentReport();const details=Array.isArray(existing?.flavor_details)?existing.flavor_details:[];const map=new Map(details.map(x=>[String(x.flavor_id),x]));$('flavorBox').innerHTML='<div class="flavor-row"><strong>口味</strong><strong>製作</strong><strong>售出</strong><strong>剩餘</strong></div>'+(data||[]).map(f=>{const x=map.get(String(f.id))||{};return '<div class="flavor-row"><div>'+esc(f.name)+'</div><input class="f-prod" data-id="'+f.id+'" type="number" min="0" value="'+Number(x.produced||0)+'"><input class="f-sold" data-id="'+f.id+'" type="number" min="0" value="'+Number(x.sold||0)+'"><input class="f-rem" data-id="'+f.id+'" type="number" min="0" value="'+Number(x.remaining||0)+'"></div>'}).join('')}
function setVal(id,v){$(id).value=v??''}function n(id){return Math.max(0,Number($(id).value||0))}
function flavorDetails(){return [...document.querySelectorAll('.f-prod')].map(el=>{const id=el.dataset.id;const soldEl=document.querySelector('.f-sold[data-id="'+id+'"]');const remEl=document.querySelector('.f-rem[data-id="'+id+'"]');return{flavor_id:Number(id),produced:Math.max(0,Number(el.value||0)),sold:Math.max(0,Number(soldEl?.value||0)),remaining:Math.max(0,Number(remEl?.value||0))}})}
async function loadCurrent(){const r=await getCurrentReport();if(!r){$('operatorName').value=currentUser?.email||'';['workArea','truckRegion','workNotes','exceptionNotes','customerFeedback','notes'].forEach(id=>setVal(id,''));['cashAmount','transferAmount','otherPaymentAmount','deliveryCount','deliveryCompleted','deliveryPending','convenienceStoreCount'].forEach(id=>setVal(id,0));return}setVal('operatorName',r.operator_name);setVal('workArea',r.work_area);setVal('truckRegion',r.truck_region);['cashAmount','transferAmount','otherPaymentAmount','deliveryCount','deliveryCompleted','deliveryPending','convenienceStoreCount'].forEach(id=>setVal(id,r[id.replace(/[A-Z]/g,m=>'_'+m.toLowerCase())]));setVal('workNotes',r.work_notes);setVal('exceptionNotes',r.exception_notes);setVal('customerFeedback',r.customer_feedback);setVal('notes',r.notes)}
async function saveReport(){if(!currentUser)return;const d=$('reportDate').value||today();const{data:statsOrders}=await sb.from('orders').select('id,total_amount,status').eq('delivery_date',d);const active=(statsOrders||[]).filter(o=>o.status!=='cancelled');const ids=active.map(o=>o.id);let soldBoxes=0;if(ids.length){const{data:items}=await sb.from('order_items').select('order_id,quantity').in('order_id',ids);soldBoxes=(items||[]).reduce((s,x)=>s+Number(x.quantity||0),0)}const payload={report_date:d,filled_by:currentUser.id,operator_name:$('operatorName').value.trim(),work_area:$('workArea').value.trim(),truck_region:$('truckRegion').value.trim(),order_count:active.length,sold_boxes:soldBoxes,cash_amount:n('cashAmount'),transfer_amount:n('transferAmount'),other_payment_amount:n('otherPaymentAmount'),delivery_count:n('deliveryCount'),delivery_completed:n('deliveryCompleted'),delivery_pending:n('deliveryPending'),convenience_store_count:n('convenienceStoreCount'),flavor_details:flavorDetails(),work_notes:$('workNotes').value,exception_notes:$('exceptionNotes').value,customer_feedback:$('customerFeedback').value,notes:$('notes').value};const{error}=await sb.from('daily_reports').upsert(payload,{onConflict:'report_date'});if(error){showMsg('儲存失敗：'+error.message,'error');return}showMsg('日報已儲存。','ok');await loadHistory()}
async function loadHistory(){const{data,error}=await sb.from('daily_reports').select('report_date,operator_name,order_count,sold_boxes,updated_at').order('report_date',{ascending:false}).limit(60);if(error){$('historyBox').textContent=error.message;return}if(!data?.length){$('historyBox').textContent='目前沒有日報紀錄。';return}$('historyBox').innerHTML=data.map(r=>'<div class="row"><div><b>'+esc(r.report_date)+'</b>　'+esc(r.operator_name||'')+'<br><span class="small">訂單 '+Number(r.order_count||0)+'　售出 '+Number(r.sold_boxes||0)+' 盒</span></div><span class="pill">已儲存</span></div>').join('')}
(async()=>{try{const{data}=await sb.auth.getUser();if(data.user)await showPanel(data.user)}catch(e){}})();
})();
</script>
</body>
</html>
