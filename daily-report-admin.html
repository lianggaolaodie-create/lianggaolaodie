<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><title>老爹・涼糕｜日報表</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 16px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:20px;margin:14px 0}.field{margin:12px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #d9cdc1;border-radius:11px;font-size:16px}button{border:0;border-radius:11px;padding:12px 18px;background:#9b5c38;color:#fff;font-weight:800;font-size:16px}button:disabled{opacity:.6}.msg{margin-top:12px;padding:12px;border-radius:10px;background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}.hidden{display:none}.small{color:#75685f}</style></head><body><div class="wrap"><div class="card"><h1>📊 老爹・涼糕｜日報表</h1><div id="who" class="small">尚未登入</div></div><div id="login" class="card"><h2>管理員登入</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" type="button">登入日報表</button><div id="loginMsg"></div></div><div id="loading" class="card hidden">正在開啟日報表…</div></div><script>const BASE='https://yemzdwxtyosuaczsqwea.supabase.co',KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',TOKEN_KEY='daily_report_session_v1';const $=id=>document.getElementById(id);function show(t,ok=false){$('loginMsg').innerHTML='<div class="msg '+(ok?'ok':'')+'">'+String(t).replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))+'</div>'}function saveSession(s){localStorage.setItem(TOKEN_KEY,JSON.stringify({access_token:s.access_token,refresh_token:s.refresh_token,user:s.user,expires_at:Date.now()+Number(s.expires_in||3600)*1000-60000}))}function getSession(){try{return JSON.parse(localStorage.getItem(TOKEN_KEY)||'null')}catch(e){return null}}function clearSession(){localStorage.removeItem(TOKEN_KEY)}async function api(path,opt={},token=''){const h=Object.assign({'apikey':KEY,'Content-Type':'application/json'},opt.headers||{});if(token)h.Authorization='Bearer '+token;const r=await fetch(BASE+path,Object.assign({},opt,{headers:h}));let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error_description||d.message||d.msg||('HTTP '+r.status));return d}async function access(s){try{const u=await api('/auth/v1/user',{},s.access_token);const a=await api('/rest/v1/rpc/daily_report_can_access',{method:'POST',body:'{}'},s.access_token);if(a===true||a==='true'){sessionStorage.setItem('daily_report_access_token',s.access_token);sessionStorage.setItem('daily_report_user',JSON.stringify(u));location.replace('./daily-report-admin-v2.html');return true}}catch(e){}return false}async function refresh(s){if(!s?.refresh_token)return false;try{const n=await api('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:JSON.stringify({refresh_token:s.refresh_token})});saveSession(n);return await access(n)}catch(e){clearSession();return false}}async function login(){const e=$('email').value.trim(),p=$('password').value;if(!e||!p){show('請輸入 Email 和密碼');return}const b=$('loginBtn');b.disabled=true;b.textContent='登入中…';try{const s=await api('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:e,password:p})});if(!s.access_token)throw new Error('沒有取得登入憑證');saveSession(s);if(!await access(s)){clearSession();throw new Error('此帳號目前沒有日報表管理權限')}show('登入成功，正在開啟日報表…',true)}catch(e){show('登入失敗：'+(e.message||String(e)))}finally{b.disabled=false;b.textContent='登入日報表'}}async function boot(){const s=getSession();if(!s)return;if(s.expires_at&&Date.now()>s.expires_at){if(await refresh(s))return}else if(await access(s))return;clearSession()}$('loginBtn').onclick=login;$('password').onkeydown=e=>{if(e.key==='Enter')login()};boot();</script></body></html>
