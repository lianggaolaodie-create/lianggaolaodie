<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache">
<title>老爹・涼糕｜日報表</title>
<style>
body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0000000a}h1{margin:0 0 8px}h2{font-size:20px;margin:0 0 12px}.grid{display:grid;gap:10px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #d9cdc1;border-radius:10px;box-sizing:border-box;font:inherit;background:#fff}.field textarea{min-height:80px;resize:vertical}button{border:0;border-radius:11px;padding:10px 14px;background:#9b5c38;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.secondary{background:#eee;color:#333}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.msg{padding:12px;border-radius:10px;background:#f6eee7;margin-top:10px}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}.hidden{display:none}.small{font-size:13px;color:#75685f}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid #eadfd4;border-radius:13px;padding:14px}.stat b{display:block;font-size:25px;margin-top:5px}.flavor-row{display:grid;grid-template-columns:1fr 180px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.flavor-sold{padding:10px;border:1px solid #e6ded7;border-radius:10px;background:#fafafa;font-size:18px;font-weight:700}.section-note{background:#fbf5ee;padding:10px;border-radius:10px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.pill{background:#edf8f1;padding:4px 8px;border-radius:999px;white-space:nowrap}@media(max-width:700px){.two,.three,.statgrid{grid-template-columns:1fr 1fr}.flavor-row{grid-template-columns:1fr 100px}}@media(max-width:480px){.two,.three,.statgrid{grid-template-columns:1fr}.flavor-row{grid-template-columns:1fr 85px;font-size:13px}}
</style>
</head>
<body>
<div class="wrap">
<div class="card"><h1>📊 老爹・涼糕｜日報表</h1><div id="who" class="small">尚未登入</div></div>
<div id="login" class="card"><h2>管理員登入</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" type="button">登入日報表</button><div id="loginMsg"></div></div>
<div id="panel" class="hidden">
<div class="card"><div class="actions"><button class="secondary" id="refreshBtn" type="button">重新整理</button><button class="secondary" id="logoutBtn" type="button">登出</button></div><div id="msg"></div></div>
<div class="card"><h2>📅 日報日期</h2><div class="grid two"><div class="field"><label>日期</label><input id="reportDate" type="date"></div><div class="field"><label>填表人</label><input id="operatorName" placeholder="姓名"></div></div><div class="grid two"><div class="field"><label>工作區域／餐車</label><input id="workArea"></div><div class="field"><label>今日服務地區</label><input id="truckRegion"></div></div></div>
<div class="card"><h2>🤖 訂單自動統計</h2><div class="section-note">以下數字會依選定日期的訂單資料自動計算；取消訂單不計入售出盒數與營業額。</div><div class="statgrid"><div class="stat">訂單數<b id="statOrders">0</b></div><div class="stat">售出盒數<b id="statBoxes">0</b></div><div class="stat">營業額<b id="statRevenue">$0</b></div><div class="stat">配送單數<b id="statDelivery">0</b></div></div><div id="statsMsg" class="small" style="margin-top:10px"></div></div>
<div class="card"><h2>🍡 各口味明細</h2><div class="section-note">僅顯示當日各口味實際售出盒數，資料依訂單自動統計。</div><div id="flavorBox"></div></div>
<div class="card"><h2>💰 收款</h2><div class="grid three"><div class="field"><label>現金</label><input id="cashAmount" type="number" min="0" value="0"></div><div class="field"><label>匯款</label><input id="transferAmount" type="number" min="0" value="0"></div><div class="field"><label>其他付款</label><input id="otherPaymentAmount" type="number" min="0" value="0"></div></div><div class="small">訂單營業額為系統統計值；收款方式金額由每日實際收款填寫。</div></div>
<div class="card"><h2>🚚 配送／寄放</h2><div class="grid three"><div class="field"><label>配送件數</label><input id="deliveryCount" type="number" min="0" value="0"></div><div class="field"><label>已完成</label><input id="deliveryCompleted" type="number" min="0" value="0"></div><div class="field"><label>未完成</label><input id="deliveryPending" type="number" min="0" value="0"></div></div><div class="field"><label>全家／7-11 冷藏寄放件數</label><input id="convenienceStoreCount" type="number" min="0" value="0"></div></div>
<div class="card"><h2>📝 工作紀錄</h2><div class="field"><label>今日工作內容</label><textarea id="workNotes"></textarea></div><div class="field"><label>異常狀況</label><textarea id="exceptionNotes"></textarea></div><div class="field"><label>客人反應</label><textarea id="customerFeedback"></textarea></div><div class="field"><label>備註</label><textarea id="notes"></textarea></div><div class="actions"><button id="saveBtn" type="button">💾 儲存日報</button><button class="secondary" id="loadBtn" type="button">載入此日期</button></div></div>
<div class="card"><h2>📚 歷史日報</h2><div id="historyBox">讀取中…</div></div>
</div></div>
<script>
/* 登入按鈕獨立備援：即使主程式載入異常，也能直接測試登入並顯示錯誤 */
document.addEventListener('DOMContentLoaded',function(){
 const b=document.getElementById('loginBtn'),email=document.getElementById('email'),pw=document.getElementById('password'),out=document.getElementById('loginMsg');
 if(!b)return;
 b.addEventListener('click',async function(e){
  e.preventDefault();e.stopImmediatePropagation();
  const em=(email.value||'').trim(),pass=pw.value||'';
  if(!em||!pass){out.innerHTML='<div class="msg error">請輸入 Email 和密碼</div>';return}
  b.disabled=true;b.textContent='登入中…';out.innerHTML='<div class="msg">正在連線登入服務…</div>';
  try{
   const BASE='https://yemzdwxtyosuaczsqwea.supabase.co',KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';
   const r=await fetch(BASE+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pass})});
   let d={};try{d=await r.json()}catch(_){ }
   if(!r.ok)throw new Error(d.error_description||d.msg||d.message||'登入失敗（HTTP '+r.status+'）');
   if(!d.access_token)throw new Error('登入成功但沒有取得登入憑證。');
   sessionStorage.setItem('daily_report_access_token',d.access_token);
   out.innerHTML='<div class="msg ok">登入成功，正在開啟日報表…</div>';
   location.reload();
  }catch(err){out.innerHTML='<div class="msg error">登入失敗：'+String(err.message||err)+'</div>';b.disabled=false;b.textContent='登入日報表'}
 },true);
});
</script>
<script>
(function(){
'use strict';
const BASE='https://yemzdwxtyosuaczsqwea.supabase.co';
const KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});$('reportDate').value=today();let currentUser=null,token=sessionStorage.getItem('daily_report_access_token')||'';
function loginMsg(t,c='msg error'){$('loginMsg').innerHTML='<div class="'+c+'">'+esc(t)+'</div>'}function showMsg(t,c='msg'){$('msg').innerHTML='<div class="'+c+'">'+esc(t)+'</div>'}function money(n){return '$'+Number(n||0).toLocaleString('zh-TW')}function val(id){return $(id).value??''}function num(id){return Math.max(0,Number(val(id)||0))}
async function req(path,opt={}){const h=Object.assign({'apikey':KEY,'Content-Type':'application/json'},opt.headers||{});if(token)h.Authorization='Bearer '+token;const r=await fetch(BASE+path,Object.assign({},opt,{headers:h}));let data=null;try{data=await r.json()}catch(e){}if(!r.ok){const msg=data?.msg||data?.message||data?.error_description||data?.error||('HTTP '+r.status);throw new Error(msg)}return data}
async function signOut(){try{if(token)await req('/auth/v1/logout',{method:'POST'})}catch(e){}token='';sessionStorage.removeItem('daily_report_access_token');location.reload()}
async function checkAdmin(user){const rows=await req('/rest/v1/admin_profiles?select=role,enabled&user_id=eq.'+encodeURIComponent(user.id)+'&limit=1');const p=rows?.[0];if(!p||!p.enabled)throw new Error('此帳號不是啟用中的管理員。')}
async function enter(user){try{await checkAdmin(user);currentUser=user;$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('who').textContent=user.email||'';await loadAll()}catch(e){loginMsg(e.message||String(e));token='';sessionStorage.removeItem('daily_report_access_token')}}
$('logoutBtn').onclick=signOut;$('refreshBtn').onclick=loadAll;$('reportDate').onchange=loadAll;$('loadBtn').onclick=loadCurrent;$('saveBtn').onclick=saveReport;
async function loadAll(){await Promise.all([loadStats(),loadFlavors(),loadCurrent(),loadHistory()])}
async function loadStats(){try{const d=val('reportDate')||today();const orders=await req('/rest/v1/orders?select=id,total_amount,status,pickup_type&delivery_date=eq.'+encodeURIComponent(d));const active=(orders||[]).filter(o=>o.status!=='cancelled');const ids=active.map(o=>o.id);let boxes=0;if(ids.length){const items=await req('/rest/v1/order_items?select=order_id,quantity&order_id=in.('+ids.map(encodeURIComponent).join(',')+')');boxes=(items||[]).reduce((s,x)=>s+Number(x.quantity||0),0)}$('statOrders').textContent=active.length;$('statBoxes').textContent=boxes;$('statRevenue').textContent=money(active.reduce((s,o)=>s+Number(o.total_amount||0),0));$('statDelivery').textContent=active.length;$('statsMsg').textContent=d+' 已完成系統自動統計。'}catch(e){$('statsMsg').textContent='統計讀取失敗：'+(e.message||String(e))}}
async function getCurrentReport(){const d=val('reportDate')||today();const rows=await req('/rest/v1/daily_reports?select=*&report_date=eq.'+encodeURIComponent(d)+'&limit=1');return rows?.[0]||null}
async function loadFlavors(){try{const d=val('reportDate')||today();const flavors=await req('/rest/v1/flavors?select=id,name&enabled=eq.true&order=id.asc');const orders=await req('/rest/v1/orders?select=id,status&delivery_date=eq.'+encodeURIComponent(d));const activeIds=(orders||[]).filter(o=>o.status!=='cancelled').map(o=>o.id);let items=[];if(activeIds.length)items=await req('/rest/v1/order_items?select=flavor_id,quantity&order_id=in.('+activeIds.map(encodeURIComponent).join(',')+')');const sold=new Map();(items||[]).forEach(x=>sold.set(String(x.flavor_id),(sold.get(String(x.flavor_id))||0)+Number(x.quantity||0));$('flavorBox').innerHTML='<div class="flavor-row"><strong>口味</strong><strong>售出（盒）</strong></div>'+(flavors||[]).map(f=>'<div class="flavor-row"><div>'+esc(f.name)+'</div><div class="flavor-sold f-sold" data-id="'+esc(f.id)+'">'+Number(sold.get(String(f.id))||0)+'</div></div>').join('')}catch(e){$('flavorBox').textContent='口味統計讀取失敗：'+(e.message||String(e))}}
function setVal(id,v){$(id).value=v??''}function snake(s){return s.replace(/[A-Z]/g,m=>'_'+m.toLowerCase())}
async function loadCurrent(){try{const r=await getCurrentReport();if(!r){$('operatorName').value=currentUser?.email||'';['workArea','truckRegion','workNotes','exceptionNotes','customerFeedback','notes'].forEach(id=>setVal(id,''));['cashAmount','transferAmount','otherPaymentAmount','deliveryCount','deliveryCompleted','deliveryPending','convenienceStoreCount'].forEach(id=>setVal(id,0));return}setVal('operatorName',r.operator_name);setVal('workArea',r.work_area);setVal('truckRegion',r.truck_region);['cashAmount','transferAmount','otherPaymentAmount','deliveryCount','deliveryCompleted','deliveryPending','convenienceStoreCount'].forEach(id=>setVal(id,r[snake(id)]));setVal('workNotes',r.work_notes);setVal('exceptionNotes',r.exception_notes);setVal('customerFeedback',r.customer_feedback);setVal('notes',r.notes)}catch(e){showMsg('日報資料讀取失敗：'+(e.message||String(e)),'error')}}
async function saveReport(){if(!currentUser)return;const d=val('reportDate')||today();const payload={report_date:d,filled_by:currentUser.id,operator_name:val('operatorName').trim(),work_area:val('workArea').trim(),truck_region:val('truckRegion').trim(),departure_time:null,return_time:null,order_count:Number($('statOrders').textContent||0),produced_boxes:0,sold_boxes:Number($('statBoxes').textContent||0),cancelled_boxes:0,remaining_boxes:0,cash_amount:num('cashAmount'),transfer_amount:num('transferAmount'),other_payment_amount:num('otherPaymentAmount'),delivery_count:num('deliveryCount'),delivery_completed:num('deliveryCompleted'),delivery_pending:num('deliveryPending'),convenience_store_count:num('convenienceStoreCount'),flavor_details:[...document.querySelectorAll('.f-sold')].map(el=>({flavor_id:el.dataset.id,sold:Number(el.textContent||0)})),work_notes:val('workNotes'),exception_notes:val('exceptionNotes'),customer_feedback:val('customerFeedback'),notes:val('notes')};try{await req('/rest/v1/daily_reports?on_conflict=report_date',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(payload)});showMsg('日報已儲存。','ok');await loadHistory()}catch(e){showMsg('儲存失敗：'+(e.message||String(e)),'error')}}
async function loadHistory(){try{const rows=await req('/rest/v1/daily_reports?select=report_date,operator_name,order_count,sold_boxes,updated_at&order=report_date.desc&limit=60');if(!rows?.length){$('historyBox').textContent='目前沒有日報紀錄。';return}$('historyBox').innerHTML=rows.map(r=>'<div class="row"><div><b>'+esc(r.report_date)+'</b>　'+esc(r.operator_name||'')+'<br><span class="small">訂單 '+Number(r.order_count||0)+'　售出 '+Number(r.sold_boxes||0)+' 盒</span></div><span class="pill">已儲存</span></div>').join('')}catch(e){$('historyBox').textContent='歷史日報讀取失敗：'+(e.message||String(e))}}
(async()=>{if(!token)return;try{const u=await req('/auth/v1/user');if(u?.id)await enter(u);else{token='';sessionStorage.removeItem('daily_report_access_token')}}catch(e){token='';sessionStorage.removeItem('daily_report_access_token')}})();
})();
</script>
</body>
</html>
