<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹．涼糕｜訂單管理測試</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:1100px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 12px}.brand{font-size:21px;font-weight:900}.btn{border:0;border-radius:10px;padding:10px 14px;background:#8d5939;color:#fff;font-weight:900}.gray{background:#6d625b}.red{background:#f33b3b}.login{max-width:520px;margin:60px auto}.card,.section,.stat{background:#fff;border:1px solid #e5dcd5;border-radius:15px;padding:12px}.nav{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.nav button{border:0;border-radius:12px;padding:12px;background:#ebe4de;color:#5a4940;font-weight:900}.nav .active{background:#8d5939;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.stat{text-align:center}.stat b{display:block;font-size:24px}.section{margin:10px 0}.pickup{background:#fff2f3}.home{background:#eef8ff}.title{display:flex;justify-content:space-between;font-size:18px;font-weight:900;margin-bottom:8px}.search{width:100%;padding:11px;border:1px solid #ddd2ca;border-radius:10px;font:inherit;margin-bottom:8px}.order{background:#fff;border:1px solid #e8ddd6;border-radius:13px;padding:10px;margin:8px 0}.topline{display:flex;justify-content:space-between;gap:6px}.status{padding:5px 8px;border-radius:8px;color:#fff;font-size:12px;font-weight:900}.pending{background:#f23a43}.done{background:#13ad67}.blue{background:#168fe4}.person{margin:8px 0;font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:6px;background:#fff4f4;padding:7px;border-radius:9px}.chip{background:#ffdfe5;border-radius:7px;padding:5px 8px;font-size:12px;font-weight:800}.summary{font-size:12px;margin-top:8px}.muted{color:#786e68;font-size:13px}.hidden{display:none!important}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #ddd2ca;border-radius:10px;font:inherit}@media(max-width:700px){.brand{font-size:19px}.stats{grid-template-columns:repeat(2,1fr)}.person{line-height:1.7}}
</style></head><body><div id="login" class="wrap login"><div class="card"><div class="brand">🍡 老爹．涼糕｜訂單管理測試</div><div class="field"><label>管理員 Email</label><input id="email" type="email" required></div><div class="field"><label>密碼</label><input id="password" type="password" required></div><button id="loginBtn" class="btn">登入</button><div id="msg"></div></div></div><main id="app" class="wrap hidden"><div class="top"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><button id="logout" class="btn gray">登出</button></div><div class="nav"><button class="active">🧾 訂單管理</button><button onclick="location.href='admin-orders-fixed.html'">📋 完整測試版</button></div><div class="stats"><div class="stat">🧾<div>今日訂單</div><b id="today">0</b></div><div class="stat">💰<div>待確認匯款</div><b id="pending">0</b></div><div class="stat">✅<div>已付款</div><b id="paid">0</b></div><div class="stat">🚚<div>已寄放</div><b id="stored">0</b></div></div><div class="section pickup"><div class="title"><span>🏪 超商寄放客戶資料 <span style="color:#e33">(需先付款)</span></span><span>共 <b id="pc">0</b> 筆</span></div><input id="ps" class="search" placeholder="搜尋訂單編號／姓名／電話／門市"><div id="pickup"></div></div><div class="section home"><div class="title"><span>🏠 送到府訂單 <span style="color:#1674c5">(貨到付款)</span></span><span>共 <b id="hc">0</b> 筆</span></div><input id="hs" class="search" placeholder="搜尋訂單編號／姓名／電話／地址"><div id="home"></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}}),$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m])),today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});let rows=[];
async function access(u){const r=await db.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',u.id).maybeSingle();return r.error?r.error.message:(!r.data||!r.data.enabled?'管理員帳號無管理權限':null)}
loginBtn.onclick=async()=>{const r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)return msg.textContent='登入失敗：'+r.error.message;const e=await access(r.data.user);if(e){await db.auth.signOut();return msg.textContent=e}login.classList.add('hidden');app.classList.remove('hidden');load()};logout.onclick=()=>db.auth.signOut().then(()=>location.reload());
function render(){const d=today(),ps=psv.value.toLowerCase(),hs=hsv.value.toLowerCase();const p=rows.filter(o=>o.date===d&&o.type==='pickup'&&match(o,ps)),h=rows.filter(o=>o.date===d&&o.type==='home'&&match(o,hs));pc.textContent=p.length;hc.textContent=h.length;pickup.innerHTML=p.map(card).join('')||'<div class="muted">目前沒有超商寄放訂單。</div>';home.innerHTML=h.map(card).join('')||'<div class="muted">目前沒有送到府訂單。</div>'}
function match(o,q){return !q||[o.no,o.name,o.phone,o.place,o.address,o.last5].join(' ').toLowerCase().includes(q)}function card(o){const chips=o.items.map(x=>'<span class="chip">'+esc(x.name)+' ('+x.qty+'盒)</span>').join('');return '<div class="order"><div class="topline"><b>訂單編號　'+esc(o.no)+'</b><span class="status '+(o.type==='home'?'blue':o.status==='已付款'?'done':'pending')+'">'+esc(o.displayStatus)+'</span></div><div class="person">👤 '+esc(o.name)+'　'+esc(o.phone)+'<br>📍 '+esc(o.place||o.address||'—')+(o.last5?'　💳 匯款後五碼 '+esc(o.last5):'')+'</div><div class="chips"><b>口味 (數量)</b> '+chips+'</div><div class="summary">涼糕數量 <b>'+o.qty+' 盒</b>　|　商品小計 <b>$'+o.product+'</b>　|　'+(o.type==='pickup'?'寄放費 <b>$'+o.fee+'</b>　|　':'')+'應付總額 <b>$'+o.total+'</b>　'+(o.type==='home'?'貨到付款':'')+'</div></div>'}
async function load(){const [p,h]=await Promise.all([db.from('cooling_pickup_orders').select('*').order('created_at',{ascending:false}).limit(300),db.from('orders').select('id,order_number,delivery_date,delivery_region,product_total,pickup_fee,total_amount,status,created_at').eq('pickup_type','home_delivery').order('created_at',{ascending:false}).limit(300)]);let out=[];if(!p.error){const ids=(p.data||[]).map(x=>x.id);let ii=[];if(ids.length){const r=await db.from('cooling_pickup_order_items').select('order_id,flavor_name,quantity').in('order_id',ids);ii=r.data||[]}const im=new Map();ii.forEach(x=>{if(!im.has(x.order_id))im.set(x.order_id,[]);im.get(x.order_id).push({name:x.flavor_name,qty:x.quantity})});const cids=(p.data||[]).map(x=>x.customer_id).filter(Boolean);let cs=[];if(cids.length){const r=await db.from('order_customers').select('id,name,phone').in('id',cids);cs=r.data||[]}const cm=new Map(cs.map(x=>[x.id,x]));out.push(...(p.data||[]).map(x=>{const c=cm.get(x.customer_id)||{};const its=im.get(x.id)||[];return {type:'pickup',date:x.order_date,no:x.order_number,name:c.name||'',phone:c.phone||'',place:[x.convenience_store,x.store_name].filter(Boolean).join(' '),last5:x.payment_last5,items:its,qty:its.reduce((a,b)=>a+b.qty,0),product:Number(x.merchandise_total||0),fee:Number(x.storage_fee||0),total:Number(x.total_amount||0),status:x.status,displayStatus:x.status}}))}if(!h.error){const ids=(h.data||[]).map(x=>x.id);let pp=[],ii=[];if(ids.length){const [a,b]=await Promise.all([db.from('order_private').select('order_id,customer_name,customer_phone,delivery_address').in('order_id',ids),db.from('order_items').select('order_id,flavor_name,quantity').in('order_id',ids)]);pp=a.data||[];ii=b.data||[]}const pm=new Map(pp.map(x=>[x.order_id,x]));const im=new Map();ii.forEach(x=>{if(!im.has(x.order_id))im.set(x.order_id,[]);im.get(x.order_id).push({name:x.flavor_name,qty:x.quantity})});out.push(...(h.data||[]).map(x=>{const c=pm.get(x.id)||{},its=im.get(x.id)||[];return {type:'home',date:x.delivery_date,no:x.order_number,name:c.customer_name||'',phone:c.customer_phone||'',address:c.delivery_address||'',items:its,qty:its.reduce((a,b)=>a+b.qty,0),product:Number(x.product_total||0),fee:0,total:Number(x.total_amount||0),status:x.status,displayStatus:x.status==='pending'?'待配送':x.status}}))}rows=out.sort((a,b)=>a.no.localeCompare(b.no));const day=rows.filter(x=>x.date===today());today.textContent=day.length;pending.textContent=rows.filter(x=>x.status==='待確認匯款').length;paid.textContent=rows.filter(x=>x.status==='已付款').length;stored.textContent=rows.filter(x=>x.status==='已寄放').length;render()}
const psv=$('ps'),hsv=$('hs');psv.oninput=render;hsv.oninput=render;db.auth.getSession().then(async r=>{if(r.data.session&&!await access(r.data.session.user)){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}});
</script></body></html>
