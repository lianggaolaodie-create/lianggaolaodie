<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹．涼糕｜網站內容管理</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f4f0;color:#30251f;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px}.top,.card{background:#fff;border:1px solid #e5ddd5;border-radius:18px;padding:18px;margin-bottom:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;z-index:4}.brand{font-size:22px;font-weight:950}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tabs a{white-space:nowrap;text-decoration:none;color:#4a3428;background:#eee7e1;border-radius:10px;padding:10px 12px;font-weight:900}.field{margin:12px 0}.field label{display:block;font-weight:900;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;padding:12px;border:1px solid #d8cec5;border-radius:10px;font:inherit}.field textarea{min-height:150px;resize:vertical}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid #e8dfd7;border-radius:13px;padding:12px;margin:8px 0}.btn{border:0;border-radius:10px;padding:10px 14px;background:#9b5c38;color:#fff;font-weight:900;cursor:pointer}.btn.gray{background:#756b65}.btn.green{background:#357653}.btn.red{background:#b42f2c}.msg{padding:11px;border-radius:10px;background:#edf8f1;color:#286c47;margin-top:10px}.err{background:#fff0ef;color:#a43b35}.muted{color:#81766e;font-size:13px;line-height:1.6}.section{scroll-margin-top:85px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.site-preview{margin-top:16px;border:1px solid #e5ddd5;border-radius:14px;overflow:hidden;background:#faf8f5}.site-preview-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#f3eee9;font-weight:900}.current-content{padding:14px;white-space:pre-wrap;line-height:1.65;max-height:420px;overflow:auto;background:#fff;font-size:14px;color:#493a31}.preview-note{padding:8px 12px;font-size:12px;color:#81766e;background:#fff}.itemlist{margin-top:10px}.switch{display:flex;align-items:center;gap:8px;font-weight:900}.preview{max-width:260px;max-height:150px;object-fit:cover;border-radius:12px;margin-top:8px}.hide{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}.top{position:static}.current-content{max-height:360px}}
</style></head>
<body><div id="login" class="wrap"><div class="card"><div class="brand">🍡 老爹．涼糕｜網站內容管理</div><p class="muted">管理目前沒有後台的網站選單內容。已經有後台的功能請回到原本管理頁。</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>密碼</label><input id="password" type="password" required></div><button class="btn">登入</button></form><div id="loginMsg" class="muted"></div></div></div>
<div id="app" class="wrap hide"><div class="top"><div class="brand">🍡 網站內容管理</div><div><a class="btn gray" href="admin.html">返回後台</a> <button id="logout" class="btn gray">登出</button></div></div>
<nav class="tabs"><a href="#marquee">📢跑馬燈</a><a href="#activity">🎉最新活動</a><a href="#rules">📝購買規則</a><a href="#radish">🥕蘿蔔糕</a><a href="#about">ℹ️關於老爹</a><a href="#contact">📞聯絡</a><a href="#social">📱社群</a><a href="#convenience">🏪超商</a><a href="#home">🏠首頁</a><a href="#menu">☰選單</a><a href="#maintenance">🔧維護</a></nav>
<div id="sections"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const defs=[
{id:'marquee',title:'📢 跑馬燈管理',desc:'修改網站上方跑馬燈。',fields:[['text','跑馬燈文字','input'],['link','連結（可留空）','input'],['enabled','顯示','check']]},
{id:'activity',title:'🎉 最新活動管理',desc:'管理最新活動標題、內容與圖片。',fields:[['title','活動標題','input'],['content','活動內容','textarea'],['image_url','圖片網址（可留空）','input'],['enabled','顯示','check']]},
{id:'rules',title:'📝 購買涼糕規則管理',desc:'管理購買規則與注意事項。',fields:[['content','規則內容','textarea'],['enabled','顯示','check']]},
{id:'radish',title:'🥕 純米蘿蔔糕管理',desc:'管理蘿蔔糕專區內容、價格與顯示狀態。',fields:[['title','商品／專區名稱','input'],['content','介紹內容','textarea'],['price','價格','number'],['image_url','圖片網址（可留空）','input'],['enabled','顯示','check']]},
{id:'about',title:'ℹ️ 關於老爹管理',desc:'管理品牌介紹內容。',fields:[['content','品牌介紹','textarea'],['image_url','圖片網址（可留空）','input'],['enabled','顯示','check']]},
{id:'contact',title:'📞 聯絡我們管理',desc:'管理電話、LINE、地址與聯絡說明。',fields:[['content','聯絡資訊','textarea'],['line_url','LINE連結','input'],['phone','電話','input'],['address','地址','input'],['enabled','顯示','check']]},
{id:'social',title:'📱 IG／Facebook管理',desc:'管理社群連結。',fields:[['instagram_url','Instagram','input'],['facebook_url','Facebook','input'],['enabled','顯示','check']]},
{id:'convenience',title:'🏪 超商寄放管理',desc:'管理全家、7-ELEVEN寄放費用與取件規則。',fields:[['family_fee','全家寄放費','number'],['seven_fee','7-ELEVEN寄放費','number'],['content','取件規則','textarea'],['enabled','顯示','check']]},
{id:'home',title:'🏠 首頁管理',desc:'只管理目前尚未被既有後台控制的首頁內容。',fields:[['title','首頁標題','input'],['content','首頁介紹／宣傳內容','textarea'],['image_url','首頁圖片網址（可留空）','input'],['button_text','按鈕文字','input'],['button_url','按鈕連結','input'],['enabled','顯示','check']]},
{id:'menu',title:'☰ 選單管理',desc:'管理選單名稱、連結、排序與顯示。',fields:[['menu_json','選單設定 JSON','textarea'],['enabled','啟用選單設定','check']]},
{id:'maintenance',title:'🔧 維護模式管理',desc:'開啟後可讓官網顯示維護訊息。',fields:[['enabled','開啟維護模式','check'],['content','維護訊息','textarea'],['restore_time','預計恢復時間','input']]}
];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function pageFor(id){return ({marquee:'index.html',home:'index.html',menu:'index.html',maintenance:'index.html',activity:'activity.html',rules:'rules.html',radish:'radish-cake.html',about:'about.html',contact:'contact.html',social:'contact.html',convenience:'convenience.html'})[id]||'index.html'}
function render(){document.getElementById('sections').innerHTML=defs.map(d=>'<section id="'+d.id+'" class="card section"><h2>'+d.title+'</h2><p class="muted">'+d.desc+'</p><div class="grid">'+d.fields.map(f=>{if(f[2]==='check')return '<div class="field"><label class="switch"><input id="'+d.id+'_'+f[0]+'" type="checkbox"> '+f[1]+'</label></div>';return '<div class="field"><label>'+f[1]+'</label>'+(f[2]==='textarea'?'<textarea id="'+d.id+'_'+f[0]+'"></textarea>':'<input id="'+d.id+'_'+f[0]+'" type="'+(f[2]==='number'?'number':'text')+'">')+'</div>'}).join('')+'</div><button class="btn" onclick="saveSection(\\''+d.id+'\\')">儲存並發布</button><div id="'+d.id+'_msg"></div><div class="site-preview"><div class="site-preview-head"><span>🌐 官網目前內容</span><a class="btn gray" href="'+pageFor(d.id)+'" target="_blank">開啟官網</a></div><div id="'+d.id+'_current" class="current-content">正在讀取官網目前內容…</div></div></section>').join('');defs.forEach(d=>loadCurrentPage(d.id))}
async function loadCurrentPage(id){const box=document.getElementById(id+'_current');if(!box)return;try{const res=await fetch(pageFor(id),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const html=await res.text();const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,style,noscript,svg').forEach(x=>x.remove());let t=(doc.body?.innerText||'').replace(/\\n{3,}/g,'\\n\\n').trim();if(!t)t='目前官網頁面沒有可讀取的文字內容（此頁主要由圖片呈現）。';box.textContent=t}catch(e){box.textContent='讀取官網失敗：'+e.message+'\\n請點「開啟官網」確認正式網站內容。'}}
async function access(u){const r=await db.from('admin_profiles').select('role,enabled').eq('user_id',u.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'此帳號已停用';if(r.data.role!=='super_admin')return'沒有後台管理權限';return null}
async function load(){const r=await db.from('site_admin_content').select('*');if(r.error){defs.forEach(d=>{});return}for(const d of defs){const x=(r.data||[]).find(v=>v.section_id===d.id);if(!x)continue;for(const f of d.fields){const e=document.getElementById(d.id+'_'+f[0]);if(!e)continue;if(f[2]==='check')e.checked=!!x.data?.[f[0]];else e.value=x.data?.[f[0]]??''}}}
window.saveSection=async id=>{const d=defs.find(x=>x.id===id),data={};for(const f of d.fields){const e=document.getElementById(id+'_'+f[0]);data[f[0]]=f[2]==='check'?e.checked:e.value}const r=await db.from('site_admin_content').upsert({section_id:id,data,updated_at:new Date().toISOString()},{onConflict:'section_id'});document.getElementById(id+'_msg').innerHTML=r.error?'<div class="msg err">儲存失敗：'+esc(r.error.message)+'</div>':'<div class="msg">已儲存並發布。</div>'};
document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();const m=document.getElementById('loginMsg');m.textContent='登入中…';const r=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(r.error){m.textContent='登入失敗：'+r.error.message;return}const er=await access(r.data.user);if(er){await db.auth.signOut();m.textContent=er;return}document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');render();load()};
document.getElementById('logout').onclick=()=>db.auth.signOut().then(()=>location.reload());
db.auth.getSession().then(async r=>{if(r.data.session&&!await access(r.data.session.user)){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');render();load()}});
</script></body></html>
