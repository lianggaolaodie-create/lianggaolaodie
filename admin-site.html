<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹．涼糕｜網站內容管理</title><style>body{margin:0;background:#f7f4f0;color:#30251f;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #e5ddd5;border-radius:18px;padding:18px;margin-bottom:14px}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;background:#fff;border:1px solid #e5ddd5;border-radius:18px;padding:18px}.brand{font-size:22px;font-weight:950}.btn{border:0;border-radius:10px;padding:10px 14px;background:#9b5c38;color:#fff;font-weight:900;text-decoration:none;cursor:pointer}.gray{background:#756b65}.muted{color:#81766e;font-size:13px;line-height:1.6}.hide{display:none!important}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tabs a{white-space:nowrap;text-decoration:none;color:#4a3428;background:#eee7e1;border-radius:10px;padding:10px 12px;font-weight:900}.field{margin:12px 0}.field label{display:block;font-weight:900;margin-bottom:6px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #d8cec5;border-radius:10px;font:inherit}.field textarea{min-height:150px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.switch{display:flex;align-items:center;gap:8px;font-weight:900}.msg{padding:11px;border-radius:10px;background:#edf8f1;color:#286c47;margin-top:10px}.err{background:#fff0ef;color:#a43b35}.site-preview{margin-top:16px;border:1px solid #e5ddd5;border-radius:14px;overflow:hidden}.site-preview-head{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#f3eee9;font-weight:900}.current-content{padding:14px;white-space:pre-wrap;line-height:1.65;max-height:420px;overflow:auto;background:#fff;font-size:14px}.upload-box{margin:12px 0;padding:14px;border:1px dashed #cdb9aa;border-radius:14px;background:#fbf7f2}.upload-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.upload-row input[type=file]{max-width:100%}.upload-preview{display:block;width:100%;max-height:260px;object-fit:contain;border-radius:12px;margin-top:12px;background:#f1ebe5}.upload-status{margin-top:8px;font-size:13px;color:#6f6259}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div id="login" class="wrap"><div class="card"><div class="brand">🍡 老爹．涼糕｜網站內容管理</div><p class="muted">請先從「後台首頁」登入。這裡不再要求第二次輸入帳號密碼。</p><a class="btn" href="admin.html">前往後台登入</a><div id="loginMsg" class="muted"></div></div></div><div id="app" class="wrap hide"><div class="top"><div class="brand">🍡 網站內容管理</div><div><a class="btn gray" href="admin.html">返回後台</a> <button id="logout" class="btn gray">登出</button></div></div><nav class="tabs"><a href="#marquee">📢跑馬燈</a><a href="#home">🏠首頁管理</a><a href="#activity">🎉最新活動</a><a href="#rules">📝購買規則</a><a href="#radish">🥕蘿蔔糕</a><a href="#about">ℹ️關於老爹</a><a href="#contact">📞聯絡</a><a href="#social">📱社群</a><a href="#convenience">🏪超商</a><a href="#menu">☰選單</a><a href="#maintenance">🔧維護</a></nav><div id="sections"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const defs=[{id:'home',title:'🏠 首頁管理',desc:'管理官網首頁內容與首頁照片。',fields:[['title','首頁標題','input'],['content','首頁介紹／宣傳內容','textarea'],['image_url','首頁圖片網址','input'],['button_text','按鈕文字','input'],['button_url','按鈕連結','input'],['enabled','顯示','check']]},{id:'marquee',title:'📢 跑馬燈管理',desc:'修改網站上方跑馬燈。',fields:[['text','跑馬燈文字','input'],['link','連結','input'],['enabled','顯示','check']]},{id:'activity',title:'🎉 最新活動管理',desc:'管理最新活動。',fields:[['title','活動標題','input'],['content','活動內容','textarea'],['image_url','圖片網址','input'],['enabled','顯示','check']]},{id:'rules',title:'📝 購買涼糕規則管理',desc:'管理購買規則與注意事項。',fields:[['content','規則內容','textarea'],['enabled','顯示','check']]},{id:'radish',title:'🥕 純米蘿蔔糕管理',desc:'管理蘿蔔糕專區。',fields:[['title','商品／專區名稱','input'],['content','介紹內容','textarea'],['price','價格','number'],['image_url','圖片網址','input'],['enabled','顯示','check']]},{id:'about',title:'ℹ️ 關於老爹管理',desc:'管理品牌介紹。',fields:[['content','品牌介紹','textarea'],['image_url','圖片網址','input'],['enabled','顯示','check']]},{id:'contact',title:'📞 聯絡我們管理',desc:'管理聯絡資訊。',fields:[['content','聯絡資訊','textarea'],['line_url','LINE連結','input'],['phone','電話','input'],['address','地址','input'],['enabled','顯示','check']]},{id:'social',title:'📱 IG／Facebook管理',desc:'管理社群連結。',fields:[['instagram_url','Instagram','input'],['facebook_url','Facebook','input'],['enabled','顯示','check']]},{id:'convenience',title:'🏪 超商寄放管理',desc:'管理冷藏寄放資訊。',fields:[['family_fee','全家寄放費','number'],['seven_fee','7-ELEVEN寄放費','number'],['content','取件規則','textarea'],['enabled','顯示','check']]},{id:'menu',title:'☰ 選單管理',desc:'管理選單名稱、連結、排序與顯示。',fields:[['menu_json','選單設定 JSON','textarea'],['enabled','啟用選單設定','check']]},{id:'maintenance',title:'🔧 維護模式管理',desc:'管理官網維護訊息。',fields:[['enabled','開啟維護模式','check'],['content','維護訊息','textarea'],['restore_time','預計恢復時間','input']]}];function pageFor(id){return({marquee:'index.html',home:'index.html',menu:'index.html',maintenance:'index.html',activity:'activity.html',rules:'rules.html',radish:'radish-cake.html',about:'about.html',contact:'contact.html',social:'contact.html',convenience:'convenience.html'})[id]||'index.html'}function render(){document.getElementById('sections').innerHTML=defs.map(d=>'<section id="'+d.id+'" class="card"><h2>'+d.title+'</h2><p class="muted">'+d.desc+'</p><div class="grid">'+(d.id==='home'?'<div class="upload-box home-photo-box"><strong>📷 首頁照片</strong><div class="muted">直接從手機選照片，不需要貼圖片網址。上傳後會自動填入「首頁圖片網址」，再按「儲存並發布」。</div><div class="upload-row"><input id="home_file" type="file" accept="image/*" onchange="previewHomeImage(event)"><button type="button" class="btn" onclick="uploadHomeImage()">📤 上傳首頁照片</button></div><img id="home_preview" class="upload-preview" alt="目前首頁照片" style="display:none"><div id="home_upload_status" class="upload-status"></div></div>':'')+d.fields.map(f=>f[2]==='check'?'<div class="field"><label class="switch"><input id="'+d.id+'_'+f[0]+'" type="checkbox"> '+f[1]+'</label></div>':'<div class="field"><label>'+f[1]+'</label>'+(f[2]==='textarea'?'<textarea id="'+d.id+'_'+f[0]+'"></textarea>':'<input id="'+d.id+'_'+f[0]+'" type="'+(f[2]==='number'?'number':'text')+'">')+'</div>').join('')+'</div><div style="display:none"><div class="muted">選擇手機／電腦裡的照片，上傳後會儲存到網站圖片庫。</div><div class="upload-row"><input id="'+d.id+'_file" type="file" accept="image/*" onchange="previewHomeImage(event)"><button type="button" class="btn" onclick="uploadHomeImage()">上傳並儲存首頁照片</button></div><img id="'+d.id+'_preview" class="upload-preview" alt="首頁照片預覽" style="display:none"><div id="'+d.id+'_upload_status" class="upload-status"></div></div></div><button class="btn" onclick="saveSection(\''+d.id+'\')">儲存並發布</button><div id="'+d.id+'_msg"></div><div class="site-preview"><div class="site-preview-head"><span>🌐 官網目前內容</span><a class="btn gray" href="'+pageFor(d.id)+'" target="_blank">開啟官網</a></div><div id="'+d.id+'_current" class="current-content">正在讀取官網目前內容…</div></div></section>').join('');defs.forEach(d=>loadCurrentPage(d.id))}async function loadCurrentPage(id){const box=document.getElementById(id+'_current');if(!box)return;try{const res=await fetch(pageFor(id),{cache:'no-store'});if(!res.ok)throw new Error('HTTP '+res.status);const html=await res.text();const doc=new DOMParser().parseFromString(html,'text/html');doc.querySelectorAll('script,style,noscript,svg').forEach(x=>x.remove());box.textContent=(doc.body?.innerText||'').trim()||'目前官網頁面沒有可讀取的文字內容。'}catch(e){box.textContent='讀取官網失敗：'+e.message}}async function load(){const r=await db.from('site_admin_content').select('*');if(r.error)return;for(const d of defs){const x=(r.data||[]).find(v=>v.section_id===d.id);if(!x)continue;for(const f of d.fields){const e=document.getElementById(d.id+'_'+f[0]);if(e)f[2]==='check'?e.checked=!!x.data?.[f[0]]:e.value=x.data?.[f[0]]??''}}}window.previewHomeImage=e=>{const file=e.target.files?.[0];const img=document.getElementById('home_preview');if(!img)return;if(!file){img.style.display='none';return}if(!file.type.startsWith('image/')){document.getElementById('home_upload_status').textContent='請選擇圖片檔案。';e.target.value='';img.style.display='none';return}const url=URL.createObjectURL(file);img.src=url;img.style.display='block';document.getElementById('home_upload_status').textContent='照片已選取，確認無誤後按「上傳並儲存首頁照片」。'};window.uploadHomeImage=async()=>{const input=document.getElementById('home_file'),status=document.getElementById('home_upload_status');const file=input?.files?.[0];if(!file){status.textContent='請先選擇首頁照片。';return}if(!file.type.startsWith('image/')){status.textContent='只接受圖片檔案。';return}if(file.size>10*1024*1024){status.textContent='照片大小請勿超過 10MB。';return}status.textContent='正在上傳…';const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path='home/homepage-'+Date.now()+'.'+ext;const up=await db.storage.from('site-images').upload(path,file,{contentType:file.type,upsert:false,cacheControl:'3600'});if(up.error){status.textContent='上傳失敗：'+up.error.message;return}const pub=db.storage.from('site-images').getPublicUrl(up.data.path).data.publicUrl+'?v='+Date.now();const urlField=document.getElementById('home_image_url');if(urlField)urlField.value=pub;const d=defs.find(x=>x.id==='home'),data={};for(const f of d.fields){const e=document.getElementById('home_'+f[0]);data[f[0]]=f[2]==='check'?e.checked:e.value}const save=await db.from('site_admin_content').upsert({section_id:'home',data,updated_at:new Date().toISOString()},{onConflict:'section_id'});if(save.error){status.textContent='照片已上傳，但儲存首頁設定失敗：'+save.error.message;return}status.textContent='✅ 首頁照片已上傳並儲存，官網首頁會同步使用這張照片。';loadCurrentPage('home')};window.saveSection=async id=>{const d=defs.find(x=>x.id===id),data={};for(const f of d.fields){const e=document.getElementById(id+'_'+f[0]);data[f[0]]=f[2]==='check'?e.checked:e.value}const r=await db.from('site_admin_content').upsert({section_id:id,data,updated_at:new Date().toISOString()},{onConflict:'section_id'});document.getElementById(id+'_msg').innerHTML=r.error?'<div class="msg err">儲存失敗：'+r.error.message+'</div>':'<div class="msg">已儲存並發布。</div>'};async function start(){const r=await db.auth.getSession();if(!r.data.session){document.getElementById('loginMsg').textContent='尚未登入，請先進入後台首頁登入。';return}const u=r.data.session.user;const p=await db.from('admin_profiles').select('role,enabled').eq('user_id',u.id).maybeSingle();if(p.error||!p.data||!p.data.enabled||p.data.role!=='super_admin'){document.getElementById('loginMsg').textContent='目前帳號沒有網站內容管理權限。';return}document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');render();load()}document.getElementById('logout').onclick=()=>db.auth.signOut().then(()=>location.reload());start();</script></body></html>
