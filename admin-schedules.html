<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜餐車／擺攤行程後台</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0000000a}h1{margin:0 0 8px}h2{font-size:20px;margin:0 0 12px}.grid{display:grid;gap:10px}.two{grid-template-columns:1fr 1fr}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #d9cdc1;border-radius:10px;box-sizing:border-box;font:inherit;background:#fff}button{border:0;border-radius:11px;padding:10px 14px;background:#9b5c38;color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#eee;color:#333}button.danger{background:#a32e29}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.msg{padding:12px;border-radius:10px;background:#f6eee7;margin-top:10px}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#f4ebe3;font-size:13px}.small{font-size:13px;color:#75685f}.item{border:1px solid #eadfd4;border-radius:13px;padding:12px;margin:9px 0}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.checkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.check{border:1px solid #eadfd4;border-radius:10px;padding:10px}.switch{display:flex;align-items:center;gap:8px}.switch input{width:auto}.editing{border:2px solid #9b5c38;background:#fffaf6}@media(max-width:650px){.two{grid-template-columns:1fr}.checkgrid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><h1>老爹・涼糕｜行程後台</h1><div id="who" class="small">尚未登入</div><div id="msg"></div></div><div id="login" class="card"><h2>管理員登入</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn">登入後台</button></div><div id="panel" style="display:none"><div class="card"><div class="actions"><button class="secondary" id="refresh">重新整理</button><button class="secondary" id="logout">登出</button></div><div id="roleBox" class="msg"></div></div><section class="card"><h2>🚚 涼糕餐車區塊</h2><div class="small">📅 出攤日期　📍 服務地區　🕐 出攤時間　🍡 當日販售口味　💰 每個口味的價格／盒</div><div class="grid two"><div class="field"><label>📅 出攤日期</label><input id="tDate" type="date"></div><div class="field"><label>📍 服務地區</label><input id="tRegion" placeholder="例如：桃園全區（不包含復興鄉）"></div><div class="field"><label>🕐 出攤時間</label><input id="tStart" type="time"></div><div class="field"><label>🕐 結束時間</label><input id="tEnd" type="time"></div></div><div class="field"><label>🍡 當日販售口味（價格從商品資料自動帶入）</label><div id="tFlavors" class="checkgrid">讀取中…</div></div><div class="actions"><button id="addTruck">新增涼糕餐車行程</button><button class="secondary" id="cancelTruck" style="display:none">取消編輯</button></div><div id="truckList">讀取中…</div></section><section class="card"><h2>🏪 擺攤區塊</h2><div class="small">📅 出攤日期　📍 服務地區　🕐 出攤時間　🍡 當日販售口味</div><div class="grid two"><div class="field"><label>📅 出攤日期</label><input id="sDate" type="date"></div><div class="field"><label>📍 服務地區</label><input id="sRegion" placeholder="例如：萬華雙和市場"></div><div class="field"><label>🕐 出攤時間</label><input id="sStart" type="time"></div><div class="field"><label>🕐 結束時間</label><input id="sEnd" type="time"></div></div><div class="field"><label>🍡 當日販售口味</label><div id="sFlavors" class="checkgrid">讀取中…</div></div><div class="actions"><button id="addStall">新增擺攤行程</button><button class="secondary" id="cancelStall" style="display:none">取消編輯</button></div><div id="stallList">讀取中…</div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(async()=>{const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),URL='https://yemzdwxtyosuaczsqwea.supabase.co',KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',sb=supabase.createClient(URL,KEY);const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});let role='',allowed=false,editing=null;function show(text,cls='msg'){$('msg').innerHTML='<div class="'+cls+'">'+esc(text)+'</div>'}function setForm(type,x,flavorIds){const p=type==='food_truck'?'t':'s';$(p+'Date').value=x.schedule_date||today();$(p+'Region').value=x.region||'';$(p+'Start').value=x.start_time||'';$(p+'End').value=x.end_time||'';document.querySelectorAll('.'+p+'f').forEach(c=>c.checked=flavorIds.includes(Number(c.value)));$(type==='food_truck'?'addTruck':'addStall').textContent='儲存更新';$(type==='food_truck'?'cancelTruck':'cancelStall').style.display='inline-block';window.scrollTo({top:0,behavior:'smooth'})}function cancelEdit(type){editing=null;const p=type==='food_truck'?'t':'s';$(p+'Date').value=today();$(p+'Region').value='';$(p+'Start').value='';$(p+'End').value='';document.querySelectorAll('.'+p+'f').forEach(c=>c.checked=false);$(type==='food_truck'?'addTruck':'addStall').textContent=type==='food_truck'?'新增涼糕餐車行程':'新增擺攤行程';$(type==='food_truck'?'cancelTruck':'cancelStall').style.display='none';document.querySelectorAll('.editing').forEach(x=>x.classList.remove('editing'))}async function flavors(){const r=await sb.from('flavors').select('id,name,price,enabled').eq('enabled',true).order('id');if(r.error)return show(r.error.message,'msg error');const base=(r.data||[]).map(f=>'<label class="check"><input class="tf" type="checkbox" value="'+f.id+'">'+esc(f.name)+' <span class="small">$'+Number(f.price||0).toLocaleString('zh-TW')+'／盒</span></label>').join('')||'<div class="small">目前沒有啟用中的口味。</div>';tFlavors.innerHTML=base;sFlavors.innerHTML=base.replaceAll('class="tf"','class="sf"').replaceAll('class="check"','class="check sfbox"')}async function load(type){const box=type==='food_truck'?truckList:stallList;const r=await sb.from('food_truck_schedules').select('id,schedule_date,region,start_time,end_time,enabled,schedule_type').eq('schedule_type',type).order('schedule_date',{ascending:false}).order('id',{ascending:false});if(r.error){box.innerHTML='<div class="msg error">'+esc(r.error.message)+'</div>';return}if(!r.data?.length){box.innerHTML='<div class="small">目前尚未建立行程。</div>';return}const ids=r.data.map(x=>x.id),lr=await sb.from('food_truck_schedule_flavors').select('schedule_id,flavor_id').in('schedule_id',ids),fids=[...new Set((lr.data||[]).map(x=>x.flavor_id))],fr=fids.length?await sb.from('flavors').select('id,name,price').in('id',fids):{data:[]},fm={};(fr.data||[]).forEach(x=>fm[x.id]=x);const by={};(lr.data||[]).forEach(x=>(by[x.schedule_id]??=[]).push(fm[x.flavor_id]));box.innerHTML=r.data.map(x=>{const arr=(by[x.id]||[]).filter(Boolean),names=arr.map(f=>esc(f.name)).join('、')||'尚未設定',prices=type==='food_truck'&&arr.length?'<div>💰 '+arr.map(f=>esc(f.name)+' $'+Number(f.price||0).toLocaleString('zh-TW')+'／盒').join('、')+'</div>':'';return '<div class="item" id="item-'+x.id+'"><div class="row"><strong>'+ (type==='food_truck'?'🚚 涼糕餐車':'🏪 擺攤')+'</strong><span class="pill">'+(x.enabled?'開放':'關閉')+'</span></div><div>📅 出攤日期：'+esc(x.schedule_date)+'</div><div>📍 服務地區：'+esc(x.region)+'</div><div>🕐 出攤時間：'+esc(x.start_time||'')+(x.end_time?'～'+esc(x.end_time):'')+'</div><div>🍡 當日販售口味：'+names+'</div>'+prices+'<div class="actions" style="margin-top:8px"><button onclick="editSchedule('+x.id+',\''+type+'\')">✏️ 編輯更新</button><button class="danger" onclick="del('+x.id+',\''+type+'\')">刪除</button></div></div>'}).join('')}window.editSchedule=async(id,type)=>{const r=await sb.from('food_truck_schedules').select('id,schedule_date,region,start_time,end_time,enabled,schedule_type').eq('id',id).single();if(r.error)return show(r.error.message,'msg error');const lr=await sb.from('food_truck_schedule_flavors').select('flavor_id').eq('schedule_id',id);editing={id,type};setForm(type,r.data,(lr.data||[]).map(x=>Number(x.flavor_id)));document.getElementById('item-'+id)?.classList.add('editing');show('正在編輯這筆'+(type==='food_truck'?'涼糕餐車':'擺攤')+'行程','msg ok')};window.del=async(id,type)=>{if(!confirm('確定刪除此行程？'))return;const a=await sb.from('food_truck_schedule_flavors').delete().eq('schedule_id',id);if(a.error)return show(a.error.message,'msg error');const r=await sb.from('food_truck_schedules').delete().eq('id',id);if(r.error)return show(r.error.message,'msg error');if(editing?.id===id)cancelEdit(type);show('行程已刪除','msg ok');await load(type)}async function save(type){const isT=type==='food_truck',p=isT?'t':'s',date=$(p+'Date').value,region=$(p+'Region').value.trim(),start=$(p+'Start').value||null,end=$(p+'End').value||null,cls=isT?'.tf':'.sf',ids=[...document.querySelectorAll(cls+':checked')].map(x=>Number(x.value));if(!date||!region)return show('請填寫出攤日期與服務地區','msg error');if(editing&&editing.type===type){const r=await sb.from('food_truck_schedules').update({schedule_date:date,region,start_time:start,end_time:end,updated_at:new Date().toISOString()}).eq('id',editing.id);if(r.error)return show(r.error.message,'msg error');const d=await sb.from('food_truck_schedule_flavors').delete().eq('schedule_id',editing.id);if(d.error)return show(d.error.message,'msg error');if(ids.length){const q=await sb.from('food_truck_schedule_flavors').insert(ids.map(flavor_id=>({schedule_id:editing.id,flavor_id})));if(q.error)return show(q.error.message,'msg error')}show('行程已更新','msg ok');cancelEdit(type);await load(type);return}const r=await sb.from('food_truck_schedules').insert({schedule_type:type,schedule_date:date,title:isT?'涼糕餐車':'擺攤',region,start_time:start,end_time:end,enabled:true,note:null}).select('id').single();if(r.error)return show(r.error.message,'msg error');if(ids.length){const q=await sb.from('food_truck_schedule_flavors').insert(ids.map(flavor_id=>({schedule_id:r.data.id,flavor_id})));if(q.error)return show(q.error.message,'msg error')}$(p+'Region').value='';document.querySelectorAll(cls).forEach(x=>x.checked=false);show((isT?'涼糕餐車':'擺攤')+'行程已新增','msg ok');await load(type)}addTruck.onclick=()=>save('food_truck');addStall.onclick=()=>save('stall');cancelTruck.onclick=()=>cancelEdit('food_truck');cancelStall.onclick=()=>cancelEdit('stall');refresh.onclick=()=>{load('food_truck');load('stall');flavors()};logout.onclick=async()=>{await sb.auth.signOut();location.reload()};loginBtn.onclick=async()=>{loginBtn.disabled=true;const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error){show('登入失敗：'+r.error.message,'msg error');loginBtn.disabled=false;return}await init()};async function init(){const u=await sb.auth.getUser();if(!u.data.user)return;login.style.display='none';panel.style.display='block';who.textContent=u.data.user.email||'';const p=await sb.from('admin_profiles').select('role,enabled,food_truck_schedule_enabled,can_manage_food_truck_schedule').eq('user_id',u.data.user.id).maybeSingle();if(p.error||!p.data||!p.data.enabled)return show('此帳號沒有行程管理權限','msg error');role=p.data.role;allowed=role==='super_admin'||p.data.food_truck_schedule_enabled===true||p.data.can_manage_food_truck_schedule===true;if(!allowed)return show('此帳號沒有行程管理權限','msg error');$('roleBox').innerHTML='目前權限：<span class="pill">'+esc(role)+'</span>';await flavors();await load('food_truck');await load('stall')}tDate.value=today();sDate.value=today();await init()})()</script></body></html>
