<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹．涼糕｜超商寄放訂購</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f1ea;color:#33251d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 48px}.top,.card{background:#fff;border:1px solid #e6dbd1;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 4px 18px #5b3d2510}.brand{font-size:25px;font-weight:900}.muted{color:#786d65;font-size:15px;line-height:1.6}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:13px;border:1px solid #d9cec6;border-radius:13px;background:#fff;font:inherit}.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice label{border:1px solid #ded2c8;border-radius:14px;padding:14px;cursor:pointer}.choice label:has(input:checked){border-color:#8d5939;background:#fff7f0}.choice input{margin-right:7px}.flavor{display:grid;grid-template-columns:92px 1fr auto;gap:13px;align-items:center;border:1px solid #e8ded6;border-radius:15px;padding:10px;margin:9px 0}.flavor-img{width:92px;height:92px;border-radius:12px;object-fit:cover;background:#f3ece6;border:1px solid #eadfd7}.flavor b{display:block;font-size:17px}.price{display:block;font-size:14px;color:#8d5939;font-weight:800;margin-top:4px}.qty{display:flex;align-items:center;gap:8px}.qty button{width:36px;height:36px;border:0;border-radius:10px;background:#eee5de;color:#4a392f;font-size:21px;font-weight:900}.qty span{min-width:28px;text-align:center;font-weight:900}.summary{background:#fffaf4;border:1px solid #eadbcd;border-radius:15px;padding:14px}.sumrow{display:flex;justify-content:space-between;padding:5px 0}.total{font-size:24px;font-weight:900;color:#8d5939;border-top:1px solid #e6d7c9;margin-top:8px;padding-top:10px}.btn{width:100%;border:0;border-radius:14px;padding:14px;background:#8d5939;color:#fff;font-size:17px;font-weight:900}.bank{background:#f5eee8;border-radius:14px;padding:13px;line-height:1.8}.line-link{font-weight:900;color:#8d5939}.notice{margin-top:10px;padding:12px;border-radius:12px}.err{background:#fff0ef;color:#a43b35}.result{display:none}.result.show{display:block}.order-number{font-size:28px;font-weight:900;color:#8d5939}.req{color:#a33c35}.back{display:block;text-decoration:none;color:#8d5939;font-weight:900;margin-bottom:12px}@media(max-width:560px){.flavor{grid-template-columns:78px 1fr}.flavor-img{width:78px;height:78px}.flavor .qty{grid-column:2;justify-content:flex-end}.choice{grid-template-columns:1fr}}</style></head><body><div class="wrap"><a class="back" href="online-order.html">← 返回訂購方式</a><div class="top"><div class="brand">🏪 老爹．涼糕｜超商寄放訂購</div><div class="muted">選口味、數量，填寫超商門市資料即可下單。付款方式：先匯款。</div></div><form id="orderForm"><div class="card"><h2>① 選擇配送日期</h2><div class="field"><label>日期 <span class="req">*</span></label><select id="orderDate" required><option value="">請選擇開放日期</option></select></div></div><div class="card"><h2>② 選擇配送地區</h2><div class="field"><label>地區 <span class="req">*</span></label><select id="region" required><option value="">請先選擇日期</option></select></div></div><div class="card"><h2>③ 點選口味與數量</h2><div id="flavors"></div></div><div class="card"><h2>④ 超商冷藏寄放</h2><div id="pickupChoices" class="choice"></div><div class="field"><label>門市名稱 <span class="req">*</span></label><input id="storeName" required placeholder="例如：台北○○店"></div><div class="field"><label>門市地址（可填）</label><input id="storeAddress" placeholder="方便核對門市"></div><div class="bank">🏪 超商寄放需先匯款。<br>全家寄放費 NT$ <span id="familyFee">30</span>；7-ELEVEN 寄放費 NT$ <span id="sevenFee">45</span>。<br>官方 LINE：<a class="line-link" href="https://line.me/R/ti/p/@502iugah" target="_blank">@502iugah｜點此聯絡</a></div><div class="field"><label>匯款後五碼 <span class="req">*</span></label><input id="last5" required maxlength="5" minlength="5" pattern="[0-9]{5}" inputmode="numeric" placeholder="請填 5 位數字"></div></div><div class="card"><h2>⑤ 收件人資料</h2><div class="field"><label>姓名 <span class="req">*</span></label><input id="customerName" required maxlength="80"></div><div class="field"><label>手機 <span class="req">*</span></label><input id="customerPhone" required maxlength="30" inputmode="tel"></div><div class="field"><label>備註</label><textarea id="notes" rows="3" maxlength="500"></textarea></div></div><div class="card"><h2>⑥ 訂單金額</h2><div class="summary"><div class="sumrow"><span>涼糕總數</span><b id="totalQty">0 盒</b></div><div class="sumrow"><span>涼糕小計</span><b>NT$ <span id="productTotal">0</span></b></div><div class="sumrow"><span>超商寄放費</span><b>NT$ <span id="storageFee">0</span></b></div><div class="sumrow total"><span>應付總額</span><span>NT$ <span id="grandTotal">0</span></span></div></div><button class="btn" id="submitBtn" type="submit" style="margin-top:14px">送出超商寄放訂單</button><div id="msg"></div></div></form><div id="result" class="card result"><h2>訂單已建立</h2><p>請確認匯款後五碼，並記下訂單編號。</p><div id="resultOrder" class="order-number"></div><div id="resultDetail" class="muted"></div><button class="btn" type="button" onclick="location.reload()" style="margin-top:14px">重新訂購</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);let flavors=[],fees={familymart:30,seven:45};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});function items(){return flavors.map((f,i)=>({flavor_id:Number(f.flavor_id),flavor_name:f.flavor_name,product_name:f.product_name||'涼糕',unit_price:Number(f.price||0),quantity:Number($('q'+i)?.textContent||0)})).filter(x=>x.quantity>0)}function totals(){const a=items(),q=a.reduce((s,x)=>s+x.quantity,0),p=a.reduce((s,x)=>s+x.unit_price*x.quantity,0),r=document.querySelector('input[name=pickup]:checked'),fee=r?Number(r.dataset.fee||0):0;$('totalQty').textContent=q+' 盒';$('productTotal').textContent=p.toLocaleString();$('storageFee').textContent=fee.toLocaleString();$('grandTotal').textContent=(p+fee).toLocaleString()}function render(){ $('flavors').innerHTML=flavors.map((f,i)=>'<div class="flavor">'+(f.image_url?'<img class="flavor-img" src="'+esc(f.image_url)+'" alt="'+esc(f.flavor_name)+'">':'<div class="flavor-img"></div>')+'<div><b>'+esc(f.product_name||'涼糕')+'／'+esc(f.flavor_name)+'</b><span class="price">NT$ '+Number(f.price||0).toLocaleString()+'</span></div><div class="qty"><button type="button" onclick="chg('+i+',-1)">−</button><span id="q'+i+'">0</span><button type="button" onclick="chg('+i+',1)">＋</button></div></div>').join('')}function chg(i,n){$('q'+i).textContent=Math.max(0,Math.min(99,Number($('q'+i).textContent||0)+n));totals()}async function dateData(){const d=$('orderDate').value;if(!d)return;const [rs,fs,m]=await Promise.all([sb.from('daily_order_regions').select('region_name').eq('order_date',d).eq('enabled',true).order('id'),sb.from('daily_order_flavors').select('id,flavor_id,product_name,flavor_name,price').eq('order_date',d).eq('enabled',true).order('id'),sb.from('flavors').select('id,image_url').eq('enabled',true)]);$('region').innerHTML='<option value="">請選擇配送地區</option>'+(rs.data||[]).map(r=>'<option>'+esc(r.region_name)+'</option>').join('');const im=Object.fromEntries((m.data||[]).map(x=>[Number(x.id),x.image_url]));flavors=(fs.data||[]).map(f=>({...f,image_url:im[Number(f.flavor_id)]||''}));render();totals()}async function init(){const d=await sb.from('daily_order_settings').select('order_date,ordering_enabled').eq('ordering_enabled',true).gte('order_date',today()).order('order_date').limit(60);if(d.error||!d.data?.length)return; $('orderDate').innerHTML='<option value="">請選擇開放日期</option>'+d.data.map(x=>'<option value="'+x.order_date+'">'+x.order_date+'</option>').join('');$('orderDate').value=d.data[0].order_date;const p=await sb.from('pickup_settings').select('familymart_enabled,familymart_fee,seven_eleven_enabled,seven_eleven_fee').limit(1).maybeSingle();if(p.data){fees={familymart:Number(p.data.familymart_fee||30),seven:Number(p.data.seven_eleven_fee||45)};$('familyFee').textContent=fees.familymart;$('sevenFee').textContent=fees.seven;const c=[];if(p.data.familymart_enabled)c.push('<label><input type="radio" name="pickup" value="familymart" data-fee="'+fees.familymart+'" required> 全家冷藏寄放<br><b>NT$ '+fees.familymart+'</b></label>');if(p.data.seven_eleven_enabled)c.push('<label><input type="radio" name="pickup" value="seven_eleven" data-fee="'+fees.seven+'" required> 7-ELEVEN 冷藏寄放<br><b>NT$ '+fees.seven+'</b></label>');$('pickupChoices').innerHTML=c.join('');document.querySelectorAll('input[name=pickup]').forEach(x=>x.addEventListener('change',totals))}dateData()}$('orderDate').addEventListener('change',dateData);$('orderForm').addEventListener('submit',async e=>{e.preventDefault();$('submitBtn').disabled=true;try{const a=items(),r=document.querySelector('input[name=pickup]:checked'),date=$('orderDate').value,region=$('region').value,last5=$('last5').value.trim();if(!a.length)throw new Error('請至少選擇 1 盒涼糕。');if(!region)throw new Error('請選擇配送地區。');if(!r)throw new Error('請選擇全家或 7-ELEVEN。');if(!/^\d{5}$/.test(last5))throw new Error('匯款後五碼必須是 5 位數字。');const p=a.reduce((s,x)=>s+x.unit_price*x.quantity,0),fee=Number(r.dataset.fee||0),q=await sb.rpc('create_cooling_pickup_order',{p_name:$('customerName').value.trim(),p_phone:$('customerPhone').value.trim(),p_order_date:date,p_region_name:region,p_convenience_store:r.value,p_store_name:$('storeName').value.trim(),p_store_address:$('storeAddress').value.trim()||null,p_merchandise_total:p,p_storage_fee:fee,p_total_amount:p+fee,p_payment_last5:last5,p_notes:$('notes').value.trim()||null,p_items:a.map(x=>({flavor_id:x.flavor_id,quantity:x.quantity}))});if(q.error)throw q.error;const result=Array.isArray(q.data)?q.data[0]:q.data;$('resultOrder').textContent=result?.order_number||'';$('resultDetail').innerHTML='應付總額：<b>NT$ '+Number(result?.total_amount||p+fee).toLocaleString()+'</b><br>配送日期：'+esc(date)+'<br>配送地區：'+esc(region);$('orderForm').style.display='none';$('result').classList.add('show')}catch(err){$('msg').innerHTML='<div class="notice err">'+esc(err?.message||'訂單送出失敗，請稍後再試。')+'</div>';$('submitBtn').disabled=false}});init();</script></body></html>
