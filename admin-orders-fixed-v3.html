<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>老爹．涼糕｜線上下單管理後台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.shell{max-width:1100px;margin:auto;padding:12px}.hidden{display:none!important}.top,.head,.sectiontitle,.actions,.searchrow{display:flex;gap:8px}.top,.head,.sectiontitle{align-items:center;justify-content:space-between}.brand{font-size:22px;font-weight:900}.btn{border:0;border-radius:10px;padding:11px 15px;background:#8d5939;color:#fff;font-weight:900;font-size:15px;touch-action:manipulation}.gray{background:#6d625b}.red{background:#e94343}.green{background:#18a96a}.small{padding:9px 12px;font-size:13px}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.nav button{border:0;border-radius:10px;padding:12px;background:#ebe4de;font-weight:900}.nav button.active{background:#8d5939;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat,.section,.dailybox,.order-card,.customer-card,.card{background:#fff;border:1px solid #e3d9d1;border-radius:15px;padding:12px}.stat{text-align:center}.stat b{display:block;font-size:28px}.section{margin:10px 0}.pickup{background:#fff3f4}.home{background:#eef8ff}.searchrow{margin-top:8px}.search{flex:1;min-width:0;border:1px solid #ddd2ca;border-radius:10px;padding:12px;font:inherit}.order-card,.customer-card{margin-top:8px}.order-top{display:flex;justify-content:space-between;gap:8px}.order-no{font-weight:900}.muted{color:#786e68;line-height:1.6}.status{color:#fff;border-radius:8px;padding:6px 9px;font-size:12px;font-weight:900;height:max-content}.paid{background:#12b86a}.pending{background:#e94343}.stored{background:#168fe4}.delivering,.done{background:#168fe4}.person{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:9px 0}.flavors{background:#fff4f4;border-radius:9px;padding:8px;display:flex;gap:6px;flex-wrap:wrap}.chip{padding:6px 9px;border-radius:8px;background:#ffe9b8;font-weight:800;font-size:13px}.summary{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}.actions{justify-content:flex-end;margin-top:9px}.notice{padding:10px;border-radius:10px;background:#edf8f1;color:#286c47;margin-top:8px}.err{background:#fff0ef;color:#a43b35}.login{max-width:520px;margin:60px auto}.field{margin:12px 0}.field label{display:block;font-weight:900;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #ddd2ca;border-radius:10px;font:inherit}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid #e5dcd5;border-radius:10px;padding:10px;margin-top:8px}.grow{flex:1}@media(max-width:700px){.brand{font-size:19px}.stats{grid-template-columns:repeat(2,1fr)}.person{grid-template-columns:1fr}.top{align-items:flex-start}.head{align-items:flex-start}.nav button{font-size:13px;padding:10px 4px}}
button,input,select{pointer-events:auto!important;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<div id="loginView" class="shell login"><div class="card"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><p class="muted">商品／口味、每日開放、訂單與個資管理。</p><form id="loginForm"><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">登入</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="shell hidden">
<div class="top"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><button id="logout" class="btn gray small">登出</button></div>
<div class="nav"><button data-page="orders" class="active">🧾 訂單管理</button><button data-page="customers">👤 個資管理</button><button data-page="daily">📅 每日開放設定</button></div>
<section id="orders"><div class="head"><h2>訂單管理</h2><div><input id="date" type="date"><button id="reload" class="btn gray">重新整理</button></div></div><div class="stats"><div class="stat">🧾<div>今日訂單</div><b id="todayCount">0</b></div><div class="stat">💰<div>待確認匯款</div><b id="pendingCount">0</b></div><div class="stat">✅<div>已付款</div><b id="paidCount">0</b></div><div class="stat">🚚<div>已寄放</div><b id="storedCount">0</b></div></div>
<div class="section pickup"><div class="sectiontitle"><b>🏪 超商寄放客戶資料 <span style="color:#e33">(需先付款)</span></b><b>共 <span id="pc">0</span> 筆</b></div><div class="searchrow"><input id="ps" class="search" placeholder="搜尋訂單編號／姓名／電話／門市"><button id="searchPickup" class="btn">搜尋</button></div><div id="pickupList"></div></div>
<div class="section home"><div class="sectiontitle"><b>🏠 送到府訂單 <span style="color:#1674c5">(貨到付款)</span></b><b>共 <span id="hc">0</span> 筆</b></div><div class="searchrow"><input id="hs" class="search" placeholder="搜尋訂單編號／姓名／電話／地址"><button id="searchHome" class="btn">搜尋</button></div><div id="homeList"></div></div><div id="orderMsg"></div></section>
<section id="customers" class="hidden"><h2>個資管理</h2><p class="muted">顯示訂單號碼、姓名、完整電話、門市／地址與匯款後五碼。</p><div class="section pickup"><div class="sectiontitle"><b>🏪 超商寄放客戶資料</b><b>共 <span id="cpc">0</span> 筆</b></div><div class="searchrow"><input id="cps" class="search" placeholder="搜尋訂單編號／姓名／電話／門市"><button id="searchCP" class="btn">搜尋</button></div><div id="cpList"></div></div><div class="section home"><div class="sectiontitle"><b>🏠 送到府客戶資料</b><b>共 <span id="chc">0</span> 筆</b></div><div class="searchrow"><input id="chs" class="search" placeholder="搜尋訂單編號／姓名／電話／地址"><button id="searchCH" class="btn">搜尋</button></div><div id="chList"></div></div></section>
<section id="daily" class="hidden"><div class="dailybox"><div class="head"><h2>每日開放設定</h2><button id="save" class="btn">儲存今日設定</button></div><div class="field"><label>日期</label><input id="dailyDate" type="date"></div><div class="field"><label>今日線上訂購</label><select id="enabled"><option value="true">開放</option><option value="false">關閉</option></select></div><div id="dailyMsg"></div></div><div class="dailybox"><h3>當日開放地區</h3><div id="regions"></div><button id="addRegion" class="btn gray">＋新增地區</button></div><div class="dailybox"><h3>當日開放口味</h3><div id="flavors"></div></div></section>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
'use strict';
const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});
let orders=[],items=new Map(),customers=new Map(),customerRows=[],regions=[],daily=[],master=[];
function note(id,t,e){$(id).innerHTML=t?'<div class="notice '+(e?'err':'')+'">'+esc(t)+'</div>':'';}
async function access(u){const r=await db.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',u.id).maybeSingle();if(r.error)return null;if(!r.data||!r.data.enabled)return'管理員帳號無管理權限';return null;}
function openApp(){$('loginView').classList.add('hidden');$('app').classList.remove('hidden');$('date').value=today();$('dailyDate').value=today();loadOrders();loadCustomers();loadDaily();}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;b.textContent='登入中…';try{const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){note('loginMsg','登入失敗：'+r.error.message,true);return}const er=await access(r.data.user);if(er){await db.auth.signOut();note('loginMsg',er,true);return}openApp();}catch(x){note('loginMsg','登入失敗：'+(x.message||x),true)}finally{b.disabled=false;b.textContent='登入';}});
$('logout').addEventListener('click',async()=>{await db.auth.signOut();location.reload();});
function sc(s){if(s==='已付款')return'paid';if(s==='已寄放')return'stored';if(['配送中','待配送','製作中'].includes(s))return'delivering';if(['待確認匯款','pending'].includes(s))return'pending';return'done';}
function orderCard(o){const c=customers.get(o.ckey)||{};const its=items.get(o.key)||[];const qty=its.reduce((a,x)=>a+Number(x.quantity||0),0);const home=o.source==='home';const place=home?o.address:[o.convenience_store,o.store_name].filter(Boolean).join(' ')||'—';return '<div class="order-card"><div class="order-top"><div><b>訂單編號　'+esc(o.order_number)+'</b><div class="muted">'+new Date(o.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+'</div></div><span class="status '+sc(o.display_status||o.status)+'">'+esc(o.display_status||o.status)+'</span></div><div class="person"><div>👤 <b>'+esc(c.name||o.customer_name||'')+'</b><br>'+esc(c.phone||o.customer_phone||'')+'</div><div>📍 '+esc(place)+'</div></div><div class="flavors"><b>口味 (數量)</b> '+its.map(x=>'<span class="chip">'+esc(x.flavor_name)+' ('+Number(x.quantity||0)+'盒)</span>').join('')+'</div><div class="summary">涼糕數量 <b>'+qty+' 盒</b>　|　商品小計 <b>$'+Number(o.merchandise_total||0).toLocaleString()+'</b>　|　應付總額 <b>$'+Number(o.total_amount||0).toLocaleString()+'</b>'+(home?'<span class="chip">貨到付款</span>':'')+'</div><div class="actions"><button class="btn small" data-action="view" data-key="'+esc(o.key)+'">查看</button><button class="btn small" data-action="edit" data-key="'+esc(o.key)+'">編輯</button><button class="btn red small" data-action="delete" data-key="'+esc(o.key)+'">🗑 刪除</button></div></div>';}
async function loadOrders(){try{const [p,h]=await Promise.all([db.from('cooling_pickup_orders').select('*').order('created_at',{ascending:false}).limit(300),db.from('orders').select('id,order_number,delivery_date,pickup_type,product_total,pickup_fee,total_amount,status,created_at').eq('pickup_type','home_delivery').order('created_at',{ascending:false}).limit(300)]);if(p.error&&h.error)throw p.error;const po=p.data||[],ho=h.data||[];let priv=[],hi=[];if(ho.length){const ids=ho.map(x=>x.id);const [a,b]=await Promise.all([db.from('order_private').select('order_id,customer_name,customer_phone,delivery_address').in('order_id',ids),db.from('order_items').select('order_id,flavor_name,quantity,unit_price,subtotal').in('order_id',ids)]);priv=a.data||[];hi=b.data||[];}const pi=po.length?(await db.from('cooling_pickup_order_items').select('order_id,flavor_name,quantity,unit_price,line_total').in('order_id',po.map(x=>x.id))).data||[]:[];const pm=new Map(priv.map(x=>[x.order_id,x]));orders=[...po.map(o=>({...o,source:'pickup',key:'p:'+o.id,ckey:String(o.customer_id),order_date:(o.created_at||'').slice(0,10),display_status:o.status})),...ho.map(o=>{const x=pm.get(o.id)||{};return {...o,source:'home',key:'h:'+o.id,ckey:'h:'+o.id,order_date:o.delivery_date,address:x.delivery_address||'—',merchandise_total:o.product_total,storage_fee:o.pickup_fee||0,customer_name:x.customer_name||'',customer_phone:x.customer_phone||'',display_status:o.status==='pending'?'待配送':o.status};})].sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));items=new Map();pi.forEach(x=>{const k='p:'+x.order_id;if(!items.has(k))items.set(k,[]);items.get(k).push(x);});hi.forEach(x=>{const k='h:'+x.order_id;if(!items.has(k))items.set(k,[]);items.get(k).push(x);});customers=new Map();const cids=po.map(x=>x.customer_id).filter(Boolean);if(cids.length){const r=await db.from('order_customers').select('id,name,phone').in('id',cids);(r.data||[]).forEach(c=>customers.set(String(c.id),c));}renderOrders();}catch(x){note('orderMsg','讀取訂單失敗：'+(x.message||x),true);}}
function omatch(o,q){if(!q)return true;const c=customers.get(o.ckey)||{};return[o.order_number,c.name,c.phone,o.customer_name,o.customer_phone,o.convenience_store,o.store_name,o.address,o.payment_last5].join(' ').toLowerCase().includes(q);}
function renderOrders(){const d=$('date').value||today();const p=orders.filter(o=>o.order_date===d&&o.source==='pickup'&&omatch(o,$('ps').value.trim().toLowerCase()));const h=orders.filter(o=>o.order_date===d&&o.source==='home'&&omatch(o,$('hs').value.trim().toLowerCase()));$('pc').textContent=p.length;$('hc').textContent=h.length;$('todayCount').textContent=orders.filter(o=>o.order_date===d).length;$('pendingCount').textContent=orders.filter(o=>['待確認匯款','pending'].includes(o.status)).length;$('paidCount').textContent=orders.filter(o=>o.status==='已付款').length;$('storedCount').textContent=orders.filter(o=>o.status==='已寄放').length;$('pickupList').innerHTML=p.map(orderCard).join('')||'<div class="muted">目前沒有超商寄放訂單。</div>';$('homeList').innerHTML=h.map(orderCard).join('')||'<div class="muted">目前沒有送到府訂單。</div>';}
$('orders').addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const o=orders.find(x=>x.key===b.dataset.key);if(!o)return;if(b.dataset.action==='view'){alert('訂單：'+o.order_number+'\n狀態：'+(o.display_status||o.status));return;}if(b.dataset.action==='edit'){const list=o.source==='home'?['待配送','配送中','已送達','已完成']:['待確認匯款','待付款','已付款','待配送','配送中','已寄放','已完成','已取消'];const box=document.createElement('div');box.style='position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px';const panel=document.createElement('div');panel.style='background:#fff;border-radius:20px;padding:18px;width:min(420px,100%);box-shadow:0 20px 60px rgba(0,0,0,.25)';panel.innerHTML='<div style="font-size:20px;font-weight:900;margin-bottom:14px">修改訂單狀態</div>';list.forEach(s=>{const b=document.createElement('button');b.textContent=s;b.style='display:block;width:100%;border:1px solid #ddd2ca;background:#faf7f4;border-radius:12px;padding:14px;margin:8px 0;font-size:16px;font-weight:900';b.onclick=async()=>{let v=s;if(o.source==='home')v=({待配送:'pending',配送中:'delivering',已送達:'delivered',已完成:'completed'})[s]||s;const r=await db.from(o.source==='pickup'?'cooling_pickup_orders':'orders').update({status:v,updated_at:new Date().toISOString()}).eq('id',o.id);if(r.error)alert(r.error.message);else{box.remove();loadOrders();}};panel.appendChild(b)});const c=document.createElement('button');c.textContent='取消';c.style='display:block;width:100%;border:0;background:#6d625b;color:#fff;border-radius:12px;padding:13px;margin-top:10px;font-size:16px;font-weight:900';c.onclick=()=>box.remove();panel.appendChild(c);box.appendChild(panel);document.body.appendChild(box);return;}if(b.dataset.action==='delete'){if(!confirm('確定要刪除這筆訂單嗎？'))return;if(o.source==='pickup')await db.from('cooling_pickup_order_items').delete().eq('order_id',o.id);else{await db.from('order_items').delete().eq('order_id',o.id);await db.from('order_private').delete().eq('order_id',o.id);}const r=await db.from(o.source==='pickup'?'cooling_pickup_orders':'orders').delete().eq('id',o.id);if(r.error)alert(r.error.message);else loadOrders();}});
$('reload').addEventListener('click',loadOrders);$('searchPickup').addEventListener('click',renderOrders);$('searchHome').addEventListener('click',renderOrders);$('ps').addEventListener('input',renderOrders);$('hs').addEventListener('input',renderOrders);$('date').addEventListener('change',renderOrders);
async function loadCustomers(){try{const cs=(await db.from('order_customers').select('id,name,phone,created_at').order('created_at',{ascending:false}).limit(300)).data||[];const ids=cs.map(x=>x.id);const po=ids.length?(await db.from('cooling_pickup_orders').select('id,order_number,customer_id,convenience_store,store_name,store_address,payment_last5,created_at').in('customer_id',ids)).data||[]:[];const ho=(await db.from('orders').select('id,order_number,created_at').eq('pickup_type','home_delivery').limit(300)).data||[];const priv=ho.length?(await db.from('order_private').select('order_id,customer_name,customer_phone,delivery_address').in('order_id',ho.map(x=>x.id))).data||[]:[];const latest=new Map();po.forEach(o=>{if(!latest.has(String(o.customer_id)))latest.set(String(o.customer_id),{...o,source:'pickup'});});const pickupRows=cs.map(c=>({...c,order:latest.get(String(c.id))}));const homeRows=ho.map(o=>{const x=priv.find(v=>v.order_id===o.id)||{};return{id:'h:'+o.id,order_number:o.order_number,name:x.customer_name||'',phone:x.customer_phone||'',store_address:x.delivery_address||'',created_at:o.created_at,source:'home',order:{...o,...x,source:'home'}};}).filter(x=>x.name.trim()||x.phone.trim()||x.store_address.trim());customerRows=[...pickupRows,...homeRows];renderCustomers();}catch(x){note('orderMsg','讀取個資失敗：'+(x.message||x),true);}}
function cmatch(x,q){const o=x.order||{};return!q||[o.order_number,x.name,x.phone,o.store_name,o.store_address,x.store_address].join(' ').toLowerCase().includes(q);}
function customerCard(x){const o=x.order||x;const home=x.source==='home'||o.source==='home';return '<div class="customer-card"><div class="row"><div class="grow"><b>訂單 '+esc(o.order_number||'—')+'</b><br>'+esc(x.name||o.customer_name||'')+'　'+esc(x.phone||o.customer_phone||'')+'</div><button class="btn small" data-ca="edit" data-id="'+esc(x.id)+'">編輯</button><button class="btn red small" data-ca="delete" data-id="'+esc(x.id)+'">🗑 刪除</button></div><div class="muted">'+(home?'📍 地址：'+esc(x.store_address||o.store_address||'—'):'🏪 門市：'+esc([o.convenience_store,o.store_name].filter(Boolean).join(' ')||'—')+'　💳 後五碼：'+esc(o.payment_last5||'—'))+'</div></div>';}
function renderCustomers(){const p=customerRows.filter(x=>x.order?.source==='pickup'&&cmatch(x,$('cps').value.trim().toLowerCase()));const h=customerRows.filter(x=>(x.source==='home'||x.order?.source==='home')&&cmatch(x,$('chs').value.trim().toLowerCase()));$('cpc').textContent=p.length;$('chc').textContent=h.length;$('cpList').innerHTML=p.map(customerCard).join('')||'<div class="muted">目前沒有超商寄放個資。</div>';$('chList').innerHTML=h.map(customerCard).join('')||'<div class="muted">目前沒有送到府個資。</div>';}
$('customers').addEventListener('click',async e=>{const b=e.target.closest('button[data-ca]');if(!b)return;const x=customerRows.find(v=>String(v.id)===String(b.dataset.id));if(!x)return;if(b.dataset.ca==='edit'){const n=prompt('修改姓名',x.name||'');if(n===null)return;const p=prompt('修改電話',x.phone||'');if(p===null)return;let r;if(x.source==='home'){r=await db.from('order_private').update({customer_name:n.trim(),customer_phone:p.trim()}).eq('order_id',String(x.id).slice(2));}else{r=await db.from('order_customers').update({name:n.trim(),phone:p.trim()}).eq('id',x.id);}if(r.error){alert('更新失敗：'+r.error.message);return;}await loadCustomers();await loadOrders();}else{if(!confirm('確定要刪除這筆個資嗎？訂單資料保留。'))return;let r;if(x.source==='home'){r=await db.from('order_private').update({customer_name:'',customer_phone:'',delivery_address:''}).eq('order_id',String(x.id).slice(2)).select('order_id');}else{r=await db.from('cooling_pickup_orders').update({customer_id:null}).eq('customer_id',x.id).select('id');if(!r.error)r=await db.from('order_customers').delete().eq('id',x.id).select('id');}if(r.error){alert('刪除個資失敗：'+r.error.message);return;}await loadCustomers();await loadOrders();}});
$('searchCP').addEventListener('click',renderCustomers);$('searchCH').addEventListener('click',renderCustomers);$('cps').addEventListener('input',renderCustomers);$('chs').addEventListener('input',renderCustomers);
async function loadDaily(){const d=$('dailyDate').value||today();const [s,r,f]=await Promise.all([db.from('daily_order_settings').select('*').eq('order_date',d).maybeSingle(),db.from('daily_order_regions').select('*').eq('order_date',d).order('id'),db.from('daily_order_flavors').select('*').eq('order_date',d).order('id')]);$('enabled').value=s.data?.ordering_enabled===false?'false':'true';regions=r.data||[];daily=f.data||[];renderDaily();}
async function loadMaster(){master=(await db.from('flavors').select('id,product_name,name,price,enabled').order('id')).data||[];}
function renderDaily(){$('regions').innerHTML=regions.map((x,i)=>'<div class="row"><b class="grow">'+esc(x.region_name)+'</b><button class="btn small '+(x.enabled?'red':'green')+'" data-ri="'+i+'">'+(x.enabled?'關閉':'開放')+'</button></div>').join('')||'<div class="muted">尚未設定地區。</div>';$('flavors').innerHTML=master.filter(x=>x.enabled).map(p=>{const d=daily.find(x=>Number(x.flavor_id)===Number(p.id));return '<div class="row"><b class="grow">'+esc(p.product_name||'涼糕')+'／'+esc(p.name)+'</b><span>價格 '+Number(d?.price??p.price??0)+'</span><button class="btn small '+(d?.enabled?'red':'green')+'" data-fi="'+p.id+'">'+(d?.enabled?'關閉':'開放')+'</button></div>';}).join('');}
$('regions').addEventListener('click',e=>{const b=e.target.closest('[data-ri]');if(!b)return;regions[Number(b.dataset.ri)].enabled=!regions[Number(b.dataset.ri)].enabled;renderDaily();});$('flavors').addEventListener('click',e=>{const b=e.target.closest('[data-fi]');if(!b)return;const id=Number(b.dataset.fi);const p=master.find(x=>Number(x.id)===id);let d=daily.find(x=>Number(x.flavor_id)===id);if(!d){d={flavor_id:id,product_name:p.product_name||'涼糕',flavor_name:p.name,price:Number(p.price||0),enabled:true};daily.push(d);}else d.enabled=!d.enabled;renderDaily();});$('addRegion').addEventListener('click',()=>{const n=prompt('輸入地區名稱');if(n?.trim()){regions.push({region_name:n.trim(),enabled:true});renderDaily();}});$('save').addEventListener('click',async()=>{const d=$('dailyDate').value||today();let r=await db.from('daily_order_settings').upsert({order_date:d,ordering_enabled:$('enabled').value==='true',updated_at:new Date().toISOString()},{onConflict:'order_date'});if(r.error){note('dailyMsg',r.error.message,true);return;}await db.from('daily_order_regions').delete().eq('order_date',d);await db.from('daily_order_flavors').delete().eq('order_date',d);if(regions.length)await db.from('daily_order_regions').insert(regions.map(x=>({order_date:d,region_name:x.region_name,enabled:x.enabled})));if(daily.length)await db.from('daily_order_flavors').insert(daily.filter(x=>x.enabled).map(x=>({order_date:d,flavor_id:x.flavor_id,product_name:x.product_name||'涼糕',flavor_name:x.flavor_name,price:Number(x.price||0),enabled:true,quantity:0})));note('dailyMsg','已儲存。');loadDaily();});$('dailyDate').addEventListener('change',loadDaily);
document.querySelectorAll('.nav button').forEach(b=>b.addEventListener('click',async()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('#app>section').forEach(x=>x.classList.add('hidden'));$(b.dataset.page).classList.remove('hidden');if(b.dataset.page==='orders')loadOrders();if(b.dataset.page==='customers')loadCustomers();if(b.dataset.page==='daily'){await loadMaster();loadDaily();}}));
db.auth.getSession().then(r=>{if(r.data.session)access(r.data.session.user).then(x=>{if(!x)openApp();});});
</script></body></html>
