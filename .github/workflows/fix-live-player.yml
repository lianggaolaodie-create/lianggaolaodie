name: Fix TikTok LIVE HLS relay

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix-live-player:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use HLS relay URL without double proxy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "const directHls=data.hls_url||'';"
          new = "const directHls=data.hls_relay_url||data.hls_url||'';"
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
              print('Patched LIVE HLS to use relay URL')
          elif new in s:
              print('LIVE HLS relay URL already enabled')
          else:
              raise SystemExit('LIVE HLS source line not found')
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No LIVE player change needed'
            exit 0
          fi
          git commit -m 'Fix TikTok LIVE HLS relay playback [skip ci]'
          git push
