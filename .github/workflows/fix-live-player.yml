name: Fix TikTok live player
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch LIVE relay URL
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="""        const directHls=data.hls_url||'';
        const directFlv=data.flv_url||'';
        const isAndroid=/Android/i.test(navigator.userAgent);
        const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
        const streamUrl=directHls||directFlv;
        const fallbackUrl=directHls&&directFlv ? directFlv : '';
        const streamType=directHls ? 'hls' : 'flv';"""
          new="""        const directHls=data.hls_relay_url||data.hls_url||'';
        const directFlv=data.flv_url||'';
        const streamUrl=directHls||directFlv;
        const fallbackUrl=directHls&&directFlv ? directFlv : '';
        const streamType=directHls ? 'hls' : 'flv';"""
          if old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
              print('LIVE relay URL patch applied')
          else:
              print('LIVE relay URL patch already present or target differs')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix TikTok LIVE relay playback [skip ci]'
          git push
