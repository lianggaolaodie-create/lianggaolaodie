name: Restore TikTok live player
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore 20260927 LIVE playback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          replacements = {
              "const directHls=data.hls_relay_url||data.hls_url||'';": "const directHls=data.hls_url||'';",
              "const streamUrl=directHls||directFlv;": "const streamUrl=isAndroid ? (directFlv||directHls) : (directHls||directFlv);",
              "const fallbackUrl=directHls&&directFlv ? directFlv : '';": "const fallbackUrl=isAndroid && directFlv&&directHls ? directHls : (directFlv&&directHls ? directFlv : '');",
              "const streamType=directHls ? 'hls' : 'flv';": "const streamType=isAndroid&&directFlv ? 'flv' : 'hls';",
              "const playUrl=API.split('?')[0]+'?proxy='+encodeURIComponent(streamUrl);": "const playUrl=isFlv ? API.split('?')[0]+'?proxy='+encodeURIComponent(streamUrl) : streamUrl;",
          }
          changed=False
          for old,new in replacements.items():
              if old in s:
                  s=s.replace(old,new,1)
                  changed=True
          p.write_text(s,encoding='utf-8')
          print('20260927 LIVE playback restored' if changed else '20260927 LIVE playback already restored')
          PY
      - name: Commit restore
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Restore 20260927 TikTok LIVE playback [skip ci]'
          git push
