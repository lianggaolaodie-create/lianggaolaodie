name: Fix official LINE chat links

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-line-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace LINE share/profile links with direct official chat
        shell: bash
        run: |
          set -e
          changed=0
          while IFS= read -r -d '' file; do
            before=$(cat "$file")
            after="$before"
            after="${after//https:\/\/line.me\/R\/ti\/p\/@502iugah/https:\/\/line.me\/R\/oaMessage\/%40502iugah}"
            after="${after//https:\/\/line.me\/R\/ti\/p\/%40502iugah/https:\/\/line.me\/R\/oaMessage\/%40502iugah}"
            after="${after//https:\/\/line.me\/R\/nv\/recommendOA\/%40502iugah/https:\/\/line.me\/R\/oaMessage\/%40502iugah}"
            after="${after//https:\/\/line.me\/R\/nv\/recommendOA\/@502iugah/https:\/\/line.me\/R\/oaMessage\/%40502iugah}"
            if [ "$after" != "$before" ]; then
              printf '%s' "$after" > "$file"
              changed=1
            fi
          done < <(find . -type f -name '*.html' -print0)

          if [ "$changed" -eq 1 ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add '*.html'
            git commit -m 'Fix all official LINE buttons to direct chat'
            git push
          else
            echo 'No old LINE share/profile links found.'
          fi
