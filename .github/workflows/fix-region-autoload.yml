name: Fix delivery region autoload

on:
  push:
    paths:
      - '.github/workflows/fix-region-autoload.yml'
      - 'home-delivery-order.html'
      - 'convenience-order.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[region-autoload-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add region autoload fixes
        shell: python
        run: |
          from pathlib import Path

          # Home delivery: bind the existing loadDate function to the delivery date.
          home_snippet = r'''<script id="region-autoload-fix">
          (function(){
            function bind(){
              const date=document.getElementById('deliveryDate');
              if(!date || typeof window.loadDate!=='function') return false;
              if(date.dataset.regionAutoloadBound==='1') return true;
              date.dataset.regionAutoloadBound='1';
              date.addEventListener('change', window.loadDate);
              date.addEventListener('input', window.loadDate);
              if(date.value) setTimeout(function(){ window.loadDate(); }, 50);
              return true;
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', bind);
            else bind();
            let tries=0;
            const timer=setInterval(function(){
              tries++;
              if(bind() || tries>=20) clearInterval(timer);
            }, 250);
          })();
          </script>'''

          # Convenience-store page: its actual date element is orderDate and
          # its init() function was defined but was not being started.
          convenience_snippet = r'''<script id="convenience-order-init-fix">
          (function(){
            function start(){
              if(typeof window.init!=='function') return false;
              if(window.__convenienceOrderInitStarted) return true;
              window.__convenienceOrderInitStarted=true;
              Promise.resolve(window.init()).catch(function(err){
                const msg=document.getElementById('msg');
                if(msg) msg.innerHTML='<div class="notice err">訂購資料讀取失敗，請重新整理頁面。</div>';
                console.error(err);
              });
              return true;
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', start);
            else start();
            let tries=0;
            const timer=setInterval(function(){
              tries++;
              if(start() || tries>=20) clearInterval(timer);
            }, 250);
          })();
          </script>'''

          for name, snippet in [
              ('home-delivery-order.html', home_snippet),
              ('convenience-order.html', convenience_snippet),
          ]:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              marker='</body>'
              if marker not in s:
                  continue
              marker_id = 'id="region-autoload-fix"' if name == 'home-delivery-order.html' else 'id="convenience-order-init-fix"'
              if marker_id in s:
                  continue
              s=s.replace(marker, snippet+'\n'+marker, 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-delivery-order.html convenience-order.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: autoload order page initialization [region-autoload-fixed]'
          git push
