name: Fix delivery region autoload

on:
  push:
    paths:
      - '.github/workflows/fix-region-autoload.yml'
      - 'home-delivery-order.html'
      - 'convenience-order.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[region-autoload-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add region autoload fix
        shell: python
        run: |
          from pathlib import Path
          snippet = r'''<script id="region-autoload-fix">
          (function(){
            function bind(){
              const date=document.getElementById('deliveryDate');
              if(!date || typeof window.loadDate!=='function') return false;
              if(date.dataset.regionAutoloadBound==='1') return true;
              date.dataset.regionAutoloadBound='1';
              date.addEventListener('change', window.loadDate);
              date.addEventListener('input', window.loadDate);
              if(date.value) setTimeout(function(){ window.loadDate(); }, 50);
              return true;
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', bind);
            else bind();
            let tries=0;
            const timer=setInterval(function(){
              tries++;
              if(bind() || tries>=20) clearInterval(timer);
            }, 250);
          })();
          </script>'''
          for name in ['home-delivery-order.html','convenience-order.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              if 'id="region-autoload-fix"' in s:
                  continue
              marker='</body>'
              if marker in s:
                  s=s.replace(marker, snippet+'\n'+marker, 1)
                  p.write_text(s, encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-delivery-order.html convenience-order.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'fix: autoload delivery regions [region-autoload-fixed]'
          git push
