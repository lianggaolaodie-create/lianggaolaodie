name: Fix delivery region autoload

on:
  push:
    paths:
      - '.github/workflows/fix-region-autoload.yml'
      - 'home-delivery-order.html'
      - 'convenience-order.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[region-autoload-fixed-v2]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix order pages
        shell: python
        run: |
          from pathlib import Path

          p=Path('convenience-order.html')
          if p.exists():
              s=p.read_text(encoding='utf-8')

              # Keep exactly one global filled-cake cut-choice block.
              block='''<div id="globalCutChoice" class="global-cut-choice">\n  <div class="global-cut-title">包餡切法</div>\n  <label><input type="radio" name="global-cut-option" value="不切" checked>不切</label>\n  <label><input type="radio" name="global-cut-option" value="切">切</label>\n</div>'''
              if block in s:
                  first=s.find(block)
                  prefix=s[:first]
                  suffix=s[first+len(block):]
                  suffix=suffix.replace(block,'')
                  s=prefix+block+suffix

              # The page declares `const init = ...`; const bindings are not window.init.
              # Start init() inside the same script scope so the date/region queries actually run.
              if 'async function init()' in s and '/* convenience-init-started */' not in s:
                  pos=s.find('async function init()')
                  end=s.find('</script>',pos)
                  if end != -1:
                      s=s[:end]+'\n/* convenience-init-started */\ninit();\n'+s[end:]

              p.write_text(s,encoding='utf-8')

          # Keep the home-delivery autoload helper, but do not depend on window.init.
          hp=Path('home-delivery-order.html')
          if hp.exists():
              s=hp.read_text(encoding='utf-8')
              if 'id="region-autoload-fix-v2"' not in s:
                  snippet='''<script id="region-autoload-fix-v2">\n(function(){\n  function bind(){\n    const d=document.getElementById('deliveryDate');\n    if(!d || typeof window.loadDate!=='function') return false;\n    if(d.value) window.loadDate();\n    return true;\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bind); else bind();\n})();\n</script>'''
                  s=s.replace('</body>',snippet+'\n</body>',1)
                  hp.write_text(s,encoding='utf-8')

      - name: Commit fixed pages
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add convenience-order.html home-delivery-order.html
          if git diff --cached --quiet; then
            echo 'No changes'
            exit 0
          fi
          git commit -m 'fix: order page init and cut choice [region-autoload-fixed-v2]'
          git push
