name: Add flavor type selector to admin
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin-products.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('admin-products.html')
          s=p.read_text()
          changed=False

          marker='<div class="field"><label>基本價格</label><input id="price" type="number" min="0" required></div>'
          insert=marker+'<div class="field"><label>口味類型</label><select id="flavorType"><option value="single">單一口味（不包餡）</option><option value="filled">包餡</option></select><div class="small">包餡口味會在官網下單時顯示「切／不切」；單一口味不會顯示。</div></div>'
          if 'id="flavorType"' not in s and marker in s:
              s=s.replace(marker,insert,1); changed=True

          marker="$('price').value=p.price||0;$('desc').value=p.description||'';"
          insert="$('price').value=p.price||0;$('flavorType').value=p.flavor_type||'single';$('desc').value=p.description||'';"
          if marker in s and "$('flavorType').value=p.flavor_type" not in s:
              s=s.replace(marker,insert,1); changed=True

          marker="const payload={product_name:productName,name,price:Number($('price').value||0),description:$('desc').value.trim()||null,image_url:imageUrl,enabled:$('enabled').checked};"
          insert="const payload={product_name:productName,name,price:Number($('price').value||0),flavor_type:$('flavorType').value==='filled'?'filled':'single',description:$('desc').value.trim()||null,image_url:imageUrl,enabled:$('enabled').checked};"
          if marker in s and 'flavor_type:$(' not in s:
              s=s.replace(marker,insert,1); changed=True

          marker="<br>價格：NT$ '+Number(p.price||0).toLocaleString()+'　<span class=\"badge '+(p.enabled?'':'off')+'\">"
          insert="<br>價格：NT$ '+Number(p.price||0).toLocaleString()+'　<span class=\"badge\">'+(p.flavor_type==='filled'?'包餡':'單一口味')+'</span>　<span class=\"badge '+(p.enabled?'':'off')+'\">"
          if marker in s and "p.flavor_type==='filled'" not in s:
              s=s.replace(marker,insert,1); changed=True

          if changed:
              p.write_text(s)
          else:
              print('No patch needed')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-products.html .github/workflows/add-flavor-type-admin.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add flavor type selector to product admin"
          git push
