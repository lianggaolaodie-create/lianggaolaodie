name: Remove official live block

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove official live section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'\n<section id="officialLive"\b[\s\S]*?</section>\n'
          new, n = re.subn(pattern, '\n', s, count=1)
          if n != 1:
              raise SystemExit('officialLive section not found; no change made')
          p.write_text(new, encoding='utf-8')
          print('Removed officialLive section')
          PY
      - name: Commit removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove official LIVE block from homepage'
          git push
