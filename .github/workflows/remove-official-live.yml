name: Remove official live block

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove official LIVE section safely
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          original = s

          patterns = [
              r'\n<section\s+id=["\']officialLive["\'][\s\S]*?</section>\s*',
              r'\n<section\s+class=["\'][^"\']*\blive-section\b[^"\']*["\'][\s\S]*?</section>\s*',
          ]
          for pattern in patterns:
              s = re.sub(pattern, '\n', s, count=1, flags=re.I)

          if s == original:
              print('Official LIVE block already removed; no change needed')
          else:
              p.write_text(s, encoding='utf-8')
              print('Removed homepage LIVE block')

      - name: Commit removal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Remove official LIVE block from homepage'
          git push
