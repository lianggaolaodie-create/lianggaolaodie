name: Ensure filled flavor cut choice
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ordering pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          snippet = r'''<script id="filled-cut-option-fix">
          (()=>{
            function addCutChoices(){
              const root=document.getElementById('flavors');
              if(!root) return;
              [...root.querySelectorAll('.flavor')].forEach((card,i)=>{
                if(card.querySelector('.cut-choice')) return;
                const priceEl=card.querySelector('.price');
                if(!priceEl) return;
                const price=Number((priceEl.textContent||'').replace(/[^0-9.]/g,''));
                if(price<150) return;
                const info=[...card.children].find(x=>x.querySelector&&x.querySelector('.price'));
                if(!info) return;
                const box=document.createElement('div');
                box.className='cut-choice';
                box.innerHTML='<div class="cut-title">包餡切法</div><label><input type="radio" name="cut-option-'+i+'" value="不切" checked>不切</label><label><input type="radio" name="cut-option-'+i+'" value="切">切</label>';
                info.appendChild(box);
              });
            }
            const root=document.getElementById('flavors');
            if(root) new MutationObserver(addCutChoices).observe(root,{childList:true,subtree:true});
            addCutChoices();
            const form=document.getElementById('orderForm');
            if(form && !form.dataset.cutBound){
              form.dataset.cutBound='1';
              form.addEventListener('submit',()=>{
                const notes=document.getElementById('notes');
                if(!notes) return;
                const choices=[...document.querySelectorAll('#flavors .flavor')].map((card,i)=>{
                  const q=card.querySelector('.qty span');
                  const qty=Number(q?.textContent||0);
                  if(qty<=0 || !card.querySelector('.cut-choice')) return null;
                  const name=card.querySelector('b')?.textContent?.trim()||'包餡口味';
                  const cut=card.querySelector('input[type="radio"]:checked')?.value||'不切';
                  return name+' × '+qty+'：'+cut;
                }).filter(Boolean);
                const base=notes.value.replace(/\n?\[包餡切法\][\s\S]*$/,'').trim();
                notes.value=[base,choices.length?'[包餡切法] '+choices.join('；'):''].filter(Boolean).join('\n');
              },{capture:true});
            }
          })();
          </script>'''
          css = r'''.cut-choice{margin-top:8px;padding:8px 10px;border-radius:12px;background:#fff7fa;border:1px solid #f0d6e1}.cut-title{font-size:13px;font-weight:900;color:#7a304d;margin-bottom:5px}.cut-choice label{font-size:13px;margin-right:12px;cursor:pointer}.cut-choice input{accent-color:#c52f68;margin-right:4px}'''

          for fn in ['home-delivery-order.html','convenience-order.html']:
              p=Path(fn)
              s=p.read_text()
              if 'id="filled-cut-option-fix"' not in s:
                  s=s.replace('</style>',css+'</style>',1)
                  s=s.replace('</body>',snippet+'</body>',1)
                  p.write_text(s)
                  print('patched',fn)

          PY
      - name: Commit patched pages
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-delivery-order.html convenience-order.html
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "fix: render filled flavor cut choice"; git push; fi
