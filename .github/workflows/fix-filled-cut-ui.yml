name: Fix filled flavor cut choice position

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[filled-cut-stable-v4]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair order pages
        shell: python
        run: |
          from pathlib import Path
          import re

          css = r'''.global-cut-choice{margin-top:14px;padding:14px 16px;border-radius:14px;background:#fff7fa;border:1px solid #f0d6e1}.global-cut-title{font-size:16px;font-weight:900;color:#7a304d;margin-bottom:10px}.global-cut-choice label{display:inline-flex;align-items:center;margin-right:24px;font-size:16px;cursor:pointer}.global-cut-choice input{accent-color:#c52f68;margin-right:7px;width:18px;height:18px}'''
          global_html = r'''<div id="globalCutChoice" class="global-cut-choice">
            <div class="global-cut-title">包餡切法</div>
            <label><input type="radio" name="global-cut-option" value="不切" checked>不切</label>
            <label><input type="radio" name="global-cut-option" value="切">切</label>
          </div>'''
          submit_js = r'''<script id="global-cut-submit-fix">
          (()=>{
            const form=document.getElementById('orderForm');
            if(!form||form.dataset.globalCutBound) return;
            form.dataset.globalCutBound='1';
            form.addEventListener('submit',()=>{
              const notes=document.getElementById('notes');
              const selected=document.querySelector('input[name="global-cut-option"]:checked')?.value||'不切';
              if(notes){
                const base=notes.value.replace(/\n?\[包餡切法\][\s\S]*$/,'').trim();
                notes.value=[base,'[包餡切法] '+selected].filter(Boolean).join('\n');
              }
            },{capture:true});
          })();
          </script>'''
          fallback_js = r'''<script id="convenience-data-fallback">
          (function(){
            const URL='https://yemzdwxtyosuaczsqwea.supabase.co';
            const KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';
            async function load(){
              const dateEl=document.getElementById('orderDate');
              const regionEl=document.getElementById('region');
              if(!dateEl||!regionEl) return;
              if(dateEl.options.length>1 && regionEl.options.length>1) return;
              const headers={apikey:KEY,Authorization:'Bearer '+KEY};
              try{
                const today=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
                const base=URL+'/rest/v1/';
                const qs='select=order_date,ordering_enabled&order_date=gte.'+encodeURIComponent(today)+'&ordering_enabled=eq.true&order=order_date.asc';
                const r=await fetch(base+'daily_order_settings?'+qs,{headers});
                if(!r.ok) throw new Error('settings '+r.status);
                const dates=await r.json();
                if(dates.length){
                  dateEl.innerHTML=dates.map(x=>'<option value="'+x.order_date+'">'+x.order_date.replace(/^(\\d{4})-(\\d{2})-(\\d{2})$/,'$1年$2月$3日')+'</option>').join('');
                  dateEl.value=dates[0].order_date;
                  const rr=await fetch(base+'daily_order_regions?select=region_name&order_date=eq.'+encodeURIComponent(dateEl.value)+'&enabled=eq.true&order=id.asc',{headers});
                  if(rr.ok){
                    const regions=await rr.json();
                    regionEl.innerHTML='<option value="">請選擇當日開放地區</option>'+regions.map(x=>'<option>'+String(x.region_name).replace(/[&<>]/g,'')+'</option>').join('');
                  }
                }
              }catch(e){ console.error('order fallback',e); }
            }
            setTimeout(load,500);
            setTimeout(load,1500);
          })();
          </script>'''

          block_re=re.compile(r'<div id="globalCutChoice" class="global-cut-choice">\s*<div class="global-cut-title">包餡切法</div>\s*<label><input type="radio" name="global-cut-option" value="不切" checked>不切</label>\s*<label><input type="radio" name="global-cut-option" value="切">切</label>\s*</div>',re.S)
          for fn in ['home-delivery-order.html','convenience-order.html']:
              p=Path(fn)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              s=block_re.sub('',s)
              s=re.sub(r'<script id="global-cut-submit-fix">.*?</script>','',s,flags=re.S)
              s=s.replace('</style>',css+'</style>',1)
              s=re.sub(r'(<div id="flavors"></div>)',r'\1'+global_html,s,count=1)
              s=s.replace('</body>',submit_js+'\n'+('</script></body>' if False else '')+'</body>',1)
              if fn=='convenience-order.html':
                  s=s.replace('</body>',fallback_js+'\n</body>',1)
              p.write_text(s,encoding='utf-8')

      - name: Commit repaired pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-delivery-order.html convenience-order.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: reliable order date and region loading [filled-cut-stable-v4]"
            git push
          fi
