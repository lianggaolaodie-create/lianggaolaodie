name: Final global cut choice

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[global-cut-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair order pages
        shell: python
        run: |
          from pathlib import Path
          import re

          css = r'''.global-cut-choice{margin-top:14px;padding:14px 16px;border-radius:14px;background:#fff7fa;border:1px solid #f0d6e1}.global-cut-title{font-size:16px;font-weight:900;color:#7a304d;margin-bottom:10px}.global-cut-choice label{display:inline-flex;align-items:center;margin-right:24px;font-size:16px;cursor:pointer}.global-cut-choice input{accent-color:#c52f68;margin-right:7px;width:18px;height:18px}'''
          block = r'''<div id="globalCutChoice" class="global-cut-choice" style="display:none">
            <div class="global-cut-title">包餡切法</div>
            <label><input type="radio" name="global-cut-option" value="不切" checked>不切</label>
            <label><input type="radio" name="global-cut-option" value="切">切</label>
          </div>'''

          # 超商頁維持目前已正常運作的單一切法區塊。
          p = Path('convenience-order.html')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<div id="globalCutChoice" class="global-cut-choice"[^>]*>.*?</div>\s*</div>', '', s, flags=re.S)
              s = re.sub(r'\.global-cut-choice\{[^}]*\}\.global-cut-title\{[^}]*\}\.global-cut-choice label\{[^}]*\}\.global-cut-choice input\{[^}]*\}', '', s)
              if '<div id="flavors"></div>' in s:
                  s = s.replace('<div id="flavors"></div>', '<div id="flavors"></div>' + block, 1)
              s = s.replace('</style>', css + '</style>', 1)
              p.write_text(s, encoding='utf-8')

          # 到府頁不要再插入第二個 globalCutChoice；只保留 #cut。
          p = Path('home-delivery-order.html')
          if p.exists():
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'<div id="globalCutChoice".*?</div>\s*', '', s, count=1, flags=re.S)
              s = re.sub(r'\n\.global-cut-choice\{.*?\.global-cut-choice input\{.*?\}\</style>', '</style>', s, count=1, flags=re.S)

              new_load = r'''async function loadDate(){
const d=$('deliveryDate').value;if(!d)return;
$('region').innerHTML='<option value="">讀取中…</option>';
$('flavors').innerHTML='<div class="muted">正在讀取當日口味…</div>';
$('cut').style.display='none';
try{
  const rr=await sb.from('daily_order_regions').select('region_name').eq('order_date',d).eq('enabled',true).order('id');
  if(rr.error)throw rr.error;
  const regions=rr.data||[];
  $('region').innerHTML='<option value="">請選擇當日開放地區</option>'+regions.map(x=>'<option value="'+esc(x.region_name)+'">'+esc(x.region_name)+'</option>').join('');
  if(!regions.length)$('region').innerHTML='<option value="">當日尚未開放送到府地區</option>';
  const ff=await sb.from('daily_order_flavors').select('flavor_id,product_name,flavor_name,price').eq('order_date',d).eq('enabled',true).order('id');
  if(ff.error)throw ff.error;
  const baseFlavors=ff.data||[];
  let imageMap={},typeMap={};
  try{const mm=await sb.from('flavors').select('id,image_url,flavor_type').eq('enabled',true);if(!mm.error){imageMap=Object.fromEntries((mm.data||[]).map(x=>[Number(x.id),x.image_url||'']));typeMap=Object.fromEntries((mm.data||[]).map(x=>[Number(x.id),String(x.flavor_type||'')]));}}catch(_){ }
  flavors=baseFlavors.map(x=>({...x,image_url:imageMap[Number(x.flavor_id)]||'',flavor_type:typeMap[Number(x.flavor_id)]||''}));
  $('flavors').innerHTML=flavors.map((x,i)=>'<div class="flavor">'+(x.image_url?'<img class="flavor-img" src="'+esc(x.image_url)+'" alt="'+esc(x.flavor_name)+'">':'<div class="flavor-placeholder">尚未設定照片</div>')+'<div><b>'+esc(x.product_name||'涼糕')+'／'+esc(x.flavor_name)+'</b><div class="price">NT$ '+Number(x.price||0).toLocaleString()+'</div></div><div class="qty"><button type="button" onclick="changeQty('+i+',-1)">−</button><span id="q'+i+'">0</span><button type="button" onclick="changeQty('+i+',1)">＋</button></div></div>').join('');
  $('flavorEmpty').style.display=flavors.length?'none':'block';
  const hasFilled=flavors.some(x=>{const t=String(x.flavor_type||'').toLowerCase();return t==='filled'||t.includes('包餡')||t.includes('夾心')});
  $('cut').style.display=hasFilled?'block':'none';updateTotals();
}catch(e){$('region').innerHTML='<option value="">讀取失敗，請稍後再試</option>';$('flavors').innerHTML='';msg('當日資料讀取失敗：'+(e.message||e));}}
'''
              s = re.sub(r'async function loadDate\(\)\{.*?\}\s*function changeQty', new_load + 'function changeQty', s, count=1, flags=re.S)
              p.write_text(s, encoding='utf-8')

      - name: Verify order pages
        shell: python
        run: |
          from pathlib import Path
          h = Path('home-delivery-order.html').read_text(encoding='utf-8')
          c = Path('convenience-order.html').read_text(encoding='utf-8')
          if h.count('id="globalCutChoice"') != 0:
              raise SystemExit('home-delivery-order.html must not contain globalCutChoice')
          if c.count('id="globalCutChoice"') != 1:
              raise SystemExit(f'convenience-order.html globalCutChoice count={c.count("id=\"globalCutChoice\"")}')

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-delivery-order.html convenience-order.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: exactly one global filled cut choice [global-cut-final]"
            git push
          fi
