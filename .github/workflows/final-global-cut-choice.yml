name: Final global cut choice

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[global-cut-final]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair order pages
        shell: python
        run: |
          from pathlib import Path
          import re

          css = r'''.global-cut-choice{margin-top:14px;padding:14px 16px;border-radius:14px;background:#fff7fa;border:1px solid #f0d6e1}.global-cut-title{font-size:16px;font-weight:900;color:#7a304d;margin-bottom:10px}.global-cut-choice label{display:inline-flex;align-items:center;margin-right:24px;font-size:16px;cursor:pointer}.global-cut-choice input{accent-color:#c52f68;margin-right:7px;width:18px;height:18px}'''
          block = r'''<div id="globalCutChoice" class="global-cut-choice">
            <div class="global-cut-title">包餡切法</div>
            <label><input type="radio" name="global-cut-option" value="不切" checked>不切</label>
            <label><input type="radio" name="global-cut-option" value="切">切</label>
          </div>'''

          for filename in ('home-delivery-order.html','convenience-order.html'):
              p = Path(filename)
              if not p.exists():
                  continue
              s = p.read_text(encoding='utf-8')

              # Remove every existing global cut-choice block, even if duplicated.
              pattern = r'<div id="globalCutChoice" class="global-cut-choice">.*?</div>\s*(?=<div id="globalCutChoice"|<div id="flavorEmpty"|</div>)'
              s = re.sub(pattern, '', s, flags=re.S)
              # Also remove any remaining duplicate blocks conservatively.
              s = re.sub(r'<div id="globalCutChoice" class="global-cut-choice">.*?</div>\s*', '', s, flags=re.S)

              # Remove old style definitions, then add one canonical style.
              s = re.sub(r'\.global-cut-choice\{.*?\.global-cut-choice input\{.*?\}', '', s, flags=re.S)
              s = s.replace('</style>', css + '</style>', 1)

              # Insert exactly one block after the flavors container.
              if '<div id="flavors"></div>' in s:
                  s = s.replace('<div id="flavors"></div>', '<div id="flavors"></div>' + block, 1)

              p.write_text(s, encoding='utf-8')

      - name: Verify exactly one choice on each page
        shell: python
        run: |
          from pathlib import Path
          for filename in ('home-delivery-order.html','convenience-order.html'):
              s = Path(filename).read_text(encoding='utf-8')
              count = s.count('id="globalCutChoice"')
              print(filename, 'globalCutChoice count =', count)
              if count != 1:
                  raise SystemExit(f'{filename}: expected exactly 1 globalCutChoice, got {count}')

      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-delivery-order.html convenience-order.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: repair home delivery cut choice [global-cut-final]"
            git push
          fi
