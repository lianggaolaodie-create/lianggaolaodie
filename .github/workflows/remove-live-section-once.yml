name: Remove homepage LIVE section once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-live:
    if: ${{ !contains(github.event.head_commit.message, '[remove-live]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove official LIVE section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = r'\n<section id="officialLive"\b[\s\S]*?</section>\s*'
          new, n = re.subn(pattern, '\n', s, count=1)
          if n != 1:
              raise SystemExit('officialLive section not found; no changes made')
          p.write_text(new, encoding='utf-8')
          print('Removed officialLive section')
          PY
          rm -f .github/workflows/remove-live-section-once.yml
      - name: Commit removal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/remove-live-section-once.yml
          git commit -m "Remove homepage LIVE section [remove-live]"
          git push
