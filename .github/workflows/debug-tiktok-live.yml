name: Debug TikTok LIVE connector
on:
  push:
    paths:
      - '.github/workflows/debug-tiktok-live.yml'
permissions:
  contents: write
jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect connector
        run: |
          npm init -y >/dev/null 2>&1
          npm install tiktok-live-connector@2.5.0 >/dev/null 2>&1
          node <<'NODE' > tiktok-connector-debug.json
          const { TikTokLiveConnection } = require('tiktok-live-connector');
          (async()=>{
            const username='kaip1018';
            const out={username};
            try {
              const c=new TikTokLiveConnection(username,{fetchRoomInfoOnConnect:false,processInitialData:false,requestPollingIntervalMs:1000});
              try {
                const raw=await c.fetchRoomInfo();
                out.connected=true;
                out.roomId=String(c.roomId||raw?.room_id||raw?.roomId||'');
                out.rawKeys=Object.keys(raw||{});
                const find=(v)=>{if(!v||typeof v!=='object')return null;if(v.stream_url)return v;for(const k of ['data','room_info','roomInfo','result','response']){if(v[k]){const x=find(v[k]);if(x)return x}}return null};
                const info=find(raw)||raw||{};
                const su=info?.stream_url||{};
                out.streamUrlKeys=Object.keys(su||{});
                out.hasHls=!!su?.hls_pull_url;
                out.hasFlv=!!su?.flv_pull_url;
                out.streamUrlSummary={hls:typeof su?.hls_pull_url==='string'?su.hls_pull_url.slice(0,120):null,flv:typeof su?.flv_pull_url==='string'?su.flv_pull_url.slice(0,120):null};
              } finally { try{c.disconnect()}catch{} }
            } catch(e) { out.error=String(e?.stack||e); }
            console.log(JSON.stringify(out,null,2));
          })();
          NODE
      - name: Commit debug result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tiktok-connector-debug.json
          git diff --cached --quiet && exit 0
          git commit -m 'debug: record TikTok connector stream result [skip ci]'
          git push
