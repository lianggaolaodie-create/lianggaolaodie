name: Apply admin delete patch
on:
  push:
    paths:
      - '.github/admin-delete-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch delete handlers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          marker="async function loadOrders()"
          handlers="""window.deleteOrder=async id=>{if(!confirm('確定要永久刪除這筆訂單？訂單、商品明細與對應個資都會刪除，無法復原。'))return;const{error}=await sb.rpc('admin_delete_order',{p_order_id:id});if(error)return alert('刪除訂單失敗：'+error.message);alert('訂單已刪除');loadOrders()};window.deletePrivate=async id=>{if(!confirm('確定要刪除這筆個資？訂單資料會保留，只刪除姓名、電話、門市與備註。'))return;const{error}=await sb.rpc('admin_delete_order_private',{p_order_id:id});if(error)return alert('刪除個資失敗：'+error.message);alert('個資已刪除');loadPrivate()};"""
          if 'window.deleteOrder=' not in s:
            if marker not in s: raise SystemExit('loadOrders marker not found')
            s=s.replace(marker,handlers+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Add working per-item delete actions' || exit 0
          git push
