name: Apply admin delete patch
on:
  push:
    paths:
      - '.github/admin-delete-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore and patch admin.html
        run: |
          git fetch --no-tags origin 61f15628c4bf31615cbba3c84c4f61d3834ced11
          git checkout 61f15628c4bf31615cbba3c84c4f61d3834ced11 -- admin.html
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          old="async function loadOrders(){$('ordersBox').textContent=''}"
          new="""async function loadOrders(){const{data,error}=await sb.from('orders').select('id,order_number,delivery_date,delivery_region,pickup_type,total_amount,status,payment_status,transfer_last5,created_at').order('created_at',{ascending:false}).limit(50);if(error)return msg('ordersBox',error.message,'msg error');if(!data?.length)return $('ordersBox').textContent='目前沒有訂單。';const rows=await Promise.all(data.map(async o=>{const{data:items}=await sb.from('order_items').select('flavor_name,unit_price,quantity,subtotal').eq('order_id',o.id).order('id');return {o,items:items||[]}}));$('ordersBox').innerHTML=rows.map(({o,items})=>'<div class=\"order\"><div><strong>訂單編號</strong><div>'+esc(o.order_number)+'</div></div><div><strong>配送日期</strong><div>'+esc(o.delivery_date)+'</div></div><div><strong>配送區域</strong><div>'+esc(o.delivery_region)+'</div></div><div><strong>取貨方式</strong><div>'+esc(o.pickup_type)+'</div></div><div><strong>總額</strong><div>'+money(o.total_amount)+'</div></div><div><strong>付款狀態</strong><div>'+esc(o.payment_status)+'</div></div><div><strong>匯款後五碼</strong><div>'+esc(o.transfer_last5||'未提供')+'</div></div><div><strong>訂單進度</strong><div><select onchange=\"changeStatus(\\''+o.id+'\\',this.value)\"><option value=\"pending\" '+(o.status==='pending'?'selected':'')+'>待處理</option><option value=\"confirmed\" '+(o.status==='confirmed'?'selected':'')+'>已確認</option><option value=\"preparing\" '+(o.status==='preparing'?'selected':'')+'>製作中</option><option value=\"shipped\" '+(o.status==='shipped'?'selected':'')+'>已出貨</option><option value=\"completed\" '+(o.status==='completed'?'selected':'')+'>已完成</option><option value=\"cancelled\" '+(o.status==='cancelled'?'selected':'')+'>已取消</option></select></div></div><div><strong>訂購商品</strong><div>'+esc(items.map(i=>(i.flavor_name||'商品')+' × '+i.quantity+' '+money(i.subtotal)).join('、')||'—')+'</div></div><div class=\"actions\"><button class=\"danger\" onclick=\"deleteOrder(\\''+o.id+'\\')\">刪除訂單</button></div></div>').join('')}"""
          if old not in s: raise SystemExit('loadOrders marker not found')
          s=s.replace(old,new,1)
          old2="async function loadPrivate(){$('privateBox').textContent=''}"
          new2="""async function loadPrivate(){const{data,error}=await sb.rpc('personal_data_admin_orders');if(error)return msg('privateBox',error.message,'msg error');if(!data?.length)return $('privateBox').textContent='目前沒有訂單個資。';$('privateBox').innerHTML=data.map(p=>'<div class=\"item\"><div><strong>訂單編號</strong><div>'+esc(p.order_number||p.order_id)+'</div></div><div><strong>姓名</strong><div>'+esc(p.customer_name)+'</div></div><div><strong>電話</strong><div>'+esc(p.customer_phone)+'</div></div><div><strong>取貨門市</strong><div>'+esc(p.pickup_store)+'</div></div><div><strong>備註</strong><div>'+esc(p.customer_note||'')+'</div></div><div class=\"actions\"><button class=\"danger\" onclick=\"deletePrivate(\\''+p.order_id+'\\')\">刪除個資</button></div></div>').join('')}"""
          if old2 not in s: raise SystemExit('loadPrivate marker not found')
          s=s.replace(old2,new2,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Add per-item order and private data delete buttons' || exit 0
          git push
