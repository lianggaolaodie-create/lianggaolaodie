name: Apply admin delete patch
on:
  push:
    paths:
      - '.github/admin-delete-trigger'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin.html
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- ADMIN_DELETE_UI_V2 -->'
          if marker not in s:
            patch=r'''<!-- ADMIN_DELETE_UI_V2 --><script>(function(){async function addDeleteButtons(){const ob=document.getElementById('ordersBox');if(ob){const{data}=await sb.from('orders').select('id,order_number');const map=new Map((data||[]).map(x=>[String(x.order_number||''),x.id]));ob.querySelectorAll('.order').forEach(card=>{if(card.querySelector('[data-delete-order]'))return;const n=card.querySelector('div:first-child div');const id=map.get(String(n?.textContent||''));if(!id)return;const a=document.createElement('div');a.className='actions';const b=document.createElement('button');b.className='danger';b.textContent='刪除訂單';b.setAttribute('data-delete-order','1');b.onclick=()=>window.deleteOrder(id);a.appendChild(b);card.appendChild(a)})}const pb=document.getElementById('privateBox');if(pb){pb.querySelectorAll('.item').forEach(card=>{if(card.querySelector('[data-delete-private]'))return;const id=card.querySelector('div:first-child div')?.textContent?.trim();if(!id)return;const a=document.createElement('div');a.className='actions';const b=document.createElement('button');b.className='danger';b.textContent='刪除個資';b.setAttribute('data-delete-private','1');b.onclick=()=>window.deletePrivate(id);a.appendChild(b);card.appendChild(a)})}}window.deleteOrder=async id=>{if(!confirm('確定要永久刪除這筆訂單？訂單、商品明細與對應個資都會刪除，無法復原。'))return;const{error}=await sb.rpc('admin_delete_order',{p_order_id:id});if(error)return alert('刪除訂單失敗：'+error.message);alert('訂單已刪除');loadOrders()};window.deletePrivate=async id=>{if(!confirm('確定要刪除這筆個資？訂單資料會保留，只刪除姓名、電話、門市與備註。'))return;const{error}=await sb.rpc('admin_delete_order_private',{p_order_id:id});if(error)return alert('刪除個資失敗：'+error.message);alert('個資已刪除');loadPrivate()};const start=()=>{addDeleteButtons();const o=document.getElementById('ordersBox'),p=document.getElementById('privateBox');if(o)new MutationObserver(addDeleteButtons).observe(o,{childList:true,subtree:true});if(p)new MutationObserver(addDeleteButtons).observe(p,{childList:true,subtree:true})};start()})();</script>'''
            pos=s.rfind('</script>')
            if pos<0: raise SystemExit('script end marker not found')
            s=s[:pos]+patch+s[pos:]
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Fix visible per-item delete buttons' || exit 0
          git push
