name: Fix merch admin UI
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/merch-ui-update.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair script tags and keep merch options
        shell: python
        run: |
          from pathlib import Path
          p = Path('merch-admin.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">'
          replacement = '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>\n<script>'
          if marker in s:
              s = s.replace(marker, replacement, 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit repaired page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add merch-admin.html
          git diff --cached --quiet || git commit -m '修復週邊商品後台腳本與登入功能'
          git push
