name: App public read API mock tests

on:
  push:
    branches:
      - app/phase-1-planning
    paths:
      - "app/mock-api/**"
      - ".github/workflows/app-public-read-api.yml"
  pull_request:
    paths:
      - "app/mock-api/**"
      - ".github/workflows/app-public-read-api.yml"

jobs:
  public-read-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run public read API tests
        run: node --test app/mock-api/public-read-api.test.js
