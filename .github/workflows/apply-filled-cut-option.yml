name: Apply filled flavor cut option
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ordering pages and flavor admin
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for name in ['home-delivery-order.html','convenience-order.html']:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text()
              if 'class="cut-choice"' not in s:
                  css='.cut-choice{margin-top:8px;padding:8px 10px;border-radius:12px;background:#fff7fa;border:1px solid #f0d6e1}.cut-title{font-size:13px;font-weight:900;color:#7a304d;margin-bottom:5px}.cut-choice label{font-size:13px;margin-right:12px;cursor:pointer}.cut-choice input{accent-color:#c52f68;margin-right:4px}'
                  s=s.replace('</style>',css+'</style>',1)
                  marker="<span class=\"price\">NT$ '+Number(f.price||0).toLocaleString()+'</span>"
                  insert="""<span class=\"price\">NT$ '+Number(f.price||0).toLocaleString()+'</span>'+(f.flavor_type==='filled'?'<div class=\"cut-choice\"><div class=\"cut-title\">包餡切法</div><label><input type=\"radio\" name=\"cut'+i+'\" value=\"不切\" checked>不切</label><label><input type=\"radio\" name=\"cut'+i+'\" value=\"切\">切</label></div>':'')"""
                  if marker in s: s=s.replace(marker,insert,1)
                  else:
                      marker2="'<div class=\"price\">NT$ '+Number(f.price).toLocaleString()+'</div>'"
                      insert2="""'<div class=\"price\">NT$ '+Number(f.price).toLocaleString()+'</div>'+(f.flavor_type==='filled'?'<div class=\"cut-choice\"><div class=\"cut-title\">包餡切法</div><label><input type=\"radio\" name=\"cut'+i+'\" value=\"不切\" checked>不切</label><label><input type=\"radio\" name=\"cut'+i+'\" value=\"切\">切</label></div>':'')"""
                      if marker2 in s: s=s.replace(marker2,insert2,1)
                  p.write_text(s)

          p=Path('admin-products.html')
          if p.exists():
              s=p.read_text()
              marker='<div class="field"><label>基本價格</label><input id="price" type="number" min="0" required></div>'
              insert=marker+'<div class="field"><label>口味類型</label><select id="flavorType"><option value="single">單一口味（不包餡）</option><option value="filled">包餡</option></select><div class="small">包餡口味會在官網下單時顯示「切／不切」；單一口味不會顯示。</div></div>'
              if 'id="flavorType"' not in s and marker in s: s=s.replace(marker,insert,1)
              marker="$('price').value=p.price||0;$('desc').value=p.description||'';"
              if marker in s and "$('flavorType').value=p.flavor_type" not in s: s=s.replace(marker,"$('price').value=p.price||0;$('flavorType').value=p.flavor_type||'single';$('desc').value=p.description||'';",1)
              marker="const payload={product_name:productName,name,price:Number($('price').value||0),description:$('desc').value.trim()||null,image_url:imageUrl,enabled:$('enabled').checked};"
              if marker in s and 'flavor_type:$(' not in s: s=s.replace(marker,"const payload={product_name:productName,name,price:Number($('price').value||0),flavor_type:$('flavorType').value==='filled'?'filled':'single',description:$('desc').value.trim()||null,image_url:imageUrl,enabled:$('enabled').checked};",1)
              p.write_text(s)
          PY
      - name: Commit patched pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-delivery-order.html convenience-order.html admin-products.html .github/workflows/add-flavor-type-admin.yml
          git rm -f .github/workflows/add-flavor-type-admin.yml 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add flavor type selector and cut behavior"
          git push
