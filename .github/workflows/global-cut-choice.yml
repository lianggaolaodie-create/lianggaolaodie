name: Add single global cut choice
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add global cut choice
        run: |
          python - <<'PY'
          from pathlib import Path
          files=['home-delivery-order.html','convenience-order.html']
          snippet=r'''<script id="global-filled-cut-choice">
          (()=>{
            function apply(){
              const root=document.getElementById('flavors');
              if(!root)return;
              root.querySelectorAll('.cut-choice').forEach(x=>x.style.display='none');
              let box=document.getElementById('global-cut-choice');
              const hasFilled=root.querySelector('.cut-choice');
              if(!hasFilled){ if(box)box.remove(); return; }
              if(!box){
                box=document.createElement('div');
                box.id='global-cut-choice';
                box.className='cut-choice global-cut-choice';
                box.innerHTML='<div class="cut-title">包餡切法</div><label><input type="radio" name="global-cut-option" value="不切" checked>不切</label><label><input type="radio" name="global-cut-option" value="切">切</label>';
                root.appendChild(box);
                box.addEventListener('change',()=>{
                  const v=box.querySelector('input[name="global-cut-option"]:checked')?.value||'不切';
                  root.querySelectorAll('.cut-choice').forEach(c=>{
                    if(c===box)return;
                    const r=c.querySelector('input[value="'+v+'"]');
                    if(r)r.checked=true;
                  });
                });
              }
            }
            const root=document.getElementById('flavors');
            if(root)new MutationObserver(apply).observe(root,{childList:true,subtree:true});
            apply();
          })();
          </script>'''
          for fn in files:
              p=Path(fn); s=p.read_text()
              if 'id="global-filled-cut-choice"' not in s:
                  s=s.replace('</body>',snippet+'</body>',1)
                  p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-delivery-order.html convenience-order.html
          git commit -m "Show one global cut choice" || true
          git push
      - name: Remove workflow
        if: success()
        run: |
          git rm .github/workflows/global-cut-choice.yml
          git commit -m "Remove temporary global cut workflow" || true
          git push
