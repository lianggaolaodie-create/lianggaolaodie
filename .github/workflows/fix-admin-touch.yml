name: Fix admin touch buttons
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-admin-touch.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('admin-orders-fixed.html')
          s=p.read_text()
          s=s.replace('''/* ADMIN_IPHONE_TOUCH_FIX_20260930 */\n(function(){\n  document.querySelectorAll('button').forEach(function(b){ b.type='button'; });\n  document.addEventListener('touchend',function(e){\n    var b=e.target && e.target.closest ? e.target.closest('button') : null;\n    if(!b || b.disabled) return;\n    e.preventDefault();\n    b.click();\n  },{passive:false});\n  window.addEventListener('error',function(e){\n    var el=document.getElementById('orderMsg') || document.getElementById('loginMsg');\n    if(el && e.message) el.innerHTML='<div class="notice err">系統錯誤：'+String(e.message).replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m]})+'</div>';\n  });\n})();\n''','''/* ADMIN_IPHONE_TOUCH_FIX_20260930 */\n(function(){\n  document.querySelectorAll('button').forEach(function(b){ b.type='button'; });\n  function hit(x,y){\n    var list=document.elementsFromPoint ? document.elementsFromPoint(x,y) : [];\n    for(var i=0;i<list.length;i++){\n      var el=list[i];\n      var b=el && el.closest ? el.closest('button') : null;\n      if(b && !b.disabled && b.offsetParent!==null) return b;\n    }\n    return null;\n  }\n  function fire(e){\n    var t=e.changedTouches && e.changedTouches[0];\n    if(!t) return;\n    var b=hit(t.clientX,t.clientY);\n    if(!b) return;\n    e.preventDefault();\n    e.stopPropagation();\n    b.click();\n  }\n  document.addEventListener('touchend',fire,{passive:false,capture:true});\n  document.addEventListener('pointerup',function(e){\n    if(e.pointerType==='touch'){\n      var b=hit(e.clientX,e.clientY);\n      if(b){ e.preventDefault(); e.stopPropagation(); b.click(); }\n    }\n  },{passive:false,capture:true});\n  window.addEventListener('error',function(e){\n    var el=document.getElementById('orderMsg') || document.getElementById('loginMsg');\n    if(el && e.message) el.innerHTML='<div class="notice err">系統錯誤：'+String(e.message).replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m]})+'</div>';\n  });\n})();\n''')
          p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-orders-fixed.html
          git diff --cached --quiet || git commit -m 'fix iPhone admin touch hit testing'
          git push