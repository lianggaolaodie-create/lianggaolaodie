name: Fix admin touch buttons
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-admin-touch.yml'
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin page
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Existing iPhone touch fix for the fixed admin page.
          p=Path('admin-orders-fixed.html')
          if p.exists():
              s=p.read_text()
              old='''/* ADMIN_IPHONE_TOUCH_FIX_20260930 */\n(function(){\n  document.querySelectorAll('button').forEach(function(b){ b.type='button'; });\n  document.addEventListener('touchend',function(e){\n    var b=e.target && e.target.closest ? e.target.closest('button') : null;\n    if(!b || b.disabled) return;\n    e.preventDefault();\n    b.click();\n  },{passive:false});\n  window.addEventListener('error',function(e){\n    var el=document.getElementById('orderMsg') || document.getElementById('loginMsg');\n    if(el && e.message) el.innerHTML='<div class="notice err">系統錯誤：'+String(e.message).replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m]})+'</div>';\n  });\n})();\n'''
              new='''/* ADMIN_IPHONE_TOUCH_FIX_20260930 */\n(function(){\n  document.querySelectorAll('button').forEach(function(b){ b.type='button'; });\n  function hit(x,y){\n    var list=document.elementsFromPoint ? document.elementsFromPoint(x,y) : [];\n    for(var i=0;i<list.length;i++){\n      var el=list[i];\n      var b=el && el.closest ? el.closest('button') : null;\n      if(b && !b.disabled && b.offsetParent!==null) return b;\n    }\n    return null;\n  }\n  function fire(e){\n    var t=e.changedTouches && e.changedTouches[0];\n    if(!t) return;\n    var b=hit(t.clientX,t.clientY);\n    if(!b) return;\n    e.preventDefault();\n    e.stopPropagation();\n    b.click();\n  }\n  document.addEventListener('touchend',fire,{passive:false,capture:true});\n  document.addEventListener('pointerup',function(e){\n    if(e.pointerType==='touch'){\n      var b=hit(e.clientX,e.clientY);\n      if(b){ e.preventDefault(); e.stopPropagation(); b.click(); }\n    }\n  },{passive:false,capture:true});\n  window.addEventListener('error',function(e){\n    var el=document.getElementById('orderMsg') || document.getElementById('loginMsg');\n    if(el && e.message) el.innerHTML='<div class="notice err">系統錯誤：'+String(e.message).replace(/[&<>]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m]})+'</div>';\n  });\n})();\n'''
              if old in s:
                  s=s.replace(old,new)
                  p.write_text(s)

          # Restore the full production daily-opening settings screen.
          p=Path('admin-orders-live.html')
          if p.exists():
              s=p.read_text()
              old='''<section id="daily" class="hidden"><div class="card"><h2>每日開放設定</h2><p class="muted">後台入口正常保留。此版先不修改既有每日開放資料。</p></div></section>'''
              new='''<section id="daily" class="hidden">\n<div class="card daily-card"><div class="head"><h2>每日開放設定</h2><button class="btn" id="dailySave">儲存今日設定</button></div>\n<div class="field"><label>日期</label><input id="dailyDate" class="date" type="date"></div>\n<div class="field"><label>今日線上訂購</label><select id="dailyEnabled" class="date"><option value="true">開放</option><option value="false">關閉</option></select></div>\n<div id="dailyMsg"></div></div>\n<div class="card daily-card"><div class="sectiontitle"><b>當日開放地區</b><button class="btn gray small" id="addDailyRegion">＋新增地區</button></div><div id="dailyRegions"></div></div>\n<div class="card daily-card"><div class="sectiontitle"><b>當日開放口味</b><span class="muted">可設定價格與數量</span></div><div id="dailyFlavors"></div></div>\n</section>'''
              if old in s:
                  s=s.replace(old,new)
              marker='ADMIN_DAILY_SETTINGS_FIX_20260930'
              if marker not in s:
                  patch='''\n<script>\n/* ADMIN_DAILY_SETTINGS_FIX_20260930 */\n(function(){\n  const escD=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));\n  const dEl=()=>document.getElementById('dailyDate');\n  const msg=(t,err)=>{const e=document.getElementById('dailyMsg');if(e)e.innerHTML=t?'<div class="notice '+(err?'err':'')+'">'+escD(t)+'</div>':'';};\n  async function loadDaily(){\n    const date=(dEl()&&dEl().value)||new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});\n    if(dEl())dEl().value=date;\n    msg('');\n    try{\n      const [s,r,f,m]=await Promise.all([\n        db.from('daily_order_settings').select('ordering_enabled').eq('order_date',date).order('id',{ascending:false}).limit(1).maybeSingle(),\n        db.from('daily_order_regions').select('id,region_name,enabled').eq('order_date',date).order('id'),\n        db.from('daily_order_flavors').select('id,flavor_id,flavor_name,price,quantity,enabled,product_name').eq('order_date',date).order('id'),\n        db.from('flavors').select('id,name,price,product_name,enabled').eq('enabled',true).order('id')\n      ]);\n      if(s.error||r.error||f.error||m.error)throw new Error((s.error||r.error||f.error||m.error).message);\n      const en=document.getElementById('dailyEnabled');if(en)en.value=s.data?String(s.data.ordering_enabled):'true';\n      const rr=r.data||[];\n      document.getElementById('dailyRegions').innerHTML=rr.length?rr.map(x=>'<div class="row"><span class="grow">'+escD(x.region_name)+'</span><label><input type="checkbox" data-region-id="'+x.id+'" '+(x.enabled?'checked':'')+'> 開放</label><button class="btn red small" data-region-del="'+x.id+'">刪除</button></div>').join(''):'<div class="muted">今天尚未設定開放地區。</div>';\n      const df=f.data||[], byId=new Map(df.map(x=>[String(x.flavor_id),x]));\n      document.getElementById('dailyFlavors').innerHTML=(m.data||[]).map(x=>{const v=byId.get(String(x.id));return '<div class="row"><label class="grow"><input type="checkbox" data-flavor-id="'+x.id+'" '+(v&&v.enabled?'checked':'')+'> '+escD(x.name)+'</label><label>價格 <input style="width:90px" type="number" min="0" data-flavor-price="'+x.id+'" value="'+Number(v?v.price:x.price||0)+'"></label><label>數量 <input style="width:75px" type="number" min="0" data-flavor-qty="'+x.id+'" value="'+Number(v?v.quantity:0)+'"></label></div>';}).join('')||'<div class="muted">目前沒有啟用中的口味。</div>';\n      document.querySelectorAll('[data-region-del]').forEach(b=>b.onclick=async()=>{if(!confirm('確定刪除這個開放地區嗎？'))return;const z=await db.from('daily_order_regions').delete().eq('id',b.dataset.regionDel);if(z.error)msg('刪除地區失敗：'+z.error.message,true);else loadDaily();});\n    }catch(e){msg('讀取每日開放設定失敗：'+(e.message||e),true);}\n  }\n  async function saveDaily(){\n    const date=(dEl()&&dEl().value);if(!date)return;\n    const btn=document.getElementById('dailySave');if(btn)btn.disabled=true;msg('儲存中…');\n    try{\n      const enabled=document.getElementById('dailyEnabled').value==='true';\n      const old=await db.from('daily_order_settings').select('id').eq('order_date',date).order('id',{ascending:false}).limit(1).maybeSingle();\n      if(old.error)throw old.error;\n      const sr=old.data?await db.from('daily_order_settings').update({ordering_enabled:enabled,updated_at:new Date().toISOString()}).eq('id',old.data.id):await db.from('daily_order_settings').insert({order_date:date,ordering_enabled:enabled});\n      if(sr.error)throw sr.error;\n      const checks=[...document.querySelectorAll('[data-region-id]')];\n      for(const c of checks){const z=await db.from('daily_order_regions').update({enabled:c.checked}).eq('id',c.dataset.regionId);if(z.error)throw z.error;}\n      await db.from('daily_order_flavors').delete().eq('order_date',date);\n      const fs=[...document.querySelectorAll('[data-flavor-id]:checked')];\n      if(fs.length){\n        const rows=fs.map(c=>{const id=c.dataset.flavorId;return {order_date:date,flavor_id:Number(id),flavor_name:c.parentElement.textContent.replace(/^\\s*/,'').trim(),price:Number((document.querySelector('[data-flavor-price="'+id+'"]')||{}).value||0),quantity:Number((document.querySelector('[data-flavor-qty="'+id+'"]')||{}).value||0),enabled:true};});\n        const mr=await db.from('daily_order_flavors').insert(rows);if(mr.error)throw mr.error;\n      }\n      msg('已儲存 '+date+' 的每日開放設定。');\n      await loadDaily();\n    }catch(e){msg('儲存失敗：'+(e.message||e),true);}finally{if(btn)btn.disabled=false;}\n  }\n  function addRegion(){\n    const date=(dEl()&&dEl().value);const name=prompt('請輸入開放地區，例如：台北、桃園、台中');if(!name||!name.trim())return;\n    db.from('daily_order_regions').insert({order_date:date,region_name:name.trim(),enabled:true}).then(r=>{if(r.error)msg('新增地區失敗：'+r.error.message,true);else loadDaily();});\n  }\n  document.addEventListener('DOMContentLoaded',function(){\n    const d=dEl();if(d){d.value=new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});d.addEventListener('change',loadDaily);}\n    const s=document.getElementById('dailySave');if(s)s.addEventListener('click',saveDaily);\n    const a=document.getElementById('addDailyRegion');if(a)a.addEventListener('click',addRegion);\n    const nav=document.querySelectorAll('[data-page]');nav.forEach(b=>b.addEventListener('click',function(){if(this.dataset.page==='daily')setTimeout(loadDaily,0);}));\n    setTimeout(loadDaily,300);\n  });\n})();\n</script>\n'''
                  s=s.replace('</body>',patch+'</body>') if '</body>' in s else s+patch
              p.write_text(s)
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-orders-fixed.html admin-orders-live.html .github/workflows/fix-admin-touch.yml
          git diff --cached --quiet || git commit -m 'restore production daily opening settings'
          git push
