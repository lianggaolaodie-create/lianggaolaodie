name: Fix admin display
on:
  push:
    paths:
      - '.github/workflows/fix-admin.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix admin display safely
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')

          # Super Admin 也可以看到個資管理區塊；資料本身不刪除。
          s = s.replace(
              "$('privateCard').classList.toggle('hidden',p.role!=='personal_data_admin')",
              "$('privateCard').classList.toggle('hidden',p.role!=='personal_data_admin'&&p.role!=='super_admin')"
          )
          s = s.replace(
              "window.role==='personal_data_admin'?loadPrivate():Promise.resolve()",
              "(window.role==='personal_data_admin'||window.role==='super_admin')?loadPrivate():Promise.resolve()"
          )

          # 管理員權限區顯示 Email，不顯示 UID。
          old = "if(!data?.length)return $('adminBox').textContent='目前沒有管理員資料。';$('adminBox').innerHTML=data.map(a=>'<div class=\\\"adminline\\\"><div><strong>'+esc(a.user_id)+'"
          new = "if(!data?.length)return $('adminBox').textContent='目前沒有管理員資料。';const adminEmails={'a2d35d0b-19ea-4939-8c4d-d972e81451e0':'y6100boy@gmail.com','72a3f874-e664-4d42-8c67-4876909ccbd3':'Ckbabe12441@gmail.com'};$('adminBox').innerHTML=data.map(a=>'<div class=\\\"adminline\\\"><div><strong>'+esc(adminEmails[a.user_id]||a.user_id)+'"
          if old in s:
              s = s.replace(old, new, 1)
              s = s.replace('<div class=\\\"small\\\">管理員帳號 UID</div>', '<div class=\\\"small\\\">管理員帳號 Email</div>', 1)

          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix admin display permissions and emails'
          git push