name: Pure Node safety tests

on:
  push:
    branches:
      - app/phase-1-planning
  pull_request:
    branches:
      - app/phase-1-planning
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pure-node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run isolated pure-function tests
        run: >-
          node --test
          app/tests/phase22-security.test.js
          app/tests/phase24-crypto-and-proof.test.js
          app/tests/phase29-cross-module.test.js
      - name: Run Phase 53 catalog administration tests
        run: node --test app/mock-api/product-admin-model.test.js
      - name: Run Phase 55 production read-adapter contract tests
        run: node --test app/mock-api/production-read-adapters.test.js
      - name: Run Phase 56 admin transaction mock tests
        run: node --test app/mock-api/admin-transaction-mock-service.test.js
      - name: Run Phase 57 customer checkout integration contract tests
        run: node --test app/mock-api/customer-checkout-integration.test.js
      - name: Run Phase 58 order lifecycle integration contract tests
        run: node --test app/mock-api/order-lifecycle-integration.test.js
      - name: Run Phase 59 member and order lookup contract tests
        run: node --test app/mock-api/member-order-model.test.js
      - name: Run Phase 60 owner order administration contract tests
        run: node --test app/mock-api/owner-order-admin-model.test.js
      - name: Run Phase 66 shared API contract regression tests
        run: node --test app/mock-api/shared-api-contract.test.js
      - name: Run Phase 67 workflow HTTP contract tests
        run: node --test app/mock-api/workflow-http-server.test.js
      - name: Run Phase 70 synthetic staging seed tests
        run: node --test app/mock-api/staging-seed.test.js
      - name: Run Phase 71 role authorization tests
        run: node --test app/mock-api/role-authorization-model.test.js
      - name: Run Phase 72 RLS policy model tests
        run: node --test app/mock-api/rls-policy-test-model.test.js
      - name: Run Phase 73 RLS remediation plan tests
        run: node --test app/security/rls-remediation-plan.test.js
      - name: Run Phase 74 database inventory tests
        run: node --test app/security/database-prechange-inventory.test.js
      - name: Run Phase 75 read-only SQL guard tests
        run: node --test app/security/readonly-sql-guard.test.js
      - name: Run Phase 76 metadata snapshot comparator tests
        run: node --test app/security/metadata-snapshot-comparator.test.js
