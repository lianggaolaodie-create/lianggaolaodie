name: Fix customer delete

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-customer-delete.yml'
      - 'admin-orders-stable.html'
      - 'admin-orders-live.html'
      - 'home-delivery-order.html'
      - 'convenience-order.html'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean broken patch and install customer delete handler
        shell: python
        run: |
          from pathlib import Path
          import re

          code = """
/* CUSTOMER_DELETE_FIX_V4 */
document.addEventListener('click',async function(e){
  const b=e.target.closest('#customers .btn.red');
  if(!b)return;
  e.preventDefault();
  e.stopImmediatePropagation();
  const card=b.closest('.order');
  if(!card)return;
  const orderNo=(card.querySelector('b')?.textContent||'').replace('訂單編號','').trim();
  const all=[...pickup,...home];
  const o=all.find(x=>String(x.order_number||'')===String(orderNo));
  if(!o){alert('找不到這筆客戶資料，請重新整理後再試。');return;}
  if(!confirm('確定刪除這筆客戶個資嗎？訂單本身會保留。'))return;
  let r;
  if(o.type==='home'){
    r=await db.from('order_private').update({customer_name:'',customer_phone:'',delivery_address:''}).eq('order_id',o.id).select('order_id');
  }else{
    r=await db.from('cooling_pickup_orders').update({customer_id:null}).eq('customer_id',o.customer_id).select('id');
    if(!r.error)r=await db.from('order_customers').delete().eq('id',o.customer_id).select('id');
  }
  if(r.error){alert('刪除個資失敗：'+r.error.message);return;}
  await loadAll();
},true);
"""

          cut_patch = r'''<script id="filled-cut-option-fix">
          (()=>{
            const addCutChoices=()=>{
              const root=document.getElementById('flavors');
              if(!root)return;
              [...root.querySelectorAll('.flavor')].forEach((card,i)=>{
                if(card.querySelector('.cut-choice'))return;
                const priceEl=card.querySelector('.price');
                if(!priceEl)return;
                const price=Number((priceEl.textContent||'').replace(/[^0-9.]/g,''));
                if(price<150)return;
                const info=[...card.children].find(x=>x.querySelector&&x.querySelector('.price'));
                if(!info)return;
                const box=document.createElement('div');
                box.className='cut-choice';
                box.innerHTML='<div class="cut-title">包餡切法</div><label><input type="radio" name="cut-option-'+i+'" value="不切" checked>不切</label><label><input type="radio" name="cut-option-'+i+'" value="切">切</label>';
                info.appendChild(box);
              });
            };
            const root=document.getElementById('flavors');
            if(root)new MutationObserver(addCutChoices).observe(root,{childList:true,subtree:true});
            addCutChoices();
            const form=document.getElementById('orderForm');
            if(form&&!form.dataset.cutBound){
              form.dataset.cutBound='1';
              form.addEventListener('submit',()=>{
                const notes=document.getElementById('notes');
                if(!notes)return;
                const choices=[...document.querySelectorAll('#flavors .flavor')].map(card=>{
                  const qty=Number(card.querySelector('.qty span')?.textContent||0);
                  const choice=card.querySelector('.cut-choice');
                  if(qty<=0||!choice)return null;
                  const name=card.querySelector('b')?.textContent?.trim()||'包餡口味';
                  const cut=choice.querySelector('input:checked')?.value||'不切';
                  return name+' × '+qty+'：'+cut;
                }).filter(Boolean);
                const base=notes.value.replace(/\n?\[包餡切法\][\s\S]*$/,'').trim();
                notes.value=[base,choices.length?'[包餡切法] '+choices.join('；'):''].filter(Boolean).join('\n');
              },{capture:true});
            }
          })();
          </script>'''
          cut_css = r'''.cut-choice{margin-top:8px;padding:8px 10px;border-radius:12px;background:#fff7fa;border:1px solid #f0d6e1}.cut-title{font-size:13px;font-weight:900;color:#7a304d;margin-bottom:5px}.cut-choice label{font-size:13px;margin-right:12px;cursor:pointer}.cut-choice input{accent-color:#c52f68;margin-right:4px}'''

          changed=False
          for filename in ['admin-orders-stable.html','admin-orders-live.html']:
              p=Path(filename)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'/\* Inject reliable customer delete handler v2 \*/.*?(?=</body>)', '', s, flags=re.S)
              s=re.sub(r'/\* CUSTOMER_DELETE_FIX_V[0-9]+ \*/.*?(?=</script>)', '', s, flags=re.S)
              pos=s.rfind('</script>')
              if pos < 0:
                  continue
              s=s[:pos]+code+s[pos:]
              p.write_text(s,encoding='utf-8')
              changed=True

          for filename in ['home-delivery-order.html','convenience-order.html']:
              p=Path(filename)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              if 'id="filled-cut-option-fix"' not in s:
                  s=s.replace('</style>',cut_css+'</style>',1)
                  s=s.replace('</body>',cut_patch+'</body>',1)
                  p.write_text(s,encoding='utf-8')
                  changed=True
          print('changed=',changed)

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-orders-stable.html admin-orders-live.html home-delivery-order.html convenience-order.html
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m '修正包餡切法選項顯示'
            git push
          fi
