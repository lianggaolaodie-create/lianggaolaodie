name: Fix customer delete

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-customer-delete.yml'
      - 'admin-orders-stable.html'
      - 'admin-orders-live.html'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject reliable customer delete handler
        shell: python
        run: |
          from pathlib import Path

          patch = r'''<script>
          (function(){
            document.addEventListener('click', async function(e){
              const b=e.target.closest('#customers .btn.red');
              if(!b) return;
              e.preventDefault();
              e.stopImmediatePropagation();
              const card=b.closest('.order');
              if(!card) return;
              const m=card.textContent.match(/訂單編號\s*([A-Z0-9-]+)/i);
              const orderNo=m?m[1]:'';
              const all=[...(window.pickup||[]),...(window.home||[])];
              const o=all.find(x=>String(x.order_number||'')===String(orderNo));
              if(!o){alert('找不到這筆客戶資料，請重新整理後再試。');return;}
              if(!confirm('確定刪除這筆客戶個資嗎？訂單本身會保留。')) return;
              let r;
              if(o.type==='home'){
                r=await window.db.from('order_private').update({customer_name:'',customer_phone:'',delivery_address:''}).eq('order_id',o.id).select('order_id');
              }else{
                r=await window.db.from('cooling_pickup_orders').update({customer_id:null}).eq('customer_id',o.customer_id).select('id');
                if(!r.error) r=await window.db.from('order_customers').delete().eq('id',o.customer_id).select('id');
              }
              if(r.error){alert('刪除個資失敗：'+r.error.message);return;}
              if(typeof window.loadAll==='function') await window.loadAll();
            }, true);
          })();
          </script>'''

          changed=False
          for filename in ['admin-orders-stable.html','admin-orders-live.html']:
              p=Path(filename)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              if 'Inject reliable customer delete handler v2' in s:
                  continue
              patch2=patch.replace('<script>', '<script>/* Inject reliable customer delete handler v2 */', 1)
              s=s.replace('</body>', patch2+'\n</body>')
              p.write_text(s,encoding='utf-8')
              changed=True
          print('changed=',changed)

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-orders-stable.html admin-orders-live.html
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m '修正個資管理刪除按鈕'
            git push
          fi
