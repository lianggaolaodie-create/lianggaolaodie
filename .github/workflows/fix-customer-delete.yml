name: Fix customer delete

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-customer-delete.yml'
      - 'admin-orders-stable.html'
      - 'admin-orders-live.html'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject customer delete handler inside existing app scope
        shell: python
        run: |
          from pathlib import Path

          code = r'''\n/* CUSTOMER_DELETE_FIX_V3 */\ndocument.addEventListener('click',async function(e){\n  const b=e.target.closest('#customers .btn.red');\n  if(!b)return;\n  e.preventDefault();\n  e.stopImmediatePropagation();\n  const card=b.closest('.order');\n  if(!card)return;\n  const m=card.textContent.match(/訂單編號\\s*([A-Z0-9-]+)/i);\n  const orderNo=m?m[1]:'';\n  const all=[...pickup,...home];\n  const o=all.find(x=>String(x.order_number||'')===String(orderNo));\n  if(!o){alert('找不到這筆客戶資料，請重新整理後再試。');return;}\n  if(!confirm('確定刪除這筆客戶個資嗎？訂單本身會保留。'))return;\n  let r;\n  if(o.type==='home'){\n    r=await db.from('order_private').update({customer_name:'',customer_phone:'',delivery_address:''}).eq('order_id',o.id).select('order_id');\n  }else{\n    r=await db.from('cooling_pickup_orders').update({customer_id:null}).eq('customer_id',o.customer_id).select('id');\n    if(!r.error)r=await db.from('order_customers').delete().eq('id',o.customer_id).select('id');\n  }\n  if(r.error){alert('刪除個資失敗：'+r.error.message);return;}\n  await loadAll();\n},true);\n'''

          changed=False
          for filename in ['admin-orders-stable.html','admin-orders-live.html']:
              p=Path(filename)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              if 'CUSTOMER_DELETE_FIX_V3' in s:
                  continue
              marker='</script></body>'
              if marker in s:
                  s=s.replace(marker,code+'</script></body>',1)
                  p.write_text(s,encoding='utf-8')
                  changed=True
              elif '</script>' in s:
                  pos=s.rfind('</script>')
                  s=s[:pos]+code+s[pos:]
                  p.write_text(s,encoding='utf-8')
                  changed=True
          print('changed=',changed)

      - name: Commit fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-orders-stable.html admin-orders-live.html
          if git diff --cached --quiet; then
            echo 'No changes.'
          else
            git commit -m '修正個資管理刪除按鈕'
            git push
          fi
