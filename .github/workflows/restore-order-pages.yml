name: restore order pages
on:
  push:
    paths:
      - '.github/workflows/restore-order-pages.yml'
      - 'home-delivery-order.html'
      - 'convenience-order.html'
jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Remove injected scripts that can lock the order page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          for name in ['home-delivery-order.html','convenience-order.html']:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              s=re.sub(r'<script id="(?:filled-cut-option-fix|filled-cut-only|global-filled-cut-choice|global-filled-cut-option|region-autoload-fix)">.*?</script>', '', s, flags=re.S)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add home-delivery-order.html convenience-order.html
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'fix: restore order pages from injected scripts'; git push; fi
