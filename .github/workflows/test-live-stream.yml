name: Test LIVE stream source
on:
  push:
    paths:
      - '.github/workflows/test-live-stream.yml'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify proxy response
        run: |
          curl -fsS --max-time 30 'https://yemzdwxtyosuaczsqwea.supabase.co/functions/v1/tiktok-live-proxy?user=kaip1018' > proxy-result-raw.json
          python3 - <<'PY'
          import json
          d=json.load(open('proxy-result-raw.json'))
          out={'ok':d.get('ok'),'is_live':d.get('is_live'),'has_hls':bool(d.get('hls_url')),'has_flv':bool(d.get('flv_url')),'has_hls_relay':bool(d.get('hls_relay_url')),'title':bool(d.get('title')),'error':d.get('error')}
          open('live-upstream-test-result.json','w').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          rm -f proxy-result-raw.json
      - name: Commit result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add live-upstream-test-result.json
          git diff --cached --quiet && exit 0
          git commit -m 'test: record proxy response [skip ci]'
          git push
