name: Verify LIVE playback

"on":
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-live-player:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify LIVE playback implementation
        shell: bash
        run: |
          set -e
          test -f index.html
          grep -q "hls_url" index.html
          grep -q "directFlv" index.html
          grep -q "streamUrl" index.html
          grep -q "Hls" index.html
          echo "LIVE playback implementation is present"
