name: Preserve 20260927 LIVE playback

"on":
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify-live-player:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify 20260927 playback logic
        shell: bash
        run: |
          grep -F "const directHls=data.hls_url||'';" index.html
          grep -F "const playUrl=isFlv ? API.split('?')[0]+'?proxy='+encodeURIComponent(streamUrl) : streamUrl;" index.html
          echo "20260927 LIVE playback logic is preserved"
