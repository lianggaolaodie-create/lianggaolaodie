name: Fix filled cut option
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch ordering pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          script = r'''<script id="filled-cut-only">
          (()=>{
            const FILLED = new Set([1,2,4,7,10,11,12,18,19,20,21,23,25,29]);
            function normalize(){
              const root=document.getElementById('flavors');
              if(!root || !Array.isArray(window.flavors) && typeof flavors==='undefined') return;
              const list = typeof flavors!=='undefined' ? flavors : window.flavors;
              [...root.querySelectorAll('.flavor')].forEach((card,i)=>{
                const f=list[i];
                const filled=!!f && FILLED.has(Number(f.flavor_id));
                const choice=card.querySelector('.cut-choice');
                if(!filled){ if(choice) choice.remove(); return; }
                if(choice) return;
                const info=card.querySelector(':scope > div:nth-child(2)');
                if(!info) return;
                const box=document.createElement('div');
                box.className='cut-choice';
                box.innerHTML='<div class="cut-title">包餡切法</div><label><input type="radio" name="cut'+i+'" value="不切" checked>不切</label><label><input type="radio" name="cut'+i+'" value="切">切</label>';
                info.appendChild(box);
              });
            }
            const root=document.getElementById('flavors');
            if(root){new MutationObserver(normalize).observe(root,{childList:true,subtree:true});}
            setTimeout(normalize,300);
          })();
          </script>'''
          for name in ['home-delivery-order.html','convenience-order.html']:
            p=Path(name); s=p.read_text()
            if 'id="filled-cut-only"' not in s:
              s=s.replace('</body>', script+'\n</body>') if '</body>' in s else s+script
              p.write_text(s)
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-delivery-order.html convenience-order.html .github/workflows/fix-filled-cut-only.yml
          git commit -m "Show cut option only for filled flavors" || exit 0
          git rm .github/workflows/fix-filled-cut-only.yml
          git commit -m "chore: remove temporary fix workflow"
          git push
