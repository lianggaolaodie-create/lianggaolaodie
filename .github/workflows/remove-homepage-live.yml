name: Remove homepage LIVE section

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remove-live:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove LIVE section
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          original = s
          s = re.sub(r'\n<section\s+id=["\']officialLive["\'][\s\S]*?</section>\s*', '\n', s, count=1)
          s = re.sub(r'\n<script\b[^>]*>[\s\S]*?(?:officialLive|live-section)[\s\S]*?</script>\s*', '\n', s, flags=re.I)

          if s == original:
              print('LIVE section not found; no change needed')
          else:
              p.write_text(s, encoding='utf-8')
              print('Removed homepage LIVE section')

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Remove homepage LIVE section"
            git push
          fi
