<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>老爹・涼糕｜餐車後台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f2ec;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:1050px;margin:auto;padding:16px 14px 70px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:15px 17px;position:sticky;top:8px;z-index:5;box-shadow:0 5px 18px #0000000b}.brand{font-weight:900;font-size:21px}.small{font-size:13px;color:#776b62}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:17px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px;border-radius:15px;background:#faf6f1}.stat b{display:block;font-size:25px;margin-top:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:9px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d9cdc1;border-radius:11px;font:inherit}.btn{border:0;border-radius:12px;padding:12px 15px;background:#9b5c38;color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55}.secondary{background:#eee7e0;color:#332a24}.danger{background:#a8322c}.scanbox{border:2px dashed #c8b3a3;border-radius:18px;padding:12px;text-align:center;background:#fcfaf7}.scanbox video{width:100%;max-width:520px;aspect-ratio:1.6/1;object-fit:cover;border-radius:13px;background:#191512}.scan-actions{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:10px}.result{margin-top:12px;padding:15px;border-radius:13px;background:#f4ece4}.ok{background:#edf8f1;color:#286d46}.error{background:#fff0ef;color:#a32e29}.product{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;border-top:1px solid #eee3d9;padding:13px 0}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee7e0;font-size:12px}.low{background:#fff0cf;color:#8a5a00}.out{background:#ffe1df;color:#a8322c}.actions{display:flex;gap:7px;flex-wrap:wrap}.login{max-width:460px;margin:60px auto}.hidden{display:none}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modal>div{background:#fff;border-radius:18px;padding:18px;max-width:430px;width:100%}svg{max-width:100%}@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.top{position:static}.product{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<section id="login" class="card login"><h1>🍡 老爹・涼糕</h1><h2>餐車管理後台</h2><p class="small">管理員登入後才能使用掃碼扣庫存。</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" style="width:100%" onclick="login()">登入後台</button><div id="loginMsg"></div></section>
<main id="app" class="hidden"><div class="top"><div><div class="brand">🍡 老爹・涼糕｜餐車後台</div><div id="who" class="small"></div></div><button class="btn secondary" onclick="logout()">登出</button></div>
<div class="stats"><div class="stat"><span class="small">今日售出</span><b id="todayQty">0</b> 盒</div><div class="stat"><span class="small">今日營業額</span><b id="todayAmount">$0</b></div><div class="stat"><span class="small">商品數</span><b id="productCount">0</b></div><div class="stat"><span class="small">低庫存</span><b id="lowCount">0</b></div></div>
<section class="card"><h2>📷 掃描條碼銷售</h2><p class="small">直接用手機相機掃描，不需要專用掃描器。掃描後確認一次才會扣庫存。</p><div class="scanbox"><video id="video" playsinline></video><div class="scan-actions"><button class="btn" onclick="startScan()">📷 開始掃描</button><button class="btn secondary" onclick="stopScan()">停止</button></div><div id="scanMsg"></div></div><div class="field"><label>也可以手動輸入條碼</label><div style="display:flex;gap:8px"><input id="manualBarcode" placeholder="例如 LAO10001" onkeydown="if(event.key==='Enter') lookupBarcode()"><button class="btn" onclick="lookupBarcode()">查詢</button></div></div><div id="scanResult"></div></section>
<section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h2>📦 庫存／商品</h2><button class="btn" onclick="openAdd()">＋新增商品</button></div><div id="products">讀取中…</div></section>
<section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>🧾 今日銷售</h2><button class="btn secondary" onclick="loadAll()">重新整理</button></div><div id="sales">讀取中…</div></section></main></div>
<div id="modal" class="modal hidden"><div><h2>➕ 新增／補貨</h2><div class="field"><label>商品名稱</label><input id="pname" placeholder="水果綜合涼糕"></div><div class="grid"><div class="field"><label>價格</label><input id="pprice" type="number" min="0" value="100"></div><div class="field"><label>庫存</label><input id="pstock" type="number" min="0" value="0"></div></div><div class="field"><label>條碼（留白自動產生）</label><input id="pbarcode" placeholder="LAO10001"></div><div class="actions"><button class="btn" onclick="saveProduct()">儲存</button><button class="btn secondary" onclick="closeModal()">取消</button></div><div id="modalMsg"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script>
const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);let user=null,reader=null,controls=null,scanLock=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(id,text,cls='result'){ $(id).innerHTML='<div class="'+cls+'">'+esc(text)+'</div>'; }
async function login(){const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg('loginMsg','登入失敗：'+error.message,'result error');await open(data.user)}
async function open(u){const{data:p,error}=await sb.from('admin_profiles').select('role,enabled,can_manage_food_truck').eq('user_id',u.id).maybeSingle();if(error||!p||!p.enabled||!(p.role==='super_admin'||p.can_manage_food_truck===true)){await sb.auth.signOut();return msg('loginMsg','此帳號沒有餐車後台權限。','result error')}user=u;$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=(u.email||'')+' · 餐車管理';await loadAll()}
async function logout(){stopScan();await sb.auth.signOut();location.reload()}
async function loadAll(){await Promise.all([loadProducts(),loadSales()])}
async function loadProducts(){const{data,error}=await sb.from('food_truck_products').select('*').eq('active',true).order('product_name');if(error)return msg('products','讀取失敗：'+error.message,'result error');$('productCount').textContent=data.length;$('lowCount').textContent=data.filter(x=>x.stock<=5).length;$('products').innerHTML=data.length?data.map(p=>{const cls=p.stock===0?'out':p.stock<=5?'low':'';return `<div class="product"><div><strong>${esc(p.product_name)}</strong> <span class="badge ${cls}">${p.stock===0?'售完':p.stock<=5?'低庫存':'庫存正常'}</span><div class="small">$${Number(p.price).toLocaleString()} · 庫存 ${p.stock} · ${esc(p.barcode)}</div></div><div class="actions"><button class="btn secondary" onclick="showBarcode('${esc(p.barcode)}','${esc(p.product_name)}')">🏷️ 條碼</button><button class="btn secondary" onclick="restock(${p.id},'${esc(p.product_name)}',${p.stock})">＋補貨</button></div></div>`}).join(''):'目前沒有商品，先新增一個。'}
async function loadSales(){const start=new Date();start.setHours(0,0,0,0);const{data,error}=await sb.from('food_truck_sales').select('*').gte('sold_at',start.toISOString()).order('sold_at',{ascending:false});if(error)return msg('sales','讀取失敗：'+error.message,'result error');const qty=data.reduce((a,x)=>a+x.quantity,0),amount=data.reduce((a,x)=>a+x.total_amount,0);$('todayQty').textContent=qty;$('todayAmount').textContent='$'+amount.toLocaleString();$('sales').innerHTML=data.length?data.map(x=>`<div class="product"><div><strong>${esc(x.product_name)}</strong><div class="small">${x.quantity} 盒 · $${Number(x.total_amount).toLocaleString()} · ${new Date(x.sold_at).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}</div></div><span class="badge">已完成</span></div>`).join(''):'今天還沒有銷售紀錄。'}
async function lookupBarcode(code=$('manualBarcode').value.trim()){if(!code)return;if(!user)return;const{data,error}=await sb.from('food_truck_products').select('*').eq('barcode',code).eq('active',true).maybeSingle();if(error||!data)return msg('scanResult','找不到這個商品條碼。','result error');renderSale(data)}
function renderSale(p){$('scanResult').innerHTML=`<div class="result"><h3 style="margin:0 0 6px">${esc(p.product_name)}</h3><div>售價：$${Number(p.price).toLocaleString()}　目前庫存：<b>${p.stock}</b></div><div class="field"><label>銷售數量</label><input id="saleQty" type="number" min="1" max="${p.stock}" value="1" ${p.stock<1?'disabled':''}></div><button class="btn" ${p.stock<1?'disabled':''} onclick="confirmSale(${p.id},'${esc(p.barcode)}')">確認銷售並扣庫存</button></div>`}
async function confirmSale(id,barcode){const q=Math.max(1,Number($('saleQty').value||1));const{data,error}=await sb.rpc('food_truck_scan_sale',{p_barcode:barcode,p_quantity:q});if(error)return msg('scanResult',error.message.replace(/^.*?: /,''),'result error');const r=data?.[0];msg('scanResult',`已完成：${r.product_name} × ${r.quantity}，本次 $${Number(r.total_amount).toLocaleString()}；剩餘庫存 ${r.remaining_stock}`,'result ok');$('manualBarcode').value='';await loadAll()}
async function startScan(){if(!user)return;if(!window.ZXingBrowser)return msg('scanMsg','掃描元件載入失敗，請重新整理。','result error');if(reader)return;reader=new ZXingBrowser.BrowserMultiFormatReader();scanLock=false;try{controls=await reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}},audio:false},$('video'),(result,err)=>{if(result&&!scanLock){scanLock=true;const text=result.getText();$('manualBarcode').value=text;lookupBarcode(text);setTimeout(()=>scanLock=false,1200)}});msg('scanMsg','掃描中，請把條碼放入畫面中央。','result ok')}catch(e){reader=null;msg('scanMsg','無法開啟相機。請確認已允許瀏覽器使用相機。','result error')}}
function stopScan(){try{controls?.stop()}catch(e){}try{reader?.reset()}catch(e){}controls=null;reader=null;const v=$('video');if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null} }
function openAdd(){ $('pname').value='';$('pprice').value=100;$('pstock').value=0;$('pbarcode').value='';$('modalMsg').innerHTML='';$('modal').classList.remove('hidden') }
function closeModal(){$('modal').classList.add('hidden')}
function restock(id,name,current){$('pname').value=name;$('pprice').value='';$('pstock').value=current;$('pbarcode').value='__RESTOCK__'+id;$('modalMsg').innerHTML='<div class="small">修改庫存後儲存即可。</div>';$('modal').classList.remove('hidden')}
async function saveProduct(){const name=$('pname').value.trim(),price=Number($('pprice').value),stock=Number($('pstock').value),bc=$('pbarcode').value.trim();if(!name||!Number.isFinite(price)||price<0||!Number.isInteger(stock)||stock<0)return msg('modalMsg','請確認商品名稱、價格、庫存。','result error');if(bc.startsWith('__RESTOCK__')){const id=bc.replace('__RESTOCK__','');const{error}=await sb.from('food_truck_products').update({stock,updated_at:new Date().toISOString()}).eq('id',id);if(error)return msg('modalMsg,error.message','result error');closeModal();return loadProducts()}let barcode=bc;if(!barcode){const{data}=await sb.from('food_truck_products').select('barcode');const nums=(data||[]).map(x=>Number(String(x.barcode).replace('LAO',''))).filter(Number.isFinite);barcode='LAO'+String((Math.max(10000,...nums)+1));}const{error}=await sb.from('food_truck_products').insert({product_name:name,price,stock,barcode,active:true});if(error)return msg('modalMsg','儲存失敗：'+error.message,'result error');closeModal();await loadProducts()}
function showBarcode(code,name){const div=document.createElement('div');div.className='modal';div.innerHTML=`<div style="text-align:center"><h2>${esc(name)}</h2><svg id="barcodeSvg"></svg><div class="small">${esc(code)}</div><div class="actions" style="justify-content:center;margin-top:12px"><button class="btn" onclick="printBarcode()">🖨️ 列印</button><button class="btn secondary" onclick="this.closest('.modal').remove()">關閉</button></div></div>`;document.body.appendChild(div);JsBarcode(div.querySelector('#barcodeSvg'),code,{format:'CODE128',displayValue:true,height:70,width:2,margin:10});window.currentBarcodePrint=div.querySelector('#barcodeSvg')}
function printBarcode(){const svg=window.currentBarcodePrint;if(!svg)return;const w=window.open('','_blank');w.document.write('<html><body style="text-align:center;font-family:sans-serif">'+svg.outerHTML+'<script>window.print()<\\/script></body></html>');w.document.close()}
(async()=>{const{data}=await sb.auth.getUser();if(data.user)open(data.user)})();
</script></body></html>
