<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>老爹．涼糕｜後台登入</title>
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<!-- admin-login-stable-20261002 -->
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.shell{max-width:520px;margin:60px auto;padding:12px}.card{background:#fff;border:1px solid #e4dad3;border-radius:15px;padding:20px}.brand{font-size:21px;font-weight:900}.muted{color:#786e68;font-size:13px;line-height:1.6}.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;border:1px solid #ddd2ca;border-radius:10px;padding:13px 12px;font:inherit;background:#fff}.btn{width:100%;border:0;border-radius:10px;padding:12px 14px;background:#8d5939;color:#fff;font-weight:900;font-size:16px}.btn:disabled{opacity:.6}.notice{padding:10px;border-radius:10px;margin-top:10px;background:#edf8f1;color:#286c47}.err{background:#fff0ef;color:#a43b35}.reset{display:block;text-align:center;margin-top:14px;color:#2f78c9;text-decoration:none;font-weight:800;font-size:14px}@media(max-width:700px){.shell{margin:35px auto;padding:10px}.brand{font-size:19px}}
</style>
</head>
<body>
<div class="shell"><div class="card">
<div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div>
<p class="muted">商品／口味、每日開放、訂單與個資管理。</p>
<form id="loginForm" novalidate>
<div class="field"><label for="adminEmail">管理員 Email</label><input id="adminEmail" name="email" type="email" autocomplete="username" required></div>
<div class="field"><label for="adminPassword">密碼</label><input id="adminPassword" name="password" type="password" autocomplete="current-password" required></div>
<button id="loginButton" class="btn" type="submit">登入</button>
</form>
<a class="reset" href="admin-password-reset.html">忘記密碼／重設後台密碼</a>
<div id="loginMessage" aria-live="polite"></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){
'use strict';
const db=window.supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{
  auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}
});
const form=document.getElementById('loginForm');
const email=document.getElementById('adminEmail');
const password=document.getElementById('adminPassword');
const button=document.getElementById('loginButton');
const message=document.getElementById('loginMessage');
function msg(t,error){message.className=t?'notice'+(error?' err':''):'';message.textContent=t||'';}
async function enter(){
  const s=await db.auth.getSession();
  if(s.data&&s.data.session){
    location.replace('admin-orders-stable.html?v=20261006-final');
  }
}
form.addEventListener('submit',async function(e){
  e.preventDefault();
  e.stopPropagation();
  if(button.disabled)return;
  const em=email.value.trim(),pw=password.value;
  if(!em||!pw){msg('請輸入管理員 Email 與密碼。',true);return;}
  button.disabled=true;button.textContent='登入中…';msg('正在驗證登入資訊…',false);
  try{
    const r=await db.auth.signInWithPassword({email:em,password:pw});
    if(r.error)throw r.error;
    const s=await db.auth.getSession();
    if(!s.data||!s.data.session)throw new Error('登入成功，但瀏覽器沒有保存登入狀態。');
    msg('登入成功，正在進入訂單後台…',false);
    setTimeout(()=>location.replace('admin-orders-stable.html?v=20261006'),120);
  }catch(err){
    console.error(err);
    msg('登入失敗：'+(err&&err.message?err.message:'請確認 Email 與密碼。'),true);
    button.disabled=false;button.textContent='登入';
  }
});
enter().catch(()=>{});
})();
</script>
</body></html>
