<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>聯絡我們｜老爹・涼糕</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Microsoft JhengHei", sans-serif;
      background: #fffaf4;
      color: #4b3027;
    }

    .topbar {
      background: #ffffff;
      padding: 22px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #eee3d8;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
      color: #6f3f2c;
      text-decoration: none;
    }

    .home {
      color: #6f3f2c;
      text-decoration: none;
      font-weight: 700;
    }

    .hero {
      text-align: center;
      padding: 65px 20px 35px;
    }

    .hero h1 {
      margin: 0 0 12px;
      font-size: 36px;
    }

    .hero p {
      margin: 0;
      color: #80685e;
      line-height: 1.8;
    }

    .contact-card {
      width: calc(100% - 40px);
      max-width: 620px;
      margin: 10px auto 50px;
      padding: 35px 25px;
      background: #ffffff;
      border-radius: 22px;
      box-shadow: 0 8px 30px rgba(80, 50, 35, 0.08);
      text-align: center;
    }

    .contact-card h2 {
      margin-top: 0;
      font-size: 26px;
    }

    .contact-card p {
      line-height: 1.8;
      color: #756159;
    }

    .line-button {
      display: block;
      width: 100%;
      margin-top: 25px;
      padding: 17px 20px;
      background: #06c755;
      color: white;
      border-radius: 14px;
      text-decoration: none;
      font-size: 19px;
      font-weight: 800;
    }

    .back-button {
      display: block;
      margin-top: 15px;
      padding: 15px 20px;
      background: #6f3f2c;
      color: white;
      border-radius: 14px;
      text-decoration: none;
      font-weight: 700;
    }

    footer {
      text-align: center;
      padding: 25px 20px 40px;
      color: #9a877e;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <a class="brand" href="./">老爹・涼糕</a>
    <a class="home" href="./">回首頁</a>
  </div>

  <section class="hero">
    <h1>聯絡我們</h1>
    <p>
      歡迎加入老爹・涼糕官方 LINE<br>
      商品詢問、訂購與最新出攤資訊都可以與我們聯絡
    </p>
  </section>

  <div class="contact-card">
    <h2>老爹・涼糕 官方 LINE</h2>

    <p>
      想訂購涼糕或詢問商品嗎？<br>
      點擊下方按鈕加入官方 LINE 與我們聯絡。
    </p>

    <a class="line-button" href="#">
      加入官方 LINE
    </a>

    <a class="back-button" href="./">
      返回首頁
    </a>
  </div>

  <footer>
    © 老爹・涼糕 DAD'S RICE CAKE
  </footer>

</body>
</html>
