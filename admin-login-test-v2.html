<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹．涼糕｜測試後台登入</title><style>body{margin:0;background:#f7f3ef;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:#30241d}.box{max-width:420px;margin:70px auto;padding:20px;background:#fff;border:1px solid #e5dcd5;border-radius:16px}.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #ddd2ca;border-radius:10px;font-size:16px}.btn{width:100%;padding:13px;border:0;border-radius:10px;background:#8d5939;color:#fff;font-weight:900;font-size:16px}.msg{margin-top:12px}.ok{color:#087a43}.err{color:#c22}</style></head><body><div class="box"><h2>🍡 老爹．涼糕</h2><h3>測試後台登入</h3><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="btn" class="btn">登入測試後台</button><div id="msg" class="msg"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false,storageKey:'laodie-admin-login-test-v2'}});const msg=document.getElementById('msg');document.getElementById('btn').onclick=async()=>{msg.className='msg';msg.textContent='登入中…';const r=await db.auth.signInWithPassword({email:document.getElementById('email').value.trim(),password:document.getElementById('password').value});if(r.error){msg.className='msg err';msg.textContent='登入失敗：'+r.error.message;return}const p=await db.from('admin_profiles').select('role,enabled').eq('user_id',r.data.user.id).maybeSingle();if(p.error||!p.data||p.data.enabled!==true){await db.auth.signOut();msg.className='msg err';msg.textContent='登入成功，但沒有測試後台管理權限';return}msg.className='msg ok';msg.textContent='登入成功，正在進入測試後台…';setTimeout(()=>{location.href='admin-orders-test.html?v=login-v2'},300)};db.auth.getSession().then(async({data})=>{if(data.session){const p=await db.from('admin_profiles').select('enabled').eq('user_id',data.session.user.id).maybeSingle();if(p.data&&p.data.enabled===true){msg.className='msg ok';msg.textContent='已登入，正在進入測試後台…';location.href='admin-orders-test.html?v=login-v2'}}});</script></body></html>
