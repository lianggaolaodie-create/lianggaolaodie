<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>老爹．涼糕｜設定新密碼</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.shell{max-width:520px;margin:55px auto;padding:12px}.card{background:#fff;border:1px solid #e4dad3;border-radius:18px;padding:22px}.brand{font-size:23px;font-weight:900}.muted{color:#786e68;line-height:1.6}.field{margin:16px 0}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;border:1px solid #ddd2ca;border-radius:10px;padding:13px 12px;font:inherit}.btn{width:100%;border:0;border-radius:11px;padding:13px 14px;background:#2f78c9;color:#fff;font-weight:900;font-size:16px}.notice{padding:11px;border-radius:10px;margin-top:12px;background:#edf8f1;color:#286c47;font-weight:700}.err{background:#fff0ef;color:#a43b35}@media(max-width:700px){.shell{margin:30px auto;padding:10px}.brand{font-size:21px}}
</style>
</head>
<body>
<div class="shell"><div class="card">
<div class="brand">🍡 老爹．涼糕｜設定新密碼</div>
<p class="muted">請輸入新的後台密碼，至少 8 個字元。</p>
<form id="form">
<div class="field"><label for="p1">新密碼</label><input id="p1" type="password" autocomplete="new-password" minlength="8" required></div>
<div class="field"><label for="p2">再次輸入新密碼</label><input id="p2" type="password" autocomplete="new-password" minlength="8" required></div>
<button id="btn" class="btn" type="submit">設定新密碼</button>
</form>
<div id="msg" aria-live="polite"></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(() => {
'use strict';
const db=window.supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const form=document.getElementById('form'),p1=document.getElementById('p1'),p2=document.getElementById('p2'),btn=document.getElementById('btn'),msg=document.getElementById('msg');
function show(text,error=false){msg.className=text?'notice'+(error?' err':''):'';msg.textContent=text||''}
form.addEventListener('submit',async e=>{e.preventDefault();if(p1.value.length<8){show('新密碼至少需要 8 個字元。',true);return}if(p1.value!==p2.value){show('兩次輸入的密碼不一致。',true);return}btn.disabled=true;btn.textContent='更新中…';try{const {error}=await db.auth.updateUser({password:p1.value});if(error)throw error;show('密碼已更新，請返回登入頁使用新密碼登入。');setTimeout(()=>location.replace('admin-login-fixed.html'),1200)}catch(err){show('更新失敗：'+(err.message||err),true)}finally{btn.disabled=false;btn.textContent='設定新密碼'}});
})();
</script>
</body>
</html>
