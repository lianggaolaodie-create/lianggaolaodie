<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>蘿蔔糕宅配訂單管理｜老爹</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f0e7;color:#3b2921;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:1000px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #eadfd4;border-radius:17px;padding:16px;margin-bottom:12px}.brand{font-size:22px;font-weight:950}.muted{color:#81736a;font-size:13px;line-height:1.6}.btn{border:0;border-radius:10px;padding:10px 13px;background:#6b3c21;color:#fff;font-weight:900}.field{margin:12px 0}.field label{display:block;font-weight:900;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #ddd1c7;border-radius:10px;font:inherit}.hidden{display:none!important}.order{border:1px solid #eadfd4;border-radius:13px;padding:13px;margin:10px 0}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.items{background:#faf4ed;border-radius:10px;padding:10px;margin:8px 0}.status{padding:8px;border:1px solid #ddd1c7;border-radius:9px;font:inherit}.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 0}.stat{background:#fff;border:1px solid #eadfd4;border-radius:15px;padding:14px;text-align:center}.stat strong{display:block;font-size:28px}.searchrow{display:flex;gap:8px;margin-bottom:12px}.searchrow input{flex:1;min-width:0;padding:12px;border:1px solid #ddd1c7;border-radius:10px;font:inherit}.order-head{background:#fff8f4;border:1px solid #eadfd4;border-radius:12px;padding:12px}.pink{background:#fff1f3;border-radius:12px;padding:10px}.pill{display:inline-block;border-radius:8px;background:#fce8b2;padding:6px 9px;font-weight:900;margin:3px}.amount{font-size:18px;font-weight:950;color:#805238}.section-title{font-size:18px;font-weight:950;margin:4px 0 12px}.tabs{display:flex;gap:8px;margin:12px 0}.tab{flex:1;border:0;border-radius:12px;padding:13px 8px;background:#e9e0d7;color:#805238;font:inherit;font-weight:900}.tab.active{background:#805238;color:#fff}.customer-card{border:1px solid #eadfd4;border-radius:13px;padding:13px;margin:10px 0;background:#fff}.mutedline{color:#75675e;line-height:1.7;margin:8px 0}@media(max-width:600px){.searchrow{flex-direction:column}}@media(max-width:600px){.wrap{padding:8px}.card{padding:12px}}</style></head><body><main class="wrap"><div id="login" class="card"><div class="brand">🥕 蘿蔔糕宅配訂單管理</div><p class="muted">使用官網管理員帳號登入。</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn">登入</button></form><div id="loginMsg" class="muted"></div></div><div id="app" class="hidden"><div class="card"><div class="row"><div><div class="brand">🥕 蘿蔔糕宅配訂單</div><div id="who" class="muted"></div></div><div><button id="reload" class="btn">重新整理</button> <button id="logout" class="btn">登出</button></div></div><p class="muted">此清單只顯示蘿蔔糕宅配訂單，不會混入原本涼糕訂單。</p></div><div class="tabs"><button class="tab active" id="ordersTab">🧾 訂單管理</button><button class="tab" id="customersTab">👤 個資管理</button></div><div id="summary"></div><div id="ordersPanel" class="card"><div class="section-title">🥕 蘿蔔糕宅配訂單（需先付款）</div><div class="searchrow"><input id="search" placeholder="搜尋訂單編號／姓名／電話／門市"><button id="searchBtn" class="btn">搜尋</button></div><div id="list">載入中…</div></div><div id="customersPanel" class="card hidden"><div class="section-title">👤 蘿蔔糕個資管理</div><p class="muted">只顯示蘿蔔糕訂單客戶，不會混入涼糕資料。</p><div id="customerList">載入中…</div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const states=[['pending','待確認'],['confirmed','已確認'],['preparing','製作中'],['shipped','已出貨'],['delivered','已送達'],['completed','已完成'],['cancelled','已取消']];function msg(t){$('loginMsg').textContent=t}
async function enter(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=user.email||'';await load()}
$('loginForm').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){msg('登入失敗：'+r.error.message);return}const a=await db.from('admin_profiles').select('role,enabled').eq('user_id',r.data.user.id).maybeSingle();if(a.error||!a.data?.enabled||!['super_admin','order_admin'].includes(a.data.role)){await db.auth.signOut();msg('此帳號沒有訂單管理權限');return}enter(r.data.user)};
async function load(){ $('list').textContent='讀取訂單中…';const r=await db.from('radish_orders').select('*').order('created_at',{ascending:false}).limit(300);if(r.error){$('list').textContent='讀取失敗：'+r.error.message;return}const orders=r.data||[];if(!orders.length){$('summary').innerHTML='<div class="stats"><div class="stat">🧾<div>今日訂單</div><strong>0</strong></div><div class="stat">💰<div>待確認匯款</div><strong>0</strong></div><div class="stat">✅<div>已確認付款</div><strong>0</strong></div><div class="stat">🚚<div>已出貨／送達</div><strong>0</strong></div></div>';$('list').textContent='目前還沒有蘿蔔糕宅配訂單。';$('customerList').innerHTML='<p class="muted">目前沒有蘿蔔糕客戶資料。客戶下單後，姓名、電話、地址／門市與匯款後五碼會自動顯示在這裡。</p>';return}const ids=orders.map(o=>o.id);const ir=await db.from('radish_order_items').select('*').in('order_id',ids).order('id');const items=ir.data||[];const cmap=new Map();orders.forEach(o=>{const k=String(o.customer_phone||'')+'|'+String(o.customer_name||'');if(!cmap.has(k))cmap.set(k,{name:o.customer_name,phone:o.customer_phone,orders:[]});cmap.get(k).orders.push(o)});$('customerList').innerHTML=[...cmap.values()].map(x=>'<article class="customer-card"><b>'+esc(x.name)+'</b><br><a href="tel:'+esc(x.phone)+'">'+esc(x.phone)+'</a><br><span class="muted">共 '+x.orders.length+' 筆蘿蔔糕訂單</span>'+x.orders.map(o=>'<div class="mutedline">訂單：'+esc(o.order_number)+'<br>地址／門市：'+esc(o.delivery_address)+'<br>匯款後五碼：'+esc((String(o.customer_note||'').match(/匯款帳號後五碼：\\s*(\\d{5})/)||[])[1]||'—')+'<br>總額：NT$ '+Number(o.total_amount||0).toLocaleString()+'</div>').join('')+'</article>').join('')||'目前還沒有蘿蔔糕客戶資料。';$('list').innerHTML=orders.map(o=>'<article class="order"><div class="row"><b>訂單 '+esc(o.order_number)+'</b><b>NT$ '+Number(o.total_amount).toLocaleString()+'</b></div><div class="muted">'+new Date(o.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+' · '+esc(o.payment_method)+'</div><p>收件人：<b>'+esc(o.customer_name)+'</b>　電話：<a href="tel:'+esc(o.customer_phone)+'">'+esc(o.customer_phone)+'</a></p><p>宅配地址：'+esc(o.delivery_address)+'</p><div class="items">'+items.filter(i=>i.order_id===o.id).map(i=>esc(i.product_name)+' × '+i.quantity+'（NT$ '+Number(i.subtotal).toLocaleString()+'）').join('<br>')+'</div>'+(o.customer_note?'<p>備註：'+esc(o.customer_note)+'</p>':'')+'<div class="row"><label>訂單狀態 <select class="status" data-status="'+o.id+'">'+states.map(s=>'<option value="'+s[0]+'" '+(o.status===s[0]?'selected':'')+'>'+s[1]+'</option>').join('')+'</select></label><button class="btn" data-save="'+o.id+'">儲存狀態</button></div></article>').join('');document.querySelectorAll('[data-save]').forEach(b=>b.onclick=async()=>{b.disabled=true;const id=b.dataset.save;const status=document.querySelector('[data-status="'+id+'"]').value;const u=await db.from('radish_orders').update({status,updated_at:new Date().toISOString()}).eq('id',id);if(u.error)alert('更新失敗：'+u.error.message);else alert('訂單狀態已更新');b.disabled=false;await load()})}
$('ordersTab').onclick=()=>{$('ordersTab').classList.add('active');$('customersTab').classList.remove('active');$('ordersPanel').classList.remove('hidden');$('customersPanel').classList.add('hidden')};$('customersTab').onclick=()=>{$('customersTab').classList.add('active');$('ordersTab').classList.remove('active');$('customersPanel').classList.remove('hidden');$('ordersPanel').classList.add('hidden')};$('reload').onclick=load;$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.getSession().then(async r=>{if(r.data.session){const a=await db.from('admin_profiles').select('role,enabled').eq('user_id',r.data.session.user.id).maybeSingle();if(!a.error&&a.data?.enabled&&['super_admin','order_admin'].includes(a.data.role))enter(r.data.session.user)}});
</script></body></html>
