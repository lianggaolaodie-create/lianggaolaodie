<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜餐車行程</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0000000a}h1{margin:0 0 8px}h2{font-size:20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #d9cdc1;border-radius:10px;box-sizing:border-box;font:inherit}.field textarea{min-height:70px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:11px;padding:10px 14px;background:#9b5c38;color:#fff;font-weight:800}button.secondary{background:#eee;color:#333}button.danger{background:#a32e29}.item{border:1px solid #eadfd4;border-radius:13px;padding:14px;margin:10px 0}.checkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.check{border:1px solid #eadfd4;border-radius:10px;padding:10px}.small{font-size:13px;color:#75685f}.msg{padding:12px;border-radius:10px;background:#f6eee7;margin-top:10px}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}.hidden{display:none}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px solid #eee;padding:10px 0}.row:last-child{border:0}@media(max-width:650px){.grid{grid-template-columns:1fr}.checkgrid{grid-template-columns:1fr}}</style><script src="maintenance-gate.js"></script></head><body><div class="wrap"><div class="card"><h1>🚚 老爹・涼糕 餐車行程</h1><div id="who" class="small">尚未登入</div></div><div id="login" class="card"><h2>管理員登入</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>密碼</label><input id="password" type="password"></div><button id="loginBtn">登入</button><div id="loginMsg"></div></div><div id="panel" class="hidden"><div class="card"><div class="actions"><button class="secondary" onclick="location.href='admin.html'">← 回後台</button><button class="secondary" onclick="location.reload()">重新整理</button><button class="secondary" onclick="logout()">登出</button></div><div id="roleMsg" class="msg"></div></div><div class="card"><h2>➕ 新增餐車行程</h2><div class="grid"><div class="field"><label>日期</label><input id="date" type="date"></div><div class="field"><label>行程標題</label><input id="title" value="涼糕餐車"></div><div class="field"><label>地區</label><input id="region" placeholder="例如：桃園全區（不包含復興鄉）"></div><div class="field"><label>開始時間</label><input id="start" type="time"></div><div class="field"><label>結束時間</label><input id="end" type="time"></div></div><div class="field"><label>備註</label><textarea id="note" placeholder="例如：復興鄉請洽官方 LINE"></textarea></div><label><input id="enabled" type="checkbox" checked> 開放顯示</label><h3>🍡 當天販售口味</h3><div id="flavors" class="checkgrid">讀取中…</div><div class="actions" style="margin-top:12px"><button onclick="addSchedule()">新增行程</button></div><div id="formMsg"></div></div><div class="card"><h2>📅 已建立行程</h2><div id="list">讀取中…</div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(function(){const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');let can=false,flavors=[];function show(id,t,c='msg'){ $(id).innerHTML='<div class="'+c+'">'+esc(t)+'</div>'}function today(){return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'})}async function boot(){const{data}=await sb.auth.getUser();if(data.user)await enter(data.user)}async function enter(u){const{data:p,error}=await sb.from('admin_profiles').select('role,enabled,can_manage_food_truck').eq('user_id',u.id).maybeSingle();if(error||!p||!p.enabled||!p.can_manage_food_truck){show('loginMsg','此帳號沒有「餐車行程」管理權限。','msg error');return}can=true;$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('who').textContent=u.email||'';$('roleMsg').textContent='目前權限：餐車行程管理';$('date').value=today();await Promise.all([loadFlavors(),loadList()])}$('loginBtn').onclick=async()=>{const email=$('email').value.trim(),password=$('password').value;if(!email||!password)return show('loginMsg','請輸入 Email 和密碼','msg error');const{data,error}=await sb.auth.signInWithPassword({email,password});if(error)return show('loginMsg','登入失敗：'+error.message,'msg error');await enter(data.user)};window.logout=async()=>{await sb.auth.signOut();location.reload()};async function loadFlavors(){const{data,error}=await sb.from('flavors').select('id,name,price,enabled').order('id');if(error)return show('flavors',error.message,'msg error');flavors=data||[];$('flavors').innerHTML=flavors.filter(f=>f.enabled).map(f=>'<label class="check"><input class="flavorCheck" type="checkbox" value="'+f.id+'"> '+esc(f.name)+' <span class="small">$'+Number(f.price||0)+'</span></label>').join('')||'目前沒有啟用口味。'}async function loadList(){const{data,error}=await sb.from('food_truck_schedules').select('*').order('schedule_date',{ascending:false}).order('id',{ascending:false});if(error)return show('list',error.message,'msg error');if(!data?.length)return $('list').textContent='目前沒有餐車行程。';const ids=data.map(x=>x.id);const{data:links}=await sb.from('food_truck_schedule_flavors').select('schedule_id,flavor_id').in('schedule_id',ids);const map={};(links||[]).forEach(x=>(map[x.schedule_id]??=[]).push(x.flavor_id));$('list').innerHTML=data.map(s=>{const names=(map[s.id]||[]).map(id=>flavors.find(f=>f.id===id)?.name).filter(Boolean);return '<div class="item"><strong>'+esc(s.schedule_date)+'｜'+esc(s.title)+'</strong><div>'+esc(s.region)+'</div><div class="small">'+esc(s.start_time||'')+(s.end_time?' ～ '+esc(s.end_time):'')+'</div><div>🍡 '+esc(names.join('、')||'未設定')+'</div><div class="small">'+esc(s.note||'')+'</div><div class="actions" style="margin-top:8px"><span>'+ (s.enabled?'🟢 開放':'⚪ 關閉')+'</span><button class="danger" onclick="removeSchedule('+s.id+')">刪除</button></div></div>'}).join('')}window.addSchedule=async()=>{if(!can)return;const payload={schedule_date:$('date').value,title:$('title').value.trim()||'涼糕餐車',region:$('region').value.trim(),start_time:$('start').value||null,end_time:$('end').value||null,note:$('note').value.trim()||null,enabled:$('enabled').checked};if(!payload.schedule_date||!payload.region)return show('formMsg','請填寫日期與地區','msg error');const{data,error}=await sb.from('food_truck_schedules').insert(payload).select('id').single();if(error)return show('formMsg','新增失敗：'+error.message,'msg error');const ids=[...document.querySelectorAll('.flavorCheck:checked')].map(x=>Number(x.value));if(ids.length){const{error:e}=await sb.from('food_truck_schedule_flavors').insert(ids.map(flavor_id=>({schedule_id:data.id,flavor_id})));if(e){await sb.from('food_truck_schedules').delete().eq('id',data.id);return show('formMsg','口味儲存失敗：'+e.message,'msg error')}}show('formMsg','餐車行程已新增','msg ok');$('region').value='';$('note').value='';document.querySelectorAll('.flavorCheck').forEach(x=>x.checked=false);loadList()};window.removeSchedule=async id=>{if(!confirm('確定刪除這筆餐車行程？'))return;const{error}=await sb.from('food_truck_schedules').delete().eq('id',id);if(error)return alert('刪除失敗：'+error.message);loadList()};boot()})();</script></body></html>
