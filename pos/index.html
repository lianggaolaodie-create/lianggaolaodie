<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#171717" />
    <title>老爹 POS 收銀</title>
    <style>
      body{margin:0;background:#f5f5f3;color:#191919;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
      #root{min-height:100vh}
      .boot{max-width:420px;margin:18vh auto;padding:24px;text-align:center}
      .boot h1{font-size:24px}.boot p{line-height:1.7;color:#555}
      .boot .error{color:#9b2c2c;background:#fff0f0;padding:12px;border-radius:10px;word-break:break-word}
    </style>
  </head>
  <body>
    <div id="root"><main class="boot"><h1>老爹 POS</h1><p>系統正在載入，請稍候…</p></main></div>
    <script>
      window.addEventListener('error', function(event) {
        var root = document.getElementById('root');
        if (!root) return;
        var detail = event.message || (event.target && event.target.src) || '程式載入失敗';
        root.innerHTML = '<main class="boot"><h1>老爹 POS</h1><p class="error">系統載入錯誤：' + String(detail).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}) + '</p><p>請截圖傳給客服協助排除。</p></main>';
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        var root = document.getElementById('root');
        if (!root) return;
        var detail = event.reason && event.reason.message ? event.reason.message : String(event.reason || '未知錯誤');
        root.innerHTML = '<main class="boot"><h1>老爹 POS</h1><p class="error">系統初始化錯誤：' + String(detail).replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]}) + '</p><p>請截圖傳給客服協助排除。</p></main>';
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
