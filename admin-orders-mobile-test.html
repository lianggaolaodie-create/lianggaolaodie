<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹．涼糕｜訂單管理測試</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:1100px;margin:auto;padding:12px}.top{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 12px}.brand{font-size:21px;font-weight:900}.btn{border:0;border-radius:10px;padding:10px 14px;background:#8d5939;color:#fff;font-weight:900;cursor:pointer}.gray{background:#6d625b}.red{background:#f33b3b}.login{max-width:520px;margin:60px auto}.card,.section,.stat{background:#fff;border:1px solid #e5dcd5;border-radius:15px;padding:12px}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #ddd2ca;border-radius:10px;font:inherit}.nav{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}.nav button{border:0;border-radius:12px;padding:12px;background:#ebe4de;color:#5a4940;font-weight:900}.nav .active{background:#8d5939;color:#fff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}.stat{text-align:center}.stat b{display:block;font-size:24px;margin-top:3px}.section{margin:10px 0}.pickup{background:#fff2f3}.home{background:#eef8ff}.title{display:flex;justify-content:space-between;gap:8px;font-size:18px;font-weight:900;margin-bottom:8px}.searchrow{display:flex;gap:7px}.search{flex:1;min-width:0;padding:11px;border:1px solid #ddd2ca;border-radius:10px;font:inherit}.order{background:#fff;border:1px solid #e8ddd6;border-radius:13px;padding:10px;margin:8px 0}.topline{display:flex;justify-content:space-between;gap:6px;align-items:center}.status{padding:5px 8px;border-radius:8px;color:#fff;font-size:12px;font-weight:900;white-space:nowrap}.pending{background:#f23a43}.paid{background:#13ad67}.stored{background:#168fe4}.delivery{background:#13ad67}.person{margin:8px 0;font-size:13px;line-height:1.6}.chips{display:flex;flex-wrap:wrap;gap:6px;background:#fff4f4;padding:7px;border-radius:9px}.chip{background:#ffdfe5;border-radius:7px;padding:5px 8px;font-size:12px;font-weight:800}.summary{font-size:12px;margin-top:8px}.actions{display:flex;gap:6px;justify-content:flex-end;margin-top:9px}.actions .btn{padding:8px 11px;font-size:12px}.muted{color:#786e68;font-size:13px}.hidden{display:none!important}.msg{padding:10px;border-radius:10px;margin-top:10px;background:#fff0ef;color:#a43b35}.modal{position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.hidden{display:none}.modalbox{background:#fff;border-radius:16px;padding:18px;width:min(420px,100%)}.modalbox select{width:100%;padding:12px;border:1px solid #ddd2ca;border-radius:10px;font-size:16px}.modalactions{display:flex;gap:8px;margin-top:14px}.modalactions button{flex:1}@media(max-width:700px){.brand{font-size:19px}.stats{grid-template-columns:repeat(2,1fr)}.nav button{font-size:13px}.title{font-size:17px}.topline{align-items:flex-start}}
</style></head><body><div id="loginView" class="wrap login"><div class="card"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><p class="muted">手機版測試頁</p><div class="field"><label>管理員 Email</label><input id="loginEmail" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="loginPassword" type="password" autocomplete="current-password"></div><button id="loginButton" class="btn">登入</button><div id="loginMessage"></div></div></div><main id="appView" class="wrap hidden"><div class="top"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><button id="logoutButton" class="btn gray">登出</button></div><div class="nav"><button class="active">🧾 訂單管理</button><button>👤 個資管理</button><button>📅 每日開放設定</button></div><div class="stats"><div class="stat">🧾<div>今日訂單</div><b id="todayCount">0</b></div><div class="stat">💰<div>待確認匯款</div><b id="pendingCount">0</b></div><div class="stat">✅<div>已付款</div><b id="paidCount">0</b></div><div class="stat">🚚<div>已寄放</div><b id="storedCount">0</b></div></div><div class="section pickup"><div class="title"><span>🏪 超商寄放客戶資料 <span style="color:#e33">(需先付款)</span></span><span>共 <b id="pickupCount">0</b> 筆</span></div><div class="searchrow"><input id="pickupSearch" class="search" placeholder="搜尋訂單編號／姓名／電話／門市"><button id="pickupSearchBtn" class="btn">搜尋</button></div><div id="pickupList"></div></div><div class="section home"><div class="title"><span>🏠 送到府訂單 <span style="color:#1674c5">(貨到付款)</span></span><span>共 <b id="homeCount">0</b> 筆</span></div><div class="searchrow"><input id="homeSearch" class="search" placeholder="搜尋訂單編號／姓名／電話／地址"><button id="homeSearchBtn" class="btn">搜尋</button></div><div id="homeList"></div></div></main><div id="statusModal" class="modal hidden"><div class="modalbox"><h3>編輯訂單狀態</h3><select id="statusSelect"></select><div class="modalactions"><button id="cancelStatus" class="btn gray">取消</button><button id="saveStatus" class="btn">儲存狀態</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});let rows=[],editing=null;function loginError(t){$('loginMessage').innerHTML='<div class="msg">'+esc(t)+'</div>'}async function access(u){const r=await db.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',u.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'管理員帳號目前已停用';if(!['super_admin','order_admin','personal_data_admin'].includes(r.data.role)&&!r.data.can_manage_products)return'此帳號沒有管理權限';return null}async function doLogin(){const email=$('loginEmail').value.trim(),password=$('loginPassword').value;if(!email||!password)return loginError('請輸入管理員 Email 與密碼。');$('loginButton').disabled=true;$('loginButton').textContent='登入中…';try{const r=await db.auth.signInWithPassword({email,password});if(r.error)throw r.error;const er=await access(r.data.user);if(er){await db.auth.signOut();throw Error(er)}$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');await load()}catch(e){loginError('登入失敗：'+(e.message||'未知錯誤'))}finally{$('loginButton').disabled=false;$('loginButton').textContent='登入'}}$('loginButton').onclick=doLogin;$('loginPassword').onkeydown=e=>{if(e.key==='Enter')doLogin()};$('logoutButton').onclick=async()=>{await db.auth.signOut();location.reload()};function match(o,q){return!q||[o.no,o.name,o.phone,o.place,o.address,o.last5].join(' ').toLowerCase().includes(q.toLowerCase())}function sc(o){return o.type==='pickup'?(o.status==='已付款'?'paid':o.status==='已寄放'?'stored':'pending'):'delivery'}function card(o){const chips=o.items.map(x=>'<span class="chip">'+esc(x.name)+' ('+Number(x.qty||0)+'盒)</span>').join('');return'<div class="order"><div class="topline"><b>訂單編號　'+esc(o.no)+'</b><span class="status '+sc(o)+'">'+esc(o.displayStatus)+'</span></div><div class="person">👤 '+esc(o.name)+'　'+esc(o.phone)+'<br>📍 '+esc(o.type==='home'?o.address:o.place)+(o.last5?'　💳 匯款後五碼 '+esc(o.last5):'')+'</div><div class="chips"><b>口味 (數量)</b> '+chips+'</div><div class="summary">涼糕數量 <b>'+o.qty+' 盒</b>　|　商品小計 <b>$'+o.product+'</b>　|　'+(o.type==='pickup'?'寄放費 <b>$'+o.fee+'</b>　|　':'')+'應付總額 <b>$'+o.total+'</b>　'+(o.type==='home'?'付款方式：貨到付款':'')+'</div><div class="actions"><button class="btn gray view" data-id="'+esc(o.id)+'">查看</button><button class="btn edit" data-id="'+esc(o.id)+'">編輯狀態</button><button class="btn red del" data-id="'+esc(o.id)+'">🗑 刪除</button></div></div>'}function render(){const d=today(),p=rows.filter(o=>o.date===d&&o.type==='pickup'&&match(o,$('pickupSearch').value)),h=rows.filter(o=>o.date===d&&o.type==='home'&&match(o,$('homeSearch').value));$('pickupCount').textContent=p.length;$('homeCount').textContent=h.length;$('pickupList').innerHTML=p.map(card).join('')||'<div class="muted">目前沒有超商寄放訂單。</div>';$('homeList').innerHTML=h.map(card).join('')||'<div class="muted">目前沒有送到府訂單。</div>';$('todayCount').textContent=rows.filter(o=>o.date===d).length;$('pendingCount').textContent=rows.filter(o=>o.status==='待確認匯款').length;$('paidCount').textContent=rows.filter(o=>o.status==='已付款').length;$('storedCount').textContent=rows.filter(o=>o.status==='已寄放').length;document.querySelectorAll('.view').forEach(b=>b.onclick=()=>view(b.dataset.id));document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>edit(b.dataset.id));document.querySelectorAll('.del').forEach(b=>b.onclick=()=>del(b.dataset.id))}function view(id){const o=rows.find(x=>x.id===id);if(o)alert('訂單編號：'+o.no+'\n姓名：'+o.name+'\n電話：'+o.phone+'\n'+(o.type==='home'?'地址：'+o.address:'門市：'+o.place)+'\n狀態：'+o.displayStatus)}function edit(id){editing=rows.find(x=>x.id===id);if(!editing)return;const a=editing.type==='pickup'?['待確認匯款','已付款','已寄放']:['待配送','配送中','已送達'];$('statusSelect').innerHTML=a.map(x=>'<option>'+x+'</option>').join('');$('statusSelect').value=editing.status;$('statusModal').classList.remove('hidden')}$('cancelStatus').onclick=()=>{$('statusModal').classList.add('hidden');editing=null};$('saveStatus').onclick=async()=>{if(!editing)return;const table=editing.type==='pickup'?'cooling_pickup_orders':'orders',r=await db.from(table).update({status:$('statusSelect').value}).eq('id',editing.id);if(r.error)return alert('狀態更新失敗：'+r.error.message);$('statusModal').classList.add('hidden');editing=null;await load()};async function del(id){const o=rows.find(x=>x.id===id);if(!o||!confirm('確定要刪除訂單 '+o.no+' 嗎？\n刪除後無法復原。'))return;let r;if(o.type==='pickup'){await db.from('cooling_pickup_order_items').delete().eq('order_id',o.id);r=await db.from('cooling_pickup_orders').delete().eq('id',o.id)}else{await db.from('order_items').delete().eq('order_id',o.id);await db.from('order_private').delete().eq('order_id',o.id);r=await db.from('orders').delete().eq('id',o.id)}if(r.error)return alert('刪除失敗：'+r.error.message);await load()}async function load(){const [p,h]=await Promise.all([db.from('cooling_pickup_orders').select('*').order('created_at',{ascending:false}).limit(300),db.from('orders').select('id,order_number,delivery_date,product_total,total_amount,status,created_at,pickup_type').eq('pickup_type','home_delivery').order('created_at',{ascending:false}).limit(300)]);let out=[];if(!p.error){const ids=(p.data||[]).map(x=>x.id);let ii=[];if(ids.length){const r=await db.from('cooling_pickup_order_items').select('order_id,flavor_name,quantity').in('order_id',ids);ii=r.data||[]}const im=new Map();ii.forEach(x=>{if(!im.has(x.order_id))im.set(x.order_id,[]);im.get(x.order_id).push({name:x.flavor_name,qty:x.quantity})});const cids=(p.data||[]).map(x=>x.customer_id).filter(Boolean);let cs=[];if(cids.length){const r=await db.from('order_customers').select('id,name,phone').in('id',cids);cs=r.data||[]}const cm=new Map(cs.map(x=>[x.id,x]));out.push(...(p.data||[]).map(x=>{const c=cm.get(x.customer_id)||{},its=im.get(x.id)||[];return{id:String(x.id),type:'pickup',date:x.order_date,no:x.order_number,name:c.name||'',phone:c.phone||'',place:[x.convenience_store,x.store_name].filter(Boolean).join(' '),last5:x.payment_last5,items:its,qty:its.reduce((a,b)=>a+Number(b.qty||0),0),product:Number(x.merchandise_total||0),fee:Number(x.storage_fee||0),total:Number(x.total_amount||0),status:x.status,displayStatus:x.status}}))}if(!h.error){const ids=(h.data||[]).map(x=>x.id);let pp=[],ii=[];if(ids.length){const [a,b]=await Promise.all([db.from('order_private').select('order_id,customer_name,customer_phone,delivery_address').in('order_id',ids),db.from('order_items').select('order_id,flavor_name,quantity').in('order_id',ids)]);pp=a.data||[];ii=b.data||[]}const pm=new Map(pp.map(x=>[x.order_id,x]));const im=new Map();ii.forEach(x=>{if(!im.has(x.order_id))im.set(x.order_id,[]);im.get(x.order_id).push({name:x.flavor_name,qty:x.quantity})});out.push(...(h.data||[]).map(x=>{const c=pm.get(x.id)||{},its=im.get(x.id)||[];return{id:String(x.id),type:'home',date:x.delivery_date,no:x.order_number,name:c.customer_name||'',phone:c.customer_phone||'',address:c.delivery_address||'',items:its,qty:its.reduce((a,b)=>a+Number(b.qty||0),0),product:Number(x.product_total||0),fee:0,total:Number(x.total_amount||0),status:x.status,displayStatus:x.status||'待配送'}}))}rows=out;render()}$('pickupSearch').oninput=render;$('homeSearch').oninput=render;$('pickupSearchBtn').onclick=render;$('homeSearchBtn').onclick=render;db.auth.getSession().then(async s=>{if(s.data.session&&!await access(s.data.session.user)){$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');load()}});</script></body></html>
