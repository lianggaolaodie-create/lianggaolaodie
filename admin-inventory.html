<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>老爹．涼糕｜庫存管理</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f1e8;color:#38261d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}.top,.card{background:#fff;border:1px solid #e5d9cf;border-radius:22px;padding:18px;margin-bottom:14px}.brand{font-size:24px;font-weight:900}.muted{color:#7b6d64;line-height:1.6}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.field{margin:10px 0}.field label{display:block;font-weight:900;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d8cbc0;border-radius:12px;font-size:17px}.btn{border:0;border-radius:12px;padding:11px 16px;background:#6b3d29;color:#fff;font-weight:900}.back{background:#eee5dd;color:#38261d}.row{display:flex;align-items:center;gap:12px;border:1px solid #e5d9cf;border-radius:16px;padding:14px;margin:10px 0}.grow{flex:1}.stock{width:120px}.badge{display:inline-block;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:900;background:#eaf5ed;color:#2d7048}.off{background:#fae9e6;color:#a33d35}.notice{padding:12px;border-radius:12px;background:#edf7ef;margin-top:10px}.err{background:#fff0ef;color:#a33d35}.hidden{display:none!important}</style></head><body><div id="login" class="wrap"><div class="card"><div class="brand">🍡 老爹．涼糕｜庫存管理</div><p class="muted">管理每日各口味庫存。庫存剩 1 盒時，該口味不開放線上下單。</p><form id="loginForm"><div class="field"><label>管理員 Email</label><input id="email" type="email" required></div><div class="field"><label>密碼</label><input id="password" type="password" required></div><button class="btn">登入</button></form><div id="loginMsg"></div></div></div><div id="app" class="wrap hidden"><div class="top"><div class="toolbar"><div><div class="brand">📊 庫存管理</div><div id="who" class="muted"></div></div><button class="btn back" id="back">← 回營運管理</button></div></div><div class="card"><div class="toolbar"><h2>每日庫存</h2><button class="btn" id="save">儲存庫存</button></div><div class="field"><label>日期</label><input id="date" type="date"></div><div id="msg"></div><div id="list"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function msg(t,e=false){$('msg').innerHTML=t?'<div class="notice '+(e?'err':'')+'">'+esc(t)+'</div>':''}async function access(u){const r=await db.from('admin_profiles').select('role,enabled').eq('user_id',u.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'此帳號已停用';if(r.data.role!=='super_admin')return'沒有後台管理權限';return null}async function load(){const d=$('date').value||today();const r=await db.from('daily_order_flavors').select('*').eq('order_date',d).order('id');if(r.error)return msg('讀取失敗：'+r.error.message,true);const rows=r.data||[];$('list').innerHTML=rows.length?rows.map(x=>'<div class="row"><div class="grow"><b>'+esc(x.product_name||'涼糕')+'／'+esc(x.flavor_name)+'</b><br><span class="muted">價格 NT$ '+Number(x.price||0).toLocaleString()+'</span>　<span class="badge '+(Number(x.quantity||0)>=2?'':'off')+'">'+(Number(x.quantity||0)>=2?'可下單':'不可下單')+'</span></div><div class="stock"><label class="muted">庫存（盒）</label><input class="q" data-id="'+x.id+'" type="number" min="0" step="1" value="'+Number(x.quantity||0)+'"></div></div>').join(''):'<div class="muted">這一天尚未建立每日開放口味，請先到「每日開放」建立口味。</div>'}async function save(){const els=[...document.querySelectorAll('.q')];$('save').disabled=true;try{for(const e of els){const q=Math.max(0,Math.floor(Number(e.value||0)));const r=await db.from('daily_order_flavors').update({quantity:q}).eq('id',Number(e.dataset.id));if(r.error)throw r.error}msg('庫存已儲存，線上訂購已同步。');await load()}catch(e){msg('儲存失敗：'+e.message,true)}finally{$('save').disabled=false}}$('date').value=today();$('date').onchange=load;$('save').onclick=save;$('back').onclick=()=>location.href='admin-dashboard.html';$('loginForm').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)return $('loginMsg').textContent='登入失敗：'+r.error.message;const er=await access(r.data.user);if(er){await db.auth.signOut();return $('loginMsg').textContent='登入失敗：'+er}show(r.data.user)};function show(u){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='已登入 · '+u.email;load()}db.auth.getSession().then(async r=>{if(r.data.session){const er=await access(r.data.session.user);if(!er)show(r.data.session.user)}});</script></body></html>
