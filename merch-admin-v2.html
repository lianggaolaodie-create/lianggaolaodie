<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>老爹・涼糕｜周邊商品管理後台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f0ea;color:#34271f;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:1100px;margin:auto;padding:16px 14px 60px}.card{background:#fff;border:1px solid #e5d9cf;border-radius:20px;padding:18px;margin:14px 0;box-shadow:0 5px 22px rgba(52,39,31,.05)}h1,h2,h3{margin:0 0 12px}.muted{color:#786b62;font-size:14px}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tab{border:0;border-radius:12px;padding:12px 16px;background:#e9e1da;color:#5d4d42;font-weight:800;white-space:nowrap}.tab.active{background:#95603f;color:#fff}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #d8cbc0;border-radius:11px;padding:12px;font:inherit;background:#fff}.field textarea{min-height:110px;resize:vertical}button{border:0;border-radius:11px;padding:11px 15px;background:#95603f;color:#fff;font-weight:800;cursor:pointer}button.secondary{background:#6d625c}button.danger{background:#a63b34}button:disabled{opacity:.5}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.msg{padding:10px;border-radius:10px;margin-top:10px}.ok{background:#eaf6ee;color:#2d7047}.err{background:#fff0ef;color:#a33b35}.list{display:grid;gap:10px}.item{border:1px solid #e5d9cf;border-radius:15px;padding:14px;background:#fff}.product{display:grid;grid-template-columns:88px 1fr auto;gap:12px;align-items:center}.thumb{width:88px;height:88px;object-fit:cover;border-radius:12px;background:#eee5dc}.thumb.empty{display:flex;align-items:center;justify-content:center;color:#9b8b80;font-size:12px;text-align:center}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eee6df;margin:2px 5px 2px 0;font-size:12px}.on{background:#e7f6ed;color:#286d46}.off{background:#f4e8e7;color:#963b35}.size-box{border:1px solid #e1d5ca;border-radius:12px;padding:12px;background:#fcfaf8}.sizes{display:flex;flex-wrap:wrap;gap:8px}.size{display:flex;align-items:center;gap:5px;border:1px solid #d8cbc0;border-radius:9px;padding:8px 11px;font-weight:800;background:#fff}.size input{width:auto}.customer-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 18px}.order-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}.topline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.upload{font-size:13px}.preview{display:none;max-width:180px;max-height:180px;border-radius:12px;margin-top:8px}@media(max-width:700px){.grid,.customer-grid,.order-grid{grid-template-columns:1fr}.product{grid-template-columns:70px 1fr}.thumb{width:70px;height:70px}.product .actions{grid-column:1/-1}}
</style>
</head>
<body>
<div class="wrap">
<header class="card"><h1>🛍️ 周邊商品管理後台</h1><div id="who" class="muted">尚未登入</div></header>
<section id="login" class="card"><h2>管理員登入</h2><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" required></div><button id="loginBtn">登入</button></form><div class="muted" style="margin-top:10px">本後台只管理周邊商品，不會修改餐車／擺攤等其他系統。</div><div id="loginMsg"></div></section>
<main id="app" class="hidden">
<div class="tabs"><button class="tab active" data-tab="products">商品管理</button><button class="tab" data-tab="categories">分類管理</button><button class="tab" data-tab="orders">商品訂單</button><button class="tab" data-tab="customers">客戶個資管理</button></div>
<section id="productsTab" class="card"><div class="topline"><h2>商品列表</h2><button id="newBtn">＋新增商品</button></div><div id="productMsg"></div><div id="productList" class="list">讀取中…</div></section>
<section id="categoriesTab" class="card hidden"><h2>分類管理</h2><div class="grid"><div class="field"><label>分類名稱</label><input id="catName" placeholder="衣服、帽子、外套、毛巾、其他周邊"></div><div class="actions"><button id="addCat">新增分類</button></div></div><div id="catMsg"></div><div id="catList" class="list"></div></section>
<section id="ordersTab" class="card hidden"><h2>商品訂單</h2><div id="orderMsg"></div><div id="orderList" class="list">讀取中…</div></section>
<section id="customersTab" class="card hidden"><h2>客戶個資管理</h2><div class="muted">資料來自周邊商品訂單。沒有訂單時不顯示客戶資料。</div><div class="field"><label>搜尋</label><input id="customerSearch" placeholder="姓名／電話／Email"></div><div id="customerList" class="list">讀取中…</div></section>
<section id="editCard" class="card hidden"><div class="topline"><h2 id="editTitle">新增商品</h2><button id="cancelBtn" class="secondary" type="button">取消</button></div><div class="grid"><div class="field"><label>商品名稱</label><input id="pName" required></div><div class="field"><label>商品分類</label><select id="pCategory"><option value="">未分類</option></select></div><div class="field"><label>售價</label><input id="pPrice" type="number" min="0" step="1" required></div><div class="field"><label>庫存數量</label><input id="pStock" type="number" min="0" step="1" required></div></div>
<div id="sizeField" class="field hidden"><label>衣服／外套尺寸</label><div class="size-box"><div class="sizes"><label class="size"><input type="checkbox" value="XS">XS</label><label class="size"><input type="checkbox" value="S">S</label><label class="size"><input type="checkbox" value="M">M</label><label class="size"><input type="checkbox" value="L">L</label><label class="size"><input type="checkbox" value="XL">XL</label><label class="size"><input type="checkbox" value="2XL">2XL</label><label class="size"><input type="checkbox" value="3XL">3XL</label><label class="size"><input type="checkbox" value="4XL">4XL</label><label class="size"><input type="checkbox" value="5XL">5XL</label></div><div class="muted" style="margin-top:8px">可複選 XS～5XL。</div></div></div>
<div class="field"><label>商品介紹</label><textarea id="pDescription" placeholder="商品說明"></textarea></div><div class="field"><label>商品圖片網址</label><input id="pImage" type="url" placeholder="https://..."><div class="muted">也可直接選擇圖片上傳。</div><input id="pFile" class="upload" type="file" accept="image/*"><img id="preview" class="preview" alt="預覽"></div><div class="field"><label><input id="pEnabled" type="checkbox" checked> 上架中</label></div><div class="actions"><button id="saveBtn">儲存商品</button></div><div id="editMsg"></div></section>
<section class="card"><button id="refresh" class="secondary">重新整理</button> <button id="logout" class="secondary">登出</button></section>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{const URL='https://yemzdwxtyosuaczsqwea.supabase.co',KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';let sb,products=[],categories=[],orders=[],editingId=null,busy=false;const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const show=(id,t,k='ok')=>{const e=$(id);if(e)e.innerHTML='<div class="msg '+k+'">'+esc(t)+'</div>'};
async function access(u){const r=await sb.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',u.id).maybeSingle();if(r.error)return r.error.message;if(!r.data)return'找不到管理員資料';if(!r.data.enabled)return'此帳號目前已停用';if(!(r.data.role==='super_admin'||r.data.can_manage_products))return'此帳號沒有商品管理權限';return null}
async function openApp(){ $('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent='已登入 · 周邊商品管理後台';await loadAll() }
const clothing=()=>{const c=categories.find(x=>x.id===Number($('pCategory').value));return !!c&&/(衣服|外套|服飾)/.test(c.name||'')};
function sizeVisible(){ $('sizeField').classList.toggle('hidden',!clothing()) }
function selected(){return [...document.querySelectorAll('#sizeField input:checked')].map(x=>x.value)}
function setSizes(a){const s=new Set(Array.isArray(a)?a:[]);document.querySelectorAll('#sizeField input').forEach(x=>x.checked=s.has(x.value))}
async function loadCategories(){const r=await sb.from('merch_categories').select('id,name,enabled,created_at').order('id');if(r.error)return show('catMsg','分類讀取失敗：'+r.error.message,'err');categories=r.data||[];$('pCategory').innerHTML='<option value="">未分類</option>'+categories.filter(x=>x.enabled).map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');renderCats();sizeVisible()}
function renderCats(){$('catList').innerHTML=categories.map(c=>'<div class="item"><b>'+esc(c.name)+'</b> <span class="badge '+(c.enabled?'on':'off')+'">'+(c.enabled?'啟用':'停用')+'</span><button class="secondary" style="float:right" onclick="toggleCat('+c.id+','+(!c.enabled)+')">'+(c.enabled?'停用':'啟用')+'</button></div>').join('')||'<div class="muted">目前沒有分類。</div>'}
async function loadProducts(){const r=await sb.from('merch_products').select('id,category_id,name,description,price,stock_quantity,image_url,enabled,size_options,created_at,updated_at').order('id',{ascending:false});if(r.error)return show('productMsg','商品讀取失敗：'+r.error.message,'err');products=r.data||[];renderProducts()}
function renderProducts(){$('productList').innerHTML=products.map(p=>{const c=categories.find(x=>x.id===p.category_id);const img=p.image_url?'<img class="thumb" src="'+esc(p.image_url)+'" alt="">':'<div class="thumb empty">尚無圖片</div>';const sizes=Array.isArray(p.size_options)&&p.size_options.length?'<div class="muted">尺寸：'+esc(p.size_options.join('、'))+'</div>':'';return '<div class="item product">'+img+'<div><h3>'+esc(p.name)+'</h3><span class="badge">'+esc(c?.name||'未分類')+'</span><span class="badge '+(p.enabled?'on':'off')+'">'+(p.enabled?'上架':'下架')+'</span><div><b>$'+Number(p.price||0).toLocaleString()+'</b>　庫存 '+Number(p.stock_quantity||0)+'</div>'+sizes+'<div class="muted">'+esc(p.description||'')+'</div></div><div class="actions"><button onclick="editProduct('+p.id+')">編輯</button><button class="secondary" onclick="toggleProduct('+p.id+','+(!p.enabled)+')">'+(p.enabled?'下架':'上架')+'</button></div></div>'}).join('')||'<div class="muted">目前沒有商品，按「新增商品」開始。</div>'}
async function loadOrders(){const r=await sb.from('merch_orders').select('id,order_number,customer_name,customer_phone,customer_email,delivery_method,delivery_store,delivery_address,recipient_name,recipient_phone,customer_note,product_total,total_amount,status,payment_status,shipment_status,created_at').order('created_at',{ascending:false}).limit(200);if(r.error)return show('orderMsg','訂單讀取失敗：'+r.error.message,'err');orders=r.data||[];renderOrders();renderCustomers()}
function renderOrders(){$('orderList').innerHTML=orders.map(o=>'<div class="item"><div class="topline"><h3>'+esc(o.order_number)+'</h3><span class="badge">'+esc(o.status||'')+'</span></div><div class="order-grid"><div>客戶：'+esc(o.customer_name||'未提供')+'</div><div>電話：'+esc(o.customer_phone||'未提供')+'</div><div>商品金額：$'+Number(o.product_total||0).toLocaleString()+'</div><div>應付總額：$'+Number(o.total_amount||0).toLocaleString()+'</div><div>付款：'+esc(o.payment_status||'')+'</div><div>出貨：'+esc(o.shipment_status||'')+'</div><div>配送：'+esc(o.delivery_method||'')+'</div><div>門市／地址：'+esc(o.delivery_store||o.delivery_address||'')+'</div></div><div class="muted" style="margin-top:8px">Email：'+esc(o.customer_email||'')+'　備註：'+esc(o.customer_note||'無')+'</div></div>').join('')||'<div class="muted">目前沒有商品訂單。</div>'}
function renderCustomers(){const q=($('customerSearch').value||'').trim().toLowerCase(),m=new Map();orders.forEach(o=>{const key=(o.customer_phone||o.customer_email||o.customer_name||String(o.id)).trim().toLowerCase();if(!m.has(key))m.set(key,{name:o.customer_name,phone:o.customer_phone,email:o.customer_email,method:o.delivery_method,store:o.delivery_store,address:o.delivery_address,recipient:o.recipient_name,recipientPhone:o.recipient_phone,note:o.customer_note,count:1,total:Number(o.total_amount||0),last:o.created_at});else{const x=m.get(key);x.count++;x.total+=Number(o.total_amount||0);if(new Date(o.created_at)>new Date(x.last))Object.assign(x,{name:o.customer_name,phone:o.customer_phone,email:o.customer_email,method:o.delivery_method,store:o.delivery_store,address:o.delivery_address,recipient:o.recipient_name,recipientPhone:o.recipient_phone,note:o.customer_note,last:o.created_at})}});const a=[...m.values()].filter(x=>!q||`${x.name||''} ${x.phone||''} ${x.email||''}`.toLowerCase().includes(q));$('customerList').innerHTML=a.map(x=>'<div class="item"><h3>👤 '+esc(x.name||'未提供姓名')+'</h3><div class="customer-grid"><div>電話：'+esc(x.phone||'未提供')+'</div><div>Email：'+esc(x.email||'未提供')+'</div><div>配送：'+esc(x.method||'未提供')+'</div><div>門市／地址：'+esc(x.store||x.address||'未提供')+'</div><div>訂單數：'+x.count+' 筆</div><div>累計金額：$'+x.total.toLocaleString()+'</div></div><div class="muted" style="margin-top:8px">收件人：'+esc(x.recipient||x.name||'未提供')+'　'+esc(x.recipientPhone||x.phone||'未提供')+'　備註：'+esc(x.note||'無')+'</div></div>').join('')||'<div class="muted">目前沒有客戶個資。</div>'}
async function loadAll(){await loadCategories();await loadProducts();await loadOrders()}
function reset(){editingId=null;$('editCard').classList.add('hidden');$('editTitle').textContent='新增商品';['pName','pPrice','pStock','pDescription','pImage'].forEach(id=>$(id).value='');$('pCategory').value='';$('pEnabled').checked=true;$('pFile').value='';$('preview').style.display='none';$('editMsg').innerHTML='';setSizes([]);sizeVisible()}
function editProduct(id){const p=products.find(x=>x.id===id);if(!p)return;editingId=id;$('editTitle').textContent='編輯商品';$('pName').value=p.name||'';$('pCategory').value=p.category_id||'';$('pPrice').value=p.price||0;$('pStock').value=p.stock_quantity||0;$('pDescription').value=p.description||'';$('pImage').value=p.image_url||'';$('pEnabled').checked=!!p.enabled;setSizes(p.size_options);sizeVisible();$('editCard').classList.remove('hidden');window.scrollTo({top:$('editCard').offsetTop-10,behavior:'smooth'})}
async function upload(file){const ext=(file.name.split('.').pop()||'jpg').toLowerCase(),path='products/'+Date.now()+'-'+Math.random().toString(36).slice(2)+'.'+ext,r=await sb.storage.from('merch-images').upload(path,file,{upsert:false,contentType:file.type});if(r.error)throw r.error;return sb.storage.from('merch-images').getPublicUrl(path).data.publicUrl}
async function save(){if(busy)return;const name=$('pName').value.trim();if(!name)return show('editMsg','請填寫商品名稱。','err');busy=true;$('saveBtn').disabled=true;try{let image=$('pImage').value.trim()||null;if($('pFile').files[0])image=await upload($('pFile').files[0]);const payload={category_id:$('pCategory').value?Number($('pCategory').value):null,name,description:$('pDescription').value.trim()||null,price:Number($('pPrice').value||0),stock_quantity:Number($('pStock').value||0),image_url:image,enabled:$('pEnabled').checked,size_options:clothing()?selected():[],updated_at:new Date().toISOString()};const r=editingId?await sb.from('merch_products').update(payload).eq('id',editingId):await sb.from('merch_products').insert(payload);if(r.error)throw r.error;show('productMsg',editingId?'商品已更新。':'商品已新增。');reset();await loadProducts()}catch(e){show('editMsg','儲存失敗：'+(e.message||e),'err')}finally{busy=false;$('saveBtn').disabled=false}}
window.editProduct=editProduct;window.toggleProduct=async(id,en)=>{const r=await sb.from('merch_products').update({enabled:en,updated_at:new Date().toISOString()}).eq('id',id);if(r.error)return show('productMsg','更新失敗：'+r.error.message,'err');await loadProducts()};window.toggleCat=async(id,en)=>{const r=await sb.from('merch_categories').update({enabled:en}).eq('id',id);if(r.error)return show('catMsg','更新失敗：'+r.error.message,'err');await loadCategories();await loadProducts()};
$('loginForm').onsubmit=async e=>{e.preventDefault();if(busy)return;busy=true;$('loginBtn').disabled=true;try{const r=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error)throw r.error;const er=await access(r.data.user);if(er)throw new Error(er);await openApp()}catch(e){show('loginMsg','登入失敗：'+(e.message||e),'err')}finally{busy=false;$('loginBtn').disabled=false}};
$('newBtn').onclick=()=>{$('editCard').classList.remove('hidden');editingId=null;$('editTitle').textContent='新增商品';setSizes([]);sizeVisible();window.scrollTo({top:$('editCard').offsetTop-10,behavior:'smooth'})};$('saveBtn').onclick=save;$('cancelBtn').onclick=reset;$('refresh').onclick=loadAll;$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};$('customerSearch').oninput=renderCustomers;$('pCategory').onchange=sizeVisible;$('addCat').onclick=async()=>{const name=$('catName').value.trim();if(!name)return show('catMsg','請填寫分類名稱。','err');const r=await sb.from('merch_categories').insert({name,enabled:true});if(r.error)return show('catMsg','新增分類失敗：'+r.error.message,'err');$('catName').value='';show('catMsg','分類已新增。');await loadCategories()};$('pFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f);$('preview').src=u;$('preview').style.display='block'};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');['products','categories','orders','customers'].forEach(t=>$(t+'Tab').classList.add('hidden'));$(b.dataset.tab+'Tab').classList.remove('hidden');if(b.dataset.tab==='customers')renderCustomers()});
async function init(){sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const s=await sb.auth.getSession();if(s.data.session){const er=await access(s.data.session.user);if(!er)await openApp()}}init();})();
</script>
</body>
</html>
