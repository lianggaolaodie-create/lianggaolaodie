<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>周邊商品｜付款資料</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f8f3eb;color:#3d2a20;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}.wrap{max-width:520px;margin:0 auto;padding:28px 16px 60px}.card{background:#fffaf4;border-radius:22px;padding:22px;box-shadow:0 8px 28px #3d2a2015;margin-bottom:14px}.order{background:#edf7f1;border:1px solid #cfe6d9}.order b{font-size:28px;display:block;word-break:break-all}.notice{background:#f6eee5;line-height:1.8}.field{margin-top:15px}.field label{display:block;font-weight:800;margin-bottom:7px}.input{width:100%;padding:13px;border:1px solid #d9c9b9;border-radius:11px;background:#fff;font-size:16px}.textarea{width:100%;min-height:90px;padding:13px;border:1px solid #d9c9b9;border-radius:11px;background:#fff;font-size:16px;resize:vertical}.upload{border:1px dashed #cdbba8;padding:16px;border-radius:14px;background:#fff}.btn{width:100%;border:0;border-radius:12px;padding:14px;background:#3d2a20;color:#fff;font-weight:900;font-size:16px;margin-top:18px}.error{color:#a52e25;margin-top:10px}.success{text-align:center;font-weight:800}.small{font-size:13px;color:#765f51}.hidden{display:none!important}</style></head><body><main class="wrap"><div class="card"><h1>付款資料</h1><div class="small">周邊商品訂單</div></div><div class="card order"><div>訂單編號</div><b id="orderNo">載入中…</b><div style="margin-top:8px">應付總額：<strong id="amount">$0</strong></div></div><div class="card notice">請依官方 LINE 提供的匯款資料付款。<br>官方 LINE：@502iugah</div><form id="form" class="card"><div class="field"><label>訂單偏好／備註（可選）</label><textarea id="preference" class="textarea" placeholder="例如：尺寸、顏色、款式或其他需求"></textarea></div><div class="field"><label>匯款末五碼（5位數字）</label><input id="last5" class="input" inputmode="numeric" maxlength="5" pattern="[0-9]{5}" placeholder="例如 12345" required></div><div class="field"><label>付款截圖（可選）</label><div class="upload"><input id="proof" type="file" accept="image/*"></div></div><div class="notice" style="margin-top:15px">訂單送出後不代表已成立；管理員確認付款後，訂單才正式成立。</div><button class="btn">送出付款資料</button><div id="error" class="error"></div></form><div id="done" class="card success hidden">付款資料已送出。<br>管理員確認付款後會更新訂單狀態。</div></main><script>const URL='https://yemzdwxtyosuaczsqwea.supabase.co',KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',db=supabase.createClient(URL,KEY);const p=new URLSearchParams(location.search),orderId=p.get('id'),orderNo=p.get('order'),amount=p.get('amount');document.getElementById('orderNo').textContent=orderNo||'—';document.getElementById('amount').textContent='$'+Number(amount||0).toLocaleString();document.getElementById('form').onsubmit=async e=>{e.preventDefault();const err=document.getElementById('error');err.textContent='';const last5=document.getElementById('last5').value.trim(),preference=document.getElementById('preference').value.trim()||null;if(!/^\d{5}$/.test(last5)){err.textContent='請輸入5位數字的匯款末五碼';return}if(!orderId){err.textContent='找不到訂單，請從訂單頁重新進入付款資料頁。';return}let proofPath=null;const f=document.getElementById('proof').files[0];try{if(f){const ext=(f.name.split('.').pop()||'jpg').toLowerCase();proofPath=`${orderId}/${Date.now()}-${crypto.randomUUID()}.${ext}`;const up=await db.storage.from('transfer-proofs').upload(proofPath,f,{contentType:f.type,upsert:false});if(up.error)throw up.error}const upOrder=await db.from('merch_orders').update({customer_note:preference,remittance_last5:last5,payment_proof_url:proofPath,payment_status:'proof_submitted',updated_at:new Date().toISOString()}).eq('id',orderId);if(upOrder.error)throw upOrder.error;document.getElementById('form').classList.add('hidden');document.getElementById('done').classList.remove('hidden')}catch(e){err.textContent='送出失敗：'+(e.message||'請稍後再試')}};</script></body></html>
