<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>周邊商品｜老爹・涼糕</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      background: #f8f3eb;
      color: #3d2a20;
    }

    header {
      background: #ffffff;
      padding: 22px 20px;
      border-bottom: 1px solid #e8ded2;
    }

    .brand {
      font-size: 24px;
      font-weight: 800;
    }

    nav {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
    }

    nav a {
      color: #3d2a20;
      text-decoration: none;
      font-weight: 600;
    }

    .hero {
      padding: 55px 24px 35px;
      text-align: center;
    }

    .hero small {
      letter-spacing: 5px;
      color: #a66f4d;
    }

    .hero h1 {
      font-size: 38px;
      margin: 15px 0;
    }

    .hero p {
      line-height: 1.8;
      color: #71594b;
    }

    .products {
      max-width: 1000px;
      margin: auto;
      padding: 20px 20px 70px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.06);
    }

    .photo {
      height: 230px;
      border-radius: 14px;
      background: #eee5db;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9b8879;
      font-size: 18px;
    }

    .card h2 {
      font-size: 22px;
      margin-bottom: 8px;
    }

    .card p {
      color: #786456;
      line-height: 1.7;
    }

    .coming {
      display: inline-block;
      margin-top: 8px;
      padding: 7px 12px;
      background: #3d2a20;
      color: white;
      border-radius: 20px;
      font-size: 14px;
    }

    .back {
      text-align: center;
      padding-bottom: 70px;
    }

    .back a {
      display: inline-block;
      padding: 14px 25px;
      border-radius: 30px;
      background: #3d2a20;
      color: white;
      text-decoration: none;
      font-weight: 700;
    }

    footer {
      text-align: center;
      padding: 30px 20px;
      background: #33241c;
      color: white;
    }

    @media (max-width: 750px) {
      .products {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 32px;
      }

      .photo {
        height: 260px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="brand">老爹・涼糕</div>

  <nav>
    <a href="index.html">首頁</a>
    <a href="index.html#products">產品中心</a>
    <a href="merch.html">周邊商品</a>
    <a href="index.html#about">關於老爹</a>
    <a href="index.html#contact">聯絡我們</a>
  </nav>
</header>

<section class="hero">
  <small>OFFICIAL MERCHANDISE</small>
  <h1>老爹・涼糕 周邊商品</h1>
  <p>
    老爹・涼糕品牌限定周邊<br>
    將我們的故事與涼糕餐車，一起帶進你的日常。
  </p>
</section>

<section class="products">

  <article class="card">
    <div class="photo">商品照片準備中</div>
    <h2>品牌服飾</h2>
    <p>老爹・涼糕官方品牌服飾。</p>
    <span class="coming">COMING SOON</span>
  </article>

  <article class="card">
    <div class="photo">商品照片準備中</div>
    <h2>品牌鑰匙圈</h2>
    <p>把老爹・涼糕隨身帶著走。</p>
    <span class="coming">COMING SOON</span>
  </article>

  <article class="card">
    <div class="photo">商品照片準備中</div>
    <h2>品牌帽子</h2>
    <p>老爹・涼糕官方限定帽款。</p>
    <span class="coming">COMING SOON</span>
  </article>

</section>

<div class="back">
  <a href="index.html">← 返回官方網站首頁</a>
</div>

<footer>
  老爹・涼糕｜官方周邊商品
</footer>

</body>
</html>
