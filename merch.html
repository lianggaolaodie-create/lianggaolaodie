<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://yemzdwxtyosuaczsqwea.supabase.co';
const SUPABASE_KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
let products=[],categories=[],active='all';
async function init(){
 const [p,c]=await Promise.all([
  sb.from('merch_products').select('id,category_id,name,description,price,image_url,enabled,size_options,product_code,is_new,is_hot').eq('enabled',true).order('created_at',{ascending:false}),
  sb.from('merch_categories').select('id,name,enabled').eq('enabled',true).order('id')
 ]);
 if(p.error||c.error){$('status').className='empty';$('status').textContent='目前無法讀取周邊商品，請稍後再試。';return}
 products=p.data||[];categories=c.data||[];renderFilters();renderProducts();
}
function renderFilters(){
 const cats=categories.filter(c=>products.some(p=>p.category_id===c.id));
 $('filters').innerHTML='<button class="filter '+(active==='all'?'active':'')+'" onclick="setFilter(\'all\')">全部</button>'+cats.map(c=>'<button class="filter '+(active===String(c.id)?'active':'')+'" onclick="setFilter(\''+c.id+'\')">'+esc(c.name)+'</button>').join('');
}
function setFilter(v){active=String(v);renderFilters();renderProducts()}
function renderProducts(){
 const catMap=Object.fromEntries(categories.map(c=>[c.id,c.name]));
 const list=products.filter(p=>active==='all'||String(p.category_id)===active);
 $('status').style.display=list.length?'none':'block';$('status').className='empty';if(!list.length){$('status').textContent='目前沒有上架中的周邊商品。';$('productGrid').innerHTML='';return}
 $('productGrid').innerHTML=list.map(p=>{
  const tags=[];if(p.is_new)tags.push('<span class="tag">🆕 新品</span>');if(p.is_hot)tags.push('<span class="tag">🔥 熱賣</span>');
  const size=p.size_options?'<div class="meta">規格：'+esc(p.size_options)+'</div>':'';
  return '<article class="card"><div class="photo">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'" loading="lazy">':'商品照片準備中')+'</div><h3>'+esc(p.name)+'</h3><div class="meta">'+esc(catMap[p.category_id]||'其他週邊')+(p.product_code?'　｜　商品編號：'+esc(p.product_code):'')+'</div><p>'+esc(p.description||'')+'</p>'+size+'<div class="price">NT$ '+Number(p.price||0).toLocaleString()+'</div>'+tags.join('')+'</article>'
 }).join('');
}
init();
</script>
