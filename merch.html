<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕周邊商品｜官方品牌周邊</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#f8f3eb;color:#3d2a20;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;padding-bottom:90px}.top{position:sticky;top:0;z-index:20;margin:10px auto;max-width:1180px;background:#fff;border:1px solid #eadfd3;border-radius:22px;padding:10px 18px;display:flex;align-items:center;gap:18px;box-shadow:0 8px 25px #3d2a2012}.logo{width:64px;height:64px;object-fit:contain}.nav{display:flex;gap:18px;flex-wrap:wrap}.nav a{color:#4a3428;text-decoration:none;font-weight:800;font-size:14px}.hero{text-align:center;padding:55px 20px 35px}.hero h1{font-size:clamp(34px,6vw,58px);margin:12px 0}.hero p{color:#765f51;line-height:1.8}.wrap{max-width:1100px;margin:auto;padding:0 18px}.intro,.card,.notice{background:#fff;border-radius:24px;box-shadow:0 8px 28px #3d2a2010}.intro{padding:25px;text-align:center;margin-bottom:22px}.filters{display:flex;gap:10px;overflow-x:auto;margin-bottom:20px}.filter{white-space:nowrap;border:1px solid #dfd1c4;background:#fff;border-radius:99px;padding:10px 17px;font-weight:800;color:#5e4638}.filter.active{background:#3d2a20;color:#fff}.status{text-align:center;color:#806b5c;margin:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.card{padding:14px}.photo{height:245px;border-radius:18px;background:#f2e9df;display:flex;align-items:center;justify-content:center;text-align:center;color:#9a8170;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover}.card h3{font-size:23px;margin:17px 8px 8px}.card p{margin:0 8px 14px;color:#765f51;line-height:1.7;min-height:45px}.tag{display:inline-block;margin:0 8px 8px;padding:6px 11px;border-radius:99px;background:#f1e5da;color:#79523b;font-size:12px;font-weight:800}.price{font-size:21px;font-weight:900;margin:8px}.stock{font-size:13px;color:#806b5c;margin:0 8px 8px}.buy{width:calc(100% - 16px);margin:10px 8px 4px;border:0;border-radius:12px;padding:13px;background:#3d2a20;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.buy:disabled{background:#ddd;color:#888}.notice{margin-top:24px;background:#3d2a20;color:#fff;padding:26px;text-align:center}.modal{display:none;position:fixed;inset:0;background:#2b1d1699;z-index:100;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.box{background:#fffaf4;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:22px;padding:22px}.head{display:flex;justify-content:space-between;align-items:center}.head h2{margin:0}.close{border:0;background:none;font-size:30px;cursor:pointer}.field{margin-top:13px}.field label{display:block;font-weight:800;margin-bottom:6px}.input,.select,.textarea{width:100%;border:1px solid #d9c9b9;border-radius:11px;padding:12px;background:#fff;font-size:15px;color:#33251d}.textarea{min-height:80px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary{background:#f6eee5;border-radius:14px;padding:14px;margin-top:15px;line-height:1.8}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:17px}.btn{border:0;border-radius:11px;padding:12px 18px;background:#3d2a20;color:#fff;font-weight:900}.btn.light{background:#fff;color:#3d2a20;border:1px solid #d9c9b9}.error{color:#a52e25;margin-top:8px;font-size:13px}.hidden{display:none!important}.bottom{position:fixed;bottom:10px;left:10px;right:10px;z-index:30;max-width:600px;margin:auto;background:#fffffff5;border:1px solid #e8ddd2;border-radius:20px;box-shadow:0 8px 30px #0002;display:grid;grid-template-columns:repeat(5,1fr);padding:8px}.bottom a{text-decoration:none;color:#60483a;text-align:center;font-size:11px;font-weight:800}.bottom span{display:block;font-size:20px;margin-bottom:2px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.nav a:nth-child(n+5){display:none}}@media(max-width:560px){.grid{grid-template-columns:1fr}.photo{height:240px}.two{grid-template-columns:1fr}.hero{padding:42px 15px 28px}.top{margin:8px 10px}.nav{gap:10px}.nav a{font-size:12px}}</style></head><body><header class="top"><img class="logo" src="IMG_3238.png" alt="老爹涼糕"><nav class="nav"><a href="index.html">首頁</a><a href="rules.html">購買涼糕規則</a><a href="products.html">涼糕專區</a><a href="merch.html">周邊商品</a><a href="schedule.html">出攤時間</a><a href="contact.html">聯絡我們</a></nav></header><section class="hero"><div>LAODIE · MERCH</div><h1>老爹・涼糕<br>周邊商品</h1><p>官方周邊商品，商品資訊由管理後台即時同步。</p></section><main class="wrap"><section class="intro"><h2>老爹・涼糕 官方周邊</h2><p>選擇商品後即可直接填寫資料與配送方式下單。</p></section><div id="filters" class="filters"></div><div id="status" class="status">商品資料載入中…</div><section id="grid" class="grid"></section><section class="notice"><h2>新品陸續推出</h2><p>周邊商品上架、下架及商品資訊會與管理後台同步。</p></section></main><nav class="bottom"><a href="index.html"><span>⌂</span>首頁</a><a href="products.html"><span>🍡</span>產品介紹</a><a href="schedule.html"><span>📍</span>出攤資訊</a><a href="rules.html"><span>🛒</span>訂購方式</a><a href="contact.html"><span>💬</span>聯絡我們</a></nav><div id="modal" class="modal"><div class="box"><div class="head"><h2>🛒 周邊商品下單</h2><button class="close" onclick="closeOrder()">×</button></div><div id="selectedBox" class="summary"></div><form id="orderForm"><div class="two"><div class="field"><label>姓名 *</label><input id="name" class="input" required></div><div class="field"><label>手機／電話 *</label><input id="phone" class="input" required></div></div><div class="field"><label>Email</label><input id="email" class="input" type="email"></div><div class="field"><label>配送方式 *</label><select id="delivery" class="select" required><option value="">請選擇</option><option value="宅配">宅配</option><option value="全家">全家取貨</option><option value="7-11">7-11取貨</option><option value="自取">門市／現場自取</option></select></div><div id="addressField" class="field hidden"><label>配送地址 *</label><input id="address" class="input"></div><div id="storeField" class="field hidden"><label>取貨門市 *</label><input id="store" class="input" placeholder="請填門市名稱"></div><div class="field"><label>訂單備註</label><textarea id="note" class="textarea" placeholder="尺寸、顏色或其他需求請備註"></textarea></div><div id="total" class="summary"></div><div class="actions"><button type="button" class="btn light" onclick="closeOrder()">取消</button><button class="btn">送出訂單</button></div><div id="error" class="error"></div></form></div></div><script>
const URL='https://yemzdwxtyosuaczsqwea.supabase.co',KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',db=window.supabase.createClient(URL,KEY);let products=[],cats=[],selectedProduct=null,qty=1,category='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){const [c,p]=await Promise.all([db.from('merch_categories').select('id,name,enabled').eq('enabled',true).order('id'),db.from('merch_products').select('*').eq('enabled',true).order('id',{ascending:false})]);if(c.error||p.error){status.textContent='商品資料載入失敗';return}cats=c.data||[];products=p.data||[];renderFilters();render()}
function renderFilters(){filters.innerHTML='<button class="filter active" data-c="">全部商品</button>'+cats.map(c=>`<button class="filter" data-c="${c.id}">${esc(c.name)}</button>`).join('');filters.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{category=b.dataset.c;filters.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()})}
function render(){const list=products.filter(p=>!category||String(p.category_id)===String(category));status.textContent=`目前共有 ${list.length} 項上架周邊商品`;grid.innerHTML=list.length?list.map(p=>{const c=cats.find(x=>x.id===p.category_id),s=Number(p.stock_quantity||0);return `<article class="card"><div class="photo">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}">`:'商品照片準備中'}</div><h3>${esc(p.name)}</h3>${c?`<span class="tag">${esc(c.name)}</span>`:''}<p>${esc(p.description||'')}</p><div class="price">NT$ ${Number(p.price||0).toLocaleString()}</div><div class="stock">${s>0?'庫存 '+s+' 件':'目前缺貨'}</div><button class="buy" ${s<1?'disabled':''} onclick="openOrder(${p.id})">${s>0?'立即下單':'暫時缺貨'}</button></article>`}).join(''):'<div class="intro">目前沒有上架的周邊商品。</div>'}
function openOrder(id){selectedProduct=products.find(p=>p.id===id);qty=1;if(!selectedProduct)return;document.getElementById('selectedBox').innerHTML=`<b>${esc(selectedProduct.name)}</b><br>單價 NT$ ${Number(selectedProduct.price).toLocaleString()}　數量 <select id="qty" class="select" style="width:110px;display:inline-block" onchange="qty=Math.max(1,Math.min(Number(this.value),${Number(selectedProduct.stock_quantity)}));updateTotal()">${Array.from({length:Math.min(Number(selectedProduct.stock_quantity),20)},(_,i)=>`<option>${i+1}</option>`).join('')}</select>`;document.getElementById('modal').classList.add('show');document.getElementById('orderForm').reset();delivery.value='';updateDelivery();updateTotal();error.textContent=''}
function updateTotal(){if(!selectedProduct)return;total.innerHTML=`商品：${esc(selectedProduct.name)}<br>數量：${qty}<br><b>訂單金額：NT$ ${(Number(selectedProduct.price)*qty).toLocaleString()}</b>`}
function updateDelivery(){const d=delivery.value;addressField.classList.toggle('hidden',d!=='宅配');storeField.classList.toggle('hidden',!(d==='全家'||d==='7-11'));address.required=d==='宅配';store.required=d==='全家'||d==='7-11'}delivery.onchange=updateDelivery;function closeOrder(){modal.classList.remove('show')}
orderForm.onsubmit=async e=>{e.preventDefault();error.textContent='';if(!selectedProduct)return;const amount=Number(selectedProduct.price)*qty;const orderNo='M'+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*900+100);const payload={order_number:orderNo,customer_name:name.value.trim(),customer_phone:phone.value.trim(),customer_email:email.value.trim()||null,customer_note:note.value.trim()||null,product_total:amount,total_amount:amount,status:'pending',payment_status:'unpaid',shipment_status:'unprepared',delivery_method:delivery.value,delivery_address:delivery.value==='宅配'?address.value.trim():null,delivery_store:(delivery.value==='全家'||delivery.value==='7-11')?store.value.trim():null,recipient_name:name.value.trim(),recipient_phone:phone.value.trim()};try{const o=await db.from('merch_orders').insert(payload).select('id,order_number').single();if(o.error)throw o.error;const it=await db.from('merch_order_items').insert({order_id:o.data.id,product_id:selectedProduct.id,product_name:selectedProduct.name,unit_price:selectedProduct.price,quantity:qty,subtotal:amount});if(it.error)throw it.error;alert(`下單成功！\n訂單編號：${o.data.order_number}\n\n訂單已送至周邊商品管理後台。`);closeOrder()}catch(err){error.textContent='訂單送出失敗：'+(err.message||'請稍後再試')}};load();
</script></body></html>
