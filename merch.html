<body>

<section class="hero"><div class="eyebrow">LAODIE · MERCH</div><h1>老爹・涼糕<br>周邊商品</h1><p>把喜歡的老爹・涼糕帶進日常。<br>官方周邊商品由後台直接同步到本頁。</p></section>
<main class="wrap"><section class="intro"><h2>老爹・涼糕 官方周邊</h2><p>商品名稱、照片、介紹、價格、分類、新品與熱賣標籤，會依週邊商品後台的上架設定自動更新。</p></section><div id="filters" class="filters"></div><div id="status" class="loading">正在讀取最新周邊商品……</div><section id="productGrid" class="grid"></section><section class="notice"><h2>新品陸續推出</h2><p>週邊商品上架後，官網會自動顯示最新資料。</p></section></main>
<nav class="bottom"><a href="index.html"><span>⌂</span>首頁</a><a href="products.html"><span>🍡</span>產品介紹</a><a href="schedule.html"><span>📍</span>出攤資訊</a><a href="online-order.html"><span>🛒</span>訂購方式</a><a href="contact.html"><span>💬</span>聯絡我們</a></nav>
<div id="orderModal" class="modal"><div class="box"><button class="close" onclick="closeOrder()">關閉</button><h2>🛒 購買周邊商品</h2><div id="buyProduct" class="buy-product"></div><form id="orderForm"><div class="field"><label>訂購數量</label><input id="qty" type="number" min="1" value="1" required></div><div id="optionArea"></div><div class="field"><label>客人姓名</label><input id="customerName" required></div><div class="field"><label>電話</label><input id="customerPhone" type="tel" required></div><div class="field"><label>收件方式</label><select id="deliveryMethod" required><option value="">請選擇</option><option value="超商取貨">超商取貨</option><option value="宅配">宅配</option></select></div><div class="field"><label>收件地址／超商資訊</label><input id="deliveryInfo" required placeholder="宅配填地址；超商填店名與店號"></div><div class="field"><label>備註</label><textarea id="note"></textarea></div><button class="submit" type="submit">送出訂單</button><div id="orderMsg" class="msg"></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://yemzdwxtyosuaczsqwea.supabase.co';
const SUPABASE_KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));let products=[],categories=[],active='all',selected=null;
async function init(){const [p,c]=await Promise.all([sb.from('merch_products').select('id,category_id,name,description,price,image_url,enabled,size_options,product_code,is_new,is_hot').eq('enabled',true).order('created_at',{ascending:false}),sb.from('merch_categories').select('id,name,enabled').eq('enabled',true).order('id')]);if(p.error||c.error){$('status').className='empty';$('status').textContent='目前無法讀取周邊商品，請稍後再試。';return}products=p.data||[];categories=c.data||[];renderFilters();renderProducts()}
function renderFilters(){const cats=categories.filter(c=>products.some(p=>p.category_id===c.id));$('filters').innerHTML='<button class="filter '+(active==='all'?'active':'')+'" onclick="setFilter(\'all\')">全部</button>'+cats.map(c=>'<button class="filter '+(active===String(c.id)?'active':'')+'" onclick="setFilter(\''+c.id+'\')">'+esc(c.name)+'</button>').join('')}
function setFilter(v){active=String(v);renderFilters();renderProducts()}
function renderProducts(){const catMap=Object.fromEntries(categories.map(c=>[c.id,c.name]));const list=products.filter(p=>active==='all'||String(p.category_id)===active);$('status').style.display=list.length?'none':'block';if(!list.length){$('status').textContent='目前沒有上架中的周邊商品。';$('productGrid').innerHTML='';return}$('productGrid').innerHTML=list.map(p=>{let tags='';if(p.is_new)tags+='<span class="tag">🆕 新品</span>';if(p.is_hot)tags+='<span class="tag">🔥 熱賣</span>';return '<article class="card"><div class="photo">'+(p.image_url?'<img src="'+esc(p.image_url)+'" alt="'+esc(p.name)+'" loading="lazy">':'商品照片準備中')+'</div><h3>'+esc(p.name)+'</h3><div class="meta">'+esc(catMap[p.category_id]||'其他週邊')+(p.product_code?'　｜　商品編號：'+esc(p.product_code):'')+'</div><p>'+esc(p.description||'')+'</p>'+(p.size_options?'<div class="meta">規格：'+esc(Array.isArray(p.size_options)?p.size_options.join('、'):p.size_options)+'</div>':'')+'<div class="price">NT$ '+Number(p.price||0).toLocaleString()+'</div>'+tags+'<button class="buy" onclick="openOrder(\''+p.id+'\')">立即購買</button></article>'}).join('')}
function parseOptions(value){
  const raw=Array.isArray(value)?value.map(x=>String(x||'').trim()).filter(Boolean):String(value||'').split(/[、,，\/]+/).map(x=>x.trim()).filter(Boolean);
  const sizes=[];const colors=[];const generic=[];const sizeSet=new Set(['S','M','L','XL','2XL','3XL','4XL','5XL']);
  let mode='generic';
  raw.forEach(item=>{
    if(item.startsWith('尺寸：')){mode='size';item=item.slice(3).trim();}
    if(item.startsWith('顏色：')){mode='color';item=item.slice(3).trim();}
    const parts=item.split(/[、|]+/).map(x=>x.trim()).filter(Boolean);
    parts.forEach(x=>{if(sizeSet.has(x))sizes.push(x);else if(mode==='color'||['黑色','白色','米白','灰色','藍色','紅色','綠色','咖啡色'].includes(x))colors.push(x);else if(x)generic.push(x)});
  });
  return {sizes:[...new Set(sizes)],colors:[...new Set(colors)],generic:[...new Set(generic)]};
}
function openOrder(id){
  selected=products.find(p=>String(p.id)===String(id));if(!selected)return;
  $('buyProduct').innerHTML='<strong>'+esc(selected.name)+'</strong><div>單價 NT$ '+Number(selected.price||0).toLocaleString()+'</div>';
  const o=parseOptions(selected.size_options);
  let html='';
  if(o.sizes.length){html+='<div class="field"><label class="optionTitle">① 尺寸／規格</label><select id="sizeChoice" class="optionSelect" required><option value="">請先選擇尺寸</option>'+o.sizes.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select></div>';}
  if(o.colors.length){html+='<div class="field"><label class="optionTitle">② 顏色</label><select id="colorChoice" class="optionSelect" required><option value="">請再選擇顏色</option>'+o.colors.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select></div>';}
  if(!o.sizes.length&&!o.colors.length&&o.generic.length){html+='<div class="field"><label class="optionTitle">規格</label><select id="genericChoice" class="optionSelect" required><option value="">請選擇</option>'+o.generic.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('')+'</select></div>';}
  $('optionArea').innerHTML=html;$('orderMsg').textContent='';$('orderModal').classList.add('show');
}
function closeOrder(){$('orderModal').classList.remove('show');selected=null}
$('deliveryMethod').addEventListener('change',()=>{$('deliveryInfo').placeholder=$('deliveryMethod').value==='宅配'?'請輸入完整收件地址':'請輸入超商名稱與店號'})
$('orderForm').addEventListener('submit',async e=>{e.preventDefault();if(!selected)return;const qty=Math.max(1,Number($('qty').value||1));const total=Number(selected.price||0)*qty;const orderNumber='M'+new Date().toISOString().replace(/[-:TZ.]/g,'').slice(0,14)+Math.floor(100+Math.random()*900);let detail=selected.name;const sc=document.getElementById('sizeChoice');const cc=document.getElementById('colorChoice');const gc=document.getElementById('genericChoice');if(sc&&sc.value)detail+='｜尺寸：'+sc.value;if(cc&&cc.value)detail+='｜顏色：'+cc.value;if(gc&&gc.value)detail+='｜規格：'+gc.value;const dm=$('deliveryMethod').value;const info=$('deliveryInfo').value.trim();const payload={order_number:orderNumber,customer_name:$('customerName').value.trim(),customer_phone:$('customerPhone').value.trim(),customer_note:$('note').value.trim()||null,product_total:total,total_amount:total,status:'pending',payment_status:'unpaid',shipment_status:'unprepared',delivery_method:dm,delivery_address:dm==='宅配'?info:null,delivery_store:dm==='超商取貨'?info:null};$('orderMsg').textContent='訂單送出中……';const o=await sb.from('merch_orders').insert(payload).select('id').single();if(o.error){$('orderMsg').textContent='訂單送出失敗：'+o.error.message;return}const item=await sb.from('merch_order_items').insert({order_id:o.data.id,product_id:selected.id,product_name:detail,unit_price:Number(selected.price||0),quantity:qty,subtotal:total});if(item.error){$('orderMsg').textContent='訂單已建立，但商品明細寫入失敗，請聯絡我們。';return}$('orderMsg').textContent='訂單已送出！訂單編號：'+orderNumber+'。付款與後續確認請依官方通知方式處理。';e.target.reset();$('qty').value=1});
init();
</script>
