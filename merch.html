-weight:900;margin:8px}.stock{font-size:13px;color:#806b5c;margin:0 8px 8px}.buy{width:calc(100% - 16px);margin:10px 8px 4px;border:0;border-radius:12px;padding:13px;background:#3d2a20;color:#fff;font-weight:900;font-size:15px;cursor:pointer}.buy:disabled{background:#ddd;color:#888}.notice{margin-top:24px;background:#3d2a20;color:#fff;padding:26px;text-align:center}.modal{display:none;position:fixed;inset:0;background:#2b1d1699;z-index:100;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.box{background:#fffaf4;width:min(620px,100%);max-height:92vh;overflow:auto;border-radius:22px;padding:22px}.head{display:flex;justify-content:space-between;align-items:center}.head h2{margin:0}.close{border:0;background:none;font-size:30px;cursor:pointer}.field{margin-top:13px}.field label{display:block;font-weight:800;margin-bottom:6px}.input,.select,.textarea{width:100%;border:1px solid #d9c9b9;border-radius:11px;padding:12px;background:#fff;font-size:15px;color:#33251d}.textarea{min-height:80px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.summary{background:#f6eee5;border-radius:14px;padding:14px;margin-top:15px;line-height:1.8}.actions{display:flex;gap:9px;justify-content:flex-end;margin-top:17px}.btn{border:0;border-radius:11px;padding:12px 18px;background:#3d2a20;color:#fff;font-weight:900}.btn.light{background:#fff;color:#3d2a20;border:1px solid #d9c9b9}.error{color:#a52e25;margin-top:8px;font-size:13px}.hidden{display:none!important}.bottom{position:fixed;bottom:10px;left:10px;right:10px;z-index:30;max-width:600px;margin:auto;background:#fffffff5;border:1px solid #e8ddd2;border-radius:20px;box-shadow:0 8px 30px #0002;display:grid;grid-template-columns:repeat(5,1fr);padding:8px}.bottom a{text-decoration:none;color:#60483a;text-align:center;font-size:11px;font-weight:800}.bottom span{display:block;font-size:20px;margin-bottom:2px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.nav a:nth-child(n+5){display:none}}@media(max-width:560px){.grid{grid-template-columns:1fr}.photo{height:240px}.two{grid-template-columns:1fr}.hero{padding:42px 15px 28px}.top{margin:8px 10px}.nav{gap:10px}.nav a{font-size:12px}}</style><script src="maintenance-gate.js"></script></head><body><header class="top"><img class="logo" src="IMG_3238.png" alt="老爹涼糕"><nav class="nav"><a href="index.html">首頁</a><a href="rules.html">購買涼糕規則</a><a href="products.html">涼糕專區</a><a href="merch.html">周邊商品</a><a href="schedule.html">出攤時間</a><a href="contact.html">聯絡我們</a></nav></header><section class="hero"><div>LAODIE · MERCH</div><h1>老爹・涼糕<br>周邊商品</h1><p>官方周邊商品，商品資訊由管理後台即時同步。</p></section><main class="wrap"><section class="intro"><h2>老爹・涼糕 官方周邊</h2><p>選擇商品後即可直接填寫基本資料與配送方式下單。</p></section><div id="filters" class="filters"></div><div id="status" class="status">商品資料載入中…</div><section id="grid" class="grid"></section><section class="notice"><h2>新品陸續推出</h2><p>周邊商品上架、下架及商品資訊會與管理後台同步。</p></section></main><nav class="bottom"><a href="index.html"><span>⌂</span>首頁</a><a href="products.html"><span>🍡</span>產品介紹</a><a href="schedule.html"><span>📍</span>出攤資訊</a><a href="rules.html"><span>🛒</span>訂購方式</a><a href="contact.html"><span>💬</span>聯絡我們</a></nav><div id="modal" class="modal"><div class="box"><div class="head"><h2>🛒 周邊商品下單</h2><button id="closeBtn" class="close" type="button">×</button></div><div id="selectedBox" class="summary"></div><form id="orderForm"><div class="two"><div class="field"><label>姓名 *</label><input id="nameInput" class="input" required></div><div class="field"><label>手機／電話 *</label><input id="phoneInput" class="input" required></div></div><div class="field"><label>Email</label><input id="emailInput" class="input" type="email"></div><div class="field"><label>配送方式 *</label><select id="deliveryInput" class="select" required><option value="">請選擇配送方式</option><option value="全家">全家取貨</option><option value="7-11">7-11取貨</option><option value="宅配">宅配</option></select></div><div id="storeField" class="field hidden"><label id="storeLabel">取貨店名 *</label><input id="storeInput" class="input" placeholder="請填寫全家／7-11店名"></div><div id="addressField" class="field hidden"><label>宅配地址 *</label><input id="addressInput" class="input" placeholder="請填寫完整配送地址"></div><div class="field"><label>訂單備註</label><textarea id="noteInput" class="textarea" placeholder="尺寸、顏色或其他需求請備註"></textarea></div><div id="total" class="summary"></div><div class="actions"><button id="cancelBtn" type="button" class="btn light">取消</button><button type="submit" class="btn">送出訂單</button></div><div id="error" class="error"></div></form></div></div><script>const SUPABASE_URL='https://yemzdwxtyosuaczsqwea.supabase.co',SUPABASE_KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',db=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products=[],cats=[],selectedProduct=null,qty=1,category='';const filters=$('filters'),status=$('status'),grid=$('grid'),modal=$('modal'),form=$('orderForm'),selectedBox=$('selectedBox'),delivery=$('deliveryInput'),storeField=$('storeField'),addressField=$('addressField'),store=$('storeInput'),address=$('addressInput'),storeLabel=$('storeLabel'),total=$('total'),error=$('error');async function load(){try{const[c,p]=await Promise.all([db.from('merch_categories').select('id,name,enabled').eq('enabled',true).order('id'),db.from('merch_products').select('*').eq('enabled',true).order('id',{ascending:false})]);if(c.error)throw c.error;if(p.error)throw p.error;cats=c.data||[];products=p.data||[];filters.innerHTML='<button class="filter active" data-c="">全部商品</button>'+cats.map(c=>`<button class="filter" data-c="${c.id}">${esc(c.name)}</button>`).join('');filters.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{category=b.dataset.c;filters.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render()});render()}catch(e){status.textContent='商品資料載入失敗，請重新整理頁面。'}}function render(){const list=products.filter(p=>!category||String(p.category_id)===category);status.textContent=`目前共有 ${list.length} 項上架周邊商品`;grid.innerHTML=list.length?list.map(p=>{const c=cats.find(x=>x.id===p.category_id),s=Number(p.stock_quantity||0);return `<article class="card"><div class="photo">${p.image_url?`<img src="${esc(p.image_url)}">`:'商品照片準備中'}</div><h3>${esc(p.name)}</h3>${c?`<span class="tag">${esc(c.name)}</span>`:''}<p>${esc(p.description||'')}</p><div class="price">NT$ ${Number(p.price).toLocaleString()}</div><div class="stock">${s>0?'庫存 '+s+' 件':'目前缺貨'}</div><button class="buy" ${s<1?'disabled':''} data-id="${p.id}">${s>0?'立即下單':'暫時缺貨'}</button></article>`}).join(''):'<div class="intro">目前沒有上架的周邊商品。</div>';grid.querySelectorAll('.buy').forEach(b=>b.onclick=()=>openOrder(Number(b.dataset.id)))}function openOrder(id){selectedProduct=products.find(p=>p.id===id);if(!selectedProduct)return;qty=1;form.reset();error.textContent='';selectedBox.innerHTML=`<b>${esc(selectedProduct.name)}</b><br>單價 NT$ ${Number(selectedProduct.price).toLocaleString()}　數量 <select id="qty" class="select" style="width:110px;display:inline-block">${Array.from({length:Math.min(Number(selectedProduct.stock_quantity),20)},(_,i)=>`<option>${i+1}</option>`).join('')}</select>`;modal.classList.add('show');$('qty').onchange=e=>{qty=Number(e.target.value);updateTotal()};updateDelivery();updateTotal()}function updateTotal(){total.innerHTML=`商品：${esc(selectedProduct.name)}<br>數量：${qty}<br><b>訂單金額：NT$ ${(Number(selectedProduct.price)*qty).toLocaleString()}</b>`}function updateDelivery(){const d=delivery.value,s=d==='全家'||d==='7-11',h=d==='宅配';storeField.classList.toggle('hidden',!s);addressField.classList.toggle('hidden',!h);store.required=s;address.required=h;storeLabel.textContent=d==='7-11'?'7-11取貨店名 *':'全家取貨店名 *'}function close(){modal.classList.remove('show')}delivery.onchange=updateDelivery;$('closeBtn').onclick=close;$('cancelBtn').onclick=close;form.onsubmit=async e=>{e.preventDefault();error.textContent='';const d=delivery.value,ds=(d==='全家'||d==='7-11')?store.value.trim():null,da=d==='宅配'?address.value.trim():null;if(!['全家','7-11','宅配'].includes(d)){error.textContent='請選擇配送方式';return}if(d==='宅配'&&!da){error.textContent='請填寫宅配地址';return}if((d==='全家'||d==='7-11')&&!ds){error.textContent=`請填寫${d}取貨店名`;return}const name=$('nameInput').value.trim(),phone=$('phoneInput').value.trim(),email=$('emailInput').value.trim()||null,note=$('noteInput').value.trim()||null;if(!name||!phone){error.textContent='請填寫姓名與手機／電話';return}const amount=Number(selectedProduct.price)*qty,now=new Date(),date=now.getFullYear()+String(now.getMonth()+1).padStart(2,'0')+String(now.getDate()).padStart(2,'0'),orderNo=`LG${date}-${Math.random().toString(16).slice(2,8).toUpperCase()}`,payload={order_number:orderNo,customer_name:name,customer_phone:phone,customer_email:email,customer_note:note,product_total:amount,total_amount:amount,status:'pending',payment_status:'unpaid',shipment_status:'unprepared',delivery_method:d,delivery_address:da,delivery_store:ds,recipient_name:name,recipient_phone:phone};try{const o=await db.from('merch_orders').insert(payload).select('id,order_number').single();if(o.error)throw o.error;const it=await db.from('merch_order_items').insert({order_id:o.data.id,product_id:selectedProduct.id,product_name:selectedProduct.name,unit_price:selectedProduct.price,quantity:qty,subtotal:amount});if(it.error)throw it.error;location.href=`merch-payment.html?id=${o.data.id}&order=${encodeURIComponent(o.data.order_number)}&amount=${amount}`}catch(err){error.textContent='訂單送出失敗：'+(err.message||'請稍後再試')}};load();</script></body></html>
