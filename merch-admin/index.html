<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>周邊商品管理後台</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style>
</head>
<body>
<iframe id="adminFrame" src="../merch-admin.html?v=20260914" title="周邊商品管理後台"></iframe>
<script>
const frame=document.getElementById('adminFrame');
frame.addEventListener('load',()=>{
  try{
    const doc=frame.contentDocument;
    const style=doc.createElement('style');
    style.textContent=`
      @media(max-width:800px){
        aside{width:180px!important;padding:16px 10px!important;}
        .nav{font-size:15px!important;text-align:left!important;padding:14px 12px!important;}
        .nav span{display:inline!important;}
        .main{padding:18px!important;}
        .title{align-items:flex-start!important;gap:10px!important;}
        .title h1{font-size:22px!important;}
      }
    `;
    doc.head.appendChild(style);
  }catch(e){console.error(e)}
});
</script>
</body>
</html>
