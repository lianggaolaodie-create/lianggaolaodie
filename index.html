<script>
const slides=document.getElementById('slides'),dots=[...document.querySelectorAll('.dot')];let current=0,startX=0,deltaX=0,timer;
function goSlide(n){current=(n+3)%3;slides.style.transform=`translate3d(-${current*33.333333}%,0,0)`;dots.forEach((d,i)=>d.classList.toggle('active',i===current));restartAuto()}
function nextSlide(){goSlide(current+1)}
function restartAuto(){clearInterval(timer);timer=setInterval(nextSlide,5000)}
const carousel=document.getElementById('carousel');
carousel.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;deltaX=0;clearInterval(timer)},{passive:true});
carousel.addEventListener('touchmove',e=>{deltaX=e.touches[0].clientX-startX},{passive:true});
carousel.addEventListener('touchend',()=>{if(Math.abs(deltaX)>45)goSlide(current+(deltaX<0?1:-1));else restartAuto()},{passive:true});
restartAuto();
function openMenu(){document.getElementById('menuOverlay').classList.add('show')}function closeMenu(){document.getElementById('menuOverlay').classList.remove('show')}function openSearch(){document.getElementById('searchOverlay').classList.add('show');setTimeout(()=>document.getElementById('searchInput').focus(),80)}function closeSearch(){document.getElementById('searchOverlay').classList.remove('show')}function doSearch(e){e.preventDefault();const q=document.getElementById('searchInput').value.trim().toLowerCase();const items=[['最新活動','activity.html'],['涼糕專區','products.html'],['購買涼糕規則','rules.html'],['純米蘿蔔糕專區','radish-cake.html'],['周邊商品','merch.html'],['超商寄放取件方式','convenience.html'],['關於老爹','about.html'],['出攤時間','schedule.html'],['聯絡我們','contact.html']];const hit=items.filter(x=>!q||x[0].toLowerCase().includes(q));document.getElementById('results').innerHTML=hit.length?hit.map(x=>`<a href="${x[1]}">${x[0]} →</a>`).join(''):'<p>找不到相關頁面，請換個關鍵字。</p>'}
