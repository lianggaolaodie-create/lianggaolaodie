      });
    }else if(isFlv&&window.flvjs&&flvjs.isSupported()){
      video.muted=true;
      flvPlayer=flvjs.createPlayer({type:'flv',url:playUrl,isLive:true,config:{enableStashBuffer:true,stashInitialSize:256}});
      flvPlayer.attachMediaElement(video);
      flvPlayer.load();
      video.onplaying=markPlaying;
      try{await video.play();}catch(e){}
      flvPlayer.on(flvjs.Events.ERROR,function(){
        try{flvPlayer.destroy();}catch(e){}flvPlayer=null;
        if(fallbackUrl&&fallbackUrl!==currentUrl){
          currentUrl='';
          startPlayer(fallbackUrl,'');
          setStatus('直播中・切換直播串流',true);
        }else{
          showMessage('直播畫面連線失敗，正在重新連線…');
          setStatus('直播連線不穩定',true);
          scheduleRetry(15000);
        }
      });
    }else if(isHls&&video.canPlayType('application/vnd.apple.mpegurl')){
      video.muted=true;
      video.src=streamUrl;
      video.onloadedmetadata=async function(){try{await video.play();}catch(e){}};
      video.onplaying=markPlaying;
      try{await video.play();}catch(e){}
    }else if((isHls||!isFlv)&&window.Hls&&Hls.isSupported()){
      video.muted=true;
      hls=new Hls({
        enableWorker:true,
        lowLatencyMode:true,
        backBufferLength:0,
        maxBufferLength:5,
        maxMaxBufferLength:8,
        liveSyncDuration:3,
        liveMaxLatencyDuration:10,
        liveSyncOnStallIncrease:0.75,
        maxLiveSyncPlaybackRate:1.2,
        liveSyncMode:'edge',
        capLevelToPlayerSize:true,
        startOnSegmentBoundary:true,
        manifestLoadingMaxRetry:1,
        levelLoadingMaxRetry:2,
        fragLoadingMaxRetry:2,
        maxBufferHole:0.5,
        highBufferWatchdogPeriod:1
      });
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED,async function(){try{await video.play();}catch(e){}});
      video.onplaying=markPlaying;
      hls.on(Hls.Events.ERROR,function(_,data){
        if(data&&data.fatal){
          try{hls.destroy();}catch(e){}hls=null;
          if(fallbackUrl&&fallbackUrl!==currentUrl){
            currentUrl='';
            startPlayer(fallbackUrl,'');
            setStatus('直播中・切換直播串流',true);
          }else{
            showMessage('直播畫面連線失敗，正在重新連線…');
            setStatus('直播連線不穩定',true);
            scheduleRetry(15000);
          }
        }
      });
    }else{
      showMessage('此瀏覽器不支援直播播放');
      setStatus('請使用 Safari、Chrome 或 Edge',false);
    }
  }
  async function checkLive(){
    if(checkBusy)return;
    checkBusy=true;
    try{
      const controller=new AbortController();
      const timeout=setTimeout(()=>controller.abort(),8000);
      const res=await fetch(API+'&_cb='+Date.now(),{cache:'no-store',signal:controller.signal});
      clearTimeout(timeout);
      if(!res.ok)throw new Error('HTTP '+res.status);
      const data=await res.json();
      if(data&&data.is_live){
        isLive=true;
        const directHls=data.hls_url||'';
        const directFlv=data.flv_url||'';
        const isAndroid=/Android/i.test(navigator.userAgent);
        const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
        const streamUrl=isAndroid ? (directFlv||directHls) : (directHls||directFlv);
        const fallbackUrl=isAndroid && directFlv&&directHls ? directHls : (directFlv&&directHls ? directFlv : '');
        const streamType=isAndroid&&directFlv ? 'flv' : 'hls';
        if(streamUrl){
          if(streamUrl!==currentUrl){
            await startPlayer(streamUrl,fallbackUrl,streamType);
          }
          if(!lastGoodAt) setStatus('正在載入直播畫面…',true);
        }else{
          showMessage('已偵測到直播，正在取得直播畫面…');
          setStatus('直播連線中',true);
        }
      }else{
        isLive=false;
        if(currentUrl||hls||flvPlayer)stopPlayer();
        showMessage('目前沒有直播，開播後這裡會自動顯示');
        setStatus('目前未直播',false);
      }
    }catch(e){
      // 網路短暫失敗時不要摧毀現有播放器，避免畫面卡頓與反覆重載
      if(!currentUrl){
        showMessage('直播狀態暫時無法取得，稍後自動重試');
        setStatus('等待直播連線',false);
      }
      console.warn('TikTok LIVE proxy error',e);
    }finally{
      checkBusy=false;
    }
  }
  checkLive();
  setInterval(checkLive,30000);
})();
</script>

<script>
(function(){

  const SUPABASE_KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';

  const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});

  }
  async function load(){
    try{
      if(!window.supabase)throw new Error('supabase尚未載入');
      const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
      const r=await sb.from('food_truck_schedules')
        .select('id,schedule_date,region,start_time,end_time,title,schedule_type,enabled')
        .eq('enabled',true)
        .in('schedule_type',['food_truck','stall'])
        .gte('schedule_date',today())
        .order('schedule_date',{ascending:true})
        .limit(3);
      if(r.error)throw r.error;
      const rows=r.data||[];

        const ids=rows.map(s=>s.id);
        const links=await sb.from('food_truck_schedule_flavors').select('schedule_id,flavor_id').in('schedule_id',ids);
        if(!links.error&&links.data?.length){
          const fids=[...new Set(links.data.map(x=>x.flavor_id))];

          if(!fs.error){
            const imageBySchedule={};
            links.data.forEach(x=>{const f=(fs.data||[]).find(v=>v.id===x.flavor_id);if(f?.image_url&&!imageBySchedule[x.schedule_id])imageBySchedule[x.schedule_id]=f.image_url});

    }

  setInterval(load,60000);
})();
