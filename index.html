<script>
(function(){
  const menu=document.querySelector('.menu');
  const panel=document.getElementById('mobileMenu');
  const close=document.querySelector('.mobile-menu-close');
  function openMenu(e){e.preventDefault();panel.classList.add('open');panel.setAttribute('aria-hidden','false')}
  function closeMenu(){panel.classList.remove('open');panel.setAttribute('aria-hidden','true')}
  menu.addEventListener('click',openMenu);
  close.addEventListener('click',closeMenu);
  panel.addEventListener('click',function(e){if(e.target===panel)closeMenu()});
})();
<script>
(function(){
  function routeAbout(e){
    var t=e.touches&&e.touches[0]?e.touches[0]:e;
    var r=document.querySelector('.page').getBoundingClientRect();
    var x=(t.clientX-r.left)/r.width*100;
    var y=(t.clientY-r.top)/r.height*100;
    if(x>=2&&x<=32&&y>=87&&y<=93.5){
      e.preventDefault();
      e.stopPropagation();
      window.location.href='about.html';
    }
  }
  document.addEventListener('touchend',routeAbout,{capture:true,passive:false});
  document.addEventListener('click',routeAbout,{capture:true});
})();
</script>
