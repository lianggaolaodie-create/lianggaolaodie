<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹．涼糕｜線上下單管理後台</title><style>
*{box-sizing:border-box}body{margin:0;background:#f7f3ef;color:#30241d;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.shell{max-width:1100px;margin:auto;padding:10px}.top{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 12px}.brand{font-size:21px;font-weight:900}.btn{border:0;border-radius:10px;padding:10px 14px;background:#8d5939;color:#fff;font-weight:900;cursor:pointer;touch-action:manipulation}.btn.gray{background:#6d625b}.btn.red{background:#f33b3b}.btn.small{padding:8px 11px;font-size:12px}.hidden{display:none!important}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.nav button{border:0;border-radius:12px;padding:11px 8px;background:#ebe4de;color:#5a4940;font-weight:900;font-size:14px;cursor:pointer}.nav .active{background:#8d5939;color:#fff}.head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.head h2{margin:0;font-size:24px}.date,.search{border:1px solid #d9cec6;border-radius:9px;padding:10px;background:#fff;font:inherit}.search{width:100%;margin-bottom:8px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat,.card{background:#fff;border:1px solid #e4dad3;border-radius:15px;padding:12px}.stat{text-align:center}.stat b{display:block;font-size:24px}.section{border-radius:15px;padding:10px;margin:10px 0;border:1px solid #e5dcd5}.pickup{background:#fff2f3}.home{background:#eef8ff}.sectiontitle{display:flex;justify-content:space-between;gap:8px;font-size:18px;font-weight:900;margin-bottom:8px}.order{background:#fff;border:1px solid #e8ddd6;border-radius:13px;padding:10px;margin:8px 0}.ordertop{display:flex;justify-content:space-between;gap:6px}.status{border-radius:8px;padding:5px 8px;color:#fff;font-size:12px;font-weight:900;white-space:nowrap}.paid{background:#12b86a}.pending{background:#f23a43}.stored{background:#168fe4}.done{background:#168fe4}.person{margin:8px 0;font-size:13px;line-height:1.7}.flavors{display:flex;flex-wrap:wrap;gap:6px;background:#fff4f4;border-radius:9px;padding:7px;margin:6px 0}.chip{border-radius:7px;padding:5px 8px;font-size:12px;font-weight:800;background:#ffe1c5}.actions{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}.muted{color:#786e68;font-size:13px}.login{max-width:520px;margin:60px auto}.field{margin:10px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input{width:100%;padding:11px;border:1px solid #d9cec6;border-radius:10px;font:inherit}.msg{padding:10px;border-radius:10px;margin-top:8px;background:#fff0ef;color:#a43b35}.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:99}.modalbox{background:#fff;border-radius:16px;padding:18px;width:min(420px,100%)}.modalbox select{width:100%;padding:12px;border:1px solid #d9cec6;border-radius:10px;font:inherit}.modalactions{display:flex;gap:8px;margin-top:12px}.modalactions .btn{flex:1}@media(max-width:700px){.brand{font-size:19px}.stats{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start}.head>div{max-width:65%}.person{font-size:14px}.actions .btn{padding:9px 10px}.nav button{font-size:13px}}
</style></head><body>
<div id="login" class="shell login"><div class="card"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><p class="muted">訂單、個資與狀態管理</p><form id="loginForm"><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit" id="loginBtn">登入</button></form><div id="loginMsg"></div></div></div>
<div id="app" class="shell hidden"><div class="top"><div class="brand">🍡 老爹．涼糕｜線上下單管理後台</div><button class="btn gray small" id="logout">登出</button></div><div class="nav"><button class="active" data-page="orders">🧾 訂單管理</button><button data-page="customers">👤 個資管理</button><button data-page="daily">📅 每日開放設定</button></div>
<section id="orders"><div class="head"><h2>訂單管理</h2><div><input id="date" class="date" type="date"><button class="btn gray" id="reload">重新整理</button></div></div><div class="stats"><div class="stat">🧾<div>今日訂單</div><b id="today">0</b></div><div class="stat">💰<div>待確認匯款</div><b id="pending">0</b></div><div class="stat">✅<div>已付款</div><b id="paid">0</b></div><div class="stat">🚚<div>已寄放</div><b id="stored">0</b></div></div><div class="section pickup"><div class="sectiontitle"><span>🏪 超商寄放客戶資料 <span style="color:#e33">(需先付款)</span></span><span>共 <b id="pc">0</b> 筆</span></div><input id="ps" class="search" placeholder="搜尋訂單編號／姓名／電話／門市"><div id="pickupList"></div></div><div class="section home"><div class="sectiontitle"><span>🏠 送到府訂單 <span style="color:#1674c5">(貨到付款)</span></span><span>共 <b id="hc">0</b> 筆</span></div><input id="hs" class="search" placeholder="搜尋訂單編號／姓名／電話／地址"><div id="homeList"></div></div><div id="orderMsg"></div></section>
<section id="customers" class="hidden"><div class="head"><h2>個資管理</h2></div><p class="muted">可查看、編輯、刪除客戶個資。刪除個資不刪除訂單。</p><div class="section pickup"><div class="sectiontitle"><span>🏪 超商寄放客戶資料</span><span>共 <b id="cpc">0</b> 筆</span></div><input id="cps" class="search" placeholder="搜尋訂單編號／姓名／電話／門市"><div id="cpList"></div></div><div class="section home"><div class="sectiontitle"><span>🏠 送到府客戶資料</span><span>共 <b id="chc">0</b> 筆</span></div><input id="chs" class="search" placeholder="搜尋訂單編號／姓名／電話／地址"><div id="chList"></div></div></section>
<section id="daily" class="hidden"><div class="card"><h2>每日開放設定</h2><p class="muted">這一版先保留後台入口，訂單／個資功能可直接操作。</p></div></section></div>
<div id="modal" class="modal hidden"><div class="modalbox"><h3>編輯訂單狀態</h3><select id="statusSelect"></select><div class="modalactions"><button class="btn gray" id="cancelStatus">取消</button><button class="btn" id="saveStatus">儲存狀態</button></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
window.db=db;
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});
let pickup=[],home=[],pickupItems=new Map(),homeItems=new Map(),customers=new Map(),editing=null;
function showMsg(t){$('orderMsg').innerHTML=t?'<div class="msg">'+esc(t)+'</div>':''}
async function access(u){const r=await db.from('admin_profiles').select('role,enabled,can_manage_products').eq('user_id',u.id).maybeSingle();if(r.error)return null;if(r.data&&!r.data.enabled)return'管理員帳號無管理權限';return null}
async function login(e){
 e.preventDefault();
 const b=$('loginBtn'); b.disabled=true; b.textContent='登入中…'; $('loginMsg').textContent='';
 try{
  const em=$('email').value.trim(), pw=$('password').value;
  if(!em||!pw) throw new Error('請輸入管理員 Email 與密碼。');
  const r=await db.auth.signInWithPassword({email:em,password:pw});
  if(r.error) throw r.error;
  const er=await access(r.data.user);
  if(er){await db.auth.signOut();throw new Error(er);}
  openApp();
 }catch(x){
  $('loginMsg').innerHTML='<div class="msg">登入失敗：'+esc(x.message||x)+'</div>';
 }finally{b.disabled=false;b.textContent='登入'}
}
function openApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('date').value=today();loadAll()}
function classify(o){return o.type==='pickup'?'pickup':'home'}
function statusClass(s){return s==='已付款'?'paid':s==='已寄放'?'stored':s==='待確認匯款'?'pending':'done'}
function card(o){const its=o.type==='pickup'?(pickupItems.get(o.id)||[]):(homeItems.get(o.id)||[]);const qty=its.reduce((a,x)=>a+Number(x.quantity||0),0);const chips=its.map(x=>'<span class="chip">'+esc(x.flavor_name||x.name||'')+' ('+Number(x.quantity||x.qty||0)+'盒)</span>').join('');const place=o.type==='pickup'?[o.convenience_store,o.store_name].filter(Boolean).join(' ')||'—':o.address||'—';return '<div class="order"><div class="ordertop"><div><b>訂單編號　'+esc(o.order_number||'')+'</b><div class="muted">訂購時間　'+new Date(o.created_at).toLocaleString('zh-TW',{timeZone:'Asia/Taipei'})+'</div></div><span class="status '+statusClass(o.status)+'">'+esc(o.status||'待確認')+'</span></div><div class="person">👤 <b>'+esc(o.name||'')+'</b>　'+esc(o.phone||'')+'<br>📍 '+esc(place)+(o.payment_last5?'　💳 匯款後五碼 '+esc(o.payment_last5):'')+'</div><div class="flavors"><b>口味 (數量)</b> '+chips+'</div><div class="muted">涼糕數量　<b>'+qty+' 盒</b>　｜　商品小計　<b>$'+Number(o.product||0)+'</b>　｜　應付總額　<b>$'+Number(o.total||0)+'</b>'+(o.type==='home'?'　<span class="chip">貨到付款</span>':'')+'</div><div class="actions"><button class="btn small" onclick="viewOrder('${esc(o.id)}')">查看</button><button class="btn small" onclick="editStatus('${esc(o.id)}')">編輯狀態</button><button class="btn red small" onclick="deleteOrder('${esc(o.id)}')">🗑 刪除</button></div></div>'}
function renderOrders(){const d=$('date').value||today();const ps=$('ps').value.trim().toLowerCase(),hs=$('hs').value.trim().toLowerCase();const match=(o,q)=>!q||[o.order_number,o.name,o.phone,o.convenience_store,o.store_name,o.address,o.payment_last5].join(' ').toLowerCase().includes(q);const p=pickup.filter(o=>o.order_date===d&&match(o,ps)),h=home.filter(o=>o.delivery_date===d&&match(o,hs));$('pc').textContent=p.length;$('hc').textContent=h.length;$('pickupList').innerHTML=p.map(card).join('')||'<div class="muted">目前沒有超商寄放訂單。</div>';$('homeList').innerHTML=h.map(card).join('')||'<div class="muted">目前沒有送到府訂單。</div>';const all=[...pickup,...home];$('today').textContent=all.filter(o=>(o.order_date||o.delivery_date)===d).length;$('pending').textContent=all.filter(o=>o.status==='待確認匯款').length;$('paid').textContent=all.filter(o=>o.status==='已付款').length;$('stored').textContent=all.filter(o=>o.status==='已寄放').length}
async function loadAll(){showMsg('');const [p,h]=await Promise.all([db.from('cooling_pickup_orders').select('*').order('created_at',{ascending:false}).limit(300),db.from('orders').select('id,order_number,delivery_date,product_total,total_amount,status,created_at,pickup_type').eq('pickup_type','home_delivery').order('created_at',{ascending:false}).limit(300)]);if(p.error||h.error){showMsg('讀取訂單失敗：'+(p.error?.message||h.error?.message));return}const pr=p.data||[],hr=h.data||[];pickupItems=new Map();homeItems=new Map();const pids=pr.map(x=>x.id),hids=hr.map(x=>x.id);if(pids.length){const r=await db.from('cooling_pickup_order_items').select('order_id,flavor_name,quantity').in('order_id',pids);(r.data||[]).forEach(x=>{if(!pickupItems.has(x.order_id))pickupItems.set(x.order_id,[]);pickupItems.get(x.order_id).push(x)})}if(hids.length){const r=await db.from('order_items').select('order_id,flavor_name,quantity').in('order_id',hids);(r.data||[]).forEach(x=>{if(!homeItems.has(x.order_id))homeItems.set(x.order_id,[]);homeItems.get(x.order_id).push(x)})}const cids=pr.map(x=>x.customer_id).filter(Boolean);customers=new Map();if(cids.length){const r=await db.from('order_customers').select('id,name,phone').in('id',cids);(r.data||[]).forEach(c=>customers.set(c.id,c))}pickup=pr.map(x=>{const c=customers.get(x.customer_id)||{};return {...x,type:'pickup',name:c.name||'',phone:c.phone||'',product:Number(x.merchandise_total||0),total:Number(x.total_amount||0)}});const priv=new Map();if(hids.length){const r=await db.from('order_private').select('order_id,customer_name,customer_phone,delivery_address').in('order_id',hids);(r.data||[]).forEach(x=>priv.set(x.order_id,x))}home=hr.map(x=>{const c=priv.get(x.id)||{};return {...x,type:'home',name:c.customer_name||'',phone:c.customer_phone||'',address:c.delivery_address||'',product:Number(x.product_total||0),total:Number(x.total_amount||0)}});renderOrders();renderCustomers()}
function viewOrder(id){const o=[...pickup,...home].find(x=>String(x.id)===String(id));if(!o)return;alert('訂單編號：'+(o.order_number||'')+'\n姓名：'+(o.name||'')+'\n電話：'+(o.phone||'')+'\n狀態：'+(o.status||''))}
function editStatus(id){editing=[...pickup,...home].find(x=>String(x.id)===String(id));if(!editing)return;const a=editing.type==='pickup'?['待確認匯款','已付款','已寄放']:['待配送','配送中','已送達'];$('statusSelect').innerHTML=a.map(x=>'<option>'+x+'</option>').join('');$('statusSelect').value=a.includes(editing.status)?editing.status:a[0];$('modal').classList.remove('hidden')}
$('cancelStatus').onclick=()=>{$('modal').classList.add('hidden');editing=null};$('saveStatus').onclick=async()=>{if(!editing)return;const v=$('statusSelect').value;const table=editing.type==='pickup'?'cooling_pickup_orders':'orders';const r=await db.from(table).update({status:v}).eq('id',editing.id);if(r.error){alert('狀態更新失敗：'+r.error.message);return}$('modal').classList.add('hidden');editing=null;await loadAll()};
async function deleteOrder(id){const o=[...pickup,...home].find(x=>String(x.id)===String(id));if(!o)return;if(!confirm('確定要刪除訂單 '+o.order_number+' 嗎？\n刪除後無法復原。'))return;let r;if(o.type==='pickup'){await db.from('cooling_pickup_order_items').delete().eq('order_id',id);r=await db.from('cooling_pickup_orders').delete().eq('id',id)}else{await db.from('order_items').delete().eq('order_id',id);await db.from('order_private').delete().eq('order_id',id);r=await db.from('orders').delete().eq('id',id)}if(r.error){alert('刪除失敗：'+r.error.message);return}await loadAll()}
function renderCustomers(){const arr=pickup.map(o=>({id:o.customer_id,order:o})).filter(x=>x.id);const uniq=[];const seen=new Set();arr.forEach(x=>{if(!seen.has(x.id)){seen.add(x.id);uniq.push(x)}});const p=uniq.filter(x=>x.order.convenience_store||x.order.store_name),h=home.map(o=>({id:o.id,order:o}));$('cpc').textContent=p.length;$('chc').textContent=h.length;const q1=$('cps').value.trim().toLowerCase(),q2=$('chs').value.trim().toLowerCase();const text=x=>[x.order.order_number,x.order.name,x.order.phone,x.order.convenience_store,x.order.store_name,x.order.address].join(' ').toLowerCase();$('cpList').innerHTML=p.filter(x=>!q1||text(x).includes(q1)).map(x=>customerCard(x.order)).join('')||'<div class="muted">目前沒有超商寄放個資。</div>';$('chList').innerHTML=h.filter(x=>!q2||text(x).includes(q2)).map(x=>customerCard(x.order)).join('')||'<div class="muted">目前沒有送到府個資。</div>'}
function customerCard(o){return '<div class="order"><div><b>訂單編號　'+esc(o.order_number||'')+'</b><br>👤 '+esc(o.name||'')+'　'+esc(o.phone||'')+'<br>📍 '+esc(o.type==='pickup'?[o.convenience_store,o.store_name].filter(Boolean).join(' ')||'—':o.address||'—')+'</div><div class="actions"><button class="btn small" onclick="editCustomer(\''+esc(o.customer_id||o.id)+'\',\''+esc(o.type)+'\')">編輯</button><button class="btn red small" onclick="deleteCustomer(\''+esc(o.customer_id||'')+'\')">🗑 刪除</button></div></div>'}
async function editCustomer(id,type){if(type==='home')return alert('送到府資料請從訂單查看；目前先提供超商客戶個資編輯。');const c=customers.get(id);if(!c)return;const name=prompt('修改姓名',c.name||'');if(name===null)return;const phone=prompt('修改電話',c.phone||'');if(phone===null)return;const r=await db.from('order_customers').update({name:name.trim(),phone:phone.trim()}).eq('id',id);if(r.error)alert('更新失敗：'+r.error.message);else await loadAll()}
async function deleteCustomer(id){if(!id)return;if(!confirm('確定要刪除這筆個資嗎？訂單會保留。'))return;const r1=await db.from('cooling_pickup_orders').update({customer_id:null}).eq('customer_id',id);if(r1.error){alert('解除關聯失敗：'+r1.error.message);return}const r=await db.from('order_customers').delete().eq('id',id);if(r.error){alert('刪除個資失敗：'+r.error.message);return}await loadAll()}
$('loginForm').addEventListener('submit',login);$('reload').onclick=loadAll;$('date').onchange=renderOrders;$('ps').oninput=renderOrders;$('hs').oninput=renderOrders;$('cps').oninput=renderCustomers;$('chs').oninput=renderCustomers;$('logout').onclick=()=>db.auth.signOut().then(()=>location.reload());document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');['orders','customers','daily'].forEach(id=>$(id).classList.add('hidden'));$(b.dataset.page).classList.remove('hidden');if(b.dataset.page==='customers')renderCustomers()});(async()=>{
  try{
    const hp=new URLSearchParams(location.hash.replace(/^#/,''));
    const ha=hp.get('access_token'), hr=hp.get('refresh_token');
    if(ha&&hr){
      history.replaceState(null,'',location.pathname+location.search);
      const sr=await db.auth.setSession({access_token:ha,refresh_token:hr});
      if(sr.error) throw sr.error;
    }
    const raw=sessionStorage.getItem('LAODIE_ADMIN_SESSION');
    if(raw){
      const s=JSON.parse(raw);
      sessionStorage.removeItem('LAODIE_ADMIN_SESSION');
      const sr=await db.auth.setSession({access_token:s.access_token,refresh_token:s.refresh_token});
      if(sr.error) throw sr.error;
    }
    const r=await db.auth.getSession();
    if(r.data&&r.data.session){
      const e=await access(r.data.session.user);
      if(!e)openApp();else await db.auth.signOut();
    }
  }catch(e){console.error('session restore failed',e);}
})();
</script><script>/* Inject reliable customer delete handler v2 */
(function(){
  document.addEventListener('click', async function(e){
    const b=e.target.closest('#customers .btn.red');
    if(!b) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    const card=b.closest('.order');
    if(!card) return;
    const m=card.textContent.match(/訂單編號\s*([A-Z0-9-]+)/i);
    const orderNo=m?m[1]:'';
    const all=[...(window.pickup||[]),...(window.home||[])];
    const o=all.find(x=>String(x.order_number||'')===String(orderNo));
    if(!o){alert('找不到這筆客戶資料，請重新整理後再試。');return;}
    if(!confirm('確定刪除這筆客戶個資嗎？訂單本身會保留。')) return;
    let r;
    if(o.type==='home'){
      r=await window.db.from('order_private').update({customer_name:'',customer_phone:'',delivery_address:''}).eq('order_id',o.id).select('order_id');
    }else{
      r=await window.db.from('cooling_pickup_orders').update({customer_id:null}).eq('customer_id',o.customer_id).select('id');
      if(!r.error) r=await window.db.from('order_customers').delete().eq('id',o.customer_id).select('id');
    }
    if(r.error){alert('刪除個資失敗：'+r.error.message);return;}
    if(typeof window.loadAll==='function') await window.loadAll();
  }, true);
})();
\n/* CUSTOMER_DELETE_FIX_V3 */\ndocument.addEventListener('click',async function(e){\n  const b=e.target.closest('#customers .btn.red');\n  if(!b)return;\n  e.preventDefault();\n  e.stopImmediatePropagation();\n  const card=b.closest('.order');\n  if(!card)return;\n  const m=card.textContent.match(/訂單編號\\s*([A-Z0-9-]+)/i);\n  const orderNo=m?m[1]:'';\n  const all=[...pickup,...home];\n  const o=all.find(x=>String(x.order_number||'')===String(orderNo));\n  if(!o){alert('找不到這筆客戶資料，請重新整理後再試。');return;}\n  if(!confirm('確定刪除這筆客戶個資嗎？訂單本身會保留。'))return;\n  let r;\n  if(o.type==='home'){\n    r=await db.from('order_private').update({customer_name:'',customer_phone:'',delivery_address:''}).eq('order_id',o.id).select('order_id');\n  }else{\n    r=await db.from('cooling_pickup_orders').update({customer_id:null}).eq('customer_id',o.customer_id).select('id');\n    if(!r.error)r=await db.from('order_customers').delete().eq('id',o.customer_id).select('id');\n  }\n  if(r.error){alert('刪除個資失敗：'+r.error.message);return;}\n  await loadAll();\n},true);\n</script>
