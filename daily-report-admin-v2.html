<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>老爹・涼糕｜日報表</title><style>body{margin:0;background:#faf7f2;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:980px;margin:auto;padding:18px 14px 60px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 5px 20px #0000000a}h1{margin:0 0 8px}h2{font-size:20px;margin:0 0 12px}.grid{display:grid;gap:10px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #d9cdc1;border-radius:10px;box-sizing:border-box;font:inherit;background:#fff}.field input[readonly]{background:#f7f4f0;color:#2d241e}.field textarea{min-height:80px;resize:vertical}button{border:0;border-radius:11px;padding:10px 14px;background:#9b5c38;color:#fff;font-weight:800;cursor:pointer}button:disabled{opacity:.6}.secondary{background:#eee;color:#333}.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.msg{padding:12px;border-radius:10px;background:#f6eee7;margin-top:10px}.error{background:#fff0ef;color:#a32e29}.ok{background:#edf8f1;color:#286d46}.hidden{display:none}.small{font-size:13px;color:#75685f}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{border:1px solid #eadfd4;border-radius:13px;padding:14px}.stat b{display:block;font-size:25px;margin-top:5px}.flavor-row{display:grid;grid-template-columns:1fr 180px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #eee}.flavor-sold{padding:10px;border:1px solid #e6ded7;border-radius:10px;background:#fafafa;font-size:18px;font-weight:700;text-align:center}.section-note{background:#fbf5ee;padding:10px;border-radius:10px;margin-bottom:12px}.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}.pill{background:#edf8f1;padding:4px 8px;border-radius:999px;white-space:nowrap}@media(max-width:700px){.two,.three,.statgrid{grid-template-columns:1fr 1fr}.flavor-row{grid-template-columns:1fr 100px}}@media(max-width:480px){.two,.three,.statgrid{grid-template-columns:1fr}.flavor-row{grid-template-columns:1fr 85px}}</style></head><body><div class="wrap"><div class="card"><h1>📊 老爹・涼糕｜日報表</h1><div id="who" class="small">尚未登入</div></div><div id="login" class="card"><h2>管理員登入</h2><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" type="button">登入日報表</button><div id="loginMsg"></div></div><div id="panel" class="hidden"><div class="card"><div class="actions"><button class="secondary" id="refreshBtn" type="button">重新整理</button><button class="secondary" id="logoutBtn" type="button">登出</button></div><div id="msg"></div></div><div class="card"><h2>📅 日報日期</h2><div class="grid two"><div class="field"><label>日期</label><input id="reportDate" type="date"></div><div class="field"><label>填表人</label><input id="operatorName" placeholder="姓名"></div></div><div class="grid two"><div class="field"><label>工作區域／餐車</label><input id="workArea"></div><div class="field"><label>今日服務地區</label><input id="truckRegion"></div></div></div><div class="card"><h2>🤖 訂單自動統計</h2><div class="section-note">以下數字會依選定日期的訂單資料自動計算；取消訂單不計入售出盒數與營業額。</div><div class="statgrid"><div class="stat">訂單數<b id="statOrders">0</b></div><div class="stat">售出盒數<b id="statBoxes">0</b></div><div class="stat">營業額<b id="statRevenue">$0</b></div><div class="stat">配送單數<b id="statDelivery">0</b></div></div><div id="statsMsg" class="small" style="margin-top:10px"></div></div><div class="card"><h2>🍡 各口味明細</h2><div class="section-note">只顯示當日各口味實際售出盒數，資料依訂單自動統計。</div><div id="flavorBox"></div></div><div class="card"><h2>💰 收款</h2><div class="grid three"><div class="field"><label>現金</label><input id="cashAmount" type="number" min="0" value="0"></div><div class="field"><label>匯款</label><input id="transferAmount" type="number" min="0" value="0"></div><div class="field"><label>其他付款</label><input id="otherPaymentAmount" type="number" min="0" value="0"></div></div></div><div class="card"><h2>🚚 配送／寄放</h2><div class="grid three"><div class="field"><label>配送件數</label><input id="deliveryCount" type="number" min="0" value="0"></div><div class="field"><label>已完成</label><input id="deliveryCompleted" type="number" min="0" value="0"></div><div class="field"><label>未完成</label><input id="deliveryPending" type="number" min="0" value="0"></div></div><div class="grid two"><div class="field"><label>全家冷藏寄放件數</label><input id="familyMartCount" type="number" min="0" value="0" readonly></div><div class="field"><label>7-11 冷藏寄放件數</label><input id="sevenElevenCount" type="number" min="0" value="0" readonly></div></div><div class="small">全家與 7-11 件數由當日訂單資料自動帶入，不需手動輸入。</div></div><div class="card"><h2>📝 工作紀錄</h2><div class="field"><label>今日工作內容</label><textarea id="workNotes"></textarea></div><div class="field"><label>異常狀況</label><textarea id="exceptionNotes"></textarea></div><div class="field"><label>客人反應</label><textarea id="customerFeedback"></textarea></div><div class="field"><label>備註</label><textarea id="notes"></textarea></div><div class="actions"><button id="saveBtn" type="button">💾 儲存日報</button><button class="secondary" id="loadBtn" type="button">載入此日期</button></div></div><div class="card"><h2>📚 歷史日報</h2><div id="historyBox">讀取中…</div></div></div></div><script>(function(){'use strict';const BASE='https://yemzdwxtyosuaczsqwea.supabase.co',KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',$=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),today=()=>new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Taipei'});let token=sessionStorage.getItem('daily_report_access_token')||'',user=null;$('reportDate').value=today();function msg(t,c='msg error'){$('loginMsg').innerHTML='<div class="'+c+'">'+esc(t)+'</div>'}function show(t,c='msg'){$('msg').innerHTML='<div class="'+c+'">'+esc(t)+'</div>'}function val(id){return $(id).value??''}function num(id){return Math.max(0,Number(val(id)||0))}function money(n){return '$'+Number(n||0).toLocaleString('zh-TW')}async function req(path,opt={}){const h=Object.assign({'apikey':KEY,'Content-Type':'application/json'},opt.headers||{});if(token)h.Authorization='Bearer '+token;const r=await fetch(BASE+path,Object.assign({},opt,{headers:h}));let d=null;try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d?.error_description||d?.msg||d?.message||d?.error||('HTTP '+r.status));return d}async function login(){const e=val('email').trim(),p=val('password');if(!e||!p){msg('請輸入 Email 和密碼');return}const b=$('loginBtn');b.disabled=true;b.textContent='登入中…';msg('正在登入…','msg');try{const r=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email:e,password:p})});if(!r.access_token||!r.user?.id)throw new Error('登入成功但沒有取得登入憑證。');token=r.access_token;user=r.user;sessionStorage.setItem('daily_report_access_token',token);const a=await req('/rest/v1/rpc/daily_report_can_access',{method:'POST',body:'{}'});if(a!==true&&a!=='true')throw new Error('此帳號不是啟用中的日報表管理員。');$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('who').textContent=user.email||'';msg('');await loadAll()}catch(e){token='';sessionStorage.removeItem('daily_report_access_token');msg('登入失敗：'+(e.message||String(e)))}finally{b.disabled=false;b.textContent='登入日報表'}}async function restore(){if(!token)return;try{user=await req('/auth/v1/user');const a=await req('/rest/v1/rpc/daily_report_can_access',{method:'POST',body:'{}'});if(a!==true&&a!=='true')throw new Error('not admin');$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('who').textContent=user.email||'';await loadAll()}catch(e){token='';sessionStorage.removeItem('daily_report_access_token')}}async function logout(){try{if(token)await req('/auth/v1/logout',{method:'POST'})}catch(e){}token='';sessionStorage.removeItem('daily_report_access_token');location.reload()}async function loadStats(){try{const d=val('reportDate')||today(),orders=await req('/rest/v1/orders?select=id,total_amount,status,pickup_type&delivery_date=eq.'+encodeURIComponent(d)),active=(orders||[]).filter(o=>o.status!=='cancelled'),ids=active.map(o=>o.id);let boxes=0;if(ids.length){const items=await req('/rest/v1/order_items?select=order_id,quantity&order_id=in.('+ids.map(encodeURIComponent).join(',')+')');boxes=(items||[]).reduce((s,x)=>s+Number(x.quantity||0),0)}const pickup=active.reduce((r,o)=>{const p=String(o.pickup_type||'').toLowerCase().replace(/\s/g,'');if(p.includes('全家'))r.family++;if(p.includes('7-11')||p.includes('7–11')||p.includes('7－11')||p.includes('711')||p.includes('7eleven'))r.seven++;return r},{family:0,seven:0});$('statOrders').textContent=active.length;$('statBoxes').textContent=boxes;$('statRevenue').textContent=money(active.reduce((s,o)=>s+Number(o.total_amount||0),0));$('statDelivery').textContent=active.length;$('familyMartCount').value=pickup.family;$('sevenElevenCount').value=pickup.seven;$('statsMsg').textContent=d+' 已完成系統自動統計。'}catch(e){$('statsMsg').textContent='統計讀取失敗：'+(e.message||String(e))}}async function loadFlavors(){try{const d=val('reportDate')||today(),flavors=await req('/rest/v1/flavors?select=id,name&enabled=eq.true&order=id.asc'),orders=await req('/rest/v1/orders?select=id,status&delivery_date=eq.'+encodeURIComponent(d)),ids=(orders||[]).filter(o=>o.status!=='cancelled').map(o=>o.id);let items=[];if(ids.length)items=await req('/rest/v1/order_items?select=flavor_id,quantity&order_id=in.('+ids.map(encodeURIComponent).join(',')+')');const sold=new Map();(items||[]).forEach(x=>sold.set(String(x.flavor_id),(sold.get(String(x.flavor_id))||0)+Number(x.quantity||0)));$('flavorBox').innerHTML='<div class="flavor-row"><strong>口味</strong><strong>售出（盒）</strong></div>'+(flavors||[]).map(f=>'<div class="flavor-row"><div>'+esc(f.name)+'</div><div class="flavor-sold">'+Number(sold.get(String(f.id))||0)+'</div></div>').join('')}catch(e){$('flavorBox').textContent='口味統計讀取失敗：'+(e.message||String(e))}}async function getReport(){const d=val('reportDate')||today(),rows=await req('/rest/v1/daily_reports?select=*&report_date=eq.'+encodeURIComponent(d)+'&limit=1');return rows?.[0]||null}function set(id,v){$(id).value=v??''}function snake(s){return s.replace(/[A-Z]/g,m=>'_'+m.toLowerCase())}async function loadCurrent(){try{const r=await getReport();if(!r){$('operatorName').value=user?.email||'';['workArea','truckRegion','workNotes','exceptionNotes','customerFeedback','notes'].forEach(id=>set(id,''));['cashAmount','transferAmount','otherPaymentAmount','deliveryCount','deliveryCompleted','deliveryPending'].forEach(id=>set(id,0));return}set('operatorName',r.operator_name);set('workArea',r.work_area);set('truckRegion',r.truck_region);['cashAmount','transferAmount','otherPaymentAmount','deliveryCount','deliveryCompleted','deliveryPending'].forEach(id=>set(id,r[snake(id)]));set('workNotes',r.work_notes);set('exceptionNotes',r.exception_notes);set('customerFeedback',r.customer_feedback);set('notes',r.notes)}catch(e){show('日報資料讀取失敗：'+(e.message||String(e)),'error')}}async function save(){if(!user)return;const d=val('reportDate')||today(),family=Number(val('familyMartCount')||0),seven=Number(val('sevenElevenCount')||0),payload={report_date:d,filled_by:user.id,operator_name:val('operatorName').trim(),work_area:val('workArea').trim(),truck_region:val('truckRegion').trim(),order_count:Number($('statOrders').textContent||0),produced_boxes:0,sold_boxes:Number($('statBoxes').textContent||0),cancelled_boxes:0,remaining_boxes:0,cash_amount:num('cashAmount'),transfer_amount:num('transferAmount'),other_payment_amount:num('otherPaymentAmount'),delivery_count:num('deliveryCount'),delivery_completed:num('deliveryCompleted'),delivery_pending:num('deliveryPending'),convenience_store_count:family+seven,flavor_details:[...document.querySelectorAll('.flavor-sold')].map(el=>({flavor_id:el.previousElementSibling?.dataset?.id||null,sold:Number(el.textContent||0)})),work_notes:val('workNotes'),exception_notes:val('exceptionNotes'),customer_feedback:val('customerFeedback'),notes:val('notes')};try{await req('/rest/v1/daily_reports?on_conflict=report_date',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(payload)});show('日報已儲存。','ok');await loadHistory()}catch(e){show('儲存失敗：'+(e.message||String(e)),'error')}}async function loadHistory(){try{const rows=await req('/rest/v1/daily_reports?select=report_date,operator_name,order_count,sold_boxes,updated_at&order=report_date.desc&limit=60');$('historyBox').innerHTML=rows?.length?rows.map(r=>'<div class="row"><div><b>'+esc(r.report_date)+'</b>　'+esc(r.operator_name||'')+'<br><span class="small">訂單 '+Number(r.order_count||0)+'　售出 '+Number(r.sold_boxes||0)+' 盒</span></div><span class="pill">已儲存</span></div>').join(''):'目前沒有日報紀錄。'}catch(e){$('historyBox').textContent='歷史日報讀取失敗：'+(e.message||String(e))}}async function loadAll(){await Promise.all([loadStats(),loadFlavors(),loadCurrent(),loadHistory()])}$('loginBtn').onclick=login;$('logoutBtn').onclick=logout;$('refreshBtn').onclick=loadAll;$('reportDate').onchange=loadAll;$('loadBtn').onclick=loadCurrent;$('saveBtn').onclick=save;restore()})();</script></body></html>
