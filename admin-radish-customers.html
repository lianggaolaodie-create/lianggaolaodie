<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>蘿蔔糕個資管理｜老爹</title><style>*{box-sizing:border-box}body{margin:0;background:#f7f0e7;color:#3b2921;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border:1px solid #eadfd4;border-radius:18px;padding:16px;margin-bottom:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.brand{font-size:22px;font-weight:950}.muted{color:#81736a;font-size:13px;line-height:1.7}.btn{border:0;border-radius:11px;padding:11px 14px;background:#805238;color:#fff;font-weight:900;font-size:15px}.field{margin:12px 0}.field label{display:block;font-weight:900;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #ddd1c7;border-radius:10px;font:inherit}.hidden{display:none!important}.searchrow{display:flex;gap:8px;margin:12px 0}.searchrow input{flex:1;min-width:0;padding:13px;border:1px solid #ddd1c7;border-radius:11px;font:inherit}.customer{background:#fff8f8;border:1px solid #eadfd4;border-radius:14px;padding:14px;margin:10px 0}.orderline{background:#fff;border:1px solid #eee2d8;border-radius:10px;padding:10px;margin-top:8px;line-height:1.8;overflow-wrap:anywhere}.pill{display:inline-block;background:#e5f3e9;color:#386849;border-radius:9px;padding:5px 9px;font-weight:900}.editgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.editgrid input{min-width:0;padding:10px;border:1px solid #ddd1c7;border-radius:9px;font:inherit}@media(max-width:560px){.editgrid{grid-template-columns:1fr}.searchrow{flex-direction:column}}</style></head><body><main class="wrap"><div id="login" class="card"><div class="brand">🥕 蘿蔔糕個資管理</div><p class="muted">登入官網管理員帳號，查看蘿蔔糕客戶資料。</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" required autocomplete="current-password"></div><button class="btn">登入</button></form><p id="loginMsg" class="muted"></p></div><div id="app" class="hidden"><div class="card"><div class="row"><div><div class="brand">🥕 蘿蔔糕｜個資管理</div><div id="who" class="muted"></div></div><div><button id="reload" class="btn">重新整理</button> <button id="logout" class="btn">登出</button></div></div><p class="muted">只顯示蘿蔔糕訂單客戶，不會混入涼糕資料。可搜尋訂單編號、姓名、電話、門市或地址。</p><div class="searchrow"><input id="search" placeholder="搜尋訂單編號／姓名／電話／門市／地址"><button id="searchBtn" class="btn">搜尋</button></div><div id="list">載入中…</div></div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function statusLabel(s){return ({pending:'待確認匯款',confirmed:'已確認付款',preparing:'準備出貨',shipped:'已出貨',delivered:'已送達',completed:'已完成',cancelled:'已取消'})[s]||s||'待確認匯款'}function last5(note){const m=String(note||'').match(/匯款帳號後五碼：\s*(\d{5})/);return m?m[1]:'—'}
async function enter(user){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=user.email||'';await load()}
$('loginForm').onsubmit=async e=>{e.preventDefault();const r=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(r.error){$('loginMsg').textContent='登入失敗：'+r.error.message;return}const a=await db.from('admin_profiles').select('role,enabled').eq('user_id',r.data.user.id).maybeSingle();if(a.error||!a.data?.enabled||!['super_admin','order_admin'].includes(a.data.role)){await db.auth.signOut();$('loginMsg').textContent='此帳號沒有訂單管理權限';return}enter(r.data.user)};
async function load(){$('list').textContent='讀取客戶資料中…';const r=await db.from('radish_orders').select('*').order('created_at',{ascending:false}).limit(500);if(r.error){$('list').textContent='讀取失敗：'+r.error.message;return}const orders=r.data||[];const q=$('search').value.trim().toLowerCase();const map=new Map();orders.forEach(o=>{const k=String(o.customer_phone||'')+'|'+String(o.customer_name||'');if(!map.has(k))map.set(k,{name:o.customer_name,phone:o.customer_phone,orders:[]});map.get(k).orders.push(o)});const customers=[...map.values()].filter(x=>[x.name,x.phone,...x.orders.flatMap(o=>[o.order_number,o.delivery_address,o.pickup_store])].some(v=>String(v||'').toLowerCase().includes(q)));$('list').innerHTML=customers.length?'<p class="muted">共 '+customers.length+' 位蘿蔔糕客戶</p>'+customers.map(x=>'<article class="customer"><div class="row"><div><div class="muted">客戶姓名</div><b>'+esc(x.name)+'</b><br><a href="tel:'+esc(x.phone)+'">'+esc(x.phone)+'</a></div><span class="pill">共 '+x.orders.length+' 筆訂單</span></div>'+x.orders.map(o=>'<div class="orderline"><b>訂單編號：'+esc(o.order_number)+'</b><br>📍 地址：'+esc(o.delivery_address||'—')+'<br>🏪 門市：'+esc(o.pickup_store||'—')+'<br>💳 匯款後五碼：'+esc(last5(o.customer_note))+'<br>🚚 配送方式：'+esc(o.shipping_method||'—')+'<br>金額：NT$ '+Number(o.total_amount||0).toLocaleString()+'｜狀態：'+esc(statusLabel(o.status))+'<br><button class="btn" data-edit="'+o.id+'">編輯收件資料</button> <button class="btn" data-cancel="'+o.id+'">取消訂單</button><div id="edit-'+o.id+'" class="hidden"><div class="editgrid"><input data-field="customer_name" value="'+esc(o.customer_name)+'" placeholder="收件人姓名"><input data-field="customer_phone" value="'+esc(o.customer_phone)+'" placeholder="聯絡電話"><input data-field="delivery_address" value="'+esc(o.delivery_address)+'" placeholder="宅配地址／縣市"><input data-field="pickup_store" value="'+esc(o.pickup_store||'')+'" placeholder="取貨門市名稱"><input data-field="customer_note" value="'+esc(o.customer_note||'')+'" placeholder="備註／匯款後五碼"></div><button class="btn" data-save-customer="'+o.id+'">儲存資料</button></div></div>').join('')+'</article>').join(''):'<p class="muted">目前沒有符合條件的蘿蔔糕客戶資料。</p>';
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{$('edit-'+b.dataset.edit).classList.toggle('hidden')});document.querySelectorAll('[data-save-customer]').forEach(b=>b.onclick=async()=>{const id=b.dataset.saveCustomer;const box=$('edit-'+id);const data={};box.querySelectorAll('[data-field]').forEach(i=>data[i.dataset.field]=i.value.trim());b.disabled=true;const u=await db.from('radish_orders').update(data).eq('id',id);b.disabled=false;if(u.error)alert('儲存失敗：'+u.error.message);else{alert('客戶資料已更新');await load()}});document.querySelectorAll('[data-cancel]').forEach(b=>b.onclick=async()=>{if(!confirm('確定將這筆蘿蔔糕訂單標記為取消？'))return;const u=await db.from('radish_orders').update({status:'cancelled',updated_at:new Date().toISOString()}).eq('id',b.dataset.cancel);if(u.error)alert('更新失敗：'+u.error.message);else{alert('訂單已取消');await load()}})}
$('reload').onclick=load;$('searchBtn').onclick=load;$('search').addEventListener('keydown',e=>{if(e.key==='Enter')load()});$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.getSession().then(async r=>{if(r.data.session){const a=await db.from('admin_profiles').select('role,enabled').eq('user_id',r.data.session.user.id).maybeSingle();if(!a.error&&a.data?.enabled&&['super_admin','order_admin'].includes(a.data.role))enter(r.data.session.user)}});
</script></body></html>
