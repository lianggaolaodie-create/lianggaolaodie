<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>老爹・涼糕｜獨立掃碼</title><style>*{box-sizing:border-box}body{margin:0;background:#f4efe9;color:#251e19;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(420px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 40px #0002}.field{margin:14px 0}.field label{display:block;font-size:14px;font-weight:800;margin-bottom:7px}.field input,.manualrow input,.modal input,.modal select{width:100%;padding:14px;border:1px solid #d9cec5;border-radius:12px;font-size:16px}.btn{border:0;border-radius:13px;background:#8e5738;color:white;padding:14px 18px;font-weight:900;font-size:16px;width:100%}.err{color:#b3261e}.app{display:none;min-height:100vh}.top{background:#171310;color:#fff;padding:18px;position:sticky;top:0;z-index:5}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:21px;margin:0}.top small{opacity:.8}.wrap{max-width:620px;margin:auto;padding:16px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.toolbar .full{grid-column:1/-1}.scanner{background:#111;border-radius:22px;overflow:hidden;position:relative;aspect-ratio:1/1;margin-bottom:14px}.scanner video{width:100%;height:100%;object-fit:cover}.frame{position:absolute;inset:16%;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 999px #0005}.status{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px}.tag{display:inline-block;background:#eee5dc;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}.name{font-size:22px;font-weight:900;margin-top:10px}.info{margin-top:10px;padding:14px;border-radius:13px;background:#f7f3ef;font-size:18px;line-height:1.5}.infoRow{display:flex;gap:8px;align-items:center}.infoRow+.infoRow{margin-top:9px}.info b{min-width:76px}.price{font-size:30px;font-weight:900;margin-top:10px}.stock{margin-top:5px;font-size:16px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.secondary{background:#ebe4dd;color:#332b25}.qty{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}.qty button{width:48px;height:48px;border:0;border-radius:50%;font-size:24px}.qty strong{font-size:28px}.manualrow{display:flex;gap:8px}.manualrow input{flex:1}.manualrow .btn{width:auto}.success{background:#e5f4ea;color:#17613b;border-radius:14px;padding:13px;margin-top:12px;font-weight:800}.notice{background:#fff4d8;border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px;line-height:1.5}.muted{color:#786e67}.list{margin-top:10px}.item{background:#f7f3ef;border-radius:14px;padding:13px;margin-top:9px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item b{font-size:17px}.item small{display:block;color:#786e67;line-height:1.5}.modalbg{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal{width:min(620px,100%);background:#fff;border-radius:24px 24px 0 0;padding:20px;max-height:90vh;overflow:auto}.modal h2{margin:0 0 12px}.modalActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.genrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.hidden{display:none}</style></head><body><div id="login" class="login"><div class="box"><div style="font-size:42px">🍡</div><h1>老爹・涼糕</h1><p class="muted">獨立掃條碼系統</p><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" onclick="login()">登入掃碼系統</button><div id="msg"></div></div></div><div id="app" class="app"><header class="top"><div class="topline"><div><h1>📷 老爹・涼糕｜獨立掃碼</h1><small id="user"></small></div><button onclick="logout()" style="border:0;border-radius:10px;padding:9px 12px">登出</button></div></header><main class="wrap"><div class="toolbar"><button class="btn" onclick="openAdd()">＋ 新增商品</button><button class="btn" onclick="openBarcode()">🔢 新增條碼</button><button class="btn full" onclick="loadProducts()">🔄 商品管理</button></div><div id="manager" class="status hidden"><b>📦 商品管理</b><div class="muted" style="margin-top:6px">可查看商品、口味、條碼、價格與庫存。</div><div id="productList" class="list"></div></div><div class="notice"><b>掃描條碼 → 馬上辨識口味</b><br>確認口味、條碼、售價、庫存後，再按「確認銷售」。</div><button id="cameraBtn" class="btn" style="margin-bottom:12px" onclick="startScanner()">📷 開啟相機掃描</button><div class="scanner"><video id="video" playsinline muted autoplay></video><div class="frame"></div></div><div class="status"><div class="muted" id="hint">等待掃描商品條碼</div><div><span class="tag" id="productTag">尚未掃描</span><div class="name" id="pname">掃描後顯示商品</div><div class="info"><div class="infoRow"><b>🍡 口味</b><span id="pflavor">等待掃描</span></div><div class="infoRow"><b>🔢 條碼</b><span id="pbarcode">等待掃描</span></div></div><div class="price" id="pprice">$—</div><div class="muted stock" id="pstock">目前庫存：— 盒</div><div class="qty"><button onclick="changeQty(-1)">−</button><strong id="qty">1</strong><button onclick="changeQty(1)">＋</button></div><div class="actions"><button class="btn" onclick="sell()">確認銷售</button><button class="btn secondary" onclick="clearProduct()">取消</button></div><div id="result"></div></div></div><div class="status"><b>🔎 查詢商品</b><div class="field"><label>🔢 用條碼查詢</label><div class="manualrow"><input id="manual" placeholder="例如 LAO10001"><button class="btn" onclick="lookup()">查詢</button></div></div><div class="field"><label>🍡 用口味查詢</label><div class="manualrow"><input id="flavorSearch" placeholder="例如 草莓、芒果、仙草"><button class="btn" onclick="lookupFlavor()">查詢</button></div></div><div id="searchResults" class="list"></div></div></main></div><div id="addModal" class="modalbg"><div class="modal"><h2>＋ 新增商品</h2><div class="field"><label>商品名稱</label><input id="newname" placeholder="例如 水果綜合涼糕"></div><div class="field"><label>🍡 口味</label><input id="newflavor" placeholder="例如 草莓、芒果、仙草"></div><div class="field"><label>💰 價格</label><input id="newprice" type="number" min="0" placeholder="100"></div><div class="field"><label>📦 初始庫存</label><input id="newstock" type="number" min="0" placeholder="0"></div><div class="field"><label>🔢 條碼</label><div class="genrow"><input id="newbarcode" placeholder="可自動產生"><button class="btn" type="button" onclick="generateNewBarcode()">⚡ 自動產生</button></div></div><div id="addmsg"></div><div class="modalActions"><button class="btn secondary" onclick="closeAdd()">取消</button><button class="btn" onclick="saveProduct()">儲存商品</button></div></div></div><div id="barcodeModal" class="modalbg"><div class="modal"><h2>🔢 新增條碼</h2><p class="muted">選擇已有商品，系統可自動產生唯一條碼。</p><div class="field"><label>🍡 選擇商品</label><select id="barcodeProduct"></select></div><div class="field"><label>🔢 條碼</label><div class="genrow"><input id="barcodeValue" placeholder="例如 LAO10006"><button class="btn" type="button" onclick="generateAssignBarcode()">⚡ 自動產生</button></div></div><div id="barcodemsg"></div><div class="modalActions"><button class="btn secondary" onclick="closeBarcode()">取消</button><button class="btn" onclick="saveBarcode()">儲存條碼</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script><script>const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);let selected=null,qty=1,reader=null,scanning=false,barcodeProducts=[];async function allowed(uid){const{data:p,error}=await db.from('admin_profiles').select('role,enabled,can_manage_food_truck').eq('user_id',uid).maybeSingle();return !error&&p?.enabled&&(p.role==='super_admin'||p.can_manage_food_truck)}function setMsg(t,e=false){$('msg').innerHTML=t?'<div class="'+(e?'err':'muted')+'">'+t+'</div>':''}async function login(){setMsg('登入中…');const{data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return setMsg('登入失敗，請確認帳號密碼',true);if(!await allowed(data.user.id)){await db.auth.signOut();return setMsg('此帳號沒有掃碼權限',true)}showApp(data.user.email)}function showApp(email){$('login').style.display='none';$('app').style.display='block';$('user').textContent=email||''}async function logout(){stopScanner();await db.auth.signOut();location.reload()}function randomBarcode(){return 'LAO'+String(Date.now()).slice(-8)+String(Math.floor(Math.random()*10))}async function uniqueBarcode(){for(let i=0;i<20;i++){const code=randomBarcode();const{data}=await db.from('food_truck_products').select('id').eq('barcode',code).maybeSingle();if(!data)return code}return 'LAO'+Math.floor(100000000+Math.random()*900000000)}function generateNewBarcode(){$('newbarcode').value=randomBarcode()}async function generateAssignBarcode(){$('barcodeValue').value=await uniqueBarcode()}function openAdd(){$('addmsg').innerHTML='';$('newname').value='';$('newflavor').value='';$('newprice').value='';$('newstock').value='';$('newbarcode').value='';$('addModal').style.display='flex'}function closeAdd(){$('addModal').style.display='none'}async function saveProduct(){const name=$('newname').value.trim(),flavor=$('newflavor').value.trim(),price=Number($('newprice').value),stock=Number($('newstock').value||0),barcode=$('newbarcode').value.trim()||await uniqueBarcode();if(!name||!flavor||!Number.isInteger(price)||price<0||!Number.isInteger(stock)||stock<0){$('addmsg').innerHTML='<div class="err">請完整填寫商品名稱、口味、價格、庫存</div>';return}$('addmsg').innerHTML='<div class="muted">儲存中…</div>';const{error}=await db.from('food_truck_products').insert({product_name:name,flavor,price,stock,barcode,active:true});if(error){$('addmsg').innerHTML='<div class="err">儲存失敗：'+error.message+'</div>';return}closeAdd();$('manager').classList.remove('hidden');await loadProducts();alert('商品已新增：'+flavor+'／'+barcode)}async function loadProducts(){const{data,error}=await db.from('food_truck_products').select('id,product_name,flavor,price,barcode,stock,active').order('id',{ascending:false});$('manager').classList.remove('hidden');if(error){$('productList').innerHTML='<div class="err">無法讀取商品</div>';return}barcodeProducts=data||[];if(!data?.length){$('productList').innerHTML='<div class="muted" style="margin-top:10px">目前沒有商品</div>';return}$('productList').innerHTML=data.map(p=>'<div class="item"><div><b>'+esc(p.product_name)+'</b><small>🍡 '+esc(p.flavor||'未設定')+'<br>🔢 '+esc(p.barcode||'尚未設定')+'　💰 $'+Number(p.price).toLocaleString()+'　📦 '+p.stock+' 盒</small></div><button class="btn" style="width:auto;padding:10px 13px" onclick="useCode(\''+String(p.barcode||'').replace(/'/g,"\\'")+'\')">查詢</button></div>').join('')}async function openBarcode(){const{data,error}=await db.from('food_truck_products').select('id,product_name,flavor,price,barcode,stock,active').eq('active',true).order('id',{ascending:false});if(error)return alert('無法讀取商品');barcodeProducts=data||[];if(!barcodeProducts.length)return alert('目前沒有商品，請先新增商品');$('barcodeProduct').innerHTML=barcodeProducts.map(p=>'<option value="'+p.id+'">'+esc(p.product_name)+'｜'+esc(p.flavor||'未設定')+'｜目前條碼：'+esc(p.barcode||'無')+'</option>').join('');$('barcodeValue').value='';$('barcodemsg').innerHTML='';$('barcodeModal').style.display='flex'}function closeBarcode(){$('barcodeModal').style.display='none'}async function saveBarcode(){const id=Number($('barcodeProduct').value),code=$('barcodeValue').value.trim();if(!id||!code){$('barcodemsg').innerHTML='<div class="err">請選擇商品並輸入條碼</div>';return}const{data:dup}=await db.from('food_truck_products').select('id,product_name').eq('barcode',code).maybeSingle();if(dup&&dup.id!==id){$('barcodemsg').innerHTML='<div class="err">這個條碼已被「'+esc(dup.product_name)+'」使用</div>';return}$('barcodemsg').innerHTML='<div class="muted">儲存中…</div>';const{error}=await db.from('food_truck_products').update({barcode,updated_at:new Date().toISOString()}).eq('id',id);if(error){$('barcodemsg').innerHTML='<div class="err">儲存失敗：'+error.message+'</div>';return}closeBarcode();await loadProducts();alert('條碼已新增：'+code)}function useCode(code){if(!code)return;$('manual').value=code;lookup(code);window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}function esc(v){return String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function changeQty(n){qty=Math.max(1,qty+n);$('qty').textContent=qty}async function lookup(code){code=(code||$('manual').value).trim();if(!code)return;const{data,error}=await db.from('food_truck_products').select('id,product_name,flavor,price,barcode,stock,active').eq('barcode',code).eq('active',true).maybeSingle();if(error||!data){$('hint').textContent='❌ 找不到此條碼';$('productTag').textContent='查詢失敗';$('pname').textContent='找不到商品';$('pflavor').textContent='—';$('pbarcode').textContent=code;$('pprice').textContent='$—';$('pstock').textContent='目前庫存：—';selected=null;return}showProduct(data)}async function lookupFlavor(){const q=$('flavorSearch').value.trim();if(!q)return;const{data,error}=await db.from('food_truck_products').select('id,product_name,flavor,price,barcode,stock,active').eq('active',true).ilike('flavor','%'+q+'%').order('id',{ascending:false});if(error){$('searchResults').innerHTML='<div class="err">口味查詢失敗</div>';return}if(!data?.length){$('searchResults').innerHTML='<div class="muted">找不到「'+esc(q)+'」相關口味</div>';return}$('searchResults').innerHTML=data.map(p=>'<div class="item"><div><b>'+esc(p.product_name)+'</b><small>🍡 '+esc(p.flavor||'未設定')+'<br>🔢 '+esc(p.barcode)+'　💰 $'+Number(p.price).toLocaleString()+'　📦 '+p.stock+' 盒</small></div><button class="btn" style="width:auto;padding:10px 13px" onclick="useFlavorCode(\''+String(p.barcode).replace(/'/g,"\\'")+'\')">選擇</button></div>').join('')}function useFlavorCode(code){$('manual').value=code;lookup(code);$('searchResults').innerHTML='';window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})}function showProduct(data){selected=data;qty=1;$('qty').textContent='1';$('hint').textContent='掃描成功，請確認以下資料';$('productTag').textContent='✓ 已找到商品';$('pname').textContent=data.product_name||'未命名商品';$('pflavor').textContent=data.flavor||'未設定口味';$('pbarcode').textContent=data.barcode||'—';$('pprice').textContent='$'+Number(data.price||0).toLocaleString();$('pstock').textContent='目前庫存：'+Number(data.stock||0)+' 盒';$('result').innerHTML=''}function clearProduct(){$('productTag').textContent='尚未掃描';$('pname').textContent='掃描後顯示商品';$('pflavor').textContent='等待掃描';$('pbarcode').textContent='等待掃描';$('pprice').textContent='$—';$('pstock').textContent='目前庫存：— 盒';$('result').innerHTML='';selected=null;qty=1;$('qty').textContent='1';$('hint').textContent='等待掃描商品條碼'}async function sell(){if(!selected)return alert('請先掃描或查詢商品');if(qty>selected.stock)return alert('庫存不足');const{data,error}=await db.rpc('food_truck_scan_sale',{p_barcode:selected.barcode,p_quantity:qty});if(error)return alert(error.message);const r=Array.isArray(data)?data[0]:data;$('result').innerHTML='<div class="success">✓ 銷售完成<br>🍡 口味：'+(selected.flavor||'未設定')+'<br>🔢 條碼：'+selected.barcode+' × '+qty+'<br>💰 $'+Number(r?.total_amount??selected.price*qty).toLocaleString()+'<br>📦 剩餘庫存：'+(r?.remaining_stock??selected.stock-qty)+' 盒</div>';$('productTag').textContent='✓ 銷售完成';selected=null;$('hint').textContent='可以掃描下一個商品'}async function startScanner(){if(scanning)return;try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;await $('video').play();reader=new ZXingBrowser.BrowserMultiFormatReader();scanning=true;reader.decodeFromVideoElement($('video'),result=>{if(result&&!selected)lookup(result.getText())});$('hint').textContent='請將商品條碼放進白框';$('cameraBtn').textContent='📷 相機已開啟'}catch(e){console.error(e);$('hint').textContent='相機無法開啟，請允許相機權限或使用手動條碼查詢'}}function stopScanner(){scanning=false;try{reader?.reset()}catch(e){}const s=$('video').srcObject;if(s)s.getTracks().forEach(t=>t.stop());$('video').srcObject=null}$('manual').addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});$('flavorSearch').addEventListener('keydown',e=>{if(e.key==='Enter')lookupFlavor()});(async()=>{const{data}=await db.auth.getUser();if(data.user&&await allowed(data.user.id))showApp(data.user.email)})();</script></body></html>
