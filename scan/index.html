<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>老爹・涼糕｜獨立掃碼</title><style>*{box-sizing:border-box}body{margin:0;background:#f4efe9;color:#251e19;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.box,.status,.modal{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 30px #0001}.box{width:min(420px,100%)}.field{margin:12px 0}.field label{display:block;font-size:14px;font-weight:800;margin-bottom:7px}.field input,.manualrow input,.modal input,.modal select{width:100%;padding:13px;border:1px solid #d9cec5;border-radius:12px;font-size:16px;background:#fff}.btn{border:0;border-radius:13px;background:#8e5738;color:#fff;padding:13px 16px;font-weight:900;font-size:16px;width:100%}.err{color:#b3261e}.app{display:none;min-height:100vh}.top{background:#171310;color:#fff;padding:18px;position:sticky;top:0;z-index:5}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:21px;margin:0}.wrap{max-width:620px;margin:auto;padding:16px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.scanner{background:#111;border-radius:22px;overflow:hidden;position:relative;aspect-ratio:1/1;margin-bottom:14px}.scanner video{width:100%;height:100%;object-fit:cover;display:block}.frame{position:absolute;inset:16%;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 999px #0005;pointer-events:none}.tag{display:inline-block;background:#eee5dc;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}.name{font-size:22px;font-weight:900;margin-top:10px}.info{margin-top:10px;padding:14px;border-radius:13px;background:#f7f3ef;font-size:18px;line-height:1.5}.infoRow{display:flex;gap:8px}.infoRow+.infoRow{margin-top:9px}.info b{min-width:76px}.price{font-size:30px;font-weight:900;margin-top:10px}.stock{margin-top:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.secondary{background:#ebe4dd;color:#332b25}.qty{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}.qty button{width:48px;height:48px;border:0;border-radius:50%;font-size:24px}.qty strong{font-size:28px}.manualrow{display:flex;gap:8px}.manualrow input{flex:1}.manualrow .btn{width:auto}.success{background:#e5f4ea;color:#17613b;border-radius:14px;padding:13px;margin-top:12px;font-weight:800}.notice{background:#fff4d8;border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px;line-height:1.5}.muted{color:#786e67}.list{margin-top:10px}.item{background:#f7f3ef;border-radius:14px;padding:13px;margin-top:9px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item small{display:block;color:#786e67}.modalbg{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;box-shadow:none}.modalActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.genrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.barcodePreview{text-align:center;border:1px solid #eee0d6;border-radius:14px;padding:14px;margin-top:12px}.barcodePreview svg{max-width:100%;height:auto}.hidden{display:none}.batchGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.batchLabel{background:#fff;border:1px solid #ddd2c9;border-radius:10px;padding:9px;text-align:center}.batchLabel strong,.batchLabel small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.batchLabel small{color:#786e67}.batchLabel svg{width:100%;height:auto;max-height:70px}.batchLabel .code{font-size:12px;word-break:break-all}.batchTools{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}@media(max-width:420px){.batchGrid{grid-template-columns:1fr}}@media print{body{background:#fff}.login,.app{display:none!important}#batchModal{display:block!important;position:static;background:#fff}.batchModalBox{width:100%;max-width:none;border-radius:0;padding:0;max-height:none;overflow:visible}.batchControls,.batchTitleActions{display:none!important}.batchGrid{grid-template-columns:repeat(2,55mm);gap:3mm}.batchLabel{width:55mm;min-height:32mm;border:1px solid #999;border-radius:0;padding:2mm}.batchLabel svg{max-height:18mm}}</style></head><body><div id="login" class="login"><div class="box"><div style="font-size:42px">🍡</div><h1>老爹・涼糕</h1><p class="muted">獨立掃條碼系統</p><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" onclick="login()">登入掃碼系統</button><div id="msg"></div></div></div><div id="app" class="app"><header class="top"><div class="topline"><div><h1>📷 老爹・涼糕｜獨立掃碼</h1><small id="user"></small></div><button onclick="logout()" style="border:0;border-radius:10px;padding:9px 12px">登出</button></div></header><main class="wrap"><div class="toolbar"><button class="btn" onclick="openAdd()">＋ 新增商品</button><button class="btn" onclick="openBarcode()">🔢 新增條碼</button><button class="btn" onclick="openBatch()">🏷️ 批量產生條碼</button><button class="btn" onclick="loadProducts()">🔄 商品管理</button></div><div id="manager" class="status hidden"><b>📦 商品管理</b><div class="muted">可查看商品、口味、條碼、價格與庫存。</div><div id="productList" class="list"></div></div><div class="notice"><b>掃描條碼 → 馬上辨識口味</b><br>確認口味、條碼、售價、庫存後，再按「確認銷售」。</div><button id="cameraBtn" class="btn" style="margin-bottom:12px" onclick="startScanner()">📷 開啟相機掃描</button><div class="scanner"><video id="video" playsinline muted autoplay></video><div class="frame"></div></div><div class="status"><div class="muted" id="hint">等待掃描商品條碼</div><span class="tag" id="productTag">尚未掃描</span><div class="name" id="pname">掃描後顯示商品</div><div class="info"><div class="infoRow"><b>🍡 口味</b><span id="pflavor">等待掃描</span></div><div class="infoRow"><b>🔢 條碼</b><span id="pbarcode">等待掃描</span></div></div><div class="price" id="pprice">$—</div><div class="muted stock" id="pstock">目前庫存：— 盒</div><div class="qty"><button onclick="changeQty(-1)">−</button><strong id="qty">1</strong><button onclick="changeQty(1)">＋</button></div><div class="actions"><button class="btn" onclick="sell()">確認銷售</button><button class="btn secondary" onclick="clearProduct()">取消</button></div><div id="result"></div></div><div class="status"><b>📊 銷售歷史紀錄</b><div class="field"><label>選擇日期</label><input id="historyDate" type="date"></div><button class="btn" onclick="loadHistory()">查詢這一天</button><div id="historySummary" class="notice" style="margin-top:10px"></div><div id="historyList" class="list"></div></div><div class="status"><b>🔎 查詢商品</b><div class="field"><label>🔢 用條碼查詢</label><div class="manualrow"><input id="manual" placeholder="例如 LAO10001"><button class="btn" onclick="lookup()">查詢</button></div></div><div class="field"><label>🍡 用口味查詢</label><input id="flavorSearch" placeholder="請輸入口味"><button class="btn" onclick="lookupFlavor()" style="margin-top:8px">查詢</button></div><div id="searchResults" class="list"></div></div></main></div><div id="addModal" class="modalbg"><div class="modal"><h2>＋ 新增商品</h2><div class="field"><label>商品名稱</label><input id="newname"></div><div class="field"><label>🍡 口味</label><input id="newflavor"></div><div class="field"><label>💰 價格</label><input id="newprice" type="number" min="0"></div><div class="field"><label>📦 初始庫存</label><input id="newstock" type="number" min="0" value="0"></div><div class="field"><label>🔢 條碼</label><div class="genrow"><input id="newbarcode"><button class="btn" type="button" onclick="generateNewBarcode()">⚡ 自動產生</button></div><div id="newBarcodePreview" class="barcodePreview hidden"><svg id="newBarcodeSvg"></svg><div id="newBarcodeText" class="muted"></div></div></div><div id="addmsg"></div><div class="modalActions"><button class="btn secondary" onclick="closeAdd()">取消</button><button class="btn" onclick="saveProduct()">儲存商品</button></div></div></div><div id="barcodeModal" class="modalbg"><div class="modal"><h2>🔢 新增條碼</h2><p class="muted">同一商品可以有很多個不同條碼。</p><div class="field"><label>🍡 選擇商品</label><select id="barcodeProduct"></select></div><div class="field"><label>🔢 條碼</label><div class="genrow"><input id="barcodeValue"><button class="btn" type="button" onclick="generateAssignBarcode()">⚡ 自動產生</button></div><div id="assignBarcodePreview" class="barcodePreview hidden"><svg id="assignBarcodeSvg"></svg><div id="assignBarcodeText" class="muted"></div></div></div><div id="barcodemsg"></div><div class="modalActions"><button class="btn secondary" onclick="closeBarcode()">取消</button><button class="btn" onclick="saveBarcode()">儲存條碼</button></div></div></div><div id="batchModal" class="modalbg"><div class="modal batchModalBox"><div class="batchTitleActions" style="display:flex;justify-content:space-between"><h2>🏷️ 批量產生條碼</h2><button class="btn secondary" style="width:auto" onclick="closeBatch()">關閉</button></div><div class="notice batchControls">產生不同的 CODE128 條碼並直接存到商品。</div><div class="batchControls"><div class="field"><label>🍡 選擇商品</label><select id="batchProduct"></select></div><div class="field"><label>🔢 要產生幾張</label><input id="batchQty" type="number" min="1" max="300" value="10"></div><button class="btn" onclick="generateBatch()">⚡ 產生條碼</button><div id="batchmsg"></div></div><div id="batchGrid" class="batchGrid"></div><div class="batchTools batchControls"><button class="btn" onclick="printBatch()">🖨️ 列印全部</button><button class="btn secondary" onclick="saveBatchPdf()">📄 列印／另存 PDF</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script>const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);let selected=null,qty=1,reader=null,scannerControls=null,scanning=false,products=[],batchRows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function allowed(uid){const{data:p,error}=await db.from('admin_profiles').select('role,enabled,can_manage_food_truck').eq('user_id',uid).maybeSingle();return !error&&p?.enabled&&(p.role==='super_admin'||p.can_manage_food_truck)}function setMsg(t,e=false){$('msg').innerHTML=t?'<div class="'+(e?'err':'muted')+'">'+esc(t)+'</div>':''}async function login(){setMsg('登入中…');const{data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){setMsg(error.message,true);return}if(!data.user||!(await allowed(data.user.id))){await db.auth.signOut();setMsg('此帳號沒有掃碼系統權限',true);return}$('login').style.display='none';$('app').style.display='block';$('user').textContent=data.user.email||'';await loadProducts();setToday()}async function logout(){stopScanner();await db.auth.signOut();location.reload()}function setToday(){const d=new Date();$('historyDate').value=d.toLocaleDateString('en-CA')}async function startScanner(){if(scanning)return;if(!window.isSecureContext){$('hint').textContent='❌ 請使用 HTTPS 網址開啟掃碼頁';return}if(!window.ZXingBrowser){$('hint').textContent='❌ 掃描元件尚未載入，請重新整理';return}try{stopScanner();selected=null;qty=1;$('hint').textContent='正在開啟相機…';$('cameraBtn').textContent='⏹️ 停止掃描';const hints=new Map();try{hints.set(ZXingBrowser.DecodeHintType.POSSIBLE_FORMATS,[ZXingBrowser.BarcodeFormat.CODE_128,ZXingBrowser.BarcodeFormat.EAN_13,ZXingBrowser.BarcodeFormat.EAN_8,ZXingBrowser.BarcodeFormat.UPC_A,ZXingBrowser.BarcodeFormat.UPC_E]);hints.set(ZXingBrowser.DecodeHintType.TRY_HARDER,true)}catch(e){}reader=new ZXingBrowser.BrowserMultiFormatReader();scanning=true;scannerControls=await reader.decodeFromConstraints({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},$('video'),(result,error)=>{if(result&&!selected){const code=result.getText().trim();if(code){try{navigator.vibrate?.(60)}catch(e){}lookup(code)}}},hints);$('hint').textContent='正在掃描，請把條碼放在白框內'}catch(e){console.error(e);stopScanner();$('hint').textContent='❌ 相機啟動失敗：'+(e?.name||'未知錯誤')+'；請確認 Safari 相機權限後重新整理'}}function stopScanner(){scanning=false;try{scannerControls?.stop?.()}catch(e){}try{reader?.reset?.()}catch(e){}scannerControls=null;reader=null;const v=$('video');if(v?.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}if($('cameraBtn'))$('cameraBtn').textContent='📷 開啟相機掃描'}async function lookup(code){code=(code??$('manual').value).trim();if(!code)return;$('hint').textContent='查詢條碼 '+code+' …';let{data,error}=await db.from('food_truck_barcodes').select('product_id,barcode,active').eq('barcode',code).eq('active',true).maybeSingle();let product=null;if(!error&&data?.product_id){const r=await db.from('food_truck_products').select('*').eq('id',data.product_id).maybeSingle();product=r.data}if(!product){const r=await db.from('food_truck_products').select('*').eq('barcode',code).maybeSingle();product=r.data;if(!product)error=r.error}if(error||!product){$('hint').textContent='❌ 找不到這個條碼';return}product.barcode=code;showProduct(product)}function showProduct(data){selected=data;qty=Number(data.stock||0)>0?1:0;$('productTag').textContent='已辨識';$('pname').textContent=data.product_name||'未命名商品';$('pflavor').textContent=data.flavor||'未設定';$('pbarcode').textContent=data.barcode||'—';$('pprice').textContent='$'+Number(data.price||0).toLocaleString();$('pstock').textContent='目前庫存：'+Number(data.stock||0)+' 盒';$('qty').textContent=qty;$('result').innerHTML=Number(data.stock||0)>0?'':'<div class="notice">⚠️ 目前庫存為 0</div>'}function clearProduct(){selected=null;qty=1;$('productTag').textContent='尚未掃描';$('pname').textContent='掃描後顯示商品';$('pflavor').textContent='等待掃描';$('pbarcode').textContent='等待掃描';$('pprice').textContent='$—';$('pstock').textContent='目前庫存：— 盒';$('qty').textContent='1';$('result').innerHTML=''}function changeQty(n){if(!selected)return;const max=Math.max(0,Number(selected.stock||0));qty=Math.max(1,qty+n);if(qty>max)qty=max;$('qty').textContent=qty}async function sell(){if(!selected||qty<1)return;$('result').innerHTML='<div class="muted">銷售處理中…</div>';const soldQty=qty;const{data,error}=await db.rpc('food_truck_scan_sale',{p_barcode:selected.barcode,p_quantity:soldQty});if(error){$('result').innerHTML='<div class="notice">❌ '+esc(error.message)+'</div>';return}const r=Array.isArray(data)?data[0]:data;$('result').innerHTML='<div class="success">✅ 銷售完成！已扣 '+soldQty+' 盒，剩餘 '+Number(r?.remaining_stock??0)+' 盒</div>';selected.stock=Number(r?.remaining_stock??0);$('pstock').textContent='目前庫存：'+selected.stock+' 盒';await loadProducts();await loadHistory();clearTimeout(window.__scanClear);window.__scanClear=setTimeout(clearProduct,1600)}async function loadProducts(){const{data,error}=await db.from('food_truck_products').select('*').order('id',{ascending:false});if(error){$('productList').innerHTML='<div class="err">'+esc(error.message)+'</div>';return}products=data||[];$('manager').classList.remove('hidden');$('productList').innerHTML=products.map(p=>'<div class="item"><div><b>'+esc(p.product_name)+'</b><small>口味：'+esc(p.flavor||'未設定')+'｜條碼：'+esc(p.barcode||'—')+'｜$'+Number(p.price||0)+'</small></div><strong>'+Number(p.stock||0)+'盒</strong></div>').join('')||'<div class="muted">目前沒有商品</div>';fillSelects()}async function loadHistory(){const date=$('historyDate').value;if(!date)return;const start=date+'T00:00:00+08:00',end=date+'T23:59:59+08:00';const{data,error}=await db.from('food_truck_sales').select('*').gte('sold_at',start).lte('sold_at',end).order('sold_at',{ascending:false});if(error){$('historySummary').innerHTML='<div class="err">'+esc(error.message)+'</div>';return}const rows=data||[];const totalQty=rows.reduce((s,r)=>s+Number(r.quantity||0),0),totalAmt=rows.reduce((s,r)=>s+Number(r.total_amount||0),0);$('historySummary').innerHTML='<b>'+date+'</b><br>銷售數量：'+totalQty+' 盒　營業額：$'+totalAmt.toLocaleString();$('historyList').innerHTML=rows.map(r=>'<div class="item"><div><b>'+esc(r.product_name||'')+'</b><small>'+esc(r.barcode||'')+'｜'+new Date(r.sold_at).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})+'</small></div><strong>'+Number(r.quantity||0)+'盒<br>$'+Number(r.total_amount||0).toLocaleString()+'</strong></div>').join('')||'<div class="muted">這一天沒有銷售紀錄</div>'}function openAdd(){$('addModal').style.display='flex'}function closeAdd(){$('addModal').style.display='none'}function openBarcode(){fillSelects();$('barcodeModal').style.display='flex'}function closeBarcode(){$('barcodeModal').style.display='none'}function openBatch(){fillSelects();$('batchModal').style.display='flex'}function closeBatch(){$('batchModal').style.display='none'}function uniqueCode(){return 'LAO'+Date.now().toString(36).toUpperCase()+Math.floor(Math.random()*999).toString().padStart(3,'0')}function generateNewBarcode(){const c=uniqueCode();$('newbarcode').value=c;$('newBarcodePreview').classList.remove('hidden');JsBarcode('#newBarcodeSvg',c,{format:'CODE128',displayValue:true});$('newBarcodeText').textContent=c}function generateAssignBarcode(){const c=uniqueCode();$('barcodeValue').value=c;$('assignBarcodePreview').classList.remove('hidden');JsBarcode('#assignBarcodeSvg',c,{format:'CODE128',displayValue:true});$('assignBarcodeText').textContent=c}function fillSelects(){const opts=products.map(p=>'<option value="'+p.id+'">'+esc(p.product_name)+'｜'+esc(p.flavor||'未設定')+'｜庫存 '+Number(p.stock||0)+'</option>').join('');if($('barcodeProduct'))$('barcodeProduct').innerHTML=opts;if($('batchProduct'))$('batchProduct').innerHTML=opts}async function saveProduct(){const name=$('newname').value.trim(),flavor=$('newflavor').value.trim(),price=Number($('newprice').value),stock=Number($('newstock').value),barcode=$('newbarcode').value.trim()||uniqueCode();if(!name||!Number.isFinite(price)||!Number.isFinite(stock)){return $('addmsg').innerHTML='<div class="err">請完整填寫商品、價格、庫存</div>'}const{error}=await db.from('food_truck_products').insert({product_name:name,flavor,price,stock,barcode,active:true});if(error){$('addmsg').innerHTML='<div class="err">'+esc(error.message)+'</div>';return}$('addmsg').innerHTML='<div class="success">✅ 商品已新增</div>';await loadProducts();setTimeout(closeAdd,500)}async function saveBarcode(){const product_id=Number($('barcodeProduct').value),barcode=$('barcodeValue').value.trim()||uniqueCode();if(!product_id)return;const{error}=await db.from('food_truck_barcodes').insert({product_id,barcode,active:true});if(error){$('barcodemsg').innerHTML='<div class="err">'+esc(error.message)+'</div>';return}$('barcodemsg').innerHTML='<div class="success">✅ 條碼已儲存</div>';setTimeout(closeBarcode,500)}async function generateBatch(){const product_id=Number($('batchProduct').value),n=Math.min(300,Math.max(1,Number($('batchQty').value)||1)),p=products.find(x=>Number(x.id)===product_id);if(!p)return;const rows=[];for(let i=0;i<n;i++)rows.push({product_id,barcode:uniqueCode()+i,active:true});const{error}=await db.from('food_truck_barcodes').insert(rows);if(error){$('batchmsg').innerHTML='<div class="err">'+esc(error.message)+'</div>';return}batchRows=rows.map(x=>({...x,product_name:p.product_name,flavor:p.flavor||''}));$('batchmsg').innerHTML='<div class="success">✅ 已產生 '+n+' 張條碼</div>';$('batchGrid').innerHTML=batchRows.map((r,i)=>'<div class="batchLabel"><strong>'+esc(r.product_name)+'</strong><small>'+esc(r.flavor)+'</small><svg id="bc'+i+'"></svg><div class="code">'+esc(r.barcode)+'</div></div>').join('');batchRows.forEach((r,i)=>JsBarcode('#bc'+i,r.barcode,{format:'CODE128',displayValue:false,margin:2}))}function printBatch(){window.print()}function saveBatchPdf(){window.print()}async function lookupFlavor(){const q=$('flavorSearch').value.trim();if(!q)return;const{data,error}=await db.from('food_truck_products').select('*').ilike('flavor','%'+q+'%').order('id',{ascending:false});if(error){$('searchResults').innerHTML='<div class="err">'+esc(error.message)+'</div>';return}$('searchResults').innerHTML=(data||[]).map(p=>'<div class="item" onclick="showProduct('+JSON.stringify(p).replace(/</g,'\\u003c')+')"><div><b>'+esc(p.product_name)+'</b><small>'+esc(p.flavor||'')+'｜'+esc(p.barcode||'')+'</small></div><strong>$'+Number(p.price||0)+'</strong></div>').join('')||'<div class="muted">找不到商品</div>'}window.addEventListener('pagehide',stopScanner);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopScanner()});db.auth.getSession().then(async({data})=>{if(data.session&&await allowed(data.session.user.id)){$('login').style.display='none';$('app').style.display='block';$('user').textContent=data.session.user.email||'';await loadProducts();setToday();loadHistory()}});</script></body></html>
