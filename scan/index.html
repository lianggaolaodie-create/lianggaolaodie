<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171310"><title>老爹・涼糕｜獨立掃碼</title><style>*{box-sizing:border-box}body{margin:0;background:#f4efe9;color:#251e19;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(420px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 40px #0002}.logo{font-size:42px}.muted{color:#786e67}.field{margin:16px 0}.field label{display:block;font-size:14px;font-weight:800;margin-bottom:8px}.field input{width:100%;padding:14px;border:1px solid #d9cec5;border-radius:12px;font-size:16px}.btn{border:0;border-radius:13px;background:#8e5738;color:white;padding:14px 18px;font-weight:900;font-size:16px;width:100%}.err{color:#b3261e;margin-top:12px}.app{display:none;min-height:100vh}.top{background:#171310;color:#fff;padding:18px 18px 16px;position:sticky;top:0;z-index:5}.topline{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:21px;margin:0}.top small{color:#cfc5be}.wrap{max-width:620px;margin:auto;padding:16px}.scanner{background:#111;border-radius:22px;overflow:hidden;position:relative;aspect-ratio:1/1;margin-bottom:14px}.scanner video{width:100%;height:100%;object-fit:cover}.frame{position:absolute;inset:18%;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 999px #0005}.status{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px}.status .name{font-size:22px;font-weight:900}.price{font-size:30px;font-weight:900;margin-top:6px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.secondary{background:#ebe4dd;color:#332b25}.qty{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}.qty button{width:48px;height:48px;border:0;border-radius:50%;font-size:24px}.qty strong{font-size:28px;min-width:35px;text-align:center}.manual{display:flex;gap:8px;margin-top:12px}.manual input{flex:1;padding:13px;border:1px solid #d9cec5;border-radius:12px;font-size:16px}.manual button{width:auto}.success{background:#e5f4ea;color:#17613b;border-radius:14px;padding:13px;margin-top:12px;font-weight:800}.hidden{display:none}@media(min-width:700px){.scanner{aspect-ratio:16/10}}</style></head><body><div id="login" class="login"><div class="box"><div class="logo">🍡</div><h1>老爹・涼糕</h1><p class="muted">獨立掃條碼系統</p><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" onclick="login()">登入掃碼系統</button><div id="msg"></div></div></div><div id="app" class="app"><header class="top"><div class="topline"><div><h1>📷 老爹・涼糕｜掃碼</h1><small id="user"></small></div><button onclick="logout()" style="border:0;border-radius:10px;padding:9px 12px">登出</button></div></header><main class="wrap"><div class="scanner"><video id="video" playsinline muted></video><div class="frame"></div></div><div class="status"><div class="muted" id="hint">將商品條碼放入框內</div><div id="product" class="hidden"><div class="name" id="pname"></div><div class="muted" id="pbarcode"></div><div class="price" id="pprice"></div><div class="muted" id="pstock"></div><div class="qty"><button onclick="changeQty(-1)">−</button><strong id="qty">1</strong><button onclick="changeQty(1)">＋</button></div><div class="actions"><button class="btn" onclick="sell()">確認銷售</button><button class="btn secondary" onclick="clearProduct()">取消</button></div></div><div id="result"></div></div><div class="manual"><input id="manual" placeholder="也可輸入條碼，例如 LAO10001"><button class="btn" onclick="lookup()">查詢</button></div></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script><script>const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);let selected=null,qty=1,reader=null,scanning=false;function setMsg(t,err=false){$('msg').innerHTML=t?'<div class="'+(err?'err':'muted')+'">'+t+'</div>':''}async function allowed(uid){const{data:p}=await db.from('admin_profiles').select('role,enabled,can_manage_food_truck').eq('user_id',uid).maybeSingle();return p?.enabled&&(p.role==='super_admin'||p.can_manage_food_truck)}async function login(){setMsg('');const{data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return setMsg('登入失敗，請確認帳號密碼',true);if(!await allowed(data.user.id)){await db.auth.signOut();return setMsg('此帳號沒有掃碼權限',true)}showApp(data.user.email)}async function showApp(email){$('login').style.display='none';$('app').style.display='block';$('user').textContent=email||'';startScanner()}async function logout(){stopScanner();await db.auth.signOut();location.reload()}function changeQty(n){qty=Math.max(1,qty+n);$('qty').textContent=qty}async function lookup(code){code=code||$('manual').value.trim();if(!code)return;const{data,error}=await db.from('food_truck_products').select('*').eq('barcode',code).eq('active',true).maybeSingle();if(error||!data){clearProduct();$('hint').textContent='找不到此商品條碼';return}selected=data;qty=1;$('qty').textContent='1';$('hint').textContent='掃描成功';$('pname').textContent=data.product_name;$('pbarcode').textContent=data.barcode;$('pprice').textContent='$'+Number(data.price).toLocaleString();$('pstock').textContent='目前庫存：'+data.stock+' 盒';$('product').classList.remove('hidden');$('result').innerHTML=''}function clearProduct(){$('product').classList.add('hidden');$('result').innerHTML='';selected=null;qty=1;$('qty').textContent='1';$('hint').textContent='將商品條碼放入框內'}async function sell(){if(!selected)return;if(qty>selected.stock)return alert('庫存不足');const{data,error}=await db.rpc('food_truck_scan_sale',{p_barcode:selected.barcode,p_quantity:qty});if(error)return alert(error.message);const r=Array.isArray(data)?data[0]:data;$('result').innerHTML='<div class="success">✓ 銷售完成　'+selected.product_name+' × '+qty+'　$'+Number(r?.total_amount??selected.price*qty).toLocaleString()+'<br>剩餘庫存：'+(r?.remaining_stock??selected.stock-qty)+' 盒</div>';selected=null;$('product').classList.add('hidden');$('hint').textContent='可以掃描下一個商品'}async function startScanner(){try{reader=new ZXingBrowser.BrowserMultiFormatReader();scanning=true;await reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},$('video'),(result)=>{if(result&&!selected)lookup(result.getText())})}catch(e){$('hint').textContent='無法啟動相機，請改用下方輸入條碼'}}function stopScanner(){scanning=false;try{reader?.reset()}catch(e){}}$('manual').addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});(async()=>{const{data}=await db.auth.getUser();if(data.user&&await allowed(data.user.id))showApp(data.user.email)})();</script></body></html>
