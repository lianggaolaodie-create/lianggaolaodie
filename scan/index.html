<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>老爹・涼糕｜獨立掃碼</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4efe9;color:#251e19;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(420px,100%);background:#fff;border-radius:24px;padding:28px;box-shadow:0 12px 40px #0002}.field{margin:16px 0}.field label{display:block;font-size:14px;font-weight:800;margin-bottom:8px}.field input,.manualrow input{width:100%;padding:14px;border:1px solid #d9cec5;border-radius:12px;font-size:16px}.btn{border:0;border-radius:13px;background:#8e5738;color:white;padding:14px 18px;font-weight:900;font-size:16px;width:100%}.err{color:#b3261e}.app{display:none;min-height:100vh}.top{background:#171310;color:#fff;padding:18px;position:sticky;top:0;z-index:5}.topline{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:21px;margin:0}.wrap{max-width:620px;margin:auto;padding:16px}.scanner{background:#111;border-radius:22px;overflow:hidden;position:relative;aspect-ratio:1/1;margin-bottom:14px}.scanner video{width:100%;height:100%;object-fit:cover}.frame{position:absolute;inset:16%;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 999px #0005}.status{background:#fff;border-radius:18px;padding:18px;margin-bottom:14px}.tag{display:inline-block;background:#eee5dc;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}.name{font-size:22px;font-weight:900;margin-top:10px}.info{margin-top:10px;padding:13px;border-radius:13px;background:#f7f3ef;font-size:17px}.info b{display:inline-block;min-width:70px}.price{font-size:30px;font-weight:900;margin-top:10px}.stock{margin-top:5px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.secondary{background:#ebe4dd;color:#332b25}.qty{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}.qty button{width:48px;height:48px;border:0;border-radius:50%;font-size:24px}.qty strong{font-size:28px}.manualrow{display:flex;gap:8px}.manualrow input{flex:1}.manualrow .btn{width:auto}.success{background:#e5f4ea;color:#17613b;border-radius:14px;padding:13px;margin-top:12px;font-weight:800}.hidden{display:none}.notice{background:#fff4d8;border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px;line-height:1.5}.muted{color:#786e67}.hintbox{background:#f7f3ef;border-radius:12px;padding:10px;font-size:13px;color:#665b53;margin-top:10px}
</style>
</head>
<body>
<div id="login" class="login"><div class="box"><div style="font-size:42px">🍡</div><h1>老爹・涼糕</h1><p class="muted">獨立掃條碼系統</p><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" onclick="login()">登入掃碼系統</button><div id="msg"></div></div></div>
<div id="app" class="app"><header class="top"><div class="topline"><div><h1>📷 老爹・涼糕｜獨立掃碼</h1><small id="user"></small></div><button onclick="logout()" style="border:0;border-radius:10px;padding:9px 12px">登出</button></div></header>
<main class="wrap">
<div class="notice"><b>掃描條碼後，先確認商品口味，再確認銷售。</b><br>條碼 → 口味 → 售價 → 庫存 → 確認銷售</div>
<button id="cameraBtn" class="btn" style="margin-bottom:12px" onclick="startScanner()">📷 開啟相機掃描</button>
<div class="scanner"><video id="video" playsinline muted autoplay></video><div class="frame"></div></div>
<div class="status"><div class="muted" id="hint">等待掃描</div>
<div id="product" class="hidden"><span class="tag">✓ 已找到商品</span><div class="name" id="pname"></div>
<div class="info"><div><b>🍡 口味</b><span id="pflavor">—</span></div><div style="margin-top:8px"><b>🔢 條碼</b><span id="pbarcode">—</span></div></div>
<div class="price" id="pprice">$0</div><div class="muted stock" id="pstock">目前庫存：0 盒</div>
<div class="qty"><button onclick="changeQty(-1)">−</button><strong id="qty">1</strong><button onclick="changeQty(1)">＋</button></div>
<div class="actions"><button class="btn" onclick="sell()">確認銷售</button><button class="btn secondary" onclick="clearProduct()">取消</button></div></div><div id="result"></div></div>
<div class="status"><b>🔎 手動輸入條碼</b><div class="manualrow" style="margin-top:10px"><input id="manual" placeholder="例如 LAO10001"><button class="btn" onclick="lookup()">查詢</button></div><div class="hintbox">查詢後會直接顯示「口味、條碼、售價、庫存」。</div></div>
</main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>
<script>
const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);let selected=null,qty=1,reader=null,scanning=false;
async function allowed(uid){const{data:p,error}=await db.from('admin_profiles').select('role,enabled,can_manage_food_truck').eq('user_id',uid).maybeSingle();return !error&&p?.enabled&&(p.role==='super_admin'||p.can_manage_food_truck)}
function setMsg(t,e=false){$('msg').innerHTML=t?'<div class="'+(e?'err':'muted')+'">'+t+'</div>':''}
async function login(){setMsg('登入中…');const{data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return setMsg('登入失敗，請確認帳號密碼',true);if(!await allowed(data.user.id)){await db.auth.signOut();return setMsg('此帳號沒有掃碼權限',true)}showApp(data.user.email)}
function showApp(email){$('login').style.display='none';$('app').style.display='block';$('user').textContent=email||''}
async function logout(){stopScanner();await db.auth.signOut();location.reload()}
function changeQty(n){qty=Math.max(1,qty+n);$('qty').textContent=qty}
async function lookup(code){code=(code||$('manual').value).trim();if(!code)return;const{data,error}=await db.from('food_truck_products').select('id,product_name,flavor,price,barcode,stock,active').eq('barcode',code).eq('active',true).maybeSingle();if(error||!data){clearProduct();$('hint').textContent='❌ 找不到此條碼';return}showProduct(data)}
function showProduct(data){selected=data;qty=1;$('qty').textContent='1';$('hint').textContent='掃描成功，請確認以下資料';$('pname').textContent=data.product_name||'未命名商品';$('pflavor').textContent=data.flavor||'未設定口味';$('pbarcode').textContent=data.barcode||'—';$('pprice').textContent='$'+Number(data.price||0).toLocaleString();$('pstock').textContent='目前庫存：'+Number(data.stock||0)+' 盒';$('product').classList.remove('hidden');$('result').innerHTML=''}
function clearProduct(){$('product').classList.add('hidden');$('result').innerHTML='';selected=null;qty=1;$('qty').textContent='1';$('hint').textContent='等待掃描'}
async function sell(){if(!selected)return;if(qty>selected.stock)return alert('庫存不足');const{data,error}=await db.rpc('food_truck_scan_sale',{p_barcode:selected.barcode,p_quantity:qty});if(error)return alert(error.message);const r=Array.isArray(data)?data[0]:data;$('result').innerHTML='<div class="success">✓ 銷售完成<br>🍡 口味：'+(selected.flavor||'未設定')+'<br>🔢 條碼：'+selected.barcode+' × '+qty+'<br>💰 $'+Number(r?.total_amount??selected.price*qty).toLocaleString()+'<br>📦 剩餘庫存：'+(r?.remaining_stock??selected.stock-qty)+' 盒</div>';$('product').classList.add('hidden');selected=null;$('hint').textContent='可以掃描下一個商品'}
async function startScanner(){if(scanning)return;try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;await $('video').play();reader=new ZXingBrowser.BrowserMultiFormatReader();scanning=true;reader.decodeFromVideoElement($('video'),result=>{if(result&&!selected)lookup(result.getText())});$('hint').textContent='請將商品條碼放進白框';$('cameraBtn').textContent='📷 相機已開啟'}catch(e){console.error(e);$('hint').textContent='相機無法開啟，請允許相機權限或使用手動條碼查詢'} }
function stopScanner(){scanning=false;try{reader?.reset()}catch(e){}const s=$('video').srcObject;if(s)s.getTracks().forEach(t=>t.stop());$('video').srcObject=null}
$('manual').addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});(async()=>{const{data}=await db.auth.getUser();if(data.user&&await allowed(data.user.id))showApp(data.user.email)})();
</script></body></html>
