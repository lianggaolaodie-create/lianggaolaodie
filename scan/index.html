<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>老爹・涼糕｜獨立掃碼</title><style>*{box-sizing:border-box}body{margin:0;background:#f4efe9;color:#251e19;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.box,.card,.modal{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 30px #0001}.box{width:min(420px,100%)}.field{margin:12px 0}.field label{display:block;font-size:14px;font-weight:800;margin-bottom:7px}.field input,.field select{width:100%;padding:13px;border:1px solid #d9cec5;border-radius:12px;font-size:16px;background:#fff}.btn{border:0;border-radius:13px;background:#8e5738;color:#fff;padding:13px 16px;font-weight:900;font-size:16px;width:100%}.secondary{background:#ebe4dd;color:#332b25}.err{color:#b3261e}.app{display:none;min-height:100vh}.top{background:#171310;color:#fff;padding:18px;position:sticky;top:0;z-index:5}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px}.top h1{font-size:21px;margin:0}.wrap{max-width:620px;margin:auto;padding:16px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.scanner{background:#111;border-radius:22px;overflow:hidden;position:relative;aspect-ratio:1/1;margin-bottom:14px}.scanner video{width:100%;height:100%;object-fit:cover;display:block}.frame{position:absolute;inset:16%;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 999px #0005;pointer-events:none}.notice{background:#fff4d8;border-radius:14px;padding:12px;margin-bottom:12px;font-size:14px;line-height:1.5}.muted{color:#786e67}.tag{display:inline-block;background:#eee5dc;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}.name{font-size:22px;font-weight:900;margin-top:10px}.info{margin-top:10px;padding:14px;border-radius:13px;background:#f7f3ef;font-size:18px;line-height:1.5}.infoRow{display:flex;gap:8px}.infoRow+.infoRow{margin-top:9px}.info b{min-width:76px}.price{font-size:30px;font-weight:900;margin-top:10px}.qty{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}.qty button{width:48px;height:48px;border:0;border-radius:50%;font-size:24px}.qty strong{font-size:28px}.actions,.manualrow,.modalActions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.manualrow{display:flex}.manualrow input{flex:1}.manualrow .btn{width:auto}.success{background:#e5f4ea;color:#17613b;border-radius:14px;padding:13px;margin-top:12px;font-weight:800}.list{margin-top:10px}.item{background:#f7f3ef;border-radius:14px;padding:13px;margin-top:9px;display:flex;justify-content:space-between;gap:10px;align-items:center}.hidden{display:none}.modalbg{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;justify-content:center;z-index:20}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:24px 24px 0 0;box-shadow:none}.barcodePreview{text-align:center;border:1px solid #eee0d6;border-radius:14px;padding:14px;margin-top:12px}.barcodePreview svg{max-width:100%;height:auto}.genrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}.batchGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}.batchLabel{background:#fff;border:1px solid #ddd2c9;border-radius:10px;padding:9px;text-align:center}.batchLabel strong,.batchLabel small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.batchLabel small{color:#786e67}.batchLabel svg{width:100%;height:auto;max-height:70px}.batchLabel .code{font-size:12px;word-break:break-all}@media(max-width:420px){.batchGrid{grid-template-columns:1fr}}@media print{body{background:#fff}.login,.app{display:none!important}#batchModal{display:block!important;position:static;background:#fff}.batchModalBox{width:100%;max-width:none;border-radius:0;padding:0;max-height:none;overflow:visible}.batchControls,.batchTitleActions{display:none!important}.batchGrid{grid-template-columns:repeat(2,55mm);gap:3mm}.batchLabel{width:55mm;min-height:32mm;border:1px solid #999;border-radius:0;padding:2mm}.batchLabel svg{max-height:18mm}}</style></head><body><div id="login" class="login"><div class="box"><div style="font-size:42px">🍡</div><h1>老爹・涼糕</h1><p class="muted">獨立掃條碼系統</p><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button class="btn" onclick="login()">登入掃碼系統</button><div id="msg"></div></div></div><div id="app" class="app"><header class="top"><div class="topline"><div><h1>📷 老爹・涼糕｜獨立掃碼</h1><small id="user"></small></div><button onclick="logout()" style="border:0;border-radius:10px;padding:9px 12px">登出</button></div></header><main class="wrap"><div class="toolbar"><button class="btn" onclick="openAdd()">＋ 新增商品</button><button class="btn" onclick="openBarcode()">🔢 新增條碼</button><button class="btn" onclick="openBatch()">🏷️ 批量產生條碼</button><button class="btn" onclick="loadProducts()">🔄 商品管理</button></div><div id="manager" class="card hidden"><b>📦 商品管理</b><div id="productList" class="list"></div></div><div class="notice"><b>掃描條碼 → 馬上辨識口味</b><br>確認口味、條碼、售價、庫存後，再按「確認銷售」。</div><button id="cameraBtn" class="btn" style="margin-bottom:12px" onclick="startScanner()">📷 開啟相機掃描</button><div class="scanner"><video id="video" playsinline muted autoplay></video><div class="frame"></div></div><div class="card"><div class="muted" id="hint">等待掃描</div><span class="tag" id="productTag">尚未掃描</span><div class="name" id="pname">掃描後顯示商品</div><div class="info"><div class="infoRow"><b>🍡 口味</b><span id="pflavor">等待掃描</span></div><div class="infoRow"><b>🔢 條碼</b><span id="pbarcode">等待掃描</span></div></div><div class="price" id="pprice">$—</div><div class="muted" id="pstock">目前庫存：— 盒</div><div class="qty"><button onclick="changeQty(-1)">−</button><strong id="qty">1</strong><button onclick="changeQty(1)">＋</button></div><div class="actions"><button class="btn" onclick="sell()">確認銷售</button><button class="btn secondary" onclick="clearProduct()">取消</button></div><div id="result"></div></div><div class="card" style="margin-top:14px"><b>🔎 查詢商品</b><div class="field"><label>🔢 用條碼查詢</label><div class="manualrow"><input id="manual" placeholder="例如 LAO10001"><button class="btn" onclick="lookup()">查詢</button></div></div><div class="field"><label>🍡 用口味查詢</label><input id="flavorSearch" placeholder="請輸入口味"><button class="btn" onclick="lookupFlavor()" style="margin-top:8px">查詢</button></div><div id="searchResults" class="list"></div></div></main></div><div id="addModal" class="modalbg"><div class="modal"><h2>＋ 新增商品</h2><div class="field"><label>商品名稱</label><input id="newname"></div><div class="field"><label>🍡 口味</label><input id="newflavor"></div><div class="field"><label>💰 價格</label><input id="newprice" type="number" min="0"></div><div class="field"><label>📦 初始庫存</label><input id="newstock" type="number" min="0" value="0"></div><div class="field"><label>🔢 條碼</label><div class="genrow"><input id="newbarcode"><button class="btn" type="button" onclick="generateNewBarcode()">⚡ 自動產生</button></div><div id="newBarcodePreview" class="barcodePreview hidden"><svg id="newBarcodeSvg"></svg></div></div><div id="addmsg"></div><div class="modalActions"><button class="btn secondary" onclick="closeAdd()">取消</button><button class="btn" onclick="saveProduct()">儲存商品</button></div></div></div><div id="barcodeModal" class="modalbg"><div class="modal"><h2>🔢 新增條碼</h2><div class="field"><label>🍡 選擇商品</label><select id="barcodeProduct"></select></div><div class="field"><label>🔢 條碼</label><div class="genrow"><input id="barcodeValue"><button class="btn" type="button" onclick="generateAssignBarcode()">⚡ 自動產生</button></div></div><div id="barcodemsg"></div><div class="modalActions"><button class="btn secondary" onclick="closeBarcode()">取消</button><button class="btn" onclick="saveBarcode()">儲存條碼</button></div></div></div><div id="batchModal" class="modalbg"><div class="modal batchModalBox"><div class="batchTitleActions" style="display:flex;justify-content:space-between"><h2>🏷️ 批量產生條碼</h2><button class="btn secondary" style="width:auto" onclick="closeBatch()">關閉</button></div><div class="batchControls"><div class="field"><label>🍡 選擇商品</label><select id="batchProduct"></select></div><div class="field"><label>🔢 要產生幾張</label><input id="batchQty" type="number" min="1" max="300" value="10"></div><button class="btn" onclick="generateBatch()">⚡ 產生條碼</button><div id="batchmsg"></div></div><div id="batchGrid" class="batchGrid"></div><div class="batchTools batchControls" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"><button class="btn" onclick="printBatch()">🖨️ 列印全部</button><button class="btn secondary" onclick="printBatch()">📄 列印／另存 PDF</button></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script>const db=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB');const $=id=>document.getElementById(id);let selected=null,qty=1,reader=null,scannerControls=null,scanning=false,products=[],batchRows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function allowed(uid){const{data:p,error}=await db.from('admin_profiles').select('role,enabled,can_manage_food_truck').eq('user_id',uid).maybeSingle();return !error&&p?.enabled&&(p.role==='super_admin'||p.can_manage_food_truck)}function setMsg(t,e=false){$('msg').innerHTML=t?'<div class="'+(e?'err':'muted')+'">'+esc(t)+'</div>':''}async function login(){setMsg('登入中…');const{data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){setMsg(error.message,true);return}if(!data.user||!(await allowed(data.user.id))){await db.auth.signOut();setMsg('此帳號沒有掃碼系統權限',true);return}$('login').style.display='none';$('app').style.display='block';$('user').textContent=data.user.email||'';await loadProducts()}async function logout(){stopScanner();await db.auth.signOut();location.reload()}async function startScanner(){if(scanning)return;if(!window.isSecureContext){$('hint').textContent='❌ 請使用 HTTPS 網址開啟掃碼頁';return}if(!navigator.mediaDevices?.getUserMedia){$('hint').textContent='❌ 此裝置瀏覽器不提供相機功能';return}if(!window.ZXingBrowser){$('hint').textContent='❌ 掃描元件尚未載入，請重新整理';return}try{stopScanner();selected=null;qty=1;$('qty').textContent='1';$('hint').textContent='正在開啟後鏡頭…';$('cameraBtn').textContent='⏹️ 停止掃描';reader=new ZXingBrowser.BrowserMultiFormatReader();scanning=true;scannerControls=await reader.decodeFromConstraints({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}},$('video'),(result,error)=>{if(result&&!selected){const code=result.getText().trim();if(code){try{navigator.vibrate?.(60)}catch(e){}lookup(code)}}});$('hint').textContent='正在掃描，請把條碼放在白框內'}catch(e){console.error(e);stopScanner();$('hint').textContent='❌ 相機啟動失敗：'+(e?.name||'未知錯誤')+' '+(e?.message||'')+'；請確認 Safari 相機權限後重試'}}function stopScanner(){scanning=false;try{scannerControls?.stop?.()}catch(e){}try{reader?.reset?.()}catch(e){}scannerControls=null;reader=null;const v=$('video');if(v?.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}if($('cameraBtn'))$('cameraBtn').textContent='📷 開啟相機掃描'}async function lookup(code){code=(code||$('manual').value).trim();if(!code)return;$('hint').textContent='查詢條碼中…';const{data:b}=await db.from('food_truck_barcodes').select('barcode,product_id').eq('barcode',code).eq('active',true).maybeSingle();let q=db.from('food_truck_products').select('*');if(b?.product_id)q=q.eq('id',b.product_id);else q=q.eq('barcode',code);const{data:p,error}=await q.maybeSingle();if(error||!p){$('hint').textContent='❌ 找不到此條碼商品：'+code;return}showProduct({...p,barcode:b?.barcode||p.barcode})}function showProduct(p){selected=p;qty=1;$('qty').textContent='1';$('productTag').textContent='已辨識';$('pname').textContent=p.product_name||'未命名';$('pflavor').textContent=p.flavor||'未設定';$('pbarcode').textContent=p.barcode||'';$('pprice').textContent='$'+Number(p.price||0);$('pstock').textContent='目前庫存：'+Number(p.stock||0)+' 盒';$('hint').textContent='✅ 已找到商品'}async function lookupFlavor(){const s=$('flavorSearch').value.trim();if(!s)return;const{data,error}=await db.from('food_truck_products').select('*').ilike('flavor','%'+s+'%').order('id');if(error){$('searchResults').innerHTML='<div class="err">查詢失敗</div>';return}$('searchResults').innerHTML=(data||[]).map(p=>'<div class="item"><div><b>'+esc(p.product_name)+'</b><small>'+esc(p.flavor||'')+'｜$'+Number(p.price||0)+'｜庫存 '+Number(p.stock||0)+' 盒</small></div><button class="btn" style="width:auto" onclick="lookup(\''+esc(p.barcode||'')+'\')">選擇</button></div>').join('')||'<div class="muted">找不到商品</div>'}function changeQty(n){if(!selected)return;qty=Math.max(1,Math.min(Number(selected.stock||0)||1,qty+n));$('qty').textContent=qty}async function sell(){if(!selected||qty<1)return;$('result').innerHTML='<div class="muted">銷售處理中…</div>';const{data,error}=await db.rpc('food_truck_scan_sale',{p_barcode:selected.barcode,p_quantity:qty});if(error){$('result').innerHTML='<div class="err">❌ '+esc(error.message)+'</div>';return}const r=Array.isArray(data)?data[0]:data;selected.stock=Number(r?.remaining_stock??0);$('pstock').textContent='目前庫存：'+selected.stock+' 盒';$('result').innerHTML='<div class="success">✅ 銷售完成！已扣 '+qty+' 盒，剩餘 '+selected.stock+' 盒</div>';qty=1;$('qty').textContent='1'}function clearProduct(){selected=null;qty=1;$('qty').textContent='1';$('productTag').textContent='尚未掃描';$('pname').textContent='掃描後顯示商品';$('pflavor').textContent='等待掃描';$('pbarcode').textContent='等待掃描';$('pprice').textContent='$—';$('pstock').textContent='目前庫存：— 盒';$('result').innerHTML=''}async function loadProducts(){const{data}=await db.from('food_truck_products').select('*').order('id');products=data||[];$('productList').innerHTML=products.map(p=>'<div class="item"><div><b>'+esc(p.product_name)+'</b><small>'+esc(p.flavor||'')+'｜條碼 '+esc(p.barcode||'')+'｜$'+Number(p.price||0)+'｜庫存 '+Number(p.stock||0)+' 盒</small></div></div>').join('')||'<div class="muted">目前沒有商品</div>';fillSelect('barcodeProduct');fillSelect('batchProduct');$('manager').classList.toggle('hidden',!products.length)}function fillSelect(id){const s=$(id);if(!s)return;s.innerHTML=products.map(p=>'<option value="'+p.id+'">'+esc(p.product_name)+'｜'+esc(p.flavor||'')+'</option>').join('')}function openAdd(){$('addModal').style.display='flex'}function closeAdd(){$('addModal').style.display='none'}function uniqueCode(){return'LAO'+Date.now().toString(36).toUpperCase()+Math.random().toString(36).slice(2,7).toUpperCase()}function generateNewBarcode(){$('newbarcode').value=uniqueCode();preview('newbarcode','newBarcodePreview','newBarcodeSvg')}function preview(input,box,svg){const v=$(input).value.trim();if(!v)return;$(box).classList.remove('hidden');try{JsBarcode('#'+svg,v,{format:'CODE128',displayValue:true,height:55,margin:8})}catch(e){}}async function saveProduct(){const name=$('newname').value.trim(),flavor=$('newflavor').value.trim(),price=Number($('newprice').value||0),stock=Number($('newstock').value||0),barcode=$('newbarcode').value.trim()||uniqueCode();if(!name){$('addmsg').innerHTML='<div class="err">請輸入商品名稱</div>';return}const{data,error}=await db.from('food_truck_products').insert({product_name:name,flavor,price,stock,barcode,active:true}).select().single();if(error){$('addmsg').innerHTML='<div class="err">'+esc(error.message)+'</div>';return}await loadProducts();closeAdd();$('newname').value='';$('newflavor').value='';$('newprice').value='';$('newstock').value='0';$('newbarcode').value='';showProduct(data)}function openBarcode(){fillSelect('barcodeProduct');$('barcodeModal').style.display='flex'}function closeBarcode(){$('barcodeModal').style.display='none'}function generateAssignBarcode(){$('barcodeValue').value=uniqueCode()}async function saveBarcode(){const product_id=Number($('barcodeProduct').value),barcode=$('barcodeValue').value.trim()||uniqueCode();const{error}=await db.from('food_truck_barcodes').insert({product_id,barcode,active:true});if(error){$('barcodemsg').innerHTML='<div class="err">'+esc(error.message)+'</div>';return}closeBarcode();$('barcodeValue').value='';await loadProducts()}function openBatch(){fillSelect('batchProduct');$('batchModal').style.display='flex'}function closeBatch(){$('batchModal').style.display='none'}async function generateBatch(){const product_id=Number($('batchProduct').value),n=Math.max(1,Math.min(300,Number($('batchQty').value||10)));const rows=[];for(let i=0;i<n;i++)rows.push({product_id,barcode:uniqueCode(),active:true});const{error}=await db.from('food_truck_barcodes').insert(rows);if(error){$('batchmsg').innerHTML='<div class="err">'+esc(error.message)+'</div>';return}batchRows=rows;const p=products.find(x=>x.id===product_id);$('batchGrid').innerHTML=rows.map((r,i)=>'<div class="batchLabel"><strong>'+esc(p?.product_name||'商品')+'</strong><small>'+esc(p?.flavor||'')+'</small><svg id="bc'+i+'"></svg><div class="code">'+esc(r.barcode)+'</div></div>').join('');rows.forEach((r,i)=>{try{JsBarcode('#bc'+i,r.barcode,{format:'CODE128',displayValue:false,height:55,margin:4})}catch(e){}});$('batchmsg').innerHTML='<div class="success">✅ 已產生 '+n+' 張條碼</div>'}function printBatch(){window.print()}function saveBatchPdf(){window.print()}window.addEventListener('pagehide',stopScanner);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopScanner()});window.addEventListener('load',()=>{if(!window.ZXingBrowser)$('hint').textContent='❌ 掃描元件載入失敗，請重新整理頁面'})</script></body></html>
