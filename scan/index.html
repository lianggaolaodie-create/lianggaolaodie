<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>老爹・涼糕｜獨立掃碼</title><style>*{box-sizing:border-box}body{margin:0;background:#f4efe9;color:#251e19;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.box,.card,.modal{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 30px #0001}.box{width:min(420px,100%)}.field{margin:12px 0}.field label{display:block;font-size:14px;font-weight:800;margin-bottom:7px}.field input,.field select{width:100%;padding:13px;border:1px solid #d9cec5;border-radius:12px;font-size:16px;background:#fff}.btn{border:0;border-radius:13px;background:#8e5738;color:#fff;padding:13px 16px;font-weight:900;font-size:16px;width:100%}.err{color:#b3261e}.muted{color:#786e67}.app{display:none;min-height:100vh}.top{background:#171310;color:#fff;padding:18px;position:sticky;top:0;z-index:5}.topline{display:flex;justify-content:space-between;align-items:center}.wrap{max-width:620px;margin:auto;padding:16px}.toolbar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}.stat{background:#fff;border-radius:16px;padding:14px;text-align:center}.stat b{display:block;font-size:27px;margin-top:4px}.notice{background:#fff4d8;border-radius:14px;padding:12px;margin-bottom:12px;line-height:1.5}.scanner{background:#111;border-radius:22px;overflow:hidden;position:relative;aspect-ratio:1;margin-bottom:14px}.scanner video{width:100%;height:100%;object-fit:cover;display:block}.frame{position:absolute;inset:16%;border:3px solid #fff;border-radius:18px;box-shadow:0 0 0 999px #0005;pointer-events:none}.card{margin-top:12px}.tag{display:inline-block;background:#eee5dc;border-radius:999px;padding:6px 10px;font-size:13px;font-weight:800}.name{font-size:22px;font-weight:900;margin-top:10px}.info{margin-top:10px;padding:14px;border-radius:13px;background:#f7f3ef;font-size:18px;line-height:1.5}.price{font-size:30px;font-weight:900;margin-top:10px}.qty{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0}.qty button{width:48px;height:48px;border:0;border-radius:50%;font-size:24px}.qty strong{font-size:28px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.secondary{background:#ebe4dd;color:#332b25}.success{background:#e5f4ea;color:#17613b;border-radius:14px;padding:13px;margin-top:12px;font-weight:800}.list .item{background:#f7f3ef;border-radius:14px;padding:13px;margin-top:9px;display:flex;justify-content:space-between;gap:12px}.modalbg{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;border-radius:24px 24px 0 0}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.printActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.printActions .btn{font-size:17px;padding:15px}.historySummary{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.historySummary .stat{padding:12px}.historySummary b{font-size:24px}.historyItem{background:#f7f3ef;border-radius:14px;padding:12px;margin-top:8px}.historyItem .line{display:flex;justify-content:space-between;gap:10px}.historyItem small{color:#786e67}@media(max-width:420px){.grid{grid-template-columns:1fr}}@media print{.login,.app{display:none!important}#batchModal{display:flex!important;position:static;background:#fff}.batchControls,.printActions{display:none!important}#batchGrid{display:grid!important;grid-template-columns:1fr 1fr;gap:10px}.barcodeCard{break-inside:avoid}}</style></head><body><div id="login" class="login"><div class="box"><div style="font-size:42px">🍡</div><h1>老爹・涼糕</h1><p class="muted">獨立掃條碼系統</p><div class="field"><label>管理員 Email</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn" type="button">登入掃碼系統</button><div id="msg"></div></div></div><div id="app" class="app"><header class="top"><div class="topline"><div><b>📷 老爹・涼糕｜獨立掃碼</b><br><small id="user"></small></div><button id="logoutBtn" style="border:0;border-radius:10px;padding:9px 12px">登出</button></div></header><main class="wrap"><div class="stats"><div class="stat">📦 今日銷售數量<b id="todayQty">0 盒</b></div><div class="stat">💰 今日營業額<b id="todayRevenue">$0</b></div></div><div class="toolbar"><button class="btn" id="addBtn">＋ 新增商品</button><button class="btn" id="barcodeBtn">🔢 新增條碼</button><button class="btn" id="batchBtn">🏷️ 批量產生條碼</button><button class="btn" id="manageBtn">🔄 商品管理</button><button class="btn" id="historyBtn">📊 銷售歷史紀錄</button></div><div id="manager" class="card hidden"><b>📦 商品管理</b><div id="productList" class="list"></div></div><div class="notice"><b>掃描條碼 → 馬上辨識口味</b><br>確認口味、條碼、售價、庫存後，再按「確認銷售」。</div><button id="cameraBtn" class="btn">📷 開啟相機掃描</button><div class="scanner"><video id="video" playsinline muted autoplay></video><div class="frame"></div></div><div class="card"><div id="hint" class="muted">等待掃描商品條碼</div><span class="tag" id="productTag">尚未掃描</span><div class="name" id="pname">掃描後顯示商品</div><div class="info">🍡 口味：<span id="pflavor">等待掃描</span><br>🔢 條碼：<span id="pbarcode">等待掃描</span></div><div class="price" id="pprice">$—</div><div class="muted" id="pstock">目前庫存：— 盒</div><div class="qty"><button id="minus">−</button><strong id="qty">1</strong><button id="plus">＋</button></div><div class="actions"><button class="btn" id="sellBtn">確認銷售</button><button class="btn secondary" id="clearBtn">取消</button></div><div id="result"></div></div><div class="card"><b>🔎 查詢商品</b><div class="field"><label>條碼</label><input id="manual" placeholder="例如 LAO3417606387668"><button class="btn" id="manualBtn" style="margin-top:8px">查詢</button></div><div class="field"><label>口味</label><input id="flavorSearch" placeholder="請輸入口味"><button class="btn" id="flavorBtn" style="margin-top:8px">查詢</button></div><div id="searchResults" class="list"></div></div></main></div><div id="addModal" class="modalbg"><div class="modal"><h2>＋ 新增商品</h2><div class="field"><label>商品名稱</label><input id="newname"></div><div class="field"><label>口味</label><input id="newflavor"></div><div class="field"><label>價格</label><input id="newprice" type="number"></div><div class="field"><label>初始庫存</label><input id="newstock" type="number" value="0"></div><div class="field"><label>條碼（留空自動產生）</label><input id="newbarcode"></div><div id="addmsg"></div><div class="grid"><button class="btn secondary" id="addClose">取消</button><button class="btn" id="saveProductBtn">儲存商品</button></div></div></div><div id="barcodeModal" class="modalbg"><div class="modal"><h2>🔢 新增條碼</h2><div class="field"><label>商品</label><select id="barcodeProduct"></select></div><div class="field"><label>條碼</label><input id="barcodeValue"></div><div id="barcodemsg"></div><div class="grid"><button class="btn secondary" id="barcodeClose">取消</button><button class="btn" id="saveBarcodeBtn">儲存條碼</button></div></div></div><div id="batchModal" class="modalbg"><div class="modal"><h2>🏷️ 批量產生條碼</h2><div class="batchControls"><div class="field"><label>商品</label><select id="batchProduct"></select></div><div class="field"><label>數量</label><input id="batchQty" type="number" min="1" max="300" value="10"></div><button class="btn" id="generateBtn">⚡ 產生條碼</button><button class="btn secondary" id="batchClose" style="margin-top:8px">關閉</button><div id="batchmsg"></div></div><div class="printActions"><button class="btn" id="downloadBtn">⬇️ 下載條碼</button><button class="btn" id="printBtn">🖨️ 列印條碼</button></div><div id="batchGrid" class="grid"></div></div></div><div id="historyModal" class="modalbg"><div class="modal"><h2>📊 銷售歷史紀錄</h2><div class="grid"><div class="field"><label>開始日期</label><input id="historyStart" type="date"></div><div class="field"><label>結束日期</label><input id="historyEnd" type="date"></div></div><button class="btn" id="historySearchBtn">🔎 查詢這段日期</button><div id="historyMsg" class="muted" style="margin-top:10px"></div><div id="historySummary" class="historySummary"></div><div id="historyList" class="list"></div><button class="btn secondary" id="historyClose" style="margin-top:12px">關閉</button></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.1/umd/zxing-browser.min.js?v=20260920"></script><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script>const SUPA='https://yemzdwxtyosuaczsqwea.supabase.co',KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB';let db=null,selected=null,qty=1,reader=null,controls=null,scanning=false,products=[];const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pad=n=>String(n).padStart(2,'0');const localDate=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());function msg(t,err=false){$('msg').innerHTML=t?'<div class="'+(err?'err':'muted')+'">'+esc(t)+'</div>':''}function init(){if(!window.supabase){msg('❌ 登入元件載入失敗，請重新整理',true);return false}db=window.supabase.createClient(SUPA,KEY);return true}async function allowed(uid){const{data,error}=await db.from('admin_profiles').select('role,enabled,can_manage_food_truck').eq('user_id',uid).maybeSingle();return !error&&data?.enabled&&(data.role==='super_admin'||data.can_manage_food_truck)}async function showUser(u){$('login').style.display='none';$('app').style.display='block';$('user').textContent=u.email||'';await loadProducts();await loadTodayStats()}async function login(){if(!init())return;const email=$('email').value.trim(),password=$('password').value;if(!email||!password){msg('請輸入 Email 與密碼',true);return}const b=$('loginBtn');b.disabled=true;b.textContent='登入中…';msg('');try{const{data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;if(!data.user||!(await allowed(data.user.id))){await db.auth.signOut();throw new Error('此帳號沒有掃碼系統權限')}await showUser(data.user)}catch(e){msg(e?.message||'登入失敗，請稍後再試',true)}finally{b.disabled=false;b.textContent='登入掃碼系統'}}async function logout(){stopScanner();if(db)await db.auth.signOut();location.reload()}async function restore(){if(!init())return;try{const{data}=await db.auth.getSession();if(data?.session?.user&&await allowed(data.session.user.id))await showUser(data.session.user)}catch(e){console.error(e)}}async function loadTodayStats(){if(!db)return;const start=new Date();start.setHours(0,0,0,0);const end=new Date(start);end.setDate(end.getDate()+1);const{data,error}=await db.from('food_truck_sales').select('quantity,total_amount,sold_at').gte('sold_at',start.toISOString()).lt('sold_at',end.toISOString());if(error){console.error(error);return}const rows=data||[];$('todayQty').textContent=rows.reduce((s,r)=>s+Number(r.quantity||0),0)+' 盒';$('todayRevenue').textContent='$'+rows.reduce((s,r)=>s+Number(r.total_amount||0),0).toLocaleString()}async function queryHistory(){if(!db)return;let s=$('historyStart').value,e=$('historyEnd').value;if(!s||!e){$('historyMsg').textContent='請選擇開始日期與結束日期';return}if(s>e){$('historyMsg').textContent='開始日期不能晚於結束日期';return}const from=new Date(s+'T00:00:00'),to=new Date(e+'T00:00:00');to.setDate(to.getDate()+1);$('historyMsg').textContent='查詢中…';const{data,error}=await db.from('food_truck_sales').select('id,quantity,total_amount,sold_at,product_name,barcode,unit_price').gte('sold_at',from.toISOString()).lt('sold_at',to.toISOString()).order('sold_at',{ascending:false});if(error){$('historyMsg').innerHTML='<span class="err">❌ '+esc(error.message)+'</span>';return}const rows=data||[],totalQty=rows.reduce((a,r)=>a+Number(r.quantity||0),0),totalRevenue=rows.reduce((a,r)=>a+Number(r.total_amount||0),0);$('historyMsg').textContent='查詢 '+s+' ～ '+e+'，共 '+rows.length+' 筆銷售';$('historySummary').innerHTML='<div class="stat">📦 銷售數量<b>'+totalQty+' 盒</b></div><div class="stat">💰 營業額<b>$'+totalRevenue.toLocaleString()+'</b></div>';$('historyList').innerHTML=rows.map(r=>{const d=new Date(r.sold_at);return'<div class="historyItem"><div class="line"><b>'+esc(r.product_name||'商品')+'</b><b>'+Number(r.quantity||0)+' 盒</b></div><div class="line"><small>'+d.toLocaleString('zh-TW')+'｜$'+Number(r.unit_price||0)+'／盒</small><b>$'+Number(r.total_amount||0).toLocaleString()+'</b></div><small>條碼：'+esc(r.barcode||'')+'</small></div>'}).join('')||'<div class="muted" style="padding:12px">這段日期沒有銷售紀錄</div>'}function openHistory(){const t=new Date();$('historyStart').value=localDate(t);$('historyEnd').value=localDate(t);openModal('historyModal');queryHistory()}function stopScanner(){scanning=false;try{controls?.stop?.()}catch(e){}try{reader?.reset?.()}catch(e){}controls=null;reader=null;const v=$('video');if(v?.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}$('cameraBtn').textContent='📷 開啟相機掃描'}async function startScanner(){if(scanning)return;const h=$('hint');if(!window.isSecureContext){h.textContent='❌ 請使用 HTTPS 開啟';return}if(!navigator.mediaDevices?.getUserMedia){h.textContent='❌ 瀏覽器不支援相機';return}if(!window.ZXingBrowser){h.textContent='❌ 掃描元件尚未載入，請重新整理';return}try{stopScanner();h.textContent='正在開啟後鏡頭…';reader=new ZXingBrowser.BrowserMultiFormatReader();scanning=true;let cams=[];try{cams=await ZXingBrowser.BrowserCodeReader.listVideoInputDevices()}catch(e){}const cam=cams.find(x=>/back|rear|environment/i.test(x.label))||cams[cams.length-1];controls=await reader.decodeFromVideoDevice(cam?.deviceId??null,$('video'),r=>{if(r&&!selected){const c=r.getText().trim();if(c)lookup(c)}});h.textContent='正在掃描，請把條碼放在白框內'}catch(e){console.error(e);stopScanner();h.textContent='❌ 相機啟動失敗：'+(e?.name||'未知錯誤')+(e?.message?'｜'+e.message:'')}}async function lookup(code){code=(code??$('manual').value).trim();if(!code||!db)return;$('hint').textContent='查詢條碼中…';let{data:p}=await db.from('food_truck_barcodes').select('product_id,barcode,active,food_truck_products(id,product_name,flavor,price,stock,active)').eq('barcode',code).eq('active',true).maybeSingle();if(!p){const r=await db.from('food_truck_products').select('*').eq('barcode',code).maybeSingle();if(r.data)p={barcode:r.data.barcode,food_truck_products:r.data}}if(!p?.food_truck_products){$('result').innerHTML='<div class="err">❌ 找不到此條碼</div>';return}selected={...p.food_truck_products,barcode:p.barcode||code};qty=1;render();$('hint').textContent='已辨識條碼'}function render(){$('productTag').textContent='已掃描';$('pname').textContent=selected.product_name||'—';$('pflavor').textContent=selected.flavor||'—';$('pbarcode').textContent=selected.barcode||'—';$('pprice').textContent='$'+Number(selected.price||0);$('pstock').textContent='目前庫存：'+Number(selected.stock||0)+' 盒';$('qty').textContent=qty}function change(n){if(!selected)return;qty=Math.max(1,Math.min(Number(selected.stock||0)||1,qty+n));$('qty').textContent=qty}function clearProduct(){selected=null;qty=1;$('productTag').textContent='尚未掃描';$('pname').textContent='掃描後顯示商品';$('pflavor').textContent='等待掃描';$('pbarcode').textContent='等待掃描';$('pprice').textContent='$—';$('pstock').textContent='目前庫存：— 盒';$('qty').textContent='1';$('result').innerHTML=''}async function sell(){if(!selected)return;const soldQty=qty;$('result').innerHTML='<div class="muted">銷售處理中…</div>';const{data,error}=await db.rpc('food_truck_scan_sale',{p_barcode:selected.barcode,p_quantity:soldQty});if(error){$('result').innerHTML='<div class="err">❌ '+esc(error.message)+'</div>';return}const r=Array.isArray(data)?data[0]:data;selected.stock=Number(r?.remaining_stock??0);$('pstock').textContent='目前庫存：'+selected.stock+' 盒';$('result').innerHTML='<div class="success">✅ 銷售完成！已扣 '+soldQty+' 盒，剩餘 '+selected.stock+' 盒</div>';qty=1;$('qty').textContent='1';await loadTodayStats();await loadProducts()}async function loadProducts(){if(!db)return;const{data,error}=await db.from('food_truck_products').select('*').order('id',{ascending:false});if(error)return;products=data||[];$('manager').classList.remove('hidden');$('productList').innerHTML=products.map(p=>'<div class="item"><div><b>'+esc(p.product_name)+'</b><br><small>'+esc(p.flavor||'')+'｜$'+Number(p.price||0)+'｜'+esc(p.barcode||'—')+'</small></div><b>'+Number(p.stock||0)+'盒</b></div>').join('');const opts=products.map(p=>'<option value="'+p.id+'">'+esc(p.product_name)+'｜'+esc(p.flavor||'')+'</option>').join('');$('barcodeProduct').innerHTML=opts;$('batchProduct').innerHTML=opts}function openModal(id){$(id).style.display='flex'}function closeModal(id){$(id).style.display='none'}function code(){return'LAO'+Date.now()+Math.floor(Math.random()*900+100)}async function saveProduct(){const name=$('newname').value.trim(),flavor=$('newflavor').value.trim(),price=Number($('newprice').value||0),stock=Number($('newstock').value||0),barcode=$('newbarcode').value.trim()||code();if(!name){$('addmsg').innerHTML='<div class="err">請輸入商品名稱</div>';return}const{error}=await db.from('food_truck_products').insert({product_name:name,flavor,price,stock,barcode,active:true});$('addmsg').innerHTML=error?'<div class="err">❌ '+esc(error.message)+'</div>':'<div class="success">✅ 商品已新增</div>';if(!error)await loadProducts()}async function saveBarcode(){const product_id=Number($('barcodeProduct').value),barcode=$('barcodeValue').value.trim()||code();const{error}=await db.from('food_truck_barcodes').insert({product_id,barcode,active:true});$('barcodemsg').innerHTML=error?'<div class="err">❌ '+esc(error.message)+'</div>':'<div class="success">✅ 條碼已新增</div>';if(!error)await loadProducts()}async function generateBatch(){const product_id=Number($('batchProduct').value),n=Math.max(1,Math.min(300,Number($('batchQty').value||10))),rows=Array.from({length:n},()=>({product_id,barcode:code()}));const{error}=await db.from('food_truck_barcodes').insert(rows);if(error){$('batchmsg').innerHTML='<div class="err">❌ '+esc(error.message)+'</div>';return}const p=products.find(x=>x.id===product_id);$('batchmsg').innerHTML='<div class="success">✅ 已產生 '+n+' 張不同條碼</div>';$('batchGrid').innerHTML=rows.map((r,i)=>'<div class="barcodeCard" style="background:#fff;padding:10px;text-align:center;border:1px solid #ddd;border-radius:12px"><b>'+esc(p?.product_name||'')+'</b><br><small>'+esc(p?.flavor||'')+'</small><svg id="bc'+i+'"></svg><br><small>'+esc(r.barcode)+'</small></div>').join('');rows.forEach((r,i)=>{try{JsBarcode('#bc'+i,r.barcode,{format:'CODE128',displayValue:true,height:65,margin:2,fontSize:14})}catch(e){}})}function printBarcodes(){if(!$('batchGrid').innerHTML.trim()){$('batchmsg').innerHTML='<div class="err">❌ 請先產生條碼</div>';return}window.print()}function downloadBarcodes(){if(!$('batchGrid').innerHTML.trim()){$('batchmsg').innerHTML='<div class="err">❌ 請先產生條碼</div>';return}const html='<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜條碼</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;margin:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.barcodeCard{background:#fff;padding:10px;text-align:center;border:1px solid #ddd;border-radius:12px;break-inside:avoid}.barcodeCard svg{max-width:100%;height:auto}</style></head><body><h2>老爹・涼糕｜條碼</h2><div class="grid">'+$('batchGrid').innerHTML+'</div></body></html>';const blob=new Blob([html],{type:'text/html;charset=utf-8'});const file=new File([blob],'老爹涼糕_條碼.html',{type:'text/html'});if(navigator.share&&navigator.canShare?.({files:[file]})){navigator.share({title:'老爹・涼糕｜條碼',files:[file]}).catch(()=>{});return}const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='老爹涼糕_條碼_'+localDate(new Date())+'.html';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}async function lookupFlavor(){const q=$('flavorSearch').value.trim();if(!q)return;const{data}=await db.from('food_truck_products').select('*').ilike('flavor','%'+q+'%');$('searchResults').innerHTML=(data||[]).map(p=>'<div class="item"><span><b>'+esc(p.product_name)+'</b><br><small>'+esc(p.flavor||'')+'｜$'+Number(p.price||0)+'｜'+esc(p.barcode||'')+'</small></span><b>'+Number(p.stock||0)+'盒</b></div>').join('')||'<div class="muted">查無商品</div>'}document.addEventListener('DOMContentLoaded',()=>{$('loginBtn').addEventListener('click',login);$('logoutBtn').addEventListener('click',logout);$('cameraBtn').addEventListener('click',()=>scanning?stopScanner():startScanner());$('minus').addEventListener('click',()=>change(-1));$('plus').addEventListener('click',()=>change(1));$('sellBtn').addEventListener('click',sell);$('clearBtn').addEventListener('click',clearProduct);$('manualBtn').addEventListener('click',()=>lookup());$('flavorBtn').addEventListener('click',lookupFlavor);$('addBtn').addEventListener('click',()=>openModal('addModal'));$('addClose').addEventListener('click',()=>closeModal('addModal'));$('saveProductBtn').addEventListener('click',saveProduct);$('barcodeBtn').addEventListener('click',async()=>{await loadProducts();openModal('barcodeModal')});$('barcodeClose').addEventListener('click',()=>closeModal('barcodeModal'));$('saveBarcodeBtn').addEventListener('click',saveBarcode);$('batchBtn').addEventListener('click',async()=>{await loadProducts();openModal('batchModal')});$('batchClose').addEventListener('click',()=>closeModal('batchModal'));$('generateBtn').addEventListener('click',generateBatch);$('downloadBtn').addEventListener('click',downloadBarcodes);$('printBtn').addEventListener('click',printBarcodes);$('manageBtn').addEventListener('click',loadProducts);$('historyBtn').addEventListener('click',openHistory);$('historySearchBtn').addEventListener('click',queryHistory);$('historyClose').addEventListener('click',()=>closeModal('historyModal'));restore()});document.addEventListener('visibilitychange',()=>{if(document.hidden)stopScanner()});window.addEventListener('pagehide',stopScanner);</script></body></html>
