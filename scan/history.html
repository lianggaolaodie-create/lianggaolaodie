<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>老爹・涼糕｜歷史銷售</title><style>*{box-sizing:border-box}body{margin:0;background:#f4efe9;color:#251e19;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.top{background:#171310;color:#fff;padding:18px}.wrap{max-width:680px;margin:auto;padding:16px}.card{background:#fff;border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:0 8px 30px #0001}.title{font-size:25px;font-weight:900}.muted{color:#786e67}.field label{display:block;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:14px;border:1px solid #d9cec5;border-radius:12px;font-size:18px;background:#fff}.btn{border:0;border-radius:13px;background:#8e5738;color:#fff;padding:14px 16px;font-weight:900;font-size:17px;width:100%;margin-top:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}.stat{background:#f7f3ef;border-radius:15px;padding:15px;text-align:center}.stat span{display:block;font-size:15px}.stat b{display:block;font-size:29px;margin-top:5px}.item{background:#f7f3ef;border-radius:14px;padding:13px;margin-top:9px;display:flex;justify-content:space-between;gap:12px}.item b{font-size:17px}.err{color:#b3261e}.back{display:inline-block;color:#fff;text-decoration:none;font-weight:800;margin-top:8px}.empty{text-align:center;padding:25px;color:#786e67}@media(max-width:420px){.stats{grid-template-columns:1fr 1fr}.item{font-size:14px}}</style></head><body><header class="top"><div class="title">📊 老爹・涼糕｜歷史銷售</div><div id="user" class="muted"></div><a class="back" href="./index.html">← 回掃碼系統</a></header><main class="wrap"><section class="card"><div class="field"><label>選擇日期</label><input id="date" type="date"></div><button id="query" class="btn">🔎 查詢這一天</button><div id="msg"></div></section><section class="card"><div class="stats"><div class="stat"><span>📦 銷售數量</span><b id="qty">0 盒</b></div><div class="stat"><span>💰 營業額</span><b id="revenue">$0</b></div></div></section><section class="card"><h2>🧾 銷售紀錄</h2><div id="list"><div class="empty">請選擇日期查詢</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPA='https://yemzdwxtyosuaczsqwe7c.supabase.co'.replace('sqwe7c','sqwea'),KEY='sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB',db=window.supabase.createClient(SUPA,KEY),$=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function localDate(){const d=new Date();return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Taipei'}).format(d)}async function allowed(uid){const{data,error}=await db.from('admin_profiles').select('role,enabled,can_manage_food_truck').eq('user_id',uid).maybeSingle();return !error&&data?.enabled&&(data.role==='super_admin'||data.can_manage_food_truck)}async function init(){const{data}=await db.auth.getSession();if(!data?.session?.user||!(await allowed(data.session.user.id))){location.href='./index.html';return}$('user').textContent=data.session.user.email||'';$('date').value=localDate();await query()}async function query(){const d=$('date').value;if(!d)return;$('msg').innerHTML='<div class="muted">查詢中…</div>';const{data,error}=await db.rpc('food_truck_sales_history',{p_date:d});if(error){$('msg').innerHTML='<div class="err">❌ '+esc(error.message)+'</div>';return}const rows=data||[];const first=rows[0];$('qty').textContent=Number(first?.total_qty||0)+' 盒';$('revenue').textContent='$'+Number(first?.total_revenue||0).toLocaleString();$('msg').innerHTML='<div class="muted">'+esc(d)+' 共 '+Number(first?.sale_count||0)+' 筆銷售</div>';$('list').innerHTML=rows.length?rows.map(r=>{const t=new Date(r.sold_at).toLocaleTimeString('zh-TW',{timeZone:'Asia/Taipei',hour:'2-digit',minute:'2-digit'});return '<div class="item"><div><b>'+esc(r.product_name||'—')+'</b><br><span>'+esc(r.flavor||'')+'｜'+t+'｜條碼 '+esc(r.barcode||'')+'</span></div><div style="text-align:right"><b>'+Number(r.quantity||0)+' 盒</b><br>$'+Number(r.total_amount||0).toLocaleString()+'</div></div>'}).join(''):'<div class="empty">這一天沒有銷售紀錄</div>'}document.addEventListener('DOMContentLoaded',()=>{$('query').addEventListener('click',query);init()});</script></body></html>
