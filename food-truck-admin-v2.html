<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>老爹・涼糕｜餐車後台</title><style>body{margin:0;background:#f7f2ec;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif}.wrap{max-width:900px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e7ddd2;border-radius:18px;padding:18px;margin:14px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#faf6f1;padding:14px;border-radius:14px}.stat b{display:block;font-size:25px}.btn{border:0;border-radius:11px;padding:12px 15px;background:#9b5c38;color:#fff;font-weight:800}.secondary{background:#eee7e0;color:#333}.field{margin:10px 0}.field label{display:block;font-weight:700;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #d9cdc1;border-radius:10px;box-sizing:border-box;font:inherit}.scan video{width:100%;max-width:520px;aspect-ratio:1.6;object-fit:cover;background:#222;border-radius:12px}.hidden{display:none}.item{border-top:1px solid #eee3d9;padding:13px 0;display:flex;justify-content:space-between;gap:10px}.small{font-size:13px;color:#766b63}.msg{padding:11px;border-radius:10px;margin-top:10px}.ok{background:#edf8f1;color:#286d46}.err{background:#fff0ef;color:#a32e29}.codebox{background:#fff;padding:18px;text-align:center}.barcode{max-width:100%;height:90px}.printbtn{margin-top:10px}@media(max-width:650px){.stats{grid-template-columns:1fr}.item{display:block}.item .btn{margin-top:8px}}@media print{body{background:#fff}.no-print{display:none!important}.print-area{display:block!important}}</style></head><body><div class="wrap"><section id="login" class="card"><h1>🍡 老爹・涼糕</h1><h2>餐車管理後台</h2><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>密碼</label><input id="password" type="password"></div><button class="btn" onclick="login()">登入</button><div id="loginMsg"></div></section><main id="app" class="hidden"><div class="card"><b>🍡 老爹・涼糕｜餐車後台</b><span id="who" class="small"></span><button class="btn secondary" style="float:right" onclick="logout()">登出</button></div><div class="stats"><div class="stat">今日售出<b id="qty">0</b>盒</div><div class="stat">今日營業額<b id="amount">$0</b></div><div class="stat">低庫存<b id="low">0</b></div></div><section class="card scan"><h2>📷 掃條碼扣庫存</h2><p class="small">直接用手機鏡頭掃描，不需要掃描器。掃描後先確認，再扣庫存。</p><video id="video" playsinline></video><p><button class="btn" onclick="startScan()">開始掃描</button> <button class="btn secondary" onclick="stopScan()">停止</button></p><div class="field"><label>手動輸入條碼</label><input id="barcode" placeholder="例如 LAO10001" onkeydown="if(event.key==='Enter')findProduct()"></div><button class="btn" onclick="findProduct()">查詢商品</button><div id="result"></div></section><section class="card"><h2>📦 商品／庫存</h2><button class="btn" onclick="newProduct()">＋新增商品</button><div id="products"></div></section><section class="card"><h2>🧾 今日銷售</h2><div id="sales"></div></section></main></div><div id="modal" class="hidden" style="position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:15px"><div class="card" style="width:100%;max-width:420px"><h2 id="mtitle">新增商品</h2><div class="field"><label>商品名稱</label><input id="pn"></div><div class="field"><label>🍡 口味</label><input id="pf" placeholder="例如 巧克力布丁、純杏仁、泰奶"></div><div class="field"><label>價格</label><input id="pp" type="number" min="0" value="100"></div><div class="field"><label>庫存</label><input id="ps" type="number" min="0" value="0"></div><div class="field"><label>🔢 條碼</label><input id="pb" placeholder="例如 LAO10001"><div class="small">可自行輸入條碼；留白則自動產生 LAO 條碼。</div></div><button class="btn" onclick="save()">儲存商品</button> <button class="btn secondary" onclick="closeModal()">取消</button><div id="mm"></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script><script>const sb=supabase.createClient('https://yemzdwxtyosuaczsqwea.supabase.co','sb_publishable_7b4hgNL68yiYbec7fXToYQ_UxPE4sEB'),$=x=>document.getElementById(x);let reader=null,controls=null,editing=null;const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const note=(id,t,c='msg')=>$(id).innerHTML='<div class="'+c+'">'+esc(t)+'</div>';async function login(){const{data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return note('loginMsg','登入失敗：'+error.message,'msg err');open(data.user)}async function open(u){const{data:p}=await sb.from('admin_profiles').select('role,enabled,can_manage_food_truck').eq('user_id',u.id).maybeSingle();if(!p||!p.enabled||!(p.role==='super_admin'||p.can_manage_food_truck)){await sb.auth.signOut();return note('loginMsg','此帳號沒有餐車後台權限。','msg err')}$('login').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=' · '+(u.email||'');load()}async function logout(){stopScan();await sb.auth.signOut();location.reload()}async function load(){const{data:p,error}=await sb.from('food_truck_products').select('*').eq('active',true).order('product_name');if(error)return note('products','讀取失敗：'+error.message,'msg err');$('low').textContent=p.filter(x=>x.stock<=5).length;$('products').innerHTML=p.map(x=>'<div class="item"><div><b>'+esc(x.product_name)+'</b><div class="small">🍡 '+esc(x.flavor||'未設定口味')+' · $'+x.price+' · 庫存 '+x.stock+' · 🔢 '+esc(x.barcode)+'</div></div><div><button class="btn secondary" onclick="showCode(\''+esc(x.barcode)+'\',\''+esc(x.product_name)+'\')">條碼／列印</button> <button class="btn secondary" onclick="restock('+x.id+',\''+esc(x.product_name)+'\','+x.stock+',\''+esc(x.flavor||'')+'\',\''+esc(x.barcode)+'\','+x.price+')">補貨</button></div></div>').join('')||'目前沒有商品。';const d=new Date();d.setHours(0,0,0,0);const{data:s}=await sb.from('food_truck_sales').select('*').gte('sold_at',d.toISOString()).order('sold_at',{ascending:false});$('qty').textContent=(s||[]).reduce((a,x)=>a+x.quantity,0);$('amount').textContent='$'+(s||[]).reduce((a,x)=>a+x.total_amount,0).toLocaleString();$('sales').innerHTML=(s||[]).map(x=>'<div class="item"><div><b>'+esc(x.product_name)+'</b><div class="small">'+x.quantity+' 盒 · $'+x.total_amount+' · '+new Date(x.sold_at).toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})+'</div></div></div>').join('')||'今天還沒有銷售。'}async function findProduct(code=$('barcode').value.trim()){if(!code)return;const{data}=await sb.from('food_truck_products').select('*').eq('barcode',code).eq('active',true).maybeSingle();if(!data)return note('result','找不到這個條碼。','msg err');$('result').innerHTML='<div class="msg"><h3>'+esc(data.product_name)+'</h3>🍡 口味：<b>'+esc(data.flavor||'未設定')+'</b><br>🔢 條碼：<b>'+esc(data.barcode)+'</b><br>售價 $'+data.price+'　目前庫存 <b>'+data.stock+'</b><div class="field"><label>銷售數量</label><input id="sq" type="number" min="1" max="'+data.stock+'" value="1"></div><button class="btn" '+(data.stock<1?'disabled':'')+' onclick="sale(\''+esc(data.barcode)+'\')">確認銷售並扣庫存</button></div>'}async function sale(code){const q=Math.max(1,Number($('sq').value||1));const{data,error}=await sb.rpc('food_truck_scan_sale',{p_barcode:code,p_quantity:q});if(error)return note('result',error.message,'msg err');const r=Array.isArray(data)?data[0]:data;note('result','完成：'+r.product_name+' × '+r.quantity+'，剩餘 '+r.remaining_stock+' 盒','msg ok');$('barcode').value='';load()}async function startScan(){if(reader)return;reader=new ZXingBrowser.BrowserMultiFormatReader();try{controls=await reader.decodeFromConstraints({video:{facingMode:{ideal:'environment'}}},$('video'),(r)=>{if(r){$('barcode').value=r.getText();findProduct(r.getText());stopScan()}})}catch(e){note('result','相機無法開啟，請允許瀏覽器使用相機。','msg err');reader=null}}function stopScan(){try{controls?.stop()}catch(e){}try{reader?.reset()}catch(e){}controls=null;reader=null}function newProduct(){editing=null;$('mtitle').textContent='新增商品';$('pn').value='';$('pf').value='';$('pp').value=100;$('ps').value=0;$('pb').value='';$('mm').innerHTML='';$('modal').style.display='flex'}function restock(id,name,stock,flavor,barcode,price){editing=id;$('mtitle').textContent='修改商品／庫存';$('pn').value=name;$('pf').value=flavor||'';$('pp').value=price??100;$('ps').value=stock;$('pb').value=barcode||'';$('mm').innerHTML='<div class="small">可修改口味、價格、條碼與庫存後儲存。</div>';$('modal').style.display='flex'}function closeModal(){$('modal').style.display='none'}async function save(){const n=$('pn').value.trim(),flavor=$('pf').value.trim(),price=Number($('pp').value),stock=Number($('ps').value),bc=$('pb').value.trim();if(!n||!flavor||price<0||!Number.isInteger(stock)||stock<0)return note('mm','請完整輸入商品名稱、口味、價格、庫存。','msg err');if(editing){if(!bc)return note('mm','條碼不能留白。','msg err');const{error}=await sb.from('food_truck_products').update({product_name:n,flavor,price,stock,barcode:bc,updated_at:new Date().toISOString()}).eq('id',editing);if(error)return note('mm',error.message,'msg err')}else{let code=bc;if(!code){const{data}=await sb.from('food_truck_products').select('barcode');const nums=(data||[]).map(x=>Number(String(x.barcode).replace('LAO',''))).filter(Number.isFinite);code='LAO'+(Math.max(10000,...nums)+1)}const{error}=await sb.from('food_truck_products').insert({product_name:n,flavor,price,stock,barcode:code,active:true});if(error)return note('mm',error.message,'msg err')}closeModal();load()}function showCode(code,name){const old=document.getElementById('codeModal');if(old)old.remove();const m=document.createElement('div');m.id='codeModal';m.style='position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:15px;z-index:99';m.innerHTML='<div class="card codebox" style="width:100%;max-width:430px"><h2>'+esc(name)+'</h2><svg id="barcodeSvg" class="barcode"></svg><div><b>'+esc(code)+'</b></div><p class="small">CODE 128 真實條碼，可用手機鏡頭掃描</p><button class="btn printbtn" onclick="printCode()">列印條碼</button> <button class="btn secondary printbtn" onclick="this.closest(\'#codeModal\').remove()">關閉</button></div>';document.body.appendChild(m);JsBarcode('#barcodeSvg',code,{format:'CODE128',displayValue:false,height:75,width:2,margin:8});window.printCode=()=>{const svg=document.getElementById('barcodeSvg');const win=window.open('','_blank','width=500,height=400');win.document.write('<html><head><title>條碼列印</title><style>body{text-align:center;font-family:Arial;padding:30px}.name{font-size:20px;font-weight:bold;margin-bottom:15px}svg{max-width:100%}</style></head><body><div class="name">'+esc(name)+'</div>'+svg.outerHTML+'<div>'+esc(code)+'</div><script>window.onload=()=>{window.print();window.onafterprint=()=>window.close()}<\/script></body></html>');win.document.close()}}(async()=>{const{data}=await sb.auth.getUser();if(data.user)open(data.user)})();</script></body></html>
